- rule_id: STIG-WN19-AC-000020
  rule_name: Windows Server 2019 must have the number of allowed bad logon attempts configured to three or less.
  rule_description: The account lockout feature, when enabled, prevents brute-force password attacks on the system. The higher
    this value is, the less effective the account lockout feature will be in protecting the local system. The number of bad
    logon attempts must be reasonably small to minimize the possibility of a successful password attack while allowing for
    honest errors made during normal user logon.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Verify the effective setting in Local Group Policy Editor.


