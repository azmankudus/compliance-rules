- rule_id: STIG-WN19-CC-000370
  rule_name: Windows Server 2019 Remote Desktop Services must require secure Remote Procedure Call (RPC) communications.
  rule_description: 'Allowing unsecure RPC communication exposes the system to man-in-the-middle attacks and data disclosure
    attacks. A man-in-the-middle attack occurs when an intruder captures packets between a client and server and modifies
    them before allowing the packets to be exchanged. Usually the attacker will modify the information in the packets in an
    attempt to cause either the client or server to reveal sensitive information.


    Satisfies: SRG-OS-000033-GPOS-00014, SRG-OS-000250-GPOS-00093'
