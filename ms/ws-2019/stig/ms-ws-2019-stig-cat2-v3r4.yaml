- rule_id: STIG-WN19-DC-000320
  rule_name: Windows Server 2019 domain controllers must require LDAP access signing.
  rule_description: 'Unsigned network traffic is susceptible to man-in-the-middle attacks, where an intruder captures packets
    between the server and the client and modifies them before forwarding them to the client. In the case of an LDAP server,
    this means that an attacker could cause a client to make decisions based on false records from the LDAP directory. The
    risk of an attacker pulling this off can be decreased by implementing strong physical security measures to protect the
    network infrastructure. Furthermore, implementing Internet Protocol security (IPsec) authentication header mode (AH),
    which performs mutual authentication and packet integrity for Internet Protocol (IP) traffic, can make all types of man-in-the-middle
    attacks extremely difficult.


    Satisfies: SRG-OS-000423-GPOS-00187, SRG-OS-000424-GPOS-00188'
  category: System Configuration
  subcategory: General
  testing_status: untested
