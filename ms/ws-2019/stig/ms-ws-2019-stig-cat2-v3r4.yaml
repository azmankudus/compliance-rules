- rule_id: STIG-WN19-00-000260
  rule_name: Windows Server 2019 must implement protection methods such as TLS, encrypted VPNs, or IPsec if the data owner
    has a strict requirement for ensuring data integrity and confidentiality is maintained at every step of the data transfer
    and handling process.
  rule_description: 'Information can be either unintentionally or maliciously disclosed or modified during preparation for
    transmission, for example, during aggregation, at protocol transformation points, and during packing/unpacking. These
    unauthorized disclosures or modifications compromise the confidentiality or integrity of the information.


