- rule_id: STIG-WN19-DC-000401
  rule_name: Windows Server 2019 must be configured for named-based strong mappings for certificates.
  rule_description: Weak mappings give rise to security vulnerabilities and demand hardening measures. Certificate names must
    be correctly mapped to the intended user account in Active Directory. A lack of strong name-based mappings allows certain
    weak certificate mappings, such as Issuer/Subject AltSecID and User Principal Names (UPN) mappings, to be treated as strong
    mappings.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'This applies to domain controllers. This is not applicable for member servers.


      Verify the effective setting in Local Group Policy Editor.


      Run "gpedit.msc".

      Or

      Using the registry, check HKLM\Software'
    check_command: Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System"
  remediation:
    remediation_step: Configure the policy value for Computer Configuration >> Administrative Template >> System >> KDC >>
      Allow name-based strong mappings for certificates to "Enabled".
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
