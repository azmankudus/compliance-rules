- rule_id: STIG-WN19-SO-000010
  rule_name: Windows Server 2019 must have the built-in guest account disabled.
  rule_description: A system faces an increased vulnerability threat if the built-in guest account is not disabled. This is
    a known account that exists on all Windows systems and cannot be deleted. This account is initialized during the installation
    of the operating system with no password assigned.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Verify the effective setting in Local Group Policy Editor.


      Run "gpedit.msc".


      Navigate to Local Computer Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies
      >>'
    check_command: Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System"
  remediation:
    remediation_step: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >> Local
      Policies >> Security Options >> "Accounts: Guest account status" to "Disabled".'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
  - stig
  - cat2
  - windows-server-2019
- rule_id: STIG-WN19-CC-000390
