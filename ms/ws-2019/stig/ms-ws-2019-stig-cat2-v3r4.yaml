- rule_id: STIG-WN19-00-000300
  rule_name: Windows Server 2019 must automatically remove or disable temporary user accounts after 72 hours.
  rule_description: 'If temporary user accounts remain active when no longer needed or for an excessive period, these accounts
    may be used to gain unauthorized access. To mitigate this risk, automated termination of all temporary accounts must be
    set upon account creation.


    Temporary accounts are established as part of normal account activation procedures when there is a need for short-term
    accounts without the demand for immediacy in account activation.


    If temporary accounts are used, the operating system must be configured to automatically terminate these types of accounts
    after a DoD-defined time period of 72 hours.


    To address access requirements, many operating systems may be integrated with enterprise-level authentication/access mechanisms
    that meet or exceed access control policy requirements.'
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Review temporary user accounts for expiration dates.


      Determine if temporary user accounts are used and identify any that exist. If none exist, this is NA.


      Domain Controllers:


      Open "PowerShell".


      En'
    check_command: Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System"
  remediation:
    remediation_step: 'Configure temporary user accounts to automatically expire within 72 hours.


      Domain accounts can be configured with an account expiration date, under "Account" properties.


      Local accounts can be config'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
  - stig
  - cat2
  - windows-server-2019
- rule_id: STIG-WN19-AU-000100
  rule_name: Windows Server 2019 must be configured to audit Account Management - Security Group Management successes.
  rule_description: 'Maintaining an audit trail of system activity logs can help identify configuration errors, troubleshoot
    service disruptions, and analyze compromises that have occurred, as well as detect attacks. Audit logs are necessary to
    provide a trail of evidence in case the system or network is compromised. Collecting this data is essential for analyzing
    the security of information assets and detecting signs of suspicious and unexpected behavior.


    Security Group Management records events such as creating, deleting, or changing security groups, including changes in
    group members.


    Satisfies: SRG-OS-000004-GPOS-00004, SRG-OS-000239-GPOS-00089, SRG-OS-000240-GPOS-00090, SRG-OS-000241-GPOS-00091, SRG-OS-000303-GPOS-00120,
    SRG-OS-000476-GPOS-00221'
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Security Option "Audit: Force audit policy subcategory settings (Windows Vista or later) to override
      audit policy category settings" must be set to "Enabled" (WN19-SO-000050) for the detailed auditing'
    check_command: Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System"
  remediation:
    remediation_step: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >> Advanced
      Audit Policy Configuration >> System Audit Policies >> Account Management >> "Audit Security '
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
  - stig
  - cat2
  - windows-server-2019
