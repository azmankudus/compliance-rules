- rule_id: STIG-WN19-SO-000370
  rule_name: Windows Server 2019 default permissions of global system objects must be strengthened.
  rule_description: Windows systems maintain a global list of shared system resources such as DOS device names, mutexes, and
    semaphores. Each type of object is created with a default Discretionary Access Control List (DACL) that specifies who
    can access the objects with what permissions. When this policy is enabled, the default DACL is stronger, allowing non-administrative
    users to read shared objects but not to modify shared objects they did not create.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "If the following registry value does not exist or is not configured as specified, this is a finding:\n\
      \nRegistry Hive: HKEY_LOCAL_MACHINE \nRegistry Path: \\SYSTEM\\CurrentControlSet\\Control\\Session Manage"
    check_command: Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System"
  remediation:
    remediation_step: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >> Local
      Policies >> Security Options >> "System objects: Strengthen default permissions of internal syst'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
