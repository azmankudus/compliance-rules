- rule_id: STIG-WN19-CC-000260
  rule_name: Windows Server 2019 Windows Update must not obtain updates from other PCs on the Internet.
  rule_description: Windows Update can obtain updates from additional sources instead of Microsoft. In addition to Microsoft,
    updates can be obtained from and sent to PCs on the local network as well as on the Internet. This is part of the Windows
    Update trusted process, however to minimize outside exposure, obtaining updates from or sending to systems on the Internet
    must be prevented.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'If the following registry value does not exist or is not configured as specified, this is a finding:


      Registry Hive: HKEY_LOCAL_MACHINE

      Registry Path: \SOFTWARE\Policies\Microsoft\Windows\DeliveryOpti'
    check_command: Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System"
  remediation:
    remediation_step: Configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components
      >> Delivery Optimization >> "Download Mode" to "Enabled" with any option except "Internet" selec
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
  - stig
  - cat3
  - windows-server-2019
- rule_id: STIG-WN19-CC-000320
  rule_name: Windows Server 2019 Turning off File Explorer heap termination on corruption must be disabled.
  rule_description: Legacy plug-in applications may continue to function when a File Explorer session has become corrupt.
    Disabling this feature will prevent this.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'The default behavior is for File Explorer heap termination on corruption to be enabled.


      If the registry Value Name below does not exist, this is not a finding.


      If it exists and is configured with a '
    check_command: Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System"
  remediation:
    remediation_step: 'The default behavior is for File Explorer heap termination on corruption to be disabled.


      If this needs to be corrected, configure the policy value for Computer Configuration >> Administrative Templat'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
