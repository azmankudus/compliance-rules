rules:
- rule_id: STIG-WN19-SO-000140
  rule_name: Windows Server 2019 title for legal banner dialog box must be configured with the appropriate text.
  rule_description: 'Failure to display the logon banner prior to a logon attempt will negate legal proceedings resulting
    from unauthorized access to system resources.


    Satisfies: SRG-OS-000023-GPOS-00006, SRG-OS-000228-GPOS-00088'
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "If the following registry value does not exist or is not configured as specified, this is a finding:\n\
      \nRegistry Hive: HKEY_LOCAL_MACHINE \nRegistry Path: \\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Polic"
    check_command: Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System"
  remediation:
    remediation_step: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >> Local
      Policies >> Security Options >> "Interactive Logon: Message title for users attempting to log on'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
  - stig
  - cat3
  - windows-server-2019
- rule_id: STIG-WN19-00-000180
  rule_name: Windows Server 2019 non-administrative accounts or groups must only have print permissions on printer shares.
  rule_description: Windows shares are a means by which files, folders, printers, and other resources can be published for
    network users to access. Improper configuration can permit access to devices and data beyond a user's need.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Open "Printers & scanners" in "Settings".


      If there are no printers configured, this is NA. (Exclude Microsoft Print to PDF and Microsoft XPS Document Writer,
      which do not support sharing.)


      For each '
    check_command: Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System"
  remediation:
    remediation_step: Configure the permissions on shared printers to restrict standard users to only have Print permissions.
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
  - stig
  - cat3
  - windows-server-2019
- rule_id: STIG-WN19-CC-000200
  rule_name: Windows Server 2019 Application Compatibility Program Inventory must be prevented from collecting data and sending
    the information to Microsoft.
  rule_description: 'Some features may communicate with the vendor, sending system information or downloading data or components
    for the feature. Turning off this capability will prevent potentially sensitive information from being sent outside the
    enterprise and will prevent uncontrolled updates to the system.


    This setting will prevent the Program Inventory from collecting data about a system and sending the information to Microsoft.'
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'If the following registry value does not exist or is not configured as specified, this is a finding:


      Registry Hive: HKEY_LOCAL_MACHINE

      Registry Path: \SOFTWARE\Policies\Microsoft\Windows\AppCompat\


      '
    check_command: Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System"
  remediation:
    remediation_step: Configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components
      >> Application Compatibility >> "Turn off Inventory Collector" to "Enabled".
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
  - stig
  - cat3
  - windows-server-2019
- rule_id: STIG-WN19-DC-000160
  rule_name: Windows Server 2019 directory service must be configured to terminate LDAP-based network connections to the directory
    server after five minutes of inactivity.
  rule_description: The failure to terminate inactive network connections increases the risk of a successful attack on the
    directory server. The longer an established session is in progress, the more time an attacker has to hijack the session,
    implement a means to passively intercept data, or compromise any protections on client access. For example, if an attacker
    gains control of a client computer, an existing (already authenticated) session with the directory server could allow
    access to the directory. The lack of confidentiality protection in LDAP-based sessions increases exposure to this vulnerability.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'This applies to domain controllers. It is NA for other systems.


      Open an elevated "Command Prompt" (run as administrator).


      Enter "ntdsutil".


      At the "ntdsutil:" prompt, enter "LDAP policies".


      At the'
    check_command: Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System"
  remediation:
    remediation_step: 'Configure the directory service to terminate LDAP-based network connections to the directory server
      after 5 minutes of inactivity.


      Open an elevated "Command prompt" (run as administrator).


      Enter "nt'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
  - stig
  - cat3
  - windows-server-2019
- rule_id: STIG-WN19-00-000440
  rule_name: The Windows Server 2019 time service must synchronize with an appropriate DOD time source.
  rule_description: The Windows Time Service controls time synchronization settings. Time synchronization is essential for
    authentication and auditing purposes. If the Windows Time Service is used, it must synchronize with a secure, authorized
    time source. Domain-joined systems are automatically configured to synchronize with domain controllers. If an NTP server
    is configured, it must synchronize with a secure, authorized time source.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Review the Windows time service configuration.


      Open an elevated "Command Prompt" (run as administrator).


      Enter "W32tm /query /configuration".


      Domain-joined systems (excluding the domain controller '
    check_command: Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System"
  remediation:
    remediation_step: 'Configure the system to synchronize time with an appropriate DOD time source.


      Domain-joined systems use NT5DS to synchronize time from other systems in the domain by default.


      If the system needs to '
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
  - stig
  - cat3
  - windows-server-2019
- rule_id: STIG-WN19-CC-000060
  rule_name: Windows Server 2019 must be configured to ignore NetBIOS name release requests except from WINS servers.
  rule_description: Configuring the system to ignore name release requests, except from WINS servers, prevents a denial of
    service (DoS) attack. The DoS consists of sending a NetBIOS name release request to the server for each entry in the server's
    cache, causing a response delay in the normal operation of the server's WINS resolution capability.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'If the following registry value does not exist or is not configured as specified, this is a finding:


      Registry Hive:  HKEY_LOCAL_MACHINE

      Registry Path:  \SYSTEM\CurrentControlSet\Services\Netbt\Parame'
    check_command: Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System"
  remediation:
    remediation_step: 'Configure the policy value for Computer Configuration >> Administrative Templates >> MSS (Legacy) >>
      "MSS: (NoNameReleaseOnDemand) Allow the computer to ignore NetBIOS name release requests except fro'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
  - stig
  - cat3
  - windows-server-2019
- rule_id: STIG-WN19-CC-000050
  rule_name: Windows Server 2019 must be configured to prevent Internet Control Message Protocol (ICMP) redirects from overriding
    Open Shortest Path First (OSPF)-generated routes.
  rule_description: Allowing ICMP redirect of routes can lead to traffic not being routed properly. When disabled, this forces
    ICMP to be routed via the shortest path first.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "If the following registry value does not exist or is not configured as specified, this is a finding:\n\
      \nRegistry Hive: HKEY_LOCAL_MACHINE \nRegistry Path: \\SYSTEM\\CurrentControlSet\\Services\\Tcpip\\Paramet"
    check_command: Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System"
  remediation:
    remediation_step: 'Configure the policy value for Computer Configuration >> Administrative Templates >> MSS (Legacy) >>
      "MSS: (EnableICMPRedirect) Allow ICMP redirects to override OSPF generated routes" to "Disabled".


      '
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
  - stig
  - cat3
  - windows-server-2019
- rule_id: STIG-WN19-00-000460
  rule_name: Windows Server 2019 systems must have Unified Extensible Firmware Interface (UEFI) firmware and be configured
    to run in UEFI mode, not Legacy BIOS.
  rule_description: UEFI provides additional security features in comparison to legacy BIOS firmware, including Secure Boot.
    UEFI is required to support additional security features in Windows, including Virtualization Based Security and Credential
    Guard. Systems with UEFI that are operating in "Legacy BIOS" mode will not support these security features.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: Some older systems may not have UEFI firmware. This is currently a CAT III; it will be raised in severity
      at a future date when broad support of Windows hardware and firmware requirements are expected
    check_command: Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System"
  remediation:
    remediation_step: Configure UEFI firmware to run in "UEFI" mode, not "Legacy BIOS" mode.
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
  - stig
  - cat3
  - windows-server-2019
- rule_id: STIG-WN19-00-000470
  rule_name: Windows Server 2019 must have Secure Boot enabled.
  rule_description: Secure Boot is a standard that ensures systems boot only to a trusted operating system. Secure Boot is
    required to support additional security features in Windows, including Virtualization Based Security and Credential Guard.
    If Secure Boot is turned off, these security features will not function.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: Some older systems may not have UEFI firmware. This is currently a CAT III; it will be raised in severity
      at a future date when broad support of Windows hardware and firmware requirements are expected
    check_command: Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System"
  remediation:
    remediation_step: Enable Secure Boot in the system firmware.
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
  - stig
  - cat3
  - windows-server-2019
