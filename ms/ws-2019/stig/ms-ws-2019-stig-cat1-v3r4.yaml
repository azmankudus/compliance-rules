rules:
- rule_id: STIG-WN19-DC-000290
  rule_name: Windows Server 2019 domain Controller PKI certificates must be issued by the DoD PKI or an approved External
    Certificate Authority (ECA).
  rule_description: A PKI implementation depends on the practices established by the Certificate Authority (CA) to ensure
    the implementation is secure. Without proper practices, the certificates issued by a CA have limited value in authentication
    functions. The use of multiple CAs from separate PKI implementations results in interoperability issues. If servers and
    clients do not have a common set of root CA certificates, they are not able to authenticate each other.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'This applies to domain controllers. It is NA for other systems.


      Run "MMC".


      Select "Add/Remove Snap-in" from the "File" menu.


      Select "Certificates" in the left pane and click the "Add >" button.


      Se'
    check_command: Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System"
  remediation:
    remediation_step: Obtain a server certificate for the domain controller issued by the DoD PKI or an approved ECA.
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: High
    false_positive_risk: Low
  tags:
  - stig
  - cat1
  - windows-server-2019
- rule_id: STIG-WN19-DC-000300
  rule_name: Windows Server 2019 PKI certificates associated with user accounts must be issued by a DoD PKI or an approved
    External Certificate Authority (ECA).
  rule_description: A PKI implementation depends on the practices established by the Certificate Authority (CA) to ensure
    the implementation is secure. Without proper practices, the certificates issued by a CA have limited value in authentication
    functions.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'This applies to domain controllers. It is NA for other systems.


      Review user account mappings to PKI certificates.


      Open "Windows PowerShell".


      Enter "Get-ADUser -Filter * | FT Name, UserPrincipalName'
    check_command: Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System"
  remediation:
    remediation_step: Map user accounts to PKI certificates using the appropriate User Principal Name (UPN) for the network.
      See PKE documentation for details.
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: High
    false_positive_risk: Low
  tags:
  - stig
  - cat1
  - windows-server-2019
- rule_id: STIG-WN19-AC-000090
  rule_name: Windows Server 2019 reversible password encryption must be disabled.
  rule_description: Storing passwords using reversible encryption is essentially the same as storing clear-text versions of
    the passwords, which are easily compromised. For this reason, this policy must never be enabled.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Verify the effective setting in Local Group Policy Editor.


      Run "gpedit.msc".


      Navigate to Local Computer Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Account Policies '
    check_command: Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System"
  remediation:
    remediation_step: Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >> Account
      Policies >> Password Policy >> "Store passwords using reversible encryption" to "Disabled".
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: High
    false_positive_risk: Low
  tags:
  - stig
  - cat1
  - windows-server-2019
- rule_id: STIG-WN19-SO-000300
  rule_name: Windows Server 2019 must be configured to prevent the storage of the LAN Manager hash of passwords.
  rule_description: The LAN Manager hash uses a weak encryption algorithm and there are several tools available that use this
    hash to retrieve account passwords. This setting controls whether a LAN Manager hash of the password is stored in the
    SAM the next time the password is changed.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "If the following registry value does not exist or is not configured as specified, this is a finding:\n\
      \nRegistry Hive: HKEY_LOCAL_MACHINE \nRegistry Path: \\SYSTEM\\CurrentControlSet\\Control\\Lsa\\\n\nValue Na"
    check_command: Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System"
  remediation:
    remediation_step: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >> Local
      Policies >> Security Options >> "Network security: Do not store LAN Manager hash value on next p'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: High
    false_positive_risk: Low
  tags:
  - stig
  - cat1
  - windows-server-2019
- rule_id: STIG-WN19-00-000130
  rule_name: Windows Server 2019 local volumes must use a format that supports NTFS attributes.
  rule_description: The ability to set access permissions and auditing is critical to maintaining the security and proper
    access controls of a system. To support this, volumes must be formatted using a file system that supports NTFS attributes.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Open "Computer Management".


      Select "Disk Management" under "Storage".


      For each local volume, if the file system does not indicate "NTFS", this is a finding.


      Resilient file system (ReFS) and Cluster'
    check_command: Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System"
  remediation:
    remediation_step: Format volumes to use NTFS, ReFS, or CSV.
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: High
    false_positive_risk: Low
  tags:
  - stig
  - cat1
  - windows-server-2019
