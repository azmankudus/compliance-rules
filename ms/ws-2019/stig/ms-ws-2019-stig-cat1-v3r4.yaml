- rule_id: STIG-WN19-00-000250
  rule_name: Windows Server 2019 systems requiring data at rest protections must employ cryptographic mechanisms to prevent
    unauthorized disclosure and modification of the information at rest.
  rule_description: 'This requirement addresses protection of user-generated data as well as operating system-specific configuration
    data. Organizations may choose to employ different mechanisms to achieve confidentiality and integrity protections, as
    appropriate, in accordance with the security category and/or classification of the information.


    Selection of a cryptographic mechanism is based on the need to protect the integrity of organizational information. The
    strength of the mechanism is commensurate with the security category and/or classification of the information. Organizations
    have the flexibility to either encrypt all information on storage devices (i.e., full disk encryption) or encrypt specific
    data structures (e.g., files, records, or fields).


    Satisfies: SRG-OS-000185-GPOS-00079, SRG-OS-000404-GPOS-00183, SRG-OS-000405-GPOS-00184'
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: Verify systems that require additional protections due to factors such as inadequate physical protection
      or sensitivity of the data employ encryption to protect the confidentiality and integrity of al
    check_command: Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System"
  remediation:
    remediation_step: Configure systems that require additional protections due to factors such as inadequate physical protection
      or sensitivity of the data to employ encryption to protect the confidentiality and integrity
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: High
    false_positive_risk: Low
  tags:
  - stig
  - cat1
  - windows-server-2019
- rule_id: STIG-WN19-DC-000010
  rule_name: Windows Server 2019 must only allow administrators responsible for the domain controller to have Administrator
    rights on the system.
  rule_description: "An account that does not have Administrator duties must not have Administrator rights. Such rights would\
    \ allow the account to bypass or modify required security restrictions on that machine and make it vulnerable to attack.\n\
    \nSystem administrators must log on to systems using only accounts with the minimum level of authority necessary. \n\n\
    Standard user accounts must not be members of the built-in Administrators group."
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'This applies to domain controllers. A separate version applies to other systems.


      Review the Administrators group. Only the appropriate administrator groups or accounts responsible for administration '
    check_command: Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System"
  remediation:
    remediation_step: 'Configure the Administrators group to include only administrator groups or accounts that are responsible
      for the system.


      Remove any standard user accounts.'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: High
    false_positive_risk: Low
  tags:
  - stig
  - cat1
  - windows-server-2019
- rule_id: STIG-WN19-DC-000070
  rule_name: Windows Server 2019 permissions on the Active Directory data files must only allow System and Administrators
    access.
  rule_description: Improper access permissions for directory data-related files could allow unauthorized users to read, modify,
    or delete directory data or audit trails.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'This applies to domain controllers. It is NA for other systems.


      Run "Regedit".


      Navigate to "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\NTDS\Parameters".


      Note the directory locations in th'
    check_command: Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System"
  remediation:
    remediation_step: 'Maintain the permissions on NTDS database and log files as follows:


      NT AUTHORITY\SYSTEM:(I)(F)

      BUILTIN\Administrators:(I)(F)


      (I) - permission inherited from parent container

      (F) - full access'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: High
    false_positive_risk: Low
  tags:
  - stig
  - cat1
  - windows-server-2019
- rule_id: STIG-WN19-DC-000080
  rule_name: Windows Server 2019 Active Directory SYSVOL directory must have the proper access control permissions.
  rule_description: 'Improper access permissions for directory data files could allow unauthorized users to read, modify,
    or delete directory data.


    The SYSVOL directory contains public files (to the domain) such as policies and logon scripts. Data in shared subdirectories
    are replicated to all domain controllers in a domain.'
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'This applies to domain controllers. It is NA for other systems.


      Open a command prompt.


      Run "net share".


      Make note of the directory location of the SYSVOL share.


      By default, this will be \Windows\S'
    check_command: Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System"
  remediation:
    remediation_step: 'Maintain the permissions on the SYSVOL directory. Do not allow greater than "Read & execute" permissions
      for standard user accounts or groups. The defaults below meet this requirement:


      C:\Windows\SYS'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: High
    false_positive_risk: Low
  tags:
  - stig
  - cat1
  - windows-server-2019
- rule_id: STIG-WN19-DC-000090
  rule_name: Windows Server 2019 Active Directory Group Policy objects must have proper access control permissions.
  rule_description: 'When directory service database objects do not have appropriate access control permissions, it may be
    possible for malicious users to create, read, update, or delete the objects and degrade or destroy the integrity of the
    data. When the directory service is used for identification, authentication, or authorization functions, a compromise
    of the database objects could lead to a compromise of all systems relying on the directory service.


    For Active Directory (AD), the Group Policy objects require special attention. In a distributed administration model (i.e.,
    help desk), Group Policy objects are more likely to have access permissions changed from the secure defaults. If inappropriate
    access permissions are defined for Group Policy objects, this could allow an intruder to change the security policy applied
    to all domain client computers (workstations and servers).'
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'This applies to domain controllers. It is NA for other systems.


      Review the permissions on Group Policy objects.


      Open "Group Policy Management" (available from various menus or run "gpmc.msc").


      Navi'
    check_command: Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System"
  remediation:
    remediation_step: 'Maintain the permissions on Group Policy objects to not allow greater than "Read" and "Apply group
      policy" for standard user accounts or groups. The default permissions below meet this requirement:


      A'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: High
    false_positive_risk: Low
  tags:
  - stig
  - cat1
  - windows-server-2019
- rule_id: STIG-WN19-DC-000100
  rule_name: Windows Server 2019 Active Directory Domain Controllers Organizational Unit (OU) object must have the proper
    access control permissions.
  rule_description: 'When Active Directory objects do not have appropriate access control permissions, it may be possible
    for malicious users to create, read, update, or delete the objects and degrade or destroy the integrity of the data. When
    the directory service is used for identification, authentication, or authorization functions, a compromise of the database
    objects could lead to a compromise of all systems that rely on the directory service.


    The Domain Controllers OU object requires special attention as the Domain Controllers are central to the configuration
    and management of the domain. Inappropriate access permissions defined for the Domain Controllers OU could allow an intruder
    or unauthorized personnel to make changes that could lead to the compromise of the domain.'
