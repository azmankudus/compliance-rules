- rule_id: STIG-WN19-MS-000010
  rule_name: Windows Server 2019 must only allow Administrators responsible for the member server or standalone or nondomain-joined
    system to have Administrator rights on the system.
  rule_description: 'An account that does not have Administrator duties must not have Administrator rights. Such rights would
    allow the account to bypass or modify required security restrictions on that machine and make it vulnerable to attack.


    System administrators must log on to systems using only accounts with the minimum level of authority necessary.


    For domain-joined member servers, the Domain Admins group must be replaced by a domain member server administrator group
    (refer to AD.0003 in the Active Directory Domain STIG). Restricting highly privileged accounts from the local Administrators
    group helps mitigate the risk of privilege escalation resulting from credential theft attacks.


    Standard user accounts must not be members of the built-in Administrators group.'
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'This applies to member servers and standalone or nondomain-joined systems. A separate version applies
      to domain controllers.


      Open "Computer Management".


      Navigate to "Groups" under "Local Users and G'
    check_command: Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System"
  remediation:
    remediation_step: 'Configure the local "Administrators" group to include only administrator groups or accounts responsible
      for administration of the system.


      For domain-joined member servers, replace the Domain Admins g'
    rollback_supported: true
    reboot_required: false
    service_impact: None
