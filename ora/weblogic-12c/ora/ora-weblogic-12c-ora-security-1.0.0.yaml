  - rule_id: OWLS-028
    rule_name: Configure Work Manager Security
    rule_description: |
      Work Manager configuration must include appropriate security constraints
      to prevent resource exhaustion attacks.
    category: Resource Management
    subcategory: Work Manager
    assessment:
      severity: Medium
      is_auto: true
      automation_level: Full
      audit_type: config
      detection_step: |
        1. Log in to WebLogic Server Administration Console
        2. Navigate to Deployments > [Application] > Configuration > Work Manager
        3. Review Work Manager configuration
      check_command: |
        # Using WLST
        connect('admin_user', 'admin_password', 't3://localhost:7001')
        cd('SelfTuning/')
        for wm in cmo.getWorkManagers():
            print('Work Manager:', wm.getName())
    remediation:
      remediation_step: |
        1. Log in to WebLogic Server Administration Console
        2. Navigate to Environment > Work Managers
        3. Configure Work Manager constraints:
           - Maximum threads constraint
           - Capacity constraint
           - Minimum threads constraint
           - Request class (fair share or response time goal)
        4. Configure stuck thread detection
        5. Click Save and restart
      rollback_supported: true
      reboot_required: false
      service_impact: None
      estimated_time: "15 minutes"
    context:
      rationale: |
        Work Manager constraints prevent resource exhaustion by limiting
        thread usage and detecting stuck threads.
      impact: |
        Without proper constraints, applications can exhaust server resources
        leading to denial of service.
      false_positive_risk: Low
      references:
        - type: Oracle Documentation
          reference: "Oracle WebLogic Server Security Guide - Work Manager Configuration"
    tags:
      - resource-management
      - dos-prevention
      - work-manager

  - rule_id: OWLS-029
    rule_name: Configure JDBC Security
    rule_description: |
      JDBC data sources must be configured with encrypted passwords and
      appropriate connection security settings.
    category: Database Security
    subcategory: JDBC Configuration
    assessment:
      severity: High
      is_auto: true
      automation_level: Full
      audit_type: config
      detection_step: |
        1. Log in to WebLogic Server Administration Console
        2. Navigate to Services > Data Sources
        3. Review JDBC data source configuration
      check_command: |
        # Using WLST
        connect('admin_user', 'admin_password', 't3://localhost:7001')
        cd('JDBCSystemResources')
        for ds in cmo.getJDBCSystemResources():
            print('Data Source:', ds.getName())
            cd('JDBCSystemResource/' + ds.getName() + '/JdbcResource/' + ds.getName() + '/JDBCDriverParams/' + ds.getName())
            print('  Password Encrypted:', cmo.isPasswordEncrypted())
    remediation:
      remediation_step: |
        1. Log in to WebLogic Server Administration Console
        2. Navigate to Services > Data Sources > [Data Source] > Connection Pool
        3. Configure:
           - Ensure password is encrypted
           - Use SSL for database connections if supported
           - Configure connection timeout settings
           - Set appropriate max connections
        4. Navigate to Security > Credential Mapping
        5. Configure credential mapping for database authentication
        6. Click Save and restart data source
      rollback_supported: true
      reboot_required: false
      service_impact: Data source restart required
      estimated_time: "15 minutes"
    context:
      rationale: |
        JDBC configuration with encrypted passwords prevents credential exposure
        and secure database connections protect data in transit.
      impact: |
        Exposed database credentials can lead to unauthorized database access
        and data breach.
      false_positive_risk: Low
      references:
        - type: Oracle Documentation
          reference: "Oracle WebLogic Server Security Guide - JDBC Security"
    tags:
      - jdbc
      - database
      - credentials

  - rule_id: OWLS-030
    rule_name: Configure JMS Security
    rule_description: |
