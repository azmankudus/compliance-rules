      - transactions
      - timeout

  - rule_id: OWLS-032
    rule_name: Configure Application Deployment Security
    rule_description: |
      Application deployment must be secured with proper validation and
      security constraints in deployment descriptors.
    category: Application Security
    subcategory: Deployment Security
    assessment:
      severity: High
      is_auto: true
      automation_level: Partial
      audit_type: config
      detection_step: |
        1. Log in to WebLogic Server Administration Console
        2. Navigate to Deployments
        3. Review application security configuration
      check_command: |
        # Check deployment descriptors
        find $DOMAIN_HOME/applications -name "web.xml" -exec grep -l "security-constraint\|security-role" {} \;
        find $DOMAIN_HOME/applications -name "weblogic.xml" -exec grep -l "security-role-assignment" {} \;
    remediation:
      remediation_step: |
        1. Review application deployment descriptors
        2. Ensure web.xml includes:
           - security-constraint elements
           - security-role definitions
           - login-config for authentication
           - transport-guarantee for SSL
        3. Ensure weblogic.xml includes:
           - security-role-assignment
           - Prefer-web-inf-classes for classloading
        4. Enable deployment validation
        5. Redeploy applications
      rollback_supported: true
      reboot_required: false
      service_impact: Application redeployment required
      estimated_time: "30 minutes"
    context:
      rationale: |
        Proper deployment security ensures that applications are protected
        from unauthorized access and that security constraints are enforced.
      impact: |
        Unsecured deployments can expose application functionality to
        unauthorized users.
      false_positive_risk: Low
      references:
        - type: Oracle Documentation
          reference: "Oracle WebLogic Server Security Guide - Application Security"
    tags:
      - deployment
      - application-security
      - descriptors

  - rule_id: OWLS-033
    rule_name: Configure Web Service Security
    rule_description: |
      Web services must be configured with WS-Security to ensure message-level
      security including encryption, signing, and authentication.
    category: Web Services
    subcategory: WS-Security
    assessment:
      severity: High
      is_auto: true
      automation_level: Partial
      audit_type: config
      detection_step: |
        1. Log in to WebLogic Server Administration Console
        2. Navigate to Web Services
        3. Review WS-Security configuration
      check_command: |
        # Check for WS-Security policies
        find $DOMAIN_HOME/applications -name "*.xml" -exec grep -l "ws-security\|WSSecurity" {} \;
    remediation:
      remediation_step: |
        1. Configure WS-Security in weblogic-webservices.xml:
           - Enable message encryption
           - Enable message signing
           - Configure timestamp validation
           - Configure authentication tokens
        2. Configure WS-Policy for services:
           - Require encryption
           - Require signatures
           - Configure token requirements
        3. Configure keystores for WS-Security
        4. Redeploy web services
      rollback_supported: true
      reboot_required: false
      service_impact: Application redeployment required
      estimated_time: "30 minutes"
    context:
      rationale: |
        WS-Security provides end-to-end message-level security including
        confidentiality, integrity, and authentication.
      impact: |
        Unsecured web services can expose sensitive data and allow
        unauthorized access.
      false_positive_risk: Low
      references:
        - type: Oracle Documentation
          reference: "Oracle WebLogic Server Security Guide - Web Service Security"
    tags:
      - web-services
      - ws-security
      - soap

  - rule_id: OWLS-034
    rule_name: Configure RESTful Service Security
    rule_description: |
      RESTful services must be secured with appropriate authentication,
      authorization, and transport security.
    category: Web Services
    subcategory: REST Security
    assessment:
      severity: High
      is_auto: true
      automation_level: Partial
      audit_type: config
      detection_step: |
        1. Review REST service configuration
        2. Check for authentication and authorization
      check_command: |
        # Check for REST security configuration
        find $DOMAIN_HOME/applications -name "web.xml" -exec grep -l "security-constraint" {} \;
        grep -r "@RolesAllowed\|@DeclareRoles" $DOMAIN_HOME/applications/
    remediation:
      remediation_step: |
        1. Configure security in web.xml for REST endpoints:
           <security-constraint>
             <web-resource-collection>
               <url-pattern>/api/*</url-pattern>
               <http-method>GET</http-method>
               <http-method>POST</http-method>
             </web-resource-collection>
             <auth-constraint>
               <role-name>AuthenticatedUser</role-name>
             </auth-constraint>
             <user-data-constraint>
               <transport-guarantee>CONFIDENTIAL</transport-guarantee>
             </user-data-constraint>
           </security-constraint>
        2. Use annotations in JAX-RS:
           @RolesAllowed("admin")
           @Produces(MediaType.APPLICATION_JSON)
        3. Configure OAuth 2.0 or JWT if needed
        4. Enable HTTPS for all REST endpoints
      rollback_supported: true
      reboot_required: false
      service_impact: Application redeployment required
      estimated_time: "20 minutes"
    context:
      rationale: |
        Securing REST services prevents unauthorized access to API endpoints
        and protects sensitive data.
      impact: |
        Unsecured REST APIs can expose sensitive data and functionality to
        unauthorized users.
      false_positive_risk: Low
      references:
        - type: Oracle Documentation
          reference: "Oracle WebLogic Server Security Guide - REST Security"
    tags:
      - rest
      - api-security
      - authentication

  - rule_id: OWLS-035
    rule_name: Configure Cluster Security
    rule_description: |
      WebLogic clusters must be configured with secure communication channels
      between cluster members.
    category: Cluster Security
    subcategory: Cluster Communication
    assessment:
      severity: High
      is_auto: true
      automation_level: Full
      audit_type: config
      detection_step: |
        1. Log in to WebLogic Server Administration Console
        2. Navigate to Environment > Clusters
        3. Review cluster security configuration
      check_command: |
        # Using WLST
        connect('admin_user', 'admin_password', 't3://localhost:7001')
        cd('Clusters')
        for cluster in cmo.getClusters():
            print('Cluster:', cluster.getName())
            print('  Cluster Address:', cluster.getClusterAddress())
            print('  Multicast Address:', cluster.getMulticastAddress())
    remediation:
      remediation_step: |
        1. Log in to WebLogic Server Administration Console
        2. Navigate to Environment > Clusters > [Cluster Name] > Configuration > Replication
        3. Configure secure replication
        4. Navigate to Environment > Clusters > [Cluster Name] > Configuration > General
        5. Enable cluster-wide security:
           - Configure secure multicast if used
           - Configure unicast with SSL
           - Set cluster password
        6. Click Save and restart cluster
      rollback_supported: true
      reboot_required: true
      service_impact: Cluster restart required
      estimated_time: "20 minutes"
    context:
      rationale: |
        Secure cluster communication prevents interception of session data
        and cluster messages.
      impact: |
        Unsecured cluster communication can expose session data and allow
        unauthorized cluster nodes to join.
      false_positive_risk: Low
      references:
        - type: Oracle Documentation
          reference: "Oracle WebLogic Server Security Guide - Cluster Security"
    tags:
      - cluster
      - replication
      - multicast

  - rule_id: OWLS-036
    rule_name: Configure Node Manager Security
    rule_description: |
      Node Manager must be configured with SSL and proper authentication
      to secure remote server management.
    category: Management
    subcategory: Node Manager
    assessment:
      severity: Critical
      is_auto: true
      automation_level: Full
      audit_type: config
      detection_step: |
        1. Check nodemanager.properties configuration
        2. Verify SSL and authentication settings
      check_command: |
        # Check Node Manager configuration
        cat $WL_HOME/common/nodemanager/nodemanager.properties | grep -i "secure\|ssl\|auth"
    remediation:
      remediation_step: |
        1. Edit $WL_HOME/common/nodemanager/nodemanager.properties
        2. Configure:
           SecureListener=true
           ListenPort=5556
           WebLogic.StartScriptName=startWebLogic.sh
           KeyFile=identity.jks
           KeyFilePassword=encrypted_password
           TrustKeyFile=trust.jks
           TrustKeyFilePassword=encrypted_password
           CustomIdentityAlias=alias
           CustomIdentityPrivateKeyPassPhrase=encrypted_password
        3. Configure domain username/password
        4. Restart Node Manager
      rollback_supported: true
      reboot_required: true
      service_impact: Node Manager restart required
      estimated_time: "20 minutes"
    context:
      rationale: |
        Secure Node Manager configuration prevents unauthorized remote server
        management and protects administrative credentials.
      impact: |
        Compromised Node Manager can allow unauthorized control of WebLogic
        servers.
      false_positive_risk: Low
      references:
        - type: Oracle Documentation
          reference: "Oracle WebLogic Server Security Guide - Node Manager Security"
    tags:
      - node-manager
      - management
      - ssl

  - rule_id: OWLS-037
    rule_name: Configure Coherence Security
    rule_description: |
      Oracle Coherence clusters must be secured with authentication and
      encryption for cluster communication.
    category: Coherence Security
    subcategory: Cluster Communication
    assessment:
      severity: High
      is_auto: true
      automation_level: Full
      audit_type: config
      detection_step: |
        1. Check Coherence configuration
        2. Verify security settings
      check_command: |
        # Check for Coherence security configuration
        find $DOMAIN_HOME -name "tangosol-coherence-override.xml" -exec cat {} \;
        grep -r "security\|identity\|trust" $DOMAIN_HOME/config/coherence/
    remediation:
      remediation_step: |
        1. Configure Coherence security in tangosol-coherence-override.xml:
           <security-config>
             <enabled>true</enabled>
             <identity-assessor>
               <class-name>com.oracle.coherence.security.IdentityAssessor</class-name>
             </identity-assessor>
             <identity-transformer>
               <class-name>com.oracle.coherence.security.IdentityTransformer</class-name>
             </identity-transformer>
           </security-config>
        2. Configure SSL for Coherence:
           <ssl>
             <enabled>true</enabled>
             <protocol>TLS</protocol>
             <identity-manager>
               <algorithm>SunX509</algorithm>
               <provider>SunJSSE</provider>
             </identity-manager>
           </ssl>
        3. Restart Coherence cluster
      rollback_supported: true
      reboot_required: true
      service_impact: Cluster restart required
      estimated_time: "30 minutes"
    context:
      rationale: |
        Secured Coherence clusters prevent unauthorized access to cached data
        and protect data in transit.
      impact: |
        Unsecured Coherence can expose cached data to unauthorized access.
      false_positive_risk: Low
      references:
        - type: Oracle Documentation
          reference: "Oracle WebLogic Server Security Guide - Coherence Security"
    tags:
      - coherence
      - caching
      - encryption

