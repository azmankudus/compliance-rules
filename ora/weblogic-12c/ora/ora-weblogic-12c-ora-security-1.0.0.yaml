  - rule_id: OWLS-031
    rule_name: Configure JTA Security
    rule_description: |
      Java Transaction API (JTA) must be configured securely with appropriate
      timeout values and security constraints.
    category: Transaction Security
    subcategory: JTA Configuration
    assessment:
      severity: Medium
      is_auto: true
      automation_level: Full
      audit_type: config
      detection_step: |
        1. Log in to WebLogic Server Administration Console
        2. Navigate to Services > JTA
        3. Review JTA configuration
      check_command: |
        # Using WLST
        connect('admin_user', 'admin_password', 't3://localhost:7001')
        cd('JTAs')
        print('JTA Timeout:', cmo.getTimeoutSeconds())
        print('Checkpoint Interval:', cmo.getCheckpointIntervalSeconds())
    remediation:
      remediation_step: |
        1. Log in to WebLogic Server Administration Console
        2. Navigate to Services > JTA
        3. Configure:
           - Set appropriate transaction timeout (not too long)
           - Configure checkpoint interval
           - Enable forget heuristic transactions
           - Configure security for distributed transactions
        4. Click Save
      rollback_supported: true
      reboot_required: false
      service_impact: None
      estimated_time: "10 minutes"
    context:
      rationale: |
        Proper JTA configuration prevents long-running transactions from
        consuming resources and ensures transaction integrity.
      impact: |
        Improper JTA configuration can lead to resource exhaustion or
        transaction integrity issues.
