    remediation:
      remediation_step: |
        1. Log in to WebLogic Remote Console
        2. Navigate to Services > Messaging > JMS Modules
        3. For each JMS resource:
           - Configure security policies
           - Restrict send/receive permissions
           - Enable SSL for JMS connections
        4. Configure JMS resource policies in Security Realms
        5. Click Save
      rollback_supported: true
      reboot_required: false
      service_impact: None
      estimated_time: "20 minutes"
