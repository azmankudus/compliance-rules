      - messaging
      - authorization

  - rule_id: OWLS15-023
    rule_name: Configure Secure Cluster Communication
    rule_description: |
      WebLogic clusters must be configured with secure communication channels
      between cluster members using SSL.
    category: Cluster Security
    subcategory: Cluster Communication
    assessment:
      severity: High
      is_auto: true
      automation_level: Full
      audit_type: config
      detection_step: |
        1. Log in to WebLogic Remote Console
        2. Navigate to Environment > Clusters
        3. Review cluster security configuration
      check_command: |
        # Using WLST
        connect('admin_user', 'admin_password', 't3://localhost:7001')
        cd('Clusters')
        for cluster in cmo.getClusters():
            print('Cluster:', cluster.getName())
    remediation:
      remediation_step: |
        1. Log in to WebLogic Remote Console
        2. Navigate to Environment > Clusters > [Cluster Name] > Configuration
        3. Enable cluster-wide security:
           - Configure cluster SSL
           - Set cluster password
           - Prefer unicast over multicast for security
           - Enable secure replication
        4. Configure inter-server communication to use SSL
        5. Click Save and restart cluster
      rollback_supported: true
      reboot_required: true
      service_impact: Cluster restart required
      estimated_time: "20 minutes"
    context:
      rationale: |
        Secure cluster communication prevents interception of session data
        and cluster messages, and prevents unauthorized nodes from joining.
      impact: |
        Unsecured cluster communication can expose session data and allow
        unauthorized cluster nodes to join.
      false_positive_risk: Low
      references:
        - type: Oracle Documentation
          reference: "Oracle WebLogic Server 15c Security Guide - Cluster Security"
    tags:
      - cluster
      - replication
      - ssl

  - rule_id: OWLS15-024
    rule_name: Configure REST API Security
    rule_description: |
      RESTful services must be secured with appropriate authentication,
      authorization, rate limiting, and transport security.
    category: Web Services
    subcategory: REST Security
    assessment:
      severity: High
      is_auto: true
      automation_level: Partial
      audit_type: config
      detection_step: |
        1. Review REST service configuration
        2. Check for authentication and authorization
        3. Verify HTTPS is enforced
      check_command: |
        # Check for REST security configuration
        find $DOMAIN_HOME/applications -name "web.xml" -exec grep -l "security-constraint" {} \;
    remediation:
      remediation_step: |
        1. Configure security in web.xml for REST endpoints:
           <security-constraint>
             <web-resource-collection>
               <url-pattern>/api/*</url-pattern>
             </web-resource-collection>
             <auth-constraint>
               <role-name>AuthenticatedUser</role-name>
             </auth-constraint>
             <user-data-constraint>
               <transport-guarantee>CONFIDENTIAL</transport-guarantee>
             </user-data-constraint>
           </security-constraint>
        2. Use Jakarta EE security annotations
        3. Configure OAuth 2.0 or JWT for authentication
        4. Implement rate limiting
        5. Enable request validation
      rollback_supported: true
      reboot_required: false
      service_impact: Application redeployment required
      estimated_time: "30 minutes"
    context:
      rationale: |
        Securing REST services prevents unauthorized access to API endpoints
        and protects sensitive data from abuse.
      impact: |
        Unsecured REST APIs can expose sensitive data and functionality.
      false_positive_risk: Low
      references:
        - type: Oracle Documentation
          reference: "Oracle WebLogic Server 15c Security Guide - REST Security"
    tags:
      - rest
      - api-security
      - authentication

  - rule_id: OWLS15-025
    rule_name: Configure SAML 2.0 Security
    rule_description: |
      SAML 2.0 single sign-on must be configured with proper signature validation,
      encryption, and assertion security settings. SAML 1.1 is deprecated.
    category: Authentication
    subcategory: SAML Configuration
    assessment:
      severity: High
      is_auto: true
      automation_level: Full
      audit_type: config
      detection_step: |
        1. Log in to WebLogic Remote Console
        2. Navigate to Security Realms > myrealm > Providers > Authentication
        3. Check SAML 2.0 provider configuration
      check_command: |
        # Using WLST
        connect('admin_user', 'admin_password', 't3://localhost:7001')
        cd('SecurityConfiguration/' + cmo.getName() + '/DefaultRealm/AuthenticationProviders')
    remediation:
      remediation_step: |
        1. Log in to WebLogic Remote Console
        2. Navigate to Security Realms > myrealm > Providers > Authentication
        3. Configure SAML 2.0 Identity Assertion Provider:
           - Enable signature validation
           - Configure trusted signing certificates
           - Set assertion lifetime (e.g., 5 minutes)
           - Enable assertion encryption
           - Configure replay attack prevention
        4. Configure SAML 2.0 Credential Mapping Provider:
           - Configure signing key
           - Set appropriate assertion attributes
        5. Remove SAML 1.1 providers if present
        6. Click Save
      rollback_supported: true
      reboot_required: false
      service_impact: None
      estimated_time: "30 minutes"
    context:
      rationale: |
        SAML 2.0 is the current standard for single sign-on. SAML 1.1 is deprecated
        and should not be used.
      impact: |
        Compromised SAML configuration can lead to authentication bypass and
        unauthorized access.
      false_positive_risk: Low
      references:
        - type: Oracle Documentation
          reference: "Oracle WebLogic Server 15c Security Guide - SAML Security"
    tags:
      - saml
      - sso
      - authentication

  - rule_id: OWLS15-026
