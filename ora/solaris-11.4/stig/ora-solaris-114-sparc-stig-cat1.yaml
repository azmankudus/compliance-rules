- rule_id: SV-219968r958752
  rule_name: The operating system must configure auditing to reduce the likelihood of storage capacity being exceeded.
  rule_description: Overflowing the audit storage area can result in a denial of service or system outage.
  category: Security
  subcategory: '219968'
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "The Audit Configuration profile is required.\n\nThis check applies to the global zone only. Determine the zone that you are currently securing.\n\n# zonename\n\nIf the command output is \"global\", this check applies.\n\nCheck the status of the audit system. It must be auditing.\n\n# pfexec auditconfig -getplugin \n\nIf the output of this command does not contain:\n\np_fsize=4M\n\nthis is a finding."
    check_command: The Audit Configuration profile is required.
  remediation:
    remediation_step: 'The Audit Control profile is required.


      This action applies to the global zone only. Determine the zone that you are currently securing.


      # zonename


      If the command output is "global", this action applies.


      Set the size of a binary audit file to a specific size. The size is specified in megabytes.


      # pfexec auditconfig -setplugin audit_binfile p_fsize=4M


      Restart the audit system.


      # pfexec audit -s'
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: Overflowing the audit storage area can result in a denial of service or system outage.
    impact: High
    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-219968r958752_rule - V-219968
  tags:
  - stig
  - high
  - v-219968
