- rule_id: SV-216292r959010
  rule_name: The telnet service daemon must not be installed unless required.
  rule_description: Telnet is an insecure protocol.
  category: Security
  subcategory: '216292'
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Determine if the telnet daemon package in installed.


      # pkg list service/network/telnet


      If an installed package named "service/network/telnet" is listed and vntsd is not in use for LDoms, this is a finding.'
    check_command: Determine if the telnet daemon package in installed.
  remediation:
    remediation_step: 'The Software Installation Profile is required.


      # pfexec pkg uninstall service/network/telnet'
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: Telnet is an insecure protocol.
    impact: High
    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-216292r959010_rule - V-216292
  tags:
  - stig
  - high
  - v-216292
- rule_id: SV-216355r959010
  rule_name: Login must not be permitted with empty/null passwords for SSH.
  rule_description: Permitting login without a password is inherently risky.
  category: Security
  subcategory: '216355'
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Determine if empty/null passwords are allowed for the SSH service.


      # grep "^PermitEmptyPasswords" /etc/ssh/sshd_config


      If the output of this command is not:


      PermitEmptyPasswords no


      this is a finding.'
    check_command: Determine if empty/null passwords are allowed for the SSH service.
  remediation:
    remediation_step: 'The root role is required.


      Modify the sshd_config file


      # pfedit /etc/ssh/sshd_config


      Locate the line containing:


      PermitEmptyPasswords


      Change it to:


      PermitEmptyPasswords no


      Restart the SSH service.


      # svcadm restart svc:/network/ssh'
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: Permitting login without a password is inherently risky.
    impact: High
    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-216355r959010_rule - V-216355
  tags:
  - stig
  - high
  - v-216355
- rule_id: SV-216273r958424
  rule_name: The operating system must alert designated organizational officials in the event of an audit processing failure.
  rule_description: Proper alerts to system administrators and IA officials of audit failures ensure a timely response to critical system issues.
  category: Security
  subcategory: '216273'
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'This check applies to the global zone only. Determine the zone that you are currently securing.


      # zonename


      If the command output is "global", this check applies.


      The root role is required.


      Verify the presence of an audit_warn entry in /etc/mail/aliases.

      # /usr/lib/sendmail -bv audit_warn

      If the response is:

      audit_warn... User unknown


      this is a finding.


      Review the output of the command and verify that the audit_warn alias notifies the appropriate users in this form:


      audit_warn:user1,user2


      If an appropriate user is not listed, this is a finding.'
    check_command: This check applies to the global zone only. Determine the zone that you are currently securing.
  remediation:
    remediation_step: "The root role is required. \n\nThis action applies to the global zone only. Determine the zone that you are currently securing.\n\n# zonename\n\nIf the command output is \"global\", this action applies.\n\nAdd an audit_warn alias to /etc/mail/aliases that will forward to designated system administrator(s).\n\n# pfedit /etc/mail/aliases\n\nInsert a line in the form:\naudit_warn:user1,user2\n\nPut the updated aliases file into service.\n# newaliases"
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: Proper alerts to system administrators and IA officials of audit failures ensure a timely response to critical system issues.
    impact: High
    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-216273r958424_rule - V-216273
  tags:
  - stig
  - high
  - v-216273
