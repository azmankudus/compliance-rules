- rule_id: SV-216456r959010
  rule_name: SNMP communities, users, and passphrases must be changed from the default.
  rule_description: Whether active or not, default SNMP passwords, users, and passphrases must be changed to maintain security. If the service is running with the default authenticators, then anyone can gather data about the system and the network and use the information to potentially compromise the integrity of the system or network(s).
  category: Security
  subcategory: '216456'
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'The root role is required.


      Check the SNMP configuration for default passwords.

      Locate and examine the SNMP configuration.


      Procedure:


      Find any occurrences of the snmpd.conf file delivered with Solaris packages:


      # pkg search -l -Ho path snmpd.conf | awk ''{ print "/"$1 }''


      # more [filename]


      Identify any community names or user password configurations. If any community name or password is set to a default value, such as public, private, snmp-trap, or password, this is a finding.'
    check_command: The root role is required.
  remediation:
    remediation_step: 'The root role is required.


      Change the default snmpd.conf community passwords. To change them, locate the snmpd.conf file and edit it.


      # pfedit [filename]


      Locate the line system-group-read-community which has a default password of public and make the password something more random (less guessable). Make the same changes for the lines that read system- group-write-community, read-community, write-community, trap, and trap-community. Read the information in the file carefully. The trap is defining who to send traps to, for instance, by default. It is not a password, but the name of a host.'
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: Whether active or not, default SNMP passwords, users, and passphrases must be changed to maintain security. If the service is running with the default authenticators, then anyone can gather data about the system and the network and use the information to potentially compromise the integrity of the system or network(s).
    impact: High
    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-216456r959010_rule - V-216456
  tags:
  - stig
  - high
  - v-216456
