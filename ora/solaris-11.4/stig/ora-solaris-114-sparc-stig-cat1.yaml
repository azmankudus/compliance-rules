- rule_id: SV-216311r959010
  rule_name: X displays must not be exported to the world.
  rule_description: Open X displays allow an attacker to capture keystrokes and to execute commands remotely. Many users have their X Server set to xhost +, permitting access to the X Server by anyone, from anywhere.
  category: Security
  subcategory: '216311'
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "If X Windows is not used on the system, this is not applicable.\n\nCheck the output of the xhost command from an X terminal.\n\nProcedure:\n$ xhost\nIf the output reports access control is enabled (and possibly lists the hosts that can receive X Window logins), this is not a finding. If the xhost command returns a line indicating access control is disabled, this is a finding.\n\nNOTE: It may be necessary to define the display if the command reports it cannot open the display. \n\nProcedure:\n$ DISPLAY=MachineName:0.0; export DISPLAY\nMachineName may be replaced with an Internet Protocol Address. Repeat the check procedure after setting the display."
    check_command: If X Windows is not used on the system, this is not applicable.
  remediation:
    remediation_step: If using an xhost-type authentication the xhost - command can be used to remove current trusted hosts and then selectively allow only trusted hosts to connect with xhost + commands. A cryptographically secure authentication, such as provided by the xauth program, is always preferred. Refer to your X11 server's documentation for further security information.
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: Open X displays allow an attacker to capture keystrokes and to execute commands remotely. Many users have their X Server set to xhost +, permitting access to the X Server by anyone, from anywhere.
    impact: High
    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-216311r959010_rule - V-216311
  tags:
  - stig
  - high
  - v-216311
- rule_id: SV-216359r959010
  rule_name: The system must not allow autologin capabilities from the GNOME desktop.
  rule_description: As automatic logins are a known security risk for other than "kiosk" types of systems, GNOME automatic login should be disabled in pam.conf.
  category: Security
  subcategory: '216359'
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Determine if autologin is enabled for the GNOME desktop.


      # egrep "auth|account" /etc/pam.d/gdm-autologin | grep -vc ^#


      If the command returns other than "0", this is a finding.'
    check_command: Determine if autologin is enabled for the GNOME desktop.
  remediation:
    remediation_step: 'The root role is required.


      Modify the /etc/pam.d/gdm-autologin file.


      # pfedit /etc/pam.d/gdm-autologin


      Locate the lines:


      auth required pam_unix_cred.so.1

      auth sufficient pam_allow.so.1

      account sufficient pam_allow.so.1


      Change the lines to read:


      #auth required pam_unix_cred.so.1

      #auth sufficient pam_allow.so.1

      #account sufficient pam_allow.so.1'
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: As automatic logins are a known security risk for other than "kiosk" types of systems, GNOME automatic login should be disabled in pam.conf.
    impact: High
    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-216359r959010_rule - V-216359
  tags:
  - stig
  - high
  - v-216359
- rule_id: SV-216365r959010
  rule_name: The operating system must not allow logins for users with blank passwords.
  rule_description: If the password field is blank and the system does not enforce a policy that passwords are required, it could allow login without proper authentication of a user.
  category: Security
  subcategory: '216365'
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Determine if the system is enforcing a policy that passwords are required.


      # grep ^PASSREQ /etc/default/login


      If the command does not return:


      PASSREQ=YES


      this is a finding.'
    check_command: Determine if the system is enforcing a policy that passwords are required.
  remediation:
    remediation_step: 'The root role is required.


      Modify the /etc/default/login file.


      # pfedit /etc/default/login


      Insert the line:


      PASSREQ=YES'
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: If the password field is blank and the system does not enforce a policy that passwords are required, it could allow login without proper authentication of a user.
    impact: High
    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-216365r959010_rule - V-216365
  tags:
  - stig
  - high
  - v-216365
- rule_id: SV-216421r959010
  rule_name: There must be no user .rhosts files.
  rule_description: Even though the .rhosts files are ineffective if support is disabled in /etc/pam.conf, they may have been brought over from other systems and could contain information useful to an attacker for those other systems.
  category: Security
  subcategory: '216421'
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'The root role is required.


      Check for the presence of .rhosts files.


      # for dir in \

      `logins -ox | awk -F: ''($8 == "PS") { print $6 }''`; do

      find ${dir}/.rhosts -type f -ls 2>/dev/null

      done


      If output is produced, this is a finding.'
    check_command: The root role is required.
  remediation:
    remediation_step: 'The root role is required.


      Remove any .rhosts files found.


      # rm [file name]'
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: Even though the .rhosts files are ineffective if support is disabled in /etc/pam.conf, they may have been brought over from other systems and could contain information useful to an attacker for those other systems.
    impact: High
    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-216421r959010_rule - V-216421
  tags:
  - stig
  - high
  - v-216421
