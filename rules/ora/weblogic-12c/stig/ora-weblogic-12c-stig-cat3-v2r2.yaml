$schema: https://opencode.ai/schemas/hardening-rule-schema.json
$schema_version: "1.0.0"
$metadata:
  name: DISA STIG for Oracle WebLogic Server 12c - CAT III
  version: "2.2"
  description: DISA Security Technical Implementation Guide for Oracle WebLogic Server 12c - CAT III (Low Severity)
  platform: Oracle WebLogic Server 12c
  benchmark: DISA STIG Oracle WebLogic Server 12c V2R2
  author: Defense Information Systems Agency (DISA)
  created: "2024-12-16T00:00:00Z"
  modified: "2025-01-30T00:00:00Z"
  compatible_platforms:
    - WebLogic Server 12.1.3
    - WebLogic Server 12.2.1

compliance_info:
  framework: STIG
  version: "2.2"
  profile: CAT III

profile:
  name: STIG CAT III
  description: Best practices - Recommended
  level: 3

rules:
  - rule_id: STIG-WBLC-02-000065
    legacy_ids:
      - V-235940
      - SV-235940r960873_rule
    rule_name: Oracle WebLogic must compile audit records from multiple components into a system-wide audit trail.
    rule_description: Audit records can be generated from various components within the application server. The events occurring must be time-correlated in order to conduct accurate forensic analysis.
    category: Auditing
    subcategory: Audit Trail
    testing_status: untested
    assessment:
      severity: Low
      is_auto: true
      automation_level: Full
      audit_type: config
      detection_step: |
        1. Access EM
        2. Verify 'opss-audit-DBDS' data source connects to IAU_APPEND schema
        3. Verify 'wls-wldf-storeDS' data source connects to WLS schema
        4. Verify all targets are being logged
        If any targets are not being logged, this is a finding.
    remediation:
      remediation_step: |
        1. Create data sources for audit data store
        2. Configure audit service to use these data sources
      rollback_supported: true
      reboot_required: false
      service_impact: None
      estimated_time: "15 minutes"
    tags:
      - auditing
      - audit-trail

  - rule_id: STIG-WBLC-02-000069
    legacy_ids:
      - V-235941
      - SV-235941r960885_rule
    rule_name: Oracle WebLogic must generate audit records for the DoD-selected list of auditable events.
    rule_description: The DoD-required auditable events are events that assist in intrusion detection and forensic analysis.
    category: Auditing
    subcategory: Auditable Events
    testing_status: untested
    assessment:
      severity: Low
      is_auto: true
      automation_level: Full
      audit_type: config
      detection_step: |
        1. Access EM
        2. Select 'WebLogic Domain' -> 'Logs' -> 'View Log Messages'
        3. Verify events are being logged for AdminServer and all managed servers
        If no events are being logged, this is a finding.
    remediation:
      remediation_step: |
        1. Enable HTTP access log file
        2. Set log file name
        3. Configure JVM logging level to 'WARNING'
      rollback_supported: true
      reboot_required: false
      service_impact: None
      estimated_time: "10 minutes"
    tags:
      - auditing
      - auditable-events

  - rule_id: STIG-WBLC-02-000073
    legacy_ids:
      - V-235942
      - SV-235942r960891_rule
    rule_name: Oracle WebLogic must produce HTTPD-related events and severity levels.
    rule_description: Application servers must log all relevant log data that pertains to application server functionality including HTTPD/Web server activity.
    category: Auditing
    subcategory: HTTPD Logging
    testing_status: untested
    assessment:
      severity: Low
      is_auto: true
      automation_level: Full
      audit_type: config
      detection_step: |
        1. Access EM
        2. Select 'WebLogic Domain' -> 'Logs' -> 'View Log Messages'
        3. Verify HTTPD events exist in access.log for all servers
        If no HTTPD events exist, this is a finding.
    remediation:
      remediation_step: |
        Enable HTTP access log file via 'Logging' -> 'HTTP' tab for all servers.
      rollback_supported: true
      reboot_required: false
      service_impact: None
      estimated_time: "5 minutes"
    tags:
      - auditing
      - httpd-logging

  - rule_id: STIG-WBLC-02-000074
    legacy_ids:
      - V-235943
      - SV-235943r960891_rule
    rule_name: Oracle WebLogic must produce JVM-related events and severity levels.
    rule_description: Application servers must log all relevant log data including Java Virtual Machine (JVM) activity.
    category: Auditing
    subcategory: JVM Logging
    testing_status: untested
    assessment:
      severity: Low
      is_auto: true
      automation_level: Full
      audit_type: config
      detection_step: |
        1. Access EM
        2. Select 'WebLogic Domain' -> 'Logs' -> 'View Log Messages'
        3. Verify JVM events exist in diagnostic.log for all servers
        If no JVM events exist, this is a finding.
    remediation:
      remediation_step: |
        Set 'Oracle Diagnostic Logging Level' to 'WARNING' via 'Logs' -> 'Log Configuration'.
      rollback_supported: true
      reboot_required: false
      service_impact: None
      estimated_time: "5 minutes"
    tags:
      - auditing
      - jvm-logging

  - rule_id: STIG-WBLC-02-000075
    legacy_ids:
      - V-235944
      - SV-235944r960891_rule
    rule_name: Oracle WebLogic must produce process events and severity levels.
    rule_description: Application servers must log all relevant log data including application server-related system process activity.
    category: Auditing
    subcategory: Process Logging
    testing_status: untested
    assessment:
      severity: Low
      is_auto: true
      automation_level: Full
      audit_type: config
      detection_step: |
        1. Access EM
        2. Select 'WebLogic Domain' -> 'Logs' -> 'View Log Messages'
        3. Verify process events exist in server.log for all servers
        If no process events exist, this is a finding.
    remediation:
      remediation_step: |
        Set log file name to 'logs/<server-name>.log' via 'Logging' -> 'General' tab.
      rollback_supported: true
      reboot_required: false
      service_impact: None
      estimated_time: "5 minutes"
    tags:
      - auditing
      - process-logging

  - rule_id: STIG-WBLC-02-000076
    legacy_ids:
      - V-235945
      - SV-235945r960894_rule
    rule_name: Oracle WebLogic must produce audit records containing date and time information.
    rule_description: In addition to logging event information, application servers must also log the corresponding dates and times of these events.
    category: Auditing
    subcategory: Timestamp
    testing_status: untested
    assessment:
      severity: Low
      is_auto: true
      automation_level: Full
      audit_type: config
      detection_step: |
        1. Access EM
        2. Select 'WebLogic Domain' -> 'Logs' -> 'View Log Messages'
        3. Verify 'Time' column appears in log message table
        If timestamp data is missing, this is a finding.
    remediation:
      remediation_step: |
        Apply 'JRF Template' to servers if timestamp data is not appearing.
      rollback_supported: true
      reboot_required: false
      service_impact: Server restart required
      estimated_time: "15 minutes"
    tags:
      - auditing
      - timestamp

  - rule_id: STIG-WBLC-02-000077
    legacy_ids:
      - V-235946
      - SV-235946r960897_rule
    rule_name: Oracle WebLogic must produce audit records containing location information.
    rule_description: Without sufficient information establishing where the audit events occurred, investigation into the cause of events is severely hindered.
    category: Auditing
    subcategory: Location Information
    testing_status: untested
    assessment:
      severity: Low
      is_auto: true
      automation_level: Full
      audit_type: config
      detection_step: |
        1. Access EM
        2. Select 'WebLogic Domain' -> 'Logs' -> 'View Log Messages'
        3. Verify 'Component' and 'Module' fields appear in message detail
        If location data is missing, this is a finding.
    remediation:
      remediation_step: |
        Apply 'JRF Template' to servers if location data is not appearing.
      rollback_supported: true
      reboot_required: false
      service_impact: Server restart required
      estimated_time: "15 minutes"
    tags:
      - auditing
      - location

  - rule_id: STIG-WBLC-02-000078
    legacy_ids:
      - V-235947
      - SV-235947r960900_rule
    rule_name: Oracle WebLogic must produce audit records containing source information.
    rule_description: Without information establishing the source of activity, the value of audit records from a forensics perspective is questionable.
    category: Auditing
    subcategory: Source Information
    testing_status: untested
    assessment:
      severity: Low
      is_auto: true
      automation_level: Full
      audit_type: config
      detection_step: |
        1. Access EM
        2. Select 'WebLogic Domain' -> 'Logs' -> 'View Log Messages'
        3. Verify 'Host', 'Host IP Address', 'Thread ID' fields appear in message detail
        If source data is missing, this is a finding.
    remediation:
      remediation_step: |
        Apply 'JRF Template' to servers if source data is not appearing.
      rollback_supported: true
      reboot_required: false
      service_impact: Server restart required
      estimated_time: "15 minutes"
    tags:
      - auditing
      - source

  - rule_id: STIG-WBLC-02-000079
    legacy_ids:
      - V-235948
      - SV-235948r960903_rule
    rule_name: Oracle WebLogic must produce audit records containing outcome information.
    rule_description: Success and failure indicators ascertain the outcome of a particular application server event and help determine the appropriate response.
    category: Auditing
    subcategory: Outcome Information
    testing_status: untested
    assessment:
      severity: Low
      is_auto: true
      automation_level: Full
      audit_type: config
      detection_step: |
        1. Access EM
        2. Select 'WebLogic Domain' -> 'Logs' -> 'View Log Messages'
        3. Verify 'Message Type' column appears in log message table
        If outcome data is missing, this is a finding.
    remediation:
      remediation_step: |
        Apply 'JRF Template' to servers if outcome data is not appearing.
      rollback_supported: true
      reboot_required: false
      service_impact: Server restart required
      estimated_time: "15 minutes"
    tags:
      - auditing
      - outcome

  - rule_id: STIG-WBLC-02-000083
    legacy_ids:
      - V-235951
      - SV-235951r960912_rule
    rule_name: Oracle WebLogic must provide a real-time alert when audit failure events occur.
    rule_description: It is critical for the appropriate personnel to be aware if a system is at risk of failing to process audit logs as required.
    category: Auditing
    subcategory: Audit Alerts
    testing_status: untested
    assessment:
      severity: Low
      is_auto: true
      automation_level: Full
      audit_type: config
      detection_step: |
        1. Access AC
        2. Navigate to 'Diagnostics' -> 'Diagnostic Modules'
        3. Verify 'ServerHealthWatch' and 'ServerHealthNotification' are enabled
        If notifications are not enabled, this is a finding.
    remediation:
      remediation_step: |
        Configure diagnostic module with health watch and SMTP notification.
      rollback_supported: true
      reboot_required: false
      service_impact: None
      estimated_time: "30 minutes"
    tags:
      - auditing
      - alerts

  - rule_id: STIG-WBLC-02-000084
    legacy_ids:
      - V-235952
      - SV-235952r960912_rule
    rule_name: Oracle WebLogic must alert designated organizational officials in the event of an audit processing failure.
    rule_description: Application servers must be able to trigger an alarm and send that alert to designated individuals in the event of audit processing failure.
    category: Auditing
    subcategory: Audit Alerts
    testing_status: untested
    assessment:
      severity: Low
      is_auto: true
      automation_level: Full
      audit_type: config
      detection_step: |
        Verify 'ServerHealthWatch' and 'ServerHealthNotification' are enabled.
        If notifications are not enabled, this is a finding.
    remediation:
      remediation_step: |
        Configure diagnostic module with health watch and SMTP notification to designated individuals.
      rollback_supported: true
      reboot_required: false
      service_impact: None
      estimated_time: "30 minutes"
    tags:
      - auditing
      - alerts

  - rule_id: STIG-WBLC-02-000086
    legacy_ids:
      - V-235953
      - SV-235953r960912_rule
    rule_name: Oracle WebLogic must notify administrative personnel as a group in the event of audit processing failure.
    rule_description: Application servers must be capable of notifying a group of administrative personnel upon detection of audit log processing failure.
    category: Auditing
    subcategory: Audit Alerts
    testing_status: untested
    assessment:
      severity: Low
      is_auto: true
      automation_level: Full
      audit_type: config
      detection_step: |
        Verify 'ServerHealthWatch' and 'ServerHealthNotification' are enabled.
        If notifications are not enabled, this is a finding.
    remediation:
      remediation_step: |
        Configure diagnostic module with health watch and SMTP notification to a group email.
      rollback_supported: true
      reboot_required: false
      service_impact: None
      estimated_time: "30 minutes"
    tags:
      - auditing
      - alerts

  - rule_id: STIG-WBLC-02-000093
    legacy_ids:
      - V-235954
      - SV-235954r960927_rule
    rule_name: Oracle WebLogic must use internal system clocks to generate time stamps for audit records.
    rule_description: Determining the correct time a particular event occurred on a system is critical when conducting forensic analysis.
    category: Auditing
    subcategory: Time Synchronization
    testing_status: untested
    assessment:
      severity: Low
      is_auto: true
      automation_level: Full
      audit_type: config
      detection_step: |
        1. Access EM
        2. Select 'WebLogic Domain' -> 'Security' -> 'Security Provider Configuration'
        3. Verify 'Timezone Settings' is set to 'UTC'
        If not set to 'UTC', this is a finding.
    remediation:
      remediation_step: |
        Set 'Timezone Settings' radio button to 'UTC' in Security Provider Configuration.
      rollback_supported: true
      reboot_required: false
      service_impact: Server restart required
      estimated_time: "10 minutes"
    tags:
      - auditing
      - time-sync

  - rule_id: STIG-WBLC-02-000094
    legacy_ids:
      - V-235955
      - SV-235955r981686_rule
    rule_name: Oracle WebLogic must synchronize with internal system clocks which are synchronized with an authoritative time source.
    rule_description: Synchronization of system clocks is needed in order to correctly correlate the timing of events across multiple systems.
    category: Auditing
    subcategory: Time Synchronization
    testing_status: untested
    assessment:
      severity: Low
      is_auto: true
      automation_level: Full
      audit_type: config
      detection_step: |
        Verify 'Timezone Settings' is set to 'UTC' in Security Provider Configuration.
        If not set to 'UTC', this is a finding.
    remediation:
      remediation_step: |
        Set 'Timezone Settings' to 'UTC' and ensure OS clock is synchronized with authoritative time source.
      rollback_supported: true
      reboot_required: false
      service_impact: Server restart required
      estimated_time: "10 minutes"
    tags:
      - auditing
      - time-sync

  - rule_id: STIG-WBLC-02-000095
    legacy_ids:
      - V-235956
      - SV-235956r960930_rule
    rule_name: Oracle WebLogic must protect audit information from unauthorized read access.
    rule_description: If audit data were to become compromised, then forensic analysis and discovery of the true source of potentially malicious activity is difficult.
    category: Auditing
    subcategory: Audit Protection
    testing_status: untested
    assessment:
      severity: Low
      is_auto: true
      automation_level: Full
      audit_type: config
      detection_step: |
        Verify users without audit read access do not have 'Admin', 'Deployer', 'Monitor', or 'Operator' roles.
        If unauthorized users have these roles, this is a finding.
    remediation:
      remediation_step: |
        Remove 'Admin', 'Deployer', 'Monitor', 'Operator' roles from users who should not have audit read access.
      rollback_supported: true
      reboot_required: false
      service_impact: None
      estimated_time: "5 minutes"
    tags:
      - auditing
      - access-control

  - rule_id: STIG-WBLC-03-000129
    legacy_ids:
      - V-235963
      - SV-235963r961863_rule
    rule_name: Oracle WebLogic must utilize automated mechanisms to prevent program execution on the information system.
    rule_description: The application server must provide a capability to halt or otherwise disable the automatic execution of deployed applications until established as part of the baseline.
    category: Configuration Management
    subcategory: Application Execution
    testing_status: untested
    assessment:
      severity: Low
      is_auto: true
      automation_level: Full
      audit_type: config
      detection_step: |
        Verify 'Production Mode' checkbox is selected at domain level.
        If not selected, this is a finding.
    remediation:
      remediation_step: |
        Check 'Production Mode' checkbox at domain level and restart all servers.
      rollback_supported: true
      reboot_required: true
      service_impact: Server restart required
      estimated_time: "15 minutes"
    tags:
      - configuration
      - production-mode

  - rule_id: STIG-WBLC-08-000210
    legacy_ids:
      - V-235979
      - SV-235979r1043182_rule
    rule_name: Oracle WebLogic must terminate network connections associated with communications sessions at the end of the session or after inactivity.
    rule_description: Terminating sessions after a certain period of inactivity is a method for mitigating the risk of session hijacking.
    category: Session Management
    subcategory: Session Termination
    testing_status: untested
    assessment:
      severity: Low
      is_auto: true
      automation_level: Full
      audit_type: config
      detection_step: |
        Verify 'Session Timeout' is set to '900' seconds for all 'Enterprise Application' and 'Web Application' deployments.
        If not set to '900', this is a finding.
    remediation:
      remediation_step: |
        Set 'Session Timeout' to '900' seconds for all deployments.
      rollback_supported: true
      reboot_required: false
      service_impact: None
      estimated_time: "5 minutes"
    tags:
      - session-management
      - timeout

  - rule_id: STIG-WBLC-08-000235
    legacy_ids:
      - V-235988
      - SV-235988r961620_rule
    rule_name: Oracle WebLogic must protect the integrity of applications during data aggregation, packaging, and transformation.
    rule_description: The application server must ensure the integrity of data that is pending transfer for deployment is maintained.
    category: System Integrity
    subcategory: Data Integrity
    testing_status: untested
    assessment:
      severity: Low
      is_auto: true
      automation_level: Full
      audit_type: config
      detection_step: |
        Verify 'Production Mode' checkbox is selected at domain level.
        If not selected, this is a finding.
    remediation:
      remediation_step: |
        Check 'Production Mode' checkbox at domain level and restart all servers.
      rollback_supported: true
      reboot_required: true
      service_impact: Server restart required
      estimated_time: "15 minutes"
    tags:
      - integrity
      - production-mode

  - rule_id: STIG-WBLC-09-000252
    legacy_ids:
      - V-235993
      - SV-235993r961167_rule
    rule_name: Oracle WebLogic must identify potentially security-relevant error conditions.
    rule_description: Application servers must have the capability to log at various levels which can provide log entries for potential security-related error events.
    category: Error Handling
    subcategory: Error Identification
    testing_status: untested
    assessment:
      severity: Low
      is_auto: true
      automation_level: Full
      audit_type: config
      detection_step: |
        1. Access EM
        2. Verify log levels are configured for system-related events
        3. Verify audit policy is configured for security-related events
        If security-related events are not properly configured, this is a finding.
    remediation:
      remediation_step: |
        Configure log levels for system and security-related events in EM.
      rollback_supported: true
      reboot_required: false
      service_impact: None
      estimated_time: "10 minutes"
    tags:
      - error-handling
      - logging
