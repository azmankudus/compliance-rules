  benchmark: CIS Microsoft IIS 10 Benchmark v1.2.1
  author: Compliance Rules Team
  created: '2026-03-16T00:00:00Z'
  modified: '2026-03-16T00:00:00Z'
  compatible_platforms:
  - Microsoft IIS 10.0 on Windows Server 2016
  - Microsoft IIS 10.0 on Windows Server 2019
  - Microsoft IIS 10.0 on Windows Server 2022
