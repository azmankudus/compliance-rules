rules:
- rule_id: STIG-WN25-00-000180
  rule_name: Windows Server 2025 nonadministrative accounts or groups must only have print permissions on printer shares.
  rule_description: Windows shares are a means by which files, folders, printers, and other resources can be published for network users to access. Improper configuration can permit access to devices and data beyond a user's need.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "Open \"Printers & scanners\" in \"Settings\".\n\nIf there are no printers configured, this is not applicable. (Exclude Microsoft Print to PDF and Microsoft XPS Document Writer, which do not support sharing.)\n\nFor each printer:\n\nSelect the printer and \"Manage\". \n\nSelect \"Printer Properties\". \n\nSelect the \"Sharing\" tab. \n\nIf \"Share this printer\" is checked, select the \"Security\" tab.\n\nIf any standard user accounts or groups have permissions other than \"Print\", this is a finding.\n\nThe default is for the \"Everyone\" group to be given Print permission.\n\n\"All APPLICATION PACKAGES\" and \"CREATOR OWNER\" are not standard user accounts."
  remediation:
    remediation_step: Configure the permissions on shared printers to restrict standard users to only have Print permissions.
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Low
    false_positive_risk: Low
  tags:
  - stig
  - cat3
  - windows-server-2025
- rule_id: STIG-WN25-00-000440
  rule_name: The Windows Server 2025 time service must synchronize with an appropriate DOD time source.
  rule_description: 'The Windows Time Service controls time synchronization settings. Time synchronization is essential for authentication and auditing purposes. If the Windows Time Service is used, it must synchronize with a secure, authorized time source. Domain-joined systems are automatically configured to synchronize with domain controllers. If an NTP server is configured, it must synchronize with a secure, authorized time source.


    Satisfies: SRG-OS-000785-GPOS-000250.'
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Review the Windows time service configuration.


      Open an elevated command prompt (run as administrator).


      Enter "W32tm /query /configuration".


      Domain-joined systems (excluding the domain controller with the PDC emulator role):


      If the value for "Type" under "NTP Client" is not "NT5DS", this is a finding.


      Other systems:


      If systems are configured with a "Type" of "NTP", including stand-alone or nondomain-joined systems and the domain controller with the PDC Emulator role, and do not have a DOD time server defined for "NTPServer", this is a finding.


      To determine the domain controller with the PDC Emulator role:


      Open PowerShell.


      Enter "Get-ADDomain | FT PDCEmulator".'
  remediation:
    remediation_step: 'Configure the system to synchronize time with an appropriate DOD time source.


      Domain-joined systems use NT5DS to synchronize time from other systems in the domain by default.


      If needed, configure the system to point to an authorized time server by setting the policy value for Computer Configuration >> Administrative Templates >> System >> Windows Time Service >> Time Providers. Change "Configure Windows NTP Client" to "Enabled" and configure the "NtpServer" field to point to an appropriate DOD time server.


      The US Naval Observatory operates stratum one-time servers, identified at https://www.usno.navy.mil/USNO/time/ntp/DOD-customers. Time synchronization will occur through a hierarchy of time servers down to the local level. Clients and lower-level servers will synchronize with an authorized time server in the hierarchy.'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Low
    false_positive_risk: Low
  tags:
  - stig
  - cat3
  - windows-server-2025
- rule_id: STIG-WN25-CC-000030
  rule_name: Windows Server 2025 Internet Protocol version 6 (IPv6) source routing must be configured to the highest protection level to prevent IP source routing.
  rule_description: Configuring the system to disable IPv6 source routing protects against spoofing.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Verify the registry value below:


      Registry Hive: HKEY_LOCAL_MACHINE

      Registry Path: \SYSTEM\CurrentControlSet\Services\Tcpip6\Parameters\


      Value Name: DisableIPSourceRouting


      Type: REG_DWORD

      Value: 0x00000002 (2)


      If the registry value does not exist or is not configured as specified, this is a finding.'
  remediation:
    remediation_step: 'Configure the policy value for Computer Configuration >> Administrative Templates >> MSS (Legacy) >> MSS: (DisableIPSourceRouting IPv6) IP source routing protection level (protects against packet spoofing) to "Enabled" with "Highest protection, source routing is completely disabled" selected.


      This policy setting requires the installation of the MSS-Legacy custom templates included with the STIG package. "MSS-Legacy.admx" and "MSS-Legacy.adml" must be copied to the \Windows\PolicyDefinitions and \Windows\PolicyDefinitions\en-US directories respectively.'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Low
    false_positive_risk: Low
  tags:
  - stig
  - cat3
  - windows-server-2025
- rule_id: STIG-WN25-CC-000040
  rule_name: Windows Server 2025 source routing must be configured to the highest protection level to prevent Internet Protocol (IP) source routing.
  rule_description: Configuring the system to disable IP source routing protects against spoofing.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "If the following registry value does not exist or is not configured as specified, this is a finding:\n\nRegistry Hive: HKEY_LOCAL_MACHINE \nRegistry Path: \\SYSTEM\\CurrentControlSet\\Services\\Tcpip\\Parameters\\\n\nValue Name: DisableIPSourceRouting\n\nValue Type: REG_DWORD\nValue: 0x00000002 (2)"
  remediation:
