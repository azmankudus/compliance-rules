- rule_id: STIG-WN25-CC-000050
  rule_name: Windows Server 2025 must be configured to prevent Internet Control Message Protocol (ICMP) redirects from overriding Open Shortest Path First (OSPF)-generated routes.
  rule_description: Allowing ICMP redirect of routes can lead to traffic not being routed properly. When disabled, this forces ICMP to be routed via the shortest path first.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "If the following registry value does not exist or is not configured as specified, this is a finding:\n\nRegistry Hive: HKEY_LOCAL_MACHINE \nRegistry Path: \\SYSTEM\\CurrentControlSet\\Services\\Tcpip\\Parameters\\\n\nValue Name: EnableICMPRedirect\n\nValue Type: REG_DWORD\nValue: 0x00000000 (0)"
  remediation:
    remediation_step: 'Configure the policy value for Computer Configuration >> Administrative Templates >> MSS (Legacy) >> MSS: (EnableICMPRedirect) Allow ICMP redirects to override OSPF generated routes to "Disabled".


      This policy setting requires the installation of the MSS-Legacy custom templates included with the STIG package. "MSS-Legacy.admx" and "MSS-Legacy.adml" must be copied to the \Windows\PolicyDefinitions and \Windows\PolicyDefinitions\en-US directories respectively.'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Low
    false_positive_risk: Low
  tags:
  - stig
  - cat3
  - windows-server-2025
- rule_id: STIG-WN25-CC-000060
  rule_name: Windows Server 2025 must be configured to ignore NetBIOS name release requests except from WINS servers.
  rule_description: Configuring the system to ignore name release requests, except from WINS servers, prevents a denial-of-service (DoS) attack. The DoS consists of sending a NetBIOS name release request to the server for each entry in the server's cache, causing a response delay in the normal operation of the server's WINS resolution capability.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'If the following registry value does not exist or is not configured as specified, this is a finding:


      Registry HiveHKEY_LOCAL_MACHINE

      Registry Path\SYSTEM\CurrentControlSet\Services\Netbt\Parameters\


      Value NameNoNameReleaseOnDemand


      Value TypeREG_DWORD

      Value0x00000001 (1)'
  remediation:
    remediation_step: 'Configure the policy value for Computer Configuration >> Administrative Templates >> MSS (Legacy) >> MSS: (NoNameReleaseOnDemand) Allow the computer to ignore NetBIOS name release requests except from WINS servers to "Enabled".


      This policy setting requires the installation of the MSS-Legacy custom templates included with the STIG package. "MSS-Legacy.admx" and "MSS-Legacy.adml" must be copied to the \Windows\PolicyDefinitions and \Windows\PolicyDefinitions\en-US directories respectively.'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Low
    false_positive_risk: Low
  tags:
  - stig
  - cat3
  - windows-server-2025
- rule_id: STIG-WN25-CC-000200
  rule_name: Windows Server 2025 Application Compatibility Program Inventory must be prevented from collecting data and sending the information to Microsoft.
  rule_description: 'Some features may communicate with the vendor, sending system information or downloading data or components for the feature. Turning off this capability will prevent potentially sensitive information from being sent outside the enterprise and will prevent uncontrolled updates to the system.


    This setting will prevent the Program Inventory from collecting data about a system and sending the information to Microsoft.'
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'If the following registry value does not exist or is not configured as specified, this is a finding:


      Registry Hive: HKEY_LOCAL_MACHINE

      Registry Path: \SOFTWARE\Policies\Microsoft\Windows\AppCompat\


      Value Name: DisableInventory


      Type: REG_DWORD

      Value: 0x00000001 (1)'
  remediation:
    remediation_step: Configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components >> Application Compatibility >> Turn off Inventory Collector to "Enabled".
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Low
    false_positive_risk: Low
  tags:
  - stig
  - cat3
  - windows-server-2025
- rule_id: STIG-WN25-CC-000260
  rule_name: Windows Server 2025 Windows Update must not obtain updates from other PCs on the internet.
  rule_description: Windows Update can obtain updates from additional sources instead of Microsoft. In addition to Microsoft, updates can be obtained from and sent to PCs on the local network as well as on the internet. This is part of the Windows Update trusted process; however, to minimize outside exposure, obtaining updates from or sending to systems on the internet must be prevented.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'If the following registry value does not exist or is not configured as specified, this is a finding:


      Registry Hive: HKEY_LOCAL_MACHINE

      Registry Path: \SOFTWARE\Policies\Microsoft\Windows\DeliveryOptimization\


      Value Name: DODownloadMode


      Value Type: REG_DWORD

      Value: 0x00000000 (0) - No peering (HTTP Only)

      0x00000001 (1) - Peers on same NAT only (LAN)

      0x00000002 (2) - Local Network / Private group peering (Group)

      0x00000063 (99) - Simple download mode, no peering (Simple)

      0x00000064 (100) - Bypass mode, Delivery Optimization not used (Bypass)


      A value of 0x00000003 (3), internet, is a finding.'
  remediation:
    remediation_step: 'Configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components >> Delivery Optimization >> Download Mode to "Enabled" with any option except "Internet" selected.


      Acceptable selections include:


      Bypass (100)

      Group (2)

      HTTP only (0)

      LAN (1)

      Simple (99)'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Low
    false_positive_risk: Low
  tags:
  - stig
  - cat3
  - windows-server-2025
- rule_id: STIG-WN25-CC-000320
  rule_name: Windows Server 2025 Turning off File Explorer heap termination on corruption must be disabled.
  rule_description: Legacy plug-in applications may continue to function when a File Explorer session has become corrupt. Disabling this feature will prevent this.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'The default behavior is for File Explorer heap termination on corruption to be enabled.


      If the registry Value Name below does not exist, this is not a finding.


      If it exists and is configured with a value of "0", this is not a finding.


      If it exists and is configured with a value of "1", this is a finding.


      Registry Hive: HKEY_LOCAL_MACHINE

      Registry Path: \SOFTWARE\Policies\Microsoft\Windows\Explorer\


      Value Name: NoHeapTerminationOnCorruption


      Value Type: REG_DWORD

      Value: 0x00000000 (0) (or if the Value Name does not exist)'
  remediation:
    remediation_step: 'The default behavior is for File Explorer heap termination on corruption to be disabled.


      To correct this, configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components >> File Explorer >> Turn off heap termination on corruption to "Not Configured" or "Disabled".'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Low
    false_positive_risk: Low
  tags:
  - stig
  - cat3
  - windows-server-2025
- rule_id: STIG-WN25-DC-000160
  rule_name: Windows Server 2025 directory service must be configured to terminate LDAP-based network connections to the directory server after five minutes of inactivity.
  rule_description: 'The failure to terminate inactive network connections increases the risk of a successful attack on the directory server. The longer an established session is in progress, the more time an attacker has to hijack the session, implement a means to passively intercept data, or compromise any protections on client access. For example, if an attacker gains control of a client computer, an existing (already authenticated) session with the directory server could allow access to the directory. The lack of confidentiality protection in LDAP-based sessions increases exposure to this vulnerability.


    Satisfies: SRG-OS-000163-GPOS-00072, SRG-OS-000279-GPOS-00109'
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "This applies to domain controllers. It is not applicable for other systems.\n\nOpen an elevated command prompt (run as administrator).\n\nEnter \"ntdsutil\".\n\nAt the \"ntdsutil:\" prompt, enter \"LDAP policies\".\n\nAt the \"ldap policy:\" prompt, enter \"connections\".\n\nAt the \"server connections:\" prompt, enter \"connect to server [host-name]\"\n(where [host-name] is the computer name of the domain controller).\n\nAt the \"server connections:\" prompt, enter \"q\".\n\nAt the \"ldap policy:\" prompt, enter \"show values\". \n\nIf the value for MaxConnIdleTime is greater than \"300\" (5 minutes) or is not specified, this is a finding.\n\nEnter \"q\" at the \"ldap policy:\" and \"ntdsutil:\" prompts to exit.\n\nAlternately, Dsquery can be used to display MaxConnIdleTime:\n\nOpen \"command prompt (Admin)\".\n\nEnter the following command (on a single line).\n\ndsquery * \"cn=Default Query Policy,cn=Query-Policies,cn=Directory Service, cn=Windows NT,cn=Services,cn=Configuration,dc=[forest-name]\"\
      \ -attr LDAPAdminLimits \n\nThe quotes are requ..."
  remediation:
    remediation_step: 'Configure the directory service to terminate LDAP-based network connections to the directory server after 5 minutes of inactivity.


      Open an elevated command prompt (run as administrator).


      Enter "ntdsutil".


      At the "ntdsutil:" prompt, enter "LDAP policies".


      At the "ldap policy:" prompt, enter "connections".


      At the "server connections:" prompt, enter "connect to server [host-name]" (where [host-name] is the computer name of the domain controller).


      At the "server connections:" prompt, enter "q".


      At the "ldap policy:" prompt, enter "Set MaxConnIdleTime to 300".


      Enter "Commit Changes" to save.


      Enter "Show values" to verify changes.


      Enter "q" at the "ldap policy:" and "ntdsutil:" prompts to exit.'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Low
    false_positive_risk: Low
  tags:
  - stig
  - cat3
  - windows-server-2025
- rule_id: STIG-WN25-SO-000140
  rule_name: Windows Server 2025 title for legal banner dialog box must be configured with the appropriate text.
  rule_description: 'Failure to display the logon banner prior to a logon attempt will negate legal proceedings resulting from unauthorized access to system resources.


    Satisfies: SRG-OS-000023-GPOS-00006, SRG-OS-000228-GPOS-00088'
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "If the following registry value does not exist or is not configured as specified, this is a finding:\n\nRegistry Hive: HKEY_LOCAL_MACHINE \nRegistry Path: \\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System\\\n\nValue Name: LegalNoticeCaption\n\nValue Type: REG_SZ\nValue: See message title options below\n\n\"DOD Notice and Consent Banner\", \"US Department of Defense Warning Statement\", or an organization-defined equivalent. \n\nIf an organization-defined title is used, it can in no case contravene or modify the language of the banner text required in WN25-SO-000150.\n\nAutomated tools may only search for the titles defined above. If an organization-defined title is used, a manual review will be required."
  remediation:
    remediation_step: "Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> Security Options >> Interactive Logon: Message title for users attempting to log on to \"DOD Notice and Consent Banner\", \"US Department of Defense Warning Statement\", or an organization-defined equivalent. \n\nIf an organization-defined title is used, it can in no case contravene or modify the language of the message text required in WN25-SO-000150."
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Low
    false_positive_risk: Low
  tags:
  - stig
  - cat3
  - windows-server-2025
- rule_id: STIG-WN25-SO-000370
  rule_name: Windows Server 2025 default permissions of global system objects must be strengthened.
  rule_description: Windows systems maintain a global list of shared system resources such as DOS device names, mutexes, and semaphores. Each type of object is created with a default Discretionary Access Control List (DACL) that specifies who can access the objects with what permissions. When this policy is enabled, the default DACL is stronger, allowing nonadministrative users to read shared objects but not to modify shared objects they did not create.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "If the following registry value does not exist or is not configured as specified, this is a finding:\n\nRegistry Hive: HKEY_LOCAL_MACHINE \nRegistry Path: \\SYSTEM\\CurrentControlSet\\Control\\Session Manager\\\n\nValue Name: ProtectionMode\n\nValue Type: REG_DWORD\nValue: 0x00000001 (1)"
  remediation:
    remediation_step: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> Security Options >> System objects: Strengthen default permissions of internal system objects (e.g., Symbolic Links) to "Enabled".'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Low
    false_positive_risk: Low
  tags:
  - stig
  - cat3
  - windows-server-2025
