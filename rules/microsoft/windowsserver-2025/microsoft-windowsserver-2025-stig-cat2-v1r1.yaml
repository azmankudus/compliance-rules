- rule_id: STIG-WN25-00-000300
  rule_name: Windows Server 2025 must automatically remove or disable temporary user accounts after 72 hours.
  rule_description: 'If temporary user accounts remain active when no longer needed or for an excessive period, these accounts may be used to gain unauthorized access. To mitigate this risk, automated termination of all temporary accounts must be set upon account creation.


    Temporary accounts are established as part of normal account activation procedures when there is a need for short-term accounts without the demand for immediacy in account activation.


    If temporary accounts are used, the operating system must be configured to automatically terminate these types of accounts after a DOD-defined time period of 72 hours.


    To address access requirements, many operating systems may be integrated with enterprise-level authentication/access mechanisms that meet or exceed access control policy requirements.'
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Review temporary user accounts for expiration dates.


      Determine if temporary user accounts are used and identify any that exist. If none exist, this is not applicable.


      Domain Controllers:


      Open PowerShell.


      Enter "Search-ADAccount -AccountExpiring | FT Name, AccountExpirationDate".


      If "AccountExpirationDate" has not been defined within 72 hours for any temporary user account, this is a finding.


      Member servers and stand-alone or nondomain-joined systems:


      Open command prompt.


      Run "Net user [username]", where [username] is the name of the temporary user account.


      If "Account expires" has not been defined within 72 hours for any temporary user account, this is a finding.'
  remediation:
    remediation_step: 'Configure temporary user accounts to automatically expire within 72 hours.


      Domain accounts can be configured with an account expiration date, under "Account" properties.


      Local accounts can be configured to expire with the command "Net user [username] /expires:[mm/dd/yyyy]", where [username] is the name of the temporary user account.


      Delete any temporary user accounts that are no longer necessary.'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
  - stig
  - cat2
  - windows-server-2025
- rule_id: STIG-WN25-00-000310
  rule_name: Windows Server 2025 must automatically remove or disable emergency accounts after the crisis is resolved or within 72 hours.
  rule_description: 'Emergency administrator accounts are privileged accounts established in response to crisis situations where the need for rapid account activation is required. Therefore, emergency account activation may bypass normal account authorization processes. If these accounts are automatically disabled, system maintenance during emergencies may not be possible, thus adversely affecting system availability.


    Emergency administrator accounts are different from infrequently used accounts (i.e., local logon accounts used by system administrators when network or normal logon/access is not available). Infrequently used accounts are not subject to automatic termination dates. Emergency accounts are accounts created in response to crisis situations, usually for use by maintenance personnel. The automatic expiration or disabling time period may be extended as needed until the crisis is resolved; however, it must not be extended indefinitely. A permanent account must be established for privileged user...'
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Determine if emergency administrator accounts are used and identify any that exist. If none exist, this is not applicable.


      If emergency administrator accounts cannot be configured with an expiration date due to an ongoing crisis, the accounts must be disabled or removed when the crisis is resolved.


      If emergency administrator accounts have not been configured with an expiration date or have not been disabled or removed following the resolution of a crisis, this is a finding.


      Domain Controllers:


      Open PowerShell.


      Enter "Search-ADAccount -AccountExpiring | FT Name, AccountExpirationDate".


      If "AccountExpirationDate" has been defined and is not within 72 hours for an emergency administrator account, this is a finding.


      Member servers and stand-alone or nondomain-joined systems:


      Open command prompt.


      Run "Net user [username]", where [username] is the name of the emergency account.


      If "Account expires" has been defined and is not within 72 hours for an emergency administrator accoun...'
  remediation:
    remediation_step: 'Remove emergency administrator accounts after a crisis has been resolved or configure the accounts to automatically expire within 72 hours.


      Domain accounts can be configured with an account expiration date, under "Account" properties.


      Local accounts can be configured to expire with the command "Net user [username] /expires:[mm/dd/yyyy]", where [username] is the name of the temporary user account.'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
  - stig
  - cat2
  - windows-server-2025
- rule_id: STIG-WN25-00-000320
  rule_name: Windows Server 2025 must not have the Fax Server role installed.
  rule_description: Unnecessary services increase the attack surface of a system. Some of these services may not support required levels of authentication or encryption or may provide unauthorized access to the system.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Open PowerShell.


      Enter "Get-WindowsFeature | Where Name -eq Fax".


      If "Installed State" is "Installed", this is a finding.


      An Installed State of "Available" or "Removed" is not a finding.'
  remediation:
    remediation_step: 'Uninstall the "Fax Server" role.


      Start Server Manager.


      Select the server with the role.


      Scroll down to "ROLES AND FEATURES" in the right pane.


      Select "Remove Roles and Features" from the drop-down "TASKS" list.


      Select the appropriate server on the "Server Selection" page and click "Next".


      Deselect "Fax Server" on the "Roles" page.


      Click "Next" and "Remove" as prompted.'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
  - stig
  - cat2
  - windows-server-2025
- rule_id: STIG-WN25-00-000330
  rule_name: Windows Server 2025 must not have the Microsoft FTP service installed unless required by the organization.
  rule_description: Unnecessary services increase the attack surface of a system. Some of these services may not support required levels of authentication or encryption.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'If the server has the role of an FTP server, this is not applicable.


      Open PowerShell.


      Enter "Get-WindowsFeature | Where Name -eq Web-Ftp-Service".


      If "Installed State" is "Installed", this is a finding.


      An Installed State of "Available" or "Removed" is not a finding.


      If the system has the role of an FTP server, this must be documented with the information system security officer (ISSO).'
  remediation:
    remediation_step: 'Uninstall the "FTP Server" role.


      Start Server Manager.


      Select the server with the role.


      Scroll down to "ROLES AND FEATURES" in the right pane.


      Select "Remove Roles and Features" from the drop-down "TASKS" list.


      Select the appropriate server on the "Server Selection" page and click "Next".


      Deselect "FTP Server" under "Web Server (IIS)" on the "Roles" page.


      Click "Next" and "Remove" as prompted.'
