- rule_id: STIG-WN25-00-000420
  rule_name: Windows Server 2025 FTP servers must be configured to prevent anonymous logons.
  rule_description: 'The FTP service allows remote users to access shared files and directories. Allowing anonymous FTP connections makes user auditing difficult.


    Using accounts that have administrator privileges to log on to FTP risks that the userid and password will be captured on the network and give administrator access to an unauthorized user.'
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'If FTP is not installed on the system, this is not applicable.


      Open Internet Information Services (IIS) Manager.


      Select the server.


      Double-click "FTP Authentication".


      If the "Anonymous Authentication" status is "Enabled", this is a finding.'
  remediation:
    remediation_step: 'Configure the FTP service to prevent anonymous logons.


      Open IIS Manager.


      Select the server.


      Double-click "FTP Authentication".


      Select "Anonymous Authentication".


      Select "Disabled" under "Actions".'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
