- rule_id: STIG-WN25-00-000190
  rule_name: Outdated or unused accounts on Windows Server 2025 must be removed or disabled.
  rule_description: 'Outdated or unused accounts provide penetration points that may go undetected. Inactive accounts must be deleted if no longer necessary or, if still required, disabled until needed.


    Satisfies: SRG-OS-000118-GPOS-00060, SRG-OS-000590-GPOS-00110'
  category: System Configuration
  subcategory: General
