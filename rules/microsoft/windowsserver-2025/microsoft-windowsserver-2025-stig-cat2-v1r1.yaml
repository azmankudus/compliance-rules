- rule_id: STIG-WN25-00-000280
  rule_name: Windows Server 2025 must have a host-based firewall installed and enabled.
  rule_description: 'A firewall provides a line of defense against attack, allowing or blocking inbound and outbound connections based on a set of rules.


    Satisfies: SRG-OS-000480-GPOS-00227, SRG-OS-000480-GPOS-00232'
  category: System Configuration
  subcategory: General
