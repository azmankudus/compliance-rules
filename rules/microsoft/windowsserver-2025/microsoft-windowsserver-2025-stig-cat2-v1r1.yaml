  rule_name: Windows Server 2025 domain controllers must be configured to allow reset of machine account passwords.
  rule_description: Enabling this setting on all domain controllers in a domain prevents domain members from changing their computer account passwords. If these passwords are weak or compromised, the inability to change them may leave these computers vulnerable.
