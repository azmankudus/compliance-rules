- rule_id: STIG-WN25-DC-000060
  rule_name: Windows Server 2025 computer clock synchronization tolerance must be limited to five minutes or less.
  rule_description: 'This setting determines the maximum time difference (in minutes) that Kerberos will tolerate between the time on a client''s clock and the time on a server''s clock while still considering the two clocks synchronous. To prevent replay attacks, Kerberos uses timestamps as part of its protocol definition. For timestamps to work properly, the clocks of the client and the server must be in sync as much as possible.


    Satisfies: SRG-OS-000112-GPOS-00057, SRG-OS-000113-GPOS-00058'
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
