- rule_id: STIG-WN25-SO-000350
  rule_name: Windows Server 2025 users must be required to enter a password to access private keys stored on the computer.
  rule_description: 'If the private key is discovered, an attacker can use the key to authenticate as an authorized user and gain access to the network infrastructure.


    The cornerstone of the PKI is the private key used to encrypt or digitally sign information.


    If the private key is stolen, this will lead to the compromise of the authentication and nonrepudiation gained through PKI because the attacker can use the private key to digitally sign documents and pretend to be the authorized user.


    Both the holders of a digital certificate and the issuing authority must protect the computers, storage devices, or whatever they use to keep the private keys.'
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'If the following registry value does not exist or is not configured as specified, this is a finding:


      Registry Hive: HKEY_LOCAL_MACHINE

      Registry Path: \SOFTWARE\Policies\Microsoft\Cryptography\


      Value Name: ForceKeyProtection


      Type: REG_DWORD

      Value: 0x00000002 (2)'
  remediation:
    remediation_step: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> Security Options >> System cryptography: Force strong key protection for user keys stored on the computer to "User must enter a password each time they use a key".'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
