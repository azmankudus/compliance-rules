- rule_id: STIG-WN25-00-000450
  rule_name: Windows Server 2025 must have orphaned security identifiers (SIDs) removed from user rights.
  rule_description: Accounts or groups given rights on a system may show up as unresolved SIDs for various reasons including deletion of the accounts or groups. If the account or group objects are reanimated, there is a potential they may still have rights no longer intended. Valid domain accounts or groups may also show up as unresolved SIDs if a connection to the domain cannot be established.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "Review the effective User Rights setting in Local Group Policy Editor.\n\nRun gpedit.msc.\n\nNavigate to Local Computer Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment.\n\nReview each User Right listed for any unresolved SIDs to determine whether they are valid, such as due to being temporarily disconnected from the domain. (Unresolved SIDs have the format that begins with \"*S-1-\".)\n\nIf any unresolved SIDs exist and are not for currently valid accounts or groups, this is a finding.\n\nFor server core installations, run the following command:\n\nSecedit /export /areas USER_RIGHTS /cfg c:\\path\\UserRights.txt\n\nThe results in the file identify user right assignments by SID instead of group name. Review the SIDs to determine which are unidentified. A list of typical SIDs\\Groups is below; search Microsoft for articles on well-known SIDs for others. \n\nIf any unresolved SIDs exist and are not for\
      \ currently valid accounts or groups,..."
  remediation:
    remediation_step: Remove any unresolved SIDs found in User Rights assignments that are determined to not be for currently valid accounts or groups by removing the accounts or groups from the appropriate group policy.
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
  - stig
  - cat2
  - windows-server-2025
- rule_id: STIG-WN25-00-000460
  rule_name: Windows Server 2025 systems must have Unified Extensible Firmware Interface (UEFI) firmware and be configured to run in UEFI mode, not Legacy BIOS.
  rule_description: UEFI provides additional security features in comparison to legacy BIOS firmware, including Secure Boot. UEFI is required to support additional security features in Windows, including Virtualization Based Security and Credential Guard. Systems with UEFI that are operating in "Legacy BIOS" mode will not support these security features.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Devices that have UEFI firmware must run in UEFI mode.


      Verify the system firmware is configured to run in UEFI mode, not Legacy BIOS.


      Run "System Information".


      Under "System Summary", if "BIOS Mode" does not display "UEFI", this is a finding.'
  remediation:
    remediation_step: Configure UEFI firmware to run in UEFI mode, not Legacy BIOS mode.
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
