- rule_id: STIG-WN25-AU-000070
  rule_name: Windows Server 2025 must be configured to audit Account Logon - Credential Validation successes.
  rule_description: 'Maintaining an audit trail of system activity logs can help identify configuration errors, troubleshoot service disruptions, and analyze compromises that have occurred, as well as detect attacks. Audit logs are necessary to provide a trail of evidence in case the system or network is compromised. Collecting this data is essential for analyzing the security of information assets and detecting signs of suspicious and unexpected behavior.


    Credential Validation records events related to validation tests on credentials for a user account logon.'
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "Security Option \"Audit: Force audit policy subcategory settings (Windows 7 or later) to override audit policy category settings\" must be set to \"Enabled\" (WN25-SO-000050) for the detailed auditing subcategories to be effective. \n\nUse the \"AuditPol\" tool to review the current Audit Policy configuration.\n\nOpen PowerShell or a command prompt with elevated privileges (\"Run as administrator\").\n\nEnter \"AuditPol /get /category:*\"\n\nCompare the \"AuditPol\" settings with the following.\n\nIf the system does not audit the following, this is a finding:\n\nAccount Logon >> Credential Validation - Success"
  remediation:
    remediation_step: Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >> Advanced Audit Policy Configuration >> System Audit Policies >> Account Logon >> Audit Credential Validation with "Success" selected.
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
  - stig
  - cat2
  - windows-server-2025
