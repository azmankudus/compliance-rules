  rule_name: Windows Server 2025 minimum password age must be configured to at least one day.
  rule_description: Permitting passwords to be changed in immediate succession within the same day allows users to cycle passwords through their history database. This enables users to effectively negate the purpose of mandating periodic password changes.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
