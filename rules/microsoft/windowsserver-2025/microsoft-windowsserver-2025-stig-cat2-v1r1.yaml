- rule_id: STIG-WN25-DC-000040
  rule_name: Windows Server 2025 Kerberos user ticket lifetime must be limited to 10 hours or less.
  rule_description: 'In Kerberos, there are two types of tickets: Ticket Granting Tickets (TGTs) and Service Tickets. Kerberos tickets have a limited lifetime so the time an attacker has to implement an attack is limited. This policy controls how long TGTs can be renewed. With Kerberos, the user''s initial authentication to the domain controller results in a TGT, which is then used to request Service Tickets to resources. Upon startup, each computer gets a TGT before requesting a service ticket to the domain controller and any other computers it needs to access. For services that start up under a specified user account, users must always get a TGT first and then get Service Tickets to all computers and services accessed.


    Satisfies: SRG-OS-000112-GPOS-00057, SRG-OS-000113-GPOS-00058'
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'This applies to domain controllers. It is not applicable for other systems.


      Verify the following is configured in the Default Domain Policy:


      Open "Group Policy Management".


      Navigate to "Group Policy Objects" in the Domain being reviewed (Forest >> Domains >> Domain).


      Right-click the "Default Domain Policy".


      Select "Edit".


      Navigate to Computer Configuration >> Policies >> Windows Settings >> Security Settings >> Account Policies >> Kerberos Policy.


      If the value for "Maximum lifetime for user ticket" is "0" or greater than "10" hours, this is a finding.'
  remediation:
    remediation_step: Configure the policy value in the Default Domain Policy for Computer Configuration >> Policies >> Windows Settings >> Security Settings >> Account Policies >> Kerberos Policy >> Maximum lifetime for user ticket to a maximum of "10" hours but not "0", which equates to "Ticket doesn't expire".
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
