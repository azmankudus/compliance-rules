- rule_id: STIG-WN25-SO-000010
  rule_name: Windows Server 2025 must have the built-in guest account disabled.
  rule_description: A system faces an increased vulnerability threat if the built-in guest account is not disabled. This is a known account that exists on all Windows systems and cannot be deleted. This account is initialized during the installation of the operating system with no password assigned.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Verify the effective setting in Local Group Policy Editor.


      Run gpedit.msc.


      Navigate to Local Computer Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> Security Options.


      If the value for "Accounts: Guest account status" is not set to "Disabled", this is a finding.


      For server core installations, run the following command:


      Secedit /Export /Areas SecurityPolicy /CFG C:\Path\FileName.Txt


      If "EnableGuestAccount" equals "1" in the file, this is a finding.'
  remediation:
    remediation_step: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> Security Options >> Accounts: Guest account status to "Disabled".'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
