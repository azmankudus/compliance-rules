      S-1-5-32-544 (Administrators)


      If the organization has an Auditors group, the assignment of this group the assignment of this group to the user right is not a finding.


      If an application requires this user right, this is not a finding.


      Vendor documentation must support the requirement for having the user right.


      The requirement must be documented with the information...'
  remediation:
    remediation_step: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment >> Manage auditing and security log to include only the following accounts or groups:

      - Administrators.'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
