  rule_description: Microsoft Defender antivirus SmartScreen helps protect systems from programs downloaded from the internet that may be malicious. Enabling SmartScreen can block potentially malicious programs or warn users.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'This is applicable to unclassified systems; for other systems, this is not applicable.


      If the following registry value does not exist or is not configured as specified, this is a finding:


      Registry Hive: HKEY_LOCAL_MACHINE

      Registry Path: \SOFTWARE\Policies\Microsoft\Windows\System\


      Value Name: EnableSmartScreen


      Value Type: REG_DWORD

      Value: 0x00000001 (1)'
  remediation:
    remediation_step: 'Configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components >> File Explorer >> Configure Windows Defender SmartScreen to "Enabled" with either option "Warn" or "Warn and prevent bypass" selected.


      Windows Server 2025 includes duplicate policies for this setting. It can also be configured under Computer Configuration >> Administrative Templates >> Windows Components >> Windows Defender SmartScreen >> Explorer.'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
  - stig
  - cat2
  - windows-server-2025
- rule_id: STIG-WN25-CC-000310
  rule_name: Windows Server 2025 Explorer Data Execution Prevention must be enabled.
  rule_description: Data Execution Prevention provides additional protection by performing checks on memory to help prevent malicious code from running. This setting will prevent Data Execution Prevention from being turned off for File Explorer.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'The default behavior is for Data Execution Prevention to be turned on for File Explorer.


      If the registry value name below does not exist, this is not a finding.


      If it exists and is configured with a value of "0", this is not a finding.


      If it exists and is configured with a value of "1", this is a finding.


      Registry Hive: HKEY_LOCAL_MACHINE

      Registry Path: \SOFTWARE\Policies\Microsoft\Windows\Explorer\


      Value Name: NoDataExecutionPrevention


      Value Type: REG_DWORD

      Value: 0x00000000 (0) (or if the Value Name does not exist)'
  remediation:
    remediation_step: 'The default behavior is for data execution prevention to be turned on for File Explorer.


      To correct this, configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components >> File Explorer >> Turn off Data Execution Prevention for Explorer to "Not Configured" or "Disabled".'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
  - stig
  - cat2
  - windows-server-2025
