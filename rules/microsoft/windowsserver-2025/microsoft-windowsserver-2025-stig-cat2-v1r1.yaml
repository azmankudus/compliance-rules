  rule_description: UAC is a security mechanism for limiting the elevation of privileges, including administrative accounts, unless authorized. This setting configures non-UAC-compliant applications to run in virtualized file and registry entries in per-user locations, allowing them to run.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "UAC requirements are not applicable for Server Core installations (this is the default installation option for Windows Server 2025 versus Server with Desktop Experience).\n\nIf the following registry value does not exist or is not configured as specified, this is a finding:\n\nRegistry Hive: HKEY_LOCAL_MACHINE \nRegistry Path: \\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System\\\n\nValue Name: EnableVirtualization\n\nValue Type: REG_DWORD\nValue: 0x00000001 (1)"
  remediation:
    remediation_step: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> Security Options >> User Account Control: Virtualize file and registry write failures to per-user locations to "Enabled".'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
  - stig
  - cat2
  - windows-server-2025
- rule_id: STIG-WN25-UC-000010
  rule_name: Windows Server 2025 must preserve zone information when saving attachments.
  rule_description: Attachments from outside sources may contain malicious code. Preserving zone of origin (internet, intranet, local, restricted) information on file attachments allows Windows to determine risk.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'The default behavior is for Windows to mark file attachments with their zone information.


      If the registry Value Name below does not exist, this is not a finding.


      If it exists and is configured with a value of "2", this is not a finding.


      If it exists and is configured with a value of "1", this is a finding.


      Registry Hive: HKEY_CURRENT_USER

      Registry Path: \SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Attachments\


      Value Name: SaveZoneInformation


      Value Type: REG_DWORD

      Value: 0x00000002 (2) (or if the Value Name does not exist)'
  remediation:
    remediation_step: 'The default behavior is for Windows to mark file attachments with their zone information.


      To correct this, configure the policy value for User Configuration >> Administrative Templates >> Windows Components >> Attachment Manager >> Do not preserve zone information in file attachments to "Not Configured" or "Disabled".'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
  - stig
  - cat2
  - windows-server-2025
- rule_id: STIG-WN25-UR-000010
  rule_name: The Windows Server 2025 "Access Credential Manager as a trusted caller" user right must not be assigned to any groups or accounts.
  rule_description: 'Inappropriately granting user rights provides system, administrative, and other high-level capabilities.


    Accounts with the "Access Credential Manager as a trusted caller" user right may be able to retrieve the credentials of other accounts from Credential Manager.'
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Verify the effective setting in Local Group Policy Editor.


      Run gpedit.msc.


      Navigate to Local Computer Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment.


      If any accounts or groups are granted the "Access Credential Manager as a trusted caller" user right, this is a finding.


      For server core installations, run the following command:


      Secedit /Export /Areas User_Rights /cfg c:\path\filename.txt


      Review the text file.


      If any SIDs are granted the "SeTrustedCredManAccessPrivilege" user right, this is a finding.'
  remediation:
    remediation_step: Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment >> Access Credential Manager as a trusted caller to be defined but containing no entries (blank).
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
  - stig
  - cat2
  - windows-server-2025
- rule_id: STIG-WN25-UR-000030
  rule_name: The Windows Server 2025 "Allow log on locally" user right must only be assigned to the Administrators group.
  rule_description: 'Inappropriately granting user rights provides system, administrative, and other high-level capabilities.


    Accounts with the "Allow log on locally" user right can log on interactively to a system.'
