  rule_name: Windows Server 2025 Event Viewer must be protected from unauthorized modification and deletion.
  rule_description: 'Protecting audit information also includes identifying and protecting the tools used to view and manipulate log data. Therefore, protecting audit tools is necessary to prevent unauthorized operation on audit information.


    Operating systems providing tools to interface with audit information will leverage user permissions and roles identifying the user accessing the tools and the corresponding rights the user enjoys to make access decisions regarding the modification or deletion of audit tools.


    Satisfies: SRG-OS-000257-GPOS-00098, SRG-OS-000258-GPOS-00099'
  category: System Configuration
  subcategory: General
