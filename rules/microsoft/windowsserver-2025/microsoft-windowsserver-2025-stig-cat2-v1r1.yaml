- rule_id: STIG-WN25-00-000200
  rule_name: Windows Server 2025 accounts must require passwords.
  rule_description: The lack of password protection enables anyone to gain access to the information system, which opens a backdoor opportunity for intruders to compromise the system as well as other resources. Accounts on a system must require passwords.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Review the password required status for enabled user accounts.


      Open PowerShell.


      Domain Controllers:


      Enter "Get-Aduser -Filter * -Properties Passwordnotrequired |FT Name, Passwordnotrequired, Enabled".


      Exclude disabled accounts (e.g., DefaultAccount, Guest) and Trusted Domain Objects (TDOs).


      If "Passwordnotrequired" is "True" or blank for any enabled user account, this is a finding.


      Member servers and stand-alone or nondomain-joined systems:


      Enter ''Get-CimInstance -Class Win32_Useraccount -Filter "PasswordRequired=False and LocalAccount=True" | FT Name, PasswordRequired, Disabled, LocalAccount''.


      Exclude disabled accounts (e.g., DefaultAccount, Guest).


      If any enabled user accounts are returned with a "PasswordRequired" status of "False", this is a finding.'
  remediation:
    remediation_step: 'Configure all enabled accounts to require passwords.


      The password required flag can be set by entering the following on a command line: "Net user [username] /passwordreq:yes", substituting [username] with the name of the user account.'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
  - stig
  - cat2
  - windows-server-2025
- rule_id: STIG-WN25-00-000210
  rule_name: Windows Server 2025 passwords must be configured to expire.
  rule_description: Passwords that do not expire or are reused increase the exposure of a password with greater probability of being discovered or cracked.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Review the password never expires status for enabled user accounts.


      Open PowerShell.


      Domain Controllers:


      Enter "Search-ADAccount -PasswordNeverExpires -UsersOnly | FT Name, PasswordNeverExpires, Enabled".


      Exclude application accounts, disabled accounts (e.g., DefaultAccount, Guest), and the krbtgt account.


      If any enabled user accounts are returned with a "PasswordNeverExpires" status of "True", this is a finding.


      Member servers and stand-alone or nondomain-joined systems:


      Enter ''Get-CimInstance -Class Win32_Useraccount -Filter "PasswordExpires=False and LocalAccount=True" | FT Name, PasswordExpires, Disabled, LocalAccount''.


      Exclude application accounts and disabled accounts (e.g., DefaultAccount, Guest).


      If any enabled user accounts are returned with a "PasswordExpires" status of "False", this is a finding.'
  remediation:
    remediation_step: 'Configure all enabled user account passwords to expire.


      Uncheck "Password never expires" for all enabled user accounts in Active Directory Users and Computers for domain accounts and Users in Computer Management for member servers and stand-alone or nondomain-joined systems. Document any exceptions with the information system security officer (ISSO).'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
  - stig
  - cat2
  - windows-server-2025
- rule_id: STIG-WN25-00-000220
  rule_name: Windows Server 2025 system files must be monitored for unauthorized changes.
  rule_description: Monitoring system files for changes against a baseline on a regular basis may help detect the possible introduction of malicious code on a system.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Determine whether the system is monitored for unauthorized changes to system files (e.g., *.exe, *.bat, *.com, *.cmd, and *.dll) against a baseline on a weekly basis.


      If system files are not monitored for unauthorized changes, this is a finding.


      An approved and properly configured solution will contain both a list of baselines that includes all system file locations and a file comparison task that is scheduled to run at least weekly.'
  remediation:
    remediation_step: Monitor the system for unauthorized changes to system files (e.g., *.exe, *.bat, *.com, *.cmd, and *.dll) against a baseline on a weekly basis. This can be done with the use of various monitoring tools.
    rollback_supported: true
    reboot_required: false
