- rule_id: STIG-WN25-DC-000430
  rule_name: The password for the krbtgt account on a domain must be reset at least every 180 days.
  rule_description: 'The krbtgt account acts as a service account for the Kerberos Key Distribution Center (KDC) service. The account and password are created when a domain is created and the password is typically not changed. If the krbtgt account is compromised, attackers can create valid Kerberos Ticket Granting Tickets (TGT).


    The password must be changed twice to effectively remove the password history. Changing once, waiting for replication to complete and the amount of time equal to or greater than the maximum Kerberos ticket lifetime, and changing again reduces the risk of issues.'
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "This requirement is applicable to domain controllers; it is not applicable for other systems. \n\nOpen \"Windows PowerShell\".\n\nEnter \"Get-ADUser krbtgt -Property PasswordLastSet\".\n\nIf the \"PasswordLastSet\" date is more than 180 days old, this is a finding."
  remediation:
    remediation_step: 'Reset the password for the krbtgt account a least every 180 days. The password must be changed twice to effectively remove the password history. Changing once, waiting for replication to complete, and changing again reduces the risk of issues. Changing twice in rapid succession forces clients to reauthenticate (including application services) but is desired if a compromise is suspected.


      PowerShell scripts are available to accomplish this such as at the following link:


      https://gallery.technet.microsoft.com/Reset-the-krbtgt-account-581a9e51


      Open "Active Directory Users and Computers" (available from various menus or run "dsa.msc").


      Select "Advanced Features" in the "View" menu if not previously selected.


      Select the "Users" node.


      Right-click on the krbtgt account and select "Reset password".


      Enter a password that meets password complexity requirements.


      Clear the "User must change password at next logon" check box.


      The system will automatically change this to a system-generated...'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
  - stig
  - cat2
  - windows-server-2025
- rule_id: STIG-WN25-MS-000020
  rule_name: Windows Server 2025 local administrator accounts must have their privileged token filtered to prevent elevated privileges from being used over the network on domain-joined member servers.
  rule_description: 'A compromised local administrator account can provide means for an attacker to move laterally between domain systems.


    With User Account Control enabled, filtering the privileged token for local administrator accounts will prevent the elevated privileges of these accounts from being used over the network.'
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'This applies to member servers. For domain controllers and stand-alone or nondomain-joined systems, this is not applicable.


      If the following registry value does not exist or is not configured as specified, this is a finding:


      Registry HiveHKEY_LOCAL_MACHINE

      Registry Path\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System


      Value NameLocalAccountTokenFilterPolicy


      TypeREG_DWORD

      Value: 0x00000000 (0)


      This setting may cause issues with some network scanning tools if local administrative accounts are used remotely. Scans must use domain accounts where possible. If a local administrative account must be used, temporarily enabling the privileged token by configuring the registry value to "1" may be required.'
  remediation:
    remediation_step: 'Configure the policy value for Computer Configuration >> Administrative Templates >> MS Security Guide >> Apply UAC restrictions to local accounts on network logons to "Enabled".


      This policy setting requires the installation of the SecGuide custom templates included with the STIG package. "SecGuide.admx" and " SecGuide.adml" must be copied to the \Windows\PolicyDefinitions and \Windows\PolicyDefinitions\en-US directories respectively.'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
  - stig
  - cat2
  - windows-server-2025
