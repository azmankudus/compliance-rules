- rule_id: STIG-WN25-MS-000080
  rule_name: The Windows Server 2025 "Deny access to this computer from the network" user right on domain-joined member servers must be configured to prevent access from highly privileged domain accounts and local accounts and from unauthenticated access on all systems.
  rule_description: 'Inappropriately granting user rights provides system, administrative, and other high-level capabilities.


    The "Deny access to this computer from the network" user right defines the accounts that are prevented from logging on from the network.


    In an Active Directory Domain, denying logons to the Enterprise Admins and Domain Admins groups on lower-trust systems helps mitigate the risk of privilege escalation from credential theft attacks, which could lead to the compromise of an entire domain.


    Local accounts on domain-joined systems must also be assigned this right to decrease the risk of lateral movement resulting from credential theft attacks.


    The Guests group must be assigned this right to prevent unauthenticated access.'
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'This applies to member servers and stand-alone or nondomain-joined systems. A separate version applies to domain controllers.


      Verify the effective setting in Local Group Policy Editor.


      Run gpedit.msc.


      Navigate to Local Computer Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment.


      If the following accounts or groups are not defined for the "Deny access to this computer from the network" user right, this is a finding:


      Domain Systems Only:

      - Enterprise Admins group.

      - Domain Admins group.

      - "Local account and member of Administrators group" or "Local account" (see Note below).


      All Systems:

      - Guests group.


      For server core installations, run the following command:


      Secedit /Export /Areas User_Rights /cfg c:\path\filename.txt


      Review the text file.


      If the following SIDs are not defined for the "SeDenyNetworkLogonRight" user right, this is a finding.


      Domain Systems Only:

      S-1-5-root domain-519 (Enterprise Admins)

      S-1...'
  remediation:
    remediation_step: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment >> Deny access to this computer from the network to include the following:


      Domain Systems Only:

      - Enterprise Admins group.

      - Domain Admins group.

      - "Local account and member of Administrators group" or "Local account" (see Note below).


      All Systems:

      - Guests group.


      Note: These are built-in security groups. "Local account" is more restrictive but may cause issues on servers such as systems that provide failover clustering.'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
