rules:
- rule_id: STIG-WN25-00-000001
  rule_name: Windows Server 2025 must install security-relevant software updates within 30 days unless the time period is directed by an authoritative source (e.g., IAVM, CTOs, DTMs, STIGs).
  rule_description: Security flaws with operating systems are discovered daily. Vendors are constantly updating and patching their products to address newly discovered security vulnerabilities. Organizations (including any contractor to the organization) are required to promptly install security-relevant software updates (e.g., patches, service packs, and hot fixes). Flaws discovered during security assessments, continuous monitoring, incident response activities, or information system error handling must also be addressed expeditiously.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "Review the operating system documentation and configuration to determine if the system checks in with a patch management system to install security-relevant software updates within a timeframe directed by an authoritative source. \n\nIf the operating system does not install security-relevant patches within the time period directed by the authoritative source, this is a finding."
  remediation:
    remediation_step: Configure the operating system to use a patch management system to ensure security-relevant updates are installed within the time period directed by the authoritative source.
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
  - stig
  - cat2
  - windows-server-2025
- rule_id: STIG-WN25-00-000002
  rule_name: Windows Server 2025 must prohibit the use or connection of unauthorized hardware components.
  rule_description: Hardware components provide the foundation for organizational systems and the platform for the execution of authorized software programs. Managing the inventory of hardware components and controlling which hardware components are permitted to be installed or connected to organizational systems is essential to provide adequate security.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Verify the operating system is configured to prohibit the use or connection of unauthorized hardware components.


      If the operating system is using undocumented or unapproved hardware, this is a finding.'
  remediation:
    remediation_step: Configure the operating system to prohibit the use or connection of unauthorized hardware components. Remove any hardware that is not documented or not approved by the information system security officer (ISSO) or information system security manager (ISSM).
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
  - stig
  - cat2
  - windows-server-2025
- rule_id: STIG-WN25-00-000010
  rule_name: Windows Server 2025 users with administrative privileges must have separate accounts for administrative duties and normal operational tasks.
  rule_description: Using a privileged account to perform routine functions makes the computer vulnerable to malicious software inadvertently introduced during a session that has been granted full privileges.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "Verify each user with administrative privileges has been assigned a unique administrative account separate from their standard user account. \n\nIf users with administrative privileges do not have separate accounts for administrative functions and standard user functions, this is a finding."
  remediation:
    remediation_step: Ensure each user with administrative privileges has a separate account for user duties and one for privileged duties.
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
  - stig
  - cat2
  - windows-server-2025
- rule_id: STIG-WN25-00-000020
  rule_name: Windows Server 2025 passwords for the built-in Administrator account must be changed at least every 60 days.
  rule_description: 'The longer a password is in use, the greater the opportunity for someone to gain unauthorized knowledge of the password. The built-in Administrator account is not generally used and its password may not be changed as frequently as necessary. Changing the password for the built-in Administrator account on a regular basis will limit its exposure.


    It is highly recommended to use Microsoft''s Local Administrator Password Solution (LAPS). Domain-joined systems can configure this to occur more frequently. LAPS will change the password every 30 days by default. The authorizing official (AO) still has the overall authority to use another equivalent capability to accomplish the check.'
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "If there are no enabled local Administrator accounts, this is not applicable.\n\nReview the password last set date for the enabled local Administrator account.\n\nOn the stand-alone or domain-joined server:\n\nOpen PowerShell.\n\nEnter \"Get-LocalUser | Where-Object {$_.SID -like \"*500\"} | ForEach-Object ($_.PasswordLastSet){\"$($_.Name) password is: $([int]((Get-Date) - $_.PasswordLastSet).TotalDays) days old\"}\".\n\nIf the \"PasswordLastSet\" date is greater than \"60\" days old for the local Administrator account for administering the computer, this is a finding.\n\nVerify LAPS is configured and operational.\n\nIf the system is a stand-alone member server, the LAPS portion of this requirement is not applicable.\n\nNavigate to Local Computer Policy >> Computer Configuration >> Administrative Templates >> System >> LAPS >> Password Settings >> Set to enabled. Password Complexity, large letters + small letters + numbers + special, Password Length 14, Password Age\
      \ 60. \n\nIf not configured as shown, this is ..."
  remediation:
    remediation_step: 'Change the built-in Administrator account password at least every 60 days.


      It is highly recommended to use Microsoft''s LAPS, which may be used on domain-joined member servers to accomplish this. The AO still has the overall authority to use another equivalent capability to accomplish the check.'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
  - stig
  - cat2
  - windows-server-2025
- rule_id: STIG-WN25-00-000040
  rule_name: Windows Server 2025 members of the Backup Operators group must have separate accounts for backup duties and normal operational tasks.
  rule_description: Backup Operators are able to read and write to any file in the system, regardless of the rights assigned to it. Backup and restore rights permit users to circumvent the file access restrictions present on NTFS disk drives for backup and restore purposes. Members of the Backup Operators group must have separate logon accounts for performing backup duties.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'If no accounts are members of the Backup Operators group, this is not applicable.


      Verify users with accounts in the Backup Operators group have a separate user account for backup functions and for performing normal user tasks.


      If users with accounts in the Backup Operators group do not have separate accounts for backup functions and standard user functions, this is a finding.'
  remediation:
    remediation_step: Ensure each member of the Backup Operators group has separate accounts for backup functions and standard user functions.
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
  - stig
  - cat2
  - windows-server-2025
- rule_id: STIG-WN25-00-000050
  rule_name: Windows Server 2025 manually managed application account passwords must be at least 15 characters in length.
  rule_description: Application/service account passwords must be of sufficient length to prevent being easily cracked. Application/service accounts that are manually managed must have passwords at least 15 characters in length.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Determine if manually managed application/service accounts exist. If none exist, this is not applicable.


      Verify the organization has a policy to ensure passwords for manually managed application/service accounts are at least 15 characters in length.


      If such a policy does not exist or has not been implemented, this is a finding.'
  remediation:
    remediation_step: Establish a policy that requires application/service account passwords that are manually managed to be at least 15 characters in length. Ensure the policy is enforced.
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
  - stig
  - cat2
  - windows-server-2025
- rule_id: STIG-WN25-00-000060
  rule_name: Windows Server 2025 manually managed application account passwords must be changed at least annually or when a system administrator with knowledge of the password leaves the organization.
  rule_description: Setting application account passwords to expire may cause applications to stop functioning. However, not changing them on a regular basis exposes them to attack. If managed service accounts are used, this alleviates the need to manually change application account passwords.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Determine if manually managed application/service accounts exist. If none exist, this is not applicable.


      If passwords for manually managed application/service accounts are not changed at least annually or when an administrator with knowledge of the password leaves the organization, this is a finding.


      Identify manually managed application/service accounts.


      To determine the date a password was last changed for domain controllers:


      Open PowerShell.


      Enter "Get-AdUser -Identity [application account name] -Properties PasswordLastSet | FT Name, PasswordLastSet", where [application account name] is the name of the manually managed application/service account.


      If the "PasswordLastSet" date is more than one year old, this is a finding.


      For member servers and stand-alone or nondomain-joined systems:


      Open command prompt.


      Enter ''Net User [application account name] | Find /i "Password Last Set"'', where [application account name] is the name of the manually managed application/service acco...'
  remediation:
    remediation_step: 'Change passwords for manually managed application/service accounts at least annually or when an administrator with knowledge of the password leaves the organization.


      It is recommended that system-managed service accounts be used whenever possible.'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
  - stig
  - cat2
  - windows-server-2025
- rule_id: STIG-WN25-00-000070
  rule_name: Windows Server 2025 shared user accounts must not be permitted.
  rule_description: Shared accounts (accounts where two or more people log on with the same user identification) do not provide adequate identification and authentication. There is no way to provide for nonrepudiation or individual accountability for system access and resource usage.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Determine whether any shared accounts exist. If no shared accounts exist, this is not applicable.


      Shared accounts, such as required by an application, may be approved by the organization. This must be documented with the information system security officer (ISSO). Documentation must include the reason for the account, who has access to the account, and how the risk of using the shared account is mitigated to include monitoring account activity.


      If unapproved shared accounts exist, this is a finding.'
  remediation:
    remediation_step: 'Remove unapproved shared accounts from the system.


      Document required shared accounts with the ISSO. Documentation must include the reason for the account, who has access to the account, and how the risk of using the shared account is mitigated to include monitoring account activity.'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
  - stig
  - cat2
  - windows-server-2025
- rule_id: STIG-WN25-00-000080
  rule_name: Windows Server 2025 must employ a deny-all, permit-by-exception policy to allow the execution of authorized software programs.
  rule_description: 'Using an allowlist provides a configuration management method to allow the execution of only authorized software. Using only authorized software decreases risk by limiting the number of potential vulnerabilities.


    The organization must identify authorized software programs and only permit execution of authorized software. The process used to identify software programs that are authorized to execute on organizational information systems is commonly referred to as allowlisting.'
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Verify the operating system employs a deny-all, permit-by-exception policy to allow the execution of authorized software programs.


      If an application allowlisting program is not in use on the system, this is a finding.


      Configuration of allowlisting applications will vary by the program.


      AppLocker is a allowlisting application built in to Windows Server. A deny-by-default implementation is initiated by enabling any AppLocker rules within a category, only allowing what is specified by defined rules.


      If AppLocker is used, perform the following to view the configuration of AppLocker:


      Open PowerShell.


      If the AppLocker PowerShell module has not been imported previously, execute the following first:


      Import-Module AppLocker


      Execute the following command, substituting c:\temp\file.xml with a location and file name appropriate for the system:


      Get-AppLockerPolicy -Effective -XML > c:\temp\file.xml


      This will produce an XML file with the effective settings that can be viewed in a browse...'
  remediation:
    remediation_step: 'Configure an application allowlisting program to employ a deny-all, permit-by-exception policy to allow the execution of authorized software programs.


      Configuration of allowlisting applications will vary by the program. AppLocker is a allowlisting application built in to Windows Server.


      If AppLocker is used, it is configured through group policy in Computer Configuration >> Windows Settings >> Security Settings >> Application Control Policies >> AppLocker.


      Implementation guidance for AppLocker is available in the NSA paper "Application Whitelisting using Microsoft AppLocker" at the following link:

      https://www.iad.gov/iad/library/ia-guidance/tech-briefs/application-whitelisting-using-microsoft-applocker.cfm'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
  - stig
  - cat2
  - windows-server-2025
- rule_id: STIG-WN25-00-000090
  rule_name: Windows Server 2025 domain-joined systems must have a Trusted Platform Module (TPM) enabled and ready for use.
  rule_description: Credential Guard uses virtualization-based security to protect data that could be used in credential theft attacks if compromised. A number of system requirements must be met for Credential Guard to be configured and enabled properly. Without a TPM enabled and ready for use, Credential Guard keys are stored in a less secure method using software.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'For stand-alone or nondomain-joined systems, this is not applicable.


      Verify the system has a TPM and it is ready for use.


      Run "tpm.msc".


      Review the sections in the center pane.


      "Status" must indicate it has been configured with a message such as "The TPM is ready for use" or "The TPM is on and ownership has been taken".


      TPM Manufacturer Information - Specific Version = 2.0 or 1.2


      If a TPM is not found or is not ready for use, this is a finding.'
  remediation:
    remediation_step: 'Ensure domain-joined systems have a TPM that is configured for use. (Versions 2.0 or 1.2 support Credential Guard.)


      The TPM must be enabled in the firmware.


      Run "tpm.msc" for configuration options in Windows.'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
  - stig
  - cat2
  - windows-server-2025
- rule_id: STIG-WN25-00-000110
  rule_name: Windows Server 2025 must use an antivirus program.
  rule_description: Malicious software can establish a base on individual desktops and servers. Employing an automated mechanism to detect this type of software will aid in elimination of the software from the operating system.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Verify an antivirus solution is installed on the system. The antivirus solution may be bundled with an approved host-based security solution.


      If there is no antivirus solution installed on the system, this is a finding.


      Verify if Microsoft Defender antivirus is in use or enabled:


      Open PowerShell.


      Enter "get-service | where {$_.DisplayName -Like "*Defender*"} | Select Status,DisplayName"


      Verify if third-party antivirus is in use or enabled:


      Open PowerShell.


      Enter "get-service | where {$_.DisplayName -Like "*mcafee*"} | Select Status,DisplayName


      Enter "get-service | where {$_.DisplayName -Like "*symantec*"} | Select Status,DisplayName'
  remediation:
    remediation_step: 'If no antivirus software is in use, install Microsoft Defender or third-party antivirus.


      Open PowerShell.


      Enter "Install-WindowsFeature -Name Windows-Defender".


      For third-party antivirus, install per antivirus instructions and disable Windows Defender.


      Open PowerShell.


      Enter "Uninstall-WindowsFeature -Name Windows-Defender".'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
  - stig
  - cat2
  - windows-server-2025
- rule_id: STIG-WN25-00-000120
  rule_name: Windows Server 2025 must have a host-based intrusion detection and prevention service (IDPS) installed.
  rule_description: A properly configured host-based intrusion detection system (HIDS) or host-based intrusion prevention system (HIPS) provides another level of defense against unauthorized access to critical servers. With proper configuration and logging enabled, such a system can stop and/or alert for many attempts to gain unauthorized access to resources.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "Determine whether there is a host based intrusion detection and prevention service on each server. \n\nThis requirement is not applicable on a system that has the role as the IDPS. However, this exception must be documented with the information system security officer (ISSO).\n\nIf a host-based IDPS is not installed on the system, this is a finding."
  remediation:
    remediation_step: Install a host-based IDPS on each server.
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
  - stig
  - cat2
  - windows-server-2025
- rule_id: STIG-WN25-00-000140
  rule_name: Windows Server 2025 permissions for the system drive root directory (usually C:\) must conform to minimum requirements.
  rule_description: 'Changing the system''s file and directory permissions allows the possibility of unauthorized and anonymous modification to the operating system and installed applications.


    The default permissions are adequate when the Security Option "Network access: Let Everyone permissions apply to anonymous users" is set to "Disabled" (WN25-SO-000240).


    Satisfies: SRG-OS-000312-GPOS-00122, SRG-OS-000312-GPOS-00123, SRG-OS-000312-GPOS-00124'
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'The default permissions are adequate when the Security Option "Network access: Let Everyone permissions apply to anonymous users" is set to "Disabled" (WN25-SO-000240).


      Review the permissions for the system drive''s root directory (usually C:\). Nonprivileged groups such as Users or Authenticated Users must not have greater than "Read & execute" permissions except where noted as defaults. Individual accounts must not be used to assign permissions.


      If permissions are not as restrictive as the default permissions listed below, this is a finding.


      Viewing in File Explorer:


      View the Properties of the system drive''s root directory.


      Select the "Security" tab, and then click "Advanced".


      Default permissions:

      C:\

      Type - "Allow" for all

      Inherited from - "None" for all


      Principal - Access - Applies to


      SYSTEM - Full control - This folder, subfolders, and files

      Administrators - Full control - This folder, subfolders, and files

      Users - Read & execute - This folder, subfolders, and files

      User...'
  remediation:
    remediation_step: 'Maintain the default permissions for the system drive''s root directory and configure the Security Option "Network access: Let Everyone permissions apply to anonymous users" to "Disabled" (WN25-SO-000240).


      Default Permissions

      C:\

      Type - "Allow" for all

      Inherited from - "None" for all


      Principal - Access - Applies to


      SYSTEM - Full control - This folder, subfolders, and files

      Administrators - Full control - This folder, subfolders, and files

      Users - Read & execute - This folder, subfolders, and files

      Users - Create folders/append data - This folder and subfolders

      Users - Create files/write data - Subfolders only

      CREATOR OWNER - Full Control - Subfolders and files only'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
  - stig
  - cat2
  - windows-server-2025
- rule_id: STIG-WN25-00-000150
  rule_name: Windows Server 2025 permissions for program file directories must conform to minimum requirements.
  rule_description: 'Changing the system''s file and directory permissions allows the possibility of unauthorized and anonymous modification to the operating system and installed applications.


    The default permissions are adequate when the Security Option "Network access: Let Everyone permissions apply to anonymous users" is set to "Disabled" (WN25-SO-000240).


    Satisfies: SRG-OS-000312-GPOS-00122, SRG-OS-000312-GPOS-00123, SRG-OS-000312-GPOS-00124'
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'The default permissions are adequate when the Security Option "Network access: Let Everyone permissions apply to anonymous users" is set to "Disabled" (WN25-SO-000240).


      Review the permissions for the program file directories (Program Files and Program Files [x86]). Nonprivileged groups such as Users or Authenticated Users must not have greater than "Read & execute" permissions. Individual accounts must not be used to assign permissions.


      If permissions are not as restrictive as the default permissions listed below, this is a finding.


      Viewing in File Explorer:


      For each folder, view the Properties.


      Select the "Security" tab, and then click "Advanced".


      Default permissions:

      \Program Files and \Program Files (x86)

      Type - "Allow" for all

      Inherited from - "None" for all


      Principal - Access - Applies to


      TrustedInstaller - Full control - This folder and subfolders

      SYSTEM - Modify - This folder only

      SYSTEM - Full control - Subfolders and files only

      Administrators - Modify - This folder ...'
  remediation:
    remediation_step: 'Maintain the default permissions for the program file directories and configure the Security Option "Network access: Let Everyone permissions apply to anonymous users" to "Disabled" (WN25-SO-000240).


      Default permissions:

      \Program Files and \Program Files (x86)

      Type - "Allow" for all

      Inherited from - "None" for all


      Principal - Access - Applies to


      TrustedInstaller - Full control - This folder and subfolders

      SYSTEM - Modify - This folder only

      SYSTEM - Full control - Subfolders and files only

      Administrators - Modify - This folder only

      Administrators - Full control - Subfolders and files only

      Users - Read & execute - This folder, subfolders, and files

      CREATOR OWNER - Full control - Subfolders and files only

      ALL APPLICATION PACKAGES - Read & execute - This folder, subfolders, and files

      ALL RESTRICTED APPLICATION PACKAGES - Read & execute - This folder, subfolders, and files'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
  - stig
