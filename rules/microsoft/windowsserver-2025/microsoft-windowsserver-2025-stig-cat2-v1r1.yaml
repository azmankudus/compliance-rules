  - cat2
  - windows-server-2025
- rule_id: STIG-WN25-00-000470
  rule_name: Windows Server 2025 must have Secure Boot enabled.
  rule_description: Secure Boot is a standard that ensures systems boot only to a trusted operating system. Secure Boot is required to support additional security features in Windows, including Virtualization Based Security and Credential Guard. If Secure Boot is turned off, these security features will not function.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Devices that have UEFI firmware must have Secure Boot enabled.


      Run "System Information".


      Under "System Summary", if "Secure Boot State" does not display "On", this is a finding.


      On server core installations, run the following PowerShell command:


      Confirm-SecureBootUEFI


      If a value of "True" is not returned, this is a finding.'
  remediation:
    remediation_step: Enable Secure Boot in the system firmware.
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
