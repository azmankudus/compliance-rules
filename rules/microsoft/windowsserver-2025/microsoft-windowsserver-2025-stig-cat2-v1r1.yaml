- rule_id: STIG-WN25-DC-000280
  rule_name: Windows Server 2025 domain controllers must have a PKI server certificate.
  rule_description: Domain controllers are part of the chain of trust for PKI authentications. Without the appropriate certificate, the authenticity of the domain controller cannot be verified. Domain controllers must have a server certificate to establish authenticity as part of PKI authentications in the domain.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'This applies to domain controllers. It is not applicable for other systems.


      Run "MMC".


      Select "Add/Remove Snap-in" from the "File" menu.


      Select "Certificates" in the left pane, and then click "Add >".


      Select "Computer Account", and then click "Next".


      Select the appropriate option for "Select the computer you want this snap-in to manage", and then click "Finish".


      Click "OK".


      Select and expand the "Certificates (Local Computer)" entry in the left pane.


      Select and expand the "Personal" entry in the left pane.


      Select the "Certificates" entry in the left pane.


      If no certificate for the domain controller exists in the right pane, this is a finding.'
  remediation:
    remediation_step: Obtain a server certificate for the domain controller.
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
  - stig
  - cat2
  - windows-server-2025
- rule_id: STIG-WN25-DC-000310
  rule_name: Windows Server 2025 Active Directory (AD) user accounts, including administrators, must be configured to require the use of a common access card (CAC), Personal Identity Verification (PIV)-compliant hardware token, or Alternate Logon Token (ALT) for user authentication.
  rule_description: 'Smart cards such as the CAC support a two-factor authentication technique. This provides a higher level of trust in the asserted identity than use of the username and password for authentication.


    Satisfies: SRG-OS-000105-GPOS-00052, SRG-OS-000106-GPOS-00053, SRG-OS-000107-GPOS-00054, SRG-OS-000108-GPOS-00055, SRG-OS-000375-GPOS-00160, SRG-OS-000705-GPOS-00150'
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'This applies to domain controllers. It is not applicable for other systems.


      Open PowerShell.


      Enter the following:


      "Get-ADUser -Filter {(Enabled -eq $True) -and (SmartcardLogonRequired -eq $False)} | FT Name"

      ("DistinguishedName" may be substituted for "Name" for more detailed output.)


      If any user accounts, including administrators, are listed, this is a finding.


      Alternately:


      To view sample accounts in "Active Directory Users and Computers" (available from various menus or run "dsa.msc"):


      Select the Organizational Unit (OU) where the user accounts are located. (By default, this is the Users node; however, accounts may be under other organization-defined OUs.)


      Right-click the sample user account and select "Properties".


      Select the "Account" tab.


      If any user accounts, including administrators, do not have "Smart card is required for interactive logon" checked in the "Account Options" area, this is a finding.'
  remediation:
    remediation_step: 'Configure all user accounts, including administrator accounts, in AD to enable the option "Smart card is required for interactive logon".


      Run "Active Directory Users and Computers" (available from various menus or run "dsa.msc").


      Select the OU where the user accounts are located. (By default, this is the Users node; however, accounts may be under other organization-defined OUs.)


      Right-click the user account and select "Properties".


      Select the "Account" tab.


      Check "Smart card is required for interactive logon" in the "Account Options" area.'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
  - stig
  - cat2
  - windows-server-2025
- rule_id: STIG-WN25-DC-000320
  rule_name: Windows Server 2025 domain controllers must require LDAP access signing.
  rule_description: 'Unsigned network traffic is susceptible to man-in-the-middle attacks, where an intruder captures packets between the server and the client and modifies them before forwarding them to the client. In the case of an LDAP server, this means that an attacker could cause a client to make decisions based on false records from the LDAP directory. The risk of an attacker pulling this off can be decreased by implementing strong physical security measures to protect the network infrastructure. Furthermore, implementing Internet Protocol security (IPsec) authentication header (AH) mode, which performs mutual authentication and packet integrity for IP traffic, can make all types of man-in-the-middle attacks extremely difficult.


    Satisfies: SRG-OS-000423-GPOS-00187, SRG-OS-000424-GPOS-00188'
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "This applies to domain controllers. It is not applicable for other systems.\n\nIf the following registry value does not exist or is not configured as specified, this is a finding:\n\nRegistry Hive: HKEY_LOCAL_MACHINE \nRegistry Path: \\SYSTEM\\CurrentControlSet\\Services\\NTDS\\Parameters\\\n\nValue Name: LDAPServerIntegrity\n\nValue Type: REG_DWORD\nValue: 0x00000002 (2)"
  remediation:
    remediation_step: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> Security Options >> Domain controller: LDAP server signing requirements Enforcement to "Not Configured" or "Enabled".'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
  - stig
  - cat2
  - windows-server-2025
