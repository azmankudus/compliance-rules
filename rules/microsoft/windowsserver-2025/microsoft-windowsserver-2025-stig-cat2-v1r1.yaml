- rule_id: STIG-WN25-00-000380
  rule_name: Windows Server 2025 must not have the Server Message Block (SMB) v1 protocol installed.
  rule_description: SMBv1 is a legacy protocol that uses the MD5 algorithm as part of SMB. MD5 is known to be vulnerable to a number of attacks such as collision and preimage attacks and is not FIPS compliant.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Different methods are available to disable SMBv1 on Windows Server 2025. This is the preferred method, however if WN25-00-000390 and WN25-00-000400 are configured, this is not applicable.


      Open Windows PowerShell with elevated privileges (run as administrator).


      Enter "Get-WindowsFeature -Name FS-SMB1".


      If "Installed State" is "Installed", this is a finding.


      An Installed State of "Available" or "Removed" is not a finding.'
  remediation:
    remediation_step: 'Uninstall the SMBv1 protocol.


      Open Windows PowerShell with elevated privileges (run as administrator).


      Enter "Uninstall-WindowsFeature -Name FS-SMB1 -Restart".

      (Omit the Restart parameter if an immediate restart of the system cannot be done.)


      Alternately:


      Start Server Manager.


      Select the server with the feature.


      Scroll down to "ROLES AND FEATURES" in the right pane.


      Select "Remove Roles and Features" from the drop-down "TASKS" list.


      Select the appropriate server on the "Server Selection" page and click "Next".


      Deselect "SMB 1.0/CIFS File Sharing Support" on the "Features" page.


      Click "Next" and "Remove" as prompted.'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
  - stig
  - cat2
  - windows-server-2025
- rule_id: STIG-WN25-00-000390
  rule_name: Windows Server 2025 must have the Server Message Block (SMB) v1 protocol disabled on the SMB server.
  rule_description: SMBv1 is a legacy protocol that uses the MD5 algorithm as part of SMB. MD5 is known to be vulnerable to a number of attacks such as collision and preimage attacks, as well as not being FIPS compliant.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Different methods are available to disable SMBv1 on Windows Server 2025, if WN25-00-000380 is configured, this is not applicable.


      If the following registry value does not exist or is not configured as specified, this is a finding:


      Registry Hive: HKEY_LOCAL_MACHINE

      Registry Path: \SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters\


      Value Name: SMB1


      Type: REG_DWORD

      Value: 0x00000000 (0)'
  remediation:
    remediation_step: 'Configure the policy value for Computer Configuration >> Administrative Templates >> MS Security Guide >> Configure SMBv1 Server to "Disabled".


      Restart the system for the change to take effect.


      This policy setting requires the installation of the SecGuide custom templates included with the STIG package. "SecGuide.admx" and "SecGuide.adml" must be copied to the \Windows\PolicyDefinitions and \Windows\PolicyDefinitions\en-US directories respectively.'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
  - stig
  - cat2
  - windows-server-2025
