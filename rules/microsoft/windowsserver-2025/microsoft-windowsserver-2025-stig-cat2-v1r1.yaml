- rule_id: STIG-WN25-00-000230
  rule_name: Windows Server 2025 nonsystem-created file shares must limit access to groups that require it.
  rule_description: Shares on a system provide network access. To prevent exposing sensitive information, where shares are necessary, permissions must be reconfigured to give the minimum access to accounts that require it.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'If only system-created shares such as "ADMIN$", "C$", and "IPC$" exist on the system, this is not applicable. (System-created shares will display a message that it has been shared for administrative purposes when "Properties" is selected.)


      Run "Computer Management".


      Navigate to System Tools >> Shared Folders >> Shares.


      Right-click any nonsystem-created shares.


      Select "Properties".


      Select the "Share Permissions" tab.


      If the file shares have not been configured to restrict permissions to the specific groups or accounts that require access, this is a finding.


      Select the "Security" tab.


      If the permissions have not been configured to restrict permissions to the specific groups or accounts that require access, this is a finding.'
  remediation:
    remediation_step: 'If a nonsystem-created share is required on a system, configure the share and NTFS permissions to limit access to the specific groups or accounts that require it.


      Remove any unnecessary nonsystem-created shares.'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
