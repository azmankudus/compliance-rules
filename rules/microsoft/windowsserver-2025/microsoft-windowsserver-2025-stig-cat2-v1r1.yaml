- rule_id: STIG-WN25-00-000430
  rule_name: Windows Server 2025 FTP servers must be configured to prevent access to the system drive.
  rule_description: The FTP service allows remote users to access shared files and directories that could provide access to system resources and compromise the system, especially if the user can gain access to the root directory of the boot drive.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'If FTP is not installed on the system, this is not applicable.


      Open Internet Information Services (IIS) Manager.


      Select "Sites" under the server name.


      For any sites with a Binding that lists FTP, right-click the site and select "Explore".


      If the site is not defined to a specific folder for shared FTP resources, this is a finding.


      If the site includes any system areas such as root of the drive, Program Files, or Windows directories, this is a finding.'
  remediation:
    remediation_step: Configure the FTP sites to allow access only to specific FTP shared resources. Do not allow access to other areas of the system.
