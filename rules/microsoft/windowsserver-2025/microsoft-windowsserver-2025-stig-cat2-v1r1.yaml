- rule_id: STIG-WN25-DC-000030
  rule_name: Windows Server 2025 Kerberos service ticket maximum lifetime must be limited to 600 minutes or less.
  rule_description: 'This setting determines the maximum amount of time (in minutes) that a granted session ticket can be used to access a particular service. Session tickets are used only to authenticate new connections with servers. Ongoing operations are not interrupted if the session ticket used to authenticate the connection expires during the connection.


    Satisfies: SRG-OS-000112-GPOS-00057, SRG-OS-000113-GPOS-00058'
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "This applies to domain controllers. It is not applicable for other systems.\n\nVerify the following is configured in the Default Domain Policy:\n\nOpen \"Group Policy Management\".\n\nNavigate to \"Group Policy Objects\" in the Domain being reviewed (Forest >> Domains >> Domain). \n\nRight-click the \"Default Domain Policy\".\n\nSelect \"Edit\".\n\nNavigate to Computer Configuration >> Policies >> Windows Settings >> Security Settings >> Account Policies >> Kerberos Policy.\n\nIf the value for \"Maximum lifetime for service ticket\" is \"0\" or greater than \"600\" minutes, this is a finding."
  remediation:
    remediation_step: Configure the policy value in the Default Domain Policy for Computer Configuration >> Policies >> Windows Settings >> Security Settings >> Account Policies >> Kerberos Policy >> Maximum lifetime for service ticket to a maximum of "600" minutes, but not "0", which equates to "Ticket doesn't expire".
    rollback_supported: true
