- rule_id: STIG-WN25-UR-000090
  rule_name: The Windows Server 2025 "Create symbolic links" user right must only be assigned to the Administrators group.
  rule_description: 'Inappropriately granting user rights provides system, administrative, and other high-level capabilities.


    Accounts with the "Create symbolic links" user right can create pointers to other objects, which could expose the system to attack.'
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Verify the effective setting in Local Group Policy Editor.


      Run gpedit.msc.


      Navigate to Local Computer Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment.


      If any accounts or groups other than the following are granted the "Create symbolic links" user right, this is a finding:

      - Administrators.


      For server core installations, run the following command:


      Secedit /Export /Areas User_Rights /cfg c:\path\filename.txt


      Review the text file.


      If any SIDs other than the following are granted the "SeCreateSymbolicLinkPrivilege" user right, this is a finding:


      S-1-5-32-544 (Administrators)


      Systems that have the Hyper-V role will also have "Virtual Machines" given this user right (this may be displayed as "NT Virtual Machine\Virtual Machines", SID S-1-5-83-0). This is not a finding.'
  remediation:
    remediation_step: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment >> Create symbolic links to include only the following accounts or groups:

      - Administrators.


      Systems that have the Hyper-V role will also have "Virtual Machines" given this user right. To add this manually, enter it as "NT Virtual Machine\Virtual Machines".'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
