- rule_id: STIG-WN25-AU-000581
  rule_name: Windows Server 2025 must be configured to audit file system failures.
  rule_description: Maintaining an audit trail of system activity logs can help identify configuration errors, troubleshoot service disruptions, analyze compromises that have occurred, and detect attacks. Audit logs are necessary to provide a trail of evidence in case the system or network is compromised. Collecting this data is essential for analyzing the security of information assets and detecting signs of suspicious and unexpected behavior. Credential validation records events related to validation tests on credentials for a user account logon.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "Verify Audit File System auditing is enabled: \n\nComputer Configuration >> Windows Settings >> Security Settings >> Advanced Audit Policy Configuration >> System Audit Policies >> Object Access >> Audit File System. \n\nIf \"Audit File System\" is not set to \"Failure\", this is a finding."
  remediation:
    remediation_step: Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >> Advanced Audit Policy Configuration >> System Audit Policies >> Object Access >> "Audit File System" with "Failure" selected.
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
  - stig
  - cat2
  - windows-server-2025
