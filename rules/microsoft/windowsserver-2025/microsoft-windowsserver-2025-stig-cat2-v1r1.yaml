  - windows-server-2025
- rule_id: STIG-WN25-DC-000130
  rule_name: Windows Server 2025 domain controllers must run on a machine dedicated to that function.
  rule_description: "Executing application servers on the same host machine with a directory server may substantially weaken the security of the directory server. Web or database server applications usually require the addition of many programs and accounts, increasing the attack surface of the computer. \n\nSome applications require the addition of privileged accounts, providing potential sources of compromise. Some applications (such as Microsoft Exchange) may require the use of network ports or services conflicting with the directory server. In this case, nonstandard ports might be selected, and this could interfere with intrusion detection or prevention services."
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "This applies to domain controllers, it is not applicable for other systems.\n\nReview the installed roles the domain controller is supporting.\n\nStart Server Manager.\n\nSelect \"AD DS\" in the left pane then select the server name under \"Servers\" to the right.\n\nSelect \"Add (or Remove) Roles and Features\" from \"Tasks\" in the \"Roles and Features\" section. (Cancel before any changes are made.)\n\nDetermine if any additional server roles are installed. A basic domain controller setup will include the following:\n- Active Directory Domain Services.\n- DNS Server.\n- File and Storage Services.\n\nIf any roles not requiring installation on a domain controller are installed, this is a finding. \n\nA Domain Name System (DNS) server integrated with the directory server (e.g., AD-integrated DNS) is an acceptable application. However, the DNS server must comply with the DNS STIG security requirements.\n\nRun \"Programs and Features\".\n\nReview installed applications.\n\
      \nIf any applications are installed that are not..."
  remediation:
    remediation_step: Remove additional roles or applications such as web, database, and email from the domain controller.
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
  - stig
  - cat2
  - windows-server-2025
- rule_id: STIG-WN25-DC-000140
  rule_name: Windows Server 2025 must use separate, NSA-approved (Type 1) cryptography to protect the directory data in transit for directory service implementations at a classified confidentiality level when replication data traverses a network cleared to a lower level than the data.
  rule_description: Directory data that is not appropriately encrypted is subject to compromise. Commercial-grade encryption does not provide adequate protection when the classification level of directory data in transit is higher than the level of the network.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'This applies to domain controllers. It is not applicable for other systems.


      Review the organization network diagram(s) or documentation to determine the level of classification for the network(s) over which replication data is transmitted.


      Determine the classification level of the Windows domain controller.


      If the classification level of the Windows domain controller is higher than the level of the networks, review the organization network diagram(s) and directory implementation documentation to determine if NSA-approved encryption is used to protect the replication network traffic.


      If the classification level of the Windows domain controller is higher than the level of the network traversed and NSA-approved encryption is not used, this is a finding.'
  remediation:
    remediation_step: Configure NSA-approved (Type 1) cryptography to protect the directory data in transit for directory service implementations at a classified confidentiality level that transfer replication data through a network cleared to a lower level than the data.
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: Medium
    false_positive_risk: Low
  tags:
