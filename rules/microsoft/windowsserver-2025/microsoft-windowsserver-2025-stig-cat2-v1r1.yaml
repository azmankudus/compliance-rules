      For server core installations, run the following command:


      Secedit /Export /Areas SecurityPolicy /CFG C:\Path\FileName.Txt


      If "MinimumPasswordAge" equals "0" in the file, this is a finding.'
  remediation:
    remediation_step: Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >> Account Policies >> Password Policy. Set "Minimum password age" to at least "1" day.
