- rule_id: STIG-WN25-CC-000430
  rule_name: Windows Server 2025 must disable the Windows Installer Always install with elevated privileges option.
  rule_description: Standard user accounts must not be granted elevated privileges. Enabling Windows Installer to elevate privileges when installing applications can allow malicious persons and applications to gain full control of a system.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'If the following registry value does not exist or is not configured as specified, this is a finding:


      Registry Hive: HKEY_LOCAL_MACHINE

      Registry Path: \SOFTWARE\Policies\Microsoft\Windows\Installer\


      Value Name: AlwaysInstallElevated


      Type: REG_DWORD

      Value: 0x00000000 (0)'
  remediation:
    remediation_step: Configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components >> Windows Installer >> Always install with elevated privileges to "Disabled".
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: High
    false_positive_risk: Low
