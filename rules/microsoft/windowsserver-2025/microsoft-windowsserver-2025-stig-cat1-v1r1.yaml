- rule_id: STIG-WN25-DC-000110
  rule_name: Windows Server 2025 organization created Active Directory Organizational Unit (OU) objects must have proper access control permissions.
  rule_description: 'When directory service database objects do not have appropriate access control permissions, it may be possible for malicious users to create, read, update, or delete the objects and degrade or destroy the integrity of the data. When the directory service is used for identification, authentication, or authorization functions, a compromise of the database objects could lead to a compromise of all systems that rely on the directory service.


    For Active Directory, the OU objects require special attention. In a distributed administration model (i.e., help desk), OU objects are more likely to have access permissions changed from the secure defaults. If inappropriate access permissions are defined for OU objects, it could allow an intruder to add or delete users in the OU. This could result in unauthorized access to data or a denial of service (DoS) to authorized users.'
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'This applies to domain controllers. It is not applicable for other systems.


      Review the permissions on domain-defined OUs.


      Open "Active Directory Users and Computers" (available from various menus or run "dsa.msc").


      Ensure "Advanced Features" is selected in the "View" menu.


      For each OU that is defined (folder in folder icon) excluding the Domain Controllers OU:


      Right-click the OU and select "Properties".


      Select the "Security" tab.


      If the Allow type permissions on the OU are not at least as restrictive as those below, this is a finding.


      The permissions shown are at the summary level. To view more detailed permissions, select "Advanced", then select the desired Permission entry, then click "View" or "Edit".


      Except where noted otherwise, the special permissions may include a wide range of permissions and properties and are acceptable for this requirement.


      CREATOR OWNER - Special permissions


      Self - Special permissions


      Authenticated Users - Read, Special permissions


      The Speci...'
  remediation:
