    audit_type: config
    detection_step: 'If the following registry value does not exist or is not configured as specified, this is a finding:


      Registry Hive: HKEY_LOCAL_MACHINE

      Registry Path: \SOFTWARE\Policies\Microsoft\Windows\WinRM\Client\


      Value Name: AllowBasic


      Type: REG_DWORD

      Value: 0x00000000 (0)'
  remediation:
    remediation_step: Configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components >> Windows Remote Management (WinRM) >> WinRM Client >> Allow Basic authentication to "Disabled".
