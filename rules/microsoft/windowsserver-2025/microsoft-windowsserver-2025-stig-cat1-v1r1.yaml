- rule_id: STIG-WN25-CC-000470
  rule_name: Windows Server 2025 Windows Remote Management (WinRM) client must not use Basic authentication.
  rule_description: Basic authentication uses plain-text passwords that could be used to compromise a system. Disabling Basic authentication will reduce this potential.
