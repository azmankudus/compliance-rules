- rule_id: STIG-WN25-DC-000290
  rule_name: Windows Server 2025 domain Controller PKI certificates must be issued by the DOD PKI or an approved External Certificate Authority (ECA).
  rule_description: A PKI implementation depends on the practices established by the Certificate Authority (CA) to ensure the implementation is secure. Without proper practices, the certificates issued by a CA have limited value in authentication functions. The use of multiple CAs from separate PKI implementations results in interoperability issues. If servers and clients do not have a common set of root CA certificates, they are not able to authenticate each other.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'This applies to domain controllers. It is not applicable for other systems.


      Run "MMC".


      Select "Add/Remove Snap-in" from the "File" menu.


      Select "Certificates" in the left pane, and then click "Add >".


      Select "Computer Account", and then click "Next".


      Select the appropriate option for "Select the computer you want this snap-in to manage", and then click "Finish".


      Click "OK".


      Select and expand the "Certificates (Local Computer)" entry in the left pane.


      Select and expand the "Personal" entry in the left pane.


      Select the "Certificates" entry in the left pane.


      In the right pane, examine the "Issued By" field for the certificate to determine the issuing CA.


      If the "Issued By" field of the PKI certificate being used by the domain controller does not indicate the issuing CA is part of the DOD PKI or an approved ECA, this is a finding.


      If the certificates in use are issued by a CA authorized by the Component''s CIO, this is a CAT II finding.


      There are multiple sources from which ...'
  remediation:
    remediation_step: Obtain a server certificate for the domain controller issued by the DOD PKI or an approved ECA.
