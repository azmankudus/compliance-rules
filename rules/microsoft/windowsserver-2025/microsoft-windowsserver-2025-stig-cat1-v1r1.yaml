rules:
- rule_id: STIG-WN25-00-000030
  rule_name: Windows Server 2025 administrative accounts must not be used with applications that access the internet, such as web browsers, or with potential internet sources, such as email.
  rule_description: 'Using applications that access the internet or have potential internet sources using administrative privileges exposes a system to compromise. If a flaw in an application is exploited while running as a privileged user, the entire system could be compromised. Web browsers and email are common attack vectors for introducing malicious code and must not be run with an administrative account.


    Since administrative accounts may generally change or work around technical restrictions for running a web browser or other applications, it is essential that policy require administrative accounts to not access the internet or use applications such as email.


    The policy must define specific exceptions for local service administration. These exceptions may include HTTP(S)-based tools that are used for the administration of the local system, services, or attached devices.


    Allow listing can be used to enforce the policy to ensure compliance.


    Satisfies: SRG-OS-000480-GPOS-00227, SRG-OS-000205-GPOS-...'
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Determine whether organization policy, at a minimum, prohibits administrative accounts from using applications that access the internet, such as web browsers, or with potential internet sources, such as email, except as necessary for local service administration.


      If it does not, this is a finding.


      The organization may use technical means such as allowlisting to prevent the use of browsers and mail applications to enforce this requirement.'
  remediation:
    remediation_step: 'Establish a policy, at minimum, to prohibit administrative accounts from using applications that access the internet, such as web browsers, or with potential internet sources, such as email. Ensure the policy is enforced.


      The organization may use technical means such as allowlisting to prevent the use of browsers and mail applications to enforce this requirement.'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: High
    false_positive_risk: Low
  tags:
  - stig
  - cat1
  - windows-server-2025
- rule_id: STIG-WN25-00-000130
  rule_name: Windows Server 2025 local volumes must use a format that supports New Technology File System (NTFS) attributes.
  rule_description: The ability to set access permissions and auditing is critical to maintaining the security and proper access controls of a system. To support this, volumes must be formatted using a file system that supports NTFS attributes.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "Open \"Computer Management\".\n\nSelect \"Disk Management\" under \"Storage\".\n\nFor each local volume, if the file system does not indicate \"NTFS\", this is a finding.\n\n\"ReFS\" (Resilient File System) is also acceptable and would not be a finding. \n\n\"CSVFS\" (Cluster Shared Volumes File Systems) is also acceptable and would not be a finding. \n\nThis does not apply to system partitions such the Recovery and EFI System Partition."
  remediation:
    remediation_step: Format volumes to use NTFS, ReFS, or CSVFS.
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: High
    false_positive_risk: Low
  tags:
  - stig
  - cat1
  - windows-server-2025
- rule_id: STIG-WN25-AC-000090
  rule_name: Windows Server 2025 reversible password encryption must be disabled.
  rule_description: Storing passwords using reversible encryption is essentially the same as storing clear-text versions of the passwords, which are easily compromised. For this reason, this policy must never be enabled.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Verify the effective setting in Local Group Policy Editor.


      Run gpedit.msc.


      Navigate to Local Computer Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Account Policies >> Password Policy.


      If the value for "Store passwords using reversible encryption" is not set to "Disabled", this is a finding.


      For server core installations, run the following command:


      Secedit /Export /Areas SecurityPolicy /CFG C:\Path\FileName.Txt


      If "ClearTextPassword" equals "1" in the file, this is a finding.'
  remediation:
    remediation_step: Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >> Account Policies >> Password Policy. Set "Store passwords using reversible encryption" to "Disabled".
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: High
    false_positive_risk: Low
  tags:
  - stig
  - cat1
  - windows-server-2025
- rule_id: STIG-WN25-CC-000210
  rule_name: Windows Server 2025 AutoPlay must be turned off for nonvolume devices.
  rule_description: Allowing AutoPlay to execute may introduce malicious code to a system. AutoPlay begins reading from a drive as soon as media is inserted into the drive. As a result, the setup file of programs or music on audio media may start. This setting will disable AutoPlay for nonvolume devices, such as Media Transfer Protocol (MTP) devices.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'If the following registry value does not exist or is not configured as specified, this is a finding:


      Registry Hive: HKEY_LOCAL_MACHINE

      Registry Path: \SOFTWARE\Policies\Microsoft\Windows\Explorer\


      Value Name: NoAutoplayfornonVolume


      Type: REG_DWORD

      Value: 0x00000001 (1)'
  remediation:
    remediation_step: Configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components >> AutoPlay Policies >> Disallow Autoplay for nonvolume devices to "Enabled".
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: High
    false_positive_risk: Low
  tags:
  - stig
  - cat1
  - windows-server-2025
- rule_id: STIG-WN25-CC-000220
  rule_name: Windows Server 2025 default AutoRun behavior must be configured to prevent AutoRun commands.
  rule_description: Allowing AutoRun commands to execute may introduce malicious code to a system. Configuring this setting prevents AutoRun commands from executing.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'If the following registry value does not exist or is not configured as specified, this is a finding:


      Registry Hive: HKEY_LOCAL_MACHINE

      Registry Path: \SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\


      Value Name: NoAutorun


      Type: REG_DWORD

      Value: 0x00000001 (1)'
  remediation:
    remediation_step: Configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components >> AutoPlay Policies >> Set the default behavior for AutoRun to "Enabled" with "Do not execute any autorun commands" selected.
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
