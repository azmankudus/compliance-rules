- rule_id: STIG-WN25-DC-000010
  rule_name: Windows Server 2025 must only allow administrators responsible for the domain controller to have Administrator rights on the system.
  rule_description: "An account that does not have Administrator duties must not have Administrator rights. Such rights would allow the account to bypass or modify required security restrictions on that machine and make it vulnerable to attack.\n\nSystem administrators must log on to systems using only accounts with the minimum level of authority necessary. \n\nStandard user accounts must not be members of the built-in Administrators group."
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'This applies to domain controllers. A separate version applies to other systems.


      Review the Administrators group. Only the appropriate administrator groups or accounts responsible for administration of the system may be members of the group.


      Standard user accounts must not be members of the local administrator group.


      If prohibited accounts are members of the local administrators group, this is a finding.


      If the built-in Administrator account or other required administrative accounts are found on the system, this is not a finding.'
  remediation:
    remediation_step: 'Configure the Administrators group to include only administrator groups or accounts that are responsible for the system.


      Remove any standard user accounts.'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: High
    false_positive_risk: Low
  tags:
  - stig
  - cat1
  - windows-server-2025
- rule_id: STIG-WN25-DC-000070
  rule_name: Windows Server 2025 permissions on the Active Directory data files must only allow system administrators (SAs) access.
  rule_description: 'Improper access permissions for directory data-related files could allow unauthorized users to read, modify, or delete directory data or audit trails.


    Satisfies: SRG-OS-000324-GPOS-00125, SRG-OS-000206-GPOS-00084'
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'This applies to domain controllers. It is not applicable for other systems.


      Run "Regedit".


      Navigate to "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\NTDS\Parameters".


      Note the directory locations in the values for:


      Database log files path

      DSA Database file


      By default, they will be \Windows\NTDS.


      If the locations are different, run the following for each:


      Open "command prompt (Admin)".


      Navigate to the NTDS directory (\Windows\NTDS by default).


      Run "icacls *.*".


      If the permissions on each file are not as restrictive as the following, this is a finding:


      NT AUTHORITY\SYSTEM:(I)(F)

      BUILTIN\Administrators:(I)(F)


      (I) - permission inherited from parent container

      (F) - full access'
  remediation:
    remediation_step: 'Maintain the permissions on NTDS database and log files as follows:


      NT AUTHORITY\SYSTEM:(I)(F)

      BUILTIN\Administrators:(I)(F)


      (I) - permission inherited from parent container

      (F) - full access'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: High
    false_positive_risk: Low
  tags:
  - stig
  - cat1
  - windows-server-2025
- rule_id: STIG-WN25-DC-000080
  rule_name: Windows Server 2025 Active Directory SYSVOL directory must have the proper access control permissions.
  rule_description: 'Improper access permissions for directory data files could allow unauthorized users to read, modify, or delete directory data.


    The SYSVOL directory contains public files (to the domain) such as policies and logon scripts. Data in shared subdirectories are replicated to all domain controllers in a domain.'
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "This applies to domain controllers. It is not applicable for other systems.\n\nOpen a command prompt.\n\nRun \"net share\".\n\nMake note of the directory location of the SYSVOL share.\n\nBy default, this will be \\Windows\\SYSVOL\\sysvol. For this requirement, permissions will be verified at the first SYSVOL directory level.\n\nIf any standard user accounts or groups have greater than \"Read & execute\" permissions, this is a finding. \n\nThe default permissions noted below meet this requirement:\n\nOpen command prompt.\n\nRun \"icacls c:\\Windows\\SYSVOL\".\n\nThe following results must be displayed:\n\nNT AUTHORITY\\Authenticated Users:(RX)\nNT AUTHORITY\\Authenticated Users:(OI)(CI)(IO)(GR,GE)\nBUILTIN\\Server Operators:(RX)\nBUILTIN\\Server Operators:(OI)(CI)(IO)(GR,GE)\nBUILTIN\\Administrators:(M,WDAC,WO)\nBUILTIN\\Administrators:(OI)(CI)(IO)(F)\nNT AUTHORITY\\SYSTEM:(F)\nNT AUTHORITY\\SYSTEM:(OI)(CI)(IO)(F)\nCREATOR OWNER:(OI)(CI)(IO)(F)\n\n(RX) - Read & execute\
      \ \n\nRun \"icacls /help\" to view definitions of other permission co..."
  remediation:
    remediation_step: 'Maintain the permissions on the SYSVOL directory. Do not allow greater than "Read & execute" permissions for standard user accounts or groups. The defaults below meet this requirement:


      C:\Windows\SYSVOL

      Type - "Allow" for all

      Inherited from - "None" for all


      Principal - Access - Applies to


      Authenticated Users - Read & execute - This folder, subfolder, and files

      Server Operators - Read & execute- This folder, subfolder, and files

      Administrators - Special - This folder only (Special = Basic Permissions: all selected except Full control)

      CREATOR OWNER - Full control - Subfolders and files only

      Administrators - Full control - Subfolders and files only

      SYSTEM - Full control - This folder, subfolders, and files'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: High
    false_positive_risk: Low
  tags:
  - stig
  - cat1
  - windows-server-2025
- rule_id: STIG-WN25-DC-000090
  rule_name: Windows Server 2025 Active Directory (AD) Group Policy Objects (GPOs) must have proper access control permissions.
  rule_description: 'When directory service database objects do not have appropriate access control permissions, it may be possible for malicious users to create, read, update, or delete the objects and degrade or destroy the integrity of the data. When the directory service is used for identification, authentication, or authorization functions, a compromise of the database objects could lead to a compromise of all systems relying on the directory service.


    For AD, the GPOs require special attention. In a distributed administration model (i.e., help desk), GPOs are more likely to have access permissions changed from the secure defaults. If inappropriate access permissions are defined for GPOs, this could allow an intruder to change the security policy applied to all domain client computers (workstations and servers).'
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "This applies to domain controllers. It is not applicable for other systems.\n\nReview the permissions on GPOs.\n\nOpen \"Group Policy Management\" (available from various menus or run \"gpmc.msc\").\n\nNavigate to \"Group Policy Objects\" in the domain being reviewed (Forest >> Domains >> Domain).\n\nFor each GPO:\n\nSelect the GPO item in the left pane.\n\nSelect the \"Delegation\" tab in the right pane.\n\nSelect \"Advanced\".\n\nSelect each Group or user name.\n\nView the permissions.\n\nIf any standard user accounts or groups have \"Allow\" permissions greater than \"Read\" and \"Apply group policy\", this is a finding.\n\nOther access permissions that allow the objects to be updated are considered findings unless specifically documented by the information system security officer (ISSO).\n\nThe default permissions noted below satisfy this requirement. \n\nThe permissions shown are at the summary level. More detailed permissions can be viewed by selecting the next\
      \ \"Advanced\" button, the desired Permission entry, and the ..."
  remediation:
    remediation_step: 'Maintain the permissions on GPOs to not allow greater than "Read" and "Apply group policy" for standard user accounts or groups. The default permissions below meet this requirement:


      Authenticated Users - Read, Apply group policy, Special permissions


      The special permissions for Authenticated Users are for Read-type Properties.


      CREATOR OWNER - Special permissions

      SYSTEM - Read, Write, Create all child objects, Delete all child objects, Special permissions

      Domain Admins - Read, Write, Create all child objects, Delete all child objects, Special permissions

      Enterprise Admins - Read, Write, Create all child objects, Delete all child objects, Special permissions

      ENTERPRISE DOMAIN CONTROLLERS - Read, Special permissions


      Document any other access permissions that allow the objects to be updated with the ISSO.


      The Domain Admins and Enterprise Admins will not have the "Delete all child objects" permission on the two default Group Policy objects: Default Domain Policy and Default Domain Co...'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: High
    false_positive_risk: Low
  tags:
  - stig
  - cat1
  - windows-server-2025
- rule_id: STIG-WN25-DC-000100
  rule_name: Windows Server 2025 Active Directory Domain Controllers Organizational Unit (OU) object must have the proper access control permissions.
  rule_description: 'When Active Directory objects do not have appropriate access control permissions, it may be possible for malicious users to create, read, update, or delete the objects and degrade or destroy the integrity of the data. When the directory service is used for identification, authentication, or authorization functions, a compromise of the database objects could lead to a compromise of all systems that rely on the directory service.


    The Domain Controllers OU object requires special attention as the Domain Controllers are central to the configuration and management of the domain. Inappropriate access permissions defined for the Domain Controllers OU could allow an intruder or unauthorized personnel to make changes that could lead to the compromise of the domain.'
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'This applies to domain controllers. It is not applicable for other systems.


      Review the permissions on the Domain Controllers OU.


      Open "Active Directory Users and Computers" (available from various menus or run "dsa.msc").


      Select "Advanced Features" in the "View" menu if not previously selected.


      Select the "Domain Controllers" OU (folder in folder icon).


      Right-click and select "Properties".


      Select the "Security" tab.


      If the permissions on the Domain Controllers OU do not restrict changes to System, Domain Admins, Enterprise Admins and Administrators, this is a finding.


      The default permissions listed below satisfy this requirement.


      Domains supporting Microsoft Exchange will have additional Exchange related permissions on the Domain Controllers OU. These may include some change-related permissions and is not a finding.


      The permissions shown are at the summary level. To view more detailed permissions, select "Advanced", then select the desired Permission entry, then click "Vie...'
  remediation:
    remediation_step: 'Limit the permissions on the Domain Controllers OU to restrict changes to System, Domain Admins, Enterprise Admins, and Administrators.


      The default permissions listed below satisfy this requirement.


      Domains supporting Microsoft Exchange will have additional Exchange-related permissions on the Domain Controllers OU. These may include some change-related permissions.


      CREATOR OWNER - Special permissions


      SELF - Special permissions


      Authenticated Users - Read, Special permissions


      The special permissions for Authenticated Users are Read types.


      SYSTEM - Full Control


      Domain Admins - Read, Write, Create all child objects, Generate resultant set of policy (logging), Generate resultant set of policy (planning), Special permissions


      Enterprise Admins - Full Control


      Key Admins - Special permissions


      Enterprise Key Admins - Special permissions


      Administrators - Read, Write, Create all child objects, Generate resultant set of policy (logging), Generate resultant set of policy (planning), S...'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: High
    false_positive_risk: Low
  tags:
