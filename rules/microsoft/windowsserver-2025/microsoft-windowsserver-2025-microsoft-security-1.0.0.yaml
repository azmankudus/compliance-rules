- rule_id: MS-020
  rule_name: Enable PowerShell Script Block Logging
  rule_description: PowerShell Script Block Logging should be enabled to capture and log PowerShell script execution for security monitoring and forensics.
  category: Auditing
  subcategory: PowerShell Logging
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check if PowerShell Script Block Logging is enabled.'
    check_command: Get-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging' -Name EnableScriptBlockLogging -ErrorAction SilentlyContinue
    expected_value: 'EnableScriptBlockLogging -eq 1'
  remediation:
    remediation_step: |
      Enable PowerShell Script Block Logging via Group Policy:
      Computer Configuration > Administrative Templates > Windows Components > Windows PowerShell
      Enable 'Turn on PowerShell Script Block Logging'
      
      Or via registry:
      New-Item -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging' -Force
      Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging' -Name 'EnableScriptBlockLogging' -Value 1 -Type DWORD
    rollback_supported: true
    reboot_required: false
    service_impact: Increased logging volume
    estimated_time: 5 minutes
  context:
    rationale: PowerShell is commonly used by attackers for lateral movement and persistence. Script block logging provides visibility into PowerShell execution for detection and forensics.
    impact: High
    false_positive_risk: Low
    references:
    - type: Microsoft
      reference: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/security-best-practices/best-practices-for-securing-active-directory
  tags:
  - powershell
  - auditing
  - logging
  - microsoft

- rule_id: MS-021
  rule_name: Enable PowerShell Module Logging
  rule_description: PowerShell Module Logging should be enabled to capture module execution details for security monitoring.
  category: Auditing
  subcategory: PowerShell Logging
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check if PowerShell Module Logging is enabled.'
    check_command: Get-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ModuleLogging' -Name EnableModuleLogging -ErrorAction SilentlyContinue
    expected_value: 'EnableModuleLogging -eq 1'
  remediation:
    remediation_step: |
      Enable PowerShell Module Logging via Group Policy:
      Computer Configuration > Administrative Templates > Windows Components > Windows PowerShell
      Enable 'Turn on Module Logging' and specify modules to log (use * for all)
      
      Or via registry:
      New-Item -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ModuleLogging' -Force
      Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ModuleLogging' -Name 'EnableModuleLogging' -Value 1 -Type DWORD
    rollback_supported: true
    reboot_required: false
    service_impact: Increased logging volume
    estimated_time: 5 minutes
  context:
    rationale: Module logging complements script block logging by capturing module-level execution details, useful for detecting malicious PowerShell activity.
    impact: High
    false_positive_risk: Low
    references:
    - type: Microsoft
      reference: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/security-best-practices/best-practices-for-securing-active-directory
  tags:
  - powershell
  - auditing
  - logging
  - microsoft

- rule_id: MS-022
  rule_name: Configure Security Audit Policy
  rule_description: Security audit policies should be configured to log important security events including logon events, privilege use, and object access.
  category: Auditing
  subcategory: Audit Policy
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check security audit policy settings.'
    check_command: auditpol /get /category:*
    expected_value: 'Success and Failure auditing enabled for key categories'
  remediation:
    remediation_step: |
      Configure security audit policy via Group Policy:
      Computer Configuration > Windows Settings > Security Settings > Advanced Audit Policy Configuration
      
      Recommended settings:
      - Account Logon: Success and Failure
      - Logon/Logoff: Success and Failure
      - Object Access: Success and Failure (for sensitive objects)
      - Privilege Use: Failure
      - Policy Change: Success and Failure
      - Account Management: Success and Failure
    rollback_supported: true
    reboot_required: false
    service_impact: Increased logging volume
    estimated_time: 10 minutes
  context:
    rationale: Security audit policies enable logging of security-relevant events for monitoring, detection, and forensic analysis.
    impact: High
    false_positive_risk: Low
    references:
    - type: Microsoft
      reference: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/security-best-practices/best-practices-for-securing-active-directory
  tags:
  - auditing
  - audit-policy
  - microsoft

- rule_id: MS-023
  rule_name: Disable Guest Account
  rule_description: The built-in Guest account should be disabled to prevent unauthorized access through this account.
  category: Access Control
  subcategory: Account Security
  testing_status: untested
  assessment:
    severity: Critical
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check if the Guest account is disabled.'
    check_command: Get-LocalUser -Name Guest | Select-Object Enabled
    expected_value: 'Enabled -eq False'
  remediation:
    remediation_step: |
      Disable the Guest account:
      Disable-LocalUser -Name Guest
    rollback_supported: true
    reboot_required: false
    service_impact: None expected
    estimated_time: 1 minute
  context:
    rationale: The Guest account provides a potential entry point for attackers and should be disabled on all systems.
    impact: Critical
    false_positive_risk: None
    references:
