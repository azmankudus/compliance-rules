  description: Security hardening rules based on Microsoft official documentation for Windows Server 2025
  platform: Windows Server 2025
  benchmark: Microsoft Security Documentation
  author: Microsoft Corporation
  created: '2026-03-14T00:00:00Z'
  modified: '2026-03-14T00:00:00Z'
  compatible_platforms:
  - Windows Server 2025
compliance_info:
  framework: NIST
  version: 1.0.0
  profile: Microsoft Security Baseline
profile:
  name: Microsoft Security Hardening
  description: Security hardening rules from Microsoft official documentation for Windows Server 2025
  level: 1
rules:
- rule_id: MS-001
  rule_name: Enable Microsoft Defender Antivirus
  rule_description: Microsoft Defender Antivirus provides real-time protection against malware, viruses, and other threats. It should be enabled and running on Windows Server 2025.
  category: Malware Protection
  subcategory: Antivirus
  testing_status: untested
  assessment:
    severity: Critical
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Verify Microsoft Defender Antivirus service is running and real-time protection is enabled.'
    check_command: Get-MpComputerStatus | Select-Object AntivirusEnabled, RealTimeProtectionEnabled
    expected_value: 'AntivirusEnabled -eq True AND RealTimeProtectionEnabled -eq True'
  remediation:
    remediation_step: |
      Enable Microsoft Defender Antivirus using PowerShell:
      1. Set-MpPreference -DisableRealtimeMonitoring $false
      2. Start-Service -Name WinDefend
      3. Set-Service -Name WinDefend -StartupType Automatic
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 1 minute
  context:
    rationale: Microsoft Defender Antivirus provides immediate and active protection against known malware and can regularly update antimalware definitions through Windows Update.
    impact: High
    false_positive_risk: Low
    references:
    - type: Microsoft
      reference: https://learn.microsoft.com/en-us/windows-server/security/windows-defender/windows-defender-overview-windows-server
  tags:
  - antivirus
  - malware-protection
  - microsoft

- rule_id: MS-002
  rule_name: Update Microsoft Defender Antivirus Definitions
  rule_description: Microsoft Defender Antivirus definitions should be kept up to date to ensure protection against the latest threats.
  category: Malware Protection
  subcategory: Antivirus
  testing_status: untested
  assessment:
    severity: Critical
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check the last update time of Microsoft Defender definitions. Definitions should be no more than 24 hours old.'
    check_command: Get-MpComputerStatus | Select-Object AntispywareSignatureLastUpdated, AntivirusSignatureLastUpdated
    expected_value: 'SignatureLastUpdated within last 24 hours'
  remediation:
    remediation_step: |
      Update Microsoft Defender definitions:
      1. Update-MpSignature
      Or configure automatic updates via Group Policy:
      Computer Configuration > Administrative Templates > Windows Components > Microsoft Defender Antivirus > Signature Updates
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: Outdated antivirus definitions leave the system vulnerable to newly discovered threats.
    impact: High
    false_positive_risk: None
    references:
    - type: Microsoft
      reference: https://learn.microsoft.com/en-us/windows-server/security/windows-defender/windows-defender-overview-windows-server
  tags:
  - antivirus
  - definitions
  - microsoft

- rule_id: MS-003
  rule_name: Enable Microsoft Defender Real-Time Protection
  rule_description: Real-time protection monitors the system for malicious activity and should be enabled to provide continuous protection.
  category: Malware Protection
  subcategory: Antivirus
  testing_status: untested
  assessment:
    severity: Critical
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Verify real-time protection is enabled in Microsoft Defender.'
    check_command: Get-MpPreference | Select-Object DisableRealtimeMonitoring
    expected_value: 'DisableRealtimeMonitoring -eq False'
  remediation:
    remediation_step: |
      Enable real-time protection:
      Set-MpPreference -DisableRealtimeMonitoring $false
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 1 minute
  context:
    rationale: Real-time protection continuously monitors for malware and suspicious activity, providing immediate threat detection and mitigation.
    impact: High
    false_positive_risk: Low
    references:
    - type: Microsoft
      reference: https://learn.microsoft.com/en-us/windows-server/security/windows-defender/windows-defender-overview-windows-server
  tags:
  - antivirus
  - real-time-protection
  - microsoft

- rule_id: MS-004
  rule_name: Enable Microsoft Defender Tamper Protection
  rule_description: Tamper Protection helps protect security settings from being changed by malicious apps or unauthorized users.
  category: Malware Protection
  subcategory: Antivirus
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Verify Tamper Protection is enabled in Microsoft Defender.'
    check_command: Get-MpComputerStatus | Select-Object IsTamperProtected
    expected_value: 'IsTamperProtected -eq True'
  remediation:
    remediation_step: |
      Enable Tamper Protection:
      Set-MpPreference -DisableTamperProtection $false
      
      Or via Group Policy:
      Computer Configuration > Administrative Templates > Windows Components > Microsoft Defender Antivirus
      Enable 'Turn on Tamper Protection'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 1 minute
  context:
    rationale: Tamper Protection prevents malicious apps and unauthorized users from changing important Microsoft Defender security settings.
    impact: High
    false_positive_risk: Low
    references:
    - type: Microsoft
      reference: https://learn.microsoft.com/en-us/microsoft-365/security/defender-endpoint/prevent-changes-to-security-settings-with-tamper-protection
  tags:
  - antivirus
  - tamper-protection
  - microsoft

- rule_id: MS-005
  rule_name: Verify Credential Guard is Enabled
  rule_description: Credential Guard is enabled by default in Windows Server 2025. Verify it is running to protect against credential theft attacks.
  category: Identity Protection
  subcategory: Credential Protection
  testing_status: untested
  assessment:
    severity: Critical
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check if Credential Guard is enabled on the system.'
    check_command: Get-ComputerInfo | Select-Object DeviceGuardSmartStatus
    expected_value: 'DeviceGuardSmartStatus -eq 1 OR DeviceGuardSmartStatus -eq 2'
  remediation:
    remediation_step: |
      Credential Guard is enabled by default in Windows Server 2025. If disabled, re-enable via Group Policy:
      1. Computer Configuration > Administrative Templates > System > Device Guard
      2. Enable 'Turn on Virtualization Based Security'
      3. Select 'Enabled with UEFI lock' for Credential Guard
      
      Or via registry:
      New-Item -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -Force
      Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -Name 'LsaCfgFlags' -Value 1 -Type DWORD
    rollback_supported: true
    reboot_required: true
    service_impact: May affect some legacy applications
    estimated_time: 15 minutes
  context:
    rationale: Windows Server 2025 enables Credential Guard by default. This feature prevents credential theft attacks by protecting NTLM password hashes, Kerberos TGTs, and credentials stored by applications.
    impact: Critical
    false_positive_risk: Low
    references:
    - type: Microsoft
      reference: https://learn.microsoft.com/en-us/windows/security/identity-protection/credential-guard/credential-guard
  tags:
  - credential-protection
  - virtualization-based-security
  - pass-the-hash
  - microsoft

- rule_id: MS-006
  rule_name: Verify VBS is Enabled
  rule_description: Virtualization-Based Security (VBS) is enabled by default in Windows Server 2025. Verify it is running to provide hardware-based security isolation.
  category: System Security
  subcategory: Virtualization Security
  testing_status: untested
  assessment:
    severity: Critical
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check if VBS is enabled on the system.'
    check_command: Get-ComputerInfo | Select-Object DeviceGuardRequiredSecurityProperties
    expected_value: 'VBS should be enabled'
  remediation:
    remediation_step: |
      VBS is enabled by default in Windows Server 2025. If disabled, re-enable via Group Policy:
      Computer Configuration > Administrative Templates > System > Device Guard
      Enable 'Turn on Virtualization Based Security'
      
      Or via registry:
      Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard' -Name 'EnableVirtualizationBasedSecurity' -Value 1 -Type DWORD
    rollback_supported: true
    reboot_required: true
    service_impact: Requires virtualization support in hardware
    estimated_time: 15 minutes
  context:
    rationale: VBS uses hardware virtualization to create an isolated region of memory for security operations, protecting against kernel-level attacks.
    impact: Critical
    false_positive_risk: Low
    references:
    - type: Microsoft
      reference: https://learn.microsoft.com/en-us/windows/security/threat-protection/device-guard/enable-virtualization-based-protection-of-code-integrity
  tags:
  - vbs
  - virtualization-security
  - microsoft

- rule_id: MS-007
  rule_name: Disable TLS 1.0 Server and Client
  rule_description: TLS 1.0 is a legacy protocol with known security vulnerabilities. It should be disabled on both server and client sides.
  category: Network Security
  subcategory: TLS Configuration
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check the registry to verify TLS 1.0 is disabled for server and client connections.'
    check_command: Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.0\Server' -Name Enabled -ErrorAction SilentlyContinue; Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.0\Client' -Name Enabled -ErrorAction SilentlyContinue
    expected_value: 'Enabled -eq 0 for both server and client'
  remediation:
    remediation_step: |
      Disable TLS 1.0 server and client:
      New-Item -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.0\Server' -Force
      Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.0\Server' -Name 'Enabled' -Value 0 -Type DWORD
      Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.0\Server' -Name 'DisabledByDefault' -Value 1 -Type DWORD
      
      New-Item -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.0\Client' -Force
      Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.0\Client' -Name 'Enabled' -Value 0 -Type DWORD
      Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.0\Client' -Name 'DisabledByDefault' -Value 1 -Type DWORD
    rollback_supported: true
    reboot_required: true
    service_impact: May affect legacy clients and servers
    estimated_time: 5 minutes
  context:
    rationale: TLS 1.0 has known vulnerabilities including POODLE, BEAST, and other cryptographic weaknesses. Disabling it prevents protocol downgrade attacks.
    impact: High
    false_positive_risk: Low
    references:
    - type: Microsoft
      reference: https://learn.microsoft.com/en-us/windows-server/security/tls/tls-registry-settings
  tags:
  - tls
  - encryption
  - network-security
  - microsoft

- rule_id: MS-008
  rule_name: Disable TLS 1.1 Server and Client
  rule_description: TLS 1.1 is a legacy protocol that should be disabled in favor of TLS 1.2 or higher.
  category: Network Security
  subcategory: TLS Configuration
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check the registry to verify TLS 1.1 is disabled for server and client connections.'
    check_command: Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.1\Server' -Name Enabled -ErrorAction SilentlyContinue; Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.1\Client' -Name Enabled -ErrorAction SilentlyContinue
    expected_value: 'Enabled -eq 0 for both server and client'
  remediation:
    remediation_step: |
      Disable TLS 1.1 server and client:
      New-Item -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.1\Server' -Force
      Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.1\Server' -Name 'Enabled' -Value 0 -Type DWORD
      Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.1\Server' -Name 'DisabledByDefault' -Value 1 -Type DWORD
      
      New-Item -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.1\Client' -Force
      Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.1\Client' -Name 'Enabled' -Value 0 -Type DWORD
      Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.1\Client' -Name 'DisabledByDefault' -Value 1 -Type DWORD
    rollback_supported: true
    reboot_required: true
    service_impact: May affect legacy clients and servers
    estimated_time: 5 minutes
  context:
    rationale: TLS 1.1 is deprecated and should be disabled to ensure only modern, secure TLS versions are used.
    impact: High
    false_positive_risk: Low
    references:
    - type: Microsoft
      reference: https://learn.microsoft.com/en-us/windows-server/security/tls/tls-registry-settings
  tags:
  - tls
  - encryption
  - network-security
  - microsoft

- rule_id: MS-009
  rule_name: Enable TLS 1.2 and TLS 1.3
  rule_description: TLS 1.2 and TLS 1.3 should be enabled for secure communications on both client and server sides.
  category: Network Security
  subcategory: TLS Configuration
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check the registry to verify TLS 1.2 and TLS 1.3 are enabled.'
    check_command: Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.2\Server' -Name Enabled -ErrorAction SilentlyContinue; Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.3\Server' -Name Enabled -ErrorAction SilentlyContinue
    expected_value: 'Enabled -eq 1 for both TLS 1.2 and TLS 1.3'
  remediation:
    remediation_step: |
      Enable TLS 1.2:
      New-Item -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.2\Server' -Force
      Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.2\Server' -Name 'Enabled' -Value 1 -Type DWORD
      Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.2\Server' -Name 'DisabledByDefault' -Value 0 -Type DWORD
      
      Enable TLS 1.3:
      New-Item -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.3\Server' -Force
      Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.3\Server' -Name 'Enabled' -Value 1 -Type DWORD
      Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.3\Server' -Name 'DisabledByDefault' -Value 0 -Type DWORD
    rollback_supported: true
    reboot_required: true
    service_impact: None expected
    estimated_time: 5 minutes
  context:
    rationale: TLS 1.2 and TLS 1.3 provide strong encryption and should be the only enabled TLS versions for secure communications. TLS 1.3 offers improved security and performance.
    impact: High
    false_positive_risk: None
    references:
    - type: Microsoft
      reference: https://learn.microsoft.com/en-us/windows-server/security/tls/tls-registry-settings
  tags:
  - tls
  - encryption
  - tls1.3
  - microsoft

- rule_id: MS-010
  rule_name: Disable SSL 2.0 and SSL 3.0
  rule_description: SSL 2.0 and SSL 3.0 are deprecated and insecure protocols that should be disabled on all systems.
  category: Network Security
  subcategory: TLS Configuration
  testing_status: untested
  assessment:
    severity: Critical
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check the registry to verify SSL 2.0 and SSL 3.0 are disabled.'
    check_command: Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\SSL 2.0\Server' -Name Enabled -ErrorAction SilentlyContinue; Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\SSL 3.0\Server' -Name Enabled -ErrorAction SilentlyContinue
    expected_value: 'Enabled -eq 0 for both SSL 2.0 and SSL 3.0'
  remediation:
    remediation_step: |
      Disable SSL 2.0 and SSL 3.0:
      New-Item -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\SSL 2.0\Server' -Force
      Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\SSL 2.0\Server' -Name 'Enabled' -Value 0 -Type DWORD
      Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\SSL 2.0\Server' -Name 'DisabledByDefault' -Value 1 -Type DWORD
      
      New-Item -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\SSL 3.0\Server' -Force
      Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\SSL 3.0\Server' -Name 'Enabled' -Value 0 -Type DWORD
      Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\SSL 3.0\Server' -Name 'DisabledByDefault' -Value 1 -Type DWORD
    rollback_supported: true
    reboot_required: true
    service_impact: None expected
    estimated_time: 5 minutes
  context:
    rationale: SSL 2.0 and SSL 3.0 have multiple critical vulnerabilities including POODLE and should never be used in production environments.
    impact: Critical
    false_positive_risk: None
    references:
    - type: Microsoft
      reference: https://learn.microsoft.com/en-us/windows-server/security/tls/tls-registry-settings
  tags:
  - ssl
  - encryption
  - network-security
  - microsoft

- rule_id: MS-011
  rule_name: Enable Remote Credential Guard
  rule_description: Remote Credential Guard protects credentials over Remote Desktop connections by redirecting Kerberos requests back to the client device.
  category: Identity Protection
  subcategory: Credential Protection
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check if Remote Credential Guard is configured.'
    check_command: Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -Name DisableRestrictedAdmin -ErrorAction SilentlyContinue
    expected_value: 'DisableRestrictedAdmin -eq 0'
  remediation:
    remediation_step: |
      Enable delegation of nonexportable credentials on remote hosts:
      Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -Name 'DisableRestrictedAdmin' -Value 0 -Type DWORD
      
      Configure clients to use Remote Credential Guard via Group Policy:
      Computer Configuration > Administrative Templates > System > Credentials Delegation
      Enable 'Restrict delegation of credentials to remote servers' and select 'Require Remote Credential Guard'
    rollback_supported: true
    reboot_required: false
    service_impact: May affect RDP connections to non-domain systems
    estimated_time: 10 minutes
  context:
    rationale: Remote Credential Guard prevents credential theft during RDP sessions by keeping credentials on the client device. If the remote host is compromised, credentials are not exposed.
    impact: High
    false_positive_risk: Low
    references:
    - type: Microsoft
      reference: https://learn.microsoft.com/en-us/windows/security/identity-protection/remote-credential-guard
  tags:
  - credential-protection
  - remote-desktop
  - microsoft

- rule_id: MS-012
  rule_name: Enable Windows Firewall for All Profiles
  rule_description: Windows Firewall should be enabled for all profiles (Domain, Private, Public) to protect the system from unauthorized network access.
  category: Network Security
  subcategory: Firewall
  testing_status: untested
  assessment:
    severity: Critical
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check if Windows Firewall is enabled for all profiles.'
    check_command: Get-NetFirewallProfile | Select-Object Name, Enabled
    expected_value: 'Enabled -eq True for all profiles'
  remediation:
    remediation_step: |
      Enable Windows Firewall for all profiles:
      Set-NetFirewallProfile -All -Enabled True
    rollback_supported: true
    reboot_required: false
    service_impact: May block unauthorized network traffic
    estimated_time: 1 minute
  context:
    rationale: Windows Firewall provides host-based network security by controlling inbound and outbound traffic based on configurable rules.
    impact: Critical
    false_positive_risk: Low
    references:
    - type: Microsoft
      reference: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/security-best-practices/best-practices-for-securing-active-directory
  tags:
  - firewall
  - network-security
  - microsoft

- rule_id: MS-013
  rule_name: Block Default Inbound Traffic on Windows Firewall
  rule_description: Windows Firewall should be configured to block all inbound connections by default, only allowing explicitly authorized traffic.
  category: Network Security
  subcategory: Firewall
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check if default inbound action is set to Block for all firewall profiles.'
    check_command: Get-NetFirewallProfile | Select-Object Name, DefaultInboundAction
    expected_value: 'DefaultInboundAction -eq Block for all profiles'
  remediation:
    remediation_step: |
      Configure default inbound action to Block:
      Set-NetFirewallProfile -All -DefaultInboundAction Block
    rollback_supported: true
    reboot_required: false
    service_impact: Only explicitly allowed inbound connections will be permitted
    estimated_time: 1 minute
  context:
    rationale: Blocking inbound traffic by default follows the principle of least privilege and reduces the attack surface.
    impact: High
    false_positive_risk: Low
    references:
    - type: Microsoft
      reference: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/security-best-practices/best-practices-for-securing-active-directory
  tags:
  - firewall
  - network-security
  - microsoft

- rule_id: MS-014
  rule_name: Enable User Account Control
  rule_description: User Account Control (UAC) should be enabled to prevent unauthorized changes to the system and reduce the risk of malware elevation.
  category: Access Control
  subcategory: User Account Control
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check if User Account Control is enabled.'
    check_command: Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name EnableLUA
    expected_value: 'EnableLUA -eq 1'
  remediation:
    remediation_step: |
      Enable User Account Control:
      Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name 'EnableLUA' -Value 1 -Type DWORD
    rollback_supported: true
    reboot_required: true
    service_impact: Users will be prompted for administrative actions
    estimated_time: 5 minutes
  context:
    rationale: UAC helps prevent malware from making unauthorized changes by requiring administrator approval for elevated actions.
    impact: High
    false_positive_risk: Low
    references:
    - type: Microsoft
      reference: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/security-best-practices/best-practices-for-securing-active-directory
  tags:
  - uac
  - access-control
  - microsoft

- rule_id: MS-015
  rule_name: Enable Secure Boot
  rule_description: Secure Boot should be enabled to ensure the system boots using only trusted software, protecting against rootkits and boot-level malware.
  category: System Security
  subcategory: Boot Security
  testing_status: untested
  assessment:
    severity: Critical
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check if Secure Boot is enabled in firmware.'
    check_command: Confirm-SecureBootUEFI
    expected_value: 'True'
  remediation:
    remediation_step: |
      Enable Secure Boot in system firmware (UEFI):
      1. Restart the computer and enter BIOS/UEFI setup (usually F2, F10, F12, or Del key)
      2. Navigate to Security or Boot settings
      3. Enable Secure Boot
      4. Save and exit
    rollback_supported: true
    reboot_required: true
    service_impact: May prevent booting from unauthorized media
    estimated_time: 10 minutes
  context:
    rationale: Secure Boot is a security standard that helps ensure the system boots using only trusted software, protecting against boot-level attacks and rootkits.
    impact: Critical
    false_positive_risk: None
    references:
    - type: Microsoft
      reference: https://learn.microsoft.com/en-us/windows/security/identity-protection/credential-guard/credential-guard
  tags:
  - secure-boot
  - boot-security
  - microsoft

- rule_id: MS-016
  rule_name: Configure Windows Update for Security Updates
  rule_description: Windows Update should be configured to automatically install security updates to protect against known vulnerabilities.
  category: Patch Management
  subcategory: Windows Update
  testing_status: untested
  assessment:
    severity: Critical
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check if automatic updates are enabled.'
    check_command: Get-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU' -Name AUOptions -ErrorAction SilentlyContinue
    expected_value: 'AUOptions -eq 3 OR AUOptions -eq 4'
  remediation:
    remediation_step: |
      Configure automatic updates via Group Policy:
      Computer Configuration > Administrative Templates > Windows Components > Windows Update
      Enable 'Configure Automatic Updates' and select option 4 (Auto download and schedule install)
      
      Or via registry:
      New-Item -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU' -Force
      Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU' -Name 'AUOptions' -Value 4 -Type DWORD
    rollback_supported: true
    reboot_required: false
    service_impact: Automatic reboots may occur for updates
    estimated_time: 5 minutes
  context:
    rationale: Keeping systems updated with the latest security patches is critical for protecting against known vulnerabilities and exploits.
    impact: Critical
    false_positive_risk: None
    references:
    - type: Microsoft
      reference: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/security-best-practices/best-practices-for-securing-active-directory
  tags:
  - patch-management
  - windows-update
  - microsoft

- rule_id: MS-017
  rule_name: Verify SMBv1 is Disabled
  rule_description: SMBv1 protocol should be disabled as it has known vulnerabilities including the EternalBlue exploit used in WannaCry ransomware attacks.
  category: Network Security
  subcategory: Protocol Security
  testing_status: untested
  assessment:
    severity: Critical
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check if SMBv1 is disabled on the server.'
    check_command: Get-WindowsFeature -Name FS-SMB1 | Select-Object InstallState
    expected_value: 'InstallState -eq Available'
  remediation:
    remediation_step: |
      Disable SMBv1:
      Remove-WindowsFeature -Name FS-SMB1
      
      Or via registry:
      Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters' -Name 'SMB1' -Value 0 -Type DWORD
    rollback_supported: true
    reboot_required: true
    service_impact: Legacy clients requiring SMBv1 will be unable to connect
    estimated_time: 5 minutes
  context:
    rationale: SMBv1 has multiple critical vulnerabilities and should be disabled to prevent exploitation via EternalBlue and other SMBv1-based attacks.
    impact: Critical
    false_positive_risk: None
    cve_references:
    - CVE-2017-0144
    - CVE-2017-0145
    - CVE-2017-0146
    references:
    - type: Microsoft
      reference: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/security-best-practices/best-practices-for-securing-active-directory
  tags:
  - smb
  - network-security
  - microsoft

- rule_id: MS-018
  rule_name: Enable SMBv3 Encryption
  rule_description: SMB 3.0 and later support encryption which should be enabled to protect data in transit over SMB connections.
  category: Network Security
  subcategory: Protocol Security
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check if SMB encryption is required on SMB shares.'
    check_command: Get-SmbShare | Get-SmbShareAccess | Select-Object EncryptData
    expected_value: 'EncryptData -eq True for sensitive shares'
  remediation:
    remediation_step: |
      Enable SMB encryption for a share:
      Set-SmbShare -Name 'ShareName' -EncryptData $true
      
      Enable SMB encryption server-wide:
      Set-SmbServerConfiguration -EncryptData $true -Force
    rollback_supported: true
    reboot_required: false
    service_impact: Legacy SMB clients without encryption support will be unable to connect
    estimated_time: 5 minutes
  context:
    rationale: SMB encryption protects data in transit from interception and tampering, providing end-to-end protection for file sharing.
    impact: High
    false_positive_risk: Low
    references:
    - type: Microsoft
      reference: https://learn.microsoft.com/en-us/windows-server/storage/file-server/smb-security
  tags:
  - smb
  - encryption
  - network-security
  - microsoft

- rule_id: MS-019
  rule_name: Enable SMB Signing
  rule_description: SMB signing should be enabled to prevent man-in-the-middle attacks on SMB connections.
  category: Network Security
