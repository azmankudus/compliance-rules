- rule_id: MS-024
  rule_name: Rename Administrator Account
  rule_description: The built-in Administrator account should be renamed to make it harder for attackers to guess the account name.
  category: Access Control
  subcategory: Account Security
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check if the Administrator account has been renamed.'
    check_command: Get-LocalUser | Where-Object { $_.SID -like '*-500' } | Select-Object Name
    expected_value: 'Name -ne Administrator'
  remediation:
    remediation_step: |
      Rename the Administrator account:
      Rename-LocalUser -Name 'Administrator' -NewName 'NewAdminName'
      
      Or via Group Policy:
      Computer Configuration > Windows Settings > Security Settings > Local Policies > Security Options
      Accounts: Rename administrator account
    rollback_supported: true
    reboot_required: false
    service_impact: Users must use the new account name
    estimated_time: 5 minutes
  context:
    rationale: Renaming the Administrator account makes it harder for attackers to perform brute-force attacks against the well-known administrator account.
    impact: Medium
    false_positive_risk: None
    references:
    - type: Microsoft
      reference: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/security-best-practices/best-practices-for-securing-active-directory
  tags:
  - access-control
  - account-security
  - microsoft

- rule_id: MS-025
  rule_name: Configure Account Lockout Policy
  rule_description: Account lockout policy should be configured to lock accounts after a specified number of failed login attempts to prevent brute-force attacks.
  category: Access Control
  subcategory: Account Security
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check account lockout policy settings.'
    check_command: net accounts | findstr /i "Lockout"
    expected_value: 'Lockout threshold between 3-10 invalid attempts AND Lockout duration 15+ minutes'
  remediation:
    remediation_step: |
      Configure account lockout policy via Group Policy:
      Computer Configuration > Windows Settings > Security Settings > Account Policies > Account Lockout Policy
      
      Recommended settings:
      - Account lockout threshold: 3-10 invalid logon attempts
      - Account lockout duration: 15-30 minutes
      - Reset account lockout counter after: 15-30 minutes
      
      Or via command line:
      net accounts /lockoutthreshold:5 /lockoutduration:30 /lockoutwindow:30
    rollback_supported: true
    reboot_required: false
    service_impact: Accounts may be locked after failed login attempts
    estimated_time: 5 minutes
  context:
    rationale: Account lockout policies protect against brute-force password attacks by temporarily disabling accounts after multiple failed login attempts.
    impact: High
    false_positive_risk: Medium
    references:
    - type: Microsoft
      reference: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/security-best-practices/best-practices-for-securing-active-directory
  tags:
  - access-control
  - account-security
  - microsoft

- rule_id: MS-026
  rule_name: Enable BitLocker Drive Encryption
  rule_description: BitLocker Drive Encryption should be enabled on system drives to protect data at rest from unauthorized access.
  category: Data Protection
  subcategory: Encryption
  testing_status: untested
  assessment:
    severity: Critical
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check if BitLocker is enabled on system drives.'
    check_command: Get-BitLockerVolume -MountPoint 'C:' | Select-Object VolumeStatus, ProtectionStatus
    expected_value: 'VolumeStatus -eq FullyEncrypted AND ProtectionStatus -eq On'
  remediation:
    remediation_step: |
      Enable BitLocker on system drive:
      1. Enable-BitLocker -MountPoint 'C:' -EncryptionMethod XtsAes256 -UsedSpaceOnly -TpmProtector
      2. Backup recovery key to Active Directory or secure location:
         Backup-BitLockerKeyProtector -MountPoint 'C:' -KeyProtectorId (Get-BitLockerVolume -MountPoint 'C:').KeyProtector[0].KeyProtectorId
    rollback_supported: true
    reboot_required: true
    service_impact: Encryption process may impact performance during initial encryption
    estimated_time: 30 minutes
  context:
    rationale: BitLocker encrypts data at rest, protecting against data theft if the physical drive is removed or accessed without authorization.
    impact: Critical
    false_positive_risk: None
    references:
    - type: Microsoft
      reference: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/security-best-practices/best-practices-for-securing-active-directory
  tags:
  - encryption
  - data-protection
  - bitlocker
  - microsoft

- rule_id: MS-027
  rule_name: Configure BitLocker with AES-256 Encryption
  rule_description: BitLocker should be configured to use AES-256 encryption for maximum security.
  category: Data Protection
  subcategory: Encryption
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check BitLocker encryption method.'
    check_command: Get-BitLockerVolume | Select-Object EncryptionMethod
    expected_value: 'EncryptionMethod -eq XtsAes256'
  remediation:
    remediation_step: |
      Configure BitLocker with AES-256 via Group Policy:
      Computer Configuration > Administrative Templates > Windows Components > BitLocker Drive Encryption
      Set 'Choose drive encryption method and cipher strength' to 'AES-256'
      
      Or when enabling BitLocker:
      Enable-BitLocker -MountPoint 'C:' -EncryptionMethod XtsAes256
    rollback_supported: true
    reboot_required: false
    service_impact: None after encryption is complete
    estimated_time: 5 minutes
  context:
    rationale: AES-256 provides stronger encryption than the default, offering better protection against brute-force attacks.
    impact: High
    false_positive_risk: None
    references:
    - type: Microsoft
      reference: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/security-best-practices/best-practices-for-securing-active-directory
  tags:
  - encryption
  - data-protection
  - bitlocker
  - microsoft

- rule_id: MS-028
  rule_name: Disable NTLMv1 Authentication
  rule_description: NTLMv1 authentication should be disabled as it is vulnerable to various attacks including pass-the-hash and relay attacks.
  category: Identity Protection
  subcategory: Authentication
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check NTLM authentication level settings.'
    check_command: Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -Name LmCompatibilityLevel -ErrorAction SilentlyContinue
    expected_value: 'LmCompatibilityLevel -ge 3 AND LmCompatibilityLevel -le 5'
  remediation:
    remediation_step: |
      Configure NTLM authentication level via Group Policy:
      Computer Configuration > Windows Settings > Security Settings > Local Policies > Security Options
      Network security: LAN Manager authentication level = Send NTLMv2 response only. Refuse LM & NTLM
      
      Or via registry:
      Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -Name 'LmCompatibilityLevel' -Value 5 -Type DWORD
    rollback_supported: true
    reboot_required: true
    service_impact: Legacy systems requiring NTLMv1 will be unable to authenticate
    estimated_time: 5 minutes
  context:
    rationale: NTLMv1 is a weak authentication protocol vulnerable to multiple attacks. Disabling it forces the use of more secure NTLMv2 or Kerberos authentication.
    impact: High
    false_positive_risk: Low
    references:
    - type: Microsoft
      reference: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/security-best-practices/best-practices-for-securing-active-directory
  tags:
  - authentication
  - ntlm
  - microsoft

- rule_id: MS-029
  rule_name: Enable Remote Desktop Network Level Authentication
  rule_description: Network Level Authentication (NLA) should be required for Remote Desktop connections to provide stronger authentication before establishing the session.
  category: Network Security
  subcategory: Remote Access
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check if NLA is required for RDP connections.'
    check_command: Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name UserAuthentication
    expected_value: 'UserAuthentication -eq 1'
  remediation:
    remediation_step: |
      Enable NLA for RDP via Group Policy:
      Computer Configuration > Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Security
      Enable 'Require user authentication for remote connections by using Network Level Authentication'
      
      Or via registry:
      Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 1 -Type DWORD
    rollback_supported: true
    reboot_required: false
    service_impact: Legacy RDP clients without NLA support will be unable to connect
    estimated_time: 5 minutes
  context:
    rationale: NLA provides stronger authentication by authenticating the user before establishing a full RDP session, reducing the attack surface and protecting against certain RDP-based attacks.
    impact: High
    false_positive_risk: Low
    references:
    - type: Microsoft
      reference: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/security-best-practices/best-practices-for-securing-active-directory
  tags:
  - remote-desktop
  - authentication
  - microsoft

- rule_id: MS-030
  rule_name: Configure LSASS Protection
  rule_description: Local Security Authority Subsystem Service (LSASS) should be configured to run as a Protected Process to prevent credential dumping attacks.
  category: Identity Protection
  subcategory: Credential Protection
  testing_status: untested
  assessment:
    severity: Critical
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check if LSASS is running as a protected process.'
    check_command: Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -Name RunAsPPL -ErrorAction SilentlyContinue
    expected_value: 'RunAsPPL -eq 1'
  remediation:
    remediation_step: |
      Enable LSASS protection via Group Policy:
      Computer Configuration > Administrative Templates > System > Local Security Authority
      Enable 'Configure LSASS to run as a protected process'
      
      Or via registry:
      Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -Name 'RunAsPPL' -Value 1 -Type DWORD
    rollback_supported: true
    reboot_required: true
    service_impact: Some legacy security tools may be unable to access LSASS
    estimated_time: 5 minutes
  context:
    rationale: LSASS stores credentials in memory. Running it as a protected process prevents tools like Mimikatz from dumping credentials from memory.
    impact: Critical
    false_positive_risk: Low
    references:
    - type: Microsoft
      reference: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/security-best-practices/best-practices-for-securing-active-directory
  tags:
  - credential-protection
  - lsass
  - microsoft

- rule_id: MS-031
  rule_name: Disable LLMNR
  rule_description: Link-Local Multicast Name Resolution (LLMNR) should be disabled to prevent name resolution spoofing attacks.
  category: Network Security
  subcategory: Name Resolution
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check if LLMNR is disabled.'
    check_command: Get-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient' -Name EnableMulticast -ErrorAction SilentlyContinue
    expected_value: 'EnableMulticast -eq 0'
  remediation:
    remediation_step: |
      Disable LLMNR via Group Policy:
      Computer Configuration > Administrative Templates > Network > DNS Client
      Enable 'Turn off Multicast Name Resolution'
      
      Or via registry:
      New-Item -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient' -Force
      Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient' -Name 'EnableMulticast' -Value 0 -Type DWORD
    rollback_supported: true
    reboot_required: false
    service_impact: Local name resolution via LLMNR will not be available
    estimated_time: 5 minutes
  context:
    rationale: LLMNR is vulnerable to spoofing attacks where attackers can respond to name resolution requests and capture credentials. Disabling it eliminates this attack vector.
    impact: High
    false_positive_risk: None
    references:
    - type: Microsoft
      reference: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/security-best-practices/best-practices-for-securing-active-directory
  tags:
  - network-security
  - name-resolution
  - llmnr
  - microsoft

- rule_id: MS-032
  rule_name: Disable NetBIOS over TCP/IP
  rule_description: NetBIOS over TCP/IP should be disabled to prevent legacy name resolution attacks.
  category: Network Security
  subcategory: Name Resolution
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check NetBIOS over TCP/IP settings on network adapters.'
    check_command: Get-WmiObject -Class Win32_NetworkAdapterConfiguration | Where-Object { $_.TcpipNetbiosOptions -ne $null } | Select-Object IPAddress, TcpipNetbiosOptions
    expected_value: 'TcpipNetbiosOptions -eq 2'
  remediation:
    remediation_step: |
      Disable NetBIOS over TCP/IP via Group Policy or registry:
      
      Via registry for each network adapter:
      Get-WmiObject -Class Win32_NetworkAdapterConfiguration | Where-Object { $_.TcpipNetbiosOptions -ne $null } | ForEach-Object { $_.SetTcpipNetbios(2) }
    rollback_supported: true
    reboot_required: true
    service_impact: Legacy applications requiring NetBIOS may be affected
    estimated_time: 5 minutes
  context:
    rationale: NetBIOS is a legacy protocol vulnerable to various attacks. Disabling it reduces the attack surface while modern networks use DNS for name resolution.
    impact: Medium
    false_positive_risk: Low
    references:
    - type: Microsoft
      reference: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/security-best-practices/best-practices-for-securing-active-directory
  tags:
  - network-security
  - name-resolution
  - netbios
  - microsoft

- rule_id: MS-033
  rule_name: Configure Windows SmartScreen
  rule_description: Windows SmartScreen should be enabled to help protect against malicious applications and websites.
  category: Application Security
  subcategory: Reputation-Based Protection
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check SmartScreen settings.'
    check_command: Get-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System' -Name EnableSmartScreen -ErrorAction SilentlyContinue
    expected_value: 'EnableSmartScreen -eq 1'
  remediation:
    remediation_step: |
      Enable SmartScreen via Group Policy:
      Computer Configuration > Administrative Templates > Windows Components > File Explorer
