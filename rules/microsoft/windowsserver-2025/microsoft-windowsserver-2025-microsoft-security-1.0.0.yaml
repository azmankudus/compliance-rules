- rule_id: MS-038
  rule_name: Enable Hypervisor-Protected Code Integrity (HVCI)
  rule_description: HVCI uses virtualization-based security to isolate code integrity checks and protect the kernel from malicious code injection.
  category: System Security
  subcategory: Kernel Protection
  testing_status: untested
  assessment:
    severity: Critical
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check if HVCI is enabled.'
    check_command: Get-ComputerInfo | Select-Object DeviceGuardRequiredSecurityProperties, DeviceGuardSmartStatus
    expected_value: 'HVCI should be enabled'
  remediation:
    remediation_step: |
      Enable HVCI via Group Policy:
      Computer Configuration > Administrative Templates > System > Device Guard
      Enable 'Turn on Virtualization Based Security' and select 'Enabled with UEFI lock' for Virtualization Based Protection of Code Integrity
      
      Or via registry:
      Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard' -Name 'EnableVirtualizationBasedSecurity' -Value 1 -Type DWORD
      Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard' -Name 'RequirePlatformSecurityFeatures' -Value 3 -Type DWORD
      Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard\Scenarios\HypervisorEnforcedCodeIntegrity' -Name 'Enabled' -Value 1 -Type DWORD
    rollback_supported: true
    reboot_required: true
    service_impact: May affect some legacy drivers
    estimated_time: 15 minutes
  context:
    rationale: HVCI protects against kernel-mode malware by ensuring only trusted code can run in kernel mode, preventing code injection attacks.
    impact: Critical
    false_positive_risk: Low
    references:
    - type: Microsoft
      reference: https://learn.microsoft.com/en-us/windows/security/threat-protection/device-guard/enable-virtualization-based-protection-of-code-integrity
  tags:
  - hvci
  - kernel-protection
  - virtualization-based-security
  - microsoft

