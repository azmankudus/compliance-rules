- rule_id: MS-001
  rule_name: Enable Windows Defender Antivirus
  rule_description: Windows Defender Antivirus provides real-time protection against malware, viruses, and other threats. It should be enabled and running on Windows Server 2016.
  category: Malware Protection
  subcategory: Antivirus
  testing_status: untested
  assessment:
    severity: Critical
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Verify Windows Defender Antivirus service is running and real-time protection is enabled.'
    check_command: Get-MpComputerStatus | Select-Object AntivirusEnabled, RealTimeProtectionEnabled
    expected_value: 'AntivirusEnabled -eq True AND RealTimeProtectionEnabled -eq True'
  remediation:
    remediation_step: |
      Enable Windows Defender Antivirus using PowerShell:
      1. Set-MpPreference -DisableRealtimeMonitoring $false
      2. Start-Service -Name WinDefend
      3. Set-Service -Name WinDefend -StartupType Automatic
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 1 minute
  context:
    rationale: Windows Defender Antivirus provides immediate and active protection against known malware and can regularly update antimalware definitions through Windows Update.
    impact: High
    false_positive_risk: Low
    references:
    - type: Microsoft
      reference: https://learn.microsoft.com/en-us/windows-server/security/windows-defender/windows-defender-overview-windows-server
  tags:
  - antivirus
  - malware-protection
  - microsoft

- rule_id: MS-002
  rule_name: Update Windows Defender Antivirus Definitions
  rule_description: Windows Defender Antivirus definitions should be kept up to date to ensure protection against the latest threats.
  category: Malware Protection
  subcategory: Antivirus
  testing_status: untested
  assessment:
    severity: Critical
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check the last update time of Windows Defender definitions. Definitions should be no more than 24 hours old.'
    check_command: Get-MpComputerStatus | Select-Object AntispywareSignatureLastUpdated, AntivirusSignatureLastUpdated
    expected_value: 'SignatureLastUpdated within last 24 hours'
  remediation:
    remediation_step: |
      Update Windows Defender definitions:
      1. Update-MpSignature
      Or configure automatic updates via Group Policy:
      Computer Configuration > Administrative Templates > Windows Components > Windows Defender Antivirus > Signature Updates
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: Outdated antivirus definitions leave the system vulnerable to newly discovered threats.
    impact: High
    false_positive_risk: None
    references:
    - type: Microsoft
      reference: https://learn.microsoft.com/en-us/windows-server/security/windows-defender/windows-defender-overview-windows-server
  tags:
  - antivirus
  - definitions
  - microsoft

- rule_id: MS-003
  rule_name: Enable Windows Defender Real-Time Protection
  rule_description: Real-time protection monitors the system for malicious activity and should be enabled to provide continuous protection.
  category: Malware Protection
  subcategory: Antivirus
  testing_status: untested
  assessment:
    severity: Critical
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Verify real-time protection is enabled in Windows Defender.'
    check_command: Get-MpPreference | Select-Object DisableRealtimeMonitoring
    expected_value: 'DisableRealtimeMonitoring -eq False'
  remediation:
    remediation_step: |
