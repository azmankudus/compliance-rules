- rule_id: MS-038
  rule_name: Disable Remote Desktop if Not Required
  rule_description: Remote Desktop should be disabled if not required for system administration to reduce the attack surface.
  category: Network Security
  subcategory: Remote Access
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check if Remote Desktop is enabled.'
    check_command: Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections
    expected_value: 'fDenyTSConnections -eq 1'
  remediation:
    remediation_step: |
      Disable Remote Desktop via Group Policy:
      Computer Configuration > Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Connections
      Disable 'Allow users to connect remotely by using Remote Desktop Services'
      
      Or via registry:
      Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 1 -Type DWORD
      
      Or via PowerShell:
      Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 1
    rollback_supported: true
    reboot_required: false
    service_impact: Remote administration via RDP will not be possible
    estimated_time: 1 minute
  context:
    rationale: Disabling unused services reduces the attack surface. RDP is a common attack vector and should only be enabled when required.
    impact: High
    false_positive_risk: None
    references:
