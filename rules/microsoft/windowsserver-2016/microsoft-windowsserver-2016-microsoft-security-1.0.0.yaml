- rule_id: MS-039
  rule_name: Configure Windows Remote Management Security
  rule_description: Windows Remote Management (WinRM) should be configured securely if required, or disabled if not needed.
  category: Network Security
  subcategory: Remote Management
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check WinRM service configuration.'
    check_command: Get-Service -Name WinRM | Select-Object Status, StartType
    expected_value: 'If running should use HTTPS and authentication'
  remediation:
    remediation_step: |
      If WinRM is required, configure securely:
      1. Enable HTTPS listener:
         New-Item -Path WSMan:\localhost\Listener -Transport HTTPS -Address * -CertificateThumbprint (Get-ChildItem -Path Cert:\LocalMachine\My | Select-Object -First 1).Thumbprint -Force
      2. Configure authentication:
         Set-Item -Path WSMan:\localhost\Service\Auth\Basic -Value $false
         Set-Item -Path WSMan:\localhost\Service\Auth\Kerberos -Value $true
      
      If WinRM is not required, disable:
      Stop-Service -Name WinRM
      Set-Service -Name WinRM -StartupType Disabled
    rollback_supported: true
    reboot_required: false
    service_impact: Remote management via WinRM may be affected
    estimated_time: 10 minutes
  context:
    rationale: WinRM is a powerful remote management protocol that should be secured or disabled to prevent unauthorized access.
    impact: Medium
    false_positive_risk: Low
    references:
    - type: Microsoft
      reference: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/security-best-practices/best-practices-for-securing-active-directory
  tags:
  - remote-management
  - winrm
  - microsoft

