- rule_id: MS-010
  rule_name: Configure Schannel Event Logging
  rule_description: Schannel event logging should be configured to record TLS/SSL events for security monitoring and troubleshooting.
  category: Auditing
  subcategory: Event Logging
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check the Schannel event logging level in the registry.'
    check_command: Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL' -Name EventLogging -ErrorAction SilentlyContinue
    expected_value: 'EventLogging -ge 1 AND EventLogging -le 7'
  remediation:
    remediation_step: |
      Configure Schannel event logging:
      Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL' -Name 'EventLogging' -Value 1 -Type DWORD
      Values: 0=No events, 1=Error events, 2=Warning events, 3=Error+Warning, 4=Informational+Success, 5=Error+Info+Success, 6=Warning+Info+Success, 7=All events
    rollback_supported: true
    reboot_required: true
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: Event logging enables monitoring of TLS/SSL connections and helps identify potential security issues or configuration problems.
    impact: Medium
    false_positive_risk: None
    references:
    - type: Microsoft
      reference: https://learn.microsoft.com/en-us/windows-server/security/tls/tls-registry-settings
  tags:
  - auditing
  - logging
  - tls
  - microsoft

- rule_id: MS-011
  rule_name: Enable Credential Guard
  rule_description: Credential Guard uses virtualization-based security to isolate secrets so that only privileged system software can access them, protecting against credential theft attacks.
  category: Identity Protection
  subcategory: Credential Protection
  testing_status: untested
  assessment:
    severity: Critical
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check if Credential Guard is enabled on the system.'
    check_command: Get-ComputerInfo | Select-Object DeviceGuardSmartStatus
    expected_value: 'DeviceGuardSmartStatus -eq 1 OR DeviceGuardSmartStatus -eq 2'
  remediation:
    remediation_step: |
      Enable Credential Guard via Group Policy:
      1. Computer Configuration > Administrative Templates > System > Device Guard
      2. Enable 'Turn on Virtualization Based Security'
      3. Select 'Enabled with UEFI lock' for Credential Guard
      
      Or via registry:
      New-Item -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -Force
      Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -Name 'LsaCfgFlags' -Value 1 -Type DWORD
    rollback_supported: true
    reboot_required: true
    service_impact: May affect some legacy applications
    estimated_time: 15 minutes
  context:
    rationale: Credential Guard prevents credential theft attacks by protecting NTLM password hashes, Kerberos TGTs, and credentials stored by applications. It blocks pass-the-hash and pass-the-ticket attacks.
    impact: Critical
    false_positive_risk: Low
    references:
    - type: Microsoft
      reference: https://learn.microsoft.com/en-us/windows/security/identity-protection/credential-guard/credential-guard
  tags:
  - credential-protection
  - virtualization-based-security
  - pass-the-hash
  - microsoft

- rule_id: MS-012
  rule_name: Enable Remote Credential Guard
  rule_description: Remote Credential Guard protects credentials over Remote Desktop connections by redirecting Kerberos requests back to the client device, preventing credentials from being sent to the remote host.
  category: Identity Protection
  subcategory: Credential Protection
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check if Remote Credential Guard is configured.'
    check_command: Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -Name DisableRestrictedAdmin -ErrorAction SilentlyContinue
    expected_value: 'DisableRestrictedAdmin -eq 0'
  remediation:
    remediation_step: |
      Enable delegation of nonexportable credentials on remote hosts:
      Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -Name 'DisableRestrictedAdmin' -Value 0 -Type DWORD
      
      Configure clients to use Remote Credential Guard via Group Policy:
      Computer Configuration > Administrative Templates > System > Credentials Delegation
      Enable 'Restrict delegation of credentials to remote servers' and select 'Require Remote Credential Guard'
    rollback_supported: true
    reboot_required: false
    service_impact: May affect RDP connections to non-domain systems
    estimated_time: 10 minutes
  context:
    rationale: Remote Credential Guard prevents credential theft during RDP sessions by keeping credentials on the client device. If the remote host is compromised, credentials are not exposed.
    impact: High
    false_positive_risk: Low
    references:
    - type: Microsoft
      reference: https://learn.microsoft.com/en-us/windows/security/identity-protection/remote-credential-guard
  tags:
  - credential-protection
  - remote-desktop
  - microsoft

- rule_id: MS-013
