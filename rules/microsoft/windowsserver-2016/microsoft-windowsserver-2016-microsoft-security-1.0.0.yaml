- rule_id: MS-043
  rule_name: Configure Cached Logon Count
  rule_description: The number of cached logons should be limited to reduce the risk of credential exposure on portable devices.
  category: Identity Protection
  subcategory: Credential Protection
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check the cached logon count setting.'
    check_command: Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon' -Name CachedLogonsCount -ErrorAction SilentlyContinue
    expected_value: 'CachedLogonsCount -le 2'
  remediation:
    remediation_step: |
      Configure cached logon count via Group Policy:
      Computer Configuration > Windows Settings > Security Settings > Local Policies > Security Options
      Interactive logon: Number of previous logons to cache = 2 or less
      
      Or via registry:
      Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon' -Name 'CachedLogonsCount' -Value 2 -Type String
