  rule_name: Windows Server 2019 must have the Server Message Block (SMB) v1 protocol disabled on the SMB server.
  rule_description: |-
    SMBv1 is a legacy protocol that uses the MD5 algorithm as part of SMB. MD5 is known to be vulnerable to a number of attacks such as collision and preimage attacks as well as not being FIPS compliant.
  category: Security
  subcategory: General
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |-
      Different methods are available to disable SMBv1 on Windows Server 2019, if WN19-00-000380 is configured, this is NA.

      If the following registry value does not exist or is not configured as specified, this is a finding:

      Registry Hive: HKEY_LOCAL_MACHINE
      Registry Path: \SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters\

      Value Name: SMB1

      Type: REG_DWORD
      Value: 0x00000000 (0)
    check_command: |-
      Different methods are available to disable SMBv1 on Windows Server 2019, if WN19-00-000380 is configured, this is NA.

      If the following registry value does not exist or is not configured as specified, this is a finding:

      Registry Hive: HKEY_LOCAL_MACHINE
      Registry Path: \SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters\

      Value Name: SMB1

      Type: REG_DWORD
      Value: 0x00000000 (0)
  remediation:
    remediation_step: |-
      Configure the policy value for Computer Configuration >> Administrative Templates >> MS Security Guide >> "Configure SMBv1 Server" to "Disabled".

      The system must be restarted for the change to take effect.

      This policy setting requires the installation of the SecGuide custom templates included with the STIG package. "SecGuide.admx" and "SecGuide.adml" must be copied to the \Windows\PolicyDefinitions and \Windows\PolicyDefinitions\en-US directories respectively.
