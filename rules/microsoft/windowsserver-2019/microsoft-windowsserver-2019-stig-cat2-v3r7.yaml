  rule_name: Windows Server 2019 maximum age for machine account passwords must be configured to 30 days or less.
  rule_description: |-
    Computer account passwords are changed automatically on a regular basis. This setting controls the maximum password age that a machine account may have. This must be set to no more than 30 days, ensuring the machine changes its password monthly.
  category: Security
  subcategory: General
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "This is the default configuration for this setting (30 days).\n\nIf the following registry value does not exist or is not configured as specified, this is a finding:\n\nRegistry Hive: HKEY_LOCAL_MACHINE \nRegistry Path: \\SYSTEM\\CurrentControlSet\\Services\\Netlogon\\Parameters\\\n\nValue Name: MaximumPasswordAge\n\nValue Type: REG_DWORD\nValue: 0x0000001e (30) (or less, but not 0)"
    check_command: "This is the default configuration for this setting (30 days).\n\nIf the following registry value does not exist or is not configured as specified, this is a finding:\n\nRegistry Hive: HKEY_LOCAL_MACHINE \nRegistry Path: \\SYSTEM\\CurrentControlSet\\Services\\Netlogon\\Parameters\\\n\nValue Name: MaximumPasswordAge\n\nValue Type: REG_DWORD\nValue: 0x0000001e (30) (or less, but not 0)"
  remediation:
    remediation_step: |-
      This is the default configuration for this setting (30 days).

      Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> Security Options >> "Domain member: Maximum machine account password age" to "30" or less (excluding "0", which is unacceptable).
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: |-
