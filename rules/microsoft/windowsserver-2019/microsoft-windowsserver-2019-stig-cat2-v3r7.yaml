  rule_name: Windows Server 2019 must be configured for named-based strong mappings for certificates.
  rule_description: |-
    Weak mappings give rise to security vulnerabilities and demand hardening measures. Certificate names must be correctly mapped to the intended user account in Active Directory. A lack of strong name-based mappings allows certain weak certificate mappings, such as Issuer/Subject AltSecID and User Principal Names (UPN) mappings, to be treated as strong mappings.
  category: Security
  subcategory: General
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "This applies to domain controllers. This is not applicable for member servers.\n\nVerify the effective setting in Local Group Policy Editor.\n\nRun \"gpedit.msc\".\nOr\nUsing the registry, check HKLM\\Software\\Microsoft\\Windows\\CurrentVersion\\Policies\\System\\KDC\\Parameters, Key: UseStrongNameMatches.                      \nOr\nUsing GPRESULT, check the applicable GPO for \"Allow name-based strong mappings for certificates\".\n\nNavigate to Local Computer Policy >> Computer Configuration >> Administrative Template >> System >> KDC >> Allow name-based strong mappings for certificates.\n\nIf \"Allow name-based strong mappings for certificates\" is not \"Enabled\", this is a finding."
    check_command: "This applies to domain controllers. This is not applicable for member servers.\n\nVerify the effective setting in Local Group Policy Editor.\n\nRun \"gpedit.msc\".\nOr\nUsing the registry, check HKLM\\Software\\Microsoft\\Windows\\CurrentVersion\\Policies\\System\\KDC\\Parameters, Key: UseStrongNameMatches.                      \nOr\nUsing GPRESULT, check the applicable GPO for \"Allow name-based strong mappings for certificates\".\n\nNavigate to Local Computer Policy >> Computer Configuration >> Administrative Template >> System >> KDC >> Allow name-based strong mappings for certificates.\n\nIf \"Allow name-based strong mappings for certificates\" is not \"Enabled\", this is a finding."
  remediation:
    remediation_step: |-
      Configure the policy value for Computer Configuration >> Administrative Template >> System >> KDC >> Allow name-based strong mappings for certificates to "Enabled".
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: |-
      Weak mappings give rise to security vulnerabilities and demand hardening measures. Certificate names must be correctly mapped to the intended user account in Active Directory. A lack of strong name-based mappings allows certain weak certificate mappings, such as Issuer/Subject AltSecID and User Principal Names (UPN) mappings, to be treated as strong mappings.
    false_positive_risk: Low
  id: STIG-V-271429
  title: Windows Server 2019 must be configured for named-based strong mappings for certificates.
  description: |-
    Weak mappings give rise to security vulnerabilities and demand hardening measures. Certificate names must be correctly mapped to the intended user account in Active Directory. A lack of strong name-based mappings allows certain weak certificate mappings, such as Issuer/Subject AltSecID and User Principal Names (UPN) mappings, to be treated as strong mappings.
  severity: Medium
  tags:
  - windows
