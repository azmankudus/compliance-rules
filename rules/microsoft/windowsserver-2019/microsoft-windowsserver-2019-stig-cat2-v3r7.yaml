  rule_name: Windows Server 2019 must not have the Fax Server role installed.
  rule_description: |-
    Unnecessary services increase the attack surface of a system. Some of these services may not support required levels of authentication or encryption or may provide unauthorized access to the system.
  category: Security
  subcategory: General
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |-
      Open "PowerShell".

      Enter "Get-WindowsFeature | Where Name -eq Fax".

      If "Installed State" is "Installed", this is a finding.

      An Installed State of "Available" or "Removed" is not a finding.
    check_command: |-
      Open "PowerShell".

      Enter "Get-WindowsFeature | Where Name -eq Fax".

      If "Installed State" is "Installed", this is a finding.

      An Installed State of "Available" or "Removed" is not a finding.
  remediation:
    remediation_step: |-
      Uninstall the "Fax Server" role.

      Start "Server Manager".

      Select the server with the role.

      Scroll down to "ROLES AND FEATURES" in the right pane.

      Select "Remove Roles and Features" from the drop-down "TASKS" list.

      Select the appropriate server on the "Server Selection" page and click "Next".

      Deselect "Fax Server" on the "Roles" page.

      Click "Next" and "Remove" as prompted.
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: |-
      Unnecessary services increase the attack surface of a system. Some of these services may not support required levels of authentication or encryption or may provide unauthorized access to the system.
    false_positive_risk: Low
