  rule_name: |-
    Windows Server 2019 hardened Universal Naming Convention (UNC) paths must be defined to require mutual authentication and integrity for at least the \\*\SYSVOL and \\*\NETLOGON shares.
  rule_description: |-
    Additional security requirements are applied to UNC paths specified in hardened UNC paths before allowing access to them. This aids in preventing tampering with or spoofing of connections to these paths.
  category: Security
  subcategory: General
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |-
      This requirement is applicable to domain-joined systems. For standalone or nondomain-joined systems, this is NA.

      If the following registry values do not exist or are not configured as specified, this is a finding:

      Registry Hive: HKEY_LOCAL_MACHINE
      Registry Path: \SOFTWARE\Policies\Microsoft\Windows\NetworkProvider\HardenedPaths\

      Value Name: \\*\NETLOGON
      Value Type: REG_SZ
      Value: RequireMutualAuthentication=1, RequireIntegrity=1

      Value Name: \\*\SYSVOL
      Value Type: REG_SZ
      Value: RequireMutualAuthentication=1, RequireIntegrity=1

      Additional entries would not be a finding.
    check_command: |-
      This requirement is applicable to domain-joined systems. For standalone or nondomain-joined systems, this is NA.

      If the following registry values do not exist or are not configured as specified, this is a finding:

      Registry Hive: HKEY_LOCAL_MACHINE
      Registry Path: \SOFTWARE\Policies\Microsoft\Windows\NetworkProvider\HardenedPaths\

      Value Name: \\*\NETLOGON
      Value Type: REG_SZ
      Value: RequireMutualAuthentication=1, RequireIntegrity=1

      Value Name: \\*\SYSVOL
      Value Type: REG_SZ
      Value: RequireMutualAuthentication=1, RequireIntegrity=1

      Additional entries would not be a finding.
  remediation:
    remediation_step: |-
      Configure the policy value for Computer Configuration >> Administrative Templates >> Network >> Network Provider >> "Hardened UNC Paths" to "Enabled" with at least the following configured in "Hardened UNC Paths" (click the "Show" button to display):

      Value Name: \\*\SYSVOL
      Value: RequireMutualAuthentication=1, RequireIntegrity=1

      Value Name: \\*\NETLOGON
      Value: RequireMutualAuthentication=1, RequireIntegrity=1
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: |-
      Additional security requirements are applied to UNC paths specified in hardened UNC paths before allowing access to them. This aids in preventing tampering with or spoofing of connections to these paths.
    false_positive_risk: Low
