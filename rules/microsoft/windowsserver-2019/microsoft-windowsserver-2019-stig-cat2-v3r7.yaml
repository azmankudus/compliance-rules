  rule_name: |-
    Windows Server 2019 Deny log on through Remote Desktop Services user right on domain controllers must be configured to prevent unauthenticated access.
  rule_description: |-
    Inappropriate granting of user rights can provide system, administrative, and other high-level capabilities. The "Deny log on through Remote Desktop Services" user right defines the accounts that are prevented from logging on using Remote Desktop Services. The Guests group must be assigned this right to prevent unauthenticated access.
  category: Security
  subcategory: General
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |-
      This applies to domain controllers. A separate version applies to other systems.

      Verify the effective setting in Local Group Policy Editor.

      Run "gpedit.msc".

      Navigate to Local Computer Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment.

      If the following accounts or groups are not defined for the "Deny log on through Remote Desktop Services" user right, this is a finding:

      - Guests Group

      For server core installations, run the following command:

      Secedit /Export /Areas User_Rights /cfg c:\path\filename.txt

      Review the text file.

      If the following SID(s) are not defined for the "SeDenyRemoteInteractiveLogonRight" user right, this is a finding.

      S-1-5-32-546 (Guests)
    check_command: |-
