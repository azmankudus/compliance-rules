- rule_id: STIG-V-254481
  legacy_ids:
  - V-254481
  - SV-254481r991589_rule
  rule_name: |-
    Windows Server 2022 default permissions of global system objects must be strengthened.
  rule_description: |-
    Windows systems maintain a global list of shared system resources such as DOS device names, mutexes, and semaphores. Each type of object is created with a default Discretionary Access Control List (DACL) that specifies who can access the objects with what permissions. When this policy is enabled, the default DACL is stronger, allowing nonadministrative users to read shared objects but not to modify shared objects they did not create.
  category: SRG-OS-000480-GPOS-00227
  subcategory: File Permissions
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "If the following registry value does not exist or is not configured as specified, this is a finding:\n\nRegistry Hive: HKEY_LOCAL_MACHINE \nRegistry Path: \\SYSTEM\\CurrentControlSet\\Control\\Session Manager\\\n\nValue Name: ProtectionMode\n\nValue Type: REG_DWORD\nValue: 0x00000001 (1)"
    check_command: "If the following registry value does not exist or is not configured as specified, this is a finding:\n\nRegistry Hive: HKEY_LOCAL_MACHINE \nRegistry Path: \\SYSTEM\\CurrentControlSet\\Control\\Session Manager\\\n\nValue Name: ProtectionMode\n\nValue Type: REG_DWORD\nValue: 0x00000001 (1)"
  remediation:
    remediation_step: |-
      Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> Security Options >> System objects: Strengthen default permissions of internal system objects (e.g., Symbolic Links) to "Enabled".
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: |-
      Windows systems maintain a global list of shared system resources such as DOS device names, mutexes, and semaphores. Each type of object is created with a default Discretionary Access Control List (DACL) that specifies who can access the objects with what permissions. When this policy is enabled, the default DACL is stronger, allowing nonadministrative users to read shared objects but not to modify shared objects they did not create.
    false_positive_risk: Low
