- rule_id: STIG-V-254337
  legacy_ids:
  - V-254337
  - SV-254337r991589_rule
  rule_name: |-
    Windows Server 2022 must be configured to prevent Internet Control Message Protocol (ICMP) redirects from overriding Open Shortest Path First (OSPF)-generated routes.
  rule_description: |-
    Allowing ICMP redirect of routes can lead to traffic not being routed properly. When disabled, this forces ICMP to be routed via the shortest path first.
  category: SRG-OS-000480-GPOS-00227
  subcategory: Event Logging
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "If the following registry value does not exist or is not configured as specified, this is a finding:\n\nRegistry Hive: HKEY_LOCAL_MACHINE \nRegistry Path: \\SYSTEM\\CurrentControlSet\\Services\\Tcpip\\Parameters\\\n\nValue Name: EnableICMPRedirect\n\nValue Type: REG_DWORD\nValue: 0x00000000 (0)"
    check_command: "If the following registry value does not exist or is not configured as specified, this is a finding:\n\nRegistry Hive: HKEY_LOCAL_MACHINE \nRegistry Path: \\SYSTEM\\CurrentControlSet\\Services\\Tcpip\\Parameters\\\n\nValue Name: EnableICMPRedirect\n\nValue Type: REG_DWORD\nValue: 0x00000000 (0)"
  remediation:
    remediation_step: |-
      Configure the policy value for Computer Configuration >> Administrative Templates >> MSS (Legacy) >> MSS: (EnableICMPRedirect) Allow ICMP redirects to override OSPF generated routes to "Disabled".

      This policy setting requires the installation of the MSS-Legacy custom templates included with the STIG package. "MSS-Legacy.admx" and "MSS-Legacy.adml" must be copied to the \Windows\PolicyDefinitions and \Windows\PolicyDefinitions\en-US directories respectively.
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: |-
      Allowing ICMP redirect of routes can lead to traffic not being routed properly. When disabled, this forces ICMP to be routed via the shortest path first.
    false_positive_risk: Low
  id: STIG-V-254337
  title: |-
    Windows Server 2022 must be configured to prevent Internet Control Message Protocol (ICMP) redirects from overriding Open Shortest Path First (OSPF)-generated routes.
  description: |-
    Allowing ICMP redirect of routes can lead to traffic not being routed properly. When disabled, this forces ICMP to be routed via the shortest path first.
  severity: Low
  tags:
  - server
  - windows
  - logging
- rule_id: STIG-V-254338
  legacy_ids:
  - V-254338
  - SV-254338r958902_rule
  rule_name: |-
    Windows Server 2022 must be configured to ignore NetBIOS name release requests except from WINS servers.
  rule_description: |-
    Configuring the system to ignore name release requests, except from WINS servers, prevents a denial of service (DoS) attack. The DoS consists of sending a NetBIOS name release request to the server for each entry in the server's cache, causing a response delay in the normal operation of the server's WINS resolution capability.
  category: SRG-OS-000420-GPOS-00186
  subcategory: Configuration
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |-
      If the following registry value does not exist or is not configured as specified, this is a finding:

      Registry Hive:  HKEY_LOCAL_MACHINE
      Registry Path:  \SYSTEM\CurrentControlSet\Services\Netbt\Parameters\

      Value Name:  NoNameReleaseOnDemand

      Value Type:  REG_DWORD
      Value:  0x00000001 (1)
    check_command: |-
      If the following registry value does not exist or is not configured as specified, this is a finding:

      Registry Hive:  HKEY_LOCAL_MACHINE
      Registry Path:  \SYSTEM\CurrentControlSet\Services\Netbt\Parameters\

      Value Name:  NoNameReleaseOnDemand

      Value Type:  REG_DWORD
      Value:  0x00000001 (1)
  remediation:
    remediation_step: |-
      Configure the policy value for Computer Configuration >> Administrative Templates >> MSS (Legacy) >> MSS: (NoNameReleaseOnDemand) Allow the computer to ignore NetBIOS name release requests except from WINS servers to "Enabled".

      This policy setting requires the installation of the MSS-Legacy custom templates included with the STIG package. "MSS-Legacy.admx" and "MSS-Legacy.adml" must be copied to the \Windows\PolicyDefinitions and \Windows\PolicyDefinitions\en-US directories respectively.
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: |-
      Configuring the system to ignore name release requests, except from WINS servers, prevents a denial of service (DoS) attack. The DoS consists of sending a NetBIOS name release request to the server for each entry in the server's cache, causing a response delay in the normal operation of the server's WINS resolution capability.
    false_positive_risk: Low
  id: STIG-V-254338
  title: |-
    Windows Server 2022 must be configured to ignore NetBIOS name release requests except from WINS servers.
  description: |-
    Configuring the system to ignore name release requests, except from WINS servers, prevents a denial of service (DoS) attack. The DoS consists of sending a NetBIOS name release request to the server for each entry in the server's cache, causing a response delay in the normal operation of the server's WINS resolution capability.
  severity: Low
  tags:
  - server
  - windows
- rule_id: STIG-V-254351
  legacy_ids:
  - V-254351
  - SV-254351r958478_rule
  rule_name: |-
    Windows Server 2022 Application Compatibility Program Inventory must be prevented from collecting data and sending the information to Microsoft.
  rule_description: |-
    Some features may communicate with the vendor, sending system information or downloading data or components for the feature. Turning off this capability will prevent potentially sensitive information from being sent outside the enterprise and will prevent uncontrolled updates to the system.

    This setting will prevent the Program Inventory from collecting data about a system and sending the information to Microsoft.
  category: SRG-OS-000095-GPOS-00049
  subcategory: Event Logging
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |-
      If the following registry value does not exist or is not configured as specified, this is a finding:

      Registry Hive: HKEY_LOCAL_MACHINE
      Registry Path: \SOFTWARE\Policies\Microsoft\Windows\AppCompat\

      Value Name: DisableInventory

      Type: REG_DWORD
      Value: 0x00000001 (1)
    check_command: |-
      If the following registry value does not exist or is not configured as specified, this is a finding:

      Registry Hive: HKEY_LOCAL_MACHINE
      Registry Path: \SOFTWARE\Policies\Microsoft\Windows\AppCompat\

      Value Name: DisableInventory

      Type: REG_DWORD
      Value: 0x00000001 (1)
  remediation:
    remediation_step: |-
      Configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components >> Application Compatibility >> Turn off Inventory Collector to "Enabled".
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: |-
      Some features may communicate with the vendor, sending system information or downloading data or components for the feature. Turning off this capability will prevent potentially sensitive information from being sent outside the enterprise and will prevent uncontrolled updates to the system.

      This setting will prevent the Program Inventory from collecting data about a system and sending the information to Microsoft.
    false_positive_risk: Low
  id: STIG-V-254351
  title: |-
