- rule_id: STIG-V-254357
  legacy_ids:
  - V-254357
  - SV-254357r991589_rule
  rule_name: |-
    Windows Server 2022 Windows Update must not obtain updates from other PCs on the internet.
  rule_description: |-
    Windows Update can obtain updates from additional sources instead of Microsoft. In addition to Microsoft, updates can be obtained from and sent to PCs on the local network as well as on the internet. This is part of the Windows Update trusted process; however, to minimize outside exposure, obtaining updates from or sending to systems on the internet must be prevented.
  category: SRG-OS-000480-GPOS-00227
  subcategory: Configuration
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |-
      If the following registry value does not exist or is not configured as specified, this is a finding:

      Registry Hive: HKEY_LOCAL_MACHINE
      Registry Path: \SOFTWARE\Policies\Microsoft\Windows\DeliveryOptimization\

      Value Name: DODownloadMode

      Value Type: REG_DWORD
      Value: 0x00000000 (0) - No peering (HTTP Only)
      0x00000001 (1) - Peers on same NAT only (LAN)
      0x00000002 (2) - Local Network / Private group peering (Group)
      0x00000063 (99) - Simple download mode, no peering (Simple)

      A value of 0x00000003 (3), Internet, is a finding.
    check_command: |-
      If the following registry value does not exist or is not configured as specified, this is a finding:

      Registry Hive: HKEY_LOCAL_MACHINE
      Registry Path: \SOFTWARE\Policies\Microsoft\Windows\DeliveryOptimization\

      Value Name: DODownloadMode

      Value Type: REG_DWORD
      Value: 0x00000000 (0) - No peering (HTTP Only)
      0x00000001 (1) - Peers on same NAT only (LAN)
      0x00000002 (2) - Local Network / Private group peering (Group)
      0x00000063 (99) - Simple download mode, no peering (Simple)

      A value of 0x00000003 (3), Internet, is a finding.
  remediation:
    remediation_step: |-
      Configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components >> Delivery Optimization >> Download Mode to "Enabled" with any option except "Internet" selected.

      Acceptable selections include:

      HTTP only (0)
      LAN (1)
      Group (2)
      Internet (3)
      Simple (99)
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: |-
      Windows Update can obtain updates from additional sources instead of Microsoft. In addition to Microsoft, updates can be obtained from and sent to PCs on the local network as well as on the internet. This is part of the Windows Update trusted process; however, to minimize outside exposure, obtaining updates from or sending to systems on the internet must be prevented.
    false_positive_risk: Low
  id: STIG-V-254357
  title: |-
    Windows Server 2022 Windows Update must not obtain updates from other PCs on the internet.
  description: |-
    Windows Update can obtain updates from additional sources instead of Microsoft. In addition to Microsoft, updates can be obtained from and sent to PCs on the local network as well as on the internet. This is part of the Windows Update trusted process; however, to minimize outside exposure, obtaining updates from or sending to systems on the internet must be prevented.
  severity: Low
  tags:
  - server
  - windows
- rule_id: STIG-V-254363
  legacy_ids:
  - V-254363
  - SV-254363r991589_rule
  rule_name: |-
    Windows Server 2022 Turning off File Explorer heap termination on corruption must be disabled.
  rule_description: |-
    Legacy plug-in applications may continue to function when a File Explorer session has become corrupt. Disabling this feature will prevent this.
  category: SRG-OS-000480-GPOS-00227
  subcategory: Configuration
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |-
      The default behavior is for File Explorer heap termination on corruption to be enabled.

      If the registry Value Name below does not exist, this is not a finding.

      If it exists and is configured with a value of "0", this is not a finding.

      If it exists and is configured with a value of "1", this is a finding.

      Registry Hive: HKEY_LOCAL_MACHINE
      Registry Path: \SOFTWARE\Policies\Microsoft\Windows\Explorer\

      Value Name: NoHeapTerminationOnCorruption

      Value Type: REG_DWORD
      Value: 0x00000000 (0) (or if the Value Name does not exist)
    check_command: |-
      The default behavior is for File Explorer heap termination on corruption to be enabled.

      If the registry Value Name below does not exist, this is not a finding.

      If it exists and is configured with a value of "0", this is not a finding.

      If it exists and is configured with a value of "1", this is a finding.

      Registry Hive: HKEY_LOCAL_MACHINE
      Registry Path: \SOFTWARE\Policies\Microsoft\Windows\Explorer\

      Value Name: NoHeapTerminationOnCorruption

      Value Type: REG_DWORD
      Value: 0x00000000 (0) (or if the Value Name does not exist)
  remediation:
    remediation_step: |-
      The default behavior is for File Explorer heap termination on corruption to be disabled.

      If this needs to be corrected, configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components >> File Explorer >> Turn off heap termination on corruption to "Not Configured" or "Disabled".
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: |-
      Legacy plug-in applications may continue to function when a File Explorer session has become corrupt. Disabling this feature will prevent this.
    false_positive_risk: Low
  id: STIG-V-254363
  title: |-
    Windows Server 2022 Turning off File Explorer heap termination on corruption must be disabled.
  description: |-
    Legacy plug-in applications may continue to function when a File Explorer session has become corrupt. Disabling this feature will prevent this.
  severity: Low
  tags:
  - server
  - windows
- rule_id: STIG-V-254400
  legacy_ids:
  - V-254400
  - SV-254400r970703_rule
  rule_name: |-
    Windows Server 2022 directory service must be configured to terminate LDAP-based network connections to the directory server after five minutes of inactivity.
  rule_description: |-
    The failure to terminate inactive network connections increases the risk of a successful attack on the directory server. The longer an established session is in progress, the more time an attacker has to hijack the session, implement a means to passively intercept data, or compromise any protections on client access. For example, if an attacker gains control of a client computer, an existing (already authenticated) session with the directory server could allow access to the directory. The lack of confidentiality protection in LDAP-based sessions increases exposure to this vulnerability.

    Satisfies: SRG-OS-000163-GPOS-00072, SRG-OS-000279-GPOS-00109
  category: SRG-OS-000163-GPOS-00072
  subcategory: Network Configuration
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "This applies to domain controllers. It is NA for other systems.\n\nOpen an elevated \"Command Prompt\" (run as administrator).\n\nEnter \"ntdsutil\".\n\nAt the \"ntdsutil:\" prompt, enter \"LDAP policies\".\n\nAt the \"ldap policy:\" prompt, enter \"connections\".\n\nAt the \"server connections:\" prompt, enter \"connect to server [host-name]\"\n(where [host-name] is the computer name of the domain controller).\n\nAt the \"server connections:\" prompt, enter \"q\".\n\nAt the \"ldap policy:\" prompt, enter \"show values\". \n\nIf the value for MaxConnIdleTime is greater than \"300\" (5 minutes) or is not specified, this is a finding.\n\nEnter \"q\" at the \"ldap policy:\" and \"ntdsutil:\" prompts to exit.\n\nAlternately, Dsquery can be used to display MaxConnIdleTime:\n\nOpen \"Command Prompt (Admin)\".\nEnter the following command (on a single line).\n\ndsquery * \"cn=Default Query Policy,cn=Query-Policies,cn=Directory Service, cn=Windows NT,cn=Services,cn=Configuration,dc=[forest-name]\"\
      \ -attr LDAPAdminLimits \n\nThe quotes are required and dc=[forest-name] is the fully qualified LDAP name of the domain being reviewed (e.g., dc=disaost,dc=mil).\n\nIf the results do not specify a \"MaxConnIdleTime\" or it has a value greater than \"300\" (5 minutes), this is a finding."
    check_command: "This applies to domain controllers. It is NA for other systems.\n\nOpen an elevated \"Command Prompt\" (run as administrator).\n\nEnter \"ntdsutil\".\n\nAt the \"ntdsutil:\" prompt, enter \"LDAP policies\".\n\nAt the \"ldap policy:\" prompt, enter \"connections\".\n\nAt the \"server connections:\" prompt, enter \"connect to server [host-name]\"\n(where [host-name] is the computer name of the domain controller).\n\nAt the \"server connections:\" prompt, enter \"q\".\n\nAt the \"ldap policy:\" prompt, enter \"show values\". \n\nIf the value for MaxConnIdleTime is greater than \"300\" (5 minutes) or is not specified, this is a finding.\n\nEnter \"q\" at the \"ldap policy:\" and \"ntdsutil:\" prompts to exit.\n\nAlternately, Dsquery can be used to display MaxConnIdleTime:\n\nOpen \"Command Prompt (Admin)\".\nEnter the following command (on a single line).\n\ndsquery * \"cn=Default Query Policy,cn=Query-Policies,cn=Directory Service, cn=Windows NT,cn=Services,cn=Configuration,dc=[forest-name]\"\
      \ -attr LDAPAdminLimits \n\nThe quotes are required and dc=[forest-name] is the fully qualified LDAP name of the domain being reviewed (e.g., dc=disaost,dc=mil).\n\nIf the results do not specify a \"MaxConnIdleTime\" or it has a value greater than \"300\" (5 minutes), this is a finding."
  remediation:
    remediation_step: |-
      Configure the directory service to terminate LDAP-based network connections to the directory server after 5 minutes of inactivity.

      Open an elevated "Command prompt" (run as administrator).

      Enter "ntdsutil".

      At the "ntdsutil:" prompt, enter "LDAP policies".

      At the "ldap policy:" prompt, enter "connections".

      At the "server connections:" prompt, enter "connect to server [host-name]" (where [host-name] is the computer name of the domain controller).

      At the "server connections:" prompt, enter "q".

      At the "ldap policy:" prompt, enter "Set MaxConnIdleTime to 300".

      Enter "Commit Changes" to save.

      Enter "Show values" to verify changes.

      Enter "q" at the "ldap policy:" and "ntdsutil:" prompts to exit.
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: |-
      The failure to terminate inactive network connections increases the risk of a successful attack on the directory server. The longer an established session is in progress, the more time an attacker has to hijack the session, implement a means to passively intercept data, or compromise any protections on client access. For example, if an attacker gains control of a client computer, an existing (already authenticated) session with the directory server could allow access to the directory. The lack of confidentiality protection in LDAP-based sessions increases exposure to this vulnerability.

      Satisfies: SRG-OS-000163-GPOS-00072, SRG-OS-000279-GPOS-00109
    false_positive_risk: Low
