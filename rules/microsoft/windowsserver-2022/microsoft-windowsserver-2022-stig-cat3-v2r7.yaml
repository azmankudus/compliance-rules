- rule_id: STIG-V-254335
  legacy_ids:
  - V-254335
  - SV-254335r991589_rule
  rule_name: |-
    Windows Server 2022 Internet Protocol version 6 (IPv6) source routing must be configured to the highest protection level to prevent IP source routing.
  rule_description: Configuring the system to disable IPv6 source routing protects against spoofing.
  category: SRG-OS-000480-GPOS-00227
  subcategory: Event Logging
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |-
      If the following registry value does not exist or is not configured as specified, this is a finding:

      Registry Hive: HKEY_LOCAL_MACHINE
      Registry Path: \SYSTEM\CurrentControlSet\Services\Tcpip6\Parameters\

      Value Name: DisableIPSourceRouting

      Type: REG_DWORD
      Value: 0x00000002 (2)
    check_command: |-
      If the following registry value does not exist or is not configured as specified, this is a finding:

      Registry Hive: HKEY_LOCAL_MACHINE
      Registry Path: \SYSTEM\CurrentControlSet\Services\Tcpip6\Parameters\

      Value Name: DisableIPSourceRouting

      Type: REG_DWORD
      Value: 0x00000002 (2)
  remediation:
    remediation_step: |-
      Configure the policy value for Computer Configuration >> Administrative Templates >> MSS (Legacy) >> MSS: (DisableIPSourceRouting IPv6) IP source routing protection level (protects against packet spoofing) to "Enabled" with "Highest protection, source routing is completely disabled" selected.

      This policy setting requires the installation of the MSS-Legacy custom templates included with the STIG package. "MSS-Legacy.admx" and "MSS-Legacy.adml" must be copied to the \Windows\PolicyDefinitions and \Windows\PolicyDefinitions\en-US directories respectively.
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: Configuring the system to disable IPv6 source routing protects against spoofing.
    false_positive_risk: Low
  id: STIG-V-254335
  title: |-
    Windows Server 2022 Internet Protocol version 6 (IPv6) source routing must be configured to the highest protection level to prevent IP source routing.
  description: Configuring the system to disable IPv6 source routing protects against spoofing.
  severity: Low
  tags:
  - server
  - windows
  - logging
