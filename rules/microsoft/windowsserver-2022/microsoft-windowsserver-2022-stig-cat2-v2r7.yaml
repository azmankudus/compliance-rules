  - SV-254249r991589_rule
  rule_name: |-
    Windows Server 2022 must have a host-based intrusion detection or prevention system.
  rule_description: |-
    A properly configured Host-based Intrusion Detection System (HIDS) or Host-based Intrusion Prevention System (HIPS) provides another level of defense against unauthorized access to critical servers. With proper configuration and logging enabled, such a system can stop and/or alert for many attempts to gain unauthorized access to resources.
  category: SRG-OS-000480-GPOS-00227
  subcategory: Event Logging
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "Determine whether there is a HIDS or HIPS on each server. \n\nIf the HIPS component of ESS is installed and active on the host and the alerts of blocked activity are being logged and monitored, this meets the requirement. \n\nA HIDS device is not required on a system that has the role as the Network Intrusion Device (NID). However, this exception needs to be documented with the Information System Security Officer (ISSO).\n\nIf a HIDS is not installed on the system, this is a finding."
    check_command: "Determine whether there is a HIDS or HIPS on each server. \n\nIf the HIPS component of ESS is installed and active on the host and the alerts of blocked activity are being logged and monitored, this meets the requirement. \n\nA HIDS device is not required on a system that has the role as the Network Intrusion Device (NID). However, this exception needs to be documented with the Information System Security Officer (ISSO).\n\nIf a HIDS is not installed on the system, this is a finding."
  remediation:
    remediation_step: Install a HIDS or HIPS on each server.
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: |-
      A properly configured Host-based Intrusion Detection System (HIDS) or Host-based Intrusion Prevention System (HIPS) provides another level of defense against unauthorized access to critical servers. With proper configuration and logging enabled, such a system can stop and/or alert for many attempts to gain unauthorized access to resources.
    false_positive_risk: Low
