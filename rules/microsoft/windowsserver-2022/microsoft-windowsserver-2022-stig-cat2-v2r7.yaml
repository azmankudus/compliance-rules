- rule_id: STIG-V-254397
  legacy_ids:
  - V-254397
  - SV-254397r958478_rule
  rule_name: |-
    Windows Server 2022 domain controllers must run on a machine dedicated to that function.
  rule_description: "Executing application servers on the same host machine with a directory server may substantially weaken the security of the directory server. Web or database server applications usually require the addition of many programs and accounts, increasing the attack surface of the computer. \n\nSome applications require the addition of privileged accounts, providing potential sources of compromise. Some applications (such as Microsoft Exchange) may require the use of network ports or services conflicting with the directory server. In this case, nonstandard ports might be selected, and this could interfere with intrusion detection or prevention services."
  category: SRG-OS-000095-GPOS-00049
  subcategory: Configuration
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "This applies to domain controllers, it is NA for other systems.\n\nReview the installed roles the domain controller is supporting.\n\nStart \"Server Manager\".\n\nSelect \"AD DS\" in the left pane and the server name under \"Servers\" to the right.\n\nSelect \"Add (or Remove) Roles and Features\" from \"Tasks\" in the \"Roles and Features\" section. (Cancel before any changes are made.)\n\nDetermine if any additional server roles are installed. A basic domain controller setup will include the following:\n\n- Active Directory Domain Services\n- DNS Server\n- File and Storage Services\n\nIf any roles not requiring installation on a domain controller are installed, this is a finding. \n\nA Domain Name System (DNS) server integrated with the directory server (e.g., AD-integrated DNS) is an acceptable application. However, the DNS server must comply with the DNS STIG security requirements.\n\nRun \"Programs and Features\".\n\nReview installed applications.\n\nIf any applications\
      \ are installed that are not required for the domain controller, this is a finding."
    check_command: "This applies to domain controllers, it is NA for other systems.\n\nReview the installed roles the domain controller is supporting.\n\nStart \"Server Manager\".\n\nSelect \"AD DS\" in the left pane and the server name under \"Servers\" to the right.\n\nSelect \"Add (or Remove) Roles and Features\" from \"Tasks\" in the \"Roles and Features\" section. (Cancel before any changes are made.)\n\nDetermine if any additional server roles are installed. A basic domain controller setup will include the following:\n\n- Active Directory Domain Services\n- DNS Server\n- File and Storage Services\n\nIf any roles not requiring installation on a domain controller are installed, this is a finding. \n\nA Domain Name System (DNS) server integrated with the directory server (e.g., AD-integrated DNS) is an acceptable application. However, the DNS server must comply with the DNS STIG security requirements.\n\nRun \"Programs and Features\".\n\nReview installed applications.\n\nIf any applications\
      \ are installed that are not required for the domain controller, this is a finding."
  remediation:
    remediation_step: |-
      Remove additional roles or applications such as web, database, and email from the domain controller.
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: "Executing application servers on the same host machine with a directory server may substantially weaken the security of the directory server. Web or database server applications usually require the addition of many programs and accounts, increasing the attack surface of the computer. \n\nSome applications require the addition of privileged accounts, providing potential sources of compromise. Some applications (such as Microsoft Exchange) may require the use of network ports or services conflicting with the directory server. In this case, nonstandard ports might be selected, and this could interfere with intrusion detection or prevention services."
    false_positive_risk: Low
