- rule_id: STIG-V-254247
  legacy_ids:
  - V-254247
  - SV-254247r991589_rule
  rule_name: Windows Server 2022 must be maintained at a supported servicing level.
  rule_description: |-
    Systems at unsupported servicing levels will not receive security updates for new vulnerabilities, which leave them subject to exploitation. Systems must be maintained at a servicing level supported by the vendor with new security updates.
  category: SRG-OS-000480-GPOS-00227
  subcategory: Configuration
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |-
      Open "Command Prompt".

      Enter "winver.exe".

      If the "About Windows" dialog box does not display "Microsoft Windows Server Version 21H1 (Build 20348.xxx)" or greater, this is a finding.

      Preview versions must not be used in a production environment.
    check_command: |-
      Open "Command Prompt".

      Enter "winver.exe".

      If the "About Windows" dialog box does not display "Microsoft Windows Server Version 21H1 (Build 20348.xxx)" or greater, this is a finding.

      Preview versions must not be used in a production environment.
  remediation:
    remediation_step: Update the system to a Version 21H2 (Build 20348.xxx) or greater.
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: |-
      Systems at unsupported servicing levels will not receive security updates for new vulnerabilities, which leave them subject to exploitation. Systems must be maintained at a servicing level supported by the vendor with new security updates.
    false_positive_risk: Low
  id: STIG-V-254247
