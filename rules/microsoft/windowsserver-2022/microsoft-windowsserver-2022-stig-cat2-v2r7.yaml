      Select the "Security" tab, and the "Advanced" button.

      Default permissions:
      C:\
      Type - "Allow" for all
      Inherited from - "None" for all

      Principal - Access - Applies to

      SYSTEM - Full control - This folder, subfolders, and files
      Administrators - Full control - This folder, subfolders, and files
      Users - Read & execute - This folder, subfolders, and files
      Users - Create folders/append data - This folder and subfolders
      Users - Create files/write data - Subfolders only
      CREATOR OWNER - Full Control - Subfolders and files only

      Alternately, use icacls:

      Open "Command Prompt (Admin)".

      Enter "icacls" followed by the directory:

      "icacls c:\"

      The following results must be displayed:

      c:\
      NT AUTHORITY\SYSTEM:(OI)(CI)(F)
      BUILTIN\Administrators:(OI)(CI)(F)
      BUILTIN\Users:(OI)(CI)(RX)
      BUILTIN\Users:(CI)(AD)
      BUILTIN\Users:(CI)(IO)(WD)
      CREATOR OWNER:(OI)(CI)(IO)(F)
      Successfully processed 1 files; Failed processing 0 files
  remediation:
    remediation_step: |-
      Maintain the default permissions for the system drive's root directory and configure the Security Option "Network access: Let Everyone permissions apply to anonymous users" to "Disabled" (WN22-SO-000240).

      Default Permissions
      C:\
      Type - "Allow" for all
      Inherited from - "None" for all

      Principal - Access - Applies to

      SYSTEM - Full control - This folder, subfolders, and files
      Administrators - Full control - This folder, subfolders, and files
      Users - Read & execute - This folder, subfolders, and files
      Users - Create folders/append data - This folder and subfolders
      Users - Create files/write data - Subfolders only
      CREATOR OWNER - Full Control - Subfolders and files only
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: |-
      Changing the system's file and directory permissions allows the possibility of unauthorized and anonymous modification to the operating system and installed applications.

      The default permissions are adequate when the Security Option "Network access: Let Everyone permissions apply to anonymous users" is set to "Disabled" (WN22-SO-000240).

      Satisfies: SRG-OS-000312-GPOS-00122, SRG-OS-000312-GPOS-00123, SRG-OS-000312-GPOS-00124
    false_positive_risk: Low
