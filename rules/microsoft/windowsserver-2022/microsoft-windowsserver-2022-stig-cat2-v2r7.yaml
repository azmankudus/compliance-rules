- rule_id: STIG-V-271426
  legacy_ids:
  - V-271426
  - SV-271426r1137691_rule
  rule_name: |-
    Windows Server 2022 must be configured for certificate-based authentication for domain controllers.
  rule_description: |-
    Active Directory domain services elevation of privilege vulnerability could allow a user rights to the system, such as administrative and other high-level capabilities.
  category: SRG-OS-000080-GPOS-00048
  subcategory: Authentication
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "This applies to domain controllers. This is not applicable for member servers.\n\nIf the following registry value does not exist or is not configured as specified, this is a finding:\nRegistry Hive: HKEY_LOCAL_MACHINE\nRegistry Path: SYSTEM\\CurrentControlSet\\Services\\Kdc\n \nValue Name: StrongCertificateBindingEnforcement\n \nValue Type: REG_DWORD\nValue: 0x00000001 (1) or 0x00000002 (2)"
    check_command: "This applies to domain controllers. This is not applicable for member servers.\n\nIf the following registry value does not exist or is not configured as specified, this is a finding:\nRegistry Hive: HKEY_LOCAL_MACHINE\nRegistry Path: SYSTEM\\CurrentControlSet\\Services\\Kdc\n \nValue Name: StrongCertificateBindingEnforcement\n \nValue Type: REG_DWORD\nValue: 0x00000001 (1) or 0x00000002 (2)"
  remediation:
    remediation_step: "Configure the registry value.\nRegistry Hive: HKEY_LOCAL_MACHINE\nRegistry Path: SYSTEM\\CurrentControlSet\\Services\\Kdc\n \nValue Name: StrongCertificateBindingEnforcement\n \nValue Type: REG_DWORD\nValue: 0x00000001 (1) or 0x00000002 (2)"
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: |-
      Active Directory domain services elevation of privilege vulnerability could allow a user rights to the system, such as administrative and other high-level capabilities.
    false_positive_risk: Low
  id: STIG-V-271426
  title: |-
    Windows Server 2022 must be configured for certificate-based authentication for domain controllers.
  description: |-
    Active Directory domain services elevation of privilege vulnerability could allow a user rights to the system, such as administrative and other high-level capabilities.
  severity: Medium
  tags:
  - server
  - authentication
  - windows
  - domain
- rule_id: STIG-V-271427
  legacy_ids:
  - V-271427
  - SV-271427r1137691_rule
  rule_name: |-
    Windows Server 2022 must be configured for name-based strong mappings for certificates.
  rule_description: |-
    Weak mappings give rise to security vulnerabilities and demand hardening measures. Certificate names must be correctly mapped to the intended user account in Active Directory. A lack of strong name-based mappings allows certain weak certificate mappings, such as Issuer/Subject AltSecID and User Principal Names (UPN) mappings, to be treated as strong mappings.
  category: SRG-OS-000080-GPOS-00048
  subcategory: Configuration
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |-
      This applies to domain controllers. This is not applicable for member servers.

      Verify the effective setting in Local Group Policy Editor.

      Run "gpedit.msc".

      Navigate to Local Computer Policy >> Computer Configuration >> Administrative Template >> System >> KDC >> Allow name-based strong mappings for certificates.

      If "Allow name-based strong mappings for certificates" is not "Enabled", this is a finding.
    check_command: |-
      This applies to domain controllers. This is not applicable for member servers.

      Verify the effective setting in Local Group Policy Editor.

      Run "gpedit.msc".

      Navigate to Local Computer Policy >> Computer Configuration >> Administrative Template >> System >> KDC >> Allow name-based strong mappings for certificates.

      If "Allow name-based strong mappings for certificates" is not "Enabled", this is a finding.
  remediation:
    remediation_step: |-
      Configure the policy value for Computer Configuration >> Administrative Template >> System >> KDC >> Allow name-based strong mappings for certificates to "Enabled".
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: |-
      Weak mappings give rise to security vulnerabilities and demand hardening measures. Certificate names must be correctly mapped to the intended user account in Active Directory. A lack of strong name-based mappings allows certain weak certificate mappings, such as Issuer/Subject AltSecID and User Principal Names (UPN) mappings, to be treated as strong mappings.
    false_positive_risk: Low
  id: STIG-V-271427
  title: |-
    Windows Server 2022 must be configured for name-based strong mappings for certificates.
  description: |-
    Weak mappings give rise to security vulnerabilities and demand hardening measures. Certificate names must be correctly mapped to the intended user account in Active Directory. A lack of strong name-based mappings allows certain weak certificate mappings, such as Issuer/Subject AltSecID and User Principal Names (UPN) mappings, to be treated as strong mappings.
  severity: Medium
  tags:
  - server
  - windows
- rule_id: STIG-V-278942
  legacy_ids:
  - V-278942
  - SV-278942r1135355_rule
  rule_name: Windows Server 2022 must be configured to audit file system failures.
  rule_description: |-
    Maintaining an audit trail of system activity logs can help identify configuration errors, troubleshoot service disruptions, and analyze compromises that have occurred, as well as detect attacks. Audit logs are necessary to provide a trail of evidence in case the system or network is compromised. Collecting this data is essential for analyzing the security of information assets and detecting signs of suspicious and unexpected behavior. Credential validation records events related to validation tests on credentials for a user account logon.
  category: SRG-OS-000062-GPOS-00031
  subcategory: Auditing
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "Verify that Audit File System auditing has been enabled: \n\nComputer Configuration >> Windows Settings >> Security Settings >> Advanced Audit Policy Configuration >> System Audit Policies >> Object Access >> Audit File System. \n\nIf \"Audit File System\" is not set to \"Failure\", this is a finding."
    check_command: "Verify that Audit File System auditing has been enabled: \n\nComputer Configuration >> Windows Settings >> Security Settings >> Advanced Audit Policy Configuration >> System Audit Policies >> Object Access >> Audit File System. \n\nIf \"Audit File System\" is not set to \"Failure\", this is a finding."
  remediation:
    remediation_step: |-
      Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >> Advanced Audit Policy Configuration >> System Audit Policies >> Object Access >> "Audit File System" with "Failure" selected.
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: |-
      Maintaining an audit trail of system activity logs can help identify configuration errors, troubleshoot service disruptions, and analyze compromises that have occurred, as well as detect attacks. Audit logs are necessary to provide a trail of evidence in case the system or network is compromised. Collecting this data is essential for analyzing the security of information assets and detecting signs of suspicious and unexpected behavior. Credential validation records events related to validation tests on credentials for a user account logon.
    false_positive_risk: Low
