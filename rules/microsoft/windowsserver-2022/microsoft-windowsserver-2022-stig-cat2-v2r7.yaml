- rule_id: STIG-V-254396
  legacy_ids:
  - V-254396
  - SV-254396r1137695_rule
  rule_name: |-
    Windows Server 2022 data files owned by users must be on a different logical partition from the directory server data files.
  rule_description: "When directory service data files, especially for directories used for identification, authentication, or authorization, reside on the same logical partition as user-owned files, the directory service data may be more vulnerable to unauthorized access or other availability compromises. Directory service and user-owned data files sharing a partition may be configured with less restrictive permissions in order to allow access to the user data. \n\nThe directory service may be vulnerable to a denial of service attack when user-owned files on a common partition are expanded to an extent preventing the directory service from acquiring more space for directory or audit data."
  category: SRG-OS-000138-GPOS-00069
  subcategory: Event Logging
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |-
      This applies to domain controllers. It is NA for other systems.

      Run "Regedit".

      Navigate to "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\NTDS\Parameters".

      Note the directory locations in the values for "DSA Database file".

      Open "Command Prompt".

      Enter "net share".

      Note the logical drive(s) or file system partition for any organization-created data shares.

      Ignore system shares (e.g., NETLOGON, SYSVOL, and administrative shares ending in $). User shares that are hidden (ending with $) must not be ignored.

      If user shares are located on the same logical partition as the directory server data files, this is a finding.
    check_command: |-
      This applies to domain controllers. It is NA for other systems.

      Run "Regedit".

      Navigate to "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\NTDS\Parameters".

      Note the directory locations in the values for "DSA Database file".

      Open "Command Prompt".

      Enter "net share".

      Note the logical drive(s) or file system partition for any organization-created data shares.

      Ignore system shares (e.g., NETLOGON, SYSVOL, and administrative shares ending in $). User shares that are hidden (ending with $) must not be ignored.

      If user shares are located on the same logical partition as the directory server data files, this is a finding.
  remediation:
    remediation_step: |-
      Move shares used to store files owned by users to a different logical partition than the directory server data files.
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: "When directory service data files, especially for directories used for identification, authentication, or authorization, reside on the same logical partition as user-owned files, the directory service data may be more vulnerable to unauthorized access or other availability compromises. Directory service and user-owned data files sharing a partition may be configured with less restrictive permissions in order to allow access to the user data. \n\nThe directory service may be vulnerable to a denial of service attack when user-owned files on a common partition are expanded to an extent preventing the directory service from acquiring more space for directory or audit data."
    false_positive_risk: Low
