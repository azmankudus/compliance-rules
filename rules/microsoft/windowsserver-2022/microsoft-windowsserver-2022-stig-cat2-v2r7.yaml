    check_command: "If the following registry value does not exist or is not configured as specified, this is a finding:\n\nRegistry Hive: HKEY_LOCAL_MACHINE \nRegistry Path: \\SYSTEM\\CurrentControlSet\\Services\\Netlogon\\Parameters\\\n\nValue Name: RequireStrongKey\n\nValue Type: REG_DWORD\nValue: 0x00000001 (1)\n \nThis setting may prevent a system from being joined to a domain if not configured consistently between systems."
  remediation:
    remediation_step: |-
      Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> Security Options >> Domain member: Require strong (Windows 2000 or Later) session key to "Enabled".
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
