- rule_id: STIG-V-254238
  legacy_ids:
  - V-254238
  - SV-254238r991589_rule
  rule_name: |-
    Windows Server 2022 users with Administrative privileges must have separate accounts for administrative duties and normal operational tasks.
  rule_description: |-
    Using a privileged account to perform routine functions makes the computer vulnerable to malicious software inadvertently introduced during a session that has been granted full privileges.
  category: SRG-OS-000480-GPOS-00227
  subcategory: Account Management
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "Verify each user with administrative privileges has been assigned a unique administrative account separate from their standard user account. \n\nIf users with administrative privileges do not have separate accounts for administrative functions and standard user functions, this is a finding."
    check_command: "Verify each user with administrative privileges has been assigned a unique administrative account separate from their standard user account. \n\nIf users with administrative privileges do not have separate accounts for administrative functions and standard user functions, this is a finding."
  remediation:
    remediation_step: |-
      Ensure each user with administrative privileges has a separate account for user duties and one for privileged duties.
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: |-
      Using a privileged account to perform routine functions makes the computer vulnerable to malicious software inadvertently introduced during a session that has been granted full privileges.
    false_positive_risk: Low
  id: STIG-V-254238
  title: |-
    Windows Server 2022 users with Administrative privileges must have separate accounts for administrative duties and normal operational tasks.
  description: |-
    Using a privileged account to perform routine functions makes the computer vulnerable to malicious software inadvertently introduced during a session that has been granted full privileges.
  severity: Medium
  tags:
  - server
  - windows
  - user
  - account
- rule_id: STIG-V-254239
  legacy_ids:
  - V-254239
  - SV-254239r1153440_rule
  rule_name: |-
    Windows Server 2022 passwords for the built-in Administrator account must be changed at least every 60 days.
  rule_description: |-
    The longer a password is in use, the greater the opportunity for someone to gain unauthorized knowledge of the password. The built-in Administrator account is not generally used and its password may not be changed as frequently as necessary. Changing the password for the built-in Administrator account on a regular basis will limit its exposure.

    For domain-joined systems, Windows LAPS must be used to change the built-in Administrator account password.
  category: SRG-OS-000076-GPOS-00044
  subcategory: Password Policy
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |-
      If there are no enabled local Administrator accounts, this is Not Applicable.

      Review the password last set date for the enabled local Administrator account.

      On the stand alone or domain-joined server:

      Open "PowerShell".

      Enter "Get-LocalUser | Where-Object {$_.SID -like "*500"} | ForEach-Object ($_.PasswordLastSet){"$($_.Name) password is: $([int]((Get-Date) - $_.PasswordLastSet).TotalDays) days old"}".

      If the "PasswordLastSet" date is greater than "60" days old for the local Administrator account for administering the computer, this is a finding.

      Verify LAPS is configured and operational.

      If the system is a stand alone member server, the LAPS portion of this requirement is Not Applicable.

      Navigate to Local Computer Policy >> Computer Configuration >> Administrative Templates >> System >> LAPS >> Password Settings >> Set to enabled. Password Complexity, large letters + small letters + numbers + special, Password Length 14, Password Age 60. If not configured as shown, this is a finding.

      Verify LAPS Operational logs >> Event Viewer >> Applications and Services Logs >> Microsoft >> Windows >> LAPS >> Operational. Verify LAPS policy process is completing. If it is not, this is a finding.
    check_command: |-
      If there are no enabled local Administrator accounts, this is Not Applicable.

      Review the password last set date for the enabled local Administrator account.

      On the stand alone or domain-joined server:

      Open "PowerShell".

      Enter "Get-LocalUser | Where-Object {$_.SID -like "*500"} | ForEach-Object ($_.PasswordLastSet){"$($_.Name) password is: $([int]((Get-Date) - $_.PasswordLastSet).TotalDays) days old"}".

      If the "PasswordLastSet" date is greater than "60" days old for the local Administrator account for administering the computer, this is a finding.

      Verify LAPS is configured and operational.

      If the system is a stand alone member server, the LAPS portion of this requirement is Not Applicable.

      Navigate to Local Computer Policy >> Computer Configuration >> Administrative Templates >> System >> LAPS >> Password Settings >> Set to enabled. Password Complexity, large letters + small letters + numbers + special, Password Length 14, Password Age 60. If not configured as shown, this is a finding.

      Verify LAPS Operational logs >> Event Viewer >> Applications and Services Logs >> Microsoft >> Windows >> LAPS >> Operational. Verify LAPS policy process is completing. If it is not, this is a finding.
  remediation:
    remediation_step: |-
      Change the enabled local Administrator account password at least every 60 days. For domain-joined systems, Windows LAPS must be used to change the built-in Administrator account password.

      More information is available at:
      https://techcommunity.microsoft.com/t5/windows-it-pro-blog/by-popular-demand-windows-laps-available-now/ba-p/3788747
      https://learn.microsoft.com/en-us/windows-server/identity/laps/laps-overview#windows-laps-supported-platforms-and-azure-ad-laps-preview-status
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: |-
      The longer a password is in use, the greater the opportunity for someone to gain unauthorized knowledge of the password. The built-in Administrator account is not generally used and its password may not be changed as frequently as necessary. Changing the password for the built-in Administrator account on a regular basis will limit its exposure.

      For domain-joined systems, Windows LAPS must be used to change the built-in Administrator account password.
    false_positive_risk: Low
  id: STIG-V-254239
  title: |-
