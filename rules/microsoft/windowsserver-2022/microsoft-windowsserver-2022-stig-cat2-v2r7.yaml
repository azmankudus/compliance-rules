- rule_id: STIG-V-254433
  legacy_ids:
  - V-254433
  - SV-254433r1106522_rule
  rule_name: |-
    Windows Server 2022 must restrict remote calls to the Security Account Manager (SAM) to Administrators on domain-joined member servers and standalone or nondomain-joined systems.
  rule_description: |-
    The Windows SAM stores users' passwords. Restricting Remote Procedure Call (RPC) connections to the SAM to Administrators helps protect those credentials.
  category: SRG-OS-000324-GPOS-00125
  subcategory: Account Management
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |-
      This applies to member servers and standalone or nondomain-joined systems; it is NA for domain controllers.

      If the following registry value does not exist or is not configured as specified, this is a finding:

      Registry Hive: HKEY_LOCAL_MACHINE
      Registry Path: \SYSTEM\CurrentControlSet\Control\Lsa\

      Value Name: RestrictRemoteSAM

      Value Type: REG_SZ
      Value: O:BAG:BAD:(A;;RC;;;BA)
    check_command: |-
      This applies to member servers and standalone or nondomain-joined systems; it is NA for domain controllers.

      If the following registry value does not exist or is not configured as specified, this is a finding:

      Registry Hive: HKEY_LOCAL_MACHINE
      Registry Path: \SYSTEM\CurrentControlSet\Control\Lsa\

      Value Name: RestrictRemoteSAM

      Value Type: REG_SZ
      Value: O:BAG:BAD:(A;;RC;;;BA)
  remediation:
    remediation_step: "Navigate to the policy Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> Security Options >> Network access: Restrict clients allowed to make remote calls to SAM. \n\nSelect \"Edit Security\" to configure the \"Security descriptor:\".\n\nAdd \"Administrators\" in \"Group or user names:\" if it is not already listed (this is the default).\n\nSelect \"Administrators\" in \"Group or user names:\".\n\nSelect \"Allow\" for \"Remote Access\" in \"Permissions for \"Administrators\".\n\nClick \"OK\".\n\nThe \"Security descriptor:\" must be populated with \"O:BAG:BAD:(A;;RC;;;BA) for the policy to be enforced.\n\nIf an application requires this user right, this would not be a finding. Vendor documentation must support the requirement for having the user right. The requirement must be documented and approved by the information system security officer (ISSO)."
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: |-
      The Windows SAM stores users' passwords. Restricting Remote Procedure Call (RPC) connections to the SAM to Administrators helps protect those credentials.
    false_positive_risk: Low
