  rule_name: |-
    Windows Server 2022 systems must have Unified Extensible Firmware Interface (UEFI) firmware and be configured to run in UEFI mode, not Legacy BIOS.
  rule_description: |-
    UEFI provides additional security features in comparison to legacy BIOS firmware, including Secure Boot. UEFI is required to support additional security features in Windows, including Virtualization Based Security and Credential Guard. Systems with UEFI that are operating in "Legacy BIOS" mode will not support these security features.
  category: SRG-OS-000480-GPOS-00227
  subcategory: Configuration
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |-
      Devices that have UEFI firmware must run in "UEFI" mode.

      Verify the system firmware is configured to run in "UEFI" mode, not "Legacy BIOS".

      Run "System Information".

      Under "System Summary", if "BIOS Mode" does not display "UEFI", this is a finding.
    check_command: |-
      Devices that have UEFI firmware must run in "UEFI" mode.

      Verify the system firmware is configured to run in "UEFI" mode, not "Legacy BIOS".

      Run "System Information".

      Under "System Summary", if "BIOS Mode" does not display "UEFI", this is a finding.
  remediation:
    remediation_step: Configure UEFI firmware to run in "UEFI" mode, not "Legacy BIOS" mode.
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: |-
      UEFI provides additional security features in comparison to legacy BIOS firmware, including Secure Boot. UEFI is required to support additional security features in Windows, including Virtualization Based Security and Credential Guard. Systems with UEFI that are operating in "Legacy BIOS" mode will not support these security features.
    false_positive_risk: Low
