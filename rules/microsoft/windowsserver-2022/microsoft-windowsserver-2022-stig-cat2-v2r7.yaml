- rule_id: STIG-V-254418
  legacy_ids:
  - V-254418
  - SV-254418r1137691_rule
  rule_name: "Windows Server 2022 Access this computer from the network user right must only be assigned to the Administrators, Authenticated Users, and \nEnterprise Domain Controllers groups on domain controllers."
  rule_description: |-
    Inappropriate granting of user rights can provide system, administrative, and other high-level capabilities.

    Accounts with the "Access this computer from the network" right may access resources on the system, and this right must be limited to those requiring it.
  category: SRG-OS-000080-GPOS-00048
  subcategory: Network Configuration
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |-
      This applies to domain controllers. It is NA for other systems.

      Verify the effective setting in Local Group Policy Editor.

      Run "gpedit.msc".

      Navigate to Local Computer Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment.

      If any accounts or groups other than the following are granted the "Access this computer from the network" right, this is a finding.

      - Administrators
      - Authenticated Users
      - Enterprise Domain Controllers

      For server core installations, run the following command:

      Secedit /Export /Areas User_Rights /cfg c:\path\filename.txt

      Review the text file.

      If any SIDs other than the following are granted the "SeNetworkLogonRight" user right, this is a finding.

      S-1-5-32-544 (Administrators)
      S-1-5-11 (Authenticated Users)
      S-1-5-9 (Enterprise Domain Controllers)

      If an application requires this user right, this would not be a finding.

      Vendor documentation must support the requirement for having the user right.

      The requirement must be documented with the Information System Security Officer (ISSO).

      The application account must meet requirements for application account passwords, such as length (WN22-00-000050) and required frequency of changes (WN22-00-000060).
    check_command: |-
      This applies to domain controllers. It is NA for other systems.

      Verify the effective setting in Local Group Policy Editor.

      Run "gpedit.msc".

      Navigate to Local Computer Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment.

      If any accounts or groups other than the following are granted the "Access this computer from the network" right, this is a finding.

      - Administrators
      - Authenticated Users
      - Enterprise Domain Controllers

      For server core installations, run the following command:

      Secedit /Export /Areas User_Rights /cfg c:\path\filename.txt

      Review the text file.

      If any SIDs other than the following are granted the "SeNetworkLogonRight" user right, this is a finding.

      S-1-5-32-544 (Administrators)
      S-1-5-11 (Authenticated Users)
      S-1-5-9 (Enterprise Domain Controllers)

      If an application requires this user right, this would not be a finding.

      Vendor documentation must support the requirement for having the user right.

      The requirement must be documented with the Information System Security Officer (ISSO).

      The application account must meet requirements for application account passwords, such as length (WN22-00-000050) and required frequency of changes (WN22-00-000060).
  remediation:
    remediation_step: |-
      Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >> Local Policies >> User Rights Assignment >> Access this computer from the network to include only the following accounts or groups:

      - Administrators
      - Authenticated Users
      - Enterprise Domain Controllers
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: |-
      Inappropriate granting of user rights can provide system, administrative, and other high-level capabilities.

      Accounts with the "Access this computer from the network" right may access resources on the system, and this right must be limited to those requiring it.
    false_positive_risk: Low
