  rule_name: |-
    Windows Server 2022 must prevent local accounts with blank passwords from being used from the network.
  rule_description: |-
    An account without a password can allow unauthorized access to a system as only the username would be required. Password policies must prevent accounts with blank passwords from existing on a system. However, if a local account with a blank password does exist, enabling this setting will prevent network access, limiting the account to local console logon only.
  category: SRG-OS-000480-GPOS-00227
  subcategory: Password Policy
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "If the following registry value does not exist or is not configured as specified, this is a finding:\n\nRegistry Hive: HKEY_LOCAL_MACHINE \nRegistry Path: \\SYSTEM\\CurrentControlSet\\Control\\Lsa\\\n\nValue Name: LimitBlankPasswordUse\n\nValue Type: REG_DWORD\nValue: 0x00000001 (1)"
    check_command: "If the following registry value does not exist or is not configured as specified, this is a finding:\n\nRegistry Hive: HKEY_LOCAL_MACHINE \nRegistry Path: \\SYSTEM\\CurrentControlSet\\Control\\Lsa\\\n\nValue Name: LimitBlankPasswordUse\n\nValue Type: REG_DWORD\nValue: 0x00000001 (1)"
  remediation:
    remediation_step: |-
