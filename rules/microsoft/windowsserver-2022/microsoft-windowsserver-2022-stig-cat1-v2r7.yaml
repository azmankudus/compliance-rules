- rule_id: STIG-V-254391
  legacy_ids:
  - V-254391
  - SV-254391r958726_rule
  rule_name: |-
    Windows Server 2022 permissions on the Active Directory data files must only allow System and Administrators access.
  rule_description: |-
    Improper access permissions for directory data-related files could allow unauthorized users to read, modify, or delete directory data or audit trails.

    Satisfies: SRG-OS-000324-GPOS-00125, SRG-OS-000206-GPOS-00084
  category: SRG-OS-000324-GPOS-00125
  subcategory: File Permissions
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |-
      This applies to domain controllers. It is NA for other systems.

      Run "Regedit".

      Navigate to "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\NTDS\Parameters".

      Note the directory locations in the values for:

      Database log files path
      DSA Database file

      By default, they will be \Windows\NTDS.

      If the locations are different, the following will need to be run for each.

      Open "Command Prompt (Admin)".

      Navigate to the NTDS directory (\Windows\NTDS by default).

      Run "icacls *.*".

      If the permissions on each file are not as restrictive as the following, this is a finding:

      NT AUTHORITY\SYSTEM:(I)(F)
      BUILTIN\Administrators:(I)(F)

      (I) - permission inherited from parent container
      (F) - full access
    check_command: |-
      This applies to domain controllers. It is NA for other systems.

      Run "Regedit".

      Navigate to "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\NTDS\Parameters".

      Note the directory locations in the values for:

      Database log files path
      DSA Database file

      By default, they will be \Windows\NTDS.

      If the locations are different, the following will need to be run for each.

      Open "Command Prompt (Admin)".

      Navigate to the NTDS directory (\Windows\NTDS by default).

      Run "icacls *.*".

      If the permissions on each file are not as restrictive as the following, this is a finding:

      NT AUTHORITY\SYSTEM:(I)(F)
      BUILTIN\Administrators:(I)(F)

      (I) - permission inherited from parent container
      (F) - full access
  remediation:
    remediation_step: |-
      Maintain the permissions on NTDS database and log files as follows:

      NT AUTHORITY\SYSTEM:(I)(F)
      BUILTIN\Administrators:(I)(F)

      (I) - permission inherited from parent container
      (F) - full access
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: |-
      Improper access permissions for directory data-related files could allow unauthorized users to read, modify, or delete directory data or audit trails.

      Satisfies: SRG-OS-000324-GPOS-00125, SRG-OS-000206-GPOS-00084
    false_positive_risk: Low
