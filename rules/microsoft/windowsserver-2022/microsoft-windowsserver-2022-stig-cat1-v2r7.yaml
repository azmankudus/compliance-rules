  - V-254353
  - SV-254353r958804_rule
  rule_name: |-
    Windows Server 2022 default AutoRun behavior must be configured to prevent AutoRun commands.
  rule_description: |-
    Allowing AutoRun commands to execute may introduce malicious code to a system. Configuring this setting prevents AutoRun commands from executing.
  category: SRG-OS-000368-GPOS-00154
  subcategory: Event Logging
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |-
      If the following registry value does not exist or is not configured as specified, this is a finding:

      Registry Hive: HKEY_LOCAL_MACHINE
      Registry Path: \SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\

      Value Name: NoAutorun

      Type: REG_DWORD
      Value: 0x00000001 (1)
    check_command: |-
      If the following registry value does not exist or is not configured as specified, this is a finding:

      Registry Hive: HKEY_LOCAL_MACHINE
      Registry Path: \SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\

      Value Name: NoAutorun

      Type: REG_DWORD
      Value: 0x00000001 (1)
  remediation:
    remediation_step: |-
      Configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components >> AutoPlay Policies >> Set the default behavior for AutoRun to "Enabled" with "Do not execute any autorun commands" selected.
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: |-
      Allowing AutoRun commands to execute may introduce malicious code to a system. Configuring this setting prevents AutoRun commands from executing.
    false_positive_risk: Low
  id: STIG-V-254353
  title: |-
