- rule_id: STIG-V-254293
  legacy_ids:
  - V-254293
  - SV-254293r1051095_rule
  rule_name: Windows Server 2022 reversible password encryption must be disabled.
  rule_description: |-
    Storing passwords using reversible encryption is essentially the same as storing clear-text versions of the passwords, which are easily compromised. For this reason, this policy must never be enabled.
  category: SRG-OS-000073-GPOS-00041
  subcategory: Password Policy
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |-
      Verify the effective setting in Local Group Policy Editor.

      Run "gpedit.msc".

      Navigate to Local Computer Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Account Policies >> Password Policy.

      If the value for "Store passwords using reversible encryption" is not set to "Disabled", this is a finding.

      For server core installations, run the following command:

      Secedit /Export /Areas SecurityPolicy /CFG C:\Path\FileName.Txt

      If "ClearTextPassword" equals "1" in the file, this is a finding.
    check_command: |-
      Verify the effective setting in Local Group Policy Editor.

      Run "gpedit.msc".

      Navigate to Local Computer Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Account Policies >> Password Policy.

      If the value for "Store passwords using reversible encryption" is not set to "Disabled", this is a finding.

      For server core installations, run the following command:

      Secedit /Export /Areas SecurityPolicy /CFG C:\Path\FileName.Txt

      If "ClearTextPassword" equals "1" in the file, this is a finding.
  remediation:
    remediation_step: |-
      Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >> Account Policies >> Password Policy >> Store passwords using reversible encryption to "Disabled".
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: |-
      Storing passwords using reversible encryption is essentially the same as storing clear-text versions of the passwords, which are easily compromised. For this reason, this policy must never be enabled.
    false_positive_risk: Low
  id: STIG-V-254293
  title: Windows Server 2022 reversible password encryption must be disabled.
  description: |-
    Storing passwords using reversible encryption is essentially the same as storing clear-text versions of the passwords, which are easily compromised. For this reason, this policy must never be enabled.
  severity: High
  tags:
  - server
  - encryption
  - password
  - windows
- rule_id: STIG-V-254352
  legacy_ids:
  - V-254352
  - SV-254352r958804_rule
  rule_name: Windows Server 2022 Autoplay must be turned off for nonvolume devices.
  rule_description: |-
    Allowing AutoPlay to execute may introduce malicious code to a system. AutoPlay begins reading from a drive as soon as media is inserted into the drive. As a result, the setup file of programs or music on audio media may start. This setting will disable AutoPlay for nonvolume devices, such as Media Transfer Protocol (MTP) devices.
  category: SRG-OS-000368-GPOS-00154
  subcategory: Configuration
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |-
      If the following registry value does not exist or is not configured as specified, this is a finding:

      Registry Hive: HKEY_LOCAL_MACHINE
      Registry Path: \SOFTWARE\Policies\Microsoft\Windows\Explorer\

      Value Name: NoAutoplayfornonVolume

      Type: REG_DWORD
      Value: 0x00000001 (1)
    check_command: |-
      If the following registry value does not exist or is not configured as specified, this is a finding:

      Registry Hive: HKEY_LOCAL_MACHINE
      Registry Path: \SOFTWARE\Policies\Microsoft\Windows\Explorer\

      Value Name: NoAutoplayfornonVolume

      Type: REG_DWORD
      Value: 0x00000001 (1)
  remediation:
    remediation_step: |-
      Configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components >> AutoPlay Policies >> Disallow Autoplay for nonvolume devices to "Enabled".
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: |-
      Allowing AutoPlay to execute may introduce malicious code to a system. AutoPlay begins reading from a drive as soon as media is inserted into the drive. As a result, the setup file of programs or music on audio media may start. This setting will disable AutoPlay for nonvolume devices, such as Media Transfer Protocol (MTP) devices.
    false_positive_risk: Low
  id: STIG-V-254352
  title: Windows Server 2022 Autoplay must be turned off for nonvolume devices.
  description: |-
    Allowing AutoPlay to execute may introduce malicious code to a system. AutoPlay begins reading from a drive as soon as media is inserted into the drive. As a result, the setup file of programs or music on audio media may start. This setting will disable AutoPlay for nonvolume devices, such as Media Transfer Protocol (MTP) devices.
  severity: High
  tags:
  - server
  - windows
