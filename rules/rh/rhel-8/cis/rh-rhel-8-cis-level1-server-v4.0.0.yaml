$metadata:
  name: CIS Benchmark for Red Hat Enterprise Linux 8 - Level 1 Server
  version: 4.0.0
  description: Center for Internet Security Benchmark for RHEL 8 Level 1 Server Profile
  platform: Red Hat Enterprise Linux 8
  benchmark: CIS RHEL 8 Benchmark v4.0.0
  author: Center for Internet Security
  created: "2025-08-28T00:00:00Z"
  modified: "2025-08-28T00:00:00Z"
  compatible_platforms:
    - RHEL 8.0
    - RHEL 8.1
