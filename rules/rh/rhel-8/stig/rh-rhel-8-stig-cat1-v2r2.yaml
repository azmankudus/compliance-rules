  rule_name: RHEL 8 must not have the telnet-server package installed.
  rule_description: 'It is detrimental for operating systems to provide, or install by default, functionality exceeding requirements or mission objectives. These unnecessary capabilities or services are often overlooked and therefore may remain unsecured. They increase the risk to the platform by providing additional attack vectors.


    Operating systems are capable of providing a wide variety of functions and services. Some of the functions and services, provided by default, may not be necessary to support essential organizational operations (e.g., key missions, functions).


    Examples of non-essential capabilities include, but are not limited to, games, software packages, tools, and demonstration software not related to requirements or providing a wide array of functionality not required for every mission, but which cannot be disabled.


    Verify the operating system is configured to disable non-essential capabilities. The most secure way of ensuring a non-essential capability is disabled is to not have the capability installed.


    The telnet service provides an unencrypted remote access service that does not provide for the confidentiality and integrity of user passwords or the remote session.


    If a privileged user were to log on using this service, the privileged user password could be compromised.'
  category: System Configuration
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check to see if the telnet-server package is installed with the following command:


      $ sudo yum list installed telnet-server


      If the telnet-server package is installed, this is a finding.'
    check_command: ''
    expected_value: ''
  remediation:
    remediation_step: 'Configure the operating system to disable non-essential capabilities by removing the telnet-server package from the system with the following command:


      $ sudo yum remove telnet-server'
    rollback_supported: true
    reboot_required: false
    service_impact: ''
    estimated_time: ''
  context:
    rationale: It is detrimental for operating systems to provide, or install by default, functionality exceeding requirements or mission objectives. These unnecessary capabilities or services are often overlooked a
    impact: ''
    false_positive_risk: None
    references:
    - type: CCI
      reference: CCI-000381
  tags:
  - stig
  - rhel8
