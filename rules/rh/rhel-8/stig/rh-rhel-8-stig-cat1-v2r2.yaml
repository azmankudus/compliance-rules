  - SV-230533r1017295_rule
  rule_name: The Trivial File Transfer Protocol (TFTP) server package must not be installed if not required for RHEL 8 operational support.
  rule_description: If TFTP is required for operational support (such as the transmission of router configurations) its use must be documented with the Information System Security Officer (ISSO), restricted to only authorized personnel, and have access control rules established.
  category: System Configuration
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Verify a TFTP server has not been installed on the system with the following command:


      $ sudo yum list installed tftp-server


      tftp-server.x86_64   5.2-24.el8


      If TFTP is installed and the requirement for TFTP is not documented with the ISSO, this is a finding.'
    check_command: ''
    expected_value: ''
  remediation:
    remediation_step: 'Remove the TFTP package from the system with the following command:


      $ sudo yum remove tftp-server'
    rollback_supported: true
    reboot_required: false
    service_impact: ''
    estimated_time: ''
  context:
    rationale: If TFTP is required for operational support (such as the transmission of router configurations) its use must be documented with the Information System Security Officer (ISSO), restricted to only autho
    impact: ''
    false_positive_risk: None
    references:
    - type: CCI
      reference: CCI-000366
  tags:
  - stig
  - rhel8
