- rule_id: RHEL-08-010370
  legacy_ids:
  - V-230264
  - SV-230264r1017377_rule
  rule_name: RHEL 8 must prevent the installation of software, patches, service packs, device drivers, or operating system components from a repository without verification they have been digitally signed using a certificate that is issued by a Certificate Authority (CA) that is recognized and approved by the organization.
  rule_description: 'Changes to any software components can have significant effects on the overall security of the operating system. This requirement ensures the software has not been tampered with and that it has been provided by a trusted vendor.


    Accordingly, patches, service packs, device drivers, or operating system components must be signed with a certificate recognized and approved by the organization.


    Verifying the authenticity of the software prior to installation validates the integrity of the patch or upgrade received from a vendor. This verifies the software has not been tampered with and that it has been provided by a trusted vendor. Self-signed certificates are disallowed by this requirement. The operating system should not have to verify the software again. This requirement does not mandate DoD certificates for this purpose; however, the certificate used to verify the software must be from an approved CA.'
  category: System Configuration
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "Verify the operating system prevents the installation of patches, service packs, device drivers, or operating system components from a repository without verification that they have been digitally signed using a certificate that is recognized and approved by the organization.\n\nCheck that YUM verifies the signature of packages from a repository prior to install with the following command:\n\n     $ sudo grep -E '^\\[.*\\]|gpgcheck' /etc/yum.repos.d/*.repo\n\n     /etc/yum.repos.d/appstream.repo:[appstream]\n     /etc/yum.repos.d/appstream.repo:gpgcheck=1\n     /etc/yum.repos.d/baseos.repo:[baseos]\n     /etc/yum.repos.d/baseos.repo:gpgcheck=1\n\nIf \"gpgcheck\" is not set to \"1\", or if options are missing or commented out, ask the System Administrator how the certificates for patches and other operating system components are verified.\n\nIf there is no process to validate certificates that is approved by the organization, this is a finding."
    check_command: ''
    expected_value: ''
  remediation:
    remediation_step: "Configure the operating system to verify the signature of packages from a repository prior to install by setting the following option in the \"/etc/yum.repos.d/[your_repo_name].repo\" file:\n\n     gpgcheck=1"
    rollback_supported: true
    reboot_required: false
    service_impact: ''
    estimated_time: ''
  context:
    rationale: Changes to any software components can have significant effects on the overall security of the operating system. This requirement ensures the software has not been tampered with and that it has been p
    impact: ''
    false_positive_risk: None
    references:
    - type: CCI
      reference: CCI-001749
  tags:
  - stig
  - rhel8
- rule_id: RHEL-08-010371
  legacy_ids:
