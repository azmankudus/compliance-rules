- rule_id: RHEL-08-010820
  legacy_ids:
  - V-230329
  - SV-230329r1017140_rule
  rule_name: Unattended or automatic logon via the RHEL 8 graphical user interface must not be allowed.
  rule_description: Failure to restrict system access to authenticated users negatively impacts operating system security.
  category: System Configuration
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Verify the operating system does not allow an unattended or automatic logon to the system via a graphical user interface.


      Note: This requirement assumes the use of the RHEL 8 default graphical user interface, Gnome Shell. If the system does not have any graphical user interface installed, this requirement is Not Applicable.


      Check for the value of the "AutomaticLoginEnable" in the "/etc/gdm/custom.conf" file with the following command:


      $ sudo grep -i automaticloginenable /etc/gdm/custom.conf


      AutomaticLoginEnable=false


      If the value of "AutomaticLoginEnable" is not set to "false", this is a finding.'
    check_command: ''
    expected_value: ''
  remediation:
    remediation_step: 'Configure the operating system to not allow an unattended or automatic logon to the system via a graphical user interface.


      Add or edit the line for the "AutomaticLoginEnable" parameter in the [daemon] section of the "/etc/gdm/custom.conf" file to "false":


      [daemon]

      AutomaticLoginEnable=false'
    rollback_supported: true
    reboot_required: false
    service_impact: ''
    estimated_time: ''
  context:
    rationale: Failure to restrict system access to authenticated users negatively impacts operating system security.
    impact: ''
    false_positive_risk: None
    references:
    - type: CCI
      reference: CCI-000366
  tags:
  - stig
  - rhel8
- rule_id: RHEL-08-020330
  legacy_ids:
  - V-230380
  - SV-230380r1069308_rule
  rule_name: RHEL 8 must not allow accounts configured with blank or null passwords.
  rule_description: If an account has an empty password, anyone could log on and run commands with the privileges of that account. Accounts with empty passwords should never be used in operational environments.
  category: System Configuration
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'To verify that null passwords cannot be used, run the following command:


      $ sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr ''\n'' '' '' | xargs sudo grep -iH ''^\s*permitemptypasswords''


      /etc/ssh/sshd_config:PermitEmptyPasswords no


      If "PermitEmptyPasswords" is set to "yes", this is a finding.


      If conflicting results are returned, this is a finding.'
    check_command: ''
    expected_value: ''
  remediation:
    remediation_step: 'Edit the following line in "etc/ssh/sshd_config" to prevent logons with empty passwords.


      PermitEmptyPasswords no


      The SSH daemon must be restarted for the changes to take effect. To restart the SSH daemon, run the following command:


      $ sudo systemctl restart sshd.service'
    rollback_supported: true
    reboot_required: false
    service_impact: ''
    estimated_time: ''
  context:
    rationale: If an account has an empty password, anyone could log on and run commands with the privileges of that account. Accounts with empty passwords should never be used in operational environments.
    impact: ''
    false_positive_risk: None
    references:
    - type: CCI
      reference: CCI-000366
  tags:
  - stig
  - rhel8
