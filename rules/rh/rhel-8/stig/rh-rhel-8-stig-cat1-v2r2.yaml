  - stig
  - rhel8
- rule_id: RHEL-08-010030
  legacy_ids:
  - V-230224
  - SV-230224r1044787_rule
  rule_name: All RHEL 8 local disk partitions must implement cryptographic mechanisms to prevent unauthorized disclosure or modification of all information that requires at rest protection.
  rule_description: 'RHEL 8 systems handling data requiring "data at rest" protections must employ cryptographic mechanisms to prevent unauthorized disclosure and modification of the information at rest.


    Selection of a cryptographic mechanism is based on the need to protect the integrity of organizational information. The strength of the mechanism is commensurate with the security category and/or classification of the information. Organizations have the flexibility to either encrypt all information on storage devices (i.e., full disk encryption) or encrypt specific data structures (e.g., files, records, or fields).


    Satisfies: SRG-OS-000185-GPOS-00079, SRG-OS-000404-GPOS-00183, SRG-OS-000405-GPOS-00184'
  category: System Configuration
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "Verify RHEL 8 prevents unauthorized disclosure or modification of all information requiring at-rest protection by using disk encryption. \n\nIf there is a documented and approved reason for not having data-at-rest encryption at the operating system level, such as encryption provided by a hypervisor or a disk storage array in a virtualized environment, this requirement is not applicable.\n\nVerify all system partitions are encrypted with the following command:\n\n     $ sudo blkid\n\n     /dev/mapper/rhel-root:  UUID=\"67b7d7fe-de60-6fd0-befb-e6748cf97743\" TYPE=\"crypto_LUKS\"\n\nEvery persistent disk partition present must be of type \"crypto_LUKS\". If any partitions other than the boot partition or pseudo file systems (such as /proc or /sys) are not type \"crypto_LUKS\", ask the administrator to indicate how the partitions are encrypted. \n\nIf there is no evidence that these partitions are encrypted, this is a finding."
    check_command: ''
    expected_value: ''
  remediation:
    remediation_step: "Configure RHEL 8 to prevent unauthorized modification of all information at rest by using disk encryption. \n\nEncrypting a partition in an already installed system is more difficult, because existing partitions will need to be resized and changed. To encrypt an entire partition, dedicate a partition for encryption in the partition layout."
    rollback_supported: true
    reboot_required: false
    service_impact: ''
    estimated_time: ''
  context:
    rationale: 'RHEL 8 systems handling data requiring "data at rest" protections must employ cryptographic mechanisms to prevent unauthorized disclosure and modification of the information at rest.


      Selection of a c'
    impact: ''
    false_positive_risk: None
    references:
    - type: CCI
      reference: CCI-001199
  tags:
  - stig
  - rhel8
- rule_id: RHEL-08-010140
  legacy_ids:
  - V-230234
  - SV-230234r1017053_rule
  rule_name: RHEL 8 operating systems booted with United Extensible Firmware Interface (UEFI) must require authentication upon booting into single-user mode and maintenance.
  rule_description: If the system does not require valid authentication before it boots into single-user or maintenance mode, anyone who invokes single-user or maintenance mode is granted privileged access to all files on the system. GRUB 2 is the default boot loader for RHEL 8 and is designed to require a password to boot into single-user mode or make modifications to the boot menu.
  category: System Configuration
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'For systems that use BIOS, this is Not Applicable.


      Check to see if an encrypted grub superusers password is set. On systems that use UEFI, use the following command:


      $ sudo grep -iw grub2_password /boot/efi/EFI/redhat/user.cfg


      GRUB2_PASSWORD=grub.pbkdf2.sha512.[password_hash]


      If the grub superusers password does not begin with "grub.pbkdf2.sha512", this is a finding.'
    check_command: ''
    expected_value: ''
  remediation:
    remediation_step: 'Configure the system to require a grub bootloader password for the grub superusers account with the grub2-setpassword command, which creates/overwrites the /boot/efi/EFI/redhat/user.cfg file.


      Generate an encrypted grub2 password for the grub superusers account with the following command:


      $ sudo grub2-setpassword

      Enter password:

      Confirm password:'
    rollback_supported: true
    reboot_required: false
    service_impact: ''
    estimated_time: ''
  context:
    rationale: If the system does not require valid authentication before it boots into single-user or maintenance mode, anyone who invokes single-user or maintenance mode is granted privileged access to all files o
    impact: ''
    false_positive_risk: None
    references:
    - type: CCI
      reference: CCI-000213
  tags:
  - stig
  - rhel8
