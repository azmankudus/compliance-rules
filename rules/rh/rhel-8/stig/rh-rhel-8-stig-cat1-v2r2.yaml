- rule_id: RHEL-08-010000
  legacy_ids:
  - V-230221
  - SV-230221r1017040_rule
  rule_name: RHEL 8 must be a vendor-supported release.
  rule_description: 'An operating system release is considered "supported" if the vendor continues to provide security patches for the product. With an unsupported release, it will not be possible to resolve security issues discovered in the system software.


    Red Hat offers the Extended Update Support (EUS) add-on to a Red Hat Enterprise Linux subscription, for a fee, for those customers who wish to standardize on a specific minor release for an extended period. The RHEL 8 minor releases eligible for EUS are 8.1, 8.2, 8.4, 8.6, and 8.8. Each RHEL 8 EUS stream is available for 24 months from the availability of the minor release. RHEL 8.10 will be the final minor release overall. For more details on the Red Hat Enterprise Linux Life Cycle  visit https://access.redhat.com/support/policy/updates/errata/.

    Note: The life-cycle time spans and dates are subject to adjustment.'
  category: System Configuration
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Verify the version of the operating system is vendor supported.


      Note: The lifecycle time spans and dates are subject to adjustment.


      Check the version of the operating system with the following command:


      $ sudo cat /etc/redhat-release


      Red Hat Enterprise Linux Server release 8.6 (Ootpa)


      Current End of Extended Update Support for RHEL 8.1 is 30 November 2021.


      Current End of Extended Update Support for RHEL 8.2 is 30 April 2022.


      Current End of Extended Update Support for RHEL 8.4 is 31 May 2023.


      Current End of Maintenance Support for RHEL 8.5 is 31 May 2022.


      Current End of Extended Update Support for RHEL 8.6 is 31 May 2024.


      Current End of Maintenance Support for RHEL 8.7 is 31 May 2023.


      Current End of Extended Update Support for RHEL 8.8 is 31 May 2025.


      Current End of Maintenance Support for RHEL 8.9 is 31 May 2024.


      Current End of Maintenance Support for RHEL 8.10 is 31 May 2029.


      If the release is not supported by the vendor, this is a finding.'
    check_command: ''
    expected_value: ''
  remediation:
    remediation_step: Upgrade to a supported version of RHEL 8.
    rollback_supported: true
    reboot_required: false
    service_impact: ''
    estimated_time: ''
  context:
    rationale: An operating system release is considered "supported" if the vendor continues to provide security patches for the product. With an unsupported release, it will not be possible to resolve security issu
    impact: ''
    false_positive_risk: None
    references:
    - type: CCI
      reference: CCI-000366
  tags:
  - stig
  - rhel8
- rule_id: RHEL-08-010020
  legacy_ids:
  - V-230223
  - SV-230223r1069327_rule
  rule_name: 'RHEL 8 must implement NIST FIPS-validated cryptography for the following: To provision digital signatures, to generate cryptographic hashes, and to protect data requiring data-at-rest protections in accordance with applicable federal laws, Executive Orders, directives, policies, regulations, and standards.'
  rule_description: "Use of weak or untested encryption algorithms undermines the purposes of using encryption to protect data. The operating system must implement cryptographic modules adhering to the higher standards approved by the federal government since this provides assurance they have been tested and validated.\n\nRHEL 8 utilizes GRUB 2 as the default bootloader. Note that GRUB 2 command-line parameters are defined in the \"kernelopts\" variable of the /boot/grub2/grubenv file for all kernel boot entries. The command \"fips-mode-setup\" modifies the \"kernelopts\" variable, which in turn updates all kernel boot entries. \n\nThe fips=1 kernel option needs to be added to the kernel command line during system installation so that key generation is done with FIPS-approved algorithms and continuous monitoring tests in place. Users must also ensure the system has plenty of entropy during the installation process by moving the mouse around, or if no mouse is available, ensuring that many\
    \ keystrokes are typed. The recommended amount of keystrokes is 256 and more. Less than 256 keystrokes may generate a nonunique key.\n\nSatisfies: SRG-OS-000033-GPOS-00014, SRG-OS-000125-GPOS-00065, SRG-OS-000396-GPOS-00176, SRG-OS-000423-GPOS-00187, SRG-OS-000478-GPOS-00223"
  category: System Configuration
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Verify the operating system implements DOD-approved encryption to protect the confidentiality of remote access sessions.


      Show the configured systemwide cryptographic policy by running the following command:


      $ sudo update-crypto-policies --show

      FIPS


      If the main policy name is not "FIPS", this is a finding.


      If the AD-SUPPORT subpolicy module is included (e.g., "FIPS:AD-SUPPORT"), and Active Directory support is not documented as an operational requirement with the information system security officer (ISSO), this is a finding.


      If the NO-ENFORCE-EMS subpolicy module is included (e.g., "FIPS:NO-ENFORCE-EMS"), and not enforcing EMS is not documented as an operational requirement with the ISSO, this is a finding.


      If any other subpolicy module is included, this is a finding.'
    check_command: ''
    expected_value: ''
  remediation:
    remediation_step: "Configure the operating system to implement DOD-approved encryption by following the steps below:\n\nTo enable strict FIPS compliance, the fips=1 kernel option needs to be added to the kernel boot parameters during system installation so key generation is done with FIPS-approved algorithms and continuous monitoring tests in place.\n\nEnable FIPS mode after installation (not strict FIPS-compliant) with the following command:\n\n     $ sudo fips-mode-setup --enable\n\nReboot the system for the changes to take effect."
    rollback_supported: true
    reboot_required: false
    service_impact: ''
    estimated_time: ''
  context:
    rationale: Use of weak or untested encryption algorithms undermines the purposes of using encryption to protect data. The operating system must implement cryptographic modules adhering to the higher standards ap
    impact: ''
    false_positive_risk: None
    references:
    - type: CCI
      reference: CCI-000068
