- rule_id: SV-257847r1044924_rule
  rule_name: RHEL 9 must use a separate file system for the system audit data path.
  rule_description: 'Placing "/var/log/audit" in its own partition enables better separation between audit files and other system files, and helps ensure that auditing cannot be halted due to the partition running out of space. Satisfies: SRG-OS-000341-GPOS-00132, SRG-OS-000480-GPOS-00227'
  category: Security
  subcategory: Auditing
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: Configuration
    detection_step: 'Verify that a separate file system/partition has been created for the system audit data path with the following command: Note: /var/log/audit is used as the example as it is a common location. $ mount | grep /var/log/audit  /dev/mapper/rootvg-varlogaudit on /var/log/audit type xfs (rw,relatime,seclabel,attr2,inode64,logbufs=8,logbsize=32k,noquota) Note: Options displayed for mount may differ. If no line is returned, this is a finding.'
    check_command: $ mount | grep /var/log/audit
    expected_value: ''
  remediation:
    remediation_step: Migrate the system audit data path onto a separate file system.
    rollback_supported: true
    reboot_required: false
    service_impact: Low
    estimated_time: 5 minutes
  context:
    rationale: 'Placing "/var/log/audit" in its own partition enables better separation between audit files and other system files, and helps ensure that auditing cannot be halted due to the partition running out of space. Satisfies: SRG-OS-000341-GPOS-00132, SRG-OS-000480-GPOS-00227'
    impact: Low severity security finding
    false_positive_risk: Low
  tags:
  - RHEL-09-231030
  - CCI-001849
  - SRG-OS-000341-GPOS-00132
  - STIG
  - DISA
- rule_id: SV-257782r991589_rule
  rule_name: RHEL 9 must enable the hardware random number generator entropy gatherer service.
  rule_description: The most important characteristic of a random number generator is its randomness, namely its ability to deliver random numbers that are impossible to predict. Entropy in computer security is associated with the unpredictability of a source of randomness. The random source with high entropy tends to achieve a uniform distribution of random values. Random number generators are one of the most important building blocks of cryptosystems.  The rngd service feeds random data from hardware device to kernel random device. Quality (nonpredictable) random number generation is important for several security functions (i.e., ciphers).
  category: Security
  subcategory: Services
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: Configuration
    detection_step: 'Note: For RHEL 9 systems running with kernel FIPS mode enabled as specified by RHEL-09-671010, this requirement is Not Applicable. Verify that RHEL 9 has enabled the hardware random number generator entropy gatherer service with the following command: $ systemctl is-active rngd active If the "rngd" service is not active, this is a finding.'
    check_command: $ systemctl is-active rngd
    expected_value: ''
  remediation:
    remediation_step: 'Install the rng-tools package with the following command: $ sudo dnf install rng-tools Then enable the rngd service run the following command: $ sudo systemctl enable --now rngd'
    rollback_supported: true
    reboot_required: false
    service_impact: Low
    estimated_time: 5 minutes
  context:
    rationale: The most important characteristic of a random number generator is its randomness, namely its ability to deliver random numbers that are impossible to predict. Entropy in computer security is associated with the unpredictability of a source of randomness. The random source with high entropy tends to achieve a uniform distribution of random values. Random number generators are one of the most important building blocks of cryptosystems.  The rngd service feeds random data from hardware device to kernel random device. Quality (nonpredictable) random number generation is important for several security functions (i.e., ciphers).
    impact: Low severity security finding
    false_positive_risk: Low
  tags:
  - RHEL-09-211035
  - CCI-000366
  - SRG-OS-000480-GPOS-00227
  - STIG
  - DISA
- rule_id: SV-257795r1044845_rule
  rule_name: RHEL 9 must enable mitigations against processor-based vulnerabilities.
  rule_description: 'Kernel page-table isolation is a kernel feature that mitigates the Meltdown security vulnerability and hardens the kernel against attempts to bypass kernel address space layout randomization (KASLR). Satisfies: SRG-OS-000433-GPOS-00193, SRG-OS-000095-GPOS-00049'
  category: Security
  subcategory: System Configuration
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: Configuration
    detection_step: 'Verify RHEL 9 enables kernel page-table isolation with the following command: $ sudo grubby --info=ALL | grep args | grep -v ''pti=on'' If any output is returned, this is a finding. Check that kernel page-table isolation is enabled by default to persist in kernel updates:  $ grep pti /etc/default/grub GRUB_CMDLINE_LINUX="pti=on" If "pti" is not set to "on", is missing or commented out, this is a finding.'
    check_command: $ sudo grubby --info=ALL | grep args | grep -v 'pti=on'
    expected_value: ''
  remediation:
    remediation_step: 'Configure RHEL 9 to enable kernel page-table isolation with the following command: $ sudo grubby --update-kernel=ALL --args="pti=on" Add or modify the following line in "/etc/default/grub" to ensure the configuration survives kernel updates: GRUB_CMDLINE_LINUX="pti=on"'
    rollback_supported: true
    reboot_required: false
    service_impact: Low
    estimated_time: 5 minutes
  context:
    rationale: 'Kernel page-table isolation is a kernel feature that mitigates the Meltdown security vulnerability and hardens the kernel against attempts to bypass kernel address space layout randomization (KASLR). Satisfies: SRG-OS-000433-GPOS-00193, SRG-OS-000095-GPOS-00049'
    impact: Low severity security finding
    false_positive_risk: Low
  tags:
  - RHEL-09-212050
  - CCI-000381
  - SRG-OS-000433-GPOS-00193
  - STIG
  - DISA
- rule_id: SV-257796r1044847_rule
  rule_name: RHEL 9 must enable auditing of processes that start prior to the audit daemon.
  rule_description: 'Without the capability to generate audit records, it would be difficult to establish, correlate, and investigate the events relating to an incident or identify those responsible for one. If auditing is enabled late in the startup process, the actions of some startup processes may not be audited. Some audit systems also maintain state information only available if auditing is enabled before a given process is created. Satisfies: SRG-OS-000037-GPOS-00015, SRG-OS-000042-GPOS-00020, SRG-OS-000062-GPOS-00031, SRG-OS-000392-GPOS-00172, SRG-OS-000462-GPOS-00206, SRG-OS-000471-GPOS-00215, SRG-OS-000473-GPOS-00218, SRG-OS-000254-GPOS-00095'
  category: Security
  subcategory: Auditing
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: Configuration
    detection_step: 'Verify that GRUB 2 is configured to enable auditing of processes that start prior to the audit daemon with the following commands: Check that the current GRUB 2 configuration enables auditing: $ sudo grubby --info=ALL | grep args | grep -v ''audit=1'' If any output is returned, this is a finding. Check that auditing is enabled by default to persist in kernel updates:  $ grep audit /etc/default/grub GRUB_CMDLINE_LINUX="audit=1" If "audit" is not set to "1", is missing, or is commented out, this is a finding.'
    check_command: $ sudo grubby --info=ALL | grep args | grep -v 'audit=1'
    expected_value: ''
  remediation:
    remediation_step: 'Enable auditing of processes that start prior to the audit daemon with the following command: $ sudo grubby --update-kernel=ALL --args="audit=1" Add or modify the following line in "/etc/default/grub" to ensure the configuration survives kernel updates: GRUB_CMDLINE_LINUX="audit=1"'
    rollback_supported: true
    reboot_required: false
    service_impact: Low
    estimated_time: 5 minutes
  context:
    rationale: 'Without the capability to generate audit records, it would be difficult to establish, correlate, and investigate the events relating to an incident or identify those responsible for one. If auditing is enabled late in the startup process, the actions of some startup processes may not be audited. Some audit systems also maintain state information only available if auditing is enabled before a given process is created. Satisfies: SRG-OS-000037-GPOS-00015, SRG-OS-000042-GPOS-00020, SRG-OS-000062-GPOS-00031, SRG-OS-000392-GPOS-00172, SRG-OS-000462-GPOS-00206, SRG-OS-000471-GPOS-00215, SRG-OS-000473-GPOS-00218, SRG-OS-000254-GPOS-00095'
    impact: Low severity security finding
    false_positive_risk: Low
  tags:
  - RHEL-09-212055
  - CCI-000130
  - SRG-OS-000037-GPOS-00015
  - STIG
  - DISA
- rule_id: SV-257824r1044886_rule
  rule_name: RHEL 9 must remove all software components after updated versions have been installed.
  rule_description: Previous versions of software components that are not removed from the information system after updates have been installed may be exploited by some adversaries.
  category: Security
  subcategory: Package Management
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: Configuration
    detection_step: 'Verify RHEL 9 removes all software components after updated versions have been installed with the following command: $ grep -i clean_requirements_on_remove /etc/dnf/dnf.conf clean_requirements_on_remove=True If "clean_requirements_on_remove" is not set to "True", this is a finding.'
    check_command: $ grep -i clean_requirements_on_remove /etc/dnf/dnf.conf
    expected_value: ''
  remediation:
    remediation_step: 'Configure RHEL 9 to remove all software components after updated versions have been installed. Edit the file /etc/dnf/dnf.conf by adding or editing the following line:  clean_requirements_on_remove=True'
    rollback_supported: true
    reboot_required: false
    service_impact: Low
    estimated_time: 5 minutes
  context:
    rationale: Previous versions of software components that are not removed from the information system after updates have been installed may be exploited by some adversaries.
    impact: Low severity security finding
    false_positive_risk: Low
  tags:
  - RHEL-09-214035
  - CCI-002617
  - SRG-OS-000437-GPOS-00194
  - STIG
  - DISA
- rule_id: SV-257880r1044951_rule
  rule_name: RHEL 9 must disable mounting of cramfs.
  rule_description: It is detrimental for operating systems to provide, or install by default, functionality exceeding requirements or mission objectives. These unnecessary capabilities or services are often overlooked and therefore may remain unsecured. They increase the risk to the platform by providing additional attack vectors. Removing support for unneeded filesystem types reduces the local attack surface of the server. Compressed ROM/RAM file system (or cramfs) is a read-only file system designed for simplicity and space-efficiency. It is mainly used in embedded and small-footprint systems.
  category: Security
  subcategory: File System
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: Configuration
    detection_step: 'Verify that RHEL 9 disables the ability to load the cramfs kernel module with the following command: $ grep -r cramfs /etc/modprobe.conf /etc/modprobe.d/*  install cramfs /bin/false blacklist cramfs If the command does not return any output or the lines are commented out, and use of cramfs is not documented with the information system security officer (ISSO) as an operational requirement, this is a finding.'
    check_command: $ grep -r cramfs /etc/modprobe.conf /etc/modprobe.d/*
    expected_value: ''
  remediation:
    remediation_step: 'To configure the system to prevent the cramfs kernel module from being loaded, add the following lines to the file /etc/modprobe.d/blacklist.conf (or create blacklist.conf if it does not exist): install cramfs /bin/false blacklist cramfs'
    rollback_supported: true
    reboot_required: false
    service_impact: Low
    estimated_time: 5 minutes
  context:
    rationale: It is detrimental for operating systems to provide, or install by default, functionality exceeding requirements or mission objectives. These unnecessary capabilities or services are often overlooked and therefore may remain unsecured. They increase the risk to the platform by providing additional attack vectors. Removing support for unneeded filesystem types reduces the local attack surface of the server. Compressed ROM/RAM file system (or cramfs) is a read-only file system designed for simplicity and space-efficiency. It is mainly used in embedded and small-footprint systems.
    impact: Low severity security finding
    false_positive_risk: Low
  tags:
  - RHEL-09-231195
  - CCI-000381
  - SRG-OS-000095-GPOS-00049
  - STIG
  - DISA
- rule_id: SV-257946r958480_rule
  rule_name: RHEL 9 must disable the chrony daemon from acting as a server.
  rule_description: 'Minimizing the exposure of the server functionality of the chrony daemon diminishes the attack surface. Satisfies: SRG-OS-000096-GPOS-00050, SRG-OS-000095-GPOS-00049'
  category: Security
  subcategory: System Configuration
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: Configuration
    detection_step: 'Verify RHEL 9 disables the chrony daemon from acting as a server with the following command: $ grep -w port /etc/chrony.conf port 0 If the "port" option is not set to "0", is commented out, or is missing, this is a finding.'
    check_command: $ grep -w port /etc/chrony.conf
    expected_value: ''
  remediation:
    remediation_step: 'Configure RHEL 9 to disable the chrony daemon from acting as a server by adding/modifying the following line in the /etc/chrony.conf file: port 0'
    rollback_supported: true
    reboot_required: false
    service_impact: Low
    estimated_time: 5 minutes
  context:
    rationale: 'Minimizing the exposure of the server functionality of the chrony daemon diminishes the attack surface. Satisfies: SRG-OS-000096-GPOS-00050, SRG-OS-000095-GPOS-00049'
    impact: Low severity security finding
    false_positive_risk: Low
  tags:
  - RHEL-09-252025
  - CCI-000381
  - SRG-OS-000096-GPOS-00050
  - STIG
  - DISA
- rule_id: SV-257947r958480_rule
  rule_name: RHEL 9 must disable network management of the chrony daemon.
  rule_description: 'Not exposing the management interface of the chrony daemon on the network diminishes the attack space. Satisfies: SRG-OS-000096-GPOS-00050, SRG-OS-000095-GPOS-00049'
