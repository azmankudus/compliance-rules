- rule_id: SV-257845r1044920_rule
  rule_name: RHEL 9 must use a separate file system for /var.
  rule_description: Ensuring that "/var" is mounted on its own partition enables the setting of more restrictive mount options. This helps protect system services such as daemons or other programs which use it. It is not uncommon for the "/var" directory to contain world-writable directories installed by other software packages.
  category: Security
  subcategory: File System
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: Configuration
    detection_step: 'Verify that a separate file system/partition has been created for "/var" with the following command: $ mount | grep /var /dev/mapper/rootvg-varlv on /var type xfs (rw,relatime,seclabel,attr2,inode64,logbufs=8,logbsize=32k,noquota) Note: Options displayed for mount may differ. If a separate entry for "/var" is not in use, this is a finding.'
    check_command: $ mount | grep /var
    expected_value: ''
  remediation:
    remediation_step: Migrate the "/var" path onto a separate file system.
    rollback_supported: true
    reboot_required: false
    service_impact: Low
    estimated_time: 5 minutes
  context:
    rationale: Ensuring that "/var" is mounted on its own partition enables the setting of more restrictive mount options. This helps protect system services such as daemons or other programs which use it. It is not uncommon for the "/var" directory to contain world-writable directories installed by other software packages.
    impact: Low severity security finding
    false_positive_risk: Low
  tags:
  - RHEL-09-231020
  - CCI-000366
  - SRG-OS-000480-GPOS-00227
  - STIG
  - DISA
