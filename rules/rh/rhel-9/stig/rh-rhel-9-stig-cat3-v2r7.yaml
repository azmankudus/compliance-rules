- rule_id: SV-258037r1014863_rule
  rule_name: RHEL 9 must enable Linux audit logging for the USBGuard daemon.
  rule_description: 'Without the capability to generate audit records, it would be difficult to establish, correlate, and investigate the events relating to an incident or identify those responsible for one. If auditing is enabled late in the startup process, the actions of some startup processes may not be audited. Some audit systems also maintain state information only available if auditing is enabled before a given process is created. Audit records can be generated from various components within the information system (e.g., module or policy filter). The list of audited events is the set of events for which audits are to be generated. This set of events is typically a subset of the list of all events for which the system is capable of generating audit records. DOD has defined the list of events for which RHEL 9 will provide an audit record generation capability as the following: 1) Successful and unsuccessful attempts to access, modify, or delete privileges, security objects, security
    levels, or categories of information (e.g., classification levels); 2) Access actions, such as successful and unsuccessful logon attempts, privileged activities or other system-level access, starting and ending time for user access to the system, concurrent logons from different workstations, successful and unsuccessful accesses to objects, all program initiations, and all direct access to the information system; 3) All account creations, modifications, disabling, and terminations; and  4) All kernel module load, unload, and restart actions.'
  category: Security
  subcategory: Auditing
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: Configuration
    detection_step: 'To verify that Linux Audit logging is enabled for the USBGuard daemon with the following command: $ sudo grep AuditBackend /etc/usbguard/usbguard-daemon.conf  AuditBackend=LinuxAudit  If "AuditBackend" is not set to "LinuxAudit", this is a finding. If the system is virtual machine with no virtual or physical USB peripherals attached, this is not a finding.'
    check_command: $ sudo grep AuditBackend /etc/usbguard/usbguard-daemon.conf
    expected_value: ''
  remediation:
    remediation_step: Configure RHEL 9 USBGuard AuditBackend to use the audit system. Add or edit the following line in /etc/usbguard/usbguard-daemon.conf  AuditBackend=LinuxAudit
    rollback_supported: true
    reboot_required: false
    service_impact: Low
    estimated_time: 5 minutes
  context:
    rationale: 'Without the capability to generate audit records, it would be difficult to establish, correlate, and investigate the events relating to an incident or identify those responsible for one. If auditing is enabled late in the startup process, the actions of some startup processes may not be audited. Some audit systems also maintain state information only available if auditing is enabled before a given process is created. Audit records can be generated from various components within the information system (e.g., module or policy filter). The list of audited events is the set of events for which audits are to be generated. This set of events is typically a subset of the list of all events for which the system is capable of generating audit records. DOD has defined the list of events for which RHEL 9 will provide an audit record generation capability as the following: 1) Successful and unsuccessful attempts to access, modify, or delete privileges, security objects, security levels,
      or categories of information (e.g., classification levels); 2) Access actions, such as successful and unsuccessful logon attempts, privileged activities or other system-level access, starting and ending time for user access to the system, concurrent logons from different workstations, successful and unsuccessful accesses to objects, all program initiations, and all direct access to the information system; 3) All account creations, modifications, disabling, and terminations; and  4) All kernel module load, unload, and restart actions.'
    impact: Low severity security finding
    false_positive_risk: Low
  tags:
  - RHEL-09-291025
  - CCI-000169
  - SRG-OS-000062-GPOS-00031
  - STIG
  - DISA
- rule_id: SV-258069r958398_rule
  rule_name: RHEL 9 must limit the number of concurrent sessions to ten for all accounts and/or account types.
  rule_description: Operating system management includes the ability to control the number of users and user sessions that utilize an operating system. Limiting the number of allowed users and sessions per user is helpful in reducing the risks related to denial-of-service (DoS) attacks. This requirement addresses concurrent sessions for information system accounts and does not address concurrent sessions by single users via multiple system accounts. The maximum number of concurrent sessions must be defined based on mission needs and the operational environment for each system.
  category: Security
  subcategory: System Configuration
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: Configuration
    detection_step: 'Verify RHEL 9 limits the number of concurrent sessions to "10" for all accounts and/or account types with the following command: $ grep -r -s maxlogins /etc/security/limits.conf /etc/security/limits.d/*.conf /etc/security/limits.conf:* hard maxlogins 10 This can be set as a global domain (with the * wildcard) but may be set differently for multiple domains. If the "maxlogins" item is missing, commented out, or the value is set greater than "10" and is not documented with the information system security officer (ISSO) as an operational requirement for all domains that have the "maxlogins" item assigned, this is a finding.'
    check_command: $ grep -r -s maxlogins /etc/security/limits.conf /etc/security/limits.d/*.conf
    expected_value: ''
  remediation:
    remediation_step: 'Configure RHEL 9 to limit the number of concurrent sessions to "10" for all accounts and/or account types. Add the following line to the top of the /etc/security/limits.conf or in a ".conf" file defined in /etc/security/limits.d/: * hard maxlogins 10'
    rollback_supported: true
    reboot_required: false
    service_impact: Low
    estimated_time: 5 minutes
  context:
    rationale: Operating system management includes the ability to control the number of users and user sessions that utilize an operating system. Limiting the number of allowed users and sessions per user is helpful in reducing the risks related to denial-of-service (DoS) attacks. This requirement addresses concurrent sessions for information system accounts and does not address concurrent sessions by single users via multiple system accounts. The maximum number of concurrent sessions must be defined based on mission needs and the operational environment for each system.
    impact: Low severity security finding
    false_positive_risk: Low
  tags:
  - RHEL-09-412040
  - CCI-000054
  - SRG-OS-000027-GPOS-00008
  - STIG
  - DISA
- rule_id: SV-258076r991589_rule
  rule_name: RHEL 9 must display the date and time of the last successful account logon upon logon.
  rule_description: Users need to be aware of activity that occurs regarding their account. Providing users with information regarding the number of unsuccessful attempts that were made to login to their account allows the user to determine if any unauthorized activity has occurred and gives them an opportunity to notify administrators.
  category: Security
  subcategory: Logging
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: Configuration
    detection_step: 'Verify users are provided with feedback on when account accesses last occurred with the following command: $ sudo grep pam_lastlog /etc/pam.d/postlogin session required pam_lastlog.so showfailed If "pam_lastlog" is missing from "/etc/pam.d/postlogin" file, or the silent option is present, this is a finding.'
    check_command: $ sudo grep pam_lastlog /etc/pam.d/postlogin
    expected_value: ''
  remediation:
    remediation_step: 'Configure RHEL 9 to provide users with feedback on when account accesses last occurred by setting the required configuration options in "/etc/pam.d/postlogin".  Add the following line to the top of "/etc/pam.d/postlogin": session required pam_lastlog.so showfailed'
    rollback_supported: true
    reboot_required: false
    service_impact: Low
    estimated_time: 5 minutes
  context:
    rationale: Users need to be aware of activity that occurs regarding their account. Providing users with information regarding the number of unsuccessful attempts that were made to login to their account allows the user to determine if any unauthorized activity has occurred and gives them an opportunity to notify administrators.
    impact: Low severity security finding
    false_positive_risk: Low
  tags:
