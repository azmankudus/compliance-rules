- rule_id: SV-258173r1101933_rule
  rule_name: RHEL 9 must allocate an audit_backlog_limit of sufficient size to capture processes that start prior to the audit daemon.
  rule_description: 'Without the capability to generate audit records, it would be difficult to establish, correlate, and investigate the events relating to an incident or identify those responsible for one. If auditing is enabled late in the startup process, the actions of some startup processes may not be audited. Some audit systems also maintain state information only available if auditing is enabled before a given process is created. Audit records can be generated from various components within the information system (e.g., module or policy filter). Allocating an audit_backlog_limit of sufficient size is critical in maintaining a stable boot process. With an insufficient limit allocated, the system is susceptible to boot failures and crashes. Satisfies: SRG-OS-000254-GPOS-00095, SRG-OS-000341-GPOS-00132'
  category: Security
  subcategory: Auditing
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: Configuration
    detection_step: 'Verify RHEL 9 allocates a sufficient audit_backlog_limit to capture processes that start prior to the audit daemon with the following command: $ sudo grubby --info=ALL | grep args | grep ''audit_backlog_limit'' If the command returns any outputs, and audit_backlog_limit is less than "8192", this is a finding.'
    check_command: $ sudo grubby --info=ALL | grep args | grep 'audit_backlog_limit'
    expected_value: ''
  remediation:
    remediation_step: 'Configure RHEL 9 to allocate sufficient audit_backlog_limit to capture processes that start prior to the audit daemon with the following command: $ sudo grubby --update-kernel=ALL --args=audit_backlog_limit=8192'
    rollback_supported: true
    reboot_required: false
    service_impact: Low
    estimated_time: 5 minutes
  context:
    rationale: 'Without the capability to generate audit records, it would be difficult to establish, correlate, and investigate the events relating to an incident or identify those responsible for one. If auditing is enabled late in the startup process, the actions of some startup processes may not be audited. Some audit systems also maintain state information only available if auditing is enabled before a given process is created. Audit records can be generated from various components within the information system (e.g., module or policy filter). Allocating an audit_backlog_limit of sufficient size is critical in maintaining a stable boot process. With an insufficient limit allocated, the system is susceptible to boot failures and crashes. Satisfies: SRG-OS-000254-GPOS-00095, SRG-OS-000341-GPOS-00132'
    impact: Low severity security finding
    false_positive_risk: Low
  tags:
  - RHEL-09-653120
  - CCI-001464
  - SRG-OS-000254-GPOS-00095
  - STIG
  - DISA
