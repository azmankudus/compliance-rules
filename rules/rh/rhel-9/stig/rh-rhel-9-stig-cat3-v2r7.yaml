- rule_id: SV-258138r1045274_rule
  rule_name: RHEL 9 must be configured so that the file integrity tool verifies Access Control Lists (ACLs).
  rule_description: RHEL 9 installation media ships with an optional file integrity tool called Advanced Intrusion Detection Environment (AIDE). AIDE is highly configurable at install time. This requirement assumes the "aide.conf" file is under the "/etc" directory. ACLs can provide permissions beyond those permitted through the file mode and must be verified by the file integrity tools.
  category: Security
  subcategory: File System
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: Configuration
    detection_step: 'Verify that AIDE is verifying ACLs with the following command: $ sudo grep acl /etc/aide.conf All= p+i+n+u+g+s+m+S+sha512+acl+xattrs+selinux If the "acl" rule is not being used on all uncommented selection lines in the "/etc/aide.conf" file, or ACLs are not being checked by another file integrity tool, this is a finding.'
    check_command: $ sudo grep acl /etc/aide.conf
    expected_value: ''
  remediation:
    remediation_step: Configure the file integrity tool to check file and directory ACLs.  If AIDE is installed, ensure the "acl" rule is present on all uncommented file and directory selection lists.
    rollback_supported: true
    reboot_required: false
    service_impact: Low
    estimated_time: 5 minutes
  context:
    rationale: RHEL 9 installation media ships with an optional file integrity tool called Advanced Intrusion Detection Environment (AIDE). AIDE is highly configurable at install time. This requirement assumes the "aide.conf" file is under the "/etc" directory. ACLs can provide permissions beyond those permitted through the file mode and must be verified by the file integrity tools.
    impact: Low severity security finding
    false_positive_risk: Low
  tags:
  - RHEL-09-651030
  - CCI-000366
  - SRG-OS-000480-GPOS-00227
  - STIG
  - DISA
