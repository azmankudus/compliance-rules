    service_impact: Low
    estimated_time: 5 minutes
  context:
    rationale: 'Not exposing the management interface of the chrony daemon on the network diminishes the attack space. Satisfies: SRG-OS-000096-GPOS-00050, SRG-OS-000095-GPOS-00049'
    impact: Low severity security finding
    false_positive_risk: Low
