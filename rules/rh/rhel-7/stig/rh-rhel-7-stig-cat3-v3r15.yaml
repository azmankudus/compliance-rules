- rule_id: STIG-020200
  id: RHEL-07-020200
  legacy_ids:
  - V-204452
  - SV-204452r958936_rule
  rule_name: The Red Hat Enterprise Linux operating system must remove all software components after updated versions have been installed.
  title: The Red Hat Enterprise Linux operating system must remove all software components after updated versions have been installed.
  rule_description: The Red Hat Enterprise Linux operating system must remove all software components after updated versions have been installed.
  description: The Red Hat Enterprise Linux operating system must remove all software components after updated versions have been installed.
  category: SI-2
  severity: Low
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Verify the operating system removes all software components after updated versions have been installed. Check if yum is configured to remove unneeded packages with the following command: # grep -i clean\_requirements\_on\_remove /etc/yum.conf clean\_requirements\_on\_remove=1 If "clean\_requirements\_on\_remove" is not set to "1", "True", or "yes", or is not set in "/etc/yum.conf", this is a finding.'
  remediation:
    remediation_step: 'Configure the operating system to remove all software components after updated versions have been installed. Set the "clean\_requirements\_on\_remove" option to "1" in the "/etc/yum.conf" file: clean\_requirements\_on\_remove=1'
  tags:
  - stig
  - rhel7
  - si-2
  - cci-002617
- rule_id: STIG-020300
  id: RHEL-07-020300
  legacy_ids:
  - V-204461
  - SV-204461r958482_rule
  rule_name: The Red Hat Enterprise Linux operating system must be configured so that all Group Identifiers (GIDs) referenced in the /etc/passwd file are defined in the /etc/group file.
  title: The Red Hat Enterprise Linux operating system must be configured so that all Group Identifiers (GIDs) referenced in the /etc/passwd file are defined in the /etc/group file.
  rule_description: If a user is assigned the GID of a group not existing on the system, and a group with the GID is subsequently created, the user may have unintended rights to any files associated with the group.
  description: If a user is assigned the GID of a group not existing on the system, and a group with the GID is subsequently created, the user may have unintended rights to any files associated with the group.
  category: IA-2
  severity: Low
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Verify all GIDs referenced in the "/etc/passwd" file are defined in the "/etc/group" file. Check that all referenced GIDs exist with the following command: # pwck -r If GIDs referenced in "/etc/passwd" file are returned as not defined in "/etc/group" file, this is a finding.'
  remediation:
    remediation_step: Configure the system to define all GIDs found in the "/etc/passwd" file by modifying the "/etc/group" file to add any non-existent group referenced in the "/etc/passwd" file, or change the GIDs referenced in the "/etc/passwd" file to a group that exists in "/etc/group".
  tags:
  - stig
  - rhel7
  - ia-2
  - cci-000764
- rule_id: STIG-021024
  id: RHEL-07-021024
  legacy_ids:
  - V-204486
  - SV-204486r958804_rule
  rule_name: The Red Hat Enterprise Linux operating system must mount /dev/shm with secure options.
  title: The Red Hat Enterprise Linux operating system must mount /dev/shm with secure options.
  rule_description: The "noexec" mount option causes the system to not execute binary files. This option must be used for mounting any file system not containing approved binary files as they may be incompatible. Executing files from untrusted file systems increases the opportunity for unprivileged users to attain unauthorized administrative access. The "nodev" mount option causes the system to not interpret character or block special devices. Executing character or block special devices from untrusted file systems increases the opportunity for unprivileged users to attain unauthorized administrative access. The "nosuid" mount option causes the system to not execute "setuid" and "setgid" files with owner privileges. This option must be used for mounting any file system not containing approved "setuid" and "setguid" files. Executing files from untrusted file systems increases the opportunity for unprivileged users to attain unauthorized administrative access.
  description: The "noexec" mount option causes the system to not execute binary files. This option must be used for mounting any file system not containing approved binary files as they may be incompatible. Executing files from untrusted file systems increases the opportunity for unprivileged users to attain unauthorized administrative access. The "nodev" mount option causes the system to not interpret character or block special devices. Executing character or block special devices from untrusted file systems increases the opportunity for unprivileged users to attain unauthorized administrative access. The "nosuid" mount option causes the system to not execute "setuid" and "setgid" files with owner privileges. This option must be used for mounting any file system not containing approved "setuid" and "setguid" files. Executing files from untrusted file systems increases the opportunity for unprivileged users to attain unauthorized administrative access.
  category: CM-7
  severity: Low
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Verify that the "nodev","nosuid", and "noexec" options are configured for /dev/shm: # cat /etc/fstab | grep /dev/shm tmpfs /dev/shm tmpfs defaults,nodev,nosuid,noexec 0 0 If results are returned and the "nodev", "nosuid", or "noexec" options are missing, this is a finding. Verify "/dev/shm" is mounted with the "nodev", "nosuid", and "noexec" options: # mount | grep /dev/shm tmpfs on /dev/shm type tmpfs (rw,nodev,nosuid,noexec,seclabel) If /dev/shm is mounted without secure options "nodev", "nosuid", and "noexec", this is a finding.'
  remediation:
    remediation_step: 'Configure the system so that /dev/shm is mounted with the "nodev", "nosuid", and "noexec" options by adding /modifying the /etc/fstab with the following line: tmpfs /dev/shm tmpfs defaults,nodev,nosuid,noexec 0 0'
  tags:
  - stig
  - rhel7
  - cm-7
  - cci-001764
- rule_id: STIG-021310
  id: RHEL-07-021310
  legacy_ids:
  - V-204493
  - SV-204493r991589_rule
  rule_name: The Red Hat Enterprise Linux operating system must be configured so that a separate file system is used for user home directories (such as /home or an equivalent).
  title: The Red Hat Enterprise Linux operating system must be configured so that a separate file system is used for user home directories (such as /home or an equivalent).
  rule_description: The use of separate file systems for different paths can protect the system from failures resulting from a file system becoming full or failing.
  description: The use of separate file systems for different paths can protect the system from failures resulting from a file system becoming full or failing.
  category: CM-6
  severity: Low
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Verify that a separate file system/partition has been created for non-privileged local interactive user home directories. Check the home directory assignment for all non-privileged users (those with a UID of 1000 or greater) on the system with the following command: # awk -F: ''($3&gt;=1000)&amp;&amp;($7 !~ /nologin/){print $1, $3, $6, $7}'' /etc/passwd adamsj 1000 /home/adamsj /bin/bash jacksonm 1001 /home/jacksonm /bin/bash smithj 1002 /home/smithj /bin/bash The output of the command will give the directory/partition that contains the home directories for the non-privileged users on the system (in this example, /home) and users'' shell. All accounts with a valid shell (such as /bin/bash) are considered interactive users. Check that a file system/partition has been created for the non-privileged interactive users with the following command: Note: The partition of /home is used in the example. # grep /home /etc/fstab UUID=333ada18 /home ext4 noatime,nobarrier,nodev 1
      2 If a separate entry for the file system/partition that contains the non-privileged interactive users'' home directories does not exist, this is a finding.'
  remediation:
    remediation_step: Migrate the "/home" directory onto a separate file system/partition.
  tags:
  - stig
  - rhel7
  - cm-6
  - cci-000366
- rule_id: STIG-021320
  id: RHEL-07-021320
