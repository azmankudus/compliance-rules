  - SV-204495r991589_rule
  rule_name: The Red Hat Enterprise Linux operating system must use a separate file system for the system audit data path.
  title: The Red Hat Enterprise Linux operating system must use a separate file system for the system audit data path.
  rule_description: The use of separate file systems for different paths can protect the system from failures resulting from a file system becoming full or failing.
  description: The use of separate file systems for different paths can protect the system from failures resulting from a file system becoming full or failing.
  category: CM-6
  severity: Low
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Determine if the operating system is configured to have the "/var/log/audit" path is on a separate file system. # grep /var/log/audit /etc/fstab If no result is returned, or the operating system is not configured to have "/var/log/audit" on a separate file system, this is a finding. Verify that "/var/log/audit" is mounted on a separate file system: # mount | grep "/var/log/audit" If no result is returned, or "/var/log/audit" is not on a separate file system, this is a finding.'
  remediation:
    remediation_step: Migrate the system audit data path onto a separate file system.
  tags:
  - stig
  - rhel7
  - cm-6
  - cci-000366
- rule_id: STIG-021340
  id: RHEL-07-021340
  legacy_ids:
  - V-204496
  - SV-204496r991589_rule
  rule_name: The Red Hat Enterprise Linux operating system must use a separate file system for /tmp (or equivalent).
  title: The Red Hat Enterprise Linux operating system must use a separate file system for /tmp (or equivalent).
  rule_description: The use of separate file systems for different paths can protect the system from failures resulting from a file system becoming full or failing.
  description: The use of separate file systems for different paths can protect the system from failures resulting from a file system becoming full or failing.
  category: CM-6
  severity: Low
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Verify that a separate file system/partition has been created for "/tmp". Check that a file system/partition has been created for "/tmp" with the following command: # systemctl is-enabled tmp.mount enabled If the "tmp.mount" service is not enabled, check to see if "/tmp" is defined in the fstab with a device and mount point: # grep -i /tmp /etc/fstab UUID=a411dc99-f2a1-4c87-9e05-184977be8539 /tmp ext4 rw,relatime,discard,data=ordered,nosuid,noexec, 0 0 If "tmp.mount" service is not enabled or the "/tmp" directory is not defined in the fstab with a device and mount point, this is a finding.'
  remediation:
    remediation_step: 'Start the "tmp.mount" service with the following command: # systemctl enable tmp.mount OR Edit the "/etc/fstab" file and ensure the "/tmp" directory is defined in the fstab with a device and mount point.'
  tags:
  - stig
  - rhel7
  - cm-6
  - cci-000366
- rule_id: STIG-021600
  id: RHEL-07-021600
  legacy_ids:
  - V-204498
  - SV-204498r991589_rule
  rule_name: The Red Hat Enterprise Linux operating system must be configured so that the file integrity tool is configured to verify Access Control Lists (ACLs).
  title: The Red Hat Enterprise Linux operating system must be configured so that the file integrity tool is configured to verify Access Control Lists (ACLs).
  rule_description: ACLs can provide permissions beyond those permitted through the file mode and must be verified by file integrity tools.
  description: ACLs can provide permissions beyond those permitted through the file mode and must be verified by file integrity tools.
  category: CM-6
  severity: Low
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Verify the file integrity tool is configured to verify ACLs. Note: AIDE is highly configurable at install time. These commands assume the "aide.conf" file is under the "/etc" directory. Use the following command to determine if the file is in another location: # find / -name aide.conf Check the "aide.conf" file to determine if the "acl" rule has been added to the rule list being applied to the files and directories selection lists. An example rule that includes the "acl" rule is below: All= p+i+n+u+g+s+m+S+sha512+acl+xattrs+selinux /bin All # apply the custom rule to the files in bin /sbin All # apply the same custom rule to the files in sbin If the "acl" rule is not being used on all uncommented selection lines in the "/etc/aide.conf" file, or ACLs are not being checked by another file integrity tool, this is a finding.'
  remediation:
    remediation_step: Configure the file integrity tool to check file and directory ACLs. If AIDE is installed, ensure the "acl" rule is present on all uncommented file and directory selection lists.
  tags:
  - stig
  - rhel7
  - cm-6
  - cci-000366
- rule_id: STIG-021610
  id: RHEL-07-021610
  legacy_ids:
  - V-204499
  - SV-204499r991589_rule
  rule_name: The Red Hat Enterprise Linux operating system must be configured so that the file integrity tool is configured to verify extended attributes.
  title: The Red Hat Enterprise Linux operating system must be configured so that the file integrity tool is configured to verify extended attributes.
  rule_description: Extended attributes in file systems are used to contain arbitrary data and file metadata with security implications.
  description: Extended attributes in file systems are used to contain arbitrary data and file metadata with security implications.
  category: CM-6
  severity: Low
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Verify the file integrity tool is configured to verify extended attributes. Note: AIDE is highly configurable at install time. These commands assume the "aide.conf" file is under the "/etc" directory. Use the following command to determine if the file is in another location: # find / -name aide.conf Check the "aide.conf" file to determine if the "xattrs" rule has been added to the rule list being applied to the files and directories selection lists. An example rule that includes the "xattrs" rule follows: All= p+i+n+u+g+s+m+S+sha512+acl+xattrs+selinux /bin All # apply the custom rule to the files in bin /sbin All # apply the same custom rule to the files in sbin If the "xattrs" rule is not being used on all uncommented selection lines in the "/etc/aide.conf" file, or extended attributes are not being checked by another file integrity tool, this is a finding.'
  remediation:
    remediation_step: Configure the file integrity tool to check file and directory extended attributes. If AIDE is installed, ensure the "xattrs" rule is present on all uncommented file and directory selection lists.
  tags:
  - stig
  - rhel7
  - cm-6
  - cci-000366
- rule_id: STIG-040000
  id: RHEL-07-040000
  legacy_ids:
  - V-204576
  - SV-204576r958398_rule
  rule_name: The Red Hat Enterprise Linux operating system must limit the number of concurrent sessions to 10 for all accounts and/or account types.
  title: The Red Hat Enterprise Linux operating system must limit the number of concurrent sessions to 10 for all accounts and/or account types.
  rule_description: The Red Hat Enterprise Linux operating system must limit the number of concurrent sessions to 10 for all accounts and/or account types.
  description: The Red Hat Enterprise Linux operating system must limit the number of concurrent sessions to 10 for all accounts and/or account types.
  category: AC-10
  severity: Low
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Verify the operating system limits the number of concurrent sessions to "10" for all accounts and/or account types by issuing the following command: # grep "maxlogins" /etc/security/limits.conf /etc/security/limits.d/\*.conf \* hard maxlogins 10 This can be set as a global domain (with the \* wildcard) but may be set differently for multiple domains. If the "maxlogins" item is missing, commented out, or the value is not set to "10" or less for all domains that have the "maxlogins" item assigned, this is a finding.'
  remediation:
    remediation_step: 'Configure the operating system to limit the number of concurrent sessions to "10" for all accounts and/or account types. Add the following line to the top of the /etc/security/limits.conf or in a ".conf" file defined in /etc/security/limits.d/ : \* hard maxlogins 10'
  tags:
  - stig
  - rhel7
  - ac-10
  - cci-000054
- rule_id: STIG-040530
  id: RHEL-07-040530
  legacy_ids:
  - V-204605
  - SV-204605r991589_rule
  rule_name: The Red Hat Enterprise Linux operating system must display the date and time of the last successful account logon upon logon.
  title: The Red Hat Enterprise Linux operating system must display the date and time of the last successful account logon upon logon.
  rule_description: Providing users with feedback on when account accesses last occurred facilitates user recognition and reporting of unauthorized account use.
  description: Providing users with feedback on when account accesses last occurred facilitates user recognition and reporting of unauthorized account use.
  category: AC-9
  severity: Low
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Verify users are provided with feedback on when account accesses last occurred. Check that "pam\_lastlog" is used and not silent with the following command: # grep pam\_lastlog /etc/pam.d/postlogin session required pam\_lastlog.so showfailed If "pam\_lastlog" is missing from "/etc/pam.d/postlogin" file, or the silent option is present, this is a finding.'
  remediation:
    remediation_step: 'Configure the operating system to provide users with feedback on when account accesses last occurred by setting the required configuration options in "/etc/pam.d/postlogin". Add the following line to the top of "/etc/pam.d/postlogin": session required pam\_lastlog.so showfailed'
  tags:
  - stig
  - rhel7
  - ac-9
  - cci-000052
- rule_id: STIG-040600
  id: RHEL-07-040600
  legacy_ids:
  - V-204608
  - SV-204608r991589_rule
  rule_name: For Red Hat Enterprise Linux operating systems using DNS resolution, at least two name servers must be configured.
  title: For Red Hat Enterprise Linux operating systems using DNS resolution, at least two name servers must be configured.
  rule_description: To provide availability for name resolution services, multiple redundant name servers are mandated. A failure in name resolution could lead to the failure of security functions requiring name resolution, which may include time synchronization, centralized authentication, and remote system logging.
  description: To provide availability for name resolution services, multiple redundant name servers are mandated. A failure in name resolution could lead to the failure of security functions requiring name resolution, which may include time synchronization, centralized authentication, and remote system logging.
  category: CM-6
  severity: Low
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Determine whether the system is using local or DNS name resolution with the following command: # grep hosts /etc/nsswitch.conf hosts: files dns If the DNS entry is missing from the host''s line in the "/etc/nsswitch.conf" file, the "/etc/resolv.conf" file must be empty. Verify the "/etc/resolv.conf" file is empty with the following command: # ls -al /etc/resolv.conf -rw-r--r-- 1 root root 0 Aug 19 08:31 resolv.conf If local host authentication is being used and the "/etc/resolv.conf" file is not empty, this is a finding. If the DNS entry is found on the host''s line of the "/etc/nsswitch.conf" file, verify the operating system is configured to use two or more name servers for DNS resolution. Determine the name servers used by the system with the following command: # grep nameserver /etc/resolv.conf nameserver 192.168.1.2 nameserver 192.168.1.3 If less than two lines are returned that are not commented out, this is a finding. Verify that the "/etc/resolv.conf" file is
      immutable with the following command: # sudo lsattr /etc/resolv.conf ----i----------- /etc/resolv.conf If the file is mutable and has not been documented with the Information System Security Officer (ISSO), this is a finding.'
  remediation:
    remediation_step: 'Configure the operating system to use two or more name servers for DNS resolution. Edit the "/etc/resolv.conf" file to uncomment or add the two or more "nameserver" option lines with the IP address of local authoritative name servers. If local host resolution is being performed, the "/etc/resolv.conf" file must be empty. An empty "/etc/resolv.conf" file can be created as follows: # echo -n > /etc/resolv.conf And then make the file immutable with the following command: # chattr +i /etc/resolv.conf If the "/etc/resolv.conf" file must be mutable, the required configuration must be documented with the Information System Security Officer (ISSO) and the file must be verified by the system file integrity tool.'
  tags:
  - stig
  - rhel7
  - cm-6
  - cci-000366
- rule_id: STIG-010375
  id: RHEL-07-010375
  legacy_ids:
  - V-255927
  - SV-255927r958524_rule
  rule_name: The Red Hat Enterprise Linux operating system must restrict access to the kernel message buffer.
  title: The Red Hat Enterprise Linux operating system must restrict access to the kernel message buffer.
  rule_description: Restricting access to the kernel message buffer limits access only to root. This prevents attackers from gaining additional system information as a non-privileged user.
  description: Restricting access to the kernel message buffer limits access only to root. This prevents attackers from gaining additional system information as a non-privileged user.
  category: SC-4
  severity: Low
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Verify the operating system is configured to restrict access to the kernel message buffer with the following commands: $ sudo sysctl kernel.dmesg\_restrict kernel.dmesg\_restrict = 1 If "kernel.dmesg\_restrict" is not set to "1" or is missing, this is a finding. Check that the configuration files are present to enable this kernel parameter: $ sudo grep -r kernel.dmesg\_restrict /run/sysctl.d/\* /etc/sysctl.d/\* /usr/local/lib/sysctl.d/\* /usr/lib/sysctl.d/\* /lib/sysctl.d/\* /etc/sysctl.conf 2&gt; /dev/null /etc/sysctl.conf:kernel.dmesg\_restrict = 1 /etc/sysctl.d/99-sysctl.conf:kernel.dmesg\_restrict = 1 If "kernel.dmesg\_restrict" is not set to "1", is missing or commented out, this is a finding. If conflicting results are returned, this is a finding.'
  remediation:
    remediation_step: 'Configure the operating system to restrict access to the kernel message buffer. Set the system to the required kernel parameter by adding or modifying the following line in /etc/sysctl.conf or a config file in the /etc/sysctl.d/ directory: kernel.dmesg\_restrict = 1 Remove any configurations that conflict with the above from the following locations: /run/sysctl.d/ /etc/sysctl.d/ /usr/local/lib/sysctl.d/ /usr/lib/sysctl.d/ /lib/sysctl.d/ /etc/sysctl.conf Reload settings from all system configuration files with the following command: $ sudo sysctl --system'
  tags:
  - stig
  - rhel7
  - sc-4
  - cci-001090
