  rule_name: The Red Hat Enterprise Linux operating system must use a separate file system for /var.
  title: The Red Hat Enterprise Linux operating system must use a separate file system for /var.
  rule_description: The use of separate file systems for different paths can protect the system from failures resulting from a file system becoming full or failing.
  description: The use of separate file systems for different paths can protect the system from failures resulting from a file system becoming full or failing.
  category: CM-6
  severity: Low
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Verify that a separate file system/partition has been created for "/var". Check that a file system/partition has been created for "/var" with the following command: # grep /var /etc/fstab UUID=c274f65f /var ext4 noatime,nobarrier 1 2 If a separate entry for "/var" is not in use, this is a finding.'
  remediation:
    remediation_step: Migrate the "/var" path onto a separate file system.
