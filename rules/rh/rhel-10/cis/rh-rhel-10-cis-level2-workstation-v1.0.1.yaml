- rule_id: CIS-1.1.1.6
  rule_name: Ensure overlay kernel module is not available
  rule_description: 'CIS Benchmark control 1.1.1.6: Ensure overlay kernel module is not available (Automated)'
  category: Filesystem
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: Verify Ensure overlay kernel module is not available (Automated)
    check_command: modprobe -n -v overlayfs | grep -E '(install /bin/true|not found)'
  remediation:
    remediation_step: 'Create or edit /etc/modprobe.d/overlayfs.conf with: install overlayfs /bin/true'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: CIS Benchmark recommendation for Filesystem
    impact: Medium
    false_positive_risk: Low
  tags:
  - filesystem
  - cis
  - level2-workstation
