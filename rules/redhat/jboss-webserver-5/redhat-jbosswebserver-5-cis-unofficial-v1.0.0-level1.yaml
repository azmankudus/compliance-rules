- rule_id: CIS-8.2
  rule_name: X-Frame-Options Header
  rule_description: 'X-Frame-Options header must be set to prevent clickjacking attacks.

    The HttpHeaderSecurity filter must be enabled with anti-click-jacking

    configuration.

    '
  category: Security Headers
  subcategory: Clickjacking Prevention
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: '1. Check web.xml for HttpHeaderSecurity filter configuration

      2. Verify X-Frame-Options is configured

      '
    check_command: 'grep -A20 "httpHeaderSecurity" /opt/jws-5/tomcat/conf/web.xml
      | grep -i "X-Frame-Options"

      '
  remediation:
    remediation_step: "1. Enable HttpHeaderSecurity filter in web.xml:\n   <filter>\n\
      \     <filter-name>httpHeaderSecurity</filter-name>\n     <filter-class>org.apache.catalina.filters.HttpHeaderSecurityFilter</filter-class>\n\
      \     <init-param>\n       <param-name>antiClickJackingEnabled</param-name>\n\
      \       <param-value>true</param-value>\n     </init-param>\n     <init-param>\n\
      \       <param-name>antiClickJackingOption</param-name>\n       <param-value>DENY</param-value>\n\
      \     </init-param>\n   </filter>\n"
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: 'The X-Frame-Options header prevents the page from being embedded in

      frames, protecting against clickjacking attacks.

      '
    false_positive_risk: Low
  tags:
  - security-headers
  - clickjacking
  - x-frame-options
  id: CIS-8.2
  title: X-Frame-Options Header
  description: 'X-Frame-Options header must be set to prevent clickjacking attacks.

    The HttpHeaderSecurity filter must be enabled with anti-click-jacking

    configuration.

    '
  severity: Medium
  references:
  - type: CIS
    reference: CIS Apache Tomcat 9 Benchmark v1.2.0 - 8.2
- rule_id: CIS-8.3
  rule_name: X-Content-Type-Options Header
  rule_description: 'X-Content-Type-Options header must be set to "nosniff" to prevent

    MIME type sniffing attacks.

    '
  category: Security Headers
  subcategory: MIME Sniffing Prevention
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: '1. Check web.xml for HttpHeaderSecurity filter configuration

      2. Verify X-Content-Type-Options is configured

      '
    check_command: 'grep -A20 "httpHeaderSecurity" /opt/jws-5/tomcat/conf/web.xml
      | grep -i "X-Content-Type"

      '
  remediation:
    remediation_step: "1. Enable X-Content-Type-Options in web.xml:\n   <filter>\n\
      \     <filter-name>httpHeaderSecurity</filter-name>\n     <filter-class>org.apache.catalina.filters.HttpHeaderSecurityFilter</filter-class>\n\
      \     <init-param>\n       <param-name>xContentTypeOptionsEnabled</param-name>\n\
      \       <param-value>true</param-value>\n     </init-param>\n   </filter>\n"
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: 'The X-Content-Type-Options header prevents browsers from MIME-sniffing

      a response away from the declared content-type.

      '
    false_positive_risk: Low
  tags:
  - security-headers
  - mime-sniffing
  - x-content-type-options
  id: CIS-8.3
  title: X-Content-Type-Options Header
  description: 'X-Content-Type-Options header must be set to "nosniff" to prevent

    MIME type sniffing attacks.

    '
  severity: Medium
  references:
  - type: CIS
    reference: CIS Apache Tomcat 9 Benchmark v1.2.0 - 8.3
