    reference: CIS Apache Tomcat 9 Benchmark v1.2.0 - 4.4
- rule_id: CIS-6.1
  rule_name: Secure Cookie Flag
  rule_description: 'Session cookies must have the secure flag set to ensure they
    are only

    transmitted over HTTPS connections.

    '
  category: Session Management
  subcategory: Cookie Security
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: '1. Check web.xml for cookie-config secure setting

      2. Verify secure is set to true

      '
    check_command: 'grep -A5 "cookie-config" /opt/jws-5/tomcat/conf/web.xml | grep
      -i "secure"

      '
  remediation:
    remediation_step: "1. Enable secure cookies in web.xml:\n   <session-config>\n\
      \     <cookie-config>\n       <secure>true</secure>\n     </cookie-config>\n\
      \   </session-config>\n"
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 2 minutes
  context:
    rationale: 'The secure flag prevents cookies from being sent over unencrypted

      connections, preventing session hijacking attacks.

      '
    false_positive_risk: Low
  tags:
  - session-management
  - cookies
  - security
  id: CIS-6.1
  title: Secure Cookie Flag
  description: 'Session cookies must have the secure flag set to ensure they are only

    transmitted over HTTPS connections.

    '
  severity: High
  references:
  - type: CIS
    reference: CIS Apache Tomcat 9 Benchmark v1.2.0 - 6.1
- rule_id: CIS-6.2
  rule_name: HttpOnly Cookie Flag
  rule_description: 'Session cookies must have the http-only flag set to prevent client-side

    scripts from accessing cookie data, mitigating XSS attacks.

    '
  category: Session Management
  subcategory: Cookie Security
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: '1. Check web.xml for cookie-config http-only setting

      2. Verify http-only is set to true

      '
    check_command: 'grep -A5 "cookie-config" /opt/jws-5/tomcat/conf/web.xml | grep
      -i "http-only"

      '
  remediation:
    remediation_step: "1. Enable http-only cookies in web.xml:\n   <session-config>\n\
      \     <cookie-config>\n       <http-only>true</http-only>\n     </cookie-config>\n\
      \   </session-config>\n"
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 2 minutes
  context:
    rationale: 'The http-only flag prevents JavaScript from accessing session cookies,

      mitigating cross-site scripting (XSS) attacks that attempt to steal

      session cookies.

      '
    false_positive_risk: Low
  tags:
  - session-management
  - cookies
  - xss
  - security
  id: CIS-6.2
  title: HttpOnly Cookie Flag
  description: 'Session cookies must have the http-only flag set to prevent client-side

    scripts from accessing cookie data, mitigating XSS attacks.

    '
  severity: High
  references:
  - type: CIS
    reference: CIS Apache Tomcat 9 Benchmark v1.2.0 - 6.2
- rule_id: CIS-7.1
  rule_name: Stack Tracing Disabled
  rule_description: 'The TRACE HTTP method must be disabled (allowTrace=false) to
    prevent

    cross-site tracing (XST) attacks that can bypass HttpOnly cookie protection.

    '
  category: Request Filtering
  subcategory: HTTP Methods
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: '1. Check server.xml Connector for allowTrace attribute

      2. Verify allowTrace is set to false

      '
    check_command: 'grep -i "allowTrace" /opt/jws-5/tomcat/conf/server.xml

      '
  remediation:
    remediation_step: "1. Disable TRACE method on all connectors:\n   <Connector ...\
      \ allowTrace=\"false\" />\n"
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 2 minutes
  context:
    rationale: 'The TRACE method can be used in cross-site tracing attacks to steal

      cookies even when HttpOnly is enabled.

      '
    false_positive_risk: Low
  tags:
  - http-methods
  - trace
  - xst
  - security
  id: CIS-7.1
  title: Stack Tracing Disabled
  description: 'The TRACE HTTP method must be disabled (allowTrace=false) to prevent

    cross-site tracing (XST) attacks that can bypass HttpOnly cookie protection.

    '
  severity: Medium
  references:
  - type: CIS
    reference: CIS Apache Tomcat 9 Benchmark v1.2.0 - 7.1
