- rule_id: RHJWS5-018
  rule_name: Enable Request Filtering
  rule_description: 'Request filtering must be configured to block malicious requests

    including path traversal, XSS attempts, and known attack patterns.

    '
  category: Request Filtering
  subcategory: Input Validation
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: '1. Check for RequestFilterValve configuration

      2. Check for CSRF prevention filter

      3. Check web.xml for security filters

      '
    check_command: 'grep -i "RequestFilter\|CSRF" /opt/jws-5/tomcat/conf/server.xml

      grep -i "CsrfPreventionFilter" /opt/jws-5/tomcat/conf/web.xml

      '
  remediation:
    remediation_step: "1. Enable CSRF prevention filter in web.xml:\n   <filter>\n\
      \     <filter-name>CSRF</filter-name>\n     <filter-class>org.apache.catalina.filters.CsrfPreventionFilter</filter-class>\n\
      \   </filter>\n   <filter-mapping>\n     <filter-name>CSRF</filter-name>\n \
      \    <url-pattern>/*</url-pattern>\n   </filter-mapping>\n2. Configure request\
      \ filtering for path traversal:\n   <Valve className=\"org.apache.catalina.valves.RequestFilterValve\"\
      \n          deny=\"\\.\\.;/\" />\n"
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 15 minutes
  context:
    rationale: 'Request filtering provides defense against common web attacks

      like CSRF, path traversal, and XSS.

      '
    false_positive_risk: Medium
  tags:
  - request-filtering
  - csrf
  - input-validation
  id: RHJWS5-018
  title: Enable Request Filtering
  description: 'Request filtering must be configured to block malicious requests

    including path traversal, XSS attempts, and known attack patterns.

    '
  severity: High
  references:
  - type: Red Hat Documentation
    reference: Security Guide - Request Filtering
- rule_id: RHJWS5-019
  rule_name: Configure SSL/TLS Certificate Management
  rule_description: 'SSL/TLS certificates must be properly managed with appropriate

    key sizes, valid certificate chains, and timely renewal.

    '
  category: Encryption
  subcategory: Certificate Management
  assessment:
    severity: High
    is_auto: true
    automation_level: Partial
    audit_type: config
    detection_step: '1. Check certificate expiration dates

      2. Verify certificate chain is complete

      3. Check key size meets minimum requirements

      '
    check_command: 'keytool -list -v -keystore /opt/jws-5/tomcat/conf/.keystore 2>/dev/null
      | grep -E "valid|SHA256|RSA"

      echo | openssl s_client -connect localhost:8443 2>/dev/null | openssl x509 -noout
      -dates

      '
  remediation:
    remediation_step: "1. Generate new certificate with adequate key size:\n   keytool\
      \ -genkeypair -alias tomcat -keyalg RSA -keysize 4096 \\\n           -sigalg\
      \ SHA256withRSA -validity 365 \\\n           -keystore /opt/jws-5/tomcat/conf/.keystore\n\
      2. Import CA certificate chain:\n   keytool -import -alias root -file ca-cert.pem\
      \ \\\n           -keystore /opt/jws-5/tomcat/conf/.keystore\n3. Configure certificate\
      \ in server.xml:\n   <Connector port=\"8443\" SSLEnabled=\"true\"\n        \
      \      keystoreFile=\"/opt/jws-5/tomcat/conf/.keystore\"\n              keystorePass=\"\
      changeit\"\n              keyAlias=\"tomcat\" />\n"
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 30 minutes
  context:
    rationale: 'Proper certificate management ensures encrypted communications

      and prevents man-in-the-middle attacks.

      '
    false_positive_risk: Low
  tags:
  - encryption
  - ssl-tls
  - certificates
  id: RHJWS5-019
  title: Configure SSL/TLS Certificate Management
  description: 'SSL/TLS certificates must be properly managed with appropriate

    key sizes, valid certificate chains, and timely renewal.

    '
  severity: High
  references:
  - type: Red Hat Documentation
    reference: SSL/TLS Configuration Guide
- rule_id: RHJWS5-020
  rule_name: Configure Systemd Service Security
  rule_description: 'The JWS systemd service must be configured with security hardening

    options to restrict system access.

    '
  category: System Security
  subcategory: Service Hardening
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: '1. Check systemd service unit for security settings

      2. Verify sandbox options are configured

      '
    check_command: 'systemctl cat jws5-tomcat 2>/dev/null | grep -i "NoNewPrivileges\|PrivateTmp\|ProtectSystem"

      '
  remediation:
    remediation_step: "1. Add security hardening to systemd service:\n   [Service]\n\
      \   User=tomcat\n   Group=tomcat\n   NoNewPrivileges=true\n   PrivateTmp=true\n\
      \   ProtectSystem=strict\n   ProtectHome=true\n   ReadWritePaths=/opt/jws-5/tomcat/logs\
      \ /opt/jws-5/tomcat/work /opt/jws-5/tomcat/temp\n   Prevent privilege escalation\n\
      \   CapabilityBoundingSet=\n   AmbientCapabilities=\n2. Reload systemd: systemctl\
      \ daemon-reload\n3. Restart service: systemctl restart jws5-tomcat\n"
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 15 minutes
  context:
    rationale: 'Systemd security options provide additional isolation and limit

      the impact of potential compromise.

      '
    impact: 'Without systemd hardening, a compromised Tomcat process could

      access more system resources.

      '
    false_positive_risk: Low
  tags:
  - system-security
  - systemd
  - sandboxing
  id: RHJWS5-020
  title: Configure Systemd Service Security
  description: 'The JWS systemd service must be configured with security hardening

    options to restrict system access.

    '
  severity: High
  references:
  - type: Red Hat Documentation
    reference: Systemd Service Configuration Guide
