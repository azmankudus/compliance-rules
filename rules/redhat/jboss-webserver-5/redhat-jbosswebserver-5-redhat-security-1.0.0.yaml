rules:
- rule_id: RHJWS5-001
  rule_name: Run JWS as Non-Root User
  rule_description: 'JBoss Web Server must run as a non-root user to minimize the
    impact of

    potential security vulnerabilities. Running as root increases the risk

    of privilege escalation if the server is compromised.

    '
  category: Access Control
  subcategory: User Configuration
  assessment:
    severity: Critical
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: '1. Check the user configured in the JWS service

      2. Verify the process is not running as root

      '
    check_command: 'ps -ef | grep tomcat | grep -v grep

      grep -i "User=" /etc/systemd/system/jws5-tomcat.service 2>/dev/null

      '
  remediation:
    remediation_step: "1. Create a dedicated user for JWS:\n   useradd -r -s /sbin/nologin\
      \ tomcat\n2. Configure the service to run as this user:\n   [Service]\n   User=tomcat\n\
      \   Group=tomcat\n3. Ensure proper ownership of JWS directories:\n   chown -R\
      \ tomcat:tomcat /opt/jws-5/tomcat/logs\n   chown -R tomcat:tomcat /opt/jws-5/tomcat/work\n\
      \   chown -R tomcat:tomcat /opt/jws-5/tomcat/temp\n"
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 10 minutes
  context:
    rationale: 'Running as non-root limits the damage from potential exploits and

      follows the principle of least privilege.

      '
    impact: 'Running as root could allow complete system compromise if JWS is

      successfully attacked.

      '
    false_positive_risk: Low
  tags:
  - access-control
  - user-configuration
  - non-root
  - critical
  id: RHJWS5-001
  title: Run JWS as Non-Root User
  description: 'JBoss Web Server must run as a non-root user to minimize the impact
    of

    potential security vulnerabilities. Running as root increases the risk

    of privilege escalation if the server is compromised.

    '
  severity: Critical
  references:
  - type: Red Hat Documentation
    reference: Installation Guide - Running JWS as a Service
- rule_id: RHJWS5-002
  rule_name: Configure Java Security Manager
  rule_description: 'The Java Security Manager should be enabled to restrict the permissions

    granted to web applications. This provides an additional layer of

    protection against malicious code execution.

    '
  category: Security Framework
  subcategory: Java Security
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: '1. Check if Security Manager is enabled in the service configuration

      2. Verify -security flag is present in JAVA_OPTS

      '
    check_command: 'grep -i "security" /etc/systemd/system/jws5-tomcat.service

      grep -i "java.security.manager" /opt/jws-5/tomcat/bin/setenv.sh 2>/dev/null

      ps aux | grep tomcat | grep -i security

      '
  remediation:
    remediation_step: "1. Enable Security Manager in setenv.sh:\n   JAVA_OPTS=\"$JAVA_OPTS\
      \ -Djava.security.manager\"\n2. Configure security policy in catalina.policy:\n\
      \   grant codeBase \"file:${catalina.base}/webapps/yourapp/-\" {\n       permission\
      \ java.net.SocketPermission \"localhost:3306\", \"connect\";\n   };\n3. Restart\
      \ JWS service\n"
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 20 minutes
  context:
    rationale: 'The Java Security Manager restricts what web applications can do,

      limiting the impact of compromised or malicious applications.

      '
    impact: 'Without Security Manager, web applications have full access to the

      JVM and can perform any action the JVM user can.

      '
    false_positive_risk: Medium
  tags:
  - security-framework
  - java-security
  - sandbox
  id: RHJWS5-002
  title: Configure Java Security Manager
  description: 'The Java Security Manager should be enabled to restrict the permissions

    granted to web applications. This provides an additional layer of

    protection against malicious code execution.

    '
  severity: High
  references:
  - type: Red Hat Documentation
    reference: Security Guide - Java Security Manager
- rule_id: RHJWS5-003
  rule_name: Configure Secure AJP Connector
  rule_description: 'If using AJP connectors for communication with web servers like
    Apache HTTPD,

    they must be configured securely with requiredSecret or secret attribute

    to prevent unauthorized access.

    '
  category: Network Security
  subcategory: Connector Configuration
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: '1. Check for AJP connector configuration in server.xml

      2. Verify secret or requiredSecret is configured

      3. Verify address is restricted if possible

      '
    check_command: 'grep -A5 "protocol=\"AJP" /opt/jws-5/tomcat/conf/server.xml

      '
  remediation:
    remediation_step: "1. Configure AJP connector with secret:\n   <Connector port=\"\
      8009\" protocol=\"AJP/1.3\"\n              secretRequired=\"true\"\n       \
      \       secret=\"your-strong-secret-here\"\n              address=\"127.0.0.1\"\
      \ />\n2. Configure matching secret in Apache mod_jk or mod_proxy_ajp\n3. Restrict\
      \ to localhost if web server is on same host\n"
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 15 minutes
  context:
    rationale: 'Ghostcat (CVE-2020-1938) demonstrated that unprotected AJP connectors

      can be exploited to read files or execute code.

      '
    impact: 'Unprotected AJP connectors can allow file read and potential RCE

      through deserialization attacks.

      '
    false_positive_risk: Low
  tags:
  - network-security
  - ajp
  - connector
  - ghostcat
  id: RHJWS5-003
  title: Configure Secure AJP Connector
  description: 'If using AJP connectors for communication with web servers like Apache
    HTTPD,

    they must be configured securely with requiredSecret or secret attribute

    to prevent unauthorized access.

    '
  severity: High
  references:
  - type: Red Hat Security Advisory
    reference: RHSA-2020-0728
- rule_id: RHJWS5-004
  rule_name: Configure Secure Random for Session IDs
  rule_description: 'JBoss Web Server must use a cryptographically secure random number

    generator for session ID generation to prevent session prediction attacks.

    '
  category: Session Management
  subcategory: Session ID Generation
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: '1. Check SecureRandom configuration in context.xml

      2. Verify session ID generation uses secure random

      '
    check_command: 'grep -i "SecureRandom\|randomClass" /opt/jws-5/tomcat/conf/context.xml

      grep -i "sessionIdLength" /opt/jws-5/tomcat/conf/context.xml

      '
  remediation:
    remediation_step: "1. Configure SecureRandom in context.xml:\n   <Manager className=\"\
      org.apache.catalina.session.StandardManager\"\n            randomClass=\"java.security.SecureRandom\"\
      \n            sessionIdLength=\"32\" />\n2. Or configure in server.xml for all\
      \ contexts:\n   <Realm className=\"org.apache.catalina.realm.LockOutRealm\"\n\
      \          randomClass=\"java.security.SecureRandom\">\n"
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 10 minutes
  context:
    rationale: 'Predictable session IDs can be guessed by attackers to hijack

      legitimate user sessions.

      '
    false_positive_risk: Low
  tags:
  - session-management
  - secure-random
  - session-id
  id: RHJWS5-004
  title: Configure Secure Random for Session IDs
  description: 'JBoss Web Server must use a cryptographically secure random number

    generator for session ID generation to prevent session prediction attacks.

    '
  severity: High
  references:
  - type: Red Hat Documentation
    reference: Security Configuration - Session Management
- rule_id: RHJWS5-005
  rule_name: Enable Request Dumper Filter for Auditing
  rule_description: 'The Request Dumper filter should be configured for detailed request

    logging in security-sensitive environments to aid in incident response

    and forensic analysis.

    '
  category: Logging and Auditing
  subcategory: Request Logging
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: '1. Check for RequestDumperValve in server.xml

      2. Verify request logging is configured

      '
    check_command: 'grep -i "RequestDumperValve" /opt/jws-5/tomcat/conf/server.xml

      '
  remediation:
    remediation_step: "1. Add RequestDumperValve for detailed logging (development/staging):\n\
      \   <Valve className=\"org.apache.catalina.valves.RequestDumperValve\" />\n\
      2. For production, use AccessLogValve with comprehensive pattern:\n   <Valve\
      \ className=\"org.apache.catalina.valves.AccessLogValve\"\n          directory=\"\
      logs\"\n          prefix=\"access\"\n          suffix=\".log\"\n          pattern=\"\
      %h %l %u %t &quot;%r&quot; %s %b %D %{x-forwarded-for}i\" />\n"
    rollback_supported: true
    reboot_required: false
    service_impact: Potential performance impact
    estimated_time: 10 minutes
  context:
    rationale: 'Detailed request logging is essential for detecting attacks and

      performing forensic analysis after security incidents.

      '
    false_positive_risk: Low
  tags:
  - logging
  - auditing
  - request-logging
  id: RHJWS5-005
  title: Enable Request Dumper Filter for Auditing
  description: 'The Request Dumper filter should be configured for detailed request

    logging in security-sensitive environments to aid in incident response

    and forensic analysis.

    '
  severity: Medium
  references:
  - type: Red Hat Documentation
    reference: Logging Configuration Guide
- rule_id: RHJWS5-006
  rule_name: Configure Error Handling
  rule_description: 'Custom error pages must be configured to prevent exposure of

    sensitive information in error messages and provide consistent

    user experience.

    '
  category: Error Handling
  subcategory: Information Disclosure
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: '1. Check for custom error pages in web.xml

      2. Verify ErrorReportValve hides server info

      '
    check_command: 'grep -i "error-page" /opt/jws-5/tomcat/conf/web.xml

      grep -i "ErrorReportValve" /opt/jws-5/tomcat/conf/server.xml

      '
  remediation:
    remediation_step: "1. Configure custom error pages in web.xml:\n   <error-page>\n\
      \     <error-code>404</error-code>\n     <location>/error/404.html</location>\n\
      \   </error-page>\n   <error-page>\n     <error-code>500</error-code>\n    \
      \ <location>/error/500.html</location>\n   </error-page>\n   <error-page>\n\
      \     <exception-type>java.lang.Throwable</exception-type>\n     <location>/error/error.html</location>\n\
      \   </error-page>\n2. Configure ErrorReportValve:\n   <Valve className=\"org.apache.catalina.valves.ErrorReportValve\"\
      \n          showServerInfo=\"false\" showReport=\"false\" />\n"
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 15 minutes
  context:
    rationale: 'Default error pages reveal server version and stack traces that

      help attackers identify vulnerabilities.

      '
    false_positive_risk: Low
  tags:
  - error-handling
  - information-disclosure
  - custom-errors
  id: RHJWS5-006
  title: Configure Error Handling
  description: 'Custom error pages must be configured to prevent exposure of

    sensitive information in error messages and provide consistent

    user experience.

    '
  severity: Medium
  references:
  - type: Red Hat Documentation
    reference: Security Guide - Error Handling
- rule_id: RHJWS5-007
  rule_name: Configure Rate Limiting
  rule_description: 'Rate limiting should be configured to protect against DoS attacks

    and brute force attempts on authentication endpoints.

    '
  category: Availability
  subcategory: DoS Protection
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Partial
    audit_type: config
    detection_step: '1. Check for rate limiting valve configuration

      2. Check for connection limiting in connectors

      '
    check_command: 'grep -i "RateLimit\|connectionTimeout\|maxThreads" /opt/jws-5/tomcat/conf/server.xml

      '
  remediation:
    remediation_step: "1. Configure connector limits:\n   <Connector port=\"8080\"\
      \ protocol=\"HTTP/1.1\"\n              maxThreads=\"200\"\n              acceptCount=\"\
      100\"\n              connectionTimeout=\"20000\" />\n2. Use RemoteAddrValve\
      \ for IP-based blocking:\n   <Valve className=\"org.apache.catalina.valves.RemoteAddrValve\"\
      \n          deny=\"10\\.0\\.0\\.\\d+\" />\n3. Consider using mod_security with\
      \ Apache HTTPD for advanced rate limiting\n"
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 20 minutes
  context:
    rationale: 'Rate limiting protects against denial of service attacks and

      credential brute forcing attempts.

      '
    false_positive_risk: Medium
  tags:
  - availability
  - rate-limiting
  - dos-protection
  id: RHJWS5-007
  title: Configure Rate Limiting
  description: 'Rate limiting should be configured to protect against DoS attacks

    and brute force attempts on authentication endpoints.

    '
  severity: Medium
  references:
  - type: Red Hat Documentation
    reference: Performance Tuning Guide
- rule_id: RHJWS5-008
  rule_name: Configure Secure JMX Access
  rule_description: 'JMX access must be secured with authentication and TLS encryption

    if remote JMX monitoring is required.

    '
  category: Management Security
  subcategory: JMX Configuration
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: '1. Check JMX configuration in setenv.sh

      2. Verify authentication is enabled

      3. Verify SSL is configured for remote JMX

      '
    check_command: 'grep -i "jmxremote" /opt/jws-5/tomcat/bin/setenv.sh 2>/dev/null

      grep -i "com.sun.management.jmxremote" /etc/systemd/system/jws5-tomcat.service

      '
  remediation:
    remediation_step: "1. Configure secure JMX in setenv.sh:\n   JAVA_OPTS=\"$JAVA_OPTS\
      \ -Dcom.sun.management.jmxremote.port=9010\"\n   JAVA_OPTS=\"$JAVA_OPTS -Dcom.sun.management.jmxremote.authenticate=true\"\
      \n   JAVA_OPTS=\"$JAVA_OPTS -Dcom.sun.management.jmxremote.ssl=true\"\n   JAVA_OPTS=\"\
      $JAVA_OPTS -Dcom.sun.management.jmxremote.access.file=/opt/jws-5/tomcat/conf/jmxremote.access\"\
      \n   JAVA_OPTS=\"$JAVA_OPTS -Dcom.sun.management.jmxremote.password.file=/opt/jws-5/tomcat/conf/jmxremote.password\"\
      \n2. Create JMX password file with restricted permissions:\n   echo \"monitorRole\
      \ password123\" > /opt/jws-5/tomcat/conf/jmxremote.password\n   chmod 600 /opt/jws-5/tomcat/conf/jmxremote.password\n"
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 15 minutes
  context:
    rationale: 'Unsecured JMX allows remote code execution and complete server

      compromise.

      '
    impact: 'Unauthenticated JMX access allows attackers to execute arbitrary

      code on the server.

      '
    false_positive_risk: Low
  tags:
  - management-security
  - jmx
  - remote-access
  id: RHJWS5-008
  title: Configure Secure JMX Access
  description: 'JMX access must be secured with authentication and TLS encryption

    if remote JMX monitoring is required.

    '
  severity: High
  references:
  - type: Red Hat Security Advisory
    reference: RHSA-2020-0728
- rule_id: RHJWS5-009
  rule_name: Disable Unnecessary Connectors
  rule_description: 'Only required connectors should be enabled. Unused connectors

    increase the attack surface and should be disabled.

    '
  category: Configuration
  subcategory: Connector Management
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: '1. List all enabled connectors in server.xml

      2. Verify only required connectors are enabled

      '
    check_command: 'grep -i "<Connector" /opt/jws-5/tomcat/conf/server.xml

      '
  remediation:
    remediation_step: "1. Comment out or remove unused connectors:\n   <!-- <Connector\
      \ port=\"8009\" protocol=\"AJP/1.3\" /> -->\n2. Common unnecessary connectors:\n\
      \   - AJP connector if not using Apache HTTPD\n   - Additional HTTP connectors\
      \ for unused ports\n3. Disable the shutdown port:\n   <Server port=\"-1\" shutdown=\"\
      SHUTDOWN\">\n"
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 10 minutes
  context:
    rationale: 'Each connector represents a potential attack vector. Reducing

      the number of connectors reduces attack surface.

      '
    false_positive_risk: Low
  tags:
  - configuration
  - connectors
  - hardening
  id: RHJWS5-009
  title: Disable Unnecessary Connectors
  description: 'Only required connectors should be enabled. Unused connectors

    increase the attack surface and should be disabled.

    '
  severity: Medium
  references:
  - type: Red Hat Documentation
    reference: Configuration Guide - Connectors
- rule_id: RHJWS5-010
  rule_name: Configure Secure Class Loader
  rule_description: 'The class loader must be configured to prevent web applications
    from

    overriding server classes and accessing internal Tomcat classes.

    '
  category: Application Security
  subcategory: Class Loading
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: '1. Check catalina.properties for class loader settings

      2. Verify package protection is configured

      '
    check_command: 'grep -i "package.definition\|package.access" /opt/jws-5/tomcat/conf/catalina.properties

      '
  remediation:
    remediation_step: "1. Configure package protection in catalina.properties:\n \
      \  package.access=sun.,org.apache.catalina.,org.apache.coyote.,org.apache.jasper.,org.apache.tomcat.\n\
      \   package.definition=sun.,java.,org.apache.catalina.,org.apache.coyote.,org.apache.jasper.,org.apache.tomcat.\n\
      2. Enable security manager for enforcement\n"
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 10 minutes
  context:
    rationale: 'Without proper class loader restrictions, web applications could

      access or override internal server classes.

      '
    false_positive_risk: Low
  tags:
  - application-security
  - class-loader
  - package-protection
  id: RHJWS5-010
  title: Configure Secure Class Loader
  description: 'The class loader must be configured to prevent web applications from

    overriding server classes and accessing internal Tomcat classes.

    '
  severity: Medium
  references:
  - type: Red Hat Documentation
    reference: Security Guide - Class Loading
- rule_id: RHJWS5-011
  rule_name: Configure Deployment Descriptor Security
  rule_description: 'The web.xml deployment descriptor must be configured with security

    constraints including authentication requirements and secure transport.

    '
  category: Application Security
  subcategory: Deployment Configuration
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: '1. Check security-constraint in web.xml

      2. Verify transport-guarantee for sensitive resources

      3. Verify auth-constraint for protected resources

      '
    check_command: 'grep -A20 "security-constraint" /opt/jws-5/tomcat/conf/web.xml

      grep -i "transport-guarantee" /opt/jws-5/tomcat/conf/web.xml

      '
  remediation:
    remediation_step: "1. Add security constraints in web.xml:\n   <security-constraint>\n\
      \     <web-resource-collection>\n       <web-resource-name>Protected Area</web-resource-name>\n\
      \       <url-pattern>/protected/*</url-pattern>\n     </web-resource-collection>\n\
      \     <auth-constraint>\n       <role-name>admin</role-name>\n     </auth-constraint>\n\
      \     <user-data-constraint>\n       <transport-guarantee>CONFIDENTIAL</transport-guarantee>\n\
      \     </user-data-constraint>\n   </security-constraint>\n"
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 15 minutes
  context:
    rationale: 'Security constraints ensure that sensitive resources are only

      accessible to authorized users over secure connections.

      '
    false_positive_risk: Low
  tags:
  - application-security
  - deployment-descriptor
  - security-constraints
  id: RHJWS5-011
  title: Configure Deployment Descriptor Security
  description: 'The web.xml deployment descriptor must be configured with security

    constraints including authentication requirements and secure transport.

    '
  severity: High
  references:
  - type: Red Hat Documentation
    reference: Security Guide - Deployment Descriptors
- rule_id: RHJWS5-012
  rule_name: Configure Connection Pool Security
  rule_description: 'Database connection pools must be configured securely with encrypted

    credentials and restricted access to connection configuration.

    '
  category: Data Security
  subcategory: Database Connections
  assessment:
    severity: High
    is_auto: true
    automation_level: Partial
    audit_type: config
    detection_step: '1. Check for datasource configuration in context.xml

      2. Verify credentials are not plaintext

      3. Check for connection factory encryption

      '
    check_command: 'grep -i "Resource.*name.*jdbc" /opt/jws-5/tomcat/conf/context.xml

      grep -i "password" /opt/jws-5/tomcat/conf/context.xml

      '
  remediation:
    remediation_step: "1. Use encrypted passwords in datasource configuration:\n \
      \  <Resource name=\"jdbc/mydb\" auth=\"Container\"\n             type=\"javax.sql.DataSource\"\
      \n             factory=\"org.apache.tomcat.jdbc.pool.DataSourceFactory\"\n \
      \            username=\"dbuser\"\n             password=\"${db.password.encrypted}\"\
      \n             credentialHandler=\"org.apache.catalina.realm.MessageDigestCredentialHandler\"\
      \ />\n2. Store encrypted credentials in external properties file\n3. Restrict\
      \ access to context.xml (chmod 640)\n"
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 20 minutes
  context:
    rationale: 'Plaintext database credentials in configuration files can be

      extracted by attackers to gain database access.

      '
    false_positive_risk: Low
  tags:
  - data-security
  - database
  - credentials
  id: RHJWS5-012
  title: Configure Connection Pool Security
  description: 'Database connection pools must be configured securely with encrypted

    credentials and restricted access to connection configuration.

    '
  severity: High
  references:
  - type: Red Hat Documentation
    reference: JNDI Datasource Configuration Guide
- rule_id: RHJWS5-013
  rule_name: Configure Clustering Security
  rule_description: 'If Tomcat clustering is enabled for session replication, it must
    be

    configured with encryption and authentication for cluster communication.

    '
  category: Network Security
  subcategory: Cluster Configuration
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: '1. Check for Cluster configuration in server.xml

      2. Verify encryption is enabled for cluster traffic

      3. Verify authentication is configured

      '
    check_command: 'grep -A30 "<Cluster" /opt/jws-5/tomcat/conf/server.xml

      grep -i "encrypt\|useSecureChannel" /opt/jws-5/tomcat/conf/server.xml

      '
  remediation:
    remediation_step: "1. Configure encrypted cluster communication:\n   <Cluster\
      \ className=\"org.apache.catalina.ha.tcp.SimpleTcpCluster\"\n            channelSendOptions=\"\
      8\">\n     <Channel className=\"org.apache.catalina.tribes.group.GroupChannel\"\
      >\n       <Receiver className=\"org.apache.catalina.tribes.transport.nio.NioReceiver\"\
      \n                 address=\"auto\" port=\"4000\" />\n       <Sender className=\"\
      org.apache.catalina.tribes.transport.ReplicationTransmitter\">\n         <Transport\
      \ className=\"org.apache.catalina.tribes.transport.nio.PooledParallelSender\"\
      />\n       </Sender>\n       <Interceptor className=\"org.apache.catalina.tribes.group.interceptors.EncryptInterceptor\"\
      \n                    encryptionAlgorithm=\"AES/CBC/PKCS5Padding\"/>\n     </Channel>\n\
      \   </Cluster>\n2. Use membership authentication\n"
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 30 minutes
  context:
    rationale: 'Unencrypted cluster traffic can be intercepted to steal session

      data or inject malicious data into the cluster.

      '
    false_positive_risk: Low
  tags:
  - network-security
  - clustering
  - session-replication
  id: RHJWS5-013
  title: Configure Clustering Security
  description: 'If Tomcat clustering is enabled for session replication, it must be

    configured with encryption and authentication for cluster communication.

    '
  severity: High
  references:
