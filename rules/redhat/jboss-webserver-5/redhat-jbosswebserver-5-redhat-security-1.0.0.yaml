    reference: Clustering Guide - Security Configuration
- rule_id: RHJWS5-014
  rule_name: Configure Log Rotation
  rule_description: 'Log rotation must be configured to prevent disk space exhaustion

    and ensure logs are retained according to organizational policies.

    '
  category: Logging and Auditing
  subcategory: Log Management
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: '1. Check logging.properties for rotation settings

      2. Check for logrotate configuration

      3. Verify logs are being rotated

      '
    check_command: 'grep -i "limit\|count" /opt/jws-5/tomcat/conf/logging.properties

      cat /etc/logrotate.d/tomcat 2>/dev/null

      ls -la /opt/jws-5/tomcat/logs/

      '
  remediation:
    remediation_step: "1. Configure log rotation in logging.properties:\n   1catalina.org.apache.juli.AsyncFileHandler.level\
      \ = FINE\n   1catalina.org.apache.juli.AsyncFileHandler.directory = ${catalina.base}/logs\n\
      \   1catalina.org.apache.juli.AsyncFileHandler.prefix = catalina.\n   1catalina.org.apache.juli.AsyncFileHandler.maxDays\
      \ = 90\n2. Create logrotate configuration:\n   /opt/jws-5/tomcat/logs/*.log\
      \ {\n       daily\n       rotate 30\n       compress\n       missingok\n   \
      \    notifempty\n       create 640 tomcat tomcat\n   }\n"
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 10 minutes
  context:
    rationale: 'Without log rotation, logs can fill the disk and cause denial of

      service, and old logs may not be available for investigation.

      '
    false_positive_risk: Low
  tags:
  - logging
  - log-rotation
  - log-management
  id: RHJWS5-014
  title: Configure Log Rotation
  description: 'Log rotation must be configured to prevent disk space exhaustion

    and ensure logs are retained according to organizational policies.

    '
  severity: Medium
  references:
  - type: Red Hat Documentation
    reference: Logging Configuration Guide
- rule_id: RHJWS5-015
  rule_name: Disable Server Banner
  rule_description: 'The server banner must be disabled to prevent disclosure of

    server version information in HTTP response headers.

    '
  category: Information Disclosure
  subcategory: Server Identification
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: '1. Check for server banner in HTTP responses

      2. Check server.xml for xpoweredBy and server attributes

      '
    check_command: 'curl -I http://localhost:8080 2>/dev/null | grep -i "server"

      grep -i "xpoweredBy\|server=" /opt/jws-5/tomcat/conf/server.xml

      '
  remediation:
    remediation_step: "1. Disable xpoweredBy in server.xml connectors:\n   <Connector\
      \ ... xpoweredBy=\"false\" server=\" \" />\n2. Set empty server attribute to\
      \ remove header\n3. Configure in valve:\n   <Valve className=\"org.apache.catalina.valves.ErrorReportValve\"\
      \n          showServerInfo=\"false\" />\n"
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: 'Server version information helps attackers identify known

      vulnerabilities for that specific version.

      '
    false_positive_risk: Low
  tags:
