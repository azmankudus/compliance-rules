    reference: Performance Tuning Guide - JVM Settings
- rule_id: RHJWS5-017
  rule_name: Configure Thread Limits
  rule_description: 'Thread limits must be configured to prevent resource exhaustion

    from excessive concurrent connections.

    '
  category: Resource Management
  subcategory: Thread Configuration
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: '1. Check connector thread settings in server.xml

      2. Verify maxThreads, minSpareThreads are configured

      '
    check_command: 'grep -i "maxThreads\|minSpareThreads\|acceptCount" /opt/jws-5/tomcat/conf/server.xml

      '
  remediation:
    remediation_step: "1. Configure thread limits in server.xml:\n   <Connector port=\"\
      8080\" protocol=\"HTTP/1.1\"\n              maxThreads=\"200\"\n           \
      \   minSpareThreads=\"25\"\n              maxSpareThreads=\"75\"\n         \
      \     acceptCount=\"100\"\n              connectionTimeout=\"20000\" />\n2.\
      \ Configure executor for shared thread pools:\n   <Executor name=\"tomcatThreadPool\"\
      \ namePrefix=\"tomcat-http-\"\n             maxThreads=\"200\" minSpareThreads=\"\
      25\"/>\n"
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 10 minutes
  context:
    rationale: 'Proper thread limits prevent resource exhaustion and ensure

      predictable performance under load.

      '
    false_positive_risk: Low
  tags:
  - resource-management
  - threads
  - performance
