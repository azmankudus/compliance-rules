- rule_id: RHJWS5-016
  rule_name: Configure Memory Limits
  rule_description: 'JVM memory limits must be configured appropriately to prevent

    out-of-memory conditions and potential denial of service.

    '
  category: Resource Management
  subcategory: JVM Configuration
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: '1. Check JVM memory settings in setenv.sh

      2. Verify Xms and Xmx are configured

      3. Verify memory limits are appropriate for system resources

      '
    check_command: 'grep -i "Xmx\|Xms\|MaxMetaspaceSize" /opt/jws-5/tomcat/bin/setenv.sh
      2>/dev/null

      grep -i "JAVA_OPTS\|JAVA_MEM" /etc/systemd/system/jws5-tomcat.service

      '
  remediation:
    remediation_step: "1. Configure JVM memory in setenv.sh:\n   JAVA_OPTS=\"-Xms512m\
      \ -Xmx2048m -XX:MaxMetaspaceSize=256m\"\n   JAVA_OPTS=\"$JAVA_OPTS -XX:+UseG1GC\"\
      \n2. Consider system memory limits in systemd:\n   [Service]\n   MemoryMax=3G\n\
      \   MemoryHigh=2.5G\n"
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 10 minutes
  context:
    rationale: 'Properly configured memory limits prevent out-of-memory errors

      and ensure stable server operation.

      '
    false_positive_risk: Low
