- rule_id: STIG-V206368
  legacy_ids:
  - V-206368
  - SV-206368r961632_rule
  rule_name: Log Files Access Restricted
  rule_description: 'Web server log files must only be accessible by privileged users.

    Log data is essential for forensic analysis and must be protected.

    '
  category: Logging and Auditing
  subcategory: Log File Protection
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: '1. Check log directory permissions

      2. Verify only privileged users have access

      '
    check_command: 'ls -ld /opt/jws-5/tomcat/logs/

      stat -c "%a %U:%G" /opt/jws-5/tomcat/logs/

      '
  remediation:
    remediation_step: "1. Set restrictive permissions on log directory:\n   chmod\
      \ 750 /opt/jws-5/tomcat/logs/\n   chown tomcat:tomcat /opt/jws-5/tomcat/logs/\n\
      2. Set restrictive permissions on log files:\n   chmod 640 /opt/jws-5/tomcat/logs/*\n"
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 2 minutes
  context:
    rationale: 'If log data is compromised, forensic analysis becomes impossible and

      attackers can cover their tracks.

      '
    false_positive_risk: Low
  tags:
  - logging
  - file-permissions
  - cat2
