  rule_name: Change Default Passwords
  rule_description: 'All accounts installed with the web server software and tools
    must have

    passwords assigned and default passwords changed.

    '
  category: Authentication
  subcategory: Password Management
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: '1. Check tomcat-users.xml for default users

      2. Verify no default passwords exist

      3. Check for common default accounts

      '
    check_command: 'cat /opt/jws-5/tomcat/conf/tomcat-users.xml | grep -i "password"

      '
  remediation:
    remediation_step: "1. Remove or change default users in tomcat-users.xml:\n  \
      \ - Remove \"tomcat\" user if it exists with default password\n   - Change all\
      \ default passwords\n2. Use strong, unique passwords for all accounts\n3. Consider\
      \ using LDAP/AD integration instead of local users\n"
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 10 minutes
  context:
    rationale: 'Default credentials are widely known and allow unauthorized access

      to web server management interfaces.

      '
    false_positive_risk: Low
