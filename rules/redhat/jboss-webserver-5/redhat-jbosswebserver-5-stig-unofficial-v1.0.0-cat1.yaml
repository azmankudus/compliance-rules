- rule_id: STIG-V206431
  legacy_ids:
  - V-206431
  - SV-206431r961632_rule
  rule_name: Encrypt User Identifiers and Passwords
  rule_description: 'The web server must encrypt user identifiers and passwords when
    stored

    or when written to digital media.

    '
  category: Authentication
  subcategory: Credential Protection
  assessment:
    severity: High
    is_auto: true
    automation_level: Partial
    audit_type: config
    detection_step: '1. Check tomcat-users.xml for password storage format

      2. Verify passwords are hashed, not plaintext

      3. Review realm configuration for credential handling

      '
    check_command: 'grep -i "password" /opt/jws-5/tomcat/conf/tomcat-users.xml

      grep -i "digest\|credentialHandler" /opt/jws-5/tomcat/conf/server.xml

      '
  remediation:
    remediation_step: "1. Configure digest authentication or use MessageDigestCredentialHandler:\n\
      \   <Realm className=\"org.apache.catalina.realm.LockOutRealm\">\n     <Realm\
      \ className=\"org.apache.catalina.realm.UserDatabaseRealm\"\n            resourceName=\"\
      UserDatabase\">\n       <CredentialHandler className=\"org.apache.catalina.realm.MessageDigestCredentialHandler\"\
      \n                          algorithm=\"SHA-256\" />\n     </Realm>\n   </Realm>\n\
      2. Store passwords as hashes in tomcat-users.xml\n3. Use SCRIPT or SSHA password\
      \ formats\n"
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 15 minutes
  context:
    rationale: 'Plaintext password storage allows attackers who gain access to configuration

      files to immediately use stolen credentials.

      '
    false_positive_risk: Low
  tags:
  - authentication
  - password-encryption
  - credentials
  - cat1
