- rule_id: STIG-V206396
  legacy_ids:
  - V-206396
  - SV-206396r961632_rule
  rule_name: Invalidate Session on Logout
  rule_description: 'The web server must invalidate session identifiers upon hosted
    application

    user logout or other session termination.

    '
  category: Session Management
  subcategory: Session Termination
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Partial
    audit_type: config
    detection_step: '1. Check session configuration in web.xml

      2. Verify session timeout settings

      '
    check_command: 'grep -A5 "session-config" /opt/jws-5/tomcat/conf/web.xml

      '
  remediation:
    remediation_step: "1. Configure session timeout in web.xml:\n   <session-config>\n\
      \     <session-timeout>30</session-timeout>\n   </session-config>\n2. Ensure\
      \ applications call session.invalidate() on logout\n3. Configure session manager\
      \ to expire sessions:\n   <Manager className=\"org.apache.catalina.session.StandardManager\"\
      \n            maxInactiveInterval=\"1800\" />\n"
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: 'Failure to invalidate sessions allows session hijacking through reuse

      of session identifiers after logout.

      '
    false_positive_risk: Low
  tags:
  - session-management
  - logout
  - session-invalidation
