- rule_id: STIG-V206377
  legacy_ids:
  - V-206377
  - SV-206377r961632_rule
  rule_name: Remove Documentation and Samples
  rule_description: 'The web server must provide install options to exclude the installation

    of documentation, sample code, example applications, and tutorials.

    '
  category: Configuration
  subcategory: Application Cleanup
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: '1. Check for documentation and sample applications

      2. Verify examples, docs directories do not exist

      '
    check_command: 'ls -la /opt/jws-5/tomcat/webapps/ | grep -E "examples|docs|ROOT"

      '
  remediation:
    remediation_step: "1. Remove example applications:\n   rm -rf /opt/jws-5/tomcat/webapps/examples\n\
      2. Remove documentation:\n   rm -rf /opt/jws-5/tomcat/webapps/docs\n3. Replace\
      \ or remove default ROOT application\n"
    rollback_supported: false
    reboot_required: false
    service_impact: None
    estimated_time: 2 minutes
  context:
    rationale: 'Sample code and documentation may contain vulnerabilities and reveal

      server configuration to attackers.

      '
    false_positive_risk: Low
  tags:
  - application-cleanup
  - documentation
  - examples
  - cat2
