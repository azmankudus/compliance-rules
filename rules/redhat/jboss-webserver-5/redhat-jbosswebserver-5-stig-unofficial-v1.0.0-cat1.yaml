  rule_name: Session Absolute Timeout
  rule_description: 'The web server must set an absolute session timeout value of
    eight hours

    or less to limit the window of opportunity for session hijacking.

    '
  category: Session Management
  subcategory: Session Timeout
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: '1. Check session-timeout in web.xml

      2. Verify timeout is 480 minutes (8 hours) or less

      '
    check_command: 'grep -A3 "session-config" /opt/jws-5/tomcat/conf/web.xml | grep
      "session-timeout"

      '
  remediation:
    remediation_step: "1. Set session timeout to 480 minutes or less in web.xml:\n\
      \   <session-config>\n     <session-timeout>480</session-timeout>\n   </session-config>\n\
      2. For manager application, set in context.xml:\n   <Manager className=\"org.apache.catalina.session.StandardManager\"\
      \n            maxInactiveInterval=\"28800\" />\n"
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 2 minutes
  context:
    rationale: 'Long-running sessions increase the window of opportunity for session

      hijacking attacks.

      '
    false_positive_risk: Low
  tags:
  - session-management
  - timeout
  - cat2
