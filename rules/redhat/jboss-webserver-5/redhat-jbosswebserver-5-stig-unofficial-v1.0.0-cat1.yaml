    automation_level: Partial
    audit_type: runtime
    detection_step: '1. Check current JBoss Web Server version

      2. Compare with latest available version

      3. Review CVE databases for known vulnerabilities

      '
    check_command: '/opt/jws-5/tomcat/bin/version.sh

