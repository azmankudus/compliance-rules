  rule_name: Cookie Security Settings
  rule_description: 'Cookies exchanged between the web server and client must have
    security

    settings that disallow cookie access outside the originating web server.

    '
  category: Session Management
  subcategory: Cookie Security
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: '1. Check cookie-config in web.xml

      2. Verify secure and http-only flags are set

      '
    check_command: 'grep -A10 "cookie-config" /opt/jws-5/tomcat/conf/web.xml

      '
  remediation:
    remediation_step: "1. Configure secure cookies in web.xml:\n   <session-config>\n\
      \     <cookie-config>\n       <secure>true</secure>\n       <http-only>true</http-only>\n\
      \     </cookie-config>\n   </session-config>\n2. Add SameSite attribute in context.xml:\n\
      \   <CookieProcessor className=\"org.apache.tomcat.util.http.Rfc6265CookieProcessor\"\
      \n                    sameSiteCookies=\"strict\" />\n"
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: 'Secure cookie settings prevent session hijacking through cookie theft

      or cross-site scripting attacks.

      '
    false_positive_risk: Low
  tags:
  - session-management
  - cookies
  - security-flags
