  rule_name: Session Inactive Timeout
  rule_description: 'The web server must set an inactive timeout for sessions to prevent

    indefinite session lifetime.

    '
  category: Session Management
  subcategory: Session Timeout
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: '1. Check session timeout configuration

      2. Verify maxInactiveInterval is set

      '
    check_command: 'grep -A3 "session-config" /opt/jws-5/tomcat/conf/web.xml

      grep -i "maxInactiveInterval" /opt/jws-5/tomcat/conf/context.xml

      '
  remediation:
    remediation_step: "1. Configure inactive timeout in web.xml:\n   <session-config>\n\
      \     <session-timeout>30</session-timeout>\n   </session-config>\n2. Configure\
      \ in context.xml:\n   <Manager className=\"org.apache.catalina.session.StandardManager\"\
      \n            maxInactiveInterval=\"1800\" />\n"
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 2 minutes
  context:
    rationale: 'Inactive sessions that never expire waste resources and can be hijacked

      if session IDs are compromised.

      '
    false_positive_risk: Low
