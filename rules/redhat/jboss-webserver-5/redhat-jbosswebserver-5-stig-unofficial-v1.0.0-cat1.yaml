- rule_id: STIG-V206440
  legacy_ids:
  - V-206440
  - SV-206440r961632_rule
  rule_name: Remove Export Ciphers
  rule_description: 'The web server must remove all export ciphers to protect the

    confidentiality and integrity of transmitted information.

    '
  category: Encryption
  subcategory: Cipher Configuration
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: '1. Check cipher configuration in server.xml

      2. Verify no export-grade ciphers are enabled

      '
    check_command: 'grep -i "ciphers" /opt/jws-5/tomcat/conf/server.xml

      '
  remediation:
    remediation_step: "1. Configure strong ciphers only in server.xml:\n   <Connector\
      \ port=\"8443\" ...\n              ciphers=\"TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,\n\
      \                       TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,\n         \
      \              TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,\n                    \
      \   TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256\" />\n2. Avoid ciphers with EXPORT\
      \ in the name\n"
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: 'Export-grade ciphers use weak key lengths that can be broken by

      attackers to decrypt traffic.

      '
    false_positive_risk: Low
  tags:
  - encryption
  - ciphers
  - export-grade
