- rule_id: STIG-V206356
  legacy_ids:
  - V-206356
  - SV-206356r961632_rule
  rule_name: Generate Log Records for Key Events
  rule_description: 'The web server must generate, at a minimum, log records for system
    startup

    and shutdown, system access, and system authentication events.

    '
  category: Logging and Auditing
  subcategory: Event Logging
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: '1. Check AccessLogValve configuration

      2. Verify logging for authentication events

      3. Check catalina.out logging configuration

      '
    check_command: 'grep -i "AccessLogValve" /opt/jws-5/tomcat/conf/server.xml

      grep -i "logging" /opt/jws-5/tomcat/conf/logging.properties

      ls -la /opt/jws-5/tomcat/logs/

      '
  remediation:
    remediation_step: "1. Configure AccessLogValve for all hosts:\n   <Valve className=\"\
      org.apache.catalina.valves.AccessLogValve\"\n          directory=\"logs\"\n\
      \          prefix=\"access_log\"\n          suffix=\".txt\"\n          pattern=\"\
      %h %l %u %t &quot;%r&quot; %s %b\" />\n2. Ensure logging.properties captures\
      \ authentication:\n   org.apache.catalina.authenticator.level = FINE\n3. Configure\
      \ logging for server lifecycle events\n"
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 10 minutes
  context:
    rationale: 'Log records are essential for detecting security incidents, performing

      forensic analysis, and meeting compliance requirements.

      '
    false_positive_risk: Low
  tags:
  - logging
  - auditing
  - events
  - cat2
  id: STIG-V206356
