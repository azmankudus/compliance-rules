  rule_name: Minimize Server Information in Errors
  rule_description: 'Warning and error messages displayed to clients must be modified
    to

    minimize the identity of the web server, patches, loaded modules,

    and directory paths.

    '
  category: Information Disclosure
  subcategory: Error Handling
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: '1. Check ErrorReportValve configuration

      2. Verify showServerInfo and showReport are disabled

      '
    check_command: 'grep -i "ErrorReportValve" /opt/jws-5/tomcat/conf/server.xml

      '
  remediation:
    remediation_step: "1. Configure ErrorReportValve to hide server info:\n   <Valve\
      \ className=\"org.apache.catalina.valves.ErrorReportValve\"\n          showServerInfo=\"\
      false\"\n          showReport=\"false\" />\n2. Create custom error pages in\
      \ web.xml:\n   <error-page>\n     <error-code>404</error-code>\n     <location>/error/404.html</location>\n\
      \   </error-page>\n"
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 10 minutes
  context:
    rationale: 'Server version and configuration details help attackers identify

      vulnerabilities specific to that version.

      '
    false_positive_risk: Low
  tags:
  - information-disclosure
  - error-handling
  - server-info
