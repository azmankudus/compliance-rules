- rule_id: STIG-V206399
  legacy_ids:
  - V-206399
  - SV-206399r961632_rule
  rule_name: FIPS-Approved Session ID Generation
  rule_description: 'The web server must generate a unique session identifier for
    each session

    using a FIPS 140-2 approved random number generator.

    '
  category: Session Management
  subcategory: Session ID Generation
  assessment:
    severity: High
    is_auto: true
    automation_level: Partial
    audit_type: config
    detection_step: '1. Check if FIPS mode is enabled

      2. Verify session ID generation uses secure random

      3. Review session manager configuration

      '
    check_command: 'grep -i "SecureRandom\|randomClass" /opt/jws-5/tomcat/conf/context.xml

      grep -i "fips" /opt/jws-5/tomcat/conf/server.xml

      cat /proc/sys/crypto/fips_enabled 2>/dev/null

      '
  remediation:
    remediation_step: "1. Configure session manager to use secure random:\n   <Manager\
      \ className=\"org.apache.catalina.session.PersistentManager\"\n            randomClass=\"\
      java.security.SecureRandom\" />\n2. Enable FIPS mode if required:\n   Add to\
      \ JAVA_OPTS: -Djava.security.properties=/path/to/fips.properties\n3. For system-level\
      \ FIPS, enable in OS:\n   fips-mode-setup --enable\n"
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 10 minutes
  context:
    rationale: 'Predictable session IDs can be guessed by attackers to hijack user
      sessions.

      FIPS-approved random number generation ensures cryptographic strength.

      '
    false_positive_risk: Low
  tags:
  - session-management
  - fips
  - random-generation
  - cat1
  id: STIG-V206399
