  - type: DISA STIG
    reference: Web Server SRG V4R4 - V-206356
- rule_id: STIG-V206359
  legacy_ids:
  - V-206359
  - SV-206359r961632_rule
  rule_name: Log Record Content - Event Type
  rule_description: 'The web server must produce log records containing sufficient
    information

    to establish what type of events occurred.

    '
  category: Logging and Auditing
  subcategory: Log Content
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: '1. Check AccessLogValve pattern configuration

      2. Verify log pattern includes request method and URI

      '
    check_command: 'grep -i "pattern" /opt/jws-5/tomcat/conf/server.xml | grep -i
      "AccessLogValve"

      '
  remediation:
    remediation_step: "1. Configure comprehensive log pattern:\n   <Valve className=\"\
      org.apache.catalina.valves.AccessLogValve\"\n          pattern=\"%h %l %u %t\
      \ &quot;%r&quot; %s %b &quot;%{Referer}i&quot; &quot;%{User-Agent}i&quot;\"\
      \ />\n2. The pattern should include:\n   - %h: Remote host\n   - %l: Remote\
      \ logname\n   - %u: Remote user\n   - %t: Time\n   - %r: Request line (method,\
      \ URI, protocol)\n   - %s: HTTP status code\n   - %b: Bytes sent\n"
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: 'Without sufficient log information, it''s impossible to determine
      what

      actions occurred during a security incident.

      '
    false_positive_risk: Low
  tags:
  - logging
  - log-content
  - cat2
  id: STIG-V206359
