- rule_id: STIG-V206364
  legacy_ids:
  - V-206364
  - SV-206364r961632_rule
  rule_name: Log Record Content - Event Outcome
  rule_description: 'The web server must produce log records that contain sufficient
    information

    to establish the outcome (success or failure) of events.

    '
  category: Logging and Auditing
  subcategory: Log Content
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: '1. Check AccessLogValve pattern for status code (%s)

      2. Verify HTTP status codes are being logged

      '
    check_command: 'grep -i "pattern" /opt/jws-5/tomcat/conf/server.xml | grep "%s"

      '
  remediation:
    remediation_step: "1. Ensure log pattern includes HTTP status code (%s):\n   <Valve\
      \ className=\"org.apache.catalina.valves.AccessLogValve\"\n          pattern=\"\
      %h %l %u %t &quot;%r&quot; %s %b\" />\n2. Status codes indicate success (2xx,\
      \ 3xx) or failure (4xx, 5xx)\n"
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: 'Knowing whether actions succeeded or failed is essential for security

      analysis and detecting attack attempts.

      '
    false_positive_risk: Low
  tags:
  - logging
  - event-outcome
  - cat2
