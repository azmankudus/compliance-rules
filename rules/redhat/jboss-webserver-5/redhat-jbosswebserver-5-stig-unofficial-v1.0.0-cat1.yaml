- rule_id: STIG-V206383
  legacy_ids:
  - V-206383
  - SV-206383r961632_rule
  rule_name: Disable WebDAV
  rule_description: 'The web server must have Web Distributed Authoring (WebDAV) disabled.

    WebDAV provides file management capabilities that can be exploited.

    '
  category: Configuration
  subcategory: Feature Hardening
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: '1. Check if WebDAV servlet is enabled in web.xml

      2. Verify WebDAV functionality is disabled

      '
    check_command: 'grep -i "webdav" /opt/jws-5/tomcat/conf/web.xml

      grep -i "dav" /opt/jws-5/tomcat/conf/server.xml

      '
  remediation:
    remediation_step: "1. Comment out or remove WebDAV servlet in web.xml:\n   <!--\n\
      \   <servlet>\n     <servlet-name>webdav</servlet-name>\n     ...\n   </servlet>\n\
      \   -->\n2. Tomcat does not enable WebDAV by default in recent versions\n"
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: 'WebDAV allows remote file manipulation and can be exploited to upload

      malicious content or modify existing files.

      '
    false_positive_risk: Low
  tags:
  - webdav
  - feature-hardening
  - cat2
