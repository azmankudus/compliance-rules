    '
  severity: Medium
  references:
  - type: DISA STIG
    reference: Web Server SRG V4R4 - V-206360
- rule_id: STIG-V206362
  legacy_ids:
  - V-206362
  - SV-206362r961632_rule
  rule_name: Log Record Content - Source of Events
  rule_description: 'The web server must produce log records containing sufficient
    information

    to establish the source of events.

    '
  category: Logging and Auditing
  subcategory: Log Content
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: '1. Check AccessLogValve pattern for source IP (%h or %a)

      2. Verify client IP is being logged

      '
    check_command: 'grep -i "pattern" /opt/jws-5/tomcat/conf/server.xml | grep -E
      "%h|%a"

      '
  remediation:
    remediation_step: "1. Ensure log pattern includes source IP (%h or %a):\n   <Valve\
      \ className=\"org.apache.catalina.valves.AccessLogValve\"\n          pattern=\"\
      %h %l %u %t &quot;%r&quot; %s %b\" />\n2. If behind load balancer, use RemoteIpValve:\n\
      \   <Valve className=\"org.apache.catalina.valves.RemoteIpValve\" />\n"
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: 'Source IP information is critical for identifying attackers and

      implementing IP-based access controls.

      '
    false_positive_risk: Low
  tags:
  - logging
  - source-ip
  - cat2
  id: STIG-V206362
  title: Log Record Content - Source of Events
