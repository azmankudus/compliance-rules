rules:
- rule_id: STIG-V206434
  legacy_ids:
  - V-206434
  - SV-206434r961632_rule
  - SRG-APP-000439-WSR-000151
  rule_name: Enable TLS for Data Transmission
  rule_description: 'The web server must employ cryptographic mechanisms (TLS/DTLS/SSL)

    preventing the unauthorized disclosure of information during transmission.

    This is usually achieved through the use of Transport Layer Security (TLS).

    '
  category: Encryption
  subcategory: Transmission Security
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: '1. Review the JBoss Web Server configuration

      2. Verify all connectors handling sensitive data use TLS

      3. Check that HTTP connectors redirect to HTTPS

      '
    check_command: 'grep -i "SSLEnabled\|scheme\|secure" /opt/jws-5/tomcat/conf/server.xml

      grep -i "redirectPort" /opt/jws-5/tomcat/conf/server.xml

      '
  remediation:
    remediation_step: "1. Configure HTTPS connector with SSL enabled:\n   <Connector\
      \ port=\"8443\" protocol=\"HTTP/1.1\"\n              SSLEnabled=\"true\" scheme=\"\
      https\" secure=\"true\"\n              sslEnabledProtocols=\"TLSv1.2,TLSv1.3\"\
      \n              keystoreFile=\"/path/to/keystore\"\n              keystorePass=\"\
      password\" />\n2. Configure HTTP connector to redirect to HTTPS:\n   <Connector\
      \ port=\"8080\" protocol=\"HTTP/1.1\"\n              redirectPort=\"8443\" />\n\
      3. Configure web.xml for SSL enforcement:\n   <security-constraint>\n     <web-resource-collection>\n\
      \       <url-pattern>/*</url-pattern>\n     </web-resource-collection>\n   \
      \  <user-data-constraint>\n       <transport-guarantee>CONFIDENTIAL</transport-guarantee>\n\
      \     </user-data-constraint>\n   </security-constraint>\n"
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 15 minutes
  context:
    rationale: 'Transmission of data without encryption exposes sensitive information

      including user credentials and session data to interception.

      '
    impact: 'Without TLS encryption, data in transit can be intercepted and read

      by unauthorized parties.

      '
    false_positive_risk: Low
  tags:
  - encryption
  - tls
  - transmission
  - cat1
