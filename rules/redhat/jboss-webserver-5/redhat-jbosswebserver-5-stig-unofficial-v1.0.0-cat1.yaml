  rule_name: Disable Debugging and Tracing
  rule_description: 'Debugging and trace information used to diagnose the web server
    must

    be disabled. This information can reveal sensitive configuration details.

    '
  category: Information Disclosure
  subcategory: Debug Configuration
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: '1. Check for debug settings in web.xml

      2. Verify development mode is disabled

      3. Check logging level configuration

      '
    check_command: 'grep -i "debug" /opt/jws-5/tomcat/conf/web.xml

      grep -i "development" /opt/jws-5/tomcat/conf/web.xml

      grep -i "level" /opt/jws-5/tomcat/conf/logging.properties

      '
  remediation:
    remediation_step: "1. Disable JSP development mode in web.xml:\n   <init-param>\n\
      \     <param-name>development</param-name>\n     <param-value>false</param-value>\n\
      \   </init-param>\n2. Set appropriate log levels:\n   .level = WARNING\n   org.apache.catalina.level\
      \ = WARNING\n3. Disable debug output in servlets\n"
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: 'Debug information can expose internal application structure, database

      queries, and other sensitive information to attackers.

      '
    false_positive_risk: Low
  tags:
  - information-disclosure
  - debugging
  - tracing
