- rule_id: STIG-V206439
  legacy_ids:
  - V-206439
  - SV-206439r961632_rule
  rule_name: Use Approved TLS Version
  rule_description: 'A web server must maintain the confidentiality of controlled
    information

    during transmission through the use of an approved TLS version (TLS 1.2

    or higher).

    '
  category: Encryption
  subcategory: TLS Version
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: '1. Check SSL connector configuration for TLS version

      2. Verify SSLv3, TLSv1.0, TLSv1.1 are disabled

      '
    check_command: 'grep -i "sslEnabledProtocols\|sslProtocol" /opt/jws-5/tomcat/conf/server.xml

      '
  remediation:
    remediation_step: "1. Configure TLS 1.2+ only in server.xml:\n   <Connector port=\"\
      8443\" protocol=\"HTTP/1.1\" SSLEnabled=\"true\"\n              sslEnabledProtocols=\"\
      TLSv1.2,TLSv1.3\" />\n2. Remove or disable older protocol versions\n"
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: 'TLS 1.0 and 1.1 have known vulnerabilities. Only TLS 1.2+ should be

      used for protecting sensitive data in transit.

      '
    false_positive_risk: Low
  tags:
  - encryption
  - tls
  - protocol-version
  - cat1
