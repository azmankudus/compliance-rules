    '
  severity: Medium
  references:
  - type: DISA STIG
    reference: Web Server SRG V4R4 - V-206359
- rule_id: STIG-V206360
  legacy_ids:
  - V-206360
  - SV-206360r961632_rule
  rule_name: Log Record Content - Timestamps
  rule_description: 'The web server must produce log records containing sufficient
    information

    to establish when (date and time) events occurred.

    '
  category: Logging and Auditing
  subcategory: Log Content
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: '1. Check AccessLogValve pattern for timestamp (%t)

      2. Verify logging.properties timestamp format

      '
    check_command: 'grep -i "pattern" /opt/jws-5/tomcat/conf/server.xml | grep "%t"

      '
  remediation:
    remediation_step: "1. Ensure log pattern includes timestamp (%t):\n   <Valve className=\"\
      org.apache.catalina.valves.AccessLogValve\"\n          pattern=\"%h %l %u %t\
      \ &quot;%r&quot; %s %b\" />\n2. Configure consistent timestamp format in logging.properties:\n\
      \   java.util.logging.SimpleFormatter.format=%1$tY-%1$tm-%1$td %1$tH:%1$tM:%1$tS\
      \ %4$-6s %2$s %5$s%6$s%n\n"
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: 'Timestamps are essential for correlating events across systems and

      establishing a timeline during incident investigation.

      '
    false_positive_risk: Low
  tags:
  - logging
  - timestamps
  - cat2
  id: STIG-V206360
  title: Log Record Content - Timestamps
  description: 'The web server must produce log records containing sufficient information

