- rule_id: STIG-V206375
  legacy_ids:
  - V-206375
  - SV-206375r961632_rule
  rule_name: Remove Unnecessary Services
  rule_description: 'The web server must only contain services and functions necessary
    for

    operation. Unnecessary services increase the attack surface.

    '
  category: Configuration
  subcategory: Service Hardening
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: '1. List enabled connectors in server.xml

      2. Check for unnecessary web applications

      3. Review enabled valves and listeners

      '
    check_command: 'grep -i "Connector" /opt/jws-5/tomcat/conf/server.xml

      ls -la /opt/jws-5/tomcat/webapps/

      '
  remediation:
    remediation_step: "1. Remove unnecessary connectors (AJP if not used, etc.)\n\
      2. Remove example and documentation applications:\n   rm -rf /opt/jws-5/tomcat/webapps/examples\n\
      \   rm -rf /opt/jws-5/tomcat/webapps/docs\n3. Disable unused valves and listeners\n"
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 10 minutes
  context:
    rationale: 'Each additional service increases the attack surface and potential

      for exploitation.

      '
    false_positive_risk: Low
  tags:
  - hardening
  - unnecessary-services
  - cat2
