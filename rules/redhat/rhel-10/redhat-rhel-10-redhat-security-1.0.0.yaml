$schema: https://opencode.ai/schemas/hardening-rule-schema.json
$schema_version: 1.0.0
$metadata:
  name: Red Hat Security Hardening Guide for RHEL 10
  version: 1.0.0
  description: Security hardening rules from official Red Hat Enterprise Linux 10 Security Hardening documentation
  platform: Red Hat Enterprise Linux 10
  benchmark: Red Hat Enterprise Linux 10 Security Hardening Guide
  author: Red Hat
  source: https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/10/html/security_hardening
  created: '2026-03-13T00:00:00Z'
  modified: '2026-03-13T00:00:00Z'
  compatible_platforms:
  - RHEL 10.0
  - RHEL 10.1
compliance_info:
  framework: NIST
  version: 1.0.0
  profile: Red Hat Security Hardening
profile:
  name: Red Hat Security Hardening
  description: Comprehensive security hardening based on official Red Hat documentation covering FIPS, cryptographic policies, integrity checking, access control, and intrusion prevention
  level: 1
rules:
- rule_id: RH-FIPS-001
  rule_name: Install system with FIPS mode enabled
  rule_description: To enable cryptographic module self-checks mandated by FIPS 140-3, the system must be installed with FIPS mode enabled. In RHEL 10, switching to FIPS mode after installation is not supported.
  category: Cryptography
  subcategory: FIPS Mode
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: Verify FIPS mode is enabled during system installation
    check_command: cat /proc/sys/crypto/fips_enabled
    expected_value: '1'
  remediation:
    remediation_step: |
      During RHEL installation:
      1. At boot menu, press 'e' (UEFI) or Tab (BIOS)
      2. Add 'fips=1' to kernel command line
      3. For systems with separate /boot partition, also add 'boot=UUID=<uuid-of-boot-disk>'
      4. Continue installation
      Note: FIPS mode cannot be disabled after installation without reinstalling the system.
    rollback_supported: false
    reboot_required: true
    service_impact: System must be reinstalled to change FIPS mode
    estimated_time: 60+ minutes
  context:
    rationale: FIPS 140-3 compliance requires cryptographic module self-checks that can only be properly configured during installation
    impact: Critical - Required for FIPS 140-3 certification
    false_positive_risk: None
  tags:
  - fips
  - cryptography
  - compliance

- rule_id: RH-FIPS-002
  rule_name: Verify FIPS mode status
  rule_description: Verify that the system is running in FIPS mode by checking the FIPS enabled flag and current cryptographic policy.
  category: Cryptography
  subcategory: FIPS Mode
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: Check FIPS mode status
    check_command: cat /proc/sys/crypto/fips_enabled && update-crypto-policies --show
    expected_value: |
      1
      FIPS
  remediation:
    remediation_step: If FIPS mode is not enabled, the system must be reinstalled with FIPS mode enabled during installation.
    rollback_supported: false
    reboot_required: false
    service_impact: None for verification
    estimated_time: 1 minute
  context:
    rationale: Running in FIPS mode ensures all cryptographic operations use FIPS-approved algorithms
    impact: Critical for compliance requirements
    false_positive_risk: None
  tags:
  - fips
  - cryptography
  - verification

- rule_id: RH-CRYPTO-001
  rule_name: Use secure system-wide cryptographic policy
  rule_description: Configure the system-wide cryptographic policy to use secure settings appropriate for your environment. The DEFAULT policy provides secure settings for current threat models.
  category: Cryptography
  subcategory: System-wide Policies
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: Verify the current cryptographic policy setting
    check_command: update-crypto-policies --show
    expected_value: DEFAULT or FUTURE or FIPS
  remediation:
    remediation_step: |
      To set the cryptographic policy:
      1. Run: update-crypto-policies --set DEFAULT
      2. Reboot the system: reboot
      
      Available policies:
      - DEFAULT: Secure settings for current threat models (TLS 1.2+, IKEv2, SSH2, 2048+ bit keys)
      - LEGACY: Maximum compatibility with RHEL 6 and earlier (less secure)
      - FUTURE: Stricter forward-looking security (3072+ bit keys, no SHA-1)
      - FIPS: Conforms with FIPS 140 requirements (only in FIPS mode)
    rollback_supported: true
    reboot_required: true
    service_impact: May affect connectivity with legacy systems
    estimated_time: 10 minutes
  context:
    rationale: System-wide cryptographic policies ensure consistent security across all applications using cryptography
    impact: Medium - Affects all cryptographic operations on the system
    false_positive_risk: Low
  tags:
  - cryptography
  - crypto-policies
  - tls

- rule_id: RH-CRYPTO-002
  rule_name: Avoid LEGACY cryptographic policy in production
  rule_description: The LEGACY cryptographic policy should not be used in production environments as it enables less secure algorithms for compatibility with older systems.
  category: Cryptography
  subcategory: System-wide Policies
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: Verify LEGACY policy is not in use
    check_command: update-crypto-policies --show | grep -v LEGACY
    expected_value: Output should not contain LEGACY
  remediation:
    remediation_step: |
      Switch to a more secure policy:
      update-crypto-policies --set DEFAULT
      reboot
    rollback_supported: true
    reboot_required: true
    service_impact: May break compatibility with legacy systems
    estimated_time: 10 minutes
  context:
    rationale: LEGACY policy enables CBC-mode ciphers and SHA-1 signatures which are less secure
    impact: Medium - Reduced security posture
    false_positive_risk: Low
  tags:
  - cryptography
  - crypto-policies
  - security-baseline

- rule_id: RH-CRYPTO-003
  rule_name: Consider FUTURE cryptographic policy for enhanced security
  rule_description: The FUTURE cryptographic policy provides stricter security settings including 3072+ bit keys and disabled SHA-1, suitable for environments requiring forward-looking security.
  category: Cryptography
  subcategory: System-wide Policies
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: Check if FUTURE policy can be applied
    check_command: update-crypto-policies --show
    expected_value: FUTURE (optional, DEFAULT is acceptable)
  remediation:
    remediation_step: |
      To enable FUTURE policy:
      update-crypto-policies --set FUTURE
      reboot
      
      Note: This may cause interoperability issues with systems using older cryptography.
      Test thoroughly before deploying in production.
    rollback_supported: true
    reboot_required: true
    service_impact: May cause connectivity issues with some systems
    estimated_time: 10 minutes
  context:
    rationale: FUTURE policy prepares for upcoming security requirements and deprecates weaker algorithms
    impact: Low - Enhanced security but potential interoperability issues
    false_positive_risk: Low
  tags:
  - cryptography
  - crypto-policies
  - enhanced-security

- rule_id: RH-CRYPTO-004
  rule_name: Post-quantum cryptography awareness
  rule_description: RHEL 10.1 enables post-quantum cryptography (PQC) algorithms by default in all predefined policy levels to protect against future quantum computing threats.
  category: Cryptography
  subcategory: Post-Quantum
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: Verify post-quantum cryptography support status
    check_command: update-crypto-policies --show
    expected_value: Any policy without NO-PQ suffix
  remediation:
    remediation_step: |
      PQC is enabled by default in RHEL 10.1+. To disable (not recommended):
      update-crypto-policies --set DEFAULT:NO-PQ
      reboot
      
      To re-enable:
      update-crypto-policies --set DEFAULT
      reboot
    rollback_supported: true
    reboot_required: true
    service_impact: Minimal - PQC provides protection against future threats
    estimated_time: 10 minutes
  context:
    rationale: Post-quantum cryptography protects against "harvest now, decrypt later" attacks using future quantum computers
    impact: Low - Future-proofing security
    false_positive_risk: None
  tags:
  - cryptography
  - post-quantum
  - future-security

- rule_id: RH-AIDE-001
  rule_name: Install and configure AIDE for file integrity
  rule_description: Install Advanced Intrusion Detection Environment (AIDE) to create a database of file fingerprints and detect unauthorized changes to system files.
  category: Integrity Checking
  subcategory: File Integrity
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: Verify AIDE is installed and database exists
    check_command: rpm -q aide && test -f /var/lib/aide/aide.db.gz && echo "AIDE configured"
    expected_value: aide package installed and database exists
  remediation:
    remediation_step: |
      1. Install AIDE: dnf install aide
      2. Initialize the database: aide --init
      3. Activate the database: mv /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz
      4. Optionally store database on read-only media for additional security
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 15 minutes
  context:
    rationale: AIDE detects unauthorized file changes that may indicate system compromise
    impact: Medium - Essential for intrusion detection
    false_positive_risk: Medium - Legitimate changes trigger alerts
  tags:
  - integrity
  - aide
  - intrusion-detection

- rule_id: RH-AIDE-002
  rule_name: Schedule regular AIDE integrity checks
  rule_description: Configure automated daily or weekly AIDE integrity checks to detect unauthorized file changes in a timely manner.
  category: Integrity Checking
  subcategory: File Integrity
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: Verify AIDE cron job is configured
    check_command: grep -r aide /etc/cron* /etc/crontab 2>/dev/null || systemctl list-timers | grep aide
    expected_value: AIDE cron job or timer should be configured
  remediation:
    remediation_step: |
      Add to /etc/crontab for daily checks at 4:05 AM:
      echo "05 4 * * * root /usr/sbin/aide --check" >> /etc/crontab
      
      Or create a systemd timer for more flexibility.
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal - Short CPU/disk usage during check
    estimated_time: 5 minutes
  context:
    rationale: Regular checks ensure timely detection of unauthorized changes
    impact: Medium - Essential for continuous monitoring
    false_positive_risk: Medium - Updates trigger expected changes
  tags:
  - integrity
  - aide
  - automation
  - monitoring

- rule_id: RH-AIDE-003
  rule_name: Update AIDE database after legitimate changes
  rule_description: After legitimate system changes such as software updates, update the AIDE database to prevent false positive alerts.
  category: Integrity Checking
  subcategory: File Integrity
  testing_status: untested
  assessment:
    severity: Low
    is_auto: false
    automation_level: Manual
    audit_type: process
    detection_step: Verify process for updating AIDE database exists
    check_command: Manual process verification
    expected_value: Documented procedure for updating AIDE after changes
  remediation:
    remediation_step: |
      After legitimate system changes:
      1. Run: aide --update
      2. Activate new database: mv /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz
      3. Optionally store updated database on secure/read-only media
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 10 minutes
  context:
    rationale: Updating the database after legitimate changes prevents alert fatigue from false positives
    impact: Low - Maintenance task
    false_positive_risk: None
  tags:
  - integrity
  - aide
  - maintenance

- rule_id: RH-SUDO-001
  rule_name: Configure sudo access with principle of least privilege
  rule_description: Grant sudo access following the principle of least privilege, providing users only the specific commands they need rather than full root access.
  category: Access Control
  subcategory: Sudo Configuration
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Partial
    audit_type: config
    detection_step: Review sudoers configuration for overly permissive rules
    check_command: grep -r 'ALL=(ALL)' /etc/sudoers /etc/sudoers.d/ 2>/dev/null | grep -v '^#'
    expected_value: Minimal use of full root access grants
  remediation:
    remediation_step: |
      Edit sudoers with visudo:
      visudo
      
      Replace broad permissions with specific command grants:
      # Instead of:
      username ALL=(ALL) ALL
      
      # Use:
      username ALL=(root) /usr/bin/systemctl restart httpd, /usr/bin/systemctl status httpd
    rollback_supported: true
    reboot_required: false
    service_impact: May affect user workflows
    estimated_time: 30 minutes
  context:
    rationale: Limiting sudo access reduces the risk of accidental or malicious system changes
    impact: High - Critical for access control
    false_positive_risk: Low
  tags:
  - access-control
  - sudo
  - least-privilege

- rule_id: RH-SUDO-002
  rule_name: Use sudoers.d directory for custom sudo rules
  rule_description: Place custom sudo rules in /etc/sudoers.d/ directory rather than modifying the main sudoers file for better organization and easier management.
  category: Access Control
  subcategory: Sudo Configuration
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: Check if sudoers.d directory is being used
    check_command: ls -la /etc/sudoers.d/
    expected_value: Custom rules should be in /etc/sudoers.d/ directory
  remediation:
    remediation_step: |
      Create custom sudo rules in /etc/sudoers.d/:
      1. Create file: visudo -f /etc/sudoers.d/custom-rules
      2. Add rules following sudoers syntax
      3. Ensure file permissions are 0440
      4. Verify syntax: visudo -c
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 10 minutes
  context:
    rationale: Using sudoers.d improves organization and reduces risk of breaking the main sudoers file
    impact: Low - Best practice for management
    false_positive_risk: None
  tags:
  - access-control
  - sudo
  - configuration

- rule_id: RH-FAPOLICYD-001
  rule_name: Deploy fapolicyd for application control
  rule_description: Install and enable fapolicyd to control which applications can be executed, preventing users from running untrusted or unauthorized code.
  category: Application Control
  subcategory: Execution Control
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: Verify fapolicyd is installed and running
    check_command: rpm -q fapolicyd && systemctl is-active fapolicyd
    expected_value: fapolicyd package installed and service active
  remediation:
    remediation_step: |
      1. Install fapolicyd: dnf install fapolicyd
      2. Enable and start the service: systemctl enable --now fapolicyd
      3. Verify status: systemctl status fapolicyd
    rollback_supported: true
    reboot_required: false
    service_impact: May block execution of untrusted applications
    estimated_time: 15 minutes
  context:
    rationale: fapolicyd prevents execution of unauthorized applications, reducing attack surface
    impact: Medium - Significant security improvement
    false_positive_risk: Medium - May block legitimate custom applications
  tags:
  - application-control
  - fapolicyd
  - execution-prevention

- rule_id: RH-FAPOLICYD-002
  rule_name: Configure fapolicyd trust sources
  rule_description: Configure fapolicyd trust sources to properly identify trusted applications from RPM database, file lists, and custom sources.
  category: Application Control
  subcategory: Execution Control
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Partial
    audit_type: config
    detection_step: Verify fapolicyd trust configuration
    check_command: grep -E '^trust' /etc/fapolicyd/fapolicyd.conf
    expected_value: Trust sources should be properly configured
  remediation:
    remediation_step: |
      Configure trust sources in /etc/fapolicyd/fapolicyd.conf:
      trust = rpmdb,file
      
      For custom trusted files, add paths to /etc/fapolicyd/fapolicyd.trust
      or use /etc/fapolicyd/trust.d/ directory.
    rollback_supported: true
    reboot_required: false
    service_impact: May affect application execution
    estimated_time: 20 minutes
  context:
    rationale: Proper trust configuration ensures legitimate applications can run while blocking unauthorized ones
    impact: Medium - Critical for proper operation
    false_positive_risk: Medium
  tags:
  - application-control
  - fapolicyd
  - trust-configuration

- rule_id: RH-FAPOLICYD-003
  rule_name: Enable fapolicyd integrity checking
  rule_description: Enable integrity checking in fapolicyd to verify that trusted files have not been modified since being added to the trust database.
  category: Application Control
  subcategory: Execution Control
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: Verify fapolicyd integrity checking is enabled
    check_command: grep -E '^integrity' /etc/fapolicyd/fapolicyd.conf
    expected_value: integrity = sha256 (or higher)
  remediation:
    remediation_step: |
      Edit /etc/fapolicyd/fapolicyd.conf:
      integrity = sha256
      
      Options: none, size, sha256, ima (for IMA integration)
      Restart service: systemctl restart fapolicyd
    rollback_supported: true
    reboot_required: false
    service_impact: Slight performance impact during file access
    estimated_time: 10 minutes
  context:
    rationale: Integrity checking ensures trusted files haven't been tampered with
    impact: Medium - Enhanced security
    false_positive_risk: Low
  tags:
  - application-control
  - fapolicyd
  - integrity

- rule_id: RH-USBGUARD-001
  rule_name: Install and configure USBGuard
  rule_description: Install USBGuard to protect against intrusive USB devices by enforcing policies that control which USB devices can connect to the system.
  category: Device Control
  subcategory: USB Protection
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: Verify USBGuard is installed and running
    check_command: rpm -q usbguard && systemctl is-active usbguard
    expected_value: usbguard package installed and service active
  remediation:
    remediation_step: |
      1. Install USBGuard: dnf install usbguard
      2. Generate initial policy: usbguard generate-policy > /etc/usbguard/rules.conf
      3. Set proper permissions: chmod 600 /etc/usbguard/rules.conf
      4. Enable and start: systemctl enable --now usbguard
      5. Review and customize rules as needed
    rollback_supported: true
    reboot_required: false
    service_impact: May block unrecognized USB devices
    estimated_time: 20 minutes
  context:
    rationale: USBGuard prevents unauthorized USB devices from accessing the system, protecting against data exfiltration and malware introduction
    impact: Medium - Important for physical security
    false_positive_risk: Medium - May block legitimate devices
  tags:
  - device-control
  - usbguard
  - physical-security

- rule_id: RH-USBGUARD-002
  rule_name: Create USB device allowlist policy
  rule_description: Create and maintain an allowlist of authorized USB devices in USBGuard to ensure only approved devices can connect.
  category: Device Control
  subcategory: USB Protection
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Partial
    audit_type: config
    detection_step: Verify USBGuard rules file has authorized devices
    check_command: cat /etc/usbguard/rules.conf | grep -v '^#' | head -5
    expected_value: Rules should contain authorized device entries
  remediation:
    remediation_step: |
      To authorize a USB device:
      1. List devices: usbguard list-devices
      2. Allow a device permanently: usbguard allow-device -p <ID>
      3. Or edit rules.conf directly with device rules
      
      Rule format: allow id <vid>:<pid> [serial "<serial>"] [name "<name>"] [hash "<hash>"]
    rollback_supported: true
    reboot_required: false
    service_impact: Unauthorized devices will be blocked
    estimated_time: 15 minutes
  context:
    rationale: An allowlist ensures only known, authorized USB devices can connect
    impact: Medium - Critical for USB security
    false_positive_risk: Medium
  tags:
  - device-control
  - usbguard
  - allowlist

- rule_id: RH-USBGUARD-003
  rule_name: Configure USBGuard audit logging
  rule_description: Configure USBGuard to log authorization events to the Linux Audit system for security monitoring and forensics.
  category: Device Control
  subcategory: USB Protection
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: Verify USBGuard audit logging is enabled
    check_command: grep -E 'AuditBackend' /etc/usbguard/usbguard-daemon.conf
    expected_value: AuditBackend = FileAudit or LinuxAudit
  remediation:
    remediation_step: |
      Edit /etc/usbguard/usbguard-daemon.conf:
      AuditBackend = LinuxAudit
      
      Restart service: systemctl restart usbguard
      
      View audit logs: ausearch -ts recent -m USBGUARD
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal logging overhead
    estimated_time: 10 minutes
  context:
    rationale: Audit logging provides visibility into USB device authorization events for security monitoring
    impact: Low - Important for monitoring
    false_positive_risk: None
  tags:
  - device-control
  - usbguard
  - auditing
  - logging

- rule_id: RH-KEYLIME-001
  rule_name: Consider Keylime for system integrity attestation
  rule_description: Deploy Keylime for remote system attestation using TPM to verify system integrity through measured boot and runtime monitoring.
  category: Integrity Checking
  subcategory: System Attestation
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Partial
    audit_type: config
    detection_step: Verify Keylime components if deployed
    check_command: rpm -q keylime 2>/dev/null || echo "Keylime not installed"
    expected_value: Keylime installed (optional, for enhanced security)
  remediation:
    remediation_step: |
      Keylime requires TPM 2.0 hardware. To deploy:
      1. Install: dnf install keylime
      2. Configure verifier, registrar, and tenant in /etc/keylime/
      3. Deploy verifier: systemctl enable --now keylime_verifier
      4. Deploy registrar: systemctl enable --now keylime_registrar
      5. Deploy agent on monitored systems: systemctl enable --now keylime_agent
      6. Configure runtime monitoring with allowlists
    rollback_supported: true
    reboot_required: false
    service_impact: Requires TPM 2.0 hardware
    estimated_time: 60+ minutes
  context:
    rationale: Keylime provides hardware-based remote attestation for verifying system integrity
    impact: Low - Enhanced security for critical systems
    false_positive_risk: Medium - Configuration complexity
  tags:
  - integrity
  - keylime
  - tpm
  - attestation

- rule_id: RH-NBDE-001
  rule_name: Deploy Tang server for NBDE
  rule_description: Deploy a Tang server for Network-Bound Disk Encryption to enable automated unlocking of LUKS-encrypted volumes in networked environments.
  category: Disk Encryption
  subcategory: NBDE
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: Verify Tang server status if deployed
    check_command: systemctl is-active tangd 2>/dev/null || echo "Tang not deployed"
    expected_value: Tang server active (if NBDE is used)
  remediation:
    remediation_step: |
      Deploy Tang server:
      1. Install: dnf install tang
      2. Enable: systemctl enable --now tangd.socket
      3. Show keys for client configuration: tang-show-keys
      4. For SELinux enforcing mode, ensure proper context
    rollback_supported: true
    reboot_required: false
    service_impact: Requires network accessibility for clients
    estimated_time: 15 minutes
  context:
    rationale: Tang server enables automated disk decryption when network is available
    impact: Low - Optional for environments using NBDE
    false_positive_risk: None
  tags:
  - encryption
  - nbde
  - tang
  - disk-encryption

- rule_id: RH-NBDE-002
  rule_name: Configure Clevis client for NBDE
  rule_description: Configure Clevis client to bind LUKS-encrypted volumes to Tang servers for automated unlocking.
  category: Disk Encryption
  subcategory: NBDE
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Partial
    audit_type: config
    detection_step: Verify Clevis binding if NBDE is used
    check_command: clevis luks list -d /dev/<device> 2>/dev/null || echo "No NBDE binding"
    expected_value: Clevis binding configured (if NBDE is used)
  remediation:
    remediation_step: |
      Bind LUKS volume to Tang server:
      1. Install: dnf install clevis clevis-luks
      2. Bind: clevis luks bind -d /dev/<device> tang '{"url":"http://tang.server"}'
      3. Verify: clevis luks list -d /dev/<device>
      4. Test: clevis luks unlock -d /dev/<device>
    rollback_supported: true
    reboot_required: false
    service_impact: Encrypted volumes will auto-unlock when Tang is reachable
    estimated_time: 20 minutes
  context:
    rationale: Clevis enables automated disk decryption when network-bound conditions are met
    impact: Low - Simplifies encrypted volume management
    false_positive_risk: None
  tags:
  - encryption
  - nbde
  - clevis
  - disk-encryption

- rule_id: RH-PKCS11-001
  rule_name: Configure SSH for smart card authentication
  rule_description: Configure OpenSSH to use keys stored on smart cards or hardware security modules (HSMs) through PKCS#11 for enhanced authentication security.
  category: Authentication
  subcategory: Smart Card
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Partial
    audit_type: config
    detection_step: Verify SSH PKCS#11 configuration
    check_command: grep -r PKCS11Provider /etc/ssh/ssh_config /etc/ssh/sshd_config 2>/dev/null
    expected_value: PKCS11Provider configured if smart cards are used
  remediation:
    remediation_step: |
      Configure SSH client (~/.ssh/config):
      PKCS11Provider /usr/lib64/opensc-pkcs11.so
      
      For SSH server, configure authorized_keys with certificate:
      ssh-keygen -D /usr/lib64/opensc-pkcs11.so >> ~/.ssh/authorized_keys
    rollback_supported: true
    reboot_required: false
    service_impact: Changes authentication method
    estimated_time: 20 minutes
  context:
    rationale: Smart card authentication provides hardware-backed key storage for enhanced security
    impact: Low - Enhanced authentication security
    false_positive_risk: None
  tags:
  - authentication
  - pkcs11
  - smart-card
  - ssh

- rule_id: RH-SCAP-001
  rule_name: Install OpenSCAP for compliance scanning
  rule_description: Install OpenSCAP tools to scan systems for security configuration compliance against SCAP Security Guide profiles.
  category: Compliance
  subcategory: Scanning
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: Verify OpenSCAP is installed
    check_command: rpm -q openscap-scanner scap-security-guide
    expected_value: openscap-scanner and scap-security-guide packages installed
  remediation:
