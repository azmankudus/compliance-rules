- rule_id: RH-SCAP-002
  rule_name: Perform regular compliance scans
  rule_description: Schedule regular OpenSCAP compliance scans against appropriate security profiles (CIS, STIG, etc.) to maintain security posture.
  category: Compliance
  subcategory: Scanning
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: process
    detection_step: Verify compliance scanning is scheduled
    check_command: grep -r oscap /etc/cron* 2>/dev/null || systemctl list-timers | grep -i oscap
    expected_value: Regular scanning should be configured
  remediation:
    remediation_step: |
      Run a compliance scan:
      oscap xccdf eval --profile xccdf_org.ssgproject.content_profile_cis \
        --results /var/tmp/scan-results.xml \
        --report /var/tmp/scan-report.html \
        /usr/share/xml/scap/ssg/content/ssg-rhel10-ds.xml
      
      Schedule regular scans via cron or systemd timers.
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal during scanning
    estimated_time: 30 minutes
  context:
    rationale: Regular scanning ensures ongoing compliance with security policies
    impact: Medium - Critical for compliance
    false_positive_risk: Medium - May require tuning
  tags:
  - compliance
  - openscap
  - scanning
  - automation

- rule_id: RH-SCAP-003
  rule_name: Apply SCAP remediation for non-compliant rules
  rule_description: Use OpenSCAP to automatically remediate non-compliant configuration items where automated remediation is available.
  category: Compliance
  subcategory: Remediation
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: process
    detection_step: Review scan results for remediation opportunities
    check_command: oscap xccdf eval --profile xccdf_org.ssgproject.content_profile_cis --check-engine-results /var/tmp/scan-results.xml 2>/dev/null | head -20
    expected_value: Review non-compliant items for remediation
  remediation:
    remediation_step: |
      Generate remediation script:
      oscap xccdf generate fix --profile xccdf_org.ssgproject.content_profile_cis \
        --output /var/tmp/remediation.sh \
        /usr/share/xml/scap/ssg/content/ssg-rhel10-ds.xml
      
      Review script before applying:
      less /var/tmp/remediation.sh
      
      Apply remediation:
      bash /var/tmp/remediation.sh
    rollback_supported: false
    reboot_required: true
    service_impact: May change system configuration significantly
    estimated_time: 60 minutes
  context:
    rationale: Automated remediation speeds up compliance efforts
    impact: Medium - Significant configuration changes
    false_positive_risk: Medium - Review changes before applying
  tags:
  - compliance
  - openscap
  - remediation

- rule_id: RH-SELINUX-001
  rule_name: Ensure SELinux is enabled and enforcing
  rule_description: Ensure SELinux is running in enforcing mode to provide mandatory access control security.
  category: Access Control
  subcategory: SELinux
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: Verify SELinux mode
    check_command: getenforce
    expected_value: Enforcing
  remediation:
    remediation_step: |
      Enable SELinux enforcing mode:
      1. Edit /etc/selinux/config:
         SELINUX=enforcing
      2. Set immediately: setenforce 1
      3. Reboot if changing from disabled
    rollback_supported: true
    reboot_required: true
    service_impact: May affect applications requiring SELinux policy updates
    estimated_time: 30 minutes
  context:
    rationale: SELinux enforcing mode provides strong mandatory access control
    impact: High - Critical security control
    false_positive_risk: Medium - May block legitimate operations
  tags:
  - access-control
  - selinux
  - mandatory-access-control

- rule_id: RH-POLKIT-001
  rule_name: Configure polkit for smart card access control
  rule_description: Configure polkit rules to control which users and groups can access smart card devices through PC/SC.
  category: Access Control
  subcategory: Smart Card
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Partial
    audit_type: config
    detection_step: Review polkit rules for smart card access
    check_command: ls /etc/polkit-1/rules.d/ /usr/share/polkit-1/rules.d/ 2>/dev/null | grep -i pcsc
    expected_value: Custom polkit rules configured if needed
  remediation:
    remediation_step: |
      Create polkit rule in /etc/polkit-1/rules.d/49-pcsc.rules:
      polkit.addRule(function(action, subject) {
          if (action.id == "org.debian.pcsc-lite.access_card" &&
              subject.isInGroup("wheel")) {
              return polkit.Result.YES;
          }
      });
    rollback_supported: true
    reboot_required: false
    service_impact: May restrict smart card access
    estimated_time: 15 minutes
  context:
    rationale: Controlling smart card access prevents unauthorized use of security tokens
    impact: Low - Access control for smart cards
    false_positive_risk: Low
  tags:
  - access-control
  - polkit
  - smart-card
