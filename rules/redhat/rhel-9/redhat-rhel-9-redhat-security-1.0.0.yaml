- rule_id: RH9-SEC-062
  rule_name: Configure SSH Hardening
  rule_description: Configure SSH daemon with security hardening settings including
    key-based authentication, disabling root login, and limiting access.
  category: SSH Security
  testing_status: untested
  assessment:
    severity: Critical
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Review SSH config: ''sshd -T | grep -E "permitrootlogin|passwordauthentication|pubkeyauthentication"''.
      Check for weak settings in /etc/ssh/sshd_config.'
  remediation:
    remediation_step: 'Edit /etc/ssh/sshd_config: ''PermitRootLogin no'', ''PasswordAuthentication
      no'', ''PubkeyAuthentication yes'', ''Protocol 2'', ''MaxAuthTries 3'', ''ClientAliveInterval
      300''. Restart: ''systemctl restart sshd''. Test before closing session.'
  tags:
  - rhel9
  - security
  - ssh-security
- rule_id: RH9-SEC-063
  rule_name: Configure SSH Key Authentication
  rule_description: Configure SSH to use public key authentication instead of passwords
    for stronger authentication.
  category: SSH Security
  testing_status: untested
  assessment:
    severity: Critical
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check SSH key auth: ''sshd -T | grep pubkeyauthentication''.
      Verify authorized_keys exist: ''ls -la ~/.ssh/authorized_keys''. Test key login.'
  remediation:
    remediation_step: 'Generate key pair: ''ssh-keygen -t ed25519 -b 4096''. Copy
      to server: ''ssh-copy-id user@server''. Edit /etc/ssh/sshd_config: ''PubkeyAuthentication
      yes'', ''PasswordAuthentication no''. Restart sshd. Test key login before closing
      session.'
  tags:
  - rhel9
  - security
  - ssh-security
- rule_id: RH9-SEC-064
  rule_name: Configure Password Policy
  rule_description: Configure system password policy to enforce strong passwords including
    length, complexity, and history requirements.
  category: Authentication
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check password quality config: ''cat /etc/security/pwquality.conf''.
      Check PAM settings: ''grep pam_pwquality /etc/pam.d/system-auth''.'
  remediation:
    remediation_step: 'Edit /etc/security/pwquality.conf: ''minlen = 14'', ''minclass
      = 4'', ''dcredit = -1'', ''ucredit = -1'', ''lcredit = -1'', ''ocredit = -1'',
      ''retry = 3''. Configure history in PAM: ''pam_pwhistory.so remember=5''.'
  tags:
  - rhel9
  - security
  - authentication
- rule_id: RH9-SEC-065
  rule_name: Configure Account Lockout Policy
  rule_description: Configure account lockout policy to prevent brute force password
    attacks by locking accounts after failed login attempts.
  category: Authentication
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check faillock config: ''cat /etc/security/faillock.conf''. Check
      PAM configuration: ''grep faillock /etc/pam.d/system-auth''.'
  remediation:
    remediation_step: 'Edit /etc/security/faillock.conf: ''deny = 5'', ''unlock_time
