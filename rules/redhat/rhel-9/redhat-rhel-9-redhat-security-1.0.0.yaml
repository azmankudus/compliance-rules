- rule_id: RH9-SEC-067
  rule_name: Configure Kernel Parameters
  rule_description: Configure kernel parameters for security hardening including network
    security, memory protection, and system behavior.
  category: Kernel Security
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check current parameters: ''sysctl -a | grep -E "net.ipv4|net.ipv6|kernel.exec"''.
      Review /etc/sysctl.d/ configuration files.'
  remediation:
    remediation_step: 'Create /etc/sysctl.d/99-security.conf with settings: ''net.ipv4.conf.all.rp_filter
