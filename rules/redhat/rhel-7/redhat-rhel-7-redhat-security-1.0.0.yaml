$schema: https://opencode.ai/schemas/hardening-rule-schema.json
$schema_version: 1.0.0
$metadata:
  name: Red Hat Enterprise Linux 7 Security Hardening
  version: 1.0.0
  description: Security hardening rules from official Red Hat RHEL 7 Security Guide
  platform: Red Hat Enterprise Linux 7
  benchmark: Red Hat RHEL 7 Security Guide
  author: Red Hat
  created: '2026-03-13T00:00:00Z'
  modified: '2026-03-13T00:00:00Z'
  compatible_platforms:
  - RHEL 7.x
  references:
  - type: Official Documentation
    reference: https://access.redhat.com/documentation/en-us/red_hat_enterprise_linux/7/html/security_guide
compliance_info:
  framework: Oracle Security
  version: 1.0.0
  profile: Production
rules:
- rule_id: RH7-SEC-001
  rule_name: Set BIOS Password
  rule_description: Configure a BIOS/UEFI password to prevent unauthorized changes
    to boot settings and system configuration. BIOS passwords prevent attackers from
    modifying boot sequences or booting from alternative media.
  category: Installation Security
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: Restart system and enter BIOS/UEFI setup. Check if an administrator/supervisor
      password is set. Alternatively, check for BIOS password status using dmidecode
      if available.
  remediation:
    remediation_step: Enter BIOS/UEFI setup during boot (typically F2, Del, or F12).
      Navigate to Security settings and set an administrator/supervisor password.
      Document the password securely.
  tags:
  - rhel7
  - security
  - installation-security
- rule_id: RH7-SEC-002
  rule_name: Disable Boot from External Media in BIOS
  rule_description: Configure BIOS to disable booting from external media (USB, CD/DVD,
    network) to prevent unauthorized system access or booting from malicious media.
  category: Installation Security
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: Enter BIOS/UEFI setup and verify boot order settings. Check that
      external media (USB, optical, network boot) are disabled or set after internal
      storage.
  remediation:
    remediation_step: In BIOS/UEFI setup, navigate to Boot settings. Disable boot
      from USB, optical drive, and network (PXE). Set internal hard drive as first
      boot device.
  tags:
  - rhel7
  - security
  - installation-security
- rule_id: RH7-SEC-003
  rule_name: Secure UEFI Boot Loader
  rule_description: Enable Secure Boot in UEFI firmware to ensure only signed, trusted
    boot loaders and kernels can be loaded during system startup.
  category: Installation Security
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Run: mokutil --sb-state. Verify Secure Boot is enabled. Check
      UEFI setup for Secure Boot status.'
  remediation:
    remediation_step: Enter UEFI setup during boot. Navigate to Security or Boot settings.
      Enable Secure Boot. Ensure system is running in UEFI mode (not legacy BIOS).
  tags:
  - rhel7
  - security
  - installation-security
- rule_id: RH7-SEC-004
  rule_name: Create Separate Partitions for Critical Directories
  rule_description: Configure separate partitions for /boot, /home, /var, /tmp, /var/log,
    and /var/log/audit to prevent disk space exhaustion attacks and contain potential
    damage.
  category: Installation Security
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Run: df -h or cat /etc/fstab. Verify that /boot, /home, /var,
      /tmp are mounted on separate filesystems.'
  remediation:
    remediation_step: During installation, use manual partitioning to create separate
      partitions. For existing systems, use LVM to create logical volumes and migrate
      data. Edit /etc/fstab to mount new partitions.
  tags:
  - rhel7
  - security
  - installation-security
- rule_id: RH7-SEC-005
  rule_name: Mount /tmp with nodev nosuid noexec Options
  rule_description: Mount the /tmp directory with nodev, nosuid, and noexec options
    to prevent execution of malicious binaries and exploitation of SUID binaries from
    temporary files.
  category: Installation Security
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Run: mount | grep ''on /tmp''. Verify nodev,nosuid,noexec options
      are present. Check /etc/fstab for persistent configuration.'
  remediation:
    remediation_step: 'Edit /etc/fstab and add nodev,nosuid,noexec options to the
      /tmp mount entry. Run: mount -o remount /tmp to apply immediately. For systemd
      tmpfs: cp /usr/share/systemd/tmp.mount /etc/systemd/system/ and edit Options
      line.'
  tags:
  - rhel7
  - security
  - installation-security
- rule_id: RH7-SEC-006
  rule_name: Mount /var/tmp with nodev nosuid noexec Options
  rule_description: Mount /var/tmp with nodev, nosuid, and noexec options to prevent
    execution of malicious binaries from persistent temporary storage.
  category: Installation Security
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Run: mount | grep ''on /var/tmp''. Verify nodev,nosuid,noexec
      options are present. Check /etc/fstab.'
  remediation:
    remediation_step: 'Edit /etc/fstab and add nodev,nosuid,noexec options to /var/tmp
      mount. Run: mount -o remount /var/tmp to apply changes.'
  tags:
  - rhel7
  - security
  - installation-security
- rule_id: RH7-SEC-007
  rule_name: Mount /dev/shm with nodev nosuid noexec Options
  rule_description: Mount /dev/shm with nodev, nosuid, and noexec options to prevent
    privilege escalation attacks through shared memory.
  category: Installation Security
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Run: mount | grep ''on /dev/shm''. Verify nodev,nosuid,noexec
      options are present.'
  remediation:
    remediation_step: 'Edit /etc/fstab and modify the /dev/shm entry to include nodev,nosuid,noexec
      options. Run: mount -o remount /dev/shm.'
  tags:
  - rhel7
  - security
  - installation-security
- rule_id: RH7-SEC-008
  rule_name: Install Minimum Required Packages
  rule_description: Install only the minimum required packages to reduce attack surface.
    Avoid installing unnecessary services, development tools, or documentation on
    production systems.
  category: Installation Security
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Run: yum list installed | wc -l to count packages. Review installed
      package groups: yum grouplist. Identify unnecessary packages.'
  remediation:
    remediation_step: 'Remove unnecessary packages with: yum remove <package>. Remove
      unused package groups: yum groupremove <group>. Use minimal installation profile
      during initial setup.'
  tags:
  - rhel7
  - security
  - installation-security
- rule_id: RH7-SEC-009
  rule_name: Restrict Network Connectivity During Installation
  rule_description: Limit network connectivity during installation to prevent potential
    attacks. Disconnect from network or use isolated network segment until system
    is hardened.
  category: Installation Security
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: Verify installation was performed on an isolated network segment
      or with network disconnected. Review installation documentation.
  remediation:
    remediation_step: During installation, disconnect network cable or disable network
      interface. Configure firewall immediately after installation before connecting
      to production network.
  tags:
  - rhel7
  - security
  - installation-security
- rule_id: RH7-SEC-010
  rule_name: Configure and Enable yum Security Updates
  rule_description: Configure yum to automatically check for and apply security updates
    to protect against known vulnerabilities.
  category: System Updates
  testing_status: untested
  assessment:
    severity: Critical
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Run: yum updateinfo list security all. Check if yum-security
      is installed: rpm -q yum-plugin-security. Verify automatic updates configuration
      in /etc/yum/yum-cron.conf.'
  remediation:
    remediation_step: 'Install yum-plugin-security: yum install yum-plugin-security.
      Install yum-cron for automatic updates: yum install yum-cron. Edit /etc/yum/yum-cron.conf
      and set update_cmd = security. Enable service: systemctl enable yum-cron &&
      systemctl start yum-cron.'
  tags:
  - rhel7
  - security
  - system-updates
- rule_id: RH7-SEC-011
  rule_name: List Available Security Updates
  rule_description: Regularly review available security updates to understand pending
    patches and their severity levels.
  category: System Updates
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Run: yum check-update --security to list available security updates.
      Run: yum updateinfo list security all to see all security advisories.'
  remediation:
    remediation_step: Schedule regular checks for security updates. Document and track
      security advisories. Establish a process for reviewing and applying security
      updates.
  tags:
  - rhel7
  - security
  - system-updates
- rule_id: RH7-SEC-012
  rule_name: Apply Security Updates
  rule_description: Apply all available security updates to address known vulnerabilities.
    Prioritize Critical and Important severity updates.
  category: System Updates
  testing_status: untested
  assessment:
    severity: Critical
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Run: yum check-update --security. Check last update date: rpm
      -qa --last | head. Review security advisory history.'
  remediation:
    remediation_step: 'Apply security updates: yum update --security. For minimal
      updates: yum update-minimal --security -y. Reboot if kernel updates are applied.
      Document changes.'
  tags:
  - rhel7
  - security
  - system-updates
- rule_id: RH7-SEC-013
  rule_name: Verify Package Signatures
  rule_description: Verify GPG signatures on all installed packages to ensure package
    integrity and authenticity from Red Hat repositories.
  category: System Updates
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Run: rpm -qa --qf ''%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH} %{SIGPGP:pgpsig}\n''
      | head. Check for unsigned packages. Verify GPG keys: rpm -q gpg-pubkey.'
  remediation:
    remediation_step: 'Import Red Hat GPG keys: rpm --import /etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release.
      Enable gpgcheck in /etc/yum.conf: gpgcheck=1. Verify all repository configurations
      have gpgcheck=1.'
  tags:
  - rhel7
  - security
  - system-updates
- rule_id: RH7-SEC-014
  rule_name: Configure Strong Password Requirements
  rule_description: Configure password quality requirements using pam_pwquality to
    enforce minimum length, complexity, and character class requirements.
  category: Password Security
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: Check /etc/security/pwquality.conf for minlen, dcredit, ucredit,
      lcredit, ocredit settings. Check /etc/pam.d/system-auth and password-auth for
      pam_pwquality configuration.
  remediation:
    remediation_step: 'Edit /etc/security/pwquality.conf: Set minlen = 14 (or higher),
      dcredit = -1, ucredit = -1, lcredit = -1, ocredit = -1, minclass = 4. Ensure
      pam_pwquality.so is configured in /etc/pam.d/system-auth.'
  tags:
  - rhel7
  - security
  - password-security
- rule_id: RH7-SEC-015
  rule_name: Configure Password Aging Parameters
  rule_description: Configure password aging to require regular password changes and
    prevent stale credentials. Set maximum password age, minimum age, and warning
    period.
  category: Password Security
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check /etc/login.defs for PASS_MAX_DAYS, PASS_MIN_DAYS, PASS_WARN_AGE.
      Check existing users: chage -l <username>. Check default aging: grep -E ''PASS_MAX_DAYS|PASS_MIN_DAYS|PASS_WARN_AGE''
      /etc/login.defs.'
  remediation:
    remediation_step: 'Edit /etc/login.defs: Set PASS_MAX_DAYS 90, PASS_MIN_DAYS 7,
      PASS_WARN_AGE 14. For existing users: chage -M 90 -m 7 -W 14 <username>. Apply
      to all users: awk -F: ''$3 >= 1000 {print $1}'' /etc/passwd | xargs -I {} chage
      -M 90 {}.'
  tags:
  - rhel7
  - security
  - password-security
- rule_id: RH7-SEC-016
  rule_name: Configure Account Lockout After Failed Login Attempts
  rule_description: Configure account lockout to automatically lock accounts after
    multiple failed authentication attempts to prevent brute force attacks.
  category: Account Security
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check /etc/pam.d/system-auth and /etc/pam.d/password-auth for
      pam_faillock configuration. Check /etc/security/faillock.conf. Verify faillock
      command works: faillock --user root.'
  remediation:
    remediation_step: 'Add to /etc/pam.d/system-auth and password-auth in auth section:
      auth required pam_faillock.so preauth silent deny=5 unlock_time=900. Add to
      account section: account required pam_faillock.so. Alternatively configure /etc/security/faillock.conf
      with deny=5 and unlock_time=900.'
  tags:
  - rhel7
  - security
  - account-security
- rule_id: RH7-SEC-017
  rule_name: Lock Inactive User Accounts
  rule_description: Automatically lock user accounts that have been inactive for a
    specified period to reduce the risk of compromised stale accounts.
  category: Account Security
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check for inactive accounts: useradd -D | grep INACTIVE. Check
      last login: lastlog. Review user inactivity: awk -F: ''$3 >= 1000 {print $1}''
      /etc/passwd | while read user; do echo -n "$user: "; lastlog -u $user | tail
      -1; done.'
  remediation:
    remediation_step: 'Set default inactivity period: useradd -D -f 35. For existing
      users: usermod -f 35 <username>. Configure in /etc/default/useradd: INACTIVE=35.'
  tags:
  - rhel7
  - security
  - account-security
- rule_id: RH7-SEC-018
  rule_name: Configure Session Timeout for Inactive Sessions
  rule_description: Configure automatic session timeout to lock or terminate inactive
    sessions after a defined period of inactivity.
  category: Session Security
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check TMOUT variable: grep TMOUT /etc/profile /etc/bashrc ~/.bashrc.
      Check /etc/profile.d/ for timeout scripts. Verify current setting: echo $TMOUT.'
  remediation:
    remediation_step: 'Add to /etc/profile or /etc/profile.d/timeout.sh: declare -xr
      TMOUT=900 (15 minutes). For bash, add readonly TMOUT=900 to /etc/bashrc. Configure
      screen or tmux lock on idle.'
  tags:
  - rhel7
  - security
  - session-security
- rule_id: RH7-SEC-019
  rule_name: Restrict Direct Root Login
  rule_description: Disable direct root login and require users to use sudo or su
    to gain root access. This provides accountability and audit trail.
  category: Root Access Control
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check /etc/securetty for console entries. Check /etc/ssh/sshd_config
      for PermitRootLogin setting. Verify sudo is configured: grep -E ''^%wheel|^%sudo''
      /etc/sudoers.'
  remediation:
    remediation_step: 'Edit /etc/ssh/sshd_config: PermitRootLogin no. For console,
      clear /etc/securetty or set to only tty1. Configure sudo access: visudo and
      add users to wheel group. Restart sshd: systemctl restart sshd.'
  tags:
  - rhel7
  - security
  - root-access-control
- rule_id: RH7-SEC-020
  rule_name: Configure sudo for Privileged Access
  rule_description: Configure sudo to provide controlled, auditable privileged access.
    Use sudoers to grant specific command permissions instead of full root access.
  category: Root Access Control
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check /etc/sudoers and /etc/sudoers.d/: visudo -c. Verify sudo
      logging is enabled. Check wheel group membership: getent group wheel.'
  remediation:
    remediation_step: 'Use visudo to edit /etc/sudoers. Add specific command permissions:
      username ALL=(ALL) /usr/bin/systemctl restart httpd. Enable sudo logging: add
      Defaults logfile=/var/log/sudo.log. Add users to wheel group: usermod -aG wheel
      <username>.'
  tags:
  - rhel7
  - security
  - root-access-control
- rule_id: RH7-SEC-021
  rule_name: Secure GRUB2 Boot Loader
  rule_description: Set a password for GRUB2 boot loader to prevent unauthorized modification
    of boot parameters or single-user mode access.
  category: Boot Security
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check for GRUB password: grep -E ''password|GRUB2_PASSWORD''
      /boot/grub2/grub.cfg /boot/efi/EFI/redhat/grub.cfg. Verify grub2-setpassword
      was run: test -f /boot/grub2/user.cfg.'
  remediation:
    remediation_step: 'Run: grub2-setpassword. This creates /boot/grub2/user.cfg.
      For UEFI: grub2-mkconfig -o /boot/efi/EFI/redhat/grub.cfg. For BIOS: grub2-mkconfig
      -o /boot/grub2/grub.cfg. Document password securely.'
  tags:
  - rhel7
  - security
  - boot-security
- rule_id: RH7-SEC-022
  rule_name: Disable Interactive Startup
  rule_description: Disable interactive startup mode to prevent users from interrupting
    the boot process and modifying service startup.
  category: Boot Security
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check /etc/sysconfig/init for PROMPT setting. Verify: grep PROMPT
      /etc/sysconfig/init.'
  remediation:
    remediation_step: 'Edit /etc/sysconfig/init and set: PROMPT=no. This prevents
      the ''Press I for interactive startup'' prompt.'
  tags:
  - rhel7
  - security
  - boot-security
- rule_id: RH7-SEC-023
  rule_name: Protect Hard and Symbolic Links
  rule_description: Configure kernel parameters to restrict following symbolic links
    and hard links to prevent privilege escalation attacks.
  category: Filesystem Security
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check current settings: sysctl fs.protected_hardlinks fs.protected_symlinks.
      Check /etc/sysctl.conf or /etc/sysctl.d/ for persistent settings.'
  remediation:
    remediation_step: 'Add to /etc/sysctl.conf or /etc/sysctl.d/99-security.conf:
      fs.protected_hardlinks = 1, fs.protected_symlinks = 1. Apply: sysctl -p or sysctl
      --system.'
  tags:
  - rhel7
  - security
  - filesystem-security
- rule_id: RH7-SEC-024
  rule_name: Disable Unnecessary Services
  rule_description: Identify and disable unnecessary network services to reduce attack
    surface. Only enable services required for system functionality.
  category: Service Security
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'List active services: systemctl list-unit-files --type=service
      | grep enabled. List listening services: ss -tulpn. Check open ports: netstat
      -tulpn or ss -tulpn.'
  remediation:
    remediation_step: 'Disable unnecessary services: systemctl disable --now <service>.
      Mask services that should never run: systemctl mask <service>. Review and remove
      unused software: yum remove <package>.'
  tags:
  - rhel7
  - security
  - service-security
- rule_id: RH7-SEC-025
  rule_name: Disable Insecure Legacy Services
  rule_description: Disable insecure legacy services like telnet, rsh, rlogin, rexec,
    and ftp that transmit credentials in cleartext.
  category: Service Security
  testing_status: untested
  assessment:
    severity: Critical
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check for insecure services: systemctl status telnet.socket rsh.socket
      rlogin.socket rexec.socket vsftpd proftpd. Check installed packages: rpm -qa
      | grep -E ''telnet|rsh|ftp''.'
  remediation:
    remediation_step: 'Disable services: systemctl disable --now telnet.socket rsh.socket.
      Remove packages: yum remove telnet-server rsh-server. Use SSH instead of telnet/rsh.
      Use SFTP/SCP instead of FTP.'
  tags:
  - rhel7
  - security
  - service-security
- rule_id: RH7-SEC-026
  rule_name: Configure SSH Protocol 2 Only
  rule_description: Configure SSH to use only Protocol 2 as Protocol 1 has known cryptographic
    weaknesses and vulnerabilities.
  category: SSH Security
  testing_status: untested
  assessment:
    severity: Critical
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check /etc/ssh/sshd_config for Protocol setting: grep -E ''^Protocol''
      /etc/ssh/sshd_config. Note: In RHEL7, Protocol 2 is default and Protocol 1 is
      removed.'
  remediation:
    remediation_step: 'Edit /etc/ssh/sshd_config and ensure Protocol 2 is set (or
      not specified as it''s the default). Remove any Protocol 1 configuration. Restart
      sshd: systemctl restart sshd.'
  tags:
  - rhel7
  - security
  - ssh-security
- rule_id: RH7-SEC-027
  rule_name: Disable SSH Root Login
  rule_description: Disable direct root login via SSH to enforce accountability and
    prevent brute force attacks on root account.
  category: SSH Security
  testing_status: untested
  assessment:
    severity: Critical
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check /etc/ssh/sshd_config: grep -E ''^PermitRootLogin'' /etc/ssh/sshd_config.
      Verify setting is ''no''.'
  remediation:
    remediation_step: 'Edit /etc/ssh/sshd_config: PermitRootLogin no. Restart SSH:
      systemctl restart sshd. Ensure alternative admin access via sudo is configured
      before applying.'
  tags:
  - rhel7
  - security
  - ssh-security
- rule_id: RH7-SEC-028
  rule_name: Configure SSH Key-Based Authentication
  rule_description: Configure SSH for public key authentication and consider disabling
    password authentication for improved security.
  category: SSH Security
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check /etc/ssh/sshd_config: grep -E ''PubkeyAuthentication|PasswordAuthentication''
      /etc/ssh/sshd_config. Verify user keys exist: ls -la ~/.ssh/authorized_keys.'
  remediation:
    remediation_step: 'Generate SSH key pair: ssh-keygen -t ed25519 or ssh-keygen
      -t rsa -b 4096. Copy key to server: ssh-copy-id user@host. Edit /etc/ssh/sshd_config:
      PubkeyAuthentication yes, PasswordAuthentication no. Restart sshd.'
  tags:
  - rhel7
  - security
  - ssh-security
- rule_id: RH7-SEC-029
  rule_name: Disable SSH Empty Passwords
  rule_description: Disable SSH authentication for accounts with empty passwords to
    prevent unauthorized access.
  category: SSH Security
  testing_status: untested
  assessment:
    severity: Critical
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check /etc/ssh/sshd_config: grep -E ''^PermitEmptyPasswords''
      /etc/ssh/sshd_config. Verify setting is ''no''.'
  remediation:
    remediation_step: 'Edit /etc/ssh/sshd_config: PermitEmptyPasswords no. Also verify
      no accounts have empty passwords: awk -F: ''($2 == "") {print $1}'' /etc/passwd.
      Lock accounts with empty passwords: passwd -l <username>.'
  tags:
  - rhel7
  - security
  - ssh-security
- rule_id: RH7-SEC-030
  rule_name: Configure SSH Client Alive Interval
  rule_description: Configure SSH to automatically disconnect inactive sessions after
    a timeout period to prevent unauthorized access to unattended sessions.
  category: SSH Security
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check /etc/ssh/sshd_config: grep -E ''ClientAliveInterval|ClientAliveCountMax''
      /etc/ssh/sshd_config.'
  remediation:
    remediation_step: 'Edit /etc/ssh/sshd_config: ClientAliveInterval 300 (5 minutes),
      ClientAliveCountMax 3. This will disconnect after 15 minutes of inactivity.
      Restart sshd: systemctl restart sshd.'
  tags:
  - rhel7
  - security
  - ssh-security
- rule_id: RH7-SEC-031
  rule_name: Limit SSH User Access
  rule_description: Configure SSH to restrict which users or groups can connect via
    SSH to limit attack surface.
  category: SSH Security
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check /etc/ssh/sshd_config: grep -E ''AllowUsers|AllowGroups|DenyUsers|DenyGroups''
      /etc/ssh/sshd_config.'
  remediation:
    remediation_step: 'Edit /etc/ssh/sshd_config. Add AllowUsers user1 user2 or AllowGroups
      ssh-users. Alternatively use DenyUsers or DenyGroups to exclude specific accounts.
      Restart sshd: systemctl restart sshd.'
  tags:
  - rhel7
  - security
  - ssh-security
- rule_id: RH7-SEC-032
  rule_name: Configure SSH Banner
