  rule_name: The Red Hat Enterprise Linux operating system must be a vendor supported release.
  title: The Red Hat Enterprise Linux operating system must be a vendor supported release.
  rule_description: An operating system release is considered "supported" if the vendor continues to provide security patches for the product. With an unsupported release, it will not be possible to resolve security issues discovered in the system software.
  description: An operating system release is considered "supported" if the vendor continues to provide security patches for the product. With an unsupported release, it will not be possible to resolve security issues discovered in the system software.
