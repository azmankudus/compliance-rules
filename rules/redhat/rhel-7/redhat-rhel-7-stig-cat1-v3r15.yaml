  rule_name: The Red Hat Enterprise Linux operating system must not have accounts configured with blank or null passwords.
  title: The Red Hat Enterprise Linux operating system must not have accounts configured with blank or null passwords.
  rule_description: If an account has an empty password, anyone could log on and run commands with the privileges of that account. Accounts with empty passwords should never be used in operational environments.
