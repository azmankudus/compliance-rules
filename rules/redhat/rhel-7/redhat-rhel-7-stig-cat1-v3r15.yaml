  rule_name: SNMP community strings on the Red Hat Enterprise Linux operating system must be changed from the default.
  title: SNMP community strings on the Red Hat Enterprise Linux operating system must be changed from the default.
  rule_description: SNMP community strings on the Red Hat Enterprise Linux operating system must be changed from the default.
  description: SNMP community strings on the Red Hat Enterprise Linux operating system must be changed from the default.
  category: CM-6
  severity: High
