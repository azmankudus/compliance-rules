- rule_id: STIG-010010
  id: RHEL-07-010010
  legacy_ids:
  - V-204392
  - SV-204392r991558_rule
  rule_name: The Red Hat Enterprise Linux operating system must be configured so that the file permissions, ownership, and group membership of system files and commands match the vendor values.
  title: The Red Hat Enterprise Linux operating system must be configured so that the file permissions, ownership, and group membership of system files and commands match the vendor values.
  rule_description: The Red Hat Enterprise Linux operating system must be configured so that the file permissions, ownership, and group membership of system files and commands match the vendor values.
  description: The Red Hat Enterprise Linux operating system must be configured so that the file permissions, ownership, and group membership of system files and commands match the vendor values.
  category: AU-9
  severity: High
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Verify the file permissions, ownership, and group membership of system files and commands match the vendor values. Check the default file permissions, ownership, and group membership of system files and commands with the following command: # for i in \`rpm -Va | grep -E ''^.{1}M|^.{5}U|^.{6}G'' | cut -d " " -f 4,5\`;do for j in \`rpm -qf $i\`;do rpm -ql $j --dump | cut -d " " -f 1,5,6,7 | grep $i;done;done /var/log/gdm 040755 root root /etc/audisp/audisp-remote.conf 0100640 root root /usr/bin/passwd 0104755 root root For each file returned, verify the current permissions, ownership, and group membership: # ls -la &lt;filename&gt; -rw-------. 1 root root 2017 Nov 1 10:03 /etc/audisp/audisp-remote.conf If the file is more permissive than the default permissions, this is a finding. If the file is not owned by the default owner and is not documented with the Information System Security Officer (ISSO), this is a finding. If the file is not a member of the default group and
      is not documented with the Information System Security Officer (ISSO), this is a finding.'
  remediation:
    remediation_step: 'Run the following command to determine which package owns the file: # rpm -qf <filename> Reset the user and group ownership of files within a package with the following command: # rpm --setugids <packagename> Reset the permissions of files within a package with the following command: # rpm --setperms <packagename>'
  tags:
  - stig
  - rhel7
  - au-9
  - cci-001494
- rule_id: STIG-010290
  id: RHEL-07-010290
  legacy_ids:
  - V-204424
  - SV-204424r991589_rule
  rule_name: The Red Hat Enterprise Linux operating system must not allow accounts configured with blank or null passwords.
  title: The Red Hat Enterprise Linux operating system must not allow accounts configured with blank or null passwords.
  rule_description: If an account has an empty password, anyone could log on and run commands with the privileges of that account. Accounts with empty passwords should never be used in operational environments.
  description: If an account has an empty password, anyone could log on and run commands with the privileges of that account. Accounts with empty passwords should never be used in operational environments.
  category: CM-6
  severity: High
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'To verify that null passwords cannot be used, run the following command: # grep nullok /etc/pam.d/system-auth /etc/pam.d/password-auth If this produces any output, it may be possible to log on with accounts with empty passwords. If null passwords can be used, this is a finding.'
  remediation:
    remediation_step: 'If an account is configured for password authentication but does not have an assigned password, it may be possible to log on to the account without authenticating. Remove any instances of the "nullok" option in "/etc/pam.d/system-auth" and "/etc/pam.d/password-auth" to prevent logons with empty passwords. Note: Per requirement RHEL-07-010199, RHEL 7 must be configured to not overwrite custom authentication configuration settings while using the authconfig utility, otherwise manual changes to the listed files will be overwritten whenever the authconfig utility is used.'
  tags:
  - stig
  - rhel7
  - cm-6
  - cci-000366
- rule_id: STIG-010300
  id: RHEL-07-010300
  legacy_ids:
  - V-204425
  - SV-204425r958486_rule
  rule_name: The Red Hat Enterprise Linux operating system must be configured so that the SSH daemon does not allow authentication using an empty password.
  title: The Red Hat Enterprise Linux operating system must be configured so that the SSH daemon does not allow authentication using an empty password.
  rule_description: Configuring this setting for the SSH daemon provides additional assurance that remote logon via SSH will require a password, even in the event of misconfiguration elsewhere.
  description: Configuring this setting for the SSH daemon provides additional assurance that remote logon via SSH will require a password, even in the event of misconfiguration elsewhere.
  category: IA-2
  severity: High
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'To determine how the SSH daemon''s "PermitEmptyPasswords" option is set, run the following command: # grep -i PermitEmptyPasswords /etc/ssh/sshd\_config PermitEmptyPasswords no If no line, a commented line, or a line indicating the value "no" is returned, the required value is set. If the required value is not set, this is a finding.'
  remediation:
    remediation_step: 'To explicitly disallow remote logon from accounts with empty passwords, add or correct the following line in "/etc/ssh/sshd\_config": PermitEmptyPasswords no The SSH service must be restarted for changes to take effect. Any accounts with empty passwords should be disabled immediately, and PAM configuration should prevent users from being able to assign themselves empty passwords.'
  tags:
  - stig
  - rhel7
  - ia-2
  - cci-000766
- rule_id: STIG-010440
  id: RHEL-07-010440
  legacy_ids:
  - V-204432
  - SV-204432r991591_rule
  rule_name: The Red Hat Enterprise Linux operating system must not allow an unattended or automatic logon to the system via a graphical user interface.
  title: The Red Hat Enterprise Linux operating system must not allow an unattended or automatic logon to the system via a graphical user interface.
  rule_description: Failure to restrict system access to authenticated users negatively impacts operating system security.
  description: Failure to restrict system access to authenticated users negatively impacts operating system security.
  category: CM-6
  severity: High
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Verify the operating system does not allow an unattended or automatic logon to the system via a graphical user interface. Note: If the system does not have GNOME installed, this requirement is Not Applicable. Check for the value of the "AutomaticLoginEnable" in the "/etc/gdm/custom.conf" file with the following command: # grep -i automaticloginenable /etc/gdm/custom.conf AutomaticLoginEnable=false If the value of "AutomaticLoginEnable" is not set to "false", this is a finding.'
  remediation:
    remediation_step: 'Configure the operating system to not allow an unattended or automatic logon to the system via a graphical user interface. Note: If the system does not have GNOME installed, this requirement is Not Applicable. Add or edit the line for the "AutomaticLoginEnable" parameter in the \[daemon\] section of the "/etc/gdm/custom.conf" file to "false": \[daemon\] AutomaticLoginEnable=false'
  tags:
  - stig
  - rhel7
  - cm-6
  - cci-000366
