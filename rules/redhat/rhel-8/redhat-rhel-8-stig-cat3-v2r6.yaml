- rule_id: STIG-230294
  legacy_ids:
  - V-230294
  - SV-230294r1017105_rule
  - RHEL-08-010542
  rule_name: RHEL 8 must use a separate file system for the system audit data path.
  rule_description: The use of separate file systems for different paths can protect the system from failures resulting from a file system becoming full or failing.
  category: Auditing
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |-
      Verify that a separate file system/partition has been created for the system audit data path with the following command:

      Note: /var/log/audit is used as the example as it is a common location.

      $ sudo grep /var/log/audit /etc/fstab

      UUID=3645951a /var/log/audit xfs defaults 1 2

      If an entry for "/var/log/audit" does not exist, ask the System Administrator if the system audit logs are being written to a different file system/partition on the system, then grep for that file system/partition.

      If a separate file system/partition does not exist for the system audit data path, this is a finding.
    check_command: ''
    expected_value: ''
  remediation:
    remediation_step: Migrate the system audit data path onto a separate file system.
    rollback_supported: true
    reboot_required: false
    service_impact: ''
    estimated_time: 5 minutes
  id: STIG-230294
  title: RHEL 8 must use a separate file system for the system audit data path.
