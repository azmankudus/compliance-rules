- rule_id: STIG-230281
  legacy_ids:
  - V-230281
  - SV-230281r958936_rule
  - RHEL-08-010440
  rule_name: YUM must remove all software components after updated versions have been installed on RHEL 8.
  rule_description: Previous versions of software components that are not removed from the information system after updates have been installed may be exploited by adversaries. Some information technology products may remove older versions of software automatically from the information system.
  category: System Security
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |-
      Verify the operating system removes all software components after updated versions have been installed.

      Check if YUM is configured to remove unneeded packages with the following command:

      $ sudo grep -i clean_requirements_on_remove /etc/dnf/dnf.conf

      clean_requirements_on_remove=True

      If "clean_requirements_on_remove" is not set to either "1", "True", or "yes", commented out, or is missing from "/etc/dnf/dnf.conf", this is a finding.
    check_command: ''
    expected_value: ''
  remediation:
    remediation_step: |-
      Configure the operating system to remove all software components after updated versions have been installed.

      Set the "clean_requirements_on_remove" option to "True" in the "/etc/dnf/dnf.conf" file:

      clean_requirements_on_remove=True
    rollback_supported: true
    reboot_required: false
    service_impact: ''
    estimated_time: 5 minutes
