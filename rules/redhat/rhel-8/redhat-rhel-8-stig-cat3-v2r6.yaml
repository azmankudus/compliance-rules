- rule_id: STIG-230292
  legacy_ids:
  - V-230292
  - SV-230292r1017103_rule
  - RHEL-08-010540
  rule_name: RHEL 8 must use a separate file system for /var.
  rule_description: The use of separate file systems for different paths can protect the system from failures resulting from a file system becoming full or failing.
  category: File System
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |-
      Verify that a separate file system has been created for "/var".

      Check that a file system has been created for "/var" with the following command:

           $ sudo grep /var /etc/fstab

           /dev/mapper/...   /var   xfs   defaults,nodev 0 0

      If a separate entry for "/var" is not in use, this is a finding.
    check_command: ''
    expected_value: ''
  remediation:
    remediation_step: Migrate the "/var" path onto a separate file system.
    rollback_supported: true
    reboot_required: false
    service_impact: ''
    estimated_time: 5 minutes
  id: STIG-230292
  title: RHEL 8 must use a separate file system for /var.
  description: The use of separate file systems for different paths can protect the system from failures resulting from a file system becoming full or failing.
  severity: Low
  rationale: The use of separate file systems for different paths can protect the system from failures resulting from a file system becoming full or failing.
  tags:
