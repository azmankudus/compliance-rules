  rule_name: RHEL 8 must not allow blank or null passwords in the system-auth file.
  rule_description: If an account has an empty password, anyone could log on and run commands with the privileges of that account. Accounts with empty passwords should never be used in operational environments.
  category: Authentication
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |-
      To verify that null passwords cannot be used, run the following command:

      $ sudo grep -i nullok /etc/pam.d/system-auth

      If output is produced, this is a finding.
    check_command: ''
    expected_value: ''
  remediation:
    remediation_step: |-
      Remove any instances of the "nullok" option in the "/etc/pam.d/system-auth" file to prevent logons with empty passwords.

      Note: Manual changes to the listed file may be overwritten by the "authselect" program.
    rollback_supported: true
    reboot_required: false
    service_impact: ''
    estimated_time: 5 minutes
