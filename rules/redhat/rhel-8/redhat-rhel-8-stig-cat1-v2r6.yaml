- rule_id: STIG-230283
  legacy_ids:
  - V-230283
  - SV-230283r1017094_rule
  - RHEL-08-010460
  rule_name: There must be no shosts.equiv files on the RHEL 8 operating system.
  rule_description: The "shosts.equiv" files are used to configure host-based authentication for the system via SSH. Host-based authentication is not sufficient for preventing unauthorized access to the system, as it does not require interactive identification and authentication of a connection request, or for the use of two-factor authentication.
  category: File System
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |-
      Verify there are no "shosts.equiv" files on RHEL 8 with the following command:

      $ sudo find / -name shosts.equiv

      If a "shosts.equiv" file is found, this is a finding.
    check_command: ''
    expected_value: ''
  remediation:
    remediation_step: |-
      Remove any found "shosts.equiv" files from the system.

      $ sudo rm /etc/ssh/shosts.equiv
    rollback_supported: true
    reboot_required: false
    service_impact: ''
    estimated_time: 5 minutes
