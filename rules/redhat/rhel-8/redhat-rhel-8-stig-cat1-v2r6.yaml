- rule_id: STIG-230492
  legacy_ids:
  - V-230492
  - SV-230492r1134888_rule
  - RHEL-08-040010
  rule_name: RHEL 8 must not install packages from the Extra Packages for Enterprise Linux (EPEL) repository.
  rule_description: The EPEL is a repository of high-quality open-source packages for enterprise-class Linux distributions such as RHEL, CentOS, AlmaLinux, Rocky Linux, and Oracle Linux. These packages are not part of the official distribution but are built using the same Fedora build system to ensure compatibility and maintain quality standards.
  category: System Security
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |-
      Verify that RHEL 8 is not able to install packages from the EPEL with the following command:

      $ dnf repolist
      rhel-8-for-x86_64-appstream-rpms                      Red Hat Enterprise Linux 8 for x86_64 - AppStream (RPMs)
      rhel-8-for-x86_64-baseos-rpms                         Red Hat Enterprise Linux 8 for x86_64 - BaseOS (RPMs)
      rhel-8-for-x86_64-baseos-source-rpms                  Red Hat Enterprise Linux 8 for x86_64 - BaseOS (Source RPMs)
      rhel-8-for-x86_64-supplementary-rpms                  Red Hat Enterprise Linux 8 for x86_64 - Supplementary (RPMs)
      satellite-tools-6.10-for-rhel-8-x86_64-rpms           Red Hat Satellite Tools 6.10 for RHEL 8 x86_64 (RPMs)

      If any repositories containing the word "epel" in the name exist, this is a finding.
    check_command: ''
    expected_value: ''
  remediation:
    remediation_step: |-
      The repo package can be manually removed with the following command:

      $ sudo dnf remove epel-release

      Configure the operating system to disable use of the EPEL repository with the following command:

      $ sudo dnf config-manager --set-disabled epel
    rollback_supported: true
    reboot_required: false
    service_impact: ''
    estimated_time: 5 minutes
