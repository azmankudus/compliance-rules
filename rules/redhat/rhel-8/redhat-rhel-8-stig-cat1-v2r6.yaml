  rule_description: If an account has an empty password, anyone could log on and run commands with the privileges of that account. Accounts with empty passwords should never be used in operational environments.
  category: Authentication
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |-
      Check the "/etc/shadow" file for blank passwords with the following command:

      $ sudo awk -F: '!$2 {print $1}' /etc/shadow

      If the command returns any results, this is a finding.
    check_command: ''
    expected_value: ''
  remediation:
    remediation_step: |-
      Configure all accounts on the system to have a password or lock the account with the following commands:

      Perform a password reset:
      $ sudo passwd [username]
      Lock an account:
      $ sudo passwd -l [username]
    rollback_supported: true
    reboot_required: false
    service_impact: ''
    estimated_time: 5 minutes
