- rule_id: STIG-230531
  legacy_ids:
  - V-230531
  - SV-230531r1155396_rule
  - RHEL-08-040172
  rule_name: The systemd Ctrl-Alt-Delete burst key sequence in RHEL 8 must be disabled.
  rule_description: A locally logged-on user who presses Ctrl-Alt-Delete when at the console can reboot the system. If accidentally pressed, as could happen in the case of a mixed OS environment, this can create the risk of short-term loss of availability of systems due to unintentional reboot. In a graphical user environment, risk of unintentional reboot from the Ctrl-Alt-Delete sequence is reduced because the user will be prompted before any action is taken.
  category: System Security
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |-
      Verify RHEL 8 is configured to not reboot the system when Ctrl-Alt-Delete is pressed seven times within two seconds with the following command:

      $ sudo grep -iR CtrlAltDelBurstAction /etc/systemd/system*
      /etc/systemd/system.conf.d/55-CtrlAltDel-BurstAction:CtrlAltDelBurstAction=none

      If the "CtrlAltDelBurstAction" is not set to "none", commented out, or is missing, this is a finding.
    check_command: ''
    expected_value: ''
  remediation:
    remediation_step: |-
      Configure RHEL 8 to disable the CtrlAltDelBurstAction by adding it to a drop file in a "/etc/systemd/system.conf.d/" configuration file:

      If no drop file exists, create one with the following command:

      $ sudo mkdir -p /etc/systemd/system.conf.d && sudo vi /etc/systemd/system.conf.d/55-CtrlAltDel-BurstAction

      Edit the file to contain the setting by adding the following text:

      CtrlAltDelBurstAction=none

      Reload the daemon for this change to take effect.

      $ sudo systemctl daemon-reload
    rollback_supported: true
    reboot_required: false
    service_impact: ''
    estimated_time: 5 minutes
