compliance_info:
  framework: CIS
  version: 4.0.0
  profile: Level 2 - Server

profile:
  name: CIS Level 2 Server
  description: Enhanced security configuration for RHEL 8 servers
  level: 2

rules:
  - rule_id: CIS-L2-1.1.1.1
    rule_name: Ensure mounting of cramfs filesystems is disabled
    rule_description: Level 2 - The cramfs filesystem type should be disabled
    category: Filesystem
    subcategory: Filesystem Types
    testing_status: verified
    assessment:
      severity: Medium
      is_auto: true
      automation_level: Full
      audit_type: config
      detection_step: "Verify cramfs kernel module is disabled"
      check_command: "modprobe -n -v cramfs | grep -E '(install /bin/true|not found)'"
      expected_value: "install /bin/true or not found"
    remediation:
      remediation_step: "Create or edit /etc/modprobe.d/cramfs.conf with: install cramfs /bin/true"
      rollback_supported: true
      reboot_required: false
      service_impact: None
      estimated_time: "1 minute"
    context:
      rationale: "Unused filesystem drivers increase attack surface"
      impact: "Low - Reduces potential attack vectors"
      false_positive_risk: Low
    tags:
      - filesystem
      - kernel-modules
      - hardening
      - level2-server

  - rule_id: CIS-L2-4.1.1.1
    rule_name: Ensure auditd is installed
    rule_description: Level 2 - The audit daemon must be installed for security auditing
    category: Auditing
    subcategory: Audit Daemon
    testing_status: verified
    assessment:
      severity: High
      is_auto: true
      automation_level: Full
      audit_type: config
      detection_step: "Verify auditd package is installed"
      check_command: "rpm -q audit"
      expected_value: "audit-<version>"
    remediation:
      remediation_step: "Install audit: dnf install audit"
      rollback_supported: true
      reboot_required: false
      service_impact: None
      estimated_time: "1 minute"
    context:
      rationale: "Audit daemon is essential for security monitoring and compliance"
      impact: "Critical - Required for security auditing"
      false_positive_risk: None
    tags:
      - audit
      - auditing
      - monitoring
      - level2-server
      - critical
