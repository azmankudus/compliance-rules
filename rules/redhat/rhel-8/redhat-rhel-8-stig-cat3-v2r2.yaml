  rule_name: RHEL 8 must enable the hardware random number generator entropy gatherer service.
  rule_description: "The most important characteristic of a random number generator is its randomness, namely its ability to deliver random numbers that are impossible to predict. Entropy in computer security is associated with the unpredictability of a source of randomness.  The random source with high entropy tends to achieve a uniform distribution of random values. Random number generators are one of the most important building blocks of cryptosystems.  \n\nThe rngd service feeds random data from hardware device to kernel random device. Quality (nonpredictable) random number generation is important for several security functions (i.e., ciphers)."
  category: System Configuration
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "Note: For RHEL versions 8.4 and above running with kernel FIPS mode enabled as specified by RHEL-08-010020, this requirement is Not Applicable.\n\nCheck that  RHEL 8 has enabled the hardware random number generator entropy gatherer service.\n\nVerify the rngd service is enabled and active with the following commands:\n\n     $ sudo systemctl is-enabled rngd\n     enabled\n\n     $ sudo systemctl is-active rngd\n     active\n\nIf the service is not \"enabled\" and \"active\", this is a finding."
    check_command: ''
    expected_value: ''
  remediation:
    remediation_step: "Start the rngd service and enable the rngd service with the following commands:\n\n     $ sudo systemctl start rngd.service\n\n     $ sudo systemctl enable rngd.service"
    rollback_supported: true
    reboot_required: false
    service_impact: ''
    estimated_time: ''
  context:
    rationale: The most important characteristic of a random number generator is its randomness, namely its ability to deliver random numbers that are impossible to predict. Entropy in computer security is associate
    impact: ''
    false_positive_risk: None
    references:
    - type: CCI
      reference: CCI-000366
  tags:
  - stig
  - rhel8
- rule_id: RHEL-08-020024
  legacy_ids:
  - V-230346
  - SV-230346r1069306_rule
  rule_name: RHEL 8 must limit the number of concurrent sessions to ten for all accounts and/or account types.
  rule_description: 'Operating system management includes the ability to control the number of users and user sessions that utilize an operating system. Limiting the number of allowed users and sessions per user is helpful in reducing the risks related to DoS attacks.


    This requirement addresses concurrent sessions for information system accounts and does not address concurrent sessions by single users via multiple system accounts. The maximum number of concurrent sessions should be defined based on mission needs and the operational environment for each system.'
  category: System Configuration
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Verify the operating system limits the number of concurrent sessions to "10" for all accounts and/or account types by issuing the following command:


      $ sudo grep -r -s ''^[^#].*maxlogins'' /etc/security/limits.conf /etc/security/limits.d/*.conf


      /etc/security/limits.d/maxlogins.conf:* hard maxlogins 10


      This can be set as a global domain (with the * wildcard) but may be set differently for multiple domains.


      If the "maxlogins" item is missing, commented out, or the value is set greater than "10" and is not documented with the Information System Security Officer (ISSO) as an operational requirement for all domains that have the "maxlogins" item assigned, this is a finding.'
    check_command: ''
    expected_value: ''
  remediation:
    remediation_step: 'Configure the operating system to limit the number of concurrent sessions to "10" for all accounts and/or account types.


      Add the following line to the top of the /etc/security/limits.conf or in a ".conf" file defined in /etc/security/limits.d/:


      * hard maxlogins 10'
    rollback_supported: true
    reboot_required: false
    service_impact: ''
    estimated_time: ''
  context:
    rationale: Operating system management includes the ability to control the number of users and user sessions that utilize an operating system. Limiting the number of allowed users and sessions per user is helpfu
    impact: ''
    false_positive_risk: None
    references:
    - type: CCI
      reference: CCI-000054
  tags:
  - stig
  - rhel8
