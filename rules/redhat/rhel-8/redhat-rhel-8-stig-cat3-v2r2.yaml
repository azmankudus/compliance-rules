  rule_name: RHEL 8 must have the packages required to use the hardware random number generator entropy gatherer service.
  rule_description: "The most important characteristic of a random number generator is its randomness, namely its ability to deliver random numbers that are impossible to predict.  Entropy in computer security is associated with the unpredictability of a source of randomness.  The random source with high entropy tends to achieve a uniform distribution of random values.  Random number generators are one of the most important building blocks of cryptosystems.  \n\nThe rngd service feeds random data from hardware device to kernel random device. Quality (non-predictable) random number generation is important for several security functions (i.e., ciphers)."
  category: System Configuration
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Note: For RHEL versions 8.4 and above running with kernel FIPS mode enabled as specified by RHEL-08-010020, this requirement is Not Applicable.


      Check that RHEL 8 has the packages required to enabled the hardware random number generator entropy gatherer service with the following command:


      $ sudo yum list installed rng-tools


      rng-tools.x86_64                       6.8-3.el8                        @anaconda


      If the "rng-tools" package is not installed, this is a finding.'
    check_command: ''
    expected_value: ''
  remediation:
    remediation_step: 'Install the packages required to enabled the hardware random number generator entropy gatherer service with the following command:


      $ sudo yum install rng-tools'
    rollback_supported: true
    reboot_required: false
    service_impact: ''
    estimated_time: ''
  context:
    rationale: The most important characteristic of a random number generator is its randomness, namely its ability to deliver random numbers that are impossible to predict.  Entropy in computer security is associat
    impact: ''
    false_positive_risk: None
    references:
    - type: CCI
      reference: CCI-000366
  tags:
  - stig
  - rhel8
