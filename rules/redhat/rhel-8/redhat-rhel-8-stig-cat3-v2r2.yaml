  - SV-230485r1017269_rule
  rule_name: RHEL 8 must disable the chrony daemon from acting as a server.
  rule_description: 'Inaccurate time stamps make it more difficult to correlate events and can lead to an inaccurate analysis. Determining the correct time a particular event occurred on a system is critical when conducting forensic analysis and investigating system events. Sources outside the configured acceptable allowance (drift) may be inaccurate.


    Minimizing the exposure of the server functionality of the chrony daemon diminishes the attack surface.


    RHEL 8 utilizes the "timedatectl" command to view the status of the "systemd-timesyncd.service". The "timedatectl" status will display the local time, UTC, and the offset from UTC.


    Note that USNO offers authenticated NTP service to DOD and U.S. Government agencies operating on the NIPR and SIPR networks. Visit https://www.usno.navy.mil/USNO/time/ntp/DOD-customers for more information.'
  category: System Configuration
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Note: If the system is approved and documented by the information system security officer (ISSO) to function as an NTP time server, this requirement is Not Applicable.


      Verify RHEL 8 disables the chrony daemon from acting as a server with the following command:


      $ sudo grep -w ''port'' /etc/chrony.conf

      port 0


      If the "port" option is not set to "0", is commented out or missing, this is a finding.'
    check_command: ''
    expected_value: ''
  remediation:
    remediation_step: 'Configure the operating system to disable the chrony daemon from acting as a server by adding or modifying the following line in the "/etc/chrony.conf" file:


      port 0'
    rollback_supported: true
    reboot_required: false
    service_impact: ''
    estimated_time: ''
  context:
    rationale: Inaccurate time stamps make it more difficult to correlate events and can lead to an inaccurate analysis. Determining the correct time a particular event occurred on a system is critical when conducti
    impact: ''
    false_positive_risk: None
    references:
    - type: CCI
      reference: CCI-000381
  tags:
