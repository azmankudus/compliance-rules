  rule_description: 'It is detrimental for operating systems to provide, or install by default, functionality exceeding requirements or mission objectives. These unnecessary capabilities or services are often overlooked and therefore may remain unsecured. They increase the risk to the platform by providing additional attack vectors.


    The IEEE 1394 (FireWire) is a serial bus standard for high-speed real-time communication. Disabling FireWire protects the system against exploitation of any flaws in its implementation.'
  category: System Configuration
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Verify the operating system disables the ability to load the firewire-core kernel module and ensure that the firewire-core kernel module is disabled with the following command:


      $ sudo grep -r firewire-core /etc/modprobe.d/* | grep "blacklist"


      /etc/modprobe.d/blacklist.conf:install firewire-core /bin/false

      /etc/modprobe.d/blacklist.conf:blacklist firewire-core


      If the command does not return any output, or the line is commented out, and use of the firewire-core protocol is not documented with the Information System Security Officer (ISSO) as an operational requirement, this is a finding.'
    check_command: ''
    expected_value: ''
  remediation:
    remediation_step: "Configure the operating system to disable the ability to use the firewire-core kernel module.\n\nAdd or update the following lines in the file \"/etc/modprobe.d/blacklist.conf\":\n\n     install firewire-core /bin/false\n     blacklist firewire-core\n\nReboot the system for the settings to take effect."
    rollback_supported: true
    reboot_required: false
    service_impact: ''
    estimated_time: ''
  context:
    rationale: It is detrimental for operating systems to provide, or install by default, functionality exceeding requirements or mission objectives. These unnecessary capabilities or services are often overlooked a
    impact: ''
    false_positive_risk: None
    references:
    - type: CCI
      reference: CCI-000381
  tags:
  - stig
  - rhel8
