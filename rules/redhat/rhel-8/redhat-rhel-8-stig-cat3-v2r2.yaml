- rule_id: RHEL-08-040310
  legacy_ids:
  - V-230552
  - SV-230552r1101902_rule
  rule_name: The RHEL 8 file integrity tool must be configured to verify Access Control Lists (ACLs).
  rule_description: 'ACLs can provide permissions beyond those permitted through the file mode and must be verified by file integrity tools.


    Selection lines in the aide.conf file determine which files and directories AIDE will monitor for changes. They follow this format:


    <path> <rules>


    The <path> specifies a file, directory or wildcard pattern to monitor.

    The <rules>define which attributes (hashes, permissions, timestamps, etc.) to check.


    RHEL 8 installation media come with a file integrity tool, Advanced Intrusion Detection Environment (AIDE).'
  category: System Configuration
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Verify the file integrity tool is configured to verify ACLs.


      Note: AIDE is highly configurable at install time. This requirement assumes the "aide.conf" file is under the "/etc" directory.


      If AIDE is not installed, ask the system administrator (SA) how file integrity checks are performed on the system.


      Use the following command to determine if the file is in a location other than "/etc/aide/aide.conf":


      $ sudo find / -name aide.conf


      Use the following command to review the "aide.conf" file to determine if the "acl" rule has been added to the rule list being applied to the files and directories selection lists:


      $ sudo cat /etc/aide.conf | more


      If the "acl" rule is not being used on all selection lines in the "/etc/aide.conf" file, is commented out, or ACLs are not being checked by another file integrity tool, this is a finding.'
    check_command: ''
    expected_value: ''
  remediation:
    remediation_step: "Configure the file integrity tool to check file and directory ACLs. \n\nIf AIDE is installed, ensure the \"acl\" rule is present on all file and directory selection lists."
    rollback_supported: true
    reboot_required: false
    service_impact: ''
    estimated_time: ''
  context:
    rationale: 'ACLs can provide permissions beyond those permitted through the file mode and must be verified by file integrity tools.


      Selection lines in the aide.conf file determine which files and directories AID'
    impact: ''
    false_positive_risk: None
    references:
    - type: CCI
      reference: CCI-000366
  tags:
  - stig
  - rhel8
- rule_id: RHEL-08-010472
  legacy_ids:
