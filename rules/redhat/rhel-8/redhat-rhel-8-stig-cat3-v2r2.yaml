    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Verify users are provided with feedback on when account accesses last occurred with the following command:


      $ sudo grep pam_lastlog /etc/pam.d/postlogin


      session required pam_lastlog.so showfailed


      If "pam_lastlog.so" is missing from "/etc/pam.d/postlogin" file, or the silent option is present, this is a finding.'
