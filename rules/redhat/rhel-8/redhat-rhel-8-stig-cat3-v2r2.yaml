- rule_id: RHEL-08-010375
  legacy_ids:
  - V-230269
  - SV-230269r1017087_rule
  rule_name: RHEL 8 must restrict access to the kernel message buffer.
  rule_description: 'Preventing unauthorized information transfers mitigates the risk of information, including encrypted representations of information, produced by the actions of prior users/roles (or the actions of processes acting on behalf of prior users/roles) from being available to any current users/roles (or current processes) that obtain access to shared system resources (e.g., registers, main memory, hard disks) after those resources have been released back to information systems. The control of information in shared resources is also commonly referred to as object reuse and residual information protection.


    This requirement generally applies to the design of an information technology product, but it can also apply to the configuration of particular information system components that are, or use, such products. This can be verified by acceptance/validation processes in DoD or other government agencies.


    There may be shared resources with configurable protections (e.g., files in storage) that may be assessed on specific information system components.


    Restricting access to the kernel message buffer limits access to only root. This prevents attackers from gaining additional system information as a non-privileged user.


    The sysctl --system command will load settings from all system configuration files. All configuration files are sorted by their filename in lexicographic order, regardless of which of the directories they reside in. If multiple files specify the same option, the entry in the file with the lexicographically latest name will take precedence. Files are read from directories in the following list from top to bottom. Once a file of a given filename is loaded, any file of the same name in subsequent directories is ignored.

    /etc/sysctl.d/*.conf

    /run/sysctl.d/*.conf

    /usr/local/lib/sysctl.d/*.conf

    /usr/lib/sysctl.d/*.conf

    /lib/sysctl.d/*.conf

    /etc/sysctl.conf'
  category: System Configuration
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Verify the operating system is configured to restrict access to the kernel message buffer with the following commands:


      Check the status of the kernel.dmesg_restrict kernel parameter.


      $ sudo sysctl kernel.dmesg_restrict


      kernel.dmesg_restrict = 1


      If "kernel.dmesg_restrict" is not set to "1" or is missing, this is a finding.


      Check that the configuration files are present to enable this kernel parameter.


      $ sudo grep -r kernel.dmesg_restrict /run/sysctl.d/*.conf /usr/local/lib/sysctl.d/*.conf /usr/lib/sysctl.d/*.conf /lib/sysctl.d/*.conf /etc/sysctl.conf /etc/sysctl.d/*.conf


      /etc/sysctl.d/99-sysctl.conf:kernel.dmesg_restrict = 1


      If "kernel.dmesg_restrict" is not set to "1", is missing or commented out, this is a finding.


      If conflicting results are returned, this is a finding.'
    check_command: ''
    expected_value: ''
  remediation:
    remediation_step: "Configure the operating system to restrict access to the kernel message buffer.\n\nAdd or edit the following line in a system configuration file, in the \"/etc/sysctl.d/\" directory:\n\nkernel.dmesg_restrict = 1\n\nRemove any configurations that conflict with the above from the following locations: \n/run/sysctl.d/*.conf\n/usr/local/lib/sysctl.d/*.conf\n/usr/lib/sysctl.d/*.conf\n/lib/sysctl.d/*.conf\n/etc/sysctl.conf\n/etc/sysctl.d/*.conf\n\nLoad settings from all system configuration files with the following command:\n\n$ sudo sysctl --system"
    rollback_supported: true
    reboot_required: false
    service_impact: ''
    estimated_time: ''
  context:
    rationale: Preventing unauthorized information transfers mitigates the risk of information, including encrypted representations of information, produced by the actions of prior users/roles (or the actions of pro
    impact: ''
    false_positive_risk: None
    references:
    - type: CCI
      reference: CCI-001090
