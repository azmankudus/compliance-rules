  rule_name: RHEL 8 must use a separate file system for /var.
  rule_description: The use of separate file systems for different paths can protect the system from failures resulting from a file system becoming full or failing.
  category: System Configuration
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "Verify that a separate file system has been created for \"/var\".\n\nCheck that a file system has been created for \"/var\" with the following command:\n\n     $ sudo grep /var /etc/fstab\n\n     /dev/mapper/...   /var   xfs   defaults,nodev 0 0\n\nIf a separate entry for \"/var\" is not in use, this is a finding."
    check_command: ''
    expected_value: ''
  remediation:
    remediation_step: Migrate the "/var" path onto a separate file system.
    rollback_supported: true
    reboot_required: false
    service_impact: ''
    estimated_time: ''
  context:
    rationale: The use of separate file systems for different paths can protect the system from failures resulting from a file system becoming full or failing.
    impact: ''
    false_positive_risk: None
    references:
    - type: CCI
      reference: CCI-000366
  tags:
  - stig
