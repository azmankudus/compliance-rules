  rule_name: RHEL 8 must resolve audit information before writing to disk.
  rule_description: 'Without establishing what type of events occurred, the source of events, where events occurred, and the outcome of events, it would be difficult to establish, correlate, and investigate the events leading up to an outage or attack.


    Audit record content that may be necessary to satisfy this requirement includes, for example, time stamps, source and destination addresses, user/process identifiers, event descriptions, success/fail indications, filenames involved, and access control or flow control rules invoked.


    Enriched logging aids in making sense of who, what, and when events occur on a system.  Without this, determining root cause of an event will be much more difficult.'
  category: System Configuration
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Verify the RHEL 8 Audit Daemon is configured to resolve audit information before writing to disk, with the following command:


      $ sudo grep "log_format" /etc/audit/auditd.conf


      log_format = ENRICHED


      If the "log_format" option is not "ENRICHED", or the line is commented out, this is a finding.'
    check_command: ''
    expected_value: ''
  remediation:
    remediation_step: 'Edit the /etc/audit/auditd.conf file and add or update the "log_format" option:


      log_format = ENRICHED


      The audit daemon must be restarted for changes to take effect.'
    rollback_supported: true
    reboot_required: false
    service_impact: ''
    estimated_time: ''
  context:
    rationale: Without establishing what type of events occurred, the source of events, where events occurred, and the outcome of events, it would be difficult to establish, correlate, and investigate the events lea
    impact: ''
    false_positive_risk: None
    references:
    - type: CCI
      reference: CCI-000366
  tags:
  - stig
  - rhel8
