  rule_name: RHEL 8 must have policycoreutils package installed.
  rule_description: 'Without verification of the security functions, security functions may not operate correctly and the failure may go unnoticed. Security function is defined as the hardware, software, and/or firmware of the information system responsible for enforcing the system security policy and supporting the isolation of code and data on which the protection is based. Security functionality includes, but is not limited to, establishing system accounts, configuring access authorizations (i.e., permissions, privileges), setting events to be audited, and setting intrusion detection parameters.


    Policycoreutils contains the policy core utilities that are required for basic operation of an SELinux-enabled system. These utilities include load_policy to load SELinux policies, setfile to label filesystems, newrole to switch roles, and run_init to run /etc/init.d scripts in the proper context.'
  category: System Configuration
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Verify the operating system has the policycoreutils package installed with the following command:


      $ sudo yum list installed policycoreutils


      policycoreutils.x86_64                                              2.9-3.el8                                                  @anaconda


      If the policycoreutils package is not installed, this is a finding.'
    check_command: ''
    expected_value: ''
  remediation:
    remediation_step: 'Configure the operating system to have the policycoreutils package installed with the following command:


      $ sudo yum install policycoreutils'
    rollback_supported: true
    reboot_required: false
    service_impact: ''
    estimated_time: ''
  context:
    rationale: Without verification of the security functions, security functions may not operate correctly and the failure may go unnoticed. Security function is defined as the hardware, software, and/or firmware o
    impact: ''
    false_positive_risk: None
    references:
    - type: CCI
      reference: CCI-001084
  tags:
  - stig
  - rhel8
- rule_id: RHEL-08-010292
  legacy_ids:
  - V-230253
  - SV-230253r1044799_rule
  rule_name: RHEL 8 must ensure the SSH server uses strong entropy.
  rule_description: 'The most important characteristic of a random number generator is its randomness, namely its ability to deliver random numbers that are impossible to predict. Entropy in computer security is associated with the unpredictability of a source of randomness. The random source with high entropy tends to achieve a uniform distribution of random values. Random number generators are one of the most important building blocks of cryptosystems.


    The SSH implementation in RHEL 8 uses the OPENSSL library, which does not use high-entropy sources by default. By using the SSH_USE_STRONG_RNG environment variable the OPENSSL random generator is reseeded from /dev/random. This setting is not recommended on computers without the hardware random generator because insufficient entropy causes the connection to be blocked until enough entropy is available.'
  category: System Configuration
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Note: If the operating system is RHEL versions 8.0 or 8.1, this requirement is not applicable.


      Verify the operating system SSH server uses strong entropy with the following command:


      $ sudo grep -i ssh_use_strong_rng /etc/sysconfig/sshd


      SSH_USE_STRONG_RNG=32


      If the "SSH_USE_STRONG_RNG" line does not equal "32", is commented out, or is missing, this is a finding.'
    check_command: ''
    expected_value: ''
  remediation:
    remediation_step: 'Configure the operating system SSH server to use strong entropy.


      Add or modify the following line in the "/etc/sysconfig/sshd" file.


      SSH_USE_STRONG_RNG=32


      The SSH service must be restarted for changes to take effect.


      Restart the SSH Daemon with the following command:


      $ sudo systemctl restart sshd.service'
    rollback_supported: true
    reboot_required: false
    service_impact: ''
    estimated_time: ''
  context:
    rationale: The most important characteristic of a random number generator is its randomness, namely its ability to deliver random numbers that are impossible to predict. Entropy in computer security is associate
    impact: ''
    false_positive_risk: None
    references:
    - type: CCI
      reference: CCI-000366
  tags:
  - stig
  - rhel8
