  rule_name: The RHEL 8 file integrity tool must be configured to verify extended attributes.
  rule_description: 'Extended attributes in file systems are used to contain arbitrary data and file metadata with security implications.


    RHEL 8 installation media come with a file integrity tool, Advanced Intrusion Detection Environment (AIDE).'
  category: System Configuration
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "Verify the file integrity tool is configured to verify extended attributes.\n\nIf AIDE is not installed, ask the System Administrator how file integrity checks are performed on the system.\n\nNote: AIDE is highly configurable at install time. This requirement assumes the \"aide.conf\" file is under the \"/etc\" directory.\n\nUse the following command to determine if the file is in another location:\n\n$ sudo find / -name aide.conf\n\nCheck the \"aide.conf\" file to determine if the \"xattrs\" rule has been added to the rule list being applied to the files and directories selection lists.\n\nAn example rule that includes the \"xattrs\" rule follows:\n\nAll= p+i+n+u+g+s+m+S+sha512+acl+xattrs+selinux\n/bin All # apply the custom rule to the files in bin \n/sbin All # apply the same custom rule to the files in sbin \n\nIf the \"xattrs\" rule is not being used on all uncommented selection lines in the \"/etc/aide.conf\" file, or extended attributes are not being checked by\
      \ another file integrity tool, this is a finding."
    check_command: ''
    expected_value: ''
  remediation:
    remediation_step: "Configure the file integrity tool to check file and directory extended attributes. \n\nIf AIDE is installed, ensure the \"xattrs\" rule is present on all uncommented file and directory selection lists."
    rollback_supported: true
    reboot_required: false
    service_impact: ''
    estimated_time: ''
  context:
    rationale: 'Extended attributes in file systems are used to contain arbitrary data and file metadata with security implications.


      RHEL 8 installation media come with a file integrity tool, Advanced Intrusion Dete'
    impact: ''
    false_positive_risk: None
    references:
    - type: CCI
      reference: CCI-000366
