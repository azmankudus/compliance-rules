    rule_name: Oracle WebLogic must use cryptographic modules that meet FIPS 140-2 requirements when encrypting stored data.
    rule_description: FIPS 140-2 is the current standard for validating cryptographic modules. Application servers must provide FIPS-compliant encryption modules.
