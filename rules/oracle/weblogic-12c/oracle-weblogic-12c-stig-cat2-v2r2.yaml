        2. Verify JAVA_OPTIONS and PRE_CLASSPATH variables are set correctly for FIPS
        If FIPS is not configured correctly, this is a finding.
    remediation:
      remediation_step: |
        1. Set JAVA_OPTIONS to include FIPS java.security properties
        2. Set PRE_CLASSPATH to include jcmFIPS.jar and sslj.jar
        3. Restart servers
      rollback_supported: true
      reboot_required: true
      service_impact: Server restart required
      estimated_time: "30 minutes"
    tags:
