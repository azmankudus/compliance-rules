    subcategory: Information Disclosure
    assessment:
      severity: Medium
      is_auto: true
      automation_level: Full
      audit_type: config
      detection_step: |
        1. Check httpd.conf for Options directive
        2. Verify Indexes is disabled
      check_command: |
        grep -E "Options.*Indexes" httpd.conf | grep -v "^#"
    remediation:
      remediation_step: |
        1. Edit httpd.conf
        2. Disable directory listing:
           Options -Indexes
        3. Restart Oracle HTTP Server
      reboot_required: false
