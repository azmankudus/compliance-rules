  - rule_id: OHS12-038
    rule_name: Secure Wallet File Permissions
    rule_description: |
      Set appropriate file permissions on SSL wallet files
      to prevent unauthorized access.
    category: Encryption
    subcategory: Certificate Management
    assessment:
      severity: Critical
      is_auto: true
      automation_level: Full
      audit_type: config
      detection_step: |
        1. Check wallet directory permissions
        2. Verify only authorized users have access
      check_command: |
        ls -la ${ORACLE_INSTANCE}/config/fmwconfig/components/OHS/*/keystores/
    remediation:
      remediation_step: |
        1. Set wallet directory permissions:
           chmod 700 keystores/
        2. Set wallet file permissions:
           chmod 600 keystores/default/*
        3. Ensure owner is the OHS process owner
      reboot_required: false
    tags:
      - certificate
      - file-permissions

  - rule_id: OHS12-039
    rule_name: Configure Security Headers
    rule_description: |
      Configure HTTP security headers including X-Frame-Options,
      X-Content-Type-Options, and X-XSS-Protection.
    category: Application Security
    subcategory: HTTP Headers
    assessment:
      severity: Medium
      is_auto: true
      automation_level: Full
      audit_type: config
      detection_step: |
        1. Check httpd.conf for Header directives
        2. Verify security headers are configured
      check_command: |
        grep -E "Header.*X-Frame-Options|Header.*X-Content-Type|Header.*X-XSS" httpd.conf
    remediation:
      remediation_step: |
        1. Edit httpd.conf
        2. Add security headers:
           Header always set X-Frame-Options "SAMEORIGIN"
           Header always set X-Content-Type-Options "nosniff"
           Header always set X-XSS-Protection "1; mode=block"
        3. Restart Oracle HTTP Server
      reboot_required: false
    tags:
      - security-headers
      - xss

  - rule_id: OHS12-040
    rule_name: Configure mod_certheaders
    rule_description: |
      Configure mod_certheaders appropriately when using
      a load balancer or reverse proxy that terminates SSL.
    category: Network Security
    subcategory: Proxy Configuration
    assessment:
      severity: Medium
      is_auto: true
      automation_level: Full
      audit_type: config
      detection_step: |
        1. Check httpd.conf for mod_certheaders directives
        2. Verify configuration is appropriate for deployment
      check_command: |
        grep -E "AddCertHeader|SimulateHttps" httpd.conf 2>/dev/null
    remediation:
      remediation_step: |
        1. Edit httpd.conf
        2. Configure mod_certheaders if behind SSL-terminating proxy:
           AddCertHeader SSL_CLIENT_CERT
           SimulateHttps on
        3. Restart Oracle HTTP Server
      reboot_required: false
    tags:
      - proxy
      - ssl
