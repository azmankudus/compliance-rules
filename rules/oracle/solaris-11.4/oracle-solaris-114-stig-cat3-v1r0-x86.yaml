- rule_id: SV-216200r959010
  rule_name: The operating system must have no files with extended attributes.
  rule_description: Attackers or malicious users could hide information, exploits, etc. in extended attribute areas. Since extended attributes are rarely used, it is important to find files with extended attributes set and correct these attributes.
  category: Security
  subcategory: '216200'
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'The root role is required.


      Identify all files with extended attributes.


      # find / \( -fstype nfs -o -fstype cachefs -o -fstype autofs \

