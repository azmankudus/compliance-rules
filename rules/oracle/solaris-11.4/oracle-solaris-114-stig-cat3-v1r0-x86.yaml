- rule_id: SV-216224r959010
  rule_name: The system must not have any unnecessary accounts.
  rule_description: Accounts providing no operational purpose provide additional opportunities for system compromise. Unnecessary accounts include user accounts for individuals not requiring access to the system and application accounts for applications not installed on the system.
  category: Security
  subcategory: '216224'
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
