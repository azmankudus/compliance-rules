- rule_id: SV-220010r958870
  rule_name: The operating system must employ cryptographic mechanisms to protect information in storage.
  rule_description: "When data is written to digital media, such as hard drives, mobile computers, external/removable hard drives, personal digital assistants, flash/thumb drives, etc., there is risk of data loss and data compromise. \n\nAn organizational assessment of risk guides the selection of media and associated information contained on the media requiring restricted access. Organizations need to document in policy and procedures the media requiring restricted access, individuals authorized to access the media, and the specific measures taken to restrict access. \n\nFewer protection measures are needed for media containing information determined by the organization to be in the public domain, to be publicly releasable, or to have limited or no adverse impact if accessed by other than authorized personnel. In these situations, it is assumed the physical access controls where the media resides provide adequate protection. \n\nAs part of a defense-in-depth strategy, the organization considers\
    \ routinely encrypting information at rest on selected secondary storage devices. The employment of cryptography is at the discretion of the information owner/steward. The selection of the cryptographic mechanisms used is based upon maintaining the confidentiality and integrity of the information."
  category: Security
  subcategory: '220010'
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "Determine if file system encryption is required by your organization. If not required, this item does not apply.\n\nDetermine if file system encryption is enabled for user data sets. This check does not apply to the root, var, share, swap or dump datasets.\n\n# zfs list \n\nUsing the file system name, determine if the file system is encrypted:\n\n# zfs get encryption [filesystem] \n\nIf \"encryption off\" is listed, this is a finding."
    check_command: Determine if file system encryption is required by your organization. If not required, this item does not apply.
  remediation:
    remediation_step: 'The ZFS file system management profile is required.


      ZFS file system encryption may only be enabled on creation of the file system. If a file system must be encrypted and is not, its data should be archived, it must be removed and re-created.


      First, stop running applications using the file systems, archive the data, unmount, and then remove the file system.


      # umount [file system name]

      # zfs destroy [file system name]


      When creating ZFS file systems, ensure that they are created as encrypted file systems.


      # pfexec zfs create -o encryption=on [file system name]

      Enter passphrase for ''[file system name]'': xxxxxxx

      Enter again: xxxxxxx


      Store the passphrase in a safe location. The passphrase will be required to mount the file systems upon system reboot. If automated mounting is required, the passphrase must be stored in a file.'
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: "When data is written to digital media, such as hard drives, mobile computers, external/removable hard drives, personal digital assistants, flash/thumb drives, etc., there is risk of data loss and data compromise. \n\nAn organizational assessment of risk guides the selection of media and associated information contained on the media requiring restricted access. Organizations need to document in policy and procedures the media requiring restricted access, individuals authorized to access the media, and the specific measures taken to restrict access. \n\nFewer protection measures are needed for media containing information determined by the organization to be in the public domain, to be publicly releasable, or to have limited or no adverse impact if accessed by other than authorized personnel. In these situations, it is assumed the physical access controls where the media resides provide adequate protection. \n\nAs part of a defense-in-depth strategy, the organization considers\
      \ routinely encrypting information at rest on selected secondary storage devices. The employment of cryptography is at the discretion of the information owner/steward. The selection of the cryptographic mechanisms used is based upon maintaining the confidentiality and integrity of the information."
    impact: Low
    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-220010r958870_rule - V-220010
  tags:
  - stig
  - low
  - v-220010
