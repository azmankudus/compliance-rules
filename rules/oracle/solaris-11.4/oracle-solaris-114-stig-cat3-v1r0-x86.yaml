- rule_id: SV-216198r959010
  rule_name: All valid SUID/SGID files must be documented.
  rule_description: There are valid reasons for SUID/SGID programs, but it is important to identify and review such programs to ensure they are legitimate.
  category: Security
  subcategory: '216198'
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "The root role is required.\n\n# find / \\( -fstype nfs -o -fstype cachefs -o -fstype autofs \\\n-o -fstype ctfs -o -fstype mntfs -o -fstype objfs \\\n-o -fstype proc \\) -prune -o -type f -perm -4000 -o \\\n-perm -2000 -print\n\nOutput should only be Solaris-provided files and approved customer files.\n\nSolaris-provided SUID/SGID files can be listed using the command: \n\n# pkg contents -a mode=4??? -a mode=2??? -t file -o pkg.name,path,mode\n\nDigital signatures on the Solaris Set-UID binaries can be verified with the elfsign utility, such as this example:\n\n# elfsign verify -e /usr/bin/su\nelfsign: verification of /usr/bin/su passed.\n\nThis message indicates that the binary is properly signed.\n\nIf non-vendor provided or non-approved files are included in the list, this is a finding."
    check_command: The root role is required.
  remediation:
    remediation_step: 'The root role is required.


      Determine the existence of any set-UID programs that do not belong on the system, and work with the owners (or system administrator) to determine the best course of action in accordance with site policy.'
