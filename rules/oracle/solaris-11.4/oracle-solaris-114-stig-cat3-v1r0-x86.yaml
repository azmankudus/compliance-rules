- rule_id: SV-216239r959010
  rule_name: The limitpriv zone option must be set to the vendor default or less permissive.
  rule_description: Solaris zones can be assigned privileges generally reserved for the global zone using the "limitpriv" zone option. Any privilege assignments in excess of the vendor defaults may provide the ability for a non-global zone to compromise the global zone.
  category: Security
  subcategory: '216239'
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'This check applies to the global zone only. Determine the zone that you are currently securing.


      # zonename


      If the command output is "global", this check applies.


      List the non-global zones on the system.


      # zoneadm list -vi | grep -v global


      From the output list of non-global zones found, determine if any are Kernel zones.


      # zoneadm list -cv | grep [zonename] | grep solaris-kz


      Exclude any Kernel zones found from the list of local zones.


      List the configuration for each zone.


      # zonecfg -z [zonename] info |grep limitpriv


      If the output of this command has a setting for limitpriv and it is not:

      limitpriv: default


      this is a finding.'
    check_command: This check applies to the global zone only. Determine the zone that you are currently securing.
  remediation:
    remediation_step: "This check applies to the global zone only. Determine the zone that you are currently securing.\n\n# zonename\n\nIf the command output is \"global\", this check applies.\n\nThe Zone Security profile is required:\n\nChange the \"limitpriv\" setting to default. \n\n# pfexec zonecfg -z [zone] set limitpriv=default"
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: Solaris zones can be assigned privileges generally reserved for the global zone using the "limitpriv" zone option. Any privilege assignments in excess of the vendor defaults may provide the ability for a non-global zone to compromise the global zone.
