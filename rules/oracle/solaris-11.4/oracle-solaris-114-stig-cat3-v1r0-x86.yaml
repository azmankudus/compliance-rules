    automation_level: Full
    audit_type: config
    detection_step: 'Determine if SSH is configured to disconnect sessions after 10 minutes of inactivity.


      # grep ClientAlive /etc/ssh/sshd_config


      If the output of this command is not:


      ClientAliveInterval 600

      ClientAliveCountMax 0


      this is a finding.'
    check_command: Determine if SSH is configured to disconnect sessions after 10 minutes of inactivity.
  remediation:
    remediation_step: "The root role is required.\n\nConfigure the system to disconnect SSH sessions after 10 minutes of inactivity.\n\nModify the sshd_config file:\n\n# pfedit /etc/ssh/sshd_config\n\nModify or add the lines containing:\n\nClientAliveInterval\nClientAliveCountMax \n\nChange them to:\n\nClientAliveInterval 600\nClientAliveCountMax 0\n\nRestart the SSH service:\n\n# svcadm restart svc:/network/ssh"
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: "This requirement applies to both internal and external networks. \n\nTerminating network connections associated with communications sessions means de-allocating associated TCP/IP address/port pairs at the operating system level.\n\nThe time period of inactivity may, as the organization deems necessary, be a set of time periods by type of network access or for specific accesses."
    impact: Low
