- rule_id: SV-216159r958390
  rule_name: The operating system must display the DoD approved system use notification message or banner for SSH connections.
  rule_description: Warning messages inform users who are attempting to log in to the system of their legal status regarding the system and must include the name of the organization that owns the system and any monitoring policies that are in place. As implementing a logon banner to deter inappropriate use can provide a foundation for legal action against abuse, this warning content should be set as appropriate.
  category: Security
  subcategory: '216159'
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check SSH configuration for banner message:


      # grep "^Banner" /etc/ssh/sshd_config


      If the output is not:

      Banner /etc/issue

      and /etc/issue does not contain the approved banner text, this is a finding.'
    check_command: 'Check SSH configuration for banner message:'
  remediation:
    remediation_step: 'The root role is required.


      Edit the SSH configuration file.


      # pfedit /etc/ssh/sshd_config


      Locate the file containing:


      Banner


      Change the line to read:


      Banner /etc/issue


      Edit the /etc/issue file


      # pfedit /etc/issue


      The DoD required text is:


      "You are accessing a U.S. Government (USG) Information System (IS) that is provided for USG-authorized use only. By using this IS (which includes any device attached to this IS), you consent to the following conditions:

      -The USG routinely intercepts and monitors communications on this IS for purposes including, but not limited to, penetration testing, COMSEC monitoring, network operations and defense, personnel misconduct (PM), law enforcement (LE), and counterintelligence (CI) investigations.

      -At any time, the USG may inspect and seize data stored on this IS.

      -Communications using, or data stored on, this IS are not private, are subject to routine monitoring, interception, and search, and may be disclosed or used for any USG-authorized purpose.

      -This IS includes security measures (e.g., authentication and access controls) to protect USG interests -- not for your personal benefit or privacy. -Notwithstanding the above, using this IS does not constitute consent to PM, LE or CI investigative searching or monitoring of the content of privileged communications, or work product, related to personal representation or services by attorneys, psychotherapists, or clergy, and their assistants. Such communications and work product are private and confidential. See User Agreement for details."


      Restart the SSH service


      # svcadm restart svc:/network/ssh'
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: Warning messages inform users who are attempting to log in to the system of their legal status regarding the system and must include the name of the organization that owns the system and any monitoring policies that are in place. As implementing a logon banner to deter inappropriate use can provide a foundation for legal action against abuse, this warning content should be set as appropriate.
    impact: Low
    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-216159r958390_rule - V-216159
  tags:
  - stig
  - low
  - v-216159
- rule_id: SV-216030r958406
  rule_name: The audit system must be configured to audit login, logout, and session initiation.
  rule_description: Without auditing, individual system accesses cannot be tracked, and malicious activity cannot be detected and traced back to an individual account.
  category: Security
  subcategory: '216030'
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "The Audit Configuration profile is required.\n\nCheck that the audit flag for auditing login and logout is enabled.\n\nThis check applies to the global zone only. Determine the zone that you are currently securing.\n\n# zonename\n\nIf the command output is \"global\", this check applies.\n\nDetermine the OS version you are currently securing.\n# uname \u2013v\n\nFor Solaris 11, 11.1, 11.2, and 11.3:\n# pfexec auditconfig -getflags | grep active | cut -f2 -d=\n\nIf \"lo\" audit flag is not included in output, this is a finding\n\n# pfexec auditconfig -getnaflags | grep active | cut -f2 -d=\n\nIf \"na\" and \"lo\" audit flags are not included in output, this is a finding\n\nFor Solaris 11.4 or newer:\n# pfexec auditconfig -t -getflags | cut -f2 -d=\n\nIf \"cusa\" or if the \"ft,lo,ap,ss,as,ua,pe\u201D audit flag(s) are not included in output, this is a finding\n\n# pfexec auditconfig -t -getnaflags | cut -f2 -d=\n\nIf \"na\" and \"lo\" audit flags are not included in output,\
      \ this is a finding\n\nDetermine if auditing policy is set to collect command line arguments.\n\n# pfexec auditconfig -getpolicy | grep active | grep argv\n\nIf the active audit policies line does not appear, this is a finding."
    check_command: The Audit Configuration profile is required.
  remediation:
    remediation_step: 'The Audit Configuration profile is required. All audit flags must be enabled in a single command.


      This action applies to the global zone only. Determine the zone that you are currently securing.


      # zonename


      If the command output is "global", this action applies.


      For Solaris 11, 11.1, 11.2, and 11.3:

      # pfexec auditconfig -setflags cusa,-ps,fd,-fa,fm

      # pfexec auditconfig -setnaflags lo,na


      For Solaris 11.4 or newer:

      # pfexec auditconfig -setflags cusa,-fa,-ex,-ps,fd,fm

      # pfexec auditconfig -setnaflags lo,na


      Enable the audit policy to collect command line arguments.


      # pfexec auditconfig -setpolicy +argv


      These changes will not affect users that are currently logged in.'
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: Without auditing, individual system accesses cannot be tracked, and malicious activity cannot be detected and traced back to an individual account.
    impact: Low
    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-216030r958406_rule - V-216030
  tags:
  - stig
  - low
  - v-216030
