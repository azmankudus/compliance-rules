- rule_id: SV-216087r958364
  rule_name: The operating system must automatically terminate temporary accounts within 72 hours.
  rule_description: "If temporary user accounts remain active when no longer needed or for an excessive period, these accounts may be used to gain unauthorized access. To mitigate this risk, automated termination of all temporary accounts must be set upon account creation. \n\nTemporary accounts are established as part of normal account activation procedures when there is a need for short-term accounts without the demand for immediacy in account activation. \n\nIf temporary accounts are used, the operating system must be configured to automatically terminate these types of accounts after a DoD-defined time period of 72 hours.\n\nWhen temporary and emergency accounts are created, there is a risk the temporary account may remain in place and active after the need for the account no longer exists.\n\nTo address this, in the event temporary accounts are required, accounts designated as temporary in nature must be automatically terminated after 72 hours. Such a process and capability greatly\
    \ reduces the risk of accounts being misused, hijacked, or data compromised."
  category: Security
  subcategory: '216087'
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'The root role is required.


      Determine if an expiration date is set for temporary accounts.


      # logins -aox |awk -F: ''($14 == "0") {print}''


      This command produces a list of accounts with no expiration date set. If any of these accounts are temporary accounts, this is a finding.


      # logins -aox |awk -F: ''($14 != "0") {print}''


      This command produces a list of accounts with an expiration date set as defined in the last field. If any accounts have a date that is not within 72 hours, this is a finding.'
    check_command: The root role is required.
  remediation:
    remediation_step: 'The User Security role is required.


      Apply an expiration date to temporary users.


      # pfexec usermod -e "[date]" [username]


      Enter the date in the form mm/dd/yyyy such that it is within 72 hours.'
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: "If temporary user accounts remain active when no longer needed or for an excessive period, these accounts may be used to gain unauthorized access. To mitigate this risk, automated termination of all temporary accounts must be set upon account creation. \n\nTemporary accounts are established as part of normal account activation procedures when there is a need for short-term accounts without the demand for immediacy in account activation. \n\nIf temporary accounts are used, the operating system must be configured to automatically terminate these types of accounts after a DoD-defined time period of 72 hours.\n\nWhen temporary and emergency accounts are created, there is a risk the temporary account may remain in place and active after the need for the account no longer exists.\n\nTo address this, in the event temporary accounts are required, accounts designated as temporary in nature must be automatically terminated after 72 hours. Such a process and capability greatly reduces\
      \ the risk of accounts being misused, hijacked, or data compromised."
    impact: Low
    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-216087r958364_rule - V-216087
  tags:
  - stig
  - low
  - v-216087
