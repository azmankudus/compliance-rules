- rule_id: SV-216140r959010
  rule_name: The system must disable TCP reverse IP source routing.
  rule_description: If enabled, reverse IP source routing would allow an attacker to more easily complete a three-way TCP handshake and spoof new connections.
  category: Security
  subcategory: '216140'
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "Determine if TCP reverse IP source routing is disabled. \n\n# ipadm show-prop -p _rev_src_routes -co current tcp\n\nIf the output of this command is not \"0\", this is a finding."
    check_command: 'Determine if TCP reverse IP source routing is disabled. '
  remediation:
    remediation_step: 'The Network Management profile is required.


      Disable reverse source routing.


      # pfexec ipadm set-prop -p _rev_src_routes=0 tcp'
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: If enabled, reverse IP source routing would allow an attacker to more easily complete a three-way TCP handshake and spoof new connections.
    impact: Low
    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-216140r959010_rule - V-216140
  tags:
  - stig
  - low
  - v-216140
- rule_id: SV-216096r959010
  rule_name: The system must require passwords to contain no more than three consecutive repeating characters.
  rule_description: Complex passwords can reduce the likelihood of success of automated password-guessing attacks.
  category: Security
  subcategory: '216096'
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check the MAXREPEATS setting.


      # grep ^MAXREPEATS /etc/default/passwd


      If the MAXREPEATS setting is greater than 3, this is a finding.'
    check_command: Check the MAXREPEATS setting.
  remediation:
    remediation_step: "The root role is required.\n# pfedit /etc/default/passwd \n\nLocate the line containing:\n\nMAXREPEATS\n\nChange the line to read: \n\nMAXREPEATS=3"
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: Complex passwords can reduce the likelihood of success of automated password-guessing attacks.
    impact: Low
    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-216096r959010_rule - V-216096
  tags:
  - stig
  - low
  - v-216096
- rule_id: SV-216142r959010
  rule_name: The system must set maximum number of incoming connections to 1024.
  rule_description: This setting controls the maximum number of incoming connections that can be accepted on a TCP port limiting exposure to denial of service attacks.
  category: Security
  subcategory: '216142'
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "Determine if the maximum number of incoming connections is set to 1024.\n\n# ipadm show-prop -p _conn_req_max_q -co current tcp\n\nIf the value returned is smaller than \"1024\", this is a finding. \n\nIn environments where connection numbers are high, such as a busy web server, this value may need to be increased."
    check_command: Determine if the maximum number of incoming connections is set to 1024.
  remediation:
    remediation_step: 'The Network Management profile is required.


      Configure maximum number of incoming connections.


      # pfexec ipadm set-prop -p _conn_req_max_q=1024 tcp'
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
