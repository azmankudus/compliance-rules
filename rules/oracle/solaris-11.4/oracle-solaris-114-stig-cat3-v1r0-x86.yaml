- rule_id: SV-216139r959010
  rule_name: The system must disable ICMP redirect messages.
  rule_description: A malicious user can exploit the ability of the system to send ICMP redirects by continually sending packets to the system, forcing the system to respond with ICMP redirect messages, resulting in an adverse impact on the CPU performance of the system.
  category: Security
  subcategory: '216139'
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Determine the version of Solaris 11 in use.


      # cat /etc/release


      If the version of Solaris is earlier than Solaris 11.2, determine if ICMP redirect messages are disabled.


      # ipadm show-prop -p _send_redirects -co current ipv4

      # ipadm show-prop -p _send_redirects -co current ipv6


      If the output of all commands is not "0", this is a finding.


      If the version of Solaris is Solaris 11.2 or later, determine if ICMP redirect messages are disabled.


      # ipadm show-prop -p send_redirects -co current ipv4

      # ipadm show-prop -p send_redirects -co current ipv6


      If the output of all commands is not "off", this is a finding.'
    check_command: Determine the version of Solaris 11 in use.
  remediation:
    remediation_step: "The Network Management profile is required.\n\nIf the version of Solaris is earlier than Solaris 11.2, disable send redirects for IPv4 and IPv6.\n\n# pfexec ipadm set-prop -p _send_redirects=0 ipv4\n# pfexec ipadm set-prop -p _send_redirects=0 ipv6 \n\nIf the version of Solaris is Solaris 11.2 or later, disable send redirects for IPv4 and IPv6.\n\n# pfexec ipadm set-prop -p send_redirects=off ipv4\n# pfexec ipadm set-prop -p send_redirects=off ipv6"
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: A malicious user can exploit the ability of the system to send ICMP redirects by continually sending packets to the system, forcing the system to respond with ICMP redirect messages, resulting in an adverse impact on the CPU performance of the system.
    impact: Low
    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-216139r959010_rule - V-216139
  tags:
  - stig
  - low
  - v-216139
- rule_id: SV-216130r958398
  rule_name: The operating system must limit the number of concurrent sessions for each account to an organization-defined number of sessions.
  rule_description: "Limiting the number of allowed users and sessions per user can limit risks related to denial of service attacks. The organization may define the maximum number of concurrent sessions for an information system account globally, by account type, by account, or by a combination thereof. \n\nThis requirement addresses concurrent sessions for a single information system account and does not address concurrent sessions by a single user via multiple accounts."
  category: Security
  subcategory: '216130'
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Identify the organizational requirements for maximum number of sessions and which users must be restricted. If there are no requirements to limit concurrent sessions, this item does not apply.


      For each user requiring concurrent session restrictions, determine if that user is in the user.[username] project where [username] is the user''s account username.


      # projects [username] | grep user


      If the output does not include the project user.[username], this is a finding.


      Determine the project membership for the user.


      # projects [username]


      If the user is a member of any project other than default, group.[groupname], or user.[username], this is a finding.


      Determine whether the max-tasks resource control is enabled properly.


      # projects -l user.[username] | grep attribs


      If the output does not include the text:


      attribs: project.max-tasks=(privileged,[MAX],deny)


      where [MAX] is the organization-defined maximum number of concurrent sessions, this is a finding.'
    check_command: Identify the organizational requirements for maximum number of sessions and which users must be restricted. If there are no requirements to limit concurrent sessions, this item does not apply.
  remediation:
    remediation_step: 'Identify the organizational requirements for maximum number of sessions and which users must be restricted. If there are no requirements to limit concurrent sessions, this item does not apply.


      The Project Management profile is required.


      For each user requiring concurrent session restrictions, add the user to the special user.[username] project where [username] is the user''s account username where [MAX] is equal to the organizational requirement.


      # pfexec projadd -K ''project.max-tasks=(privileged,[MAX],deny)'' user.[username]


      Determine the project membership for the user.


      # projects [username]


      If the user is a member of any projects other than default, group.[groupname], or user.[username], remove that project from the user''s account.


      The root role is required.


      # pfedit /etc/user_attr


      Locate the line containing the user''s username. Remove any project=[projectname] entries from the fifth field.


      # pfedit /etc/project


      Locate the line containing the user''s username in a project other than default, group.[groupname], or user.[username], and remove the user from the project''s entry or entries from the fourth field.'
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: "Limiting the number of allowed users and sessions per user can limit risks related to denial of service attacks. The organization may define the maximum number of concurrent sessions for an information system account globally, by account type, by account, or by a combination thereof. \n\nThis requirement addresses concurrent sessions for a single information system account and does not address concurrent sessions by a single user via multiple accounts."
    impact: Low
    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-216130r958398_rule - V-216130
  tags:
  - stig
  - low
  - v-216130
