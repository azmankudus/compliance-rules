- rule_id: SV-216218r959010
  rule_name: The system must require authentication before allowing modification of the boot devices or menus. Secure the GRUB Menu (Intel).
  rule_description: The flexibility that GRUB provides creates a security risk if its configuration is modified by an unauthorized user. The failsafe menu entry needs to be secured in the same environments that require securing the systems firmware to avoid unauthorized removable media boots.
  category: Security
  subcategory: '216218'
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'This check applies to X86 systems only.


      This check applies to the global zone only. Determine the zone that you are currently securing.


      # zonename


      If the command output is "global", this check applies.


      # grep source /rpool/boot/grub/grub.cfg

      source $prefix/custom.cfg


      If the output does not contain "source $prefix/custom.cfg" on a line of its own, this is a finding.


      # grep superusers /rpool/boot/grub/custom.cfg.

      # grep password_pbkdf2 /rpool/boot/grub/custom.cfg


      If no superuser name and password are defined, this is a finding.'
    check_command: This check applies to X86 systems only.
  remediation:
    remediation_step: "The root role is required.\n\nThis action applies to the global zone only. Determine the zone that you are currently securing.\n\n# zonename\n\nIf the command output is \"global\", this action applies.\n\nUpdate GRUB to use a custom configuration file.\n\n# pfedit /rpool/boot/grub/grub.cfg\nInsert the line:\nsource $prefix/custom.cfg\n\nCreate a password hash.\n\n# /usr/lib/grub2/bios/bin/grub-mkpasswd-pbkdf2\nEnter password: \nReenter password: \nYour PBKDF2 is .......\nCopy the long password hash in its entirety.\n\n# pfedit /rpool/boot/grub/custom.cfg\nInsert the lines:\nset superusers=\"[username]\"\npassword_pbkdf2 [username] [password hash]\n\nRestart the system."
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: The flexibility that GRUB provides creates a security risk if its configuration is modified by an unauthorized user. The failsafe menu entry needs to be secured in the same environments that require securing the systems firmware to avoid unauthorized removable media boots.
    impact: Low
    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-216218r959010_rule - V-216218
