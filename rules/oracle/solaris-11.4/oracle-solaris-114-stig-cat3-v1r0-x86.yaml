- rule_id: SV-216115r959010
  rule_name: Consecutive login attempts for SSH must be limited to 3.
  rule_description: Setting the authentication login limit to a low value will disconnect the attacker and force a reconnect, which severely limits the speed of such brute-force attacks.
  category: Security
  subcategory: '216115'
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Determine if consecutive login attempts are limited to 3.


      # grep "^MaxAuthTries" /etc/ssh/sshd_config | grep -v Log


      If the output of this command is not:


      MaxAuthTries 6


      this is a finding.


      Note: Solaris SSH MaxAuthTries of 6 maps to 3 actual failed attempts.'
    check_command: Determine if consecutive login attempts are limited to 3.
  remediation:
    remediation_step: "The root role is required.\n\nModify the sshd_config file.\n\n# pfedit /etc/ssh/sshd_config\n\nLocate the line containing:\n\nMaxAuthTries \n\nChange it to:\n\nMaxAuthTries 6\n\nRestart the SSH service.\n\n# svcadm restart svc:/network/ssh\n\nNote: Solaris SSH MaxAuthTries of 6 maps to 3 actual failed attempts."
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: Setting the authentication login limit to a low value will disconnect the attacker and force a reconnect, which severely limits the speed of such brute-force attacks.
    impact: Low
    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-216115r959010_rule - V-216115
  tags:
  - stig
