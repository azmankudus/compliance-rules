      3. Create new BE for updates:
         pkg update --be-name solaris-new
      4. Reboot if required:
         reboot
      5. Verify: pkg list entire
    rollback_supported: true
    reboot_required: true
    service_impact: System updated and rebooted
    estimated_time: 60 minutes
  context:
    rationale: Timely patching addresses known vulnerabilities
    impact: High - Critical for security
    false_positive_risk: Low
  tags:
