- rule_id: ORA-SSH-003
  rule_name: Disable SSH password authentication
  rule_description: Disable password authentication for SSH and require public key authentication for enhanced security.
  category: Network Configuration
  subcategory: SSH
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: Verify SSH password authentication setting
    check_command: "grep PasswordAuthentication /etc/ssh/sshd_config"
    expected_value: "PasswordAuthentication no"
  remediation:
    remediation_step: |
      Disable SSH password authentication:
      1. First, ensure key-based authentication is configured
      2. Edit /etc/ssh/sshd_config
      3. Set: PasswordAuthentication no
      4. Also set: ChallengeResponseAuthentication no
      5. Restart SSH: svcadm restart ssh
      
      WARNING: Ensure key authentication works before disabling passwords
    rollback_supported: true
    reboot_required: false
    service_impact: Password SSH login blocked
    estimated_time: 10 minutes
  context:
    rationale: Key-based authentication is more secure than passwords
    impact: High - Critical for SSH security
    false_positive_risk: Low
  tags:
  - ssh
  - authentication
  - public-key

- rule_id: ORA-FILE-001
  rule_name: Configure ZFS encryption for sensitive data
  rule_description: Enable ZFS encryption for datasets containing sensitive data to protect data at rest.
  category: Data Protection
  subcategory: Encryption
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: Verify ZFS encryption status
    check_command: "zfs get encryption rpool/export/home"
    expected_value: "encryption on"
  remediation:
    remediation_step: |
      Enable ZFS encryption:
      1. Create encrypted dataset:
         zfs create -o encryption=on -o keyformat=passphrase rpool/secure
      2. Or encrypt existing dataset (requires migration):
         zfs snapshot rpool/data@backup
         zfs send rpool/data@backup | zfs receive -o encryption=on rpool/encrypted
      3. Use strong encryption:
         zfs create -o encryption=aes-256-gcm -o keyformat=passphrase rpool/secure
    rollback_supported: false
    reboot_required: false
    service_impact: Encrypted datasets require key at mount
    estimated_time: 30 minutes
  context:
    rationale: ZFS encryption protects sensitive data at rest
    impact: High - Critical for data protection
    false_positive_risk: None
  tags:
  - encryption
  - zfs
  - data-protection

- rule_id: ORA-FILE-002
  rule_name: Set restrictive ACLs on sensitive directories
  rule_description: Configure Access Control Lists (ACLs) on sensitive directories to implement fine-grained access control.
  category: Access Control
  subcategory: ACLs
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: Verify ACLs on sensitive directories
    check_command: "ls -Vd /etc/security /etc/shadow"
    expected_value: Restrictive ACLs configured
  remediation:
    remediation_step: |
      Configure ACLs:
      1. View current ACLs:
         ls -Vd /path/to/dir
      2. Set ACL:
         chmod A+user:username:rwx:allow /path/to/dir
      3. Remove ACL:
         chmod A-user:username:allow /path/to/dir
      4. Set default ACL for new files:
         chmod A+default:user:username:rwx:allow /path/to/dir
    rollback_supported: true
    reboot_required: false
    service_impact: Access restricted per ACL
    estimated_time: 15 minutes
  context:
    rationale: ACLs provide fine-grained access control beyond traditional permissions
    impact: Medium - Important for access control
    false_positive_risk: Medium
  tags:
  - access-control
  - acls
  - permissions

- rule_id: ORA-FILE-003
  rule_name: Limit tmpfs file system size
  rule_description: Configure a maximum size for the tmpfs file system to prevent denial of service through resource exhaustion.
  category: File System
  subcategory: tmpfs
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: Verify tmpfs size limit
    check_command: "mount | grep tmpfs"
    expected_value: tmpfs mounted with size limit
  remediation:
    remediation_step: |
      Set tmpfs size limit:
      1. Edit /etc/vfstab
      2. Add size option to tmpfs entry:
         swap - /tmp tmpfs - yes size=1g
      3. Remount:
         mount -o remount /tmp
      
      Or set in SMF for /tmp:
      svccfg -s system/filesystem/tmp:default setprop tmpfs_size=1G
      svcadm refresh system/filesystem/tmp:default
    rollback_supported: true
    reboot_required: false
    service_impact: tmpfs limited to specified size
    estimated_time: 5 minutes
  context:
    rationale: Limiting tmpfs prevents resource exhaustion attacks
    impact: Medium - Important for availability
    false_positive_risk: Low
  tags:
  - filesystem
  - tmpfs
  - dos-prevention

