  rule_name: Configure link protection in virtualized environments
  rule_description: Enable link protection features to prevent MAC and IP spoofing in virtualized environments.
  category: Network Configuration
  subcategory: Link Protection
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: Verify link protection configuration
    check_command: "dladm show-linkprop -p protection"
    expected_value: Link protection enabled
  remediation:
    remediation_step: |
      Enable link protection:
      1. Enable MAC address protection:
         dladm set-linkprop -p protection=mac-nospf net0
      2. Enable IP address protection:
         dladm set-linkprop -p protection=ip-nospf net0
      3. Enable DHCP protection:
         dladm set-linkprop -p protection=dhcp-nospf net0
      4. Verify: dladm show-linkprop -p protection net0
    rollback_supported: true
    reboot_required: false
    service_impact: Spoofed traffic blocked
    estimated_time: 10 minutes
  context:
    rationale: Link protection prevents spoofing attacks in virtualized environments
    impact: Medium - Important for virtualization security
    false_positive_risk: Low
  tags:
  - network
  - virtualization
  - spoofing

- rule_id: ORA-IPSEC-001
  rule_name: Configure IPsec for network traffic protection
  rule_description: Configure IPsec to encrypt and authenticate network traffic between systems.
  category: Network Security
  subcategory: IPsec
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Partial
    audit_type: config
    detection_step: Verify IPsec configuration
    check_command: "ipsecconf -ln"
    expected_value: IPsec policies configured if required
  remediation:
    remediation_step: |
      Configure IPsec:
      1. Create /etc/inet/ipsecinit.conf:
         {laddr host1 raddr host2} ipsec {encr_algs aes encr_auth_algs sha256 sa shared}
      2. Enable IPsec policy:
         svcadm enable ipsec/policy
      3. Configure IKE for key management:
         svcadm enable ikev2
      4. Verify: ipsecconf -ln
    rollback_supported: true
    reboot_required: false
    service_impact: Network traffic encrypted
    estimated_time: 30 minutes
  context:
    rationale: IPsec provides secure network communication
    impact: Medium - Important for network security
    false_positive_risk: Medium
  tags:
  - network
  - ipsec
  - encryption

- rule_id: ORA-RBAC-001
  rule_name: Use rights profiles for administrative tasks
  rule_description: Use rights profiles instead of direct root access to implement principle of least privilege for administrative tasks.
  category: Access Control
  subcategory: RBAC
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Partial
    audit_type: config
    detection_step: Verify rights profiles are assigned
    check_command: "profiles -l"
    expected_value: Appropriate profiles assigned to users
  remediation:
    remediation_step: |
      Configure rights profiles:
      1. List available profiles:
         profiles -a
      2. Assign profile to user:
         usermod -P +"User Security" username
      3. Create custom profile:
         profiles -p "Custom Admin"
         set desc="Custom administrative profile"
         add cmd=/usr/sbin/usermod
         set privs={*}
         end
         commit
      4. Assign: usermod -P +"Custom Admin" username
    rollback_supported: true
    reboot_required: false
    service_impact: Users have limited administrative rights
    estimated_time: 15 minutes
  context:
    rationale: Rights profiles provide fine-grained administrative access control
    impact: Medium - Important for least privilege
    false_positive_risk: Low
  tags:
  - access-control
  - rbac
  - privileges
