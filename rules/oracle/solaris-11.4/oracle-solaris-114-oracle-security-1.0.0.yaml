  rule_name: Install Critical Patch Updates (CPUs)
  rule_description: Regularly install Oracle Critical Patch Updates to address security vulnerabilities.
  category: System Updates
  subcategory: Patching
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: runtime
    detection_step: Verify system is up to date with security patches
    check_command: "pkg list entire"
    expected_value: System running current SRU
  remediation:
    remediation_step: |
      Install Critical Patch Updates:
      1. Check available updates:
