      # zonename


      If the command output is "global", this check applies.


      Check the status of the audit system. It must be auditing.


      # pfexec auditconfig -getcond


      If this command does not report:


      audit condition = auditing


      this is a finding.'
    check_command: The Audit Configuration profile is required.
  remediation:
    remediation_step: 'The Audit Control profile is required.


      This action applies to the global zone only.  Determine the zone that you are currently securing.


      # zonename


      If the command output is "global", this action applies.


      If auditing has been disabled, it must be enabled with the following command:


      # pfexec audit -s'
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: Without an audit reporting capability, users find it difficult to identify specific patterns of attack.
