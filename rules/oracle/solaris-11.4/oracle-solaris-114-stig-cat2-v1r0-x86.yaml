- rule_id: SV-216099r958388
  rule_name: The system must disable accounts after three consecutive unsuccessful login attempts.
  rule_description: Allowing continued access to accounts on the system exposes them to brute-force password-guessing attacks.
  category: Security
  subcategory: '216099'
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Verify RETRIES is set in the login file.


      # grep ^RETRIES /etc/default/login


      If the output is not RETRIES=3 or fewer, this is a finding.


      Verify the account locks after invalid login attempts.


      # grep ^LOCK_AFTER_RETRIES /etc/security/policy.conf


      If the output is not LOCK_AFTER_RETRIES=YES, this is a finding.


      For each user in the system, use the command:


      # userattr lock_after_retries [username]


      to determine if the user overrides the system value. If the output of this command is "no", this is a finding.'
    check_command: Verify RETRIES is set in the login file.
  remediation:
    remediation_step: "The root role is required.\n\n# pfedit /etc/default/login\n\nChange the line:\n\n#RETRIES=5\n\nto read\n\nRETRIES=3 \n\npfedit /etc/security/policy.conf\n\nChange the line containing\n\n#LOCK_AFTER_RETRIES \n\nto read:\n\nLOCK_AFTER_RETRIES=YES\n\n\nIf a user has lock_after_retries set to \"no\", update the user's attributes using the command:\n\n# usermod -K lock_after_retries=yes [username]"
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: Allowing continued access to accounts on the system exposes them to brute-force password-guessing attacks.
    impact: Medium
    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-216099r958388_rule - V-216099
  tags:
