- rule_id: SV-216113r959010
  rule_name: The nobody access for RPC encryption key storage service must be disabled.
  rule_description: If login by the user "nobody" is allowed for secure RPC, there is an increased risk of system compromise. If keyserv holds a private key for the "nobody" user, it will be used by key_encryptsession to compute a magic phrase which can be easily recovered by a malicious user.
  category: Security
  subcategory: '216113'
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "Determine if the rpc-authdes package is installed:\n\n# pkg list solaris/legacy/security/rpc-authdes\n\nIf the output of this command is:\n\npkg list: no packages matching 'solaris/legacy/security/rpc-authdes' installed\n\nno further action is required.\n\nDetermine if \"nobody\" access for keyserv is enabled.\n\n# grep \"^ENABLE_NOBODY_KEYS=\" /etc/default/keyserv \n\nIf the output of the command is not:\n\nENABLE_NOBODY_KEYS=NO\n\nthis is a finding."
    check_command: 'Determine if the rpc-authdes package is installed:'
  remediation:
    remediation_step: 'Determine if the rpc-authdes package is installed:


      # pkg list solaris/legacy/security/rpc-authdes


      If the output of this command is:


      pkg list: no packages matching ''solaris/legacy/security/rpc-authdes'' installed


      no further action is required.


      The root role is required.


      Modify the /etc/default/keyserv file.


      # pfedit /etc/default/keyserv


      Locate the line:


      #ENABLE_NOBODY_KEYS=YES


      Change it to:


      ENABLE_NOBODY_KEYS=NO'
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: If login by the user "nobody" is allowed for secure RPC, there is an increased risk of system compromise. If keyserv holds a private key for the "nobody" user, it will be used by key_encryptsession to compute a magic phrase which can be easily recovered by a malicious user.
    impact: Medium
    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-216113r959010_rule - V-216113
  tags:
  - stig
