- rule_id: SV-216240r959010
  rule_name: The systems physical devices must not be assigned to non-global zones.
  rule_description: Solaris non-global zones can be assigned physical hardware devices. This increases the risk of such a non-global zone having the capability to compromise the global zone.
  category: Security
  subcategory: '216240'
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'This check applies to the global zone only. Determine the zone that you are currently securing.


      # zonename


      If the command output is "global", this check applies.


      List the non-global zones on the system.


      # zoneadm list -vi | grep -v global


      List the configuration for each zone.


      # zonecfg -z [zonename] info | grep dev


      Check for device lines. If such a line exists and is not approved by security, this is a finding.'
    check_command: This check applies to the global zone only. Determine the zone that you are currently securing.
  remediation:
    remediation_step: "This check applies to the global zone only. Determine the zone that you are currently securing.\n\n# zonename\n\nIf the command output is \"global\", this check applies.\n\nThe Zone Security profile is required:\n\nRemove all device assignments from the non-global zone. \n\n# pfexec zonecfg -z [zone] delete device [device]"
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: Solaris non-global zones can be assigned physical hardware devices. This increases the risk of such a non-global zone having the capability to compromise the global zone.
    impact: Medium
    false_positive_risk: Low
