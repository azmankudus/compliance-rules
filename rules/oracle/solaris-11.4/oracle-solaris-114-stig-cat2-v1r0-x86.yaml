- rule_id: SV-216181r959010
  rule_name: Permissions on user home directories must be 750 or less permissive.
  rule_description: Group-writable or world-writable user home directories may enable malicious users to steal or modify other users' data or to gain another user's system privileges.
  category: Security
  subcategory: '216181'
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'The root role is required.


      Check that the permissions on users'' home directories are 750 or less permissive.


      # for dir in `logins -ox |\

      awk -F: ''($8 == "PS") { print $6 }''`; do

      find ${dir} -type d -prune \( -perm -g+w -o \

      -perm -o+r -o -perm -o+w -o -perm -o+x \) -ls

      done


      If output is created, this is finding.'
    check_command: The root role is required.
  remediation:
    remediation_step: "The root role is required. \n\nChange the permissions on users' directories to 750 or less permissive.\n\n# chmod 750 [directory name]"
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: Group-writable or world-writable user home directories may enable malicious users to steal or modify other users' data or to gain another user's system privileges.
    impact: Medium
    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-216181r959010_rule - V-216181
  tags:
  - stig
  - medium
  - v-216181
- rule_id: SV-216182r959010
  rule_name: Permissions on user . (hidden) files must be 750 or less permissive.
  rule_description: Group-writable or world-writable user configuration files may enable malicious users to steal or modify other users' data or to gain another user's system privileges.
  category: Security
  subcategory: '216182'
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'The root role is required.


      Ensure that the permissions on user "." files are 750 or less permissive.


      # for dir in \

      `logins -ox | awk -F: ''($8 == "PS") { print $6 }''`; do

      find ${dir}/.[A-Za-z0-9]* \! -type l \

      \( -perm -0001 -o -perm -0002 -o -perm -0004 -o -perm -0020 \) -ls

      done


      If output is produced, this is a finding.'
    check_command: The root role is required.
  remediation:
    remediation_step: "The root role is required. \n\nChange the permissions on users' \".\" files to 750 or less permissive.\n\n# chmod 750 [file name]"
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: Group-writable or world-writable user configuration files may enable malicious users to steal or modify other users' data or to gain another user's system privileges.
    impact: Medium
    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-216182r959010_rule - V-216182
  tags:
  - stig
  - medium
  - v-216182
- rule_id: SV-216183r959010
  rule_name: Permissions on user .netrc files must be 750 or less permissive.
  rule_description: .netrc files may contain unencrypted passwords that can be used to attack other systems.
  category: Security
  subcategory: '216183'
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'The root role is required.


      Check that permissions on user .netrc files are 750 or less permissive.


      # for dir in \

      `logins -ox | awk -F: ''($8 == "PS") { print $6 }''`; do

      find ${dir}/.netrc -type f \( \

      -perm -g+r -o -perm -g+w -o -perm -g+x -o \

      -perm -o+r -o -perm -o+w -o -perm -o+x \) \

      -ls 2>/dev/null

      done


      If output is produced, this is a finding.'
    check_command: The root role is required.
  remediation:
    remediation_step: "The root role is required. \n\nChange the permissions on users' .netrc files to 750 or less permissive.\n\n# chmod 750 [file name]"
