- rule_id: SV-216089r1016285
  rule_name: User passwords must be at least 15 characters in length.
  rule_description: "Password complexity, or strength, is a measure of the effectiveness of a password in resisting guessing and brute-force attacks. \n\nPassword length is one factor of several that helps to determine strength and how long it takes to crack a password. The shorter the password is, the lower the number of possible combinations that need to be tested before the password is compromised. \n\nUse of more characters in a password helps to exponentially increase the time and/or resources required to compromise the password."
  category: Security
  subcategory: '216089'
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check the system password length setting.


      # grep ^PASSLENGTH /etc/default/passwd


      If PASSLENGTH is not set to 15 or more, this is a finding.'
    check_command: Check the system password length setting.
  remediation:
    remediation_step: "The root role is required.\n\n# pfedit /etc/default/passwd \n\nLocate the line containing:\n\nPASSLENGTH\n\nChange the line to read:\n\nPASSLENGTH=15"
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: "Password complexity, or strength, is a measure of the effectiveness of a password in resisting guessing and brute-force attacks. \n\nPassword length is one factor of several that helps to determine strength and how long it takes to crack a password. The shorter the password is, the lower the number of possible combinations that need to be tested before the password is compromised. \n\nUse of more characters in a password helps to exponentially increase the time and/or resources required to compromise the password."
    impact: Medium
    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-216089r1016285_rule - V-216089
  tags:
  - stig
  - medium
  - v-216089
- rule_id: SV-216083r959010
  rule_name: TCP Wrappers must be enabled and configured per site policy to only allow access by approved hosts and services.
  rule_description: TCP Wrappers are a host-based access control system that allows administrators to control who has access to various network services based on the IP address of the remote end of the connection. TCP Wrappers also provide logging information via syslog about both successful and unsuccessful connections.
  category: Security
  subcategory: '216083'
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check that TCP Wrappers are enabled and the host.deny and host.allow files exist.


      # inetadm -p | grep tcp_wrappers


      If the output of this command is "tcp_wrappers=FALSE", this is a finding.


      # ls /etc/hosts.deny

      /etc/hosts.deny

      # ls /etc/hosts.allow

      /etc/hosts.allow


      If these files do not exist or do not contain the names of allowed or denied hosts, this is a finding.'
    check_command: Check that TCP Wrappers are enabled and the host.deny and host.allow files exist.
  remediation:
    remediation_step: "The root role is required.\n\nTo enable TCP Wrappers, run the following commands:\n\n1. Create and customize your policy in /etc/hosts.allow:\n# echo \"ALL: [net]/[mask], [net]/[mask], ...\" > /etc/hosts.allow \n\nwhere each [net>/[mask> combination (for example, the Class C address block \"192.168.1.0/255.255.255.0\") can represent one network block in use by your organization that requires access to this system.\n\n2. Create a default deny policy in /etc/hosts.deny: \n\n# echo \"ALL: ALL\" >/etc/hosts.deny\n\n3. Enable TCP Wrappers for all services started by inetd:\n\n# inetadm -M tcp_wrappers=TRUE\n\nThe versions of SunSSH (0.5.11) and sendmail that ship with Solaris 11 will automatically use TCP Wrappers to filter access if a hosts.allow or hosts.deny file exists.\n\nThe use of OpenSSH access is controlled by the sshd_config file starting with Solaris 11.3. \n\nSunSSH is removed starting with Solaris 11.4."
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: TCP Wrappers are a host-based access control system that allows administrators to control who has access to various network services based on the IP address of the remote end of the connection. TCP Wrappers also provide logging information via syslog about both successful and unsuccessful connections.
    impact: Medium
    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-216083r959010_rule - V-216083
  tags:
  - stig
  - medium
  - v-216083
- rule_id: SV-216086r1038967
  rule_name: User passwords must be changed at least every 60 days.
  rule_description: 'Limiting the lifespan of authenticators limits the period of time an unauthorized user has access to the system while using compromised credentials and reduces the period of time available for password-guessing attacks to run against a single password.


    Solaris 11.4 introduced new password security features that allow for a more granular approach to password duration parameters. The introduction of MAXDAYS, MINDAYS, and WARNDAYS allow the /etc/default/passwd configuration file to enforce a password change every 60 days.'
  category: Security
  subcategory: '216086'
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "The root role is required.\n\nDetermine if user passwords are properly configured to be changed every 60 days.\n\nDetermine the OS version to be secured.\n# uname -v\n\nFor Solaris 11, 11.1, 11.2, and 11.3:\n\n# logins -ox |awk -F: '( $1 != \"root\" && $8 != \"LK\" && $8 != \"NL\" && ( $11 > \u201C56\" || $11 < \u201C1\" )) { print }'\n\nIf output is returned and the listed account is accessed via direct logon, this is a finding.\n\nCheck that /etc/default/password is configured to enforce password expiration every eight weeks or less.\n\n# grep \"^MAXWEEKS=\" /etc/default/passwd \n\nIf the command does not report MAXWEEKS=8 or less, this is a finding.\n\nFor Solaris 11.4 or newer:\n\n# logins -ox |awk -F: '( $1 != \"root\" && $8 != \"LK\" && $8 != \"NL\" && ($11 > \"60\"|| $11 < \"1\")) { print }'\n\nIf output is returned and the listed account is accessed via direct logon, this is a finding.\n\nCheck that /etc/default/password is configured to enforce password expiration\
      \ every 60 days or less.\nNote: It is an error to set both the WEEKS and the DAYS variant for a given MIN/MAX/WARN variable.\n\n# grep \"^MAXDAYS=\" /etc/default/passwd \n\nIf the command does not report MAXDAYS=60 or less, this is a finding.\n\n# grep \"^MAXWEEKS=\" /etc/default/passwd \n\nIf output is returned, this is a finding."
    check_command: The root role is required.
  remediation:
    remediation_step: "The User Security role is required.\n\nFor Solaris 11, 11.1, 11.2, and 11.3:\n\nChange each username to enforce 56 day password changes.\n\n# pfexec passwd -x 56 [username]\n\n# pfedit /etc/default/passwd \n\nSearch for MAXWEEKS. Change the line to read:\n\nMAXWEEKS=8\n\nFor Solaris 11.4 or newer:\n\nChange each username to enforce 60 day password changes.\n\n# pfexec passwd -x 60 [username]\n\n# pfedit /etc/default/passwd \nNote: It is an error to set both the WEEKS and the DAYS variant for a given MIN/MAX/WARN variable.\n\nSearch for MAXDAYS. Change the line to read:\n\nMAXDAYS=60\n\nSearch for MAXWEEKS. Change the line to read:\n\n#MAXWEEKS="
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: 'Limiting the lifespan of authenticators limits the period of time an unauthorized user has access to the system while using compromised credentials and reduces the period of time available for password-guessing attacks to run against a single password.


      Solaris 11.4 introduced new password security features that allow for a more granular approach to password duration parameters. The introduction of MAXDAYS, MINDAYS, and WARNDAYS allow the /etc/default/passwd configuration file to enforce a password change every 60 days.'
    impact: Medium
    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-216086r1038967_rule - V-216086
  tags:
  - stig
  - medium
  - v-216086
- rule_id: SV-216088r1016284
  rule_name: The operating system must enforce minimum password lifetime restrictions.
  rule_description: 'Passwords need to be changed at specific policy-based intervals; however, if the information system or application allows the user to immediately and continually change their password, then the password could be repeatedly changed in a short period of time, defeating the organization''s policy regarding password reuse.


    Solaris 11.4 introduced new password security features that allow for a more granular approach to password duration parameters. The introduction of MAXDAYS, MINDAYS, and WARNDAYS allow the /etc/default/passwd configuration file to enforce a minimum password lifetime of a single day.'
  category: Security
  subcategory: '216088'
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "The root role is required.\n\nCheck whether the minimum time period between password changes for each user account is one day or greater. \n\nDetermine the OS version to be secured.\n# uname -v\n\nFor Solaris 11, 11.1, 11.2, and 11.3:\n\n# logins -ox |awk -F: '( $1 != \"root\" && $8 != \"LK\" && $8 != \"NL\" && $10 < \"1\" ) { print }'\n\nIf output is returned and the listed account is accessed via direct logon, this is a finding.\n\nCheck that /etc/default/password is configured to minimum password change time of one week.\n\n# grep \"^MINWEEKS=\" /etc/default/passwd \n\nIf the command does not report MINWEEKS=1 or more, this is a finding.\n\nFor Solaris 11.4 or newer:\n\n# logins -ox |awk -F: '( $1 != \"root\" && $8 != \"LK\" && $8 != \"NL\" && $10 < \"1\" ) { print }'\n\nIf output is returned and the listed account is accessed via direct logon, this is a finding.\n\nCheck that /etc/default/password is configured to minimum password change time of one day.\nNote: It\
      \ is an error to set both the WEEKS and the DAYS variant for a given MIN/MAX/WARN variable.\n\n# grep \"^MINDAYS=\" /etc/default/passwd \n\nIf the command does not report MINDAYS=1 or more, this is a finding.\n\n# grep \"^MINWEEKS=\" /etc/default/passwd \n\nIf output is returned, this is a finding."
    check_command: The root role is required.
  remediation:
    remediation_step: "The root role is required.\n\nFor Solaris 11, 11.1, 11.2, and 11.3:\n\n# pfedit /etc/default/passwd file.\n\nLocate the line containing:\n\nMINWEEKS\n\nChange the line to read: \n\nMINWEEKS=1\n\nSet the per-user minimum password change times by using the following command on each user account.\n\n# passwd -n [number of days] [accountname]\n\nFor Solaris 11.4 or newer:\n\n# pfedit /etc/default/passwd file.\nNote: It is an error to set both the WEEKS and the DAYS variant for a given MIN/MAX/WARN variable.\n\nSearch for MINDAYS. Change the line to read: \n\nMINDAYS=1\n\nSearch for MINWEEKS. Change the line to read: \n\n#MINWEEKS=\n\nSet the per-user minimum password change times by using the following command on each user account. \n\n# passwd -n [number of days] [accountname]"
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: 'Passwords need to be changed at specific policy-based intervals; however, if the information system or application allows the user to immediately and continually change their password, then the password could be repeatedly changed in a short period of time, defeating the organization''s policy regarding password reuse.


      Solaris 11.4 introduced new password security features that allow for a more granular approach to password duration parameters. The introduction of MAXDAYS, MINDAYS, and WARNDAYS allow the /etc/default/passwd configuration file to enforce a minimum password lifetime of a single day.'
    impact: Medium
    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-216088r1016284_rule - V-216088
