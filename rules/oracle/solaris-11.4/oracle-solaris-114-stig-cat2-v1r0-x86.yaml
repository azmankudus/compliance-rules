- rule_id: SV-216162r986457
  rule_name: The operating system must terminate all sessions and network connections when nonlocal maintenance is completed.
  rule_description: "Nonlocal maintenance and diagnostic activities are those activities conducted by individuals communicating through a network, either an external network (e.g., the internet) or an internal network. \n\nThe operating system needs to ensure all sessions and network connections are terminated when nonlocal maintenance is completed."
  category: Security
  subcategory: '216162'
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Determine if SSH is configured to disconnect sessions after 10 minutes of inactivity.


      # grep ClientAlive /etc/ssh/sshd_config


      If the output of this command is not as shown below, this is a finding.


      ClientAliveInterval 600

      ClientAliveCountMax 0'
    check_command: Determine if SSH is configured to disconnect sessions after 10 minutes of inactivity.
  remediation:
    remediation_step: 'The root role is required.


      Configure the system to disconnect SSH sessions after 10 minutes of inactivity.


      # pfedit /etc/ssh/sshd_config


      Insert the two lines:


      ClientAliveInterval 600

      ClientAliveCountMax 0


      Restart the SSH service with the new configuration.


      # svcadm restart svc:/network/ssh'
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: "Nonlocal maintenance and diagnostic activities are those activities conducted by individuals communicating through a network, either an external network (e.g., the internet) or an internal network. \n\nThe operating system needs to ensure all sessions and network connections are terminated when nonlocal maintenance is completed."
    impact: Medium
    false_positive_risk: Low
