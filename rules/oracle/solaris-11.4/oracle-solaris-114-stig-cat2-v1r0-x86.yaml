- rule_id: SV-216015r958442
  rule_name: The audit records must provide data for all auditable events defined at the organizational level for the organization-defined information system components.
  rule_description: 'Without auditing, individual system accesses cannot be tracked, and malicious activity cannot be detected and traced back to an individual account.


    Without accurate time stamps, source, user, and activity information, malicious activity cannot be accurately tracked.


    Without an audit reduction and reporting capability, users find it difficult to identify specific patterns of attack.'
  category: Security
  subcategory: '216015'
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
