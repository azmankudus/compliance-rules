- rule_id: SV-216059r959010
  rule_name: The rpcbind service must be configured for local only services unless organizationally defined.
  rule_description: The portmap and rpcbind services increase the attack surface of the system and should only be used when needed. The portmap or rpcbind services are used by a variety of services using remote procedure calls (RPCs).  The organization may define and document the limited use of services (for example NFS) that may use these services with approval from their Authorizing Official.
  category: Security
  subcategory: '216059'
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check the status of the rpcbind service local_only property.

      # svcprop -p config/local_only network/rpc/bind


      If the state is not "true", this is a finding, unless it is required for system operations, then this is not a finding.'
    check_command: Check the status of the rpcbind service local_only property.
  remediation:
    remediation_step: "The Service Management profile is required.\n\nIf services such as portmap or rpcbind are required for system operations, the operator must document the services used and obtain approval from their Authorizing Official. They should also document the method(s) of blocking all other remote accesses through tools like a firewall or tcp_wrappers.\nOtherwise, configure the rpc/bind service for local only access. \n\n# svccfg -s network/rpc/bind setprop config/local_only=true"
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: The portmap and rpcbind services increase the attack surface of the system and should only be used when needed. The portmap or rpcbind services are used by a variety of services using remote procedure calls (RPCs).  The organization may define and document the limited use of services (for example NFS) that may use these services with approval from their Authorizing Official.
