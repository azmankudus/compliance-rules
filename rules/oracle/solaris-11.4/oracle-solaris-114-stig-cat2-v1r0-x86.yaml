- rule_id: SV-216101r958400
  rule_name: The system must require users to re-authenticate to unlock a graphical desktop environment.
  rule_description: Allowing access to a graphical environment when the user is not attending the system can allow unauthorized users access to the system.
  category: Security
  subcategory: '216101'
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'If the system is not running XWindows, this check does not apply.


      Determine if the screen saver timeout is configured properly.


      # grep "^\*timeout:" /usr/share/X11/app-defaults/XScreenSaver


      If the output is not:

      *timeout: 0:15:00

      or a shorter time interval, this is a finding.


      # grep "^\*lockTimeout:" /usr/share/X11/app-defaults/XScreenSaver


      If the output is not:

      *lockTimeout: 0:00:05

      or a shorter time interval, this is a finding.


      # grep "^\*lock:" /usr/share/X11/app-defaults/XScreenSaver


      If the output is not:

      *lock: True

      this is a finding.


      For each existing user, check the configuring of their personal .xscreensaver file.


      # grep "^timeout:" $HOME/.xscreensaver


      If the output is not:

      timeout: 0:15:00

      or a shorter time interval, this is a finding.


      # grep "^lockTimeout:" $HOME/.xscreensaver


      If the output is not:

      lockTimeout: 0:00:05

      or a shorter time interval, this is a finding.


      # grep "^lock:" $HOME/.xscreensaver


      If the output is not:

      lock: True

      this is a finding.'
    check_command: If the system is not running XWindows, this check does not apply.
  remediation:
    remediation_step: 'The root role is required.


      Edit the global screensaver configuration file to ensure 15 minute screen lock.


      # pfedit /usr/share/X11/app-defaults/XScreenSaver


      Find the timeout control lines and change them to read:


      *timeout: 0:15:00

      *lockTimeout: 0:00:05

      *lock: True


      For each user on the system, edit their local $HOME/.xscreensaver file and change the timeout values.


      # pfedit $HOME/.xscreensaver


      Find the timeout control lines and change them to read:


      timeout: 0:15:00

      lockTimeout: 0:00:05

      lock: True'
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: Allowing access to a graphical environment when the user is not attending the system can allow unauthorized users access to the system.
    impact: Medium
    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-216101r958400_rule - V-216101
  tags:
  - stig
  - medium
