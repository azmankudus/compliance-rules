- rule_id: SV-216150r1045457
  rule_name: The boundary protection system (firewall) must be configured to deny network traffic by default and must allow network traffic by exception (i.e., deny all, permit by exception).
  rule_description: 'A firewall that relies on a deny all, permit by exception strategy requires all traffic to have explicit permission before traversing an interface on the host. The firewall must incorporate stateful packet filtering and logging.


    Nonlocal maintenance and diagnostic communications often contain sensitive information and must be protected. The security of these remote accesses can be ensured by sending nonlocal maintenance and diagnostic communications through encrypted channels enforced via firewall configurations.


    Satisfies: SRG-OS-000074, SRG-OS-000096, SRG-OS-000112, SRG-OS-000113, SRG-OS-000125, SRG-OS-000250, SRG-OS-000393'
  category: Security
  subcategory: '216150'
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Ensure that either the IP Filter or Packet Filter Firewall is installed correctly.


      Determine the OS version to be secured.

      # uname -v


      For Solaris 11, 11.1, 11.2, and 11.3, which use IP Filter, the IP Filter Management profile is required.


      Check that the IP Filter firewall is enabled and configured so that only authorized sessions are allowed.


      # svcs ipfilter


      If "ipfilter" is not listed with a state of "online", this is a finding.


      The IP Filter Management profile is required.


      Check that the filters are configured properly.


      # ipfstat -io


      If the output of this command does not include the following lines, this is a finding.


      block out log all keep state keep frags

      block in log all

      block in log from any to 255.255.255.255/32

      block in log from any to 127.0.0.1/32


      Even if the lines above are included in the output, it is possible that other lines can contradict the firewall settings. Review the firewall rules and ensure that they conform to organizational and mission requirements. If the firewall rules are not configured to organizational standards, this is a finding.


      For Solaris 11.3 or newer, which use Packet Filter, the Network Firewall Management rights profile is required.


      Check that the Packet Filter firewall is enabled and configured so that only authorized sessions are allowed.

      # svcs firewall:default


      If "firewall" is not listed with a state of "online", this is a finding.


      The Network Firewall Management rights profile is required.


      Check that the filters are configured properly.

      # pfctl -s rules


      If the output of this command does not include a line to block and log all traffic as in the following line, this is a finding (does not have to be exactly like the example).


      block drop log (to pflog0) all


      Check that the Packet Filter firewall logging daemon is enabled.

      svcs firewall/pflog:default


      If "pflog" is not listed with a state of "online", this is a finding.'
    check_command: Ensure that either the IP Filter or Packet Filter Firewall is installed correctly.
  remediation:
    remediation_step: "The root role is required.\n\nFor Solaris 11, 11.1, 11.2, and 11.3, which use IP Filter, configure and enable the IP Filters policy.\n\n# pfedit /etc/ipf/ipf.conf. \n\nAdd the following lines to the file:\n\n# Do not allow all outbound traffic, keep state, and log\nblock out log all keep state keep frags\n# Block and log everything else that comes in\nblock in log all\nblock in log from any to 255.255.255.255\nblock in log from any to 127.0.0.1/32\n\nEnable ipfilter.\n\n# svcadm enable ipfilter\n\nNotify ipfilter to use the new configuration file.\n\n# ipf -Fa -f /etc/ipf/ipf.conf\n\nFor Solaris 11.3 or newer, which use Packet Filter, configure and enable the Packet Filter\u2019s policy.\n# pfedit /etc/firewall/pf.conf.\n\nAdd either of the following lines to the file:\n\n# Block and log all traffic on all interfaces in either direction from anywhere to anywhere\nblock log all\n     -or-\n# Drop traffic and log it to a fllog interface for more detailed inspection or\
      \ analysis using tools like tcpdump\nblock drop log (to pflog0) all\n\nEnable Packet Filter.\n# svcadm enable firewall:default\nEnable Packet Filter logging daemon.\n# svcadm enable firewall/pflog:default\n\nNote: Because the default firewall rules block all network access to the system, ensure there is still a method to access the system, such as SSH or console access, prior to activating the firewall rules. Operational requirements may dictate the addition of protocols such as SSH, DNS, NTP, HTTP, and HTTPS to be allowed."
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: 'A firewall that relies on a deny all, permit by exception strategy requires all traffic to have explicit permission before traversing an interface on the host. The firewall must incorporate stateful packet filtering and logging.


      Nonlocal maintenance and diagnostic communications often contain sensitive information and must be protected. The security of these remote accesses can be ensured by sending nonlocal maintenance and diagnostic communications through encrypted channels enforced via firewall configurations.


      Satisfies: SRG-OS-000074, SRG-OS-000096, SRG-OS-000112, SRG-OS-000113, SRG-OS-000125, SRG-OS-000250, SRG-OS-000393'
    impact: Medium
    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-216150r1045457_rule - V-216150
  tags:
  - stig
  - medium
  - v-216150
