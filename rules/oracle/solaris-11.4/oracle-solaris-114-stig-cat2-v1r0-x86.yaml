- rule_id: SV-216126r1016294
  rule_name: The operating system must provide the capability for users to directly initiate session lock mechanisms.
  rule_description: "A session lock is a temporary action taken when a user stops work and moves away from the immediate physical vicinity of the system but does not want to log out because of the temporary nature of the absence. \n\nRather than be forced to wait for a period of time to expire before the user session can be locked, the operating system needs to provide users with the ability to manually invoke a session lock so users may secure their account should the need arise for them to temporarily vacate the immediate physical vicinity."
  category: Security
  subcategory: '216126'
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "Determine whether the lock screen function works correctly.\n\nFor Solaris 11, 11.1, 11.2, and 11.3:\nIn the GNOME 2 desktop System >> Lock Screen.\n\nFor Solaris 11.4 or newer:\nIn the GNOME 3 desktop Status Menu (top right corner) >> Lock Icon, check that the screen locks and displays the \"password\" prompt.\n\nCheck that \"Disable Screensaver\" is not selected in the GNOME Screensaver preferences. \n\nIf the screen does not lock or the \"Disable Screensaver\" option is selected, this is a finding."
    check_command: Determine whether the lock screen function works correctly.
  remediation:
    remediation_step: 'User-initiated session lock is accessible from the GNOME graphical desktop menu GNOME 2: System >> Lock Screen.


      GNOME 3: Status Menu (top right corner) >> Lock Icon.


      However, the user has the option to disable screensaver lock.


      For Solaris 11, 11.1, 11.2, and 11.3:

      In the GNOME 2 desktop: System >> Preferences >> Screensaver.


      For Solaris 11.4 or newer:

      If using the default GNOME desktop: Activities >> Show Applications >> select "Screensaver" icon.


      If using the GNOME Classic desktop: Applications >> Other >> Screensaver.


      Ensure that "Mode" is set to "Blank Screen only".'
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: "A session lock is a temporary action taken when a user stops work and moves away from the immediate physical vicinity of the system but does not want to log out because of the temporary nature of the absence. \n\nRather than be forced to wait for a period of time to expire before the user session can be locked, the operating system needs to provide users with the ability to manually invoke a session lock so users may secure their account should the need arise for them to temporarily vacate the immediate physical vicinity."
    impact: Medium
    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-216126r1016294_rule - V-216126
  tags:
  - stig
  - medium
  - v-216126
