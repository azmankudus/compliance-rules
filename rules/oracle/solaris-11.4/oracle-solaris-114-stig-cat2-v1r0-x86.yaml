- rule_id: SV-216011r986460
  rule_name: The audit system must produce records containing sufficient information to establish the identity of any user/subject associated with the event.
  rule_description: Enabling the audit system will produce records with accurate time stamps, source, user, and activity information. Without this information malicious activity cannot be accurately tracked.
  category: Security
  subcategory: '216011'
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'The Audit Configuration profile is required.


      This check applies to the global zone only. Determine the zone to be secured.


      # zonename


      If the command output is "global", this check applies.


      Check the status of the audit system. It must be auditing.


      # pfexec auditconfig -getcond


      If this command does not report the following, this is a finding.


      audit condition = auditing'
    check_command: The Audit Configuration profile is required.
  remediation:
    remediation_step: 'The Audit Control profile is required.


      This action applies to the global zone only. Determine the zone to be secured.


      # zonename


      If the command output is "global", this action applies.


      If auditing has been disabled, it must be enabled with the following command:


      # pfexec audit -s'
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: Enabling the audit system will produce records with accurate time stamps, source, user, and activity information. Without this information malicious activity cannot be accurately tracked.
    impact: Medium
    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-216011r986460_rule - V-216011
  tags:
  - stig
  - medium
  - v-216011
