- rule_id: SV-220000r958548
  rule_name: The operating system must disable information system functionality that provides the capability for automatic execution of code on mobile devices without user direction.
  rule_description: "Mobile devices include portable storage media (e.g., USB memory sticks, external hard disk drives) and portable computing and communications devices with information storage capability (e.g., notebook/laptop computers, personal digital assistants, cellular telephones, digital cameras, audio recording devices). \n\nAuto execution vulnerabilities can result in malicious programs being automatically executed. Examples of information system functionality providing the capability for automatic execution of code are Auto Run and Auto Play. Auto Run and Auto Play are components of the Microsoft Windows operating system that dictate what actions the system takes when a drive is mounted. This requirement is designed to address vulnerabilities that arise when mobile devices such as USB memory sticks or other mobile storage devices are automatically mounted and applications are automatically invoked without user knowledge or acceptance."
  category: Security
  subcategory: '220000'
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'This check applies to the global zone only. Determine the zone that you are currently securing.


      # zonename


      If the command output is "global", this check applies.


      Determine if the removable media volume manager is running.


      # svcs -Ho state svc:/system/filesystem/rmvolmgr:default


      If the output reports that the service is "online", this is a finding.'
    check_command: This check applies to the global zone only. Determine the zone that you are currently securing.
  remediation:
    remediation_step: 'The Service Management profile is required.


      This action applies to the global zone only. Determine the zone that you are currently securing.


      # zonename


      If the command output is "global", this action applies.


      Disable the rmvolmgr service.


      # pfexec svcadm disable svc:/system/filesystem/rmvolmgr:default'
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: "Mobile devices include portable storage media (e.g., USB memory sticks, external hard disk drives) and portable computing and communications devices with information storage capability (e.g., notebook/laptop computers, personal digital assistants, cellular telephones, digital cameras, audio recording devices). \n\nAuto execution vulnerabilities can result in malicious programs being automatically executed. Examples of information system functionality providing the capability for automatic execution of code are Auto Run and Auto Play. Auto Run and Auto Play are components of the Microsoft Windows operating system that dictate what actions the system takes when a drive is mounted. This requirement is designed to address vulnerabilities that arise when mobile devices such as USB memory sticks or other mobile storage devices are automatically mounted and applications are automatically invoked without user knowledge or acceptance."
    impact: Medium
    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-220000r958548_rule - V-220000
  tags:
  - stig
  - medium
  - v-220000
