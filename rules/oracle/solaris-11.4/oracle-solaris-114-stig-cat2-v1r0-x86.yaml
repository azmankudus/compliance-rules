- rule_id: SV-216098r1016291
  rule_name: Systems must employ cryptographic hashes for passwords using the SHA-2 family of algorithms or FIPS 140-2 approved successors.
  rule_description: Cryptographic hashes provide quick password authentication while not actually storing the password.
  category: Security
  subcategory: '216098'
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Determine which cryptographic algorithms are configured.


      # grep ^CRYPT /etc/security/policy.conf


      If the command output does not include the lines below, this is a finding.


      CRYPT_DEFAULT=6

      CRYPT_ALGORITHMS_ALLOW=5,6'
    check_command: Determine which cryptographic algorithms are configured.
  remediation:
    remediation_step: 'The root role is required.


      Configure the system to disallow the use of UNIX encryption and enable SHA256 as the default encryption hash.


      # pfedit /etc/security/policy.conf


      Check that the following lines exist and are not commented out:


      CRYPT_DEFAULT=6

      CRYPT_ALGORITHMS_ALLOW=5,6'
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: Cryptographic hashes provide quick password authentication while not actually storing the password.
    impact: Medium
    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-216098r1016291_rule - V-216098
  tags:
  - stig
  - medium
  - v-216098
