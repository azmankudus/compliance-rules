- rule_id: SV-216143r959010
  rule_name: The system must disable network routing unless required.
  rule_description: 'The network routing daemon, in.routed, manages network routing tables. If enabled, it periodically supplies copies of the system''s routing tables to any directly connected hosts and networks and picks up routes supplied to it from other networks and hosts.

    Routing Internet Protocol (RIP) is a legacy protocol with a number of security weaknesses, including a lack of authentication, zoning, pruning, etc.'
  category: Security
  subcategory: '216143'
