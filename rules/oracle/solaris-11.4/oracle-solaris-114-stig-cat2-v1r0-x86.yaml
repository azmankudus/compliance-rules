- rule_id: SV-216121r959010
  rule_name: The use of FTP must be restricted.
  rule_description: FTP is an insecure protocol that transfers files and credentials in clear text, and can be replaced by using SFTP. However, if FTP is permitted for use in the environment, it is important to ensure that the default "system" accounts are not permitted to transfer files via FTP, especially the root role. Consider also adding the names of other privileged or shared accounts that may exist on the system such as user "oracle" and the account which the web server process runs under.
  category: Security
  subcategory: '216121'
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'The root role is required.


      Determine if the FTP server package is installed:


      # pkg list service/network/ftp


      If the output of this command is:


      pkg list: no packages matching ''service/network/ftp'' installed


      no further action is required.


      If the FTP server is installed, determine if FTP access is restricted.


      # for user in `logins -s | awk ''{ print $1 }''` \

      aiuser noaccess nobody nobody4; do

      grep -w "${user}" /etc/ftpd/ftpusers >/dev/null 2>&1

      if [ $? != 0 ]; then

      echo "User ''${user}'' not in /etc/ftpd/ftpusers."

      fi

      done


      If output is returned, this is a finding.'
    check_command: The root role is required.
  remediation:
    remediation_step: 'The root role is required.


      Determine if the FTP server package is installed:


      # pkg list service/network/ftp


      If the output of this command is:


      pkg list: no packages matching ''service/network/ftp'' installed


      no further action is required.


      # for user in `logins -s | awk ''{ print $1 }''` \

      aiuser noaccess nobody nobody4; do

      $(echo $user >> /etc/ftpd/ftpusers)

      done

      # sort -u /etc/ftpd/ftpusers > /etc/ftpd/ftpusers.temp

      # mv /etc/ftpd/ftpusers.temp /etc/ftpd/ftpusers'
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: FTP is an insecure protocol that transfers files and credentials in clear text, and can be replaced by using SFTP. However, if FTP is permitted for use in the environment, it is important to ensure that the default "system" accounts are not permitted to transfer files via FTP, especially the root role. Consider also adding the names of other privileged or shared accounts that may exist on the system such as user "oracle" and the account which the web server process runs under.
    impact: Medium
    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-216121r959010_rule - V-216121
  tags:
  - stig
