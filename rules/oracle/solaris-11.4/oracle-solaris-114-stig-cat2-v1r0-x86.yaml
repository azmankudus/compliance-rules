- rule_id: SV-216069r959010
  rule_name: Run control scripts must not execute world writable programs or scripts.
  rule_description: World writable files could be modified accidentally or maliciously to compromise system integrity.
  category: Security
  subcategory: '216069'
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check the permissions on the files or scripts executed from system startup scripts to see if they are world writable.


      Create a list of all potential run command level scripts.


      # ls -l /etc/init.d/* /etc/rc* | tr ''\011'' '' '' | tr -s '' '' | cut -f 9,9 -d " "


      Create a list of world writable files.


      # find / -perm -002 -type f >> WorldWritableFileList


      Determine if any of the world writeable files in "WorldWritableFileList" are called from the run command level scripts.


      Note: Depending upon the number of scripts vs. world writable files, it may be easier to inspect the scripts manually.


      # more `ls -l /etc/init.d/* /etc/rc* | tr ''\011'' '' '' | tr -s '' '' | cut -f 9,9 -d " "`


      If any system startup script executes any file or script that is world writable, this is a finding.'
    check_command: Check the permissions on the files or scripts executed from system startup scripts to see if they are world writable.
  remediation:
    remediation_step: 'Remove the world writable permission from programs or scripts executed by run control scripts.


      Procedure:


      # chmod o-w <program or script executed from run control script>'
