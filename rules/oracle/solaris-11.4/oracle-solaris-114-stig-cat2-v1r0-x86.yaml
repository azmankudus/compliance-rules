- rule_id: SV-216023r959010
  rule_name: The audit system must be configured to audit file deletions.
  rule_description: Without auditing, malicious activity cannot be detected.
  category: Security
  subcategory: '216023'
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "The Audit Configuration profile is required.\n\nThis check applies to the global zone only. Determine the zone that you are currently securing.\n\n# zonename\n\nIf the command output is \"global\", this check applies.\n\nDetermine the OS version you are currently securing.\n# uname \u2013v\n\nFor Solaris 11, 11.1, 11.2, and 11.3:\n# pfexec auditconfig -getflags | grep active |cut -f2 -d=\n\nIf \"fd\" audit flag is not included in output, this is a finding.\n\nFor Solaris 11.4 or newer:\n# pfexec auditconfig -t -getflags | cut -f2 -d=\n\nIf \"fd\" audit flag is not included in output, this is a finding.\n\nDetermine if auditing policy is set to collect command line arguments.\n\n# pfexec auditconfig -getpolicy | grep active | grep argv\n\nIf the active audit policies line does not appear, this is a finding."
    check_command: The Audit Configuration profile is required.
  remediation:
    remediation_step: 'The Audit Configuration profile is required. All audit flags must be enabled in a single command.


      This action applies to the global zone only. Determine the zone that you are currently securing.


      # zonename


      If the command output is "global", this action applies.


      For Solaris 11, 11.1, 11.2, and 11.3:

      # pfexec auditconfig -setflags cusa,-ps,fd,-fa,fm


      For Solaris 11.4 or newer:

      # pfexec auditconfig -setflags cusa,-fa,-ex,-ps,fd,fm


      Enable the audit policy to collect command line arguments.


      # pfexec auditconfig -setpolicy +argv


      These changes will not affect users that are currently logged in.'
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: Without auditing, malicious activity cannot be detected.
    impact: Medium
    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-216023r959010_rule - V-216023
  tags:
  - stig
  - medium
  - v-216023
