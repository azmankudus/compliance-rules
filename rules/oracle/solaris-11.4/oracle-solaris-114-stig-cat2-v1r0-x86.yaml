- rule_id: SV-216219r959010
  rule_name: The operating system must implement transaction recovery for transaction-based systems.
  rule_description: "Recovery and reconstitution constitutes executing an operating system contingency plan comprised of activities to restore essential missions and business functions. \n\nTransaction rollback and transaction journaling are examples of mechanisms supporting transaction recovery.\n\nWhile this is typically a database function, operating systems could be transactional in nature with respect to file processing."
  category: Security
  subcategory: '216219'
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Solaris 11 ZFS copy-on-write model allows filesystem accesses to work according to a transactional model, such that on-disk content is always consistent and cannot be configured to be out of compliance.


      Determine if any UFS file systems are mounted with the "nologging" option.


      # mount|grep nologging


      If any file systems are listed, this is a finding.'
    check_command: Solaris 11 ZFS copy-on-write model allows filesystem accesses to work according to a transactional model, such that on-disk content is always consistent and cannot be configured to be out of compliance.
  remediation:
    remediation_step: 'The root role is required.


      Solaris 11 ZFS copy-on-write model allows filesystem accesses to work according to a transactional model, such that on-disk content is always consistent and cannot be configured to be out of compliance.


      If any UFS file systems are mounted with the "nologging" options, remove that option from the /etc/vfstab file.


      # pfedit /etc/vfstab


      Locate any file systems listed with the "nologging" option and delete the keyword "nologging".'
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
