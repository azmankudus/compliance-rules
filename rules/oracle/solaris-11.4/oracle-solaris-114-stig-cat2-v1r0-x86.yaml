- rule_id: SV-216163r959010
  rule_name: The operating system must prevent internal users from sending out packets which attempt to manipulate or spoof invalid IP addresses.
  rule_description: Manipulation of IP addresses can allow untrusted systems to appear as trusted hosts, bypassing firewall and other security mechanism and resulting in system penetration.
  category: Security
  subcategory: '216163'
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "Determine the zone that you are currently securing.\n\n# zonename\n\nIf the command output is \"global\", then only the \"phys\" and \"SR-IOV\" interfaces assigned to the global zone require inspection. If using a non-Global zone, then all \"phys\" and \"SR-IOV\" interfaces assigned to the zone require inspection.\n\nIdentify if this system has physical interfaces. \n\n# dladm show-link -Z | grep -v vnic \nLINK                ZONE      CLASS     MTU    STATE    OVER\nnet0                global    phys      1500   unknown  --\ne1000g0             global    phys      1500   up       --\ne1000g1             global    phys      1500   up       --\nzoneD/net2          zoneD     iptun     65515  up       --\n\nIf \"phys\" appears in the third column, then the interface is physical.   \n\nFor each physical interface, determine if the network interface is Ethernet or InfiniBand:\n\n# dladm show-phys [interface name]\nLINK              MEDIA                STATE      SPEED  DUPLEX\
      \    DEVICE\n[name]            Ethernet             unknown    0      half      dnet0\n\nThe second column indicates either \"Ethernet\" or \"Infiniband\".\n\nFor each physical interface, determine if the host is using ip-forwarding:\n\n# ipadm show-ifprop [interface name] | grep forwarding\n[name]      forwarding      ipv4  rw   off        --         off        on,off\n[name]      forwarding      ipv6  rw   off        --         off        on,off\n\nIf \"on\" appears in the fifth column, then the interface is using ip-forwarding.\n\nFor each interface, determine if the host is using SR-IOV\u2019s Virtual Function (VF) driver:\n\n# dladm show-phys [interface name] | grep vf\n\nIf the sixth column includes 'vf' in its name, it is using SR-IOV (ex: ixgbevf0).\n\nFor each physical and SR-IOV interface, determine if network link protection capabilities are enabled.\n\n# dladm show-linkprop -p protection\nLINK    PROPERTY    PERM   VALUE         DEFAULT   POSSIBLE\nnet0    protection  rw\
      \     mac-nospoof,  --        mac-nospoof,\n                           restricted,             restricted,\n                           ip-nospoof,             ip-nospoof,\n                           dhcp-nospoof            dhcp-nospoof\n\nIf the interface uses Infiniband and if restricted, ip-nospoof, and dhcp-nospoof do not appear in the \"VALUE\" column, this is a finding.\n\nIf the interface uses ip-forwarding and if mac-nospoof, restricted, and dhcp-nospoof do not appear in the \"VALUE\" column, this is a finding.\n\nIf the interface uses SR-IOV and if mac-nospoof, restricted, and dhcp-nospoof do not appear in the \"VALUE\" column, this is a finding.\n\nIf the interface uses Ethernet without IP forwarding and if mac-nospoof, restricted, ip-nospoof, and dhcp-nospoof do not appear in the \"VALUE\" column, this is a finding."
    check_command: Determine the zone that you are currently securing.
  remediation:
    remediation_step: "Determine the name of the zone that you are currently securing.\n\n# zonename\n\nIf the command output is \"global\", then only the \"phys\" and \"SR-IOV\" interfaces assigned to the global zone require configuration. If using a non-Global zone, then all \"phys\" and \"SR-IOV\" interfaces assigned to the zone require configuration.\n\nThe Network Link Security profile is required.\n\nDetermine which network interfaces are available and what protection modes are enabled and required.\n\nEnable link protection based on each configured network interface type.\n\nFor InfiniBand:\n# pfexec dladm set-linkprop -p protection=restricted,ip-nospoof,dhcp-nospoof [interface name]  \n\nFor IP forwarding:\n# pfexec dladm set-linkprop -p protection=mac-nospoof,restricted,dhcp-nospoof [interface name] \n\nFor SR-IOV:\n# pfexec dladm set-linkprop -p protection=mac-nospoof,restricted,dhcp-nospoof [interface name] \n\nFor Ethernet without IP forwarding:\n# pfexec dladm set-linkprop -p\
      \ protection=mac-nospoof,restricted,ip-nospoof,dhcp-nospoof [interface name]"
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: Manipulation of IP addresses can allow untrusted systems to appear as trusted hosts, bypassing firewall and other security mechanism and resulting in system penetration.
    impact: Medium
    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-216163r959010_rule - V-216163
  tags:
  - stig
  - medium
  - v-216163
- rule_id: SV-216164r958358
  rule_name: Wireless network adapters must be disabled.
  rule_description: "The use of wireless networking can introduce many different attack vectors into the organization\u2019s network. Common attack vectors such as malicious association and ad hoc networks will allow an attacker to spoof a wireless access point (AP), allowing validated systems to connect to the malicious AP and enabling the attacker to monitor and record network traffic. These malicious APs can also serve to create a man-in-the-middle attack or be used to create a denial-of-service to valid network resources."
  category: Security
  subcategory: '216164'
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "This is N/A for systems that do not have wireless network adapters.\n\nVerify that there are no wireless interfaces configured on the system:\n\n# ifconfig -a\n\n\neth0      Link encap:Ethernet  HWaddr b8:ac:6f:65:31:e5  \n          inet addr:192.168.2.100  Bcast:192.168.2.255  Mask:255.255.255.0\n          inet6 addr: fe80::baac:6fff:fe65:31e5/64 Scope:Link\n          UP BROADCAST RUNNING MULTICAST  MTU:1500  Metric:1\n          RX packets:2697529 errors:0 dropped:0 overruns:0 frame:0\n          TX packets:2630541 errors:0 dropped:0 overruns:0 carrier:0\n          collisions:0 txqueuelen:1000 \n          RX bytes:2159382827 (2.0 GiB)  TX bytes:1389552776 (1.2 GiB)\n          Interrupt:17 \n\nlo        Link encap:Local Loopback  \n          inet addr:127.0.0.1  Mask:255.0.0.0\n          inet6 addr: ::1/128 Scope:Host\n          UP LOOPBACK RUNNING  MTU:16436  Metric:1\n          RX packets:2849 errors:0 dropped:0 overruns:0 frame:0\n          TX packets:2849 errors:0\
      \ dropped:0 overruns:0 carrier:0\n          collisions:0 txqueuelen:0 \n          RX bytes:2778290 (2.6 MiB)  TX bytes:2778290 (2.6 MiB)\n\n\nIf a wireless interface is configured, it must be documented and approved by the local Authorizing Official.\n\nIf a wireless interface is configured and has not been documented and approved, this is a finding."
    check_command: This is N/A for systems that do not have wireless network adapters.
  remediation:
    remediation_step: Configure the system to disable all wireless network interfaces.
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: "The use of wireless networking can introduce many different attack vectors into the organization\u2019s network. Common attack vectors such as malicious association and ad hoc networks will allow an attacker to spoof a wireless access point (AP), allowing validated systems to connect to the malicious AP and enabling the attacker to monitor and record network traffic. These malicious APs can also serve to create a man-in-the-middle attack or be used to create a denial-of-service to valid network resources."
    impact: Medium
    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-216164r958358_rule - V-216164
  tags:
  - stig
  - medium
  - v-216164
- rule_id: SV-216165r958358
  rule_name: The operating system must use mechanisms for authentication to a cryptographic module meeting the requirements of applicable federal laws, Executive orders, directives, policies, regulations, standards, and guidance for such authentication.
  rule_description: "Encryption is only as good as the encryption modules utilized. Unapproved cryptographic module algorithms cannot be verified, and cannot be relied upon to provide confidentiality or integrity, and DoD data may be compromised due to weak algorithms. \n\nApplications utilizing encryption are required to use approved encryption modules meeting the requirements of applicable federal laws, Executive orders, directives, policies, regulations, standards, and guidance. \n\nFIPS 140-2 is the current standard for validating cryptographic modules, and NSA Type-X (where X=1, 2, 3, 4) products are NSA-certified hardware based encryption modules.\n\nSatisfies: SRG-OS-000120, SRG-OS-000169"
  category: Security
  subcategory: '216165'
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'This check applies to the global zone only. Determine the zone that you are currently securing.


      # zonename


      If the command output is "global", this check applies.


      The Crypto Management profile is required to execute this command.


      Check to ensure that FIPS-140 encryption mode is enabled.


      # cryptoadm list fips-140| grep -c "is disabled"


      If the output of this command is not "0", this is a finding.'
    check_command: This check applies to the global zone only. Determine the zone that you are currently securing.
  remediation:
    remediation_step: 'The Crypto Management profile is required to execute this command.


      This action applies to the global zone only. Determine the zone that you are currently securing.


      # zonename


      If the command output is "global", this action applies.


      Enable FIPS-140 mode.


      # pfexec cryptoadm enable fips-140


      Reboot the system as requested.'
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: "Encryption is only as good as the encryption modules utilized. Unapproved cryptographic module algorithms cannot be verified, and cannot be relied upon to provide confidentiality or integrity, and DoD data may be compromised due to weak algorithms. \n\nApplications utilizing encryption are required to use approved encryption modules meeting the requirements of applicable federal laws, Executive orders, directives, policies, regulations, standards, and guidance. \n\nFIPS 140-2 is the current standard for validating cryptographic modules, and NSA Type-X (where X=1, 2, 3, 4) products are NSA-certified hardware based encryption modules.\n\nSatisfies: SRG-OS-000120, SRG-OS-000169"
    impact: Medium
    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-216165r958358_rule - V-216165
  tags:
  - stig
  - medium
  - v-216165
- rule_id: SV-216173r958408
  rule_name: The operating system must implement DoD-approved encryption to protect the confidentiality of remote access sessions.
  rule_description: "Remote access is any access to an organizational information system by a user (or an information system) communicating through an external, non-organization-controlled network (e.g., the Internet). Examples of remote access methods include dial-up, broadband, and wireless. \n\nUsing cryptography ensures confidentiality of the remote access connections.\n\nThe system will attempt to use the first cipher presented by the client that matches the server list. Listing the values \"strongest to weakest\" is a method to ensure the use of the strongest cipher available to secure the SSH connection.\n\nNote:  SSH in Solaris 11.GA-11.3 used Sun Microsystem\u2019s proprietary SUNWssh. In Solaris 11.3 OpenSSH was offered as optional software and in Solaris 11.4 OpenSSH is the only SSH offered. Both use the same /etc/ssh/sshd_config file and both, by default do not include the ciphers line."
  category: Security
  subcategory: '216173'
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "Check the SSH daemon configuration for allowed ciphers.\n \n# grep -i ciphers /etc/ssh/sshd_config | grep -v '^#\u2019 \nCiphers  aes256-ctr,aes192-ctr,aes128-ctr \n \nIf any ciphers other than \"aes256-ctr\", \"aes192-ctr\", or \"aes128-ctr\" are listed, the order differs from the example above, the \"Ciphers\" keyword is missing, or is commented out, this is a finding."
    check_command: Check the SSH daemon configuration for allowed ciphers.
  remediation:
    remediation_step: "The root role is required. \n\nModify the sshd_config file. \n\n# pfedit /etc/ssh/sshd_config \n\nChange or set the ciphers line to the following:\n\nciphers aes256-ctr,aes192-ctr,aes128-ctr \n\nRestart the SSH service. \n\n# svcadm restart svc:/network/ssh"
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: "Remote access is any access to an organizational information system by a user (or an information system) communicating through an external, non-organization-controlled network (e.g., the Internet). Examples of remote access methods include dial-up, broadband, and wireless. \n\nUsing cryptography ensures confidentiality of the remote access connections.\n\nThe system will attempt to use the first cipher presented by the client that matches the server list. Listing the values \"strongest to weakest\" is a method to ensure the use of the strongest cipher available to secure the SSH connection.\n\nNote:  SSH in Solaris 11.GA-11.3 used Sun Microsystem\u2019s proprietary SUNWssh. In Solaris 11.3 OpenSSH was offered as optional software and in Solaris 11.4 OpenSSH is the only SSH offered. Both use the same /etc/ssh/sshd_config file and both, by default do not include the ciphers line."
    impact: Medium
    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-216173r958408_rule - V-216173
  tags:
  - stig
  - medium
  - v-216173
- rule_id: SV-216174r959010
  rule_name: The operating system must use cryptographic mechanisms to protect and restrict access to information on portable digital media.
  rule_description: "When data is written to portable digital media, such as thumb drives, floppy diskettes, compact disks, and magnetic tape, etc., there is risk of data loss. \n\nAn organizational assessment of risk guides the selection of media and associated information contained on the media requiring restricted access. \n\nOrganizations need to document in policy and procedures the media requiring restricted access, individuals authorized to access the media, and the specific measures taken to restrict access. Fewer protection measures are needed for media containing information determined by the organization to be in the public domain, to be publicly releasable, or to have limited or no adverse impact if accessed by other than authorized personnel. \n\nIn these situations, it is assumed the physical access controls where the media resides provide adequate protection. The employment of cryptography is at the discretion of the information owner/steward. \n\nWhen the organization has\
    \ determined the risk warrants it, data written to portable digital media must be encrypted."
  category: Security
  subcategory: '216174'
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "This check applies to the global zone only. Determine the zone that you are currently securing.\n\n# zonename\n\nIf the command output is \"global\", this check applies.\n\nDetermine the logical node of all attached removable media:\n\n# rmformat\n\nThis command lists all attached removable devices. Note the device logical node name. For example: /dev/rdsk/c8t0d0p0\n\nDetermine which zpool is mapped to the device:\n\n# zpool status\n\nDetermine the file system names of the portable digital media:\n\n# zfs list | grep [poolname]\n\nUsing the file system name, determine if the removal media is encrypted:\n\n# zfs get encryption [filesystem] \n\nIf \"encryption off\" is listed, this is a finding."
    check_command: This check applies to the global zone only. Determine the zone that you are currently securing.
  remediation:
    remediation_step: 'The root role is required.


      Format a removable device as a ZFS encrypted file system.


      This action applies to the global zone only. Determine the zone that you are currently securing.


      # zonename


      If the command output is "global", this action applies.


      The ZFS File System Management and ZFS Storage management profiles are required.


      Insert the removable device:


      # rmformat


      This command lists all attached removable devices. Note the device logical node name. For example: /dev/rdsk/c8t0d0p0


      Create an encrypted zpool on this device using a poolname of your choice:


      # pfexec zpool create -O encryption=on [poolname] c8t0d0p0


      Enter a passphrase and confirm the passphrase. Keep the passphrase secure.


      Export the zpool before removing the media:


      # pfexec export [poolname]


      It will be necessary to enter the passphrase when inserting and importing the removable media zpool:

      Insert the removable media

      # pfexec import [poolname]


      Only store data in the encrypted file system.'
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: "When data is written to portable digital media, such as thumb drives, floppy diskettes, compact disks, and magnetic tape, etc., there is risk of data loss. \n\nAn organizational assessment of risk guides the selection of media and associated information contained on the media requiring restricted access. \n\nOrganizations need to document in policy and procedures the media requiring restricted access, individuals authorized to access the media, and the specific measures taken to restrict access. Fewer protection measures are needed for media containing information determined by the organization to be in the public domain, to be publicly releasable, or to have limited or no adverse impact if accessed by other than authorized personnel. \n\nIn these situations, it is assumed the physical access controls where the media resides provide adequate protection. The employment of cryptography is at the discretion of the information owner/steward. \n\nWhen the organization has determined\
      \ the risk warrants it, data written to portable digital media must be encrypted."
