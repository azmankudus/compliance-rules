- rule_id: SV-216141r959010
  rule_name: The system must set maximum number of half-open TCP connections to 4096.
  rule_description: 'This setting controls how many half-open connections can exist for a TCP port.


    It is necessary to control the number of completed connections to the system to provide some protection against denial of service attacks.'
  category: Security
  subcategory: '216141'
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Determine if the number of half open TCP connections is set to 4096.


      # ipadm show-prop -p _conn_req_max_q0 -co current tcp


      If the value of "4096" is not returned, this is a finding.'
    check_command: Determine if the number of half open TCP connections is set to 4096.
  remediation:
    remediation_step: 'The Network Management profile is required


      Configure maximum TCP connections for IPv4 and IPv6.


      # pfexec ipadm set-prop -p _conn_req_max_q0=4096 tcp'
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: 'This setting controls how many half-open connections can exist for a TCP port.


      It is necessary to control the number of completed connections to the system to provide some protection against denial of service attacks.'
    impact: Medium
    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-216141r959010_rule - V-216141
  tags:
  - stig
  - medium
  - v-216141
- rule_id: SV-216193r959010
  rule_name: Duplicate user names must not exist.
  rule_description: If a user is assigned a duplicate user name, it will create and have access to files with the first UID for that username in passwd.
  category: Security
  subcategory: '216193'
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'The root role is required.


      Identify any duplicate user names.


      # getent passwd | awk -F: ''{print $1}'' | uniq -d


      If output is produced, this is a finding.'
    check_command: The root role is required.
  remediation:
    remediation_step: 'The root role is required.


      Correct or justify any items discovered in the Check step. Determine if there are any duplicate user names, and work with their respective owners to determine the best course of action in accordance with site policy. Delete or change the user name of duplicate users.'
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: If a user is assigned a duplicate user name, it will create and have access to files with the first UID for that username in passwd.
    impact: Medium
    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-216193r959010_rule - V-216193
  tags:
  - stig
  - medium
  - v-216193
- rule_id: SV-216091r1016286
  rule_name: The system must require at least eight characters be changed between the old and new passwords during a password change.
  rule_description: To ensure password changes are effective in their goals, the system must ensure old and new passwords have significant differences. Without significant changes, new passwords may be easily guessed based on the value of a previously compromised password.
  category: Security
  subcategory: '216091'
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check /etc/default/passwd to verify the MINDIFF setting.


      # grep ^MINDIFF /etc/default/passwd


      If the setting is not present, or is less than eight, this is a finding.'
    check_command: Check /etc/default/passwd to verify the MINDIFF setting.
  remediation:
    remediation_step: "The root role is required.\n\n# pfedit /etc/default/passwd \n\nSearch for MINDIFF. Change the line to read:\n\nMINDIFF=8"
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: To ensure password changes are effective in their goals, the system must ensure old and new passwords have significant differences. Without significant changes, new passwords may be easily guessed based on the value of a previously compromised password.
    impact: Medium
    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-216091r1016286_rule - V-216091
  tags:
  - stig
  - medium
  - v-216091
