    audit_type: config
    detection_step: "Determine if routing is disabled. \n\n# routeadm -p | egrep \"routing |forwarding\" | grep enabled\n\nIf the command output includes \"persistent=enabled\" or \"current=enabled\", this is a finding."
    check_command: 'Determine if routing is disabled. '
  remediation:
    remediation_step: 'The Network Management profile is required.


      Disable routing for IPv4 and IPv6.


      # pfexec routeadm -d ipv4-forwarding -d ipv4-routing

      # pfexec routeadm -d ipv6-forwarding -d ipv6-routing


      To apply these changes to the running system, use the command:


      # pfexec routeadm -u'
