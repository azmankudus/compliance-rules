  - v-216121
- rule_id: SV-216123r959010
  rule_name: Unauthorized use of the at or cron capabilities must not be permitted.
  rule_description: 'On many systems, only the system administrator needs the ability to schedule jobs.


    Even though a given user is not listed in the "cron.allow" file, cron jobs can still be run as that user. The "cron.allow" file only controls administrative access to the "crontab" command for scheduling and modifying cron jobs. Much more effective access controls for the cron system can be obtained by using Role-Based Access Controls (RBAC).'
  category: Security
  subcategory: '216123'
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "Check that \"at\" and \"cron\" users are configured correctly.\n\n# ls /etc/cron.d/cron.deny\n\nIf cron.deny exists, this is a finding.\n\n# ls /etc/cron.d/at.deny\n\nIf at.deny exists, this is a finding.\n\n# cat /etc/cron.d/cron.allow\n\ncron.allow should have a single entry for \"root\", or the cron.allow file is removed if using RBAC.  \n \nIf any accounts other than root that are listed and they are not properly documented with the IA staff, this is a finding.\n\n# wc -l /etc/cron.d/at.allow | awk '{ print $1 }'\n\nIf the output is non-zero, this is a finding, or the at.allow file is removed if using RBAC."
    check_command: Check that "at" and "cron" users are configured correctly.
  remediation:
    remediation_step: "The root role is required.\n\nModify the cron configuration files.\n\n# mv /etc/cron.d/cron.deny /etc/cron.d/cron.deny.temp\n# mv /etc/cron.d/at.deny /etc/cron.d/at.deny.temp\n\nSkip the remaining steps only if using the \u201Csolaris.jobs.user\u201D RBAC role.\n\n# echo root > /etc/cron.d/cron.allow\n# cp /dev/null /etc/cron.d/at.allow\n# chown root:root /etc/cron.d/cron.allow /etc/cron.d/at.allow\n# chmod 400 /etc/cron.d/cron.allow /etc/cron.d/at.allow"
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: 'On many systems, only the system administrator needs the ability to schedule jobs.


      Even though a given user is not listed in the "cron.allow" file, cron jobs can still be run as that user. The "cron.allow" file only controls administrative access to the "crontab" command for scheduling and modifying cron jobs. Much more effective access controls for the cron system can be obtained by using Role-Based Access Controls (RBAC).'
    impact: Medium
    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-216123r959010_rule - V-216123
