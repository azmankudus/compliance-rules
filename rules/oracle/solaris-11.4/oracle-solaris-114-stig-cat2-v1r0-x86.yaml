- rule_id: SV-216109r1016293
  rule_name: User accounts must be locked after 35 days of inactivity.
  rule_description: 'Attackers that are able to exploit an inactive account can potentially obtain and maintain undetected access to an application. Owners of inactive accounts will not notice if unauthorized access to their user account has been obtained. Operating systems need to track periods of user inactivity and disable accounts after 35 days of inactivity. Such a process greatly reduces the risk that accounts will be hijacked, leading to a data compromise.


    This policy does not apply to either emergency accounts or infrequently used accounts. Infrequently used accounts are local logon accounts used by system administrators when network or normal logon/access is not available. Emergency accounts are administrator accounts created in response to crisis situations.


    Satisfies: SRG-OS-000003, SRG-OS-000118'
  category: Security
  subcategory: '216109'
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Determine whether the 35-day inactivity lock is configured properly.


      # useradd -D | xargs -n 1 | grep inactive |\

      awk -F= ''{ print $2 }''


      If the command returns a result other than 35, this is a finding.


      The root role is required for the "logins" command.


      For each configured user name and role name on the system, determine whether a 35-day inactivity period is configured. Replace [username] with an actual user name or role name.


      # logins -axo -l [username] | awk -F: ''{ print $13 }''


      If these commands provide output other than 35, this is a finding.'
    check_command: Determine whether the 35-day inactivity lock is configured properly.
  remediation:
    remediation_step: 'The root role is required.


      Perform the following to implement the recommended state:


      # useradd -D -f 35


      To set this policy on a user account, use the command(s):


      # usermod -f 35 [username]


      To set this policy on a role account, use the command(s):


      # rolemod -f 35 [name]'
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: 'Attackers that are able to exploit an inactive account can potentially obtain and maintain undetected access to an application. Owners of inactive accounts will not notice if unauthorized access to their user account has been obtained. Operating systems need to track periods of user inactivity and disable accounts after 35 days of inactivity. Such a process greatly reduces the risk that accounts will be hijacked, leading to a data compromise.


      This policy does not apply to either emergency accounts or infrequently used accounts. Infrequently used accounts are local logon accounts used by system administrators when network or normal logon/access is not available. Emergency accounts are administrator accounts created in response to crisis situations.


      Satisfies: SRG-OS-000003, SRG-OS-000118'
    impact: Medium
    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-216109r1016293_rule - V-216109
