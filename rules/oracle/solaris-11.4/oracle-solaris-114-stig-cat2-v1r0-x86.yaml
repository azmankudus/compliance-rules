- rule_id: SV-233301r959010
  rule_name: The sshd server must bind the X11 forwarding server to the loopback address.
  rule_description: "As enabling X11 Forwarding on the host can permit a malicious user to secretly open another X11 connection to another remote client during the session and perform unobtrusive activities such as keystroke monitoring, if the X11 services are not required for the system's intended function, they should be disabled or restricted as appropriate to the user's needs.\nBy default, sshd binds the forwarding server to the loopback address and sets the hostname part of the DISPLAY environment variable to \u201Clocalhost\u201D.  This prevents remote hosts from connecting to the proxy display."
  category: Security
  subcategory: '233301'
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Determine if the X11 forwarding server is bound to the loopback address.


      # grep "^X11UseLocalhost" /etc/ssh/sshd_config


      If the output of this command is not:


      X11UseLocalhost yes


      this is a finding.'
    check_command: Determine if the X11 forwarding server is bound to the loopback address.
  remediation:
    remediation_step: "The root role is required.\n\nModify the sshd_config file.\n\n# vi /etc/ssh/sshd_config\n\nLocate the line containing:\n\nX11UseLocalhost \n\nChange it to:\n\nX11UseLocalhost yes\n\nRestart the SSH service.\n\n# svcadm restart svc:/network/ssh"
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: "As enabling X11 Forwarding on the host can permit a malicious user to secretly open another X11 connection to another remote client during the session and perform unobtrusive activities such as keystroke monitoring, if the X11 services are not required for the system's intended function, they should be disabled or restricted as appropriate to the user's needs.\nBy default, sshd binds the forwarding server to the loopback address and sets the hostname part of the DISPLAY environment variable to \u201Clocalhost\u201D.  This prevents remote hosts from connecting to the proxy display."
    impact: Medium
