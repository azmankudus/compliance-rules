- rule_id: SV-216233r958574
  rule_name: The operating system must back up audit records at least every seven days onto a different system or system component than the system or component being audited.
  rule_description: 'Protection of log data includes assuring log data is not accidentally lost or deleted. Backing up audit records to a different system or onto separate media than the system being audited on an organizationally defined frequency helps to assure in the event of a catastrophic system failure, the audit records will be retained.


    This helps to ensure a compromise of the information system being audited does not also result in a compromise of the audit records.


    This requirement can be met by the operating system continuously sending records to a centralized logging server.'
  category: Security
  subcategory: '216233'
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'This check applies to the global zone only. Determine the zone that you a currently securing.


      # zonename


      If the command output is "global" this check applies.


      The operator must back up audit records at least every 7 days.


      If the operator is unable to provide a documented procedure or the documented procedure is not being followed, then this is a finding.'
    check_command: This check applies to the global zone only. Determine the zone that you a currently securing.
  remediation:
    remediation_step: 'This fix applies to the global zone only. Determine the zone that you are currently securing.


      # zonename


      If the command output is "global", this check applies.


      The operator shall back up audit records at least every seven days.'
