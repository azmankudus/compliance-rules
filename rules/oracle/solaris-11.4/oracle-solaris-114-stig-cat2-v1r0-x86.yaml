- rule_id: SV-220013r958732
  rule_name: The operating system must protect the audit records resulting from non-local accesses to privileged accounts and the execution of privileged functions.
  rule_description: Protection of audit records and audit data is of critical importance. Care must be taken to ensure privileged users cannot circumvent audit protections put in place. Auditing might not be reliable when performed by an operating system which the user being audited has privileged access to. The privileged user could inhibit auditing or directly modify audit records. To prevent this from occurring, privileged access shall be further defined between audit-related privileges and other privileges, thus limiting the users with audit-related privileges.
  category: Security
  subcategory: '220013'
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "The audit configuration profile is required. \n\nThis check applies to the global zone only. Determine the zone that you are currently securing.\n\n# zonename\n\nIf the command output is \"global\", this check applies.\n\nDetermine the location of the local audit trail files.\n\n# auditconfig -getplugin audit_binfile\nPlugin: audit_binfile (active)\nAttributes: p_dir=/var/audit;p_fsize=4M;p_minfree=1;\"\n\nIn this example, the audit files can be found in /var/audit. Check that the permissions on the audit files are 640 (rw- r-- --) or less permissive.\n\n# ls -al /var/audit\n\n# ls -l /var/audit/*\n\nIf the permissions are more permissive than 640, this is a finding.\n\nNote:  The default Solaris 11 location for /var/audit is a link to /var/share/audit."
    check_command: 'The audit configuration profile is required. '
  remediation:
    remediation_step: 'The root role is required.


      Determine the location of the local audit trail files.


      # pfexec auditconfig -getplugin audit_binfile

      Plugin: audit_binfile (active)

      Attributes: p_dir=/var/audit;p_fsize=4M;p_minfree=1


      In this example, the audit files can be found in /var/audit.


      Change the permissions on the audit trail files and the audit directory.


      # chmod 640 /var/share/audit/*


      # chmod 750 /var/share/audit


      Note:  The default Solaris 11 location for /var/audit is a link to /var/share/audit.'
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: Protection of audit records and audit data is of critical importance. Care must be taken to ensure privileged users cannot circumvent audit protections put in place. Auditing might not be reliable when performed by an operating system which the user being audited has privileged access to. The privileged user could inhibit auditing or directly modify audit records. To prevent this from occurring, privileged access shall be further defined between audit-related privileges and other privileges, thus limiting the users with audit-related privileges.
    impact: Medium
    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-220013r958732_rule - V-220013
  tags:
  - stig
  - medium
  - v-220013
- rule_id: SV-220014r1016297
  rule_name: The operating system must synchronize internal information system clocks with a server that is synchronized to one of the redundant United States Naval Observatory (USNO) time servers or a time server designated for the appropriate DOD network (NIPRNet/SIPRNet), and/or the Global Positioning System (GPS).
  rule_description: To assure the accuracy of the system clock, it must be synchronized with an authoritative time source within DOD. Many system functions, including time-based login and activity restrictions, automated reports, system logs, and audit records depend on an accurate system clock. If there is no confidence in the correctness of the system clock, time-based functions may not operate as intended and records may be of diminished value.
  category: Security
  subcategory: '220014'
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'NTP must be used and used only in the global zone. Determine the zone to be secured.


      # zonename


      If the command output is not "global", then NTP must be disabled. Check the system for a running NTP daemon.


      # svcs -Ho state ntp


      If NTP is online, this is a finding.


      If the output from "zonename" is "global", then NTP must be enabled. Check the system for a running NTP daemon.


      # svcs -Ho state ntp



      If NTP is not online, this is a finding.


      If NTP is running, confirm the servers and peers or multicast client (as applicable) are local or an authoritative U.S. DOD source.


      For the NTP daemon:


      # more /etc/inet/ntp.conf


      If a nonlocal/nonauthoritative (non-DOD source, non-USNO-based, or non-GPS) time server is used, this is a finding.


      Determine if the time synchronization frequency is correct.


      # grep "maxpoll" /etc/inet/ntp.conf


      If the command returns "File not found" or any value for maxpoll, this is a finding.


      Determine if the running NTP server is configured properly.


      # ntpq -p | awk ''($6 ~ /[0-9]+/ && $6 > 86400) { print $1" "$6 }''


      This will print out the name of any time server whose current polling time is greater than 24 hours (along with the actual value). If there is any output, this is a finding.'
    check_command: NTP must be used and used only in the global zone. Determine the zone to be secured.
  remediation:
    remediation_step: 'The root role is required.


      Determine the zone to be secured.


      # zonename


      If the command output is not "global", then NTP must be disabled.


      # svcadm disable ntp


      If the output from "zonename" is "global", then NTP must be enabled.


      To activate the ntpd daemon, the ntp.conf file must first be created.


      # cp /etc/inet/ntp.client /etc/inet/ntp.conf


      # pfedit /etc/inet/ntp.conf


      Make site-specific changes to this file as needed in the form.


      server [ntpserver]


      Locate the line containing maxpoll (if it exists).


      Delete the line.


      Start the ntpd daemon.


      # svcadm enable ntp


      Use a local authoritative time server synchronizing to an authorized DOD time source, a USNO-based time server, or a GPS. Ensure all systems in the facility feed from one or more local time servers that feed from the authoritative time server.


      Edit the NTP configuration files and make the necessary changes to add the approved time servers per Solaris documentation.'
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: To assure the accuracy of the system clock, it must be synchronized with an authoritative time source within DOD. Many system functions, including time-based login and activity restrictions, automated reports, system logs, and audit records depend on an accurate system clock. If there is no confidence in the correctness of the system clock, time-based functions may not operate as intended and records may be of diminished value.
    impact: Medium
    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-220014r1016297_rule - V-220014
  tags:
  - stig
  - medium
  - v-220014
- rule_id: SV-220015r958944
  rule_name: The operating system must verify the correct operation of security functions in accordance with organization-defined conditions and in accordance with organization-defined frequency (if periodic verification).
  rule_description: Security functional testing involves testing the operating system for conformance to the operating system security function specifications, as well as for the underlying security model. The need to verify security functionality applies to all security functions. The conformance criteria state the conditions necessary for the operating system to exhibit the desired security behavior or satisfy a security property. For example, successful login triggers an audit entry.
  category: Security
  subcategory: '220015'
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Ask the operator if DoD-approved SCAP compliance checking software is installed and run on a periodic basis.


      If DoD-approved SCAP compliance checking software is not installed and/or not run on a periodic basis, this is a finding.'
    check_command: Ask the operator if DoD-approved SCAP compliance checking software is installed and run on a periodic basis.
  remediation:
    remediation_step: Install, configure, and run DoD-approved SCAP compliance checking software on a periodic basis. Review the output of the software and document any out-of-compliance issues.
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: Security functional testing involves testing the operating system for conformance to the operating system security function specifications, as well as for the underlying security model. The need to verify security functionality applies to all security functions. The conformance criteria state the conditions necessary for the operating system to exhibit the desired security behavior or satisfy a security property. For example, successful login triggers an audit entry.
    impact: Medium
    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-220015r958944_rule - V-220015
  tags:
  - stig
  - medium
  - v-220015
- rule_id: SV-224672r958726
  rule_name: The operating system must prevent non-privileged users from circumventing malicious code protection capabilities.
  rule_description: "In order to minimize potential negative impact to the organization caused by malicious code, it is imperative that malicious code is identified and eradicated prior to entering protected enclaves via operating system entry and exit points. \n\nThe requirement states that AV and malware protection applications must be used at entry and exit points. For the operating system, this means an anti-virus application must be installed on machines that are the entry and exit points."
  category: Security
  subcategory: '224672'
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'The operator will ensure that anti-virus software is installed and operating.


      If the operator is unable to provide a documented configuration for an installed anti-virus software system or if not properly used, this is a finding.'
    check_command: The operator will ensure that anti-virus software is installed and operating.
  remediation:
    remediation_step: The operator will ensure that anti-virus software is installed and operating.
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
