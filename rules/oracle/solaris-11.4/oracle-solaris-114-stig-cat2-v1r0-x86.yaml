    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-216219r959010_rule - V-216219
  tags:
  - stig
  - medium
  - v-216219
- rule_id: SV-216221r959010
  rule_name: A file integrity baseline must be created, maintained, and reviewed at least weekly to determine if unauthorized changes have been made to important system files located in the root file system.
  rule_description: A file integrity baseline is a collection of file metadata used to evaluate the integrity of the system. A minimal baseline must contain metadata for all device files, setuid files, setgid files, system libraries, system binaries, and system configuration files. The minimal metadata must consist of the mode, owner, group owner, and modification times. For regular files, metadata must also include file size and a cryptographic hash of the file's contents.
  category: Security
  subcategory: '216221'
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "The root role is required.\n\nSolaris 11 includes the Basic Account and Reporting Tool (BART), which uses cryptographic-strength checksums and file system metadata to determine changes. By default, the manifest generator catalogs all attributes of all files in the root (/) file system. File systems mounted on the root file system are cataloged only if they are of the same type as the root file system.\n\nA Baseline BART manifest may exist in: \n/var/adm/log/bartlogs/[control manifest filename]\n\nIf a BART manifest does not exist, this is a finding.\n\nAt least weekly, create a new BART baseline report.\n\n# bart create > /var/adm/log/bartlogs/[new manifest filename]\n\nCompare the new report to the previous report to identify any changes in the system baseline.\n\n# bart compare /var/adm/log/bartlogs/[baseline manifest filename] /var/adm/log/bartlogs/[new manifest filename]\n\nExamine the BART report for changes. If there are changes to system files in /etc that are\
      \ not approved, this is a finding."
    check_command: The root role is required.
  remediation:
    remediation_step: 'The root role is required.


      Solaris 11 includes the Basic Account and Reporting Tool (BART), which uses cryptographic-strength checksums and file system metadata to determine changes. By default, the manifest generator catalogs all attributes of all files in the root (/) file system. File systems mounted on the root file system are cataloged only if they are of the same type as the root file system.


      Create a protected area to store BART manifests.

      # mkdir /var/adm/log/bartlogs

      # chmod 700 /var/adm/log/bartlogs


      After initial installation and configuration of the system, create a manifest report of the current baseline.


      # bart create > /var/adm/log/bartlogs/[baseline manifest filename]'
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: A file integrity baseline is a collection of file metadata used to evaluate the integrity of the system. A minimal baseline must contain metadata for all device files, setuid files, setgid files, system libraries, system binaries, and system configuration files. The minimal metadata must consist of the mode, owner, group owner, and modification times. For regular files, metadata must also include file size and a cryptographic hash of the file's contents.
    impact: Medium
    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-216221r959010_rule - V-216221
  tags:
  - stig
  - medium
  - v-216221
- rule_id: SV-216223r959010
  rule_name: Direct logins must not be permitted to shared, default, application, or utility accounts.
  rule_description: Shared accounts (accounts where two or more people log in with the same user identification) do not provide identification and authentication. There is no way to provide for non-repudiation or individual accountability.
  category: Security
  subcategory: '216223'
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'The Audit Review profile is required.


      This check applies to the global zone only. Determine the zone that you are currently securing.


      # zonename


      If the command output is "global", this check applies.


      Use the "auditreduce" command to check for multiple accesses to an account


      # auditreduce -c lo -u [shared_user_name] | praudit -l


      If users log directly into accounts, rather than using the "su" command from their own named account to access them, this is a finding. Also, ask the SA or the IAO if shared accounts are logged into directly or if users log into an individual account and switch user to the shared account.'
    check_command: The Audit Review profile is required.
  remediation:
    remediation_step: 'The root role is required.


      This action applies to the global zone only. Determine the zone that you are currently securing.


      # zonename


      If the command output is "global", this action applies.


      Use the switch user ("su") command from a named account login to access shared accounts. Maintain audit trails that identify the actual user of the account name. Document requirements and procedures for users/administrators to log into their own accounts first and then switch user ("su") to the shared account.'
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: Shared accounts (accounts where two or more people log in with the same user identification) do not provide identification and authentication. There is no way to provide for non-repudiation or individual accountability.
    impact: Medium
    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-216223r959010_rule - V-216223
  tags:
  - stig
  - medium
  - v-216223
