- rule_id: SV-216042r958434
  rule_name: The operating system must protect audit information from unauthorized access.
  rule_description: "If audit data were to become compromised, then competent forensic analysis and discovery of the true source of potentially malicious system activity is difficult, if not impossible, to achieve. \n\nTo ensure the veracity of audit data, the operating system must protect audit information from unauthorized access.\n\nSatisfies: SRG-OS-000057, SRG-OS-000058, SRG-OS-000059"
  category: Security
  subcategory: '216042'
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'The root role is required.


      This check applies to the global zone only. Determine the zone that you are currently securing.


      # zonename


      If the command output is "global", this check applies.


      Check that the directory storing the audit files is owned by root and has permissions 750 or less.


      Note: By default in Solaris 11.1, /var/audit is a link to /var/share/audit which is mounted on rpool/VARSHARE.


      Determine the location of the audit trail files

      # pfexec auditconfig -getplugin audit_binfile


      The output will appear in this form:


      Plugin: audit_binfile (active)

      Attributes: p_dir=/var/audit;p_fsize=0;p_minfree=1


      The p_dir attribute defines the location of the audit directory.

      # ls -ld /var/share/audit


      Check the audit directory is owned by root, group is root, and permissions are 750 (rwx r-- ---) or less. If the permissions are excessive, this is a finding.'
    check_command: The root role is required.
  remediation:
    remediation_step: 'Note: By default in Solaris 11.1, /var/audit is a link to /var/share/audit which is mounted on rpool/VARSHARE.


      The root role is required.


      This action applies to the global zone only. Determine the zone that you are currently securing.


      # zonename


      If the command output is "global", this action applies.


      Determine the location of the audit trail files

      # pfexec auditconfig -getplugin audit_binfile|


      The output will appear in this form:


      Plugin: audit_binfile (active)

      Attributes: p_dir=/var/audit;p_fsize=0;p_minfree=1


      The p_dir attribute defines the location of the audit directory.


      # chown root [directory]

      # chgrp root [directory]

      # chmod 750 [directory]'
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: "If audit data were to become compromised, then competent forensic analysis and discovery of the true source of potentially malicious system activity is difficult, if not impossible, to achieve. \n\nTo ensure the veracity of audit data, the operating system must protect audit information from unauthorized access.\n\nSatisfies: SRG-OS-000057, SRG-OS-000058, SRG-OS-000059"
    impact: Medium
    false_positive_risk: Low
    references:
    - type: STIG
      reference: SV-216042r958434_rule - V-216042
  tags:
