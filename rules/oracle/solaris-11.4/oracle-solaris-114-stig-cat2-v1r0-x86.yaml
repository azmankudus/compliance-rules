- rule_id: SV-216208r959010
  rule_name: Process core dumps must be disabled unless needed.
  rule_description: Process core dumps contain the memory in use by the process when it crashed. Process core dump files can be of significant size and their use can result in file systems filling to capacity, which may result in denial of service. Process core dumps can be useful for software debugging.
  category: Security
  subcategory: '216208'
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check the process core dump configuration.

      # coreadm | grep enabled


      If any lines are returned by coreadm other than "logging", this is a finding.'
    check_command: Check the process core dump configuration.
  remediation:
    remediation_step: 'The Maintenance and Repair profile is required.


      Change the process core dump configuration to disable core dumps globally and on a per process basis.


      # coreadm -d global

      # coreadm -d process

      # coreadm -d global-setid

      # coreadm -d proc-setid

      # coreadm -e log'
    rollback_supported: true
    reboot_required: false
    service_impact: Minimal
    estimated_time: 5 minutes
  context:
    rationale: Process core dumps contain the memory in use by the process when it crashed. Process core dump files can be of significant size and their use can result in file systems filling to capacity, which may result in denial of service. Process core dumps can be useful for software debugging.
    impact: Medium
    false_positive_risk: Low
