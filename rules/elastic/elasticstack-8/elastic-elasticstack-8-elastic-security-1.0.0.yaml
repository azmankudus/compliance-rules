  - rule_id: ES-SEC-029
    rule_name: Configure Active Directory Realm Settings
    rule_description: Active Directory realms must be properly configured with SSL and appropriate timeouts.
    category: Authentication
    subcategory: Active Directory
    testing_status: untested
    assessment:
      severity: High
      is_auto: true
      automation_level: Full
      audit_type: config
      detection_step: Verify Active Directory realm configuration in elasticsearch.yml
      check_command: "grep -A30 'active_directory\\.' /etc/elasticsearch/elasticsearch.yml || echo 'Active Directory not configured'"
      expected_value: "AD realm configured with SSL and proper settings"
    remediation:
      remediation_step: |
        Configure Active Directory realm in elasticsearch.yml:
        xpack.security.authc.realms.active_directory.my_ad:
          order: 0
          domain_name: example.com
          url: ldaps://ad.example.com:636
          bind_dn: cn=service_account,ou=users,dc=example,dc=com
          secure_bind_password: in_keystore
          ssl.verification_mode: full
          timeout.tcp_connect: 5s
          timeout.ldap_search: 5s
        Store bind password in keystore:
        ./bin/elasticsearch-keystore add xpack.security.authc.realms.active_directory.my_ad.secure_bind_password
      rollback_supported: true
      reboot_required: false
      service_impact: Elasticsearch restart required
      estimated_time: 15 minutes
    context:
      rationale: Proper AD configuration ensures secure and reliable authentication.
      impact: High - Misconfigured AD can lead to authentication failures or security issues.
      false_positive_risk: Low
      references:
        - type: Documentation
          reference: https://www.elastic.co/guide/en/elasticsearch/reference/current/security-settings.html
    tags:
      - authentication
      - active-directory
      - ldap

