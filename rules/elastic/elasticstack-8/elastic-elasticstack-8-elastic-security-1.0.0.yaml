        Configure strong cipher suites in elasticsearch.yml:
        xpack.security.transport.ssl.cipher_suites: ["TLS_AES_256_GCM_SHA384", "TLS_AES_128_GCM_SHA256", "TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384"]
        xpack.security.http.ssl.cipher_suites: ["TLS_AES_256_GCM_SHA384", "TLS_AES_128_GCM_SHA256"]
        Restart Elasticsearch after configuration.
      rollback_supported: true
      reboot_required: false
      service_impact: Elasticsearch restart required
      estimated_time: 5 minutes
    context:
      rationale: Strong cipher suites ensure encryption cannot be easily broken.
      impact: Medium - Weak ciphers can lead to decrypted communications.
      false_positive_risk: Low
      references:
        - type: Documentation
          reference: https://www.elastic.co/guide/en/elasticsearch/reference/current/security-settings.html
