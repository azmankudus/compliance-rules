  - rule_id: ES-SEC-023
    rule_name: Configure Kibana Session Management
    rule_description: Kibana session timeouts and concurrent session limits must be configured to prevent unauthorized access through idle sessions.
    category: Authentication
    subcategory: Session Management
    testing_status: untested
    assessment:
      severity: Medium
      is_auto: true
      automation_level: Full
      audit_type: config
      detection_step: Verify Kibana session settings in kibana.yml
      check_command: "grep 'xpack.security.session' /etc/kibana/kibana.yml || echo 'Using default session settings'"
      expected_value: "Session timeouts configured"
    remediation:
      remediation_step: |
        Configure session management in kibana.yml:
        xpack.security.session.idleTimeout: "1h"
        xpack.security.session.lifespan: "8h"
        xpack.security.session.concurrentSessions.max: 10
        Restart Kibana after configuration.
      rollback_supported: true
      reboot_required: false
      service_impact: Kibana restart required
      estimated_time: 5 minutes
    context:
      rationale: Proper session management prevents unauthorized access through abandoned sessions.
      impact: Medium - Long-lived sessions can be exploited if a user's computer is compromised.
      false_positive_risk: Low
      references:
        - type: Documentation
          reference: https://www.elastic.co/guide/en/kibana/current/security-settings.html
    tags:
      - kibana
      - session
      - authentication

  - rule_id: ES-SEC-024
    rule_name: Configure Realm Authentication Order
    rule_description: Authentication realms must be configured with appropriate order to ensure proper authentication flow.
    category: Authentication
    subcategory: Realm Configuration
    testing_status: untested
    assessment:
      severity: Medium
      is_auto: true
      automation_level: Full
      audit_type: config
      detection_step: Verify realm configuration in elasticsearch.yml
      check_command: "grep -A10 'xpack.security.authc.realms' /etc/elasticsearch/elasticsearch.yml || echo 'Using default realms'"
      expected_value: "Realms configured with proper order"
    remediation:
      remediation_step: |
        Configure realms with order in elasticsearch.yml:
        xpack.security.authc.realms:
          native.realm1:
            order: 0
          ldap.realm2:
            order: 1
          active_directory.realm3:
            order: 2
        Ensure each realm has a unique order value.
        Restart Elasticsearch after configuration.
      rollback_supported: true
      reboot_required: false
      service_impact: Elasticsearch restart required
      estimated_time: 5 minutes
    context:
      rationale: Proper realm order ensures authentication attempts are processed in the expected sequence.
      impact: Medium - Incorrect order can lead to authentication failures or security bypasses.
      false_positive_risk: Low
      references:
        - type: Documentation
          reference: https://www.elastic.co/guide/en/elasticsearch/reference/current/security-settings.html
    tags:
      - authentication
      - realms
      - ldap

  - rule_id: ES-SEC-025
    rule_name: Configure LDAP Realm SSL Settings
    rule_description: LDAP realms must be configured with SSL/TLS to protect authentication credentials during LDAP queries.
    category: Authentication
    subcategory: LDAP Security
    testing_status: untested
    assessment:
      severity: High
      is_auto: true
      automation_level: Full
      audit_type: config
      detection_step: Verify LDAP SSL configuration in elasticsearch.yml
      check_command: "grep -A20 'ldap\\.' /etc/elasticsearch/elasticsearch.yml | grep 'url\\|ssl'"
      expected_value: "LDAP URLs use ldaps:// or SSL is configured"
    remediation:
      remediation_step: |
        Configure LDAP with SSL in elasticsearch.yml:
        xpack.security.authc.realms.ldap.my_ldap:
          order: 0
          url: "ldaps://ldap.example.com:636"
          ssl.verification_mode: full
          ssl.certificate_authorities: ["/path/to/ca.crt"]
        Restart Elasticsearch after configuration.
      rollback_supported: true
      reboot_required: false
      service_impact: Elasticsearch restart required
      estimated_time: 10 minutes
    context:
      rationale: SSL/TLS for LDAP protects credentials during transmission to the LDAP server.
      impact: High - Unencrypted LDAP traffic exposes credentials to network sniffing.
      false_positive_risk: Low
      references:
        - type: Documentation
          reference: https://www.elastic.co/guide/en/elasticsearch/reference/current/security-settings.html
    tags:
      - ldap
      - ssl
      - authentication

  - rule_id: ES-SEC-026
    rule_name: Configure Automata Cache Settings
    rule_description: Automata cache settings must be configured to prevent DoS attacks through complex pattern matching.
    category: System Configuration
    subcategory: Performance Security
    testing_status: untested
    assessment:
      severity: Low
      is_auto: true
      automation_level: Full
      audit_type: config
      detection_step: Verify automata cache configuration in elasticsearch.yml
      check_command: "grep 'xpack.security.automata' /etc/elasticsearch/elasticsearch.yml || echo 'Using defaults'"
      expected_value: "Automata cache configured or using defaults"
    remediation:
      remediation_step: |
        Configure automata cache in elasticsearch.yml:
        xpack.security.automata.max_determinized_states: 100000
        xpack.security.automata.cache.enabled: true
        xpack.security.automata.cache.size: 10000
        xpack.security.automata.cache.ttl: 48h
        Restart Elasticsearch after configuration.
      rollback_supported: true
      reboot_required: false
      service_impact: Elasticsearch restart required
      estimated_time: 5 minutes
    context:
      rationale: Proper automata settings prevent DoS attacks through complex wildcard patterns.
      impact: Low - Misconfigured settings can lead to performance issues or DoS.
      false_positive_risk: Low
      references:
        - type: Documentation
          reference: https://www.elastic.co/guide/en/elasticsearch/reference/current/security-settings.html
    tags:
      - performance
      - security
      - cache

