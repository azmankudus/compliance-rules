    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'As a user with access to the ${server.config.dir}/server.xml file. Review the contents and identify if users have been granted the reader-role. grep -i reader-role ${server.config.dir}/server.xml If the reader-role has been created, users in that role must be documented and approved. If users in the reader-role are not approved, this is a finding. EXAMPLE: appSecurity-2.0 group group:realmName/groupUniqueId user user:realmName/userUniqueId'
    check_command: 'As a user with access to the ${server.config.dir}/server.xml file. Review the contents and identify if users have been granted the reader-role. grep -i reader-role ${server.config.dir}/server.xml If the reader-role has been created, users in that role must be documented and approved. If users in the reader-role are not approved, this is a finding. EXAMPLE: appSecurity-2.0 group group:realmName/groupUniqueId user user:realmName/userUniqueId'
  remediation:
    remediation_step: 'Edit the ${server.config.dir}/server.xml file. If unauthorized users have been added to the reader-role, remove those users. Otherwise, document the users who are granted the reader-role access. To allow read-only access to select administrative REST APIs, the ${server.config.dir}/server.xml must be configured as follows. Additionally, the users and groups they are a part of must be defined within LDAP. EXAMPLE: appSecurity-2.0 group group:realmName/groupUniqueIduseruser:realmName/userUniqueId'
