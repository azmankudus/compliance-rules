  legacy_ids:
  - V-250342
  - IBMW-LS-000790
  rule_name: Users in a reader-role must be authorized.
  rule_description: The reader role is a management role that allows read-only access to select administrative REST APIs as well as the Admin Center UI (adminCenter-1.0). Preventing non-privileged users from viewing privileged functions mitigates the risk that unauthorized individuals or processes may gain unnecessary access to information or privileges. Users granted reader role access must be authorized.false
