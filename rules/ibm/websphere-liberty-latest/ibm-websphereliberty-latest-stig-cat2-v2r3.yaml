rules:
- rule_id: STIG-V-250322
  legacy_ids:
  - V-250322
  - IBMW-LS-000010
  rule_name: Maximum in-memory session count must be set according to application requirements.
  rule_description: 'Application management includes the ability to control the number of sessions that use an application by all accounts and/or account types. Limiting the number of allowed sessions is helpful in limiting risks related to Denial of Service attacks. Application servers host and expose business logic and application processes. The application server must possess the capability to limit the maximum number of concurrent sessions in a manner that affects the entire application server or on an individual application basis. Although there is some latitude concerning the settings themselves, the settings should follow DoD-recommended values, but the settings should be configurable to allow for future DoD direction. While the DoD will specify recommended values, the values can be adjusted to accommodate the operational requirement of a given system. The System Security Plan should be reviewed and the maximum number of concurrent sessions allowable and defined within that plan should
    be used in the httpSession element. For example, if the maximum number of concurrent sessions is defined in the System Security Plan as 5000, then the httpSession element in ${server.config.dir}/server.xml should be configured as: For http session security settings to apply, the security feature (appSecurity-2.0) must be defined in order to configure a user registry for the servlet to authenticate against. The servlet feature (servlet-3.1) must be defined in order to use a web application, and the ldap feature (ldapRegistry-3.0) must be defined in order to configure an enterprise-level user registry for authentication of the servlet users.false'
  category: Session Management
  subcategory: Sessions
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Review the System Security plan to determine the maximum number of concurrent sessions allowed. This is a per user setting and must be defined by the application admins. As a privileged user with access to the server.xml file, review file content and identify the "maxInMemorySessionCount" and the allowOverflow settings. EXAMPLE: grep -i maxInMemorySessionCount server.xml If maxInMemorySessionCount is not set in server.xml according to the settings defined in the system security plan or if allowOverflow="true", this is a finding.'
    check_command: 'Review the System Security plan to determine the maximum number of concurrent sessions allowed. This is a per user setting and must be defined by the application admins. As a privileged user with access to the server.xml file, review file content and identify the "maxInMemorySessionCount" and the allowOverflow settings. EXAMPLE: grep -i maxInMemorySessionCount server.xml If maxInMemorySessionCount is not set in server.xml according to the settings defined in the system security plan or if allowOverflow="true", this is a finding.'
  remediation:
    remediation_step: 'To limit the max number of concurrent sessions available, the ${server.config.dir}/server.xml must be configured with maxInMemorySessionCount set according to system security plan and allowOverflow="false". EXAMPLE:'
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart may be required
    estimated_time: 15 minutes
  context:
    rationale: Application management includes the ability to control the number of sessions that use an application by all accounts and/or account types. Limiting the number of allowed sessions is helpful in limiting risks related to Denial of Service attacks. Application servers host and expose business logic and application processes. The application server must possess the capability to limit the maximum number of concurrent sessions in a manner that affects the entire application server or on an individua
    impact: Non-compliance may result in security vulnerabilities
    false_positive_risk: Low
  tags:
  - stig
  - websphere-liberty
  - openliberty
  - ibm
  - session-management
- rule_id: STIG-V-250323
  legacy_ids:
  - V-250323
  - IBMW-LS-000020
  rule_name: The WebSphere Liberty Server Quality of Protection (QoP) must be set to use TLSv1.2 or higher.
  rule_description: Quality of Protection in WebSphere Liberty specifies the security level, ciphers, and mutual authentication settings for the Secure Socket Layer (SSL/TLS) configuration. For Quality of Protection settings to apply, the security feature (appSecurity-2.0) must be defined in order to configure a user registry for the servlet to authenticate against. The SSL feature (ssl-1.0) must be defined in order to configure ssl settings, and the ldap feature (ldapRegistry-3.0) must be defined in order to configure an enterprise-level user registry for authentication of users.false
  category: Cryptography
  subcategory: TLS/SSL
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'As a privileged user with local file access to ${server.config.dir}/server.xml, verify the appSecurity-x.x feature and the sslProtocol settings are configured. grep -i appsecurity- server.xml RESULT: appSecurity-2.0 Verify the SSL protocol setting is configured for TLSV1.2 for every SSL configuration. There can be multiple SSL configurations and SSL ID settings. grep -i " If the SSL protocol setting does not specify TLS v.1.2 or higher, or if the appSecurity feature is not configured, this is a finding.'
    check_command: 'As a privileged user with local file access to ${server.config.dir}/server.xml, verify the appSecurity-x.x feature and the sslProtocol settings are configured. grep -i appsecurity- server.xml RESULT: appSecurity-2.0 Verify the SSL protocol setting is configured for TLSV1.2 for every SSL configuration. There can be multiple SSL configurations and SSL ID settings. grep -i " If the SSL protocol setting does not specify TLS v.1.2 or higher, or if the appSecurity feature is not configured, this is a finding.'
  remediation:
    remediation_step: 'To ensure the QoP is set to TLS v1.2 or higher, the ${server.config.dir}/server.xml file must be configured as follows: appSecurity-2.0ssl-1.0 For every SSL configuration, the sslProtocol field must be set to TLS v1.2 or higher.'
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart may be required
    estimated_time: 15 minutes
  context:
    rationale: Quality of Protection in WebSphere Liberty specifies the security level, ciphers, and mutual authentication settings for the Secure Socket Layer (SSL/TLS) configuration. For Quality of Protection settings to apply, the security feature (appSecurity-2.0) must be defined in order to configure a user registry for the servlet to authenticate against. The SSL feature (ssl-1.0) must be defined in order to configure ssl settings, and the ldap feature (ldapRegistry-3.0) must be defined in order to confi
    impact: Non-compliance may result in security vulnerabilities
    false_positive_risk: Low
  tags:
  - stig
  - websphere-liberty
  - openliberty
  - ibm
  - cryptography
- rule_id: STIG-V-250324
  legacy_ids:
  - V-250324
  - IBMW-LS-000030
  rule_name: Security cookies must be set to HTTPOnly.
  rule_description: 'Web applications use cookies to track users across requests. These cookies, while typically not sensitive in themselves, connect to the existing state on the back-end system. If an intruder were to capture one of these cookies, they could potentially use the cookie to act as the user. Important web traffic should be encrypted using SSL. This includes important cookies. In the case of WebSphere Liberty Server, the most important cookies are the LTPA cookie and session cookie; therefore, both should be configured to be only sent over SSL. To set httpOnly on the application server’s cookies, the security feature (appSecurity-2.0) must be defined in order to configure a user registry for the servlet to authenticate against. The servlet (servlet-3.1) feature must be defined in order to deploy web applications, the ssl (ssl-1.0) feature must be defined in order to do SSL communications, and the ldap feature (ldapRegistry-3.0) must be defined in order to configure an enterprise-level
    user registry for authentication of users. For the LTPA cookie, the httpOnlyCookies element must be set to true: For the JSESSIONID cookie, the cookieHttpOnly element must be set to true: false'
  category: Session Management
  subcategory: Cookies
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: As a user with local file access to ${server.config.dir}/server.xml, verify appSecurity feature is enabled. appSecurity-2.0 Verify both web application LTPA and http session cookies are configured for httpOnly. If the appSecurity feature is not enabled or if the LPTA or Session cookie settings are not set for httpOnly, this is a finding.
    check_command: As a user with local file access to ${server.config.dir}/server.xml, verify appSecurity feature is enabled. appSecurity-2.0 Verify both web application LTPA and http session cookies are configured for httpOnly. If the appSecurity feature is not enabled or if the LPTA or Session cookie settings are not set for httpOnly, this is a finding.
  remediation:
    remediation_step: 'To ensure security cookies use httpOnly, the ${server.config.dir)/server.xml must be configured as follows: appSecurity-2.0'
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart may be required
    estimated_time: 15 minutes
  context:
    rationale: Web applications use cookies to track users across requests. These cookies, while typically not sensitive in themselves, connect to the existing state on the back-end system. If an intruder were to capture one of these cookies, they could potentially use the cookie to act as the user. Important web traffic should be encrypted using SSL. This includes important cookies. In the case of WebSphere Liberty Server, the most important cookies are the LTPA cookie and session cookie; therefore, both shou
    impact: Non-compliance may result in security vulnerabilities
    false_positive_risk: Low
  tags:
  - stig
  - websphere-liberty
  - openliberty
  - ibm
