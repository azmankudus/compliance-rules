- rule_id: STIG-V-250341
  legacy_ids:
  - V-250341
  - IBMW-LS-000770
  rule_name: Application security must be enabled on the WebSphere Liberty Server.
  rule_description: 'Application security enables security for the applications in the environment. This type of security provides application isolation and requirements for authenticating application users. When a user enables security, both administrative and application security is enabled. Application security is in effect only when administrative security is enabled via the security feature. If the application server is to be used for only web applications, only the servlet-3.1 feature needs to be defined. If the application server is to be used for only ejb applications, only the ejbLite-3.1 feature needs to be defined. If both web and ejb applications are to be deployed on the application server, then both the servlet-3.1 and ejbLite-3.1 features need to be defined. The check and fix assumes that the application server will have both web and ejb applications deployed. Satisfies: SRG-APP-000315-AS-000094, SRG-APP-000014-AS-000009false'
  category: Configuration
  subcategory: General
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: As a user with local file access to ${server.config.dir}/server.xml file, verify application security is enabled. If the appSecurity-2.0 feature is not defined within server.xml, this is a finding. appSecurity-2.0
    check_command: As a user with local file access to ${server.config.dir}/server.xml file, verify application security is enabled. If the appSecurity-2.0 feature is not defined within server.xml, this is a finding. appSecurity-2.0
  remediation:
    remediation_step: Configure the ${server.config.dir}/server.xml file and add the appSecurity-2.0 feature. appSecurity-2.0 Review ${server.config.dir}/logs/messages.log Validate log entry that indicates "Security service is ready".
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart may be required
    estimated_time: 15 minutes
  context:
    rationale: Application security enables security for the applications in the environment. This type of security provides application isolation and requirements for authenticating application users. When a user enables security, both administrative and application security is enabled. Application security is in effect only when administrative security is enabled via the security feature. If the application server is to be used for only web applications, only the servlet-3.1 feature needs to be defined. If t
    impact: Non-compliance may result in security vulnerabilities
    false_positive_risk: Low
  tags:
  - stig
  - websphere-liberty
  - openliberty
  - ibm
  - configuration
