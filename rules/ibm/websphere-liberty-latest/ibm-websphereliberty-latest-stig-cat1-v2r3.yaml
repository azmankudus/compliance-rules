rules:
- rule_id: STIG-V-250326
  legacy_ids:
  - V-250326
  - IBMW-LS-000050
  rule_name: Users in the REST API admin role must be authorized.
  rule_description: Users with console access and OS permissions to the folders where the Liberty Server is installed can make changes to the server. In addition, REST API calls that execute server management tasks are available and can be executed remotely. Adding a user to the admin role will allow that user to make changes to the server via the REST API calls. The admin role must be controlled and users who are in that role must be authorized.false
  category: Access Control
  subcategory: Authentication
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'As a user with access to ${server.config.dir}/server.xml, review the file and look for the admin role settings. grep -i administrator-role ${server.config.dir}/server.xml grep -i quickstartsecurity ${server.config.dir}/server.xml If the admin role has been created, users in that role must be documented and approved. However, using the basic registry or the quickstartsecurity methods are not acceptable. The preferred user registry method is to use a centralized access control method via LDAP. If no admin users exist at all, this is not a finding. If admin users in an LDAP user registry configuration are not documented and approved, this is a finding. If admin users exist in a basic user registry configuration, or in a quickstartsecurity user configuration, this is a finding. LDAP EXAMPLE: cn=bob,o=ibm,c=us BASIC REGISTRY EXAMPLE: bob group1 QUICKSTARTSECURITY EXAMPLE: restConnector-2.0'
    check_command: 'As a user with access to ${server.config.dir}/server.xml, review the file and look for the admin role settings. grep -i administrator-role ${server.config.dir}/server.xml grep -i quickstartsecurity ${server.config.dir}/server.xml If the admin role has been created, users in that role must be documented and approved. However, using the basic registry or the quickstartsecurity methods are not acceptable. The preferred user registry method is to use a centralized access control method via LDAP. If no admin users exist at all, this is not a finding. If admin users in an LDAP user registry configuration are not documented and approved, this is a finding. If admin users exist in a basic user registry configuration, or in a quickstartsecurity user configuration, this is a finding. LDAP EXAMPLE: cn=bob,o=ibm,c=us BASIC REGISTRY EXAMPLE: bob group1 QUICKSTARTSECURITY EXAMPLE: restConnector-2.0'
  remediation:
    remediation_step: 'If an admin user exists in either a basic user registry or a quickstartsecurity registry, edit the ${server.config.dir}/server.xml file and remove the basic registry and/or quickstartsecurity registry settings. If an admin user exists via an LDAP user registry setting, document and approve the user(s) or group that have been assigned to the admin role and ensure anyone granted REST API admin rights is authorized. LDAP EXAMPLE: cn=bob,o=ibm,c=us BASIC REGISTRY EXAMPLE: bob group1 QUICKSTARTSECURITY EXAMPLE: restConnector-2.0'
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart may be required
    estimated_time: 15 minutes
  context:
    rationale: Users with console access and OS permissions to the folders where the Liberty Server is installed can make changes to the server. In addition, REST API calls that execute server management tasks are available and can be executed remotely. Adding a user to the admin role will allow that user to make changes to the server via the REST API calls. The admin role must be controlled and users who are in that role must be authorized.false
    impact: Non-compliance may result in security vulnerabilities
    false_positive_risk: Low
  tags:
  - stig
  - websphere-liberty
  - openliberty
  - ibm
  - access-control
- rule_id: STIG-V-250335
  legacy_ids:
  - V-250335
  - IBMW-LS-000390
  rule_name: Multifactor authentication for network access to privileged accounts must be used.
  rule_description: 'Multifactor authentication creates a layered defense and makes it more difficult for an unauthorized person to access the application server. If one factor is compromised or broken, the attacker still has at least one more barrier to breach before successfully breaking into the target. Unlike a simple username/password scenario where the attacker could gain access by knowing both the username and password without the user knowing his account was compromised, multifactor authentication adds the requirement that the attacker must have something from the user, such as a token, or to biometrically be the user. When accessing the application server via a network connection, administrative access to the application server must be PKI Hardware Token enabled. The high level steps required for configuring Liberty Server to use certificate based authentication include the following: 1. Configure Web Application with client certificate authentication. 2. Configure Liberty SSL configuration
    with client authentication. 3. Configure Liberty LDAP Security Configuration with certificate filter. Satisfies: SRG-APP-000149-AS-000102, SRG-APP-000151-AS-000103, SRG-APP-000402-AS-000247, SRG-APP-000403-AS-000248, SRG-APP-000177-AS-000126false'
  category: Access Control
  subcategory: Authentication
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'As a user with local file access to ${server.config.dir}/server.xml file, verify the TLS connection used for managing the server is configured to use clientAuthentication. appSecurity-2.0 ldapRegistry-3.0 transportSecurity-1.0 Verify the TLS connection used for managing the server is configured to use clientAuthentication. The following is used as an example. If the clientAuthentication setting for the TLS management application is not set to "true", this is a finding. EXAMPLE: Access the web management interface via a web browser and verify TLS secured connectivity to the web based management application.'
    check_command: 'As a user with local file access to ${server.config.dir}/server.xml file, verify the TLS connection used for managing the server is configured to use clientAuthentication. appSecurity-2.0 ldapRegistry-3.0 transportSecurity-1.0 Verify the TLS connection used for managing the server is configured to use clientAuthentication. The following is used as an example. If the clientAuthentication setting for the TLS management application is not set to "true", this is a finding. EXAMPLE: Access the web management interface via a web browser and verify TLS secured connectivity to the web based management application.'
  remediation:
    remediation_step: 'Refer to IBM documentation on how to configure TLS and client based certificate authentication for additional configuration details. The following is a summary list of items needed to configure the system for certificate based authentication. Production systems and installations will vary. The application’s web.xml file must be configured to use client certs. EXAMPLE: CLIENT-CERT The server.xml features must be configured to use transportSecurity and an ldap configuration. appSecurity-2.0 ldapRegistry-3.0 transportSecurity-1.0 The server.xml TLS and LDAP settings must be configured. The following is an EXAMPLE only. "Default" verbiage and keystore information in the below SSL configuration will be different in production systems. Configure LDAP certificate filter settings according the certificates being used.'
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart may be required
    estimated_time: 15 minutes
  context:
    rationale: Multifactor authentication creates a layered defense and makes it more difficult for an unauthorized person to access the application server. If one factor is compromised or broken, the attacker still has at least one more barrier to breach before successfully breaking into the target. Unlike a simple username/password scenario where the attacker could gain access by knowing both the username and password without the user knowing his account was compromised, multifactor authentication adds the r
    impact: Non-compliance may result in security vulnerabilities
    false_positive_risk: Low
  tags:
