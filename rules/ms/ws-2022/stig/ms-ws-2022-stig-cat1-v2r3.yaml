  remediation:
    remediation_step: 'Maintain the Allow type permissions on domain-defined OUs to be at least as restrictive as the defaults
      below.


      Document any additional permissions above Read with the ISSO if an approved distributed '
    rollback_supported: true
    reboot_required: false
    service_impact: None
