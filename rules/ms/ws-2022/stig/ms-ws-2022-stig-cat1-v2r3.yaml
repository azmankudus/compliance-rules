- rule_id: STIG-WN22-DC-000150
  rule_name: Windows Server 2022 directory data (outside the root DSE) of a nonpublic directory must be configured to prevent
    anonymous access.
  rule_description: To the extent that anonymous access to directory data (outside the root DSE) is permitted, read access
    control of the data is effectively disabled. If other means of controlling access (such as network restrictions) are compromised,
    there may be nothing else to protect the confidentiality of sensitive directory data.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'This applies to domain controllers. It is NA for other systems.


      Open "Command Prompt" (not elevated).


      Run "ldp.exe".


      From the "Connection menu", select "Bind".


      Clear the User, Password, and Domain'
    check_command: Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System"
  remediation:
    remediation_step: 'Configure directory data (outside the root DSE) of a nonpublic directory to prevent anonymous access.


      For AD, there are multiple configuration items that could enable anonymous access.


      Changing the '
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: High
    false_positive_risk: Low
