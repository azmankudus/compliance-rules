- rule_id: STIG-WN22-CC-000210
  rule_name: Windows Server 2022 Autoplay must be turned off for nonvolume devices.
  rule_description: Allowing AutoPlay to execute may introduce malicious code to a system. AutoPlay begins reading from a
    drive as soon as media is inserted into the drive. As a result, the setup file of programs or music on audio media may
    start. This setting will disable AutoPlay for nonvolume devices, such as Media Transfer Protocol (MTP) devices.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'If the following registry value does not exist or is not configured as specified, this is a finding:


      Registry Hive: HKEY_LOCAL_MACHINE

      Registry Path: \SOFTWARE\Policies\Microsoft\Windows\Explorer\


      V'
    check_command: Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System"
  remediation:
    remediation_step: Configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components
      >> AutoPlay Policies >> Disallow Autoplay for nonvolume devices to "Enabled".
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: High
    false_positive_risk: Low
  tags:
  - stig
