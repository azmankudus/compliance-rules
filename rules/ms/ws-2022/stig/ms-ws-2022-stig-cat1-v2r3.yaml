rules:
- rule_id: STIG-WN22-00-000130
  rule_name: Windows Server 2022 local volumes must use a format that supports NTFS attributes.
  rule_description: The ability to set access permissions and auditing is critical to maintaining the security and proper
    access controls of a system. To support this, volumes must be formatted using a file system that supports NTFS attributes.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Open "Computer Management".


      Select "Disk Management" under "Storage".


      For each local volume, if the file system does not indicate "NTFS", this is a finding.


      "ReFS" (resilient file system) is also a'
    check_command: Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System"
  remediation:
    remediation_step: Format volumes to use NTFS, ReFS, or CSVFS.
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: High
    false_positive_risk: Low
  tags:
  - stig
  - cat1
  - windows-server-2022
- rule_id: STIG-WN22-00-000030
  rule_name: Windows Server 2022 administrative accounts must not be used with applications that access the internet, such
    as web browsers, or with potential internet sources, such as email.
  rule_description: 'Using applications that access the internet or have potential internet sources using administrative privileges
    exposes a system to compromise. If a flaw in an application is exploited while running as a privileged user, the entire
    system could be compromised. Web browsers and email are common attack vectors for introducing malicious code and must
    not be run with an administrative account.


    Since administrative accounts may generally change or work around technical restrictions for running a web browser or
    other applications, it is essential that policy require administrative accounts to not access the internet or use applications
    such as email.


    The policy must define specific exceptions for local service administration. These exceptions may include HTTP(S)-based
    tools that are used for the administration of the local system, services, or attached devices.


    Whitelisting can be used to enforce the policy to ensure compliance.


    Satisfies: SRG-OS-000480-GPOS-00227, SRG-OS-000205-GPOS-00083'
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Determine whether organization policy, at a minimum, prohibits administrative accounts from using applications
      that access the internet, such as web browsers, or with potential internet sources, such '
    check_command: Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System"
  remediation:
    remediation_step: Establish a policy, at minimum, to prohibit administrative accounts from using applications that access
      the internet, such as web browsers, or with potential internet sources, such as email. Ensure th
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: High
    false_positive_risk: Low
  tags:
  - stig
  - cat1
  - windows-server-2022
- rule_id: STIG-WN22-00-000250
  rule_name: Windows Server 2022 systems requiring data at rest protections must employ cryptographic mechanisms to prevent
    unauthorized disclosure and modification of the information at rest.
  rule_description: 'This requirement addresses protection of user-generated data as well as operating system-specific configuration
    data. Organizations may choose to employ different mechanisms to achieve confidentiality and integrity protections, as
    appropriate, in accordance with the security category and/or classification of the information.


    Selection of a cryptographic mechanism is based on the need to protect the integrity of organizational information. The
    strength of the mechanism is commensurate with the security category and/or classification of the information. Organizations
    have the flexibility to either encrypt all information on storage devices (i.e., full disk encryption) or encrypt specific
    data structures (e.g., files, records, or fields).


    Satisfies: SRG-OS-000185-GPOS-00079, SRG-OS-000404-GPOS-00183, SRG-OS-000405-GPOS-00184'
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: Verify systems that require additional protections due to factors such as inadequate physical protection
      or sensitivity of the data employ encryption to protect the confidentiality and integrity of al
    check_command: Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System"
  remediation:
    remediation_step: Configure systems that require additional protections due to factors such as inadequate physical protection
      or sensitivity of the data to employ encryption to protect the confidentiality and integrity
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: High
    false_positive_risk: Low
  tags:
  - stig
  - cat1
  - windows-server-2022
- rule_id: STIG-WN22-AC-000090
  rule_name: Windows Server 2022 reversible password encryption must be disabled.
  rule_description: Storing passwords using reversible encryption is essentially the same as storing clear-text versions of
    the passwords, which are easily compromised. For this reason, this policy must never be enabled.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Verify the effective setting in Local Group Policy Editor.


      Run "gpedit.msc".


      Navigate to Local Computer Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Account Policies '
    check_command: Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System"
  remediation:
    remediation_step: Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >> Account
      Policies >> Password Policy >> Store passwords using reversible encryption to "Disabled".
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: High
    false_positive_risk: Low
  tags:
  - stig
  - cat1
  - windows-server-2022
- rule_id: STIG-WN22-CC-000430
  rule_name: Windows Server 2022 must disable the Windows Installer Always install with elevated privileges option.
  rule_description: Standard user accounts must not be granted elevated privileges. Enabling Windows Installer to elevate
    privileges when installing applications can allow malicious persons and applications to gain full control of a system.
  category: System Configuration
  subcategory: General
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'If the following registry value does not exist or is not configured as specified, this is a finding:


      Registry Hive: HKEY_LOCAL_MACHINE

      Registry Path: \SOFTWARE\Policies\Microsoft\Windows\Installer\


      '
    check_command: Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System"
  remediation:
    remediation_step: Configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components
      >> Windows Installer >> Always install with elevated privileges to "Disabled".
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  context:
    rationale: DISA STIG requirement
    impact: High
    false_positive_risk: Low
  tags:
  - stig
  - cat1
  - windows-server-2022
