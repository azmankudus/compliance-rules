    audit_type: config
    detection_step: |
      Check the NGINX configuration for send timeout:
      
      nginx -T 2>/dev/null | grep -i send_timeout
      
      Expected output:
      send_timeout 10;
      
      If send_timeout is not set or is greater than 10 seconds, this is a finding.
    check_command: nginx -T 2>/dev/null | grep -i send_timeout
    expected_value: send_timeout 10;
  remediation:
    remediation_step: |
      Add the send_timeout directive to the http or server block:
      
      http {
          send_timeout 10;
          ...
      }
      
      Reload NGINX:
      nginx -s reload
    rollback_supported: true
    reboot_required: false
    service_impact: Service reload required
    estimated_time: 5 minutes
  context:
    rationale: Low timeout values help prevent denial-of-service attacks from unresponsive clients.
    impact: Slow clients may experience timeouts
    false_positive_risk: Low
  tags:
  - cis
  - nginx
  - timeout
  - dos-protection

- rule_id: CIS-6.1.1
  legacy_ids:
  - 6.1.1
  rule_name: Set worker_connections appropriately
  rule_description: |
    Configure the maximum number of simultaneous connections per worker process based on organizational requirements.
  category: Configuration
  subcategory: Connection Management
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |
      Check the NGINX configuration for worker_connections:
      
      nginx -T 2>/dev/null | grep -i worker_connections
      
      Expected output (example):
      worker_connections 1024;
      
      Verify the value is set to an organization-defined number appropriate for your deployment.
    check_command: nginx -T 2>/dev/null | grep -i worker_connections
    expected_value: worker_connections should be set to an appropriate value
  remediation:
    remediation_step: |
      Add or modify the worker_connections directive in the events block:
      
      events {
          worker_connections 1024;
      }
      
      Restart NGINX:
      systemctl restart nginx
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: Proper connection limits help prevent resource exhaustion and DoS attacks.
    impact: Limits maximum concurrent connections
    false_positive_risk: Low
  tags:
  - cis
  - nginx
  - connections
  - capacity

- rule_id: CIS-7.1.1
  legacy_ids:
  - 7.1.1
  rule_name: Restrict access to NGINX configuration files
  rule_description: |
    NGINX configuration files must be protected from unauthorized access and modification.
  category: Access Control
  subcategory: File Permissions
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |
      Check the permissions on NGINX configuration files:
      
      stat -c '%a %n' /etc/nginx/nginx.conf
      stat -c '%a %n' /etc/nginx/conf.d/*
      
      Expected permissions: 644 or more restrictive (owner read/write, group/others read-only)
      
      If configuration files are writable by anyone other than the owner, this is a finding.
    check_command: stat -c '%a %n' /etc/nginx/nginx.conf
    expected_value: 644 or more restrictive
  remediation:
    remediation_step: |
      Set appropriate permissions on NGINX configuration files:
      
      chmod 644 /etc/nginx/nginx.conf
      chmod 644 /etc/nginx/conf.d/*
      chown root:root /etc/nginx/nginx.conf
      
      Reload NGINX:
      nginx -s reload
    rollback_supported: true
    reboot_required: false
    service_impact: Service reload required
    estimated_time: 5 minutes
  context:
    rationale: Protecting configuration files prevents unauthorized modifications that could compromise security.
    impact: Minimal - only affects file access
    false_positive_risk: Low
  tags:
  - cis
  - nginx
  - file-permissions
  - access-control

- rule_id: CIS-8.1.1
  legacy_ids:
  - 8.1.1
  rule_name: Restrict access to SSL/TLS private keys
  rule_description: |
    SSL/TLS private key files must be protected with strict file permissions to prevent unauthorized access.
  category: Cryptography
  subcategory: Key Management
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |
      Identify SSL certificate key files in the NGINX configuration:
      
      nginx -T 2>/dev/null | grep ssl_certificate_key
      
      Check permissions on each key file:
      
      stat -c '%a %n' <path_to_key_file>
      
      Expected permissions: 600 or 400 (owner read/write or read-only only)
      
      If private key files are readable by anyone other than the owner, this is a finding.
    check_command: nginx -T 2>/dev/null | grep ssl_certificate_key
    expected_value: Private key permissions should be 600 or 400
  remediation:
    remediation_step: |
      Set appropriate permissions on SSL private key files:
      
      chmod 600 <path_to_key_file>
      chown root:root <path_to_key_file>
      
      Reload NGINX:
      nginx -s reload
    rollback_supported: true
    reboot_required: false
    service_impact: Service reload required
    estimated_time: 5 minutes
  context:
    rationale: Private keys must be protected to prevent impersonation and man-in-the-middle attacks.
    impact: Minimal - only affects file access
    false_positive_risk: Low
  tags:
  - cis
  - nginx
  - ssl
  - key-management
  - access-control
