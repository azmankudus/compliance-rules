- rule_id: CIS-5.1.3
  legacy_ids:
  - 5.1.3
  rule_name: Set appropriate send timeout
  rule_description: |
    Configure the send timeout to prevent resource exhaustion from unresponsive clients.
  category: Network Security
  subcategory: Timeouts
  assessment:
    severity: Medium
    is_auto: true
