  rule_name: Changes to $CATALINA_HOME/bin/ folder must be logged.
  rule_description: The $CATALINA_HOME/bin folder contains startup and control scripts for the Tomcat Catalina server. To provide forensic evidence in the event of file tampering, changes to content in this folder must be logged. For Linux OS flavors other than Ubuntu, use the relevant OS commands. This can be done on the Ubuntu OS via the auditctl command. Using the -p wa flag set the permissions flag for a file system watch and logs file attribute and content change events into syslog.
  category: Auditing and Logging
  subcategory: Logging Configuration
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "Run the following commands From the Tomcat server as a privileged user:\n\nIdentify the home folder for the Tomcat server. \n\nsudo grep -i -- 'catalina_home\\|catalina_base' /etc/systemd/system/tomcat.service\n\nCheck the audit rules for the Tomcat folders.\n\nsudo auditctl -l $CATALINA_HOME/bin |grep -i bin\n\nIf the results do not include -w $CATALINA_HOME/bin -p wa -k tomcat, or if there are no results, this is a finding."
    check_command: "Run the following commands From the Tomcat server as a privileged user:\n\nIdentify the home folder for the Tomcat server. \n\nsudo grep -i -- 'catalina_home\\|catalina_base' /etc/systemd/system/tomcat.service\n\nCheck the audit rules for the Tomcat folders.\n\nsudo auditctl -l $CATALINA_HOME/bin |grep -i bin\n\nIf the results do not include -w $CATALINA_HOME/bin -p wa -k tomcat, or if there are no results, this is a finding."
  remediation:
    remediation_step: "From the Tomcat server as a privileged user, use the auditctl command.\n\nsudo auditctl  -w $CATALINA_HOME/bin -p wa -k tomcat\n\nValidate the audit watch was created.\nsudo auditctl -l \n\nThe user should see: \n-w $CATALINA_HOME/ -p wa -k tomcat"
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: The $CATALINA_HOME/bin folder contains startup and control scripts for the Tomcat Catalina server. To provide forensic evidence in the event of file tampering, changes to content in this folder must be logged. For Linux OS flavors other than Ubuntu, use the relevant OS commands. This can be done on the Ubuntu OS via the auditctl command. Using the -p wa flag set the permissions flag for a file system watch and logs file attribute and content change events into syslog.
    false_positive_risk: Low
