  rule_name: Date and time of events must be logged.
  rule_description: 'The access logfile format is defined within a Valve that implements the org.apache.catalina.valves.AccessLogValve interface within the /opt/tomcat/server.xml configuration file: The %t pattern code is included in the pattern element and logs the date and time of the event. Including the date pattern in the log configuration provides useful information about the time of the event which is critical for troubleshooting and forensic investigations.'
  category: Auditing and Logging
  subcategory: Logging Configuration
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |-
      As an elevated user on the Tomcat server:

      Edit the $CATALINA_BASE/conf/server.xml file.

      Review all "Valve" elements.

      If the pattern= statement does not include %t, this is a finding.

      EXAMPLE:
      <Host name="localhost"  appBase="webapps"
                  unpackWARs="true" autoDeploy="false">
      ...
      <Valve className="org.apache.catalina.valves.AccessLogValve" directory="logs"
                     prefix="localhost_access_log" suffix=".txt"
                     pattern="%h %l %t %u "%r" %s %b" />
        ...
      </Host>
    check_command: |-
