  rule_name: Multifactor certificate-based tokens (CAC) must be used when accessing the management interface.
  rule_description: |-
    Password authentication does not provide sufficient security control when accessing a management interface. DOD has specified that a CAC will be used when authenticating and passwords will only be used when CAC authentication is not a plausible solution. Tomcat provides the ability to do certificate based authentication and client authentication; therefore, the Tomcat server must be configured to use CAC.

    Satisfies: SRG-APP-000391-AS-000239, SRG-APP-000392-AS-000240, SRG-APP-000402-AS-000247, SRG-APP-000403-AS-000248
  category: Encryption
  subcategory: General Configuration
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |-
      If the manager application has been deleted from the Tomcat server, this is not a finding. From the Tomcat server as a privileged user, issue the following command:

      sudo grep -i auth-method $CATALINA_BASE/webapps/manager/WEB-INF/web.xml

      If the <Auth-Method> for the web manager application is not set to CLIENT-CERT, this is a finding.
    check_command: |-
      If the manager application has been deleted from the Tomcat server, this is not a finding. From the Tomcat server as a privileged user, issue the following command:

      sudo grep -i auth-method $CATALINA_BASE/webapps/manager/WEB-INF/web.xml

      If the <Auth-Method> for the web manager application is not set to CLIENT-CERT, this is a finding.
  remediation:
    remediation_step: "From the Tomcat server as a privileged user, edit the $CATALINA_BASE/webapps/manager/WEB-INF/web.xml file and modify the auth-method for the manager application security constraint.\n\nsudo nano $CATALINA_BASE/webapps/manager/WEB-INF/web.xml\n\nLocate <auth-method> contained within the <login-config> section, modify <auth-method> to specify CLIENT-CERT. \n\nEXAMPLE:\n<auth-method>CLIENT-CERT</auth-method>\n\nIn addition, the connector used for accessing the manager application must be configured to require client authentication by setting clientAuth=\"true\" and the manager application roles must be configured in the LDAP server.\n\nRestart the Tomcat server:\nsudo systemctl restart tomcat"
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: |-
      Password authentication does not provide sufficient security control when accessing a management interface. DOD has specified that a CAC will be used when authenticating and passwords will only be used when CAC authentication is not a plausible solution. Tomcat provides the ability to do certificate based authentication and client authentication; therefore, the Tomcat server must be configured to use CAC.

      Satisfies: SRG-APP-000391-AS-000239, SRG-APP-000392-AS-000240, SRG-APP-000402-AS-000247, SRG-APP-000403-AS-000248
    false_positive_risk: Low
