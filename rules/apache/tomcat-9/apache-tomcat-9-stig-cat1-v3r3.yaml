  rule_name: Tomcat user account must be a non-privileged user.
  rule_description: |-
    Use a distinct non-privileged user account for running Tomcat. If Tomcat processes are compromised and a privileged user account is used to operate the Tomcat server processes, the entire system becomes compromised.

    Sample passwd file:
    tomcat:x:1001:1001::/opt/tomcat/usr/sbin/nologin

    The user ID is stored in field 3 of the passwd file.
  category: User Management
  subcategory: User Configuration
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |-
      Run the following command to identify the Tomcat process UID:
      ps -ef | { head -1; grep catalina; } | cut -f1 -d" "

      Run the following command to obtain the OS user ID tied to the Tomcat process:
      cat /etc/passwd|grep -i <UID>|cut -f3 -d:

      Unless operationally necessary, the Tomcat process should not be tied to a privileged OS user ID. Depending on the operating system, privileged OS user IDs will typically be assigned user ID values <500 or <1000.

      If the Tomcat process is running as a privileged user and is not documented and approved, this is a finding.

      If the user ID field of the passwd file is set to 0, this is a finding.
    check_command: |-
      Run the following command to identify the Tomcat process UID:
      ps -ef | { head -1; grep catalina; } | cut -f1 -d" "

      Run the following command to obtain the OS user ID tied to the Tomcat process:
      cat /etc/passwd|grep -i <UID>|cut -f3 -d:

      Unless operationally necessary, the Tomcat process should not be tied to a privileged OS user ID. Depending on the operating system, privileged OS user IDs will typically be assigned user ID values <500 or <1000.

      If the Tomcat process is running as a privileged user and is not documented and approved, this is a finding.

      If the user ID field of the passwd file is set to 0, this is a finding.
  remediation:
    remediation_step: "From the Tomcat server, create a tomcat user by adding a new non-privileged user OS account with the following command:\n  \nsudo useradd tomcat\n\nEdit the systemd tomcat.service file or create one if it does not exist. Use the new \"tomcat\" user account by setting; USER=tomcat\n\nLocation of the file should be /etc/systemd/system/tomcat.service.\n\nEnable the Tomcat service:\nsudo restorecon /etc/systemd/system/tomcat.service\nsudo chmod 644 /etc/systemd/system/tomcat.service\nsudo systemctl enable tomcat.service\n\nStart Tomcat:\nsudo systemctl start tomcat"
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: |-
      Use a distinct non-privileged user account for running Tomcat. If Tomcat processes are compromised and a privileged user account is used to operate the Tomcat server processes, the entire system becomes compromised.

      Sample passwd file:
      tomcat:x:1001:1001::/opt/tomcat/usr/sbin/nologin

      The user ID is stored in field 3 of the passwd file.
    false_positive_risk: Low
