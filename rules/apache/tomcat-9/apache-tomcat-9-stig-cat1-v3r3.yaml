  rule_name: Connector address attribute must be set.
  rule_description: Connectors are how Tomcat receives requests over a network port, passes them to hosted web applications via HTTP or AJP, and then sends back the results to the requestor. The "address" attribute specifies which network interface the connector listens on. If no IP address is specified, the connector will listen on all configured interfaces. Access to the connector must be restricted to only the network interface(s) specified in the System Security Plan (SSP).
  category: Network Configuration
  subcategory: Connector Configuration
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |-
      Review SSP documentation for list of approved connectors and associated TCP/IP ports and interfaces.

      Verify the address attribute is specified for each connector and is set to the network interface specified in the SSP.

      Execute the following command to find configured Connectors:

      sudo grep -i -B1 -A5 connector $CATALINA_BASE/conf/server.xml

      Review results and examine the "address=" field for each connector.

      If the connector address attribute is not specified as per the SSP, this is a finding.
    check_command: |-
      Review SSP documentation for list of approved connectors and associated TCP/IP ports and interfaces.

      Verify the address attribute is specified for each connector and is set to the network interface specified in the SSP.

      Execute the following command to find configured Connectors:

      sudo grep -i -B1 -A5 connector $CATALINA_BASE/conf/server.xml

      Review results and examine the "address=" field for each connector.

      If the connector address attribute is not specified as per the SSP, this is a finding.
  remediation:
    remediation_step: |-
      Ensure the address attribute for each connector and the network interfaces are specified in the SSP.

      Edit the following file From the Tomcat server as a privileged user:

      $CATALINA_BASE/conf/server.xml

      Locate each Connector element then edit or add the "address=" field for each connector and specify the appropriate network IP address. The following is an example using a random IP address:

      EXAMPLE:
      <Connector
      port="8443"
      address="192.168.0.145"
      ...
      />

      Restart the Tomcat server:
      sudo systemctl restart tomcat
      sudo systemctl daemon-reload
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: Connectors are how Tomcat receives requests over a network port, passes them to hosted web applications via HTTP or AJP, and then sends back the results to the requestor. The "address" attribute specifies which network interface the connector listens on. If no IP address is specified, the connector will listen on all configured interfaces. Access to the connector must be restricted to only the network interface(s) specified in the System Security Plan (SSP).
    false_positive_risk: Low
