  rule_name: DOD root CA certificates must be installed in Tomcat trust store.
  rule_description: "Tomcat truststores are used to validate client certificates. On the Ubuntu OS, by default, Tomcat uses the \"cacerts\" file as the CA trust store. The file is located in the /etc/ssl/certs/java/ folder with a link to the file in $JAVA_HOME/lib/security/cacerts. However, this location can be modified by setting the value of the javax.net.ssl.trustStore system property. Setting this property within an OS environment variable will change the location to point to a different trust store. \n\nThe Java OS environment variables in the systemd Tomcat startup file must be checked in order to identify the location of the trust store on the file system. (The STIG uses the name tomcat.service as a reference, but technically this file can be called anything).\n\nIf the property is not set, then the default location is used for the truststore."
  category: Encryption
  subcategory: General Configuration
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "This is a mutual authentication requirement where both the Tomcat server and the client are required to authenticate themselves via mutual TLS. Review system security plan and other system documentation. If the system has no connections requiring mutual authentication (e.g., proxy servers or other hosts specified in the system documentation), this requirement is Not Applicable.\n\nFor the systemd Ubuntu OS, check the tomcat.service file to read the content of the JAVA_OPTS environment variable setting.\n\nsudo cat /etc/systemd/system/tomcat.service |grep -i truststore\n\nEXAMPLE output:\nset JAVA_OPTS=\"-Djavax.net.ssl.trustStore=/path/to/truststore\" \"-Djavax.net.ssl.trustStorePassword=************\"\n\nIf the variable is not set, use the default location command below. If the variable is set, use the alternate location command below and include the path and truststore file. \n\n-Default location:\nkeytool -list -cacerts -v | grep -i issuer\n\n-Alternate location:\n\
      keytool -list -keystore <location of trust store file> -v |grep -i issuer\n\nIf there are no CA certificates issued by a CA that are part of the DOD PKI/PKE, this is a finding."
    check_command: "This is a mutual authentication requirement where both the Tomcat server and the client are required to authenticate themselves via mutual TLS. Review system security plan and other system documentation. If the system has no connections requiring mutual authentication (e.g., proxy servers or other hosts specified in the system documentation), this requirement is Not Applicable.\n\nFor the systemd Ubuntu OS, check the tomcat.service file to read the content of the JAVA_OPTS environment variable setting.\n\nsudo cat /etc/systemd/system/tomcat.service |grep -i truststore\n\nEXAMPLE output:\nset JAVA_OPTS=\"-Djavax.net.ssl.trustStore=/path/to/truststore\" \"-Djavax.net.ssl.trustStorePassword=************\"\n\nIf the variable is not set, use the default location command below. If the variable is set, use the alternate location command below and include the path and truststore file. \n\n-Default location:\nkeytool -list -cacerts -v | grep -i issuer\n\n-Alternate location:\n\
      keytool -list -keystore <location of trust store file> -v |grep -i issuer\n\nIf there are no CA certificates issued by a CA that are part of the DOD PKI/PKE, this is a finding."
  remediation:
    remediation_step: |-
      Obtain and install the DOD PKI CA certificate bundles by accessing the DOD PKI office website at cyber.mil/pki-pke.

      Import the DOD CA certificates.
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
