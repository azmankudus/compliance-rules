  rule_name: Idle timeout for the management application must be set to 10 minutes.
  rule_description: "Tomcat can set idle session timeouts on a per application basis. The management application is provided with the Tomcat installation and is used to manage the applications that are installed on the Tomcat Server. Setting the idle timeout for the management application will kill the admin user's session after 10 minutes of inactivity. This will limit the opportunity for unauthorized persons to hijack the admin session. This setting will also affect the default timeout behavior of all hosted web applications. To adjust the individual hosted application settings that are not related to management of the system, modify the individual application web.xml file if application timeout requirements differ from the STIG. \n\nSatisfies: SRG-APP-000389, SRG-APP-000220"
  category: Session Management
  subcategory: General Configuration
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "If the manager application has been deleted from the system, this is not a finding. \n\nFrom the Tomcat server as a privileged user, run the following commands:\n\nsudo grep -i session-timeout $CATALINA_BASE/webapps/manager/META-INF/web.xml \n\nsudo grep -i session-timeout \n$CATALINA_BASE/conf/web.xml\n\nIf the session-timeout setting is not configured to be 10 minutes in at least one of these files, this is a finding."
    check_command: "If the manager application has been deleted from the system, this is not a finding. \n\nFrom the Tomcat server as a privileged user, run the following commands:\n\nsudo grep -i session-timeout $CATALINA_BASE/webapps/manager/META-INF/web.xml \n\nsudo grep -i session-timeout \n$CATALINA_BASE/conf/web.xml\n\nIf the session-timeout setting is not configured to be 10 minutes in at least one of these files, this is a finding."
  remediation:
    remediation_step: "From the Tomcat server as a privileged user:\n\nTo affect session timeout for all applications including the management application, edit the $CATALINA_BASE/conf/web.xml file.\n\nTo affect session timeout for the management application only, edit the $CATALINA_BASE/webapps/manager/META-INF/web.xml file. \n\nLocate the session-timeout setting located within the session-config element.\n\nModify the session-timeout setting to be 10 minutes.\n\nSave the file.\n\nsudo systemctl restart tomcat\nsudo systemctl daemon-reload"
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: "Tomcat can set idle session timeouts on a per application basis. The management application is provided with the Tomcat installation and is used to manage the applications that are installed on the Tomcat Server. Setting the idle timeout for the management application will kill the admin user's session after 10 minutes of inactivity. This will limit the opportunity for unauthorized persons to hijack the admin session. This setting will also affect the default timeout behavior of all hosted web applications. To adjust the individual hosted application settings that are not related to management of the system, modify the individual application web.xml file if application timeout requirements differ from the STIG. \n\nSatisfies: SRG-APP-000389, SRG-APP-000220"
    false_positive_risk: Low
