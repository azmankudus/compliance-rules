  rule_name: Tomcat user UMASK must be set to 0027.
  rule_description: For Unix-based systems, umask settings affect file creation permissions. If the permissions are too loose, newly created log files and applications could be accessible to unauthorized users via the file system.  Ensure the Tomcat OS user account has the correct file creation permission settings by validating the OS umask settings for the Tomcat user. Setting umask to 0027 gives the Tomcat user full rights, group users r-x permission and all others no access. Tomcat will most likely be running as a systemd service. Locate the systemd service file for Tomcat. The default location for the link to the service file is in /etc/systemd/system folder. The service file name should be indicative of the Tomcat process so tomcat.service is the logical name for the service file and is the name referenced by the STIG.
  category: User Management
  subcategory: User Configuration
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |-
      Reference the system documentation and make relevant changes to the following commands if the system differs:

      From the Tomcat server command line run the following command:

      sudo cat /etc/systemd/system/tomcat.service | grep -i umask

      If the umask is not = 0027, this is a finding.
    check_command: |-
      Reference the system documentation and make relevant changes to the following commands if the system differs:

      From the Tomcat server command line run the following command:

      sudo cat /etc/systemd/system/tomcat.service | grep -i umask

      If the umask is not = 0027, this is a finding.
  remediation:
    remediation_step: "From the Tomcat server as a privileged user:\n\nUse a file editor like nano or vi and edit the /etc/systemd/system/tomcat.service file.\n\nChange the \"UMask=\" setting to 0027.\n \nUMask =0027\n\nSave the file and restart Tomcat:\nsudo systemctl restart tomcat\nsudo systemctl daemon-reload"
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: For Unix-based systems, umask settings affect file creation permissions. If the permissions are too loose, newly created log files and applications could be accessible to unauthorized users via the file system.  Ensure the Tomcat OS user account has the correct file creation permission settings by validating the OS umask settings for the Tomcat user. Setting umask to 0027 gives the Tomcat user full rights, group users r-x permission and all others no access. Tomcat will most likely be running as a systemd service. Locate the systemd service file for Tomcat. The default location for the link to the service file is in /etc/systemd/system folder. The service file name should be indicative of the Tomcat process so tomcat.service is the logical name for the service file and is the name referenced by the STIG.
    false_positive_risk: Low
