  rule_name: Connectors must be approved by the ISSO.
  rule_description: Connectors are how Tomcat receives requests over a network port, passes them to hosted web applications via HTTP or AJP and then sends back the results to the requestor. A port and a protocol are tied to each connector. Only connectors approved by the ISSO must be installed. ISSO review will consist of validating connector protocol as being secure and required in order for the hosted application to operate. The ISSO will ensure that unnecessary or insecure connector protocols are not enabled. The ISSO will provide documented approval for each connector that will be maintained in the System Security Plan (SSP).
  category: Network Configuration
  subcategory: Connector Configuration
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |-
      Review the Tomcat servers System Security Plan/server documentation.

      Access the Tomcat server and review the server.xml file.

      grep -i "connector port" $CATALINA_BASE/conf/server.xml

      Compare the active Connectors and their associated IP ports with the Connectors documented and approved in the SSP.

      If the Connectors that are configured on the Tomcat server are not approved by the ISSO and documented in the SSP, this is a finding.
    check_command: |-
      Review the Tomcat servers System Security Plan/server documentation.

      Access the Tomcat server and review the server.xml file.

      grep -i "connector port" $CATALINA_BASE/conf/server.xml

      Compare the active Connectors and their associated IP ports with the Connectors documented and approved in the SSP.

      If the Connectors that are configured on the Tomcat server are not approved by the ISSO and documented in the SSP, this is a finding.
  remediation:
    remediation_step: |-
      Document and obtain ISSO approval for the Connectors that are configured on the Tomcat server.

      Retain the information in the SSP and present to the auditor in the event of a CCRI.
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
