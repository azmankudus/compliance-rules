  rule_name: Connectors must be secured.
  rule_description: The unencrypted HTTP protocol does not protect data from interception or alteration which can subject users to eavesdropping, tracking, and the modification of received data. To secure an HTTP connector, both the secure and scheme flags must be set.
  category: Network Configuration
  subcategory: Connector Configuration
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "From the Tomcat server console, run the following command:\n\nsudo cat $CATALINA_BASE/conf/server.xml. \n\nExamine each <Connector/> element. \n\nFor each connector, verify the secure= flag is set to \"true\" and the scheme= flag is set to \"https\" on each connector.\n\nIf the secure flag is not set to \"true\" and/or the scheme flag is not set to \"https\" for each HTTP connector element, this is a finding."
    check_command: "From the Tomcat server console, run the following command:\n\nsudo cat $CATALINA_BASE/conf/server.xml. \n\nExamine each <Connector/> element. \n\nFor each connector, verify the secure= flag is set to \"true\" and the scheme= flag is set to \"https\" on each connector.\n\nIf the secure flag is not set to \"true\" and/or the scheme flag is not set to \"https\" for each HTTP connector element, this is a finding."
  remediation:
    remediation_step: "From the Tomcat server as a privileged user, edit the server.xml file.\n\nsudo nano $CATALINA_BASE/conf/server.xml. \n\nLocate each <Connector/> element which is lacking a secure setting.  \n\nEXAMPLE Connector:\n<Connector port=\"8080\" protocol=\"HTTP/1.1\"\n               connectionTimeout=\"20000\"\n               redirectPort=\"443\" />\n\nSet or add scheme=\"https\" and secure=\"true\" for each HTTP connector element.\n\nEXAMPLE:\n<Connector port=\"443\" protocol=\"org.apache.coyote.http11.Http11NioProtocol\" SSLEnabled=\"true\"\n    maxThreads=\"150\" scheme=\"https\" secure=\"true\".../>\n\nSave the server.xml file and restart Tomcat:\nsudo systemctl restart tomcat\nsudo systemctl reload-daemon"
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: The unencrypted HTTP protocol does not protect data from interception or alteration which can subject users to eavesdropping, tracking, and the modification of received data. To secure an HTTP connector, both the secure and scheme flags must be set.
    false_positive_risk: Low
