  rule_name: Tomcat user account must be set to nologin.
  rule_description: When installing Tomcat, a user account is created on the OS. This account is used in order for Tomcat to be able to operate on the OS but does not require the ability to actually log in to the system. Therefore when the account is created, the account must not be provided access to a login shell or other program on the system. This is done by specifying the "nologin" parameter in the command/shell field of the passwd file.
  category: Auditing and Logging
  subcategory: Logging Configuration
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |-
      From the command line of the Tomcat server type the following command:

      sudo cat /etc/passwd|grep -i tomcat

      If the command/shell field of the passwd file is not set to "/usr/sbin/nologin", this is a finding.
    check_command: |-
      From the command line of the Tomcat server type the following command:

      sudo cat /etc/passwd|grep -i tomcat

      If the command/shell field of the passwd file is not set to "/usr/sbin/nologin", this is a finding.
  remediation:
    remediation_step: |-
      From the Tomcat command line type the following command:

      sudo usermod -s /usr/sbin/nologin tomcat
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: When installing Tomcat, a user account is created on the OS. This account is used in order for Tomcat to be able to operate on the OS but does not require the ability to actually log in to the system. Therefore when the account is created, the account must not be provided access to a login shell or other program on the system. This is done by specifying the "nologin" parameter in the command/shell field of the passwd file.
    false_positive_risk: Low
