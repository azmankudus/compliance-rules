  rule_name: AccessLogValve must be configured for each application context.
  rule_description: |-
    Tomcat has the ability to host multiple contexts (applications) on one physical server by using the <Host><Context> attribute. This allows the admin to specify audit log settings on a per application basis.

    Satisfies: SRG-APP-000016-AS-000013, SRG-APP-000080-AS-000045, SRG-APP-000089-AS-000050, SRG-APP-000091-AS-000052, SRG-APP-000095-AS-000056, SRG-APP-000098-AS-000061, SRG-APP-000099-AS-000062
  category: Auditing and Logging
  subcategory: Access Logging
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |-
      As an elevated user on the Tomcat server:

      Edit the $CATALINA_BASE/conf/server.xml file.

      Review for all <Context> elements.

      If a <Valve className="org.apache.catalina.valves.AccessLogValve" .../> element is not defined within each <Context> element, this is a finding.

      EXAMPLE:

      <Context
      ...
      <Valve className="org.apache.catalina.valves.AccessLogValve" directory="logs"
                     prefix="application_name_log" suffix=".txt"
                     pattern=""%h %l %t %u "%r" %s %b" />
        ...
      />
    check_command: |-
      As an elevated user on the Tomcat server:

      Edit the $CATALINA_BASE/conf/server.xml file.

      Review for all <Context> elements.

      If a <Valve className="org.apache.catalina.valves.AccessLogValve" .../> element is not defined within each <Context> element, this is a finding.

      EXAMPLE:

      <Context
      ...
      <Valve className="org.apache.catalina.valves.AccessLogValve" directory="logs"
                     prefix="application_name_log" suffix=".txt"
                     pattern=""%h %l %t %u "%r" %s %b" />
        ...
      />
  remediation:
    remediation_step: "As a privileged user on the Tomcat server:\n\nEdit the $CATALINA_BASE/conf/server.xml file.\n\nCreate a <Valve> element that is nested within the <Context> element containing an AccessLogValve.\n\nEXAMPLE:\n\n<Context \n...\n<Valve className=\"org.apache.catalina.valves.AccessLogValve\" directory=\"logs\"\n               prefix=\"application_name_log\" suffix=\".txt\"\n               pattern=\"%h %l %t %u \"%r\" %s %b\" />\n  ...\n/>\n\nRestart the Tomcat server:\nsudo systemctl restart tomcat\nsudo systemctl daemon-reload"
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: |-
      Tomcat has the ability to host multiple contexts (applications) on one physical server by using the <Host><Context> attribute. This allows the admin to specify audit log settings on a per application basis.

      Satisfies: SRG-APP-000016-AS-000013, SRG-APP-000080-AS-000045, SRG-APP-000089-AS-000050, SRG-APP-000091-AS-000052, SRG-APP-000095-AS-000056, SRG-APP-000098-AS-000061, SRG-APP-000099-AS-000062
    false_positive_risk: Low
