  rule_name: Default password for keystore must be changed.
  rule_description: |-
    Tomcat currently operates only on JKS, PKCS11, or PKCS12 format keystores. The JKS format is Java's standard "Java KeyStore" format, and is the format created by the keytool command-line utility which is included in the JDK. The PKCS12 format is an internet standard, and is managed using OpenSSL or Microsoft's Key-Manager. This requirement only applies to JKS keystores. When a new JKS keystore is created, if a password is not specified during creation the default password used by Tomcat is "changeit" (all lower case). If the default password is not changed, the keystore is at risk of compromise.

    Satisfies: SRG-APP-000033-AS-000023, SRG-APP-000176-AS-000125
  category: Authentication
  subcategory: Credential Management
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "From the Tomcat server console, run the following command to check the keystore:\n\nsudo keytool -list -v \n\nWhen prompted for the keystore password type \"changeit\" sans quotes.\n\nIf the contents of the keystore are displayed, this is a finding."
    check_command: "From the Tomcat server console, run the following command to check the keystore:\n\nsudo keytool -list -v \n\nWhen prompted for the keystore password type \"changeit\" sans quotes.\n\nIf the contents of the keystore are displayed, this is a finding."
  remediation:
    remediation_step: "From the Tomcat server as a privileged user, run the following command:\n\nsudo keytool -storepasswd \n\nWhen prompted for the keystore password, select a strong password, minimum 10 characters, mixed case alpha-numeric.\n\nDocument the password and store in a secured location that is only accessible to authorized personnel."
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: |-
      Tomcat currently operates only on JKS, PKCS11, or PKCS12 format keystores. The JKS format is Java's standard "Java KeyStore" format, and is the format created by the keytool command-line utility which is included in the JDK. The PKCS12 format is an internet standard, and is managed using OpenSSL or Microsoft's Key-Manager. This requirement only applies to JKS keystores. When a new JKS keystore is created, if a password is not specified during creation the default password used by Tomcat is "changeit" (all lower case). If the default password is not changed, the keystore is at risk of compromise.

      Satisfies: SRG-APP-000033-AS-000023, SRG-APP-000176-AS-000125
    false_positive_risk: Low
