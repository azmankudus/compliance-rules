  rule_name: Stack tracing must be disabled.
  rule_description: Stack tracing provides debugging information from the application call stacks when a runtime error is encountered. If stack tracing is left enabled, Tomcat will provide this call stack information to the requestor which could result in the loss of sensitive information or data that could be used to compromise the system.  As with all STIG settings, it is acceptable to temporarily enable for troubleshooting and debugging purposes but the setting must not be left enabled after troubleshooting tasks have been completed.
  category: Configuration
  subcategory: General Configuration
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "From the Tomcat server run the following OS command:\n\nsudo cat $CATALINA_BASE/conf/server.xml | grep -i connector \n\nReview each connector element, ensure each connector does not have an \"allowTrace\" setting or ensure the \"allowTrace\" setting is set to false.\n\n<Connector ... allowTrace=\"false\" />\n\nDo the same for each application by checking every $CATALINA_BASE/webapps/<APP_NAME>/WEBINF/web.xml file on the system.\n\nsudo cat $CATALINA_BASE/webapps/<APP_NAME>/WEBINF/web.xml |grep -i connector \n\nIf a connector element in the server.xml file or in any of the <APP NAME>/WEBINF/web.xml files contains the \"allow Trace = true\" statement, this is a finding."
    check_command: "From the Tomcat server run the following OS command:\n\nsudo cat $CATALINA_BASE/conf/server.xml | grep -i connector \n\nReview each connector element, ensure each connector does not have an \"allowTrace\" setting or ensure the \"allowTrace\" setting is set to false.\n\n<Connector ... allowTrace=\"false\" />\n\nDo the same for each application by checking every $CATALINA_BASE/webapps/<APP_NAME>/WEBINF/web.xml file on the system.\n\nsudo cat $CATALINA_BASE/webapps/<APP_NAME>/WEBINF/web.xml |grep -i connector \n\nIf a connector element in the server.xml file or in any of the <APP NAME>/WEBINF/web.xml files contains the \"allow Trace = true\" statement, this is a finding."
  remediation:
    remediation_step: |-
      From the Tomcat server as a privileged user, edit the xml files containing the "allow Trace=true" statement.

      Remove the "allow Trace=true" statement from the affected xml configuration files and restart the Tomcat server:
      sudo systemctl restart tomcat
      sudo systemctl daemon-reload
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
