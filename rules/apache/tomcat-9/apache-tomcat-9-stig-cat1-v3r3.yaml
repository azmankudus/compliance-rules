  rule_name: RECYCLE_FACADES must be set to true.
  rule_description: |-
    If RECYCLE_FACADES is true or if a security manager is in use, a new facade object will be created for each request. This reduces the chances that a bug in an application might expose data from one request to another. This setting is configured using environment variable settings. For Linux OS flavors other than Ubuntu, use the relevant OS commands. For Ubuntu, this setting can be managed in the /etc/systemd/system/tomcat.service file via the CATALINA_OPTS variable. This setting is defined in the file and referenced during Tomcat startup in order to load Tomcat environment variables.

    Technically, the tomcat.service referenced in the check and fix could be called a different name, for STIG purposes and to provide a standard setting that can be referred to and obviously is used for Tomcat, tomcat.service was chosen.
  category: Configuration
  subcategory: General Configuration
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "From the Tomcat server as a privileged user, run the following command:\n\nsudo grep -i  recycle_facades /etc/systemd/system/tomcat.service \n\nIf there are no results, or if the org.apache.catalina.connector.RECYCLE_FACADES is not =\"true\", this is a finding."
    check_command: "From the Tomcat server as a privileged user, run the following command:\n\nsudo grep -i  recycle_facades /etc/systemd/system/tomcat.service \n\nIf there are no results, or if the org.apache.catalina.connector.RECYCLE_FACADES is not =\"true\", this is a finding."
  remediation:
    remediation_step: "From the Tomcat server as a privileged user: \n\nEdit the /etc/systemd/system/tomcat.service file and either add or edit the org.apache.catalina.connector.RECYCLE_FACADES setting.\n\nSet the org.apache.catalina.connector.RECYCLE_FACADES=true \n\nEXAMPLE:\nEnvironment='CATALINA_OPTS -Dorg.apache.catalina.connector.RECYCLE_FACADES=true'\n\nRestart the Tomcat server:\nsudo systemctl restart tomcat\nsudo systemctl daemon-reload"
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: |-
      If RECYCLE_FACADES is true or if a security manager is in use, a new facade object will be created for each request. This reduces the chances that a bug in an application might expose data from one request to another. This setting is configured using environment variable settings. For Linux OS flavors other than Ubuntu, use the relevant OS commands. For Ubuntu, this setting can be managed in the /etc/systemd/system/tomcat.service file via the CATALINA_OPTS variable. This setting is defined in the file and referenced during Tomcat startup in order to load Tomcat environment variables.

      Technically, the tomcat.service referenced in the check and fix could be called a different name, for STIG purposes and to provide a standard setting that can be referred to and obviously is used for Tomcat, tomcat.service was chosen.
    false_positive_risk: Low
