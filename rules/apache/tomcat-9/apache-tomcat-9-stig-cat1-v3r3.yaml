  rule_name: The shutdown port must be disabled.
  rule_description: Tomcat listens on TCP port 8005 to accept shutdown requests. By connecting to this port and sending the SHUTDOWN command, all applications within Tomcat are halted. The shutdown port is not exposed to the network as it is bound to the loopback interface. Set the shutdown attribute in $CATALINA_BASE/conf/server.xml.
  category: Network Configuration
  subcategory: General Configuration
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "From the Tomcat server run the following OS command:\n\n$ sudo grep -i shutdown $CATALINA_BASE/conf/server.xml\n\nEnsure the server shutdown port attribute in $CATALINA_BASE/conf/server.xml is set to -1. \n\nEXAMPLE:\n<Server port=\"-1\" shutdown=\"SHUTDOWN\">\n\nIf Server port not = \"-1\" shutdown=\"SHUTDOWN\", this is a finding."
    check_command: "From the Tomcat server run the following OS command:\n\n$ sudo grep -i shutdown $CATALINA_BASE/conf/server.xml\n\nEnsure the server shutdown port attribute in $CATALINA_BASE/conf/server.xml is set to -1. \n\nEXAMPLE:\n<Server port=\"-1\" shutdown=\"SHUTDOWN\">\n\nIf Server port not = \"-1\" shutdown=\"SHUTDOWN\", this is a finding."
  remediation:
    remediation_step: |-
      From the Tomcat server as a privileged user, edit the $CATALINA_BASE/conf/server.xml file: set the Server port setting to -1 and restart the Tomcat server.

      <Server port="-1" shutdown="SHUTDOWN">

      sudo systemctl restart tomcat
      sudo systemctl daemon-reload
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: Tomcat listens on TCP port 8005 to accept shutdown requests. By connecting to this port and sending the SHUTDOWN command, all applications within Tomcat are halted. The shutdown port is not exposed to the network as it is bound to the loopback interface. Set the shutdown attribute in $CATALINA_BASE/conf/server.xml.
    false_positive_risk: Low
