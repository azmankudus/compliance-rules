  rule_name: STRICT_SERVLET_COMPLIANCE must be set to true.
  rule_description: |-
    Strict Servlet Compliance forces Tomcat to adhere to standards specifications including but not limited to RFC2109. RFC2109 sets the standard for HTTP session management. This setting affects several settings which primarily pertain to cookie headers, cookie values, and sessions. Cookies will be parsed for strict adherence to specifications.

    Note that changing a number of these default settings may break some systems, as some browsers are unable to correctly handle the cookie headers that result from a strict adherence to the specifications.

    This one setting changes the default values for the following settings:

    org.apache.catalina.core.
    ApplicationContext.GET_RESOURCE_REQUIRE_SLASH
    org.apache.catalina.core.
    ApplicationDispatcher.WRAP_SAME_OBJECT
    org.apache.catalina.core.
    StandardHostValve.ACCESS_SESSION
    org.apache.catalina.session.
    StandardSession.ACTIVITY_CHECK
    org.apache.catalina.session.
    StandardSession.LAST_ACCESS_AT_START
    org.apache.tomcat.util.http.
    ServerCookie.ALWAYS_ADD_EXPIRES
    org.apache.tomcat.util.http.
    ServerCookie.FWD_SLASH_IS_SEPARATOR
    org.apache.tomcat.util.http.
    ServerCookie.PRESERVE_COOKIE_HEADER
    org.apache.tomcat.util.http.
    ServerCookie.STRICT_NAMING
    The resourceOnlyServlets attribute of any Context element.
    The tldValidation attribute of any Context element.
    The useRelativeRedirects attribute of any Context element.
    The xmlNamespaceAware attribute of any Context element.
    The xmlValidation attribute of any Context element.
  category: Configuration
  subcategory: General Configuration
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "If the system has an ISSM risk acceptance for operational issues that arise due to this setting, this is not a finding.\n\nFrom the Tomcat server as a privileged user, run the following command:\n\nsudo grep -i  strict_servlet /etc/systemd/system/tomcat.service \n\nIf there are no results, or if the \n-Dorg.apache.catalina.STRICT_SERVLET_COMPLIANCE is not set to true, this is a finding."
    check_command: "If the system has an ISSM risk acceptance for operational issues that arise due to this setting, this is not a finding.\n\nFrom the Tomcat server as a privileged user, run the following command:\n\nsudo grep -i  strict_servlet /etc/systemd/system/tomcat.service \n\nIf there are no results, or if the \n-Dorg.apache.catalina.STRICT_SERVLET_COMPLIANCE is not set to true, this is a finding."
  remediation:
    remediation_step: "From the Tomcat server as a privileged user:\n\nEdit the /etc/systemd/system/tomcat.service file and either add or edit the org.apache.catalina.STRICT_SERVLET_COMPLIANCE setting.\n\nSet the org.apache.catalina.STRICT_SERVLET_COMPLIANCE=true \n\nEXAMPLE:\n\nCATALINA_OPTS='-Dorg.apache.catalina.STRICT_SERVLET_COMPLIANCE=true'\n\nRestart the Tomcat server:\nsudo systemctl restart tomcat\nsudo systemctl daemon-reload"
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: |-
      Strict Servlet Compliance forces Tomcat to adhere to standards specifications including but not limited to RFC2109. RFC2109 sets the standard for HTTP session management. This setting affects several settings which primarily pertain to cookie headers, cookie values, and sessions. Cookies will be parsed for strict adherence to specifications.

      Note that changing a number of these default settings may break some systems, as some browsers are unable to correctly handle the cookie headers that result from a strict adherence to the specifications.

      This one setting changes the default values for the following settings:

      org.apache.catalina.core.
      ApplicationContext.GET_RESOURCE_REQUIRE_SLASH
      org.apache.catalina.core.
      ApplicationDispatcher.WRAP_SAME_OBJECT
      org.apache.catalina.core.
      StandardHostValve.ACCESS_SESSION
      org.apache.catalina.session.
      StandardSession.ACTIVITY_CHECK
      org.apache.catalina.session.
      StandardSession.LAST_ACCESS_AT_START
      org.apache.tomcat.util.http.
      ServerCookie.ALWAYS_ADD_EXPIRES
      org.apache.tomcat.util.http.
      ServerCookie.FWD_SLASH_IS_SEPARATOR
      org.apache.tomcat.util.http.
      ServerCookie.PRESERVE_COOKIE_HEADER
      org.apache.tomcat.util.http.
      ServerCookie.STRICT_NAMING
      The resourceOnlyServlets attribute of any Context element.
      The tldValidation attribute of any Context element.
      The useRelativeRedirects attribute of any Context element.
      The xmlNamespaceAware attribute of any Context element.
      The xmlValidation attribute of any Context element.
    false_positive_risk: Low
