  rule_name: ErrorReportValve showServerInfo must be set to false.
  rule_description: The Error Report Valve is a simple error handler for HTTP status codes that will generate and return HTML error pages. It can also be configured to return pre-defined static HTML pages for specific status codes and/or exception types. Disabling showServerInfo will only return the HTTP status code and remove all CSS from the default non-error related HTTP responses.
  category: Network Configuration
  subcategory: Error Handling
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |-
      As an elevated user on the Tomcat server run the following command:

      sudo grep -i ErrorReportValve $CATALINA_BASE/conf/server.xml file.

      If the ErrorReportValve element is not defined and showServerInfo set to "false", this is a finding.

      EXAMPLE:
      <Host ...>
        ...
        <Valve className="org.apache.catalina.valves.ErrorReportValve" showServerInfo="false"/>
        ...
      </Host>
    check_command: |-
      As an elevated user on the Tomcat server run the following command:

      sudo grep -i ErrorReportValve $CATALINA_BASE/conf/server.xml file.

      If the ErrorReportValve element is not defined and showServerInfo set to "false", this is a finding.

      EXAMPLE:
      <Host ...>
        ...
        <Valve className="org.apache.catalina.valves.ErrorReportValve" showServerInfo="false"/>
        ...
      </Host>
  remediation:
    remediation_step: "As a privileged user on the Tomcat server:\n\nEdit the $CATALINA_BASE/conf/server.xml file.\n\nCreate or modify an ErrorReportValve <Valve> element nested beneath each <Host> element.\n\nEXAMPLE:\n<Host name=\"localhost\"  appBase=\"webapps\"\n            unpackWARs=\"true\" autoDeploy=\"false\">\n...\n<Valve className=\"org.apache.catalina.valves.ErrorReportValve\" \nshowServerInfo=\"false\" />\n...\n</Host>\n\nRestart the Tomcat server:\nsudo systemctl restart tomcat\nsudo systemctl daemon-reload"
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: The Error Report Valve is a simple error handler for HTTP status codes that will generate and return HTML error pages. It can also be configured to return pre-defined static HTML pages for specific status codes and/or exception types. Disabling showServerInfo will only return the HTTP status code and remove all CSS from the default non-error related HTTP responses.
    false_positive_risk: Low
