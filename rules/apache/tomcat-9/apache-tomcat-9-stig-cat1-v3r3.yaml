  rule_name: Default error pages for manager application must be customized.
  rule_description: Default error pages that accompany the manager application provide educational information on how to configure user accounts and groups for accessing the manager application. These error pages provide responses to 401 (Unauthorized), 403 (Forbidden), and 404 (Not Found) JSP error codes and should not exist on production systems.
  category: Error Handling
  subcategory: Manager Application
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "From the Tomcat server console, run the following command:\n\nsudo cat $CATALINA_BASE/webapps/manager/WEB-INF/jsp/401.jsp \n\nRepeat for the 402.jsp and 403.jsp files.\n\nThe default error files contain sample passwords and user accounts.\n\nIf the error files contained in this folder are not customized and sample information removed, this is a finding."
    check_command: "From the Tomcat server console, run the following command:\n\nsudo cat $CATALINA_BASE/webapps/manager/WEB-INF/jsp/401.jsp \n\nRepeat for the 402.jsp and 403.jsp files.\n\nThe default error files contain sample passwords and user accounts.\n\nIf the error files contained in this folder are not customized and sample information removed, this is a finding."
  remediation:
    remediation_step: |-
      From the Tomcat server as a privileged user:

      sudo cd $CATALINA_BASE/webapps/manager/WEB-INF/jsp/

      Use a file editor like nano or vi and edit the 401, 402, and 403 jsp files. Remove account information and make the files reflect generic error information that assists users but does not provide sample data to users.

      Save the file and restart Tomcat:
      sudo systemctl restart tomcat
      sudo systemctl daemon-reload
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: Default error pages that accompany the manager application provide educational information on how to configure user accounts and groups for accessing the manager application. These error pages provide responses to 401 (Unauthorized), 403 (Forbidden), and 404 (Not Found) JSP error codes and should not exist on production systems.
    false_positive_risk: Low
