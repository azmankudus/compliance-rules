  rule_name: DefaultServlet must be set to readonly for PUT and DELETE.
  rule_description: The DefaultServlet is a servlet provided with Tomcat. It is called when no other suitable page can be displayed to the client. The DefaultServlet serves static resources as well as directory listings and is declared globally in $CATALINA_BASE/conf/web.xml. By default, Tomcat behaves as if the DefaultServlet is set to "true" (HTTP commands like PUT and DELETE are rejected). However, the readonly parameter is not in the web.xml file by default so to ensure proper configuration and system operation, the "readonly" parameter in web.xml  must be created and set to "true". Creating the setting in web.xml provides assurances the system is operating as required. Changing the readonly parameter to false could allow clients to delete or modify static resources on the server and upload new resources.
  category: Configuration
  subcategory: General Configuration
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "From the Tomcat server run the following command:\n\nsudo cat $CATALINA_BASE/conf/web.xml |grep -i -A5 -B2 defaultservlet \n\nIf the \"readonly\" param-value for the \"DefaultServlet\" servlet class = \"false\" or does not exist, this is a finding."
    check_command: "From the Tomcat server run the following command:\n\nsudo cat $CATALINA_BASE/conf/web.xml |grep -i -A5 -B2 defaultservlet \n\nIf the \"readonly\" param-value for the \"DefaultServlet\" servlet class = \"false\" or does not exist, this is a finding."
  remediation:
    remediation_step: "From the Tomcat server console as a privileged user:\n\nEdit the $CATALINA_BASE/conf/web.xml file. \n\nIf the \"readonly\" param-value does not exist, it must be created.\n\nEnsure the \"readonly\" param-value for the \"DefaultServlet\" servlet class = \"true\"."
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: The DefaultServlet is a servlet provided with Tomcat. It is called when no other suitable page can be displayed to the client. The DefaultServlet serves static resources as well as directory listings and is declared globally in $CATALINA_BASE/conf/web.xml. By default, Tomcat behaves as if the DefaultServlet is set to "true" (HTTP commands like PUT and DELETE are rejected). However, the readonly parameter is not in the web.xml file by default so to ensure proper configuration and system operation, the "readonly" parameter in web.xml  must be created and set to "true". Creating the setting in web.xml provides assurances the system is operating as required. Changing the readonly parameter to false could allow clients to delete or modify static resources on the server and upload new resources.
    false_positive_risk: Low
