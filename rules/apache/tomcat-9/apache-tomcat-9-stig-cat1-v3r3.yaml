  rule_name: Tomcat management applications must use LDAP realm authentication.
  rule_description: Using the local user store on a Tomcat installation does not meet a multitude of security control requirements related to user account management. To address this risk, Tomcat must be configured to utilize an LDAP or Active Directory installation that provides a centralized user account store that is configured to meet standard DoD user account management requirements. JNDIRealm is an implementation of the Tomcat Realm interface that looks up users in an LDAP directory server accessed by a JNDI provider (typically, the standard LDAP provider that is available with the JNDI API classes). The realm supports a variety of approaches to using a directory for authentication.
  category: Authentication
  subcategory: General Configuration
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "If manager and host-manager applications have been deleted from the system, this is not a finding. \n\nFrom the Tomcat server as a privileged user, run the following commands:\n\nsudo grep -i -A8 JNDIRealm $CATALINA_BASE/conf/server.xml\n\nIf the JNDIRealm does not exist or if the JNDIRealm configuration is commented out, this is finding."
    check_command: "If manager and host-manager applications have been deleted from the system, this is not a finding. \n\nFrom the Tomcat server as a privileged user, run the following commands:\n\nsudo grep -i -A8 JNDIRealm $CATALINA_BASE/conf/server.xml\n\nIf the JNDIRealm does not exist or if the JNDIRealm configuration is commented out, this is finding."
  remediation:
    remediation_step: |-
      Identify the server IP that is providing LDAP services and configure the Tomcat user roles schema within LDAP. Refer to the manager and host-manager web.xml files for application specific role information that can be used for setting up the roles for those applications. The default location for these files is: $CATALINA_BASE/webapps/<AppName>/WEB-INF/web.xml

      From the Tomcat server console as a privileged user, edit the $CATALINA_BASE/conf/server.xml file.

      Locate the <Realm> element in the server.xml file, add a nested <Realm> element using the JNDIRealm className and configure the associated LDAP settings as per the LDAP server connection requirements.

      EXAMPLE:
      This is for illustration purposes only. Modify the LDAP settings on a case-by-case basis as per the individual LDAP server and schema.

      <Realm   className="org.apache.catalina.realm.JNDIRealm"
           connectionURL="ldaps://localhost:686"
             userPattern="uid={0},ou=people,dc=myunit,dc=mil"
                roleBase="ou=groups,dc=myunit,dc=mil"
                roleName="cn"
              roleSearch="(uniqueMember={0})"
      />
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: Using the local user store on a Tomcat installation does not meet a multitude of security control requirements related to user account management. To address this risk, Tomcat must be configured to utilize an LDAP or Active Directory installation that provides a centralized user account store that is configured to meet standard DoD user account management requirements. JNDIRealm is an implementation of the Tomcat Realm interface that looks up users in an LDAP directory server accessed by a JNDI provider (typically, the standard LDAP provider that is available with the JNDI API classes). The realm supports a variety of approaches to using a directory for authentication.
    false_positive_risk: Low
  id: STIG-V-222962
