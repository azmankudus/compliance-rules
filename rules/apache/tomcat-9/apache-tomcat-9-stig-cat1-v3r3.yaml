  rule_name: Application user name must be logged.
  rule_description: 'The access logfile format is defined within a Valve that implements the org.apache.catalina.valves.AccessLogValve interface within the /opt/tomcat/server.xml configuration file: The %u pattern code is included in the pattern element and logs the username used to authenticate to an application. Including the username pattern in the log configuration provides useful information about the application user who is logging in, which is critical for troubleshooting and forensic investigations.'
  category: Auditing and Logging
  subcategory: Logging Configuration
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |-
      As an elevated user on the Tomcat server:

      Edit the $CATALINA_BASE/conf/server.xml file.

      Review all "Valve" elements.

      If the pattern= statement does not include %u, this is a finding.

      EXAMPLE:
      <Host name="localhost"  appBase="webapps"
                  unpackWARs="true" autoDeploy="false">
      ...
      <Valve className="org.apache.catalina.valves.AccessLogValve" directory="logs"
                     prefix="localhost_access_log" suffix=".txt"
                     pattern="%h %l %t %u "%r" %s %b" />
        ...
      </Host>
    check_command: |-
      As an elevated user on the Tomcat server:

      Edit the $CATALINA_BASE/conf/server.xml file.

      Review all "Valve" elements.

      If the pattern= statement does not include %u, this is a finding.

      EXAMPLE:
      <Host name="localhost"  appBase="webapps"
                  unpackWARs="true" autoDeploy="false">
      ...
      <Valve className="org.apache.catalina.valves.AccessLogValve" directory="logs"
                     prefix="localhost_access_log" suffix=".txt"
                     pattern="%h %l %t %u "%r" %s %b" />
        ...
      </Host>
  remediation:
    remediation_step: |-
      As a privileged user on the Tomcat server:

      Edit the $CATALINA_BASE/conf/server.xml file.

      Modify the <Valve> element that is nested beneath the <Host> element. Change the AccessLogValve setting to include %u in the pattern= statement.

      EXAMPLE:
      <Host name="localhost"  appBase="webapps"
                  unpackWARs="true" autoDeploy="false">
      ...
      <Valve className="org.apache.catalina.valves.AccessLogValve" directory="logs"
                     prefix="localhost_access_log" suffix=".txt"
                     pattern="%h %l %t %u "%r" %s %b" />
        ...
      </Host>

      Restart the Tomcat server:
      sudo systemctl restart tomcat
      sudo systemctl daemon-reload
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: 'The access logfile format is defined within a Valve that implements the org.apache.catalina.valves.AccessLogValve interface within the /opt/tomcat/server.xml configuration file: The %u pattern code is included in the pattern element and logs the username used to authenticate to an application. Including the username pattern in the log configuration provides useful information about the application user who is logging in, which is critical for troubleshooting and forensic investigations.'
    false_positive_risk: Low
