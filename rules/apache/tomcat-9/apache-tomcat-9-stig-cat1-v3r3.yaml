  rule_name: $CATALINA_HOME folder must be owned by the root user, group tomcat.
  rule_description: Tomcat file permissions must be restricted. The standard configuration is to have the folder where Tomcat is installed owned by the root user with the group set to tomcat. The $CATALINA_HOME environment variable should be set to the location of the root directory of the "binary" distribution of Tomcat.
  category: User Management
  subcategory: User Configuration
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |-
      Access the Tomcat server from the command line and execute the following OS command:

      sudo find $CATALINA_HOME -follow -maxdepth 0 \(  ! -user root -o ! -group tomcat \) -ls

      If no folders are displayed, this is not a finding.

      If results indicate the $CATALINA_HOME folder ownership and group membership is not set to root:tomcat, this is a finding.
    check_command: |-
      Access the Tomcat server from the command line and execute the following OS command:

      sudo find $CATALINA_HOME -follow -maxdepth 0 \(  ! -user root -o ! -group tomcat \) -ls

      If no folders are displayed, this is not a finding.

      If results indicate the $CATALINA_HOME folder ownership and group membership is not set to root:tomcat, this is a finding.
  remediation:
    remediation_step: |-
      Run the following commands on the Tomcat server:

      sudo find $CATALINA_HOME -maxdepth 0 \( ! -user root \) | sudo xargs chown root

      sudo find $CATALINA_HOME -maxdepth 0 \( ! -group tomcat \) | sudo xargs chgrp tomcat
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
  context:
    rationale: Tomcat file permissions must be restricted. The standard configuration is to have the folder where Tomcat is installed owned by the root user with the group set to tomcat. The $CATALINA_HOME environment variable should be set to the location of the root directory of the "binary" distribution of Tomcat.
    false_positive_risk: Low
