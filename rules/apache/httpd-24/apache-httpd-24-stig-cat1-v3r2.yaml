    detection_step: "Review the web server documentation and configuration to determine if the web server is being used as a user management application.\n \nSearch for \"AuthUserFile\" in the configuration files in the installed Apache Path.\n \nExample:\n\ngrep -rin AuthUserFile *\n \nIf there are uncommented lines pointing to files on disk using the above configuration option, this is a finding.\n"
    check_command: "Review the web server documentation and configuration to determine if the web server is being used as a user management application.\n \nSearch for \"AuthUserFile\" in the configuration files in the installed Apache Path.\n \nExample:\n\ngrep -rin AuthUserFile *\n \nIf there are uncommented lines pointing to files on disk using the above configuration option, this is a finding.\n"
  remediation:
    remediation_step: |
      Comment out the "AuthUserFile" lines found in the Apache configuration.
