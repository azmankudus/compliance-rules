- rule_id: STIG-V-214250
  legacy_ids:
  - V-214250
  - SV-214250r1043179_rule
  rule_name: |
    The Apache web server must invalidate session identifiers upon hosted application user logout or other session termination.
  rule_description: |
    Captured sessions can be reused in "replay" attacks. This requirement limits the ability of adversaries from capturing and continuing to employ previously valid session IDs.

    Session IDs are tokens generated by web applications to uniquely identify an application user's session. Unique session IDs help to reduce predictability of said identifiers. When a user logs out, or when any other session termination event occurs, the web server must terminate the user session to minimize the potential for an attacker to hijack that particular user session.

    Satisfies: SRG-APP-000220-WSR-000201, SRG-APP-000295-WSR-000012
  category: Session Management
  subcategory: Session Management
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "Determine the location of the \"HTTPD_ROOT\" directory and the \"httpd.conf\" file:\n\n# apachectl -V | egrep -i 'httpd_root|server_config_file'\n-D HTTPD_ROOT=\"/etc/httpd\"\n-D SERVER_CONFIG_FILE=\"conf/httpd.conf\"\n\nNote: The apachectl front end is the preferred method for locating the Apache httpd file. For some Linux distributions, \"apache2ctl -V\" or  \"httpd -V\" can also be used. \n\nSearch for the following directive:\n\n\"SessionMaxAge\"\n\n# cat /<path_to_file>/httpd.conf | grep -i \"SessionMaxAge\"\n\nVerify the value of \"SessionMaxAge\" is set to \"600\" or less.\n\nIf the \"SessionMaxAge\" does not exist or is set to more than \"600\", this is a finding.\n"
    check_command: "Determine the location of the \"HTTPD_ROOT\" directory and the \"httpd.conf\" file:\n\n# apachectl -V | egrep -i 'httpd_root|server_config_file'\n-D HTTPD_ROOT=\"/etc/httpd\"\n-D SERVER_CONFIG_FILE=\"conf/httpd.conf\"\n\nNote: The apachectl front end is the preferred method for locating the Apache httpd file. For some Linux distributions, \"apache2ctl -V\" or  \"httpd -V\" can also be used. \n\nSearch for the following directive:\n\n\"SessionMaxAge\"\n\n# cat /<path_to_file>/httpd.conf | grep -i \"SessionMaxAge\"\n\nVerify the value of \"SessionMaxAge\" is set to \"600\" or less.\n\nIf the \"SessionMaxAge\" does not exist or is set to more than \"600\", this is a finding.\n"
  remediation:
    remediation_step: |
      Determine the location of the "HTTPD_ROOT" directory and the "httpd.conf" file:

      # apachectl -V | egrep -i 'httpd_root|server_config_file'
      -D HTTPD_ROOT="/etc/httpd"
      -D SERVER_CONFIG_FILE="conf/httpd.conf"

      Add the following line to the "httpd.conf" file:

      SessionMaxAge 600

      Restart Apache: apachectl restart
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
