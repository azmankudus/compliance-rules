  rule_name: The Apache web server must allow the mappings to unused and vulnerable scripts to be removed.
  rule_description: |
    Scripts allow server-side processing on behalf of the hosted application user or as processes needed in the implementation of hosted applications. Removing scripts not needed for application operation or deemed vulnerable helps to secure the web server.

    To ensure scripts are not added to the web server and run maliciously, script mappings that are not needed or used by the web server for hosted application operation must be removed.
  category: Configuration
  subcategory: Scripts
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: "Determine the location of the \"HTTPD_ROOT\" directory and the \"httpd.conf\" file:\n\n# apachectl -V | egrep -i 'httpd_root|server_config_file'\n-D HTTPD_ROOT=\"/etc/httpd\"\n-D SERVER_CONFIG_FILE=\"conf/httpd.conf\"\n\nNote: The apachectl front end is the preferred method for locating the Apache httpd file. For some Linux distributions, \"apache2ctl -V\" or  \"httpd -V\" can also be used.  \n\nLocate \"cgi-bin\" files and directories enabled in the Apache configuration via \"Script\", \"ScriptAlias\" or \"ScriptAliasMatch\", and \"ScriptInterpreterSource\" directives:\n\n# cat /<path_to_file>/httpd.conf | grep -i \"Script\"\n\nIf any scripts are present that are not needed for application operation, this is a finding.\n\nIf this is not documented and approved by the Information System Security Officer (ISSO), this is a finding.\n"
    check_command: "Determine the location of the \"HTTPD_ROOT\" directory and the \"httpd.conf\" file:\n\n# apachectl -V | egrep -i 'httpd_root|server_config_file'\n-D HTTPD_ROOT=\"/etc/httpd\"\n-D SERVER_CONFIG_FILE=\"conf/httpd.conf\"\n\nNote: The apachectl front end is the preferred method for locating the Apache httpd file. For some Linux distributions, \"apache2ctl -V\" or  \"httpd -V\" can also be used.  \n\nLocate \"cgi-bin\" files and directories enabled in the Apache configuration via \"Script\", \"ScriptAlias\" or \"ScriptAliasMatch\", and \"ScriptInterpreterSource\" directives:\n\n# cat /<path_to_file>/httpd.conf | grep -i \"Script\"\n\nIf any scripts are present that are not needed for application operation, this is a finding.\n\nIf this is not documented and approved by the Information System Security Officer (ISSO), this is a finding.\n"
  remediation:
    remediation_step: |
      Determine the location of the "HTTPD_ROOT" directory and the "httpd.conf" file:

      # apachectl -V | egrep -i 'httpd_root|server_config_file'
      -D HTTPD_ROOT="/etc/httpd"
      -D SERVER_CONFIG_FILE="conf/httpd.conf"

      Review "Script", "ScriptAlias" or "ScriptAliasMatch", and "ScriptInterpreterSource" directives.

      Go into each directory and locate "cgi-bin" files. Remove any script that is not needed for application operation.

      Ensure this process is documented and approved by the ISSO.
    rollback_supported: true
    reboot_required: false
    service_impact: Service restart required
    estimated_time: 5 minutes
