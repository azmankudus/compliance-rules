    check_command: "Determine the location of the \"HTTPD_ROOT\" directory and the \"httpd.conf\" file:\n\n# apachectl -V | egrep -i 'httpd_root|server_config_file'\n-D HTTPD_ROOT=\"/etc/httpd\"\n-D SERVER_CONFIG_FILE=\"conf/httpd.conf\"\n\nNote: The apachectl front end is the preferred method for locating the Apache httpd file. For some Linux distributions, \"apache2ctl -V\" or \"httpd -V\" can also be used. \n\n# cat /<path_to_file>/httpd.conf | grep -i \"ErrorDocument\"\n\nIf the \"ErrorDocument\" directive is not being used for custom error pages for \"4xx\" or \"5xx\" HTTP status codes, this is a finding.\n\nNote: Using a \"sites-available\" method for error messages is also acceptable; this would involve the use of /etc/apache2/sites-available and /etc/apache2/sites-enabled. As long as warning and error messages have been sanitized, this is not a finding.\n"
  remediation:
    remediation_step: "Determine the location of the \"HTTPD_ROOT\" directory and the \"httpd.conf\" file:\n\n# apachectl -V | egrep -i 'httpd_root|server_config_file'\n-D HTTPD_ROOT=\"/etc/httpd\"\n-D SERVER_CONFIG_FILE=\"conf/httpd.conf\"\n\nUse the \"ErrorDocument\" directive to enable custom error pages for 4xx or 5xx HTTP status codes.\n\nErrorDocument 500 \"Sorry, our script crashed. Oh dear\"\nErrorDocument 500 /cgi-bin/crash-recover\nErrorDocument 500 http://error.example.com/server_error.html\nErrorDocument 404 /errors/not_found.html\nErrorDocument 401 /subscription/how_to_subscribe.html\n\nThe syntax of the ErrorDocument directive is:\n\nErrorDocument <3-digit-code> <action>\n\nAdditional information: \n\nhttps://httpd.apache.org/docs/2.4/custom-error.html\n"
