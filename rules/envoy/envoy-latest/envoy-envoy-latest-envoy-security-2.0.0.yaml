- rule_id: ENVOY-CIRCUIT-001
  legacy_ids: []
  rule_name: Configure circuit breakers
  rule_description: |
    Configure circuit breakers to prevent cascade failures and protect upstream services from overload.
  category: Resilience
  subcategory: Circuit Breakers
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |
      Check circuit breaker configuration:
      
      grep -A20 "circuit_breakers" /etc/envoy/envoy.yaml
      
      Verify:
      1. Circuit breakers are configured for each cluster
      2. Max connections, pending requests, and requests limits are set
      3. Retry limits are configured
      
      If circuit breakers are not configured, this is a finding.
    check_command: 'grep -E "circuit_breakers" /etc/envoy/envoy.yaml || echo "Circuit
      breakers not configured"'
    expected_value: Circuit breakers configured
  remediation:
    remediation_step: |
      Configure circuit breakers in envoy.yaml:
      
      clusters:
      - name: backend_service
        connect_timeout: 5s
        type: STRICT_DNS
        lb_policy: ROUND_ROBIN
        circuit_breakers:
          thresholds:
          - priority: DEFAULT
            max_connections: 1000
            max_pending_requests: 1000
            max_requests: 1000
            max_retries: 3
          - priority: HIGH
            max_connections: 500
            max_pending_requests: 500
            max_requests: 500
            max_retries: 2
      
      Adjust values based on your upstream service capacity.
      
      Restart Envoy: systemctl restart envoy
    rollback_supported: true
    reboot_required: false
    service_impact: Requests exceeding limits will be rejected (HTTP 503)
    estimated_time: 30 seconds
  context:
    rationale: Circuit breakers prevent cascade failures by limiting connections
      and requests to upstream services, allowing them to recover from overload.
    impact: Excess traffic will be rejected rather than queued
    false_positive_risk: Low
    references:
    - type: Envoy Circuit Breakers
      reference: https://www.envoyproxy.io/docs/envoy/latest/intro/arch_overview/upstream/circuit_breaking
  tags:
  - envoy
  - circuit-breakers
  - resilience
  - fault-tolerance

- rule_id: ENVOY-OUTLIER-001
  legacy_ids: []
  rule_name: Configure outlier detection
  rule_description: |
    Configure outlier detection to automatically remove unhealthy hosts from the load balancing pool.
  category: Resilience
  subcategory: Outlier Detection
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |
      Check outlier detection configuration:
      
      grep -A20 "outlier_detection" /etc/envoy/envoy.yaml
      
      Verify:
      1. Outlier detection is configured for clusters
      2. Ejection thresholds are appropriate
      3. Ejection duration is configured
      
      If outlier detection is not configured, this is a finding.
    check_command: 'grep -E "outlier_detection" /etc/envoy/envoy.yaml || echo "Outlier
      detection not configured"'
    expected_value: Outlier detection configured
  remediation:
    remediation_step: |
      Configure outlier detection in envoy.yaml:
      
      clusters:
      - name: backend_service
        connect_timeout: 5s
        type: STRICT_DNS
        lb_policy: ROUND_ROBIN
        outlier_detection:
          consecutive_5xx: 5
          interval: 30s
          base_ejection_time: 30s
          max_ejection_percent: 50
          success_rate_minimum_hosts: 3
          success_rate_request_volume: 10
          success_rate_stdev_factor: 1900
          enforcing_consecutive_5xx: 100
          enforcing_success_rate: 100
          enforcing_failure_percentage:
            value: 100
          failure_percentage_threshold: 50
          failure_percentage_request_volume: 10
          enforcing_local_origin_success_rate:
            value: 100
          enforcing_local_origin_consecutive_5xx:
            value: 100
          enforcing_local_origin_failure_percentage:
            value: 100
      
      Restart Envoy: systemctl restart envoy
    rollback_supported: true
    reboot_required: false
    service_impact: Unhealthy hosts will be temporarily removed from load balancing
    estimated_time: 30 seconds
  context:
    rationale: Outlier detection improves resilience by automatically detecting and
      removing unhealthy hosts from the load balancing pool.
    impact: Some hosts may be temporarily removed from rotation
    false_positive_risk: Medium
    references:
    - type: Envoy Outlier Detection
      reference: https://www.envoyproxy.io/docs/envoy/latest/intro/arch_overview/upstream/outlier
  tags:
  - envoy
  - outlier-detection
  - resilience
  - fault-tolerance

- rule_id: ENVOY-FIPS-001
  legacy_ids: []
  rule_name: Use FIPS-compliant build
  rule_description: |
    Use a FIPS 140-2 compliant Envoy build when cryptographic module compliance is required.
  category: Cryptography
  subcategory: FIPS Compliance
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Partial
    audit_type: runtime
    detection_step: |
      Check if Envoy is built with FIPS support:
      
      envoy --version
      
      Look for "BoringSSL-FIPS" or "AWS-LC-FIPS" in the version output.
      
      If FIPS compliance is required but not using FIPS build, this is a finding.
    check_command: envoy --version 2>/dev/null | grep -i fips || echo "FIPS not detected"
    expected_value: FIPS-compliant build if required
  remediation:
    remediation_step: |
      Use a FIPS-compliant Envoy build:
      
      For BoringSSL FIPS:
      Build Envoy with --config=boringssl-fips Bazel option.
      
      For AWS-LC FIPS:
      Build Envoy with --config=aws-lc-fips Bazel option.
      
      Verify FIPS build:
      envoy --version
      
      Expected output should include "BoringSSL-FIPS" or "AWS-LC-FIPS".
      
      Note: FIPS compliance also requires:
      1. Using only approved algorithms
      2. Using keys generated by FIPS-approved module
      3. Proper configuration of FIPS mode
      
      Consult the Security Policy for BoringCrypto module or AWS-LC for full requirements.
    rollback_supported: false
    reboot_required: true
    service_impact: Requires rebuild and redeployment of Envoy
    estimated_time: Variable
  context:
    rationale: FIPS 140-2 compliance is required for certain regulated environments
      and ensures cryptographic operations meet government standards.
    impact: Must rebuild Envoy with FIPS support; may limit some features
    false_positive_risk: None
    references:
    - type: Envoy FIPS Documentation
      reference: https://www.envoyproxy.io/docs/envoy/latest/intro/arch_overview/security/ssl#fips-140-2
    - type: BoringSSL FIPS
      reference: https://boringssl.googlesource.com/boringssl/+/main/crypto/fipsmodule/FIPS.md
  tags:
  - envoy
  - fips
  - cryptography
  - compliance

- rule_id: ENVOY-CLUSTER-001
  legacy_ids: []
  rule_name: Configure cluster TLS for upstream connections
  rule_description: |
    Configure TLS for upstream cluster connections to ensure encrypted communication with backend services.
  category: Cryptography
  subcategory: Upstream TLS
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |
      Check upstream TLS configuration:
      
      grep -A30 "clusters:" /etc/envoy/envoy.yaml | grep -A20 "transport_socket"
      
      Verify:
      1. TLS is configured for upstream clusters handling sensitive data
      2. Certificate verification is enabled
      3. SNI is configured where appropriate
      
      If upstream TLS is not configured for sensitive services, this is a finding.
    check_command: 'grep -A30 "clusters:" /etc/envoy/envoy.yaml | grep -E "transport_socket|tls"'
    expected_value: TLS configured for upstream clusters
  remediation:
    remediation_step: |
      Configure upstream TLS in envoy.yaml:
      
      clusters:
      - name: backend_service
        connect_timeout: 5s
        type: STRICT_DNS
        lb_policy: ROUND_ROBIN
        transport_socket:
          name: envoy.transport_sockets.tls
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
            common_tls_context:
              tls_params:
                tls_minimum_protocol_version: TLSv1_2
              validation_context:
                match_typed_subject_alt_names:
                - san_type: DNS
                  matcher:
                    exact: "backend.example.com"
                trusted_ca:
                  filename: /etc/ssl/certs/ca-certificates.crt
            sni: backend.example.com
      
      Restart Envoy: systemctl restart envoy
    rollback_supported: true
    reboot_required: false
    service_impact: Connections to backends will use TLS
    estimated_time: 30 seconds
  context:
    rationale: TLS for upstream connections ensures data in transit to backend services
      is encrypted and protected from interception.
    impact: Backend services must support TLS
    false_positive_risk: Low
    references:
    - type: Envoy TLS Documentation
      reference: https://www.envoyproxy.io/docs/envoy/latest/intro/arch_overview/security/ssl
  tags:
  - envoy
  - tls
  - upstream
  - encryption

- rule_id: ENVOY-MTLS-001
  legacy_ids: []
  rule_name: Configure mutual TLS (mTLS) for service-to-service communication
  rule_description: |
    Configure mutual TLS authentication to verify both client and server identities in service-to-service communication.
  category: Authentication
  subcategory: Mutual TLS
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |
      Check mTLS configuration:
      
      grep -A30 "tls_context\|DownstreamTlsContext\|UpstreamTlsContext" /etc/envoy/envoy.yaml
      
      Verify:
      1. Client certificate authentication is required
      2. Client certificates are validated against trusted CA
      3. Both sides present and verify certificates
      
      If mTLS is required but not configured, this is a finding.
    check_command: 'grep -E "require_client_certificate|tls_certificates" /etc/envoy/envoy.yaml
      || echo "mTLS not configured"'
    expected_value: mTLS configured for service mesh or sensitive services
  remediation:
    remediation_step: |
      Configure mTLS in envoy.yaml:
      
      For downstream (server-side):
      
      tls_context:
        common_tls_context:
          tls_certificates:
          - certificate_chain: {filename: "certs/servercert.pem"}
            private_key: {filename: "certs/serverkey.pem"}
          validation_context:
            trusted_ca:
              filename: certs/client-ca.pem
        require_client_certificate: true
      
      For upstream (client-side):
      
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          common_tls_context:
            tls_certificates:
            - certificate_chain: {filename: "certs/clientcert.pem"}
              private_key: {filename: "certs/clientkey.pem"}
            validation_context:
              match_typed_subject_alt_names:
              - san_type: DNS
                matcher:
                  exact: "backend.example.com"
              trusted_ca:
                filename: certs/server-ca.pem
          sni: backend.example.com
      
      Restart Envoy: systemctl restart envoy
    rollback_supported: true
    reboot_required: false
    service_impact: Services without valid certificates cannot communicate
    estimated_time: 30 seconds
  context:
    rationale: mTLS provides strong authentication for service-to-service communication,
      ensuring both parties are verified before exchanging data.
    impact: All services must have valid certificates; certificate management required
    false_positive_risk: Low
    references:
    - type: Envoy TLS Documentation
      reference: https://www.envoyproxy.io/docs/envoy/latest/intro/arch_overview/security/ssl
  tags:
  - envoy
  - mtls
  - authentication
  - service-mesh
  - certificates

- rule_id: ENVOY-STATS-001
  legacy_ids: []
  rule_name: Secure statistics export
  rule_description: |
    Configure secure statistics export to prevent exposure of sensitive operational data.
  category: Observability
  subcategory: Statistics
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |
      Check statistics configuration:
      
      grep -A20 "stats_sinks\|statsd\|prometheus" /etc/envoy/envoy.yaml
      
      Verify:
      1. Stats endpoints are not publicly exposed
      2. Stats sinks are configured securely
      3. Sensitive stats are filtered if necessary
      
      If stats are exposed publicly without access control, this is a finding.
    check_command: 'grep -E "stats_sinks|stats|prometheus" /etc/envoy/envoy.yaml ||
      echo "Stats configuration not found"'
    expected_value: Statistics secured and not publicly exposed
  remediation:
    remediation_step: |
      Configure secure statistics export in envoy.yaml:
      
      stats_sinks:
      - name: envoy.stat_sinks.statsd
        typed_config:
          "@type": type.googleapis.com/envoy.config.metrics.v3.StatsdSink
          address:
            socket_address:
              address: statsd-server.internal
              port_value: 8125
          prefix: envoy
      
      Or for Prometheus via admin interface (ensure admin is secured):
      
      Access stats at: http://127.0.0.1:9901/stats/prometheus
      
      Ensure:
      1. Admin interface is bound to localhost
      2. Stats collection network is isolated
      3. Stats do not contain sensitive data (use stats_prefix filter)
      
      Restart Envoy: systemctl restart envoy
    rollback_supported: true
    reboot_required: false
    service_impact: Stats available only to authorized systems
    estimated_time: 30 seconds
  context:
    rationale: Statistics can reveal operational details about your infrastructure.
      Exposing them publicly aids attackers in understanding your system.
    impact: Stats collection must be done securely
    false_positive_risk: Low
    references:
    - type: Envoy Stats Overview
      reference: https://www.envoyproxy.io/docs/envoy/latest/operations/stats_overview
  tags:
  - envoy
  - statistics
  - observability
  - security

- rule_id: ENVOY-SDS-001
  legacy_ids: []
  rule_name: Use Secret Discovery Service (SDS) for certificate management
  rule_description: |
    Configure Secret Discovery Service (SDS) for dynamic certificate rotation without Envoy restart.
  category: Configuration
  subcategory: Certificate Management
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |
      Check SDS configuration:
      
      grep -A20 "sds\|secret_discovery" /etc/envoy/envoy.yaml
      
      Verify:
      1. SDS is configured for dynamic certificate management
      2. SDS server is properly secured
      3. Certificate rotation is tested
      
      If static certificates are used and rotation is required, consider SDS.
    check_command: 'grep -E "sds|secret" /etc/envoy/envoy.yaml || echo "SDS not configured"'
    expected_value: SDS configured for dynamic certificate management (optional)
  remediation:
    remediation_step: |
      Configure SDS in envoy.yaml:
      
      dynamic_resources:
        cds_config:
          api_config_source:
            api_type: GRPC
            grpc_services:
            - envoy_grpc:
                cluster_name: xds_cluster
        lds_config:
          api_config_source:
            api_type: GRPC
            grpc_services:
            - envoy_grpc:
                cluster_name: xds_cluster
        ads_config:
          api_type: GRPC
          grpc_services:
          - envoy_grpc:
              cluster_name: xds_cluster
      
      clusters:
      - name: xds_cluster
        connect_timeout: 5s
        type: STRICT_DNS
        lb_policy: ROUND_ROBIN
        transport_socket:
          name: envoy.transport_sockets.tls
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
            common_tls_context:
              tls_certificates:
              - certificate_chain: {filename: "certs/envoy.pem"}
                private_key: {filename: "certs/envoy-key.pem"}
              validation_context:
                trusted_ca:
                  filename: certs/root-ca.pem
        load_assignment:
          cluster_name: xds_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: xds-server
                    port_value: 18000
      
      Restart Envoy: systemctl restart envoy
    rollback_supported: true
    reboot_required: false
    service_impact: Enables dynamic certificate rotation
    estimated_time: 30 seconds
  context:
    rationale: SDS enables dynamic certificate rotation without Envoy restart, improving
      security posture and operational efficiency.
    impact: Requires SDS server deployment and management
    false_positive_risk: Low
    references:
    - type: Envoy SDS Documentation
      reference: https://www.envoyproxy.io/docs/envoy/latest/intro/arch_overview/security/ssl#secret-discovery-service-sds
  tags:
  - envoy
  - sds
  - certificates
  - xds
  - dynamic-configuration

- rule_id: ENVOY-CSRF-001
  legacy_ids: []
  rule_name: Configure CSRF protection
  rule_description: |
    Configure Cross-Site Request Forgery (CSRF) protection for web applications.
  category: Application Security
  subcategory: CSRF Protection
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |
      Check CSRF filter configuration:
      
      grep -A20 "csrf" /etc/envoy/envoy.yaml
      
      Verify:
      1. CSRF filter is configured for web applications
      2. Shadow mode is disabled (filter is enforced)
      3. Appropriate origins are allowed
      
      If CSRF protection is needed but not configured, this is a finding.
    check_command: 'grep -E "csrf" /etc/envoy/envoy.yaml || echo "CSRF protection
      not configured"'
    expected_value: CSRF protection configured for web applications
  remediation:
    remediation_step: |
      Configure CSRF filter in envoy.yaml:
      
      http_filters:
      - name: envoy.filters.http.csrf
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.http.csrf.v3.CsrfPolicy
          filter_enabled:
            runtime_key: csrf_filter_enabled
            default_value:
              numerator: 100
              denominator: HUNDRED
          shadow_enabled:
            runtime_key: csrf_shadow_enabled
            default_value:
              numerator: 0
              denominator: HUNDRED
      
      Ensure your application:
      1. Sets CSRF tokens in responses
      2. Validates tokens in requests
      3. Uses SameSite cookie attribute
      
      Restart Envoy: systemctl restart envoy
    rollback_supported: true
    reboot_required: false
    service_impact: Requests without valid CSRF tokens will be rejected
    estimated_time: 30 seconds
  context:
    rationale: CSRF protection prevents unauthorized actions from being performed
      on behalf of authenticated users by malicious websites.
    impact: Requires application to support CSRF tokens
    false_positive_risk: Medium
    references:
    - type: Envoy CSRF Filter
      reference: https://www.envoyproxy.io/docs/envoy/latest/configuration/http/http_filters/csrf_filter
  tags:
  - envoy
  - csrf
  - application-security
  - web-security

- rule_id: ENVOY-CORS-001
  legacy_ids: []
  rule_name: Configure CORS policy
  rule_description: |
    Configure Cross-Origin Resource Sharing (CORS) policy to restrict cross-origin requests appropriately.
  category: Application Security
  subcategory: CORS
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |
      Check CORS configuration:
      
      grep -A20 "cors" /etc/envoy/envoy.yaml
      
      Verify:
      1. CORS is configured if cross-origin access is needed
      2. Allowed origins are explicitly specified (not "*")
      3. Allowed methods and headers are restricted
      
      If CORS is overly permissive, this is a finding.
    check_command: 'grep -E "cors" /etc/envoy/envoy.yaml || echo "CORS not configured"'
    expected_value: CORS configured with appropriate restrictions
  remediation:
    remediation_step: |
      Configure CORS in envoy.yaml:
      
      http_filters:
      - name: envoy.filters.http.cors
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
      
      route_config:
        virtual_hosts:
        - name: backend
          domains: ["*"]
          routes:
          - match: {prefix: "/api"}
            route: {cluster: backend_service}
          cors:
            allow_origin_string_match:
            - exact: "https://app.example.com"
            - exact: "https://admin.example.com"
            allow_methods: "GET, POST, PUT, DELETE, OPTIONS"
            allow_headers: "content-type, authorization, x-request-id"
            expose_headers: "x-custom-header"
            max_age: "86400"
            allow_credentials: true
      
      Avoid using "*" for allow_origin_string_match in production.
      
      Restart Envoy: systemctl restart envoy
    rollback_supported: true
    reboot_required: false
    service_impact: Cross-origin requests restricted to allowed origins
    estimated_time: 30 seconds
  context:
    rationale: Properly configured CORS prevents unauthorized cross-origin access
      while allowing legitimate cross-origin requests.
    impact: Cross-origin requests from unauthorized origins will be blocked
    false_positive_risk: Low
    references:
    - type: Envoy CORS Filter
      reference: https://www.envoyproxy.io/docs/envoy/latest/configuration/http/http_filters/cors_filter
  tags:
  - envoy
  - cors
  - application-security
  - web-security

- rule_id: ENVOY-COMPRESSION-001
  legacy_ids: []
  rule_name: Configure compression securely
  rule_description: |
    Configure compression filters securely to prevent compression-based attacks (BREACH, CRIME).
  category: Performance
  subcategory: Compression
  testing_status: untested
  assessment:
    severity: Low
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |
      Check compression configuration:
      
      grep -A20 "compressor\|gzip" /etc/envoy/envoy.yaml
      
      Verify:
      1. Compression is not applied to responses containing sensitive data
      2. Compression level is appropriate
      3. Minimum content length threshold is set
      
      If compression is applied to sensitive content without consideration, this may
      be a finding.
    check_command: 'grep -E "compressor|gzip" /etc/envoy/envoy.yaml || echo "Compression
      not configured"'
    expected_value: Compression configured securely
  remediation:
    remediation_step: |
      Configure compression securely in envoy.yaml:
      
      http_filters:
      - name: envoy.filters.http.compressor
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.http.compressor.v3.Compressor
          response_direction_config:
            common_config:
              min_content_length: 1024
              content_type:
              - text/html
              - application/json
              - text/css
              - application/javascript
            compressor:
              compressor_library:
                name: zlib
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.compression.gzip.compressor.v3.Gzip
                  compression_level: BEST_SPEED
                  compression_strategy: DEFAULT_STRATEGY
            disable_on_etag_header: true
      
      Note: Avoid compressing responses with:
      1. CSRF tokens
      2. Session IDs
      3. Authentication tokens
      4. Other sensitive data that could be leaked via compression attacks
      
      Restart Envoy: systemctl restart envoy
    rollback_supported: true
    reboot_required: false
    service_impact: Responses below threshold not compressed
    estimated_time: 30 seconds
  context:
    rationale: Compression attacks (BREACH, CRIME) can extract secrets from compressed
      responses. Proper configuration minimizes risk.
    impact: Smaller responses may not be compressed
    false_positive_risk: Low
    references:
    - type: Envoy Compressor Filter
      reference: https://www.envoyproxy.io/docs/envoy/latest/configuration/http/http_filters/compressor_filter
  tags:
  - envoy
  - compression
  - performance
  - security
