      reference: https://www.envoyproxy.io/docs/envoy/latest/configuration/best_practices/edge
    - type: Envoy Header Sanitizing
      reference: https://www.envoyproxy.io/docs/envoy/latest/configuration/http/http_conn_man/header_sanitizing
