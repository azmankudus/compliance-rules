- rule_id: ENVOY-RATE-001
  legacy_ids: []
  rule_name: Configure rate limiting
  rule_description: |
    Configure rate limiting to protect backend services from abuse and denial-of-service attacks.
  category: Network Security
  subcategory: Rate Limiting
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |
      Check rate limiting configuration:
      
      grep -A20 "rate_limit\|local_rate_limit\|ratelimit" /etc/envoy/envoy.yaml
      
      Verify:
      1. Rate limiting is configured (local or external)
      2. Appropriate limits are set for your environment
      3. Rate limit responses are appropriate
      
      If rate limiting is not configured, this is a finding.
    check_command: 'grep -E "rate_limit|ratelimit" /etc/envoy/envoy.yaml || echo
      "Rate limiting not configured"'
    expected_value: Rate limiting configured
  remediation:
    remediation_step: |
      Configure local rate limiting in envoy.yaml:
      
      http_filters:
      - name: envoy.filters.http.local_ratelimit
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
          stat_prefix: http_local_rate_limiter
          token_bucket:
            max_tokens: 100
            tokens_per_fill: 100
            fill_interval: 1s
          filter_enabled:
            runtime_key: local_rate_limit_enabled
            default_value:
              numerator: 100
              denominator: HUNDRED
          filter_enforced:
            runtime_key: local_rate_limit_enforced
            default_value:
              numerator: 100
              denominator: HUNDRED
          response_headers_to_add:
          - header:
              key: x-rate-limited
              value: "true"
          local_rate_limit_per_downstream_connection_quota_factor:
            numerator: 100
            denominator: HUNDRED
      
      For external rate limiting service:
      
      http_filters:
      - name: envoy.filters.http.ratelimit
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.http.ratelimit.v3.RateLimit
          domain: envoy
          failure_mode_deny: true
          rate_limit_service:
            grpc_service:
              envoy_grpc:
                cluster_name: rate_limit_cluster
      
      Restart Envoy: systemctl restart envoy
    rollback_supported: true
    reboot_required: false
    service_impact: Excessive requests will be rate limited (HTTP 429)
    estimated_time: 30 seconds
  context:
    rationale: Rate limiting protects backend services from abuse, brute force attacks,
      and denial-of-service attacks by limiting request rates.
    impact: Legitimate high-frequency requests may be throttled
    false_positive_risk: Low
    references:
    - type: Envoy Rate Limiting
      reference: https://www.envoyproxy.io/docs/envoy/latest/intro/arch_overview/other_features/global_rate_limiting
  tags:
  - envoy
  - rate-limiting
  - dos-protection
  - throttling

- rule_id: ENVOY-RBAC-001
  legacy_ids: []
  rule_name: Configure RBAC for access control
  rule_description: |
    Configure Role-Based Access Control (RBAC) to restrict access to services based on user identity, permissions, or other attributes.
  category: Access Control
  subcategory: RBAC
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |
      Check RBAC configuration:
      
      grep -A30 "rbac\|role_based_access_control" /etc/envoy/envoy.yaml
      
      Verify:
      1. RBAC filter is configured if access control is required
      2. Policies are defined for allowed/denied access
      3. Default action is appropriate (deny by default recommended)
      
      If RBAC is required but not configured, this is a finding.
    check_command: 'grep -E "rbac" /etc/envoy/envoy.yaml || echo "RBAC not configured"'
    expected_value: RBAC configured if access control is required
  remediation:
    remediation_step: |
      Configure RBAC in envoy.yaml:
      
      http_filters:
      - name: envoy.filters.http.rbac
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
          rules:
            action: ALLOW
            policies:
              "public-access":
                permissions:
                - header: {name: ":path", prefix_match: "/api/public/"}
                principals:
                - any: true
              "admin-access":
                permissions:
                - any: true
                principals:
                - authenticated:
                    principal_name:
                      safe_regex:
                        google_re2: {}
                        regex: "admin@.*\\.example\\.com"
              "service-account":
                permissions:
                - any: true
                principals:
                - header:
                    name: x-service-account
                    string_match:
                      exact: "trusted-service"
      
      Restart Envoy: systemctl restart envoy
    rollback_supported: true
    reboot_required: false
    service_impact: Unauthorized requests will be denied (HTTP 403)
    estimated_time: 30 seconds
  context:
    rationale: RBAC provides fine-grained access control, ensuring only authorized
      users and services can access protected resources.
    impact: Access will be restricted based on RBAC policies
    false_positive_risk: Medium
    references:
    - type: Envoy RBAC Documentation
      reference: https://www.envoyproxy.io/docs/envoy/latest/intro/arch_overview/security/rbac_filter
  tags:
  - envoy
  - rbac
  - access-control
  - authorization

- rule_id: ENVOY-EXTAUTH-001
  legacy_ids: []
  rule_name: Configure external authorization
  rule_description: |
    Configure external authorization (ext_authz) for centralized policy enforcement and authentication.
  category: Access Control
  subcategory: External Auth
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |
      Check external authorization configuration:
      
      grep -A30 "ext_authz\|external_authorization" /etc/envoy/envoy.yaml
      
      Verify:
      1. ext_authz filter is configured if centralized auth is required
      2. Authorization service endpoint is specified
      3. failure_mode_allow is set appropriately (false recommended)
      4. Timeout is configured
      
      If external auth is required but not configured, this is a finding.
    check_command: 'grep -E "ext_authz" /etc/envoy/envoy.yaml || echo "External auth
      not configured"'
    expected_value: External auth configured if centralized authorization is required
  remediation:
    remediation_step: |
      Configure external authorization in envoy.yaml:
      
      http_filters:
      - name: envoy.filters.http.ext_authz
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
          transport_api_version: V3
          grpc_service:
            envoy_grpc:
              cluster_name: ext_authz_cluster
            timeout: 0.5s
          clear_route_cache: true
          failure_mode_allow: false
          include_peer_certificate: true
          status_on_error:
            code: "ServiceUnavailable"
      
      Define the authorization service cluster:
      
      clusters:
      - name: ext_authz_cluster
        type: STRICT_DNS
        connect_timeout: 0.5s
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: ext_authz_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: authz-server
                    port_value: 9000
      
      Restart Envoy: systemctl restart envoy
    rollback_supported: true
    reboot_required: false
    service_impact: All requests go through authorization service; auth service availability
      affects all traffic
    estimated_time: 30 seconds
  context:
    rationale: External authorization enables centralized policy enforcement, allowing
      consistent authentication and authorization across all services.
    impact: Auth service must be highly available; auth failures will block requests
    false_positive_risk: Low
    references:
    - type: Envoy External Auth Documentation
      reference: https://www.envoyproxy.io/docs/envoy/latest/intro/arch_overview/security/ext_authz_filter
  tags:
  - envoy
  - ext-authz
  - authorization
  - access-control
  - authentication

- rule_id: ENVOY-JWT-001
  legacy_ids: []
  rule_name: Configure JWT authentication
  rule_description: |
    Configure JWT authentication filter to validate JSON Web Tokens for API authentication.
  category: Authentication
  subcategory: JWT
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |
      Check JWT authentication configuration:
      
      grep -A30 "jwt_authn\|jwt_auth" /etc/envoy/envoy.yaml
      
      Verify:
      1. JWT filter is configured if JWT authentication is required
      2. JWT issuers and audiences are properly configured
      3. Token validation is enabled (signature, expiration, etc.)
      4. JWKS endpoint or public keys are configured
      
      If JWT authentication is required but not configured, this is a finding.
    check_command: 'grep -E "jwt_authn" /etc/envoy/envoy.yaml || echo "JWT authentication
      not configured"'
    expected_value: JWT authentication configured if token-based auth is required
  remediation:
    remediation_step: |
      Configure JWT authentication in envoy.yaml:
      
      http_filters:
      - name: envoy.filters.http.jwt_authn
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
          providers:
            provider1:
              issuer: https://issuer.example.com
              audiences:
              - audience1
              - audience2
              remote_jwks:
                http_uri:
                  uri: https://issuer.example.com/.well-known/jwks.json
                  cluster: jwks_cluster
                  timeout: 5s
                cache_duration: 300s
              forward_payload_header: x-jwt-payload
          rules:
          - match:
              prefix: /api/
            requires:
              provider_name: provider1
      
      Define JWKS cluster:
      
      clusters:
      - name: jwks_cluster
        type: STRICT_DNS
        connect_timeout: 5s
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: jwks_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: issuer.example.com
                    port_value: 443
        transport_socket:
          name: envoy.transport_sockets.tls
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
            sni: issuer.example.com
      
      Restart Envoy: systemctl restart envoy
    rollback_supported: true
    reboot_required: false
    service_impact: Requests without valid JWTs will be rejected
    estimated_time: 30 seconds
  context:
    rationale: JWT authentication provides secure, stateless authentication for APIs
      and microservices using industry-standard tokens.
    impact: All protected endpoints require valid JWT tokens
    false_positive_risk: Low
    references:
    - type: Envoy JWT Documentation
      reference: https://www.envoyproxy.io/docs/envoy/latest/intro/arch_overview/security/jwt_authn_filter
  tags:
  - envoy
  - jwt
  - authentication
  - api-security
  - tokens

- rule_id: ENVOY-OVERLOAD-001
  legacy_ids: []
  rule_name: Configure overload manager
  rule_description: |
    Configure the overload manager to protect Envoy from resource exhaustion and maintain availability under load.
  category: Resource Management
  subcategory: Overload Protection
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |
      Check overload manager configuration:
      
      grep -A30 "overload_manager" /etc/envoy/envoy.yaml
      
      Verify:
      1. overload_manager is configured
      2. Resource monitors are defined (heap, CPU, connections)
      3. Actions are configured (shrink_heap, stop_accepting_requests)
      4. Thresholds are appropriate for your system
      
      If overload manager is not configured, this is a finding.
    check_command: 'grep -E "overload_manager" /etc/envoy/envoy.yaml || echo "Overload
      manager not configured"'
    expected_value: Overload manager configured with appropriate resource monitors
  remediation:
    remediation_step: |
      Configure overload manager in envoy.yaml:
      
      overload_manager:
        refresh_interval: 0.25s
        resource_monitors:
        - name: envoy.resource_monitors.fixed_heap
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.resource_monitors.fixed_heap.v3.FixedHeapConfig
            max_heap_size_bytes: 2147483648
        - name: envoy.resource_monitors.global_downstream_max_connections
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.resource_monitors.downstream_connections.v3.DownstreamConnectionsConfig
            max_active_downstream_connections: 50000
        actions:
        - name: envoy.overload_actions.shrink_heap
          triggers:
          - name: envoy.resource_monitors.fixed_heap
            threshold:
              value: 0.95
        - name: envoy.overload_actions.stop_accepting_requests
          triggers:
          - name: envoy.resource_monitors.fixed_heap
            threshold:
              value: 0.98
      
      Adjust max_heap_size_bytes based on your system memory.
      
      Restart Envoy: systemctl restart envoy
    rollback_supported: true
    reboot_required: false
    service_impact: Under overload, new requests may be rejected to maintain stability
    estimated_time: 30 seconds
  context:
    rationale: Overload manager protects Envoy from resource exhaustion by monitoring
      system resources and taking corrective action before failure.
    impact: Under heavy load, some requests may be rejected to maintain overall system
      stability
    false_positive_risk: Low
    references:
    - type: Envoy Overload Manager
      reference: https://www.envoyproxy.io/docs/envoy/latest/configuration/operations/overload_manager/overload_manager
  tags:
  - envoy
  - overload-manager
  - resource-management
  - dos-protection
  - availability

- rule_id: ENVOY-HEALTH-001
  legacy_ids: []
  rule_name: Configure health checks securely
  rule_description: |
    Configure health checks to prevent information disclosure and restrict access to health check endpoints.
  category: Configuration
  subcategory: Health Checks
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |
      Check health check configuration:
      
      grep -A20 "health_check" /etc/envoy/envoy.yaml
      
      Verify:
      1. Health check endpoints are not publicly exposed
      2. Health checks use appropriate paths
      3. Sensitive information is not exposed in health responses
      4. Health check filter is configured with appropriate access controls
      
      If health checks expose sensitive information or are publicly accessible, this is a finding.
    check_command: 'grep -E "health_check" /etc/envoy/envoy.yaml || echo "Health
      checks not configured"'
    expected_value: Health checks configured securely
  remediation:
    remediation_step: |
      Configure secure health checks in envoy.yaml:
      
      For upstream cluster health checks:
      
      clusters:
      - name: backend_service
        health_checks:
        - timeout: 5s
          interval: 10s
          unhealthy_threshold: 3
          healthy_threshold: 1
          http_health_check:
            path: "/healthz"
            expected_statuses:
            - start: 200
              end: 200
      
      For health check filter with access control:
      
      http_filters:
      - name: envoy.filters.http.health_check
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.http.health_check.v3.HealthCheck
          pass_through_mode: false
          headers:
          - name: ":path"
            string_match:
              exact: "/healthz"
      
      Restrict health check endpoint access using RBAC:
      
      http_filters:
      - name: envoy.filters.http.rbac
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
          rules:
            action: ALLOW
            policies:
              "health-check":
                permissions:
                - header: {name: ":path", exact_match: "/healthz"}
                principals:
                - source_ips:
                    address_prefix: "127.0.0.1"
                    prefix_len: 32
      
      Restart Envoy: systemctl restart envoy
    rollback_supported: true
    reboot_required: false
    service_impact: Health checks restricted to authorized sources
    estimated_time: 30 seconds
  context:
    rationale: Secure health checks prevent information disclosure and ensure only
      authorized systems can query health status.
    impact: Health check access may be restricted
    false_positive_risk: Low
    references:
    - type: Envoy Health Check
      reference: https://www.envoyproxy.io/docs/envoy/latest/intro/arch_overview/upstream/health_checking
  tags:
  - envoy
  - health-check
  - security
  - availability

- rule_id: ENVOY-HTTP-001
  legacy_ids: []
  rule_name: Configure HTTP/2 security settings
  rule_description: |
    Configure HTTP/2 protocol options to prevent resource exhaustion attacks specific to HTTP/2.
  category: Network Security
  subcategory: HTTP/2 Security
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |
      Check HTTP/2 configuration:
      
      grep -A20 "http2_protocol_options" /etc/envoy/envoy.yaml
      
      Verify:
      1. max_concurrent_streams is limited (recommended: 100)
      2. initial_stream_window_size is limited (recommended: 64 KiB)
      3. initial_connection_window_size is limited (recommended: 1 MiB)
      
      If HTTP/2 options are not configured, this is a finding.
    check_command: 'grep -E "http2_protocol_options" /etc/envoy/envoy.yaml || echo
      "HTTP/2 options not configured"'
    expected_value: HTTP/2 options configured with appropriate limits
  remediation:
    remediation_step: |
      Configure HTTP/2 options in envoy.yaml:
      
      For HTTP connection manager:
      
      http_filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          http2_protocol_options:
            max_concurrent_streams: 100
            initial_stream_window_size: 65536
            initial_connection_window_size: 1048576
      
      For upstream clusters:
      
      clusters:
      - name: backend_service
        typed_extension_protocol_options:
          envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
            "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
            explicit_http_config:
              http2_protocol_options:
                max_concurrent_streams: 100
                initial_stream_window_size: 65536
                initial_connection_window_size: 1048576
      
      Restart Envoy: systemctl restart envoy
    rollback_supported: true
    reboot_required: false
    service_impact: Limits HTTP/2 stream concurrency
    estimated_time: 30 seconds
  context:
    rationale: HTTP/2 has different attack vectors than HTTP/1.1. Limiting concurrent
      streams and window sizes prevents resource exhaustion attacks.
    impact: May limit performance for HTTP/2-heavy workloads
    false_positive_risk: Low
    references:
    - type: Envoy Best Practices
      reference: https://www.envoyproxy.io/docs/envoy/latest/configuration/best_practices/edge
  tags:
  - envoy
  - http2
  - security
  - dos-protection

- rule_id: ENVOY-HTTP-002
  legacy_ids: []
  rule_name: Enable path normalization
  rule_description: |
    Enable path normalization to prevent path confusion vulnerabilities and directory traversal attacks.
  category: Application Security
  subcategory: Path Security
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |
      Check path normalization configuration:
      
      grep -E "normalize_path|merge_slashes|path_with_escaped_slashes_action" /etc/envoy/envoy.yaml
      
      Verify:
      1. normalize_path is set to true
      2. merge_slashes is set to true
      3. path_with_escaped_slashes_action is configured appropriately
      
      If path normalization is not configured, this is a finding.
    check_command: 'grep -E "normalize_path|merge_slashes" /etc/envoy/envoy.yaml ||
      echo "Path normalization not configured"'
    expected_value: Path normalization enabled
  remediation:
    remediation_step: |
      Configure path normalization in envoy.yaml:
      
      http_filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          normalize_path: true
          merge_slashes: true
          path_with_escaped_slashes_action: UNESCAPE_AND_REDIRECT
      
      Options for path_with_escaped_slashes_action:
      - REJECT_REQUEST: For RFC 3986 compliant clients (e.g., gRPC)
      - UNESCAPE_AND_REDIRECT: For browsers that support redirects
      - KEEP_UNCHANGED: For non-RFC compliant servers
      - UNESCAPE_AND_FORWARD: For servers that treat escaped/unescaped slashes equivalently
      
      Restart Envoy: systemctl restart envoy
    rollback_supported: true
    reboot_required: false
    service_impact: Requests with unusual path encoding may be redirected or rejected
    estimated_time: 30 seconds
  context:
    rationale: Path normalization prevents path confusion vulnerabilities where different
      parties interpret paths differently, potentially bypassing access controls.
    impact: May affect applications that rely on specific path encoding
    false_positive_risk: Medium
    references:
    - type: Envoy Best Practices
      reference: https://www.envoyproxy.io/docs/envoy/latest/configuration/best_practices/edge
  tags:
  - envoy
  - path-normalization
  - security
  - application-security

- rule_id: ENVOY-HTTP-003
  legacy_ids: []
  rule_name: Configure header security settings
  rule_description: |
    Configure header security settings to prevent header injection and handle malformed headers appropriately.
  category: Application Security
  subcategory: Header Security
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: |
      Check header security configuration:
      
      grep -E "headers_with_underscores_action|use_remote_address" /etc/envoy/envoy.yaml
      
      Verify:
      1. headers_with_underscores_action is set to REJECT_REQUEST
      2. use_remote_address is set to true for edge proxies
      
      If header security settings are not configured, this is a finding.
    check_command: 'grep -E "headers_with_underscores|use_remote_address" /etc/envoy/envoy.yaml
      || echo "Header security not configured"'
    expected_value: Header security settings configured
  remediation:
    remediation_step: |
      Configure header security in envoy.yaml:
      
      http_filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          use_remote_address: true
          common_http_protocol_options:
            headers_with_underscores_action: REJECT_REQUEST
          xff_num_trusted_hops: 0
      
      The headers_with_underscores_action protects upstream services that treat '_'
      and '-' as interchangeable.
      
      use_remote_address ensures external client headers are not trusted.
      
      Restart Envoy: systemctl restart envoy
    rollback_supported: true
    reboot_required: false
    service_impact: Requests with underscore headers will be rejected
    estimated_time: 30 seconds
  context:
    rationale: Header security settings prevent header injection attacks and ensure
