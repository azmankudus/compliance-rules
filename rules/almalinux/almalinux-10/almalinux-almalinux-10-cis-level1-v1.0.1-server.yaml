- rule_id: CIS-2
  rule_name: Ensure cramfs kernel module is not available
  rule_description: 'CIS Benchmark control 1.1.1.1: Ensure cramfs kernel module is
    not available (Automated)'
  category: Filesystem
  subcategory: General
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: Verify Ensure cramfs kernel module is not available (Automated)
    check_command: modprobe -n -v cramfs | grep -E '(install /bin/true|not found)'
  remediation:
    remediation_step: 'Create or edit /etc/modprobe.d/cramfs.conf with: install cramfs
      /bin/true'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 5 minutes
  tags:
