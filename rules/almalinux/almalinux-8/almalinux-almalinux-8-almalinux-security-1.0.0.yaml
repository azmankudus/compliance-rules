    automation_level: Full
    audit_type: config
    detection_step: 'Check AuditBackend setting: grep AuditBackend /etc/usbguard/usbguard-daemon.conf'
  remediation:
    remediation_step: '1. Edit /etc/usbguard/usbguard-daemon.conf

      2. Change: AuditBackend=LinuxAudit

      3. Restart: systemctl restart usbguard

      4. Verify: ausearch -ts recent -m USER_DEVICE'
