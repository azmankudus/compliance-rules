- rule_id: ALMSEC-45
  rule_name: Configure USBGuard Device Authorization Policy
  rule_description: Configure USBGuard policy to control which USB devices are allowed
    to interact with the system. Create custom rules based on device ID, serial number,
    or interface type.
  category: USB Device Protection - USBGuard
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'List current USBGuard rules: usbguard list-rules'
  remediation:
    remediation_step: '1. Generate policy without hashes: usbguard generate-policy
      --no-hashes > ./rules.conf

      2. Edit rules.conf to customize policy

      3. Install policy: install -m 0600 -o root -g root rules.conf /etc/usbguard/rules.conf

      4. Restart: systemctl restart usbguard'
  tags:
  - rhel8
  - security
  - usb-device-protection---usbguard
  id: ALMSEC-45
  title: Configure USBGuard Device Authorization Policy
  description: Configure USBGuard policy to control which USB devices are allowed
