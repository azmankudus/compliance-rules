- rule_id: ALMSEC-38
  rule_name: Configure Persistent Audit Rules
  rule_description: Define persistent Audit rules that survive reboots by placing
    them in /etc/audit/rules.d/ directory. Rules can monitor file access, system calls,
    and command execution.
  category: System Auditing - Rules
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'List current rules: auditctl -l'
  remediation:
    remediation_step: 'Create rules in /etc/audit/rules.d/:

      - Monitor file access: -w /etc/passwd -p wa -k passwd_changes

      - Monitor system calls: -a always,exit -F arch=b64 -S adjtimex -S settimeofday
      -k time_change

      - Load rules: augenrules --load'
  tags:
  - rhel8
  - security
  - system-auditing---rules
