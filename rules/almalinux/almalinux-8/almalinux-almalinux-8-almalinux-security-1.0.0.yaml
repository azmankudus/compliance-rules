  severity: High
- rule_id: ALMSEC-46
  rule_name: Permanently Block or Authorize USB Devices
  rule_description: Permanently authorize or block specific USB devices using USBGuard.
    Use -p option to add device-specific rules to the current policy.
  category: USB Device Protection - USBGuard
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'List USB devices: usbguard list-devices'
  remediation:
    remediation_step: 'Authorize device permanently: usbguard allow-device <ID> -p

      Block device permanently: usbguard block-device <ID> -p

      Reject device permanently: usbguard reject-device <ID> -p'
  tags:
