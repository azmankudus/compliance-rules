$metadata:
  name: AlmaLinux 8 Security Hardening
  version: 1.0.0
  description: Security hardening rules from official Red Hat AlmaLinux 8 Security
    Hardening Guide
  platform: AlmaLinux 8
  benchmark: Red Hat AlmaLinux 8 Security Hardening Guide
  author: Red Hat
  created: '2026-03-13T00:00:00Z'
  modified: '2026-03-13T00:00:00Z'
  compatible_platforms:
  - AlmaLinux 8.x
  references:
  - type: Official Documentation
    reference: https://access.almalinux.com/documentation/en-us/red_hat_enterprise_linux/8/html/security_hardening
compliance_info:
  framework: NIST
  version: 1.0.0
  profile: Production
rules:
- rule_id: ALMSEC-1
  rule_name: Separate Disk Partition for /boot
  rule_description: Create a separate partition for /boot directory. This partition
    is the first partition read during boot up and contains the boot loader and kernel
    images. This partition should not be encrypted. If included in / and that partition
    is encrypted or becomes unavailable, the system cannot boot.
  category: Installation Security - Disk Partitioning
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check if /boot is a separate partition: lsblk -f | grep boot
      || df -h | grep /boot'
  remediation:
    remediation_step: During installation, create a separate partition for /boot.
      For existing systems, this requires re-partitioning and reinstallation.
  tags:
  - rhel8
  - security
  - installation-security---disk-partitioning
  id: ALMSEC-1
  title: Separate Disk Partition for /boot
  description: Create a separate partition for /boot directory. This partition is
    the first partition read during boot up and contains the boot loader and kernel
    images. This partition should not be encrypted. If included in / and that partition
    is encrypted or becomes unavailable, the system cannot boot.
  severity: High
- rule_id: ALMSEC-2
  rule_name: Separate Disk Partition for /home
  rule_description: Create a separate partition for /home directory. When user data
    is stored in / instead of a separate partition, the partition can fill up causing
    the operating system to become unstable. A separate partition also makes system
    upgrades easier and provides protection against data loss if the root partition
    becomes corrupt.
  category: Installation Security - Disk Partitioning
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check if /home is a separate partition: lsblk -f | grep home
      || df -h | grep /home'
  remediation:
    remediation_step: During installation, create a separate partition for /home.
      For existing systems, backup data, create new partition, migrate data, and update
      /etc/fstab.
  tags:
  - rhel8
  - security
  - installation-security---disk-partitioning
  id: ALMSEC-2
  title: Separate Disk Partition for /home
  description: Create a separate partition for /home directory. When user data is
    stored in / instead of a separate partition, the partition can fill up causing
    the operating system to become unstable. A separate partition also makes system
    upgrades easier and provides protection against data loss if the root partition
    becomes corrupt.
  severity: Medium
- rule_id: ALMSEC-3
  rule_name: Separate Disk Partitions for /tmp and /var/tmp
  rule_description: Create separate partitions for /tmp and /var/tmp directories.
    These directories store temporary data that does not need long-term storage. If
    flooded with data while stored within /, the system could become unstable and
    crash. Separate partitions prevent this from affecting the root filesystem.
  category: Installation Security - Disk Partitioning
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check if /tmp and /var/tmp are separate partitions: lsblk -f
      | grep -E ''tmp|var'' || df -h | grep -E ''/tmp|/var/tmp'''
  remediation:
    remediation_step: During installation, create separate partitions for /tmp and
      /var/tmp. For existing systems, use systemd tmp.mount or create separate logical
      volumes.
  tags:
  - rhel8
  - security
  - installation-security---disk-partitioning
  id: ALMSEC-3
  title: Separate Disk Partitions for /tmp and /var/tmp
  description: Create separate partitions for /tmp and /var/tmp directories. These
    directories store temporary data that does not need long-term storage. If flooded
    with data while stored within /, the system could become unstable and crash. Separate
    partitions prevent this from affecting the root filesystem.
  severity: Medium
- rule_id: ALMSEC-4
  rule_name: Restrict Network Connectivity During Installation
  rule_description: Limit network exposure during installation to only the closest
    necessary network zone. The installation medium may not have the latest security
    fixes and could be vulnerable. The safest choice is no network connection, followed
    by LAN/intranet, with Internet connection being the riskiest.
  category: Installation Security - Network
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Review installation logs to verify minimal network connectivity
      was used during installation: cat /var/log/anaconda/journal.log | grep -i network'
  remediation:
    remediation_step: During installation, disconnect from network or use the closest
      network zone (LAN/intranet instead of Internet) when installing from network
      repositories.
  tags:
  - rhel8
  - security
  - installation-security---network
  id: ALMSEC-4
  title: Restrict Network Connectivity During Installation
  description: Limit network exposure during installation to only the closest necessary
    network zone. The installation medium may not have the latest security fixes and
    could be vulnerable. The safest choice is no network connection, followed by LAN/intranet,
    with Internet connection being the riskiest.
  severity: Medium
- rule_id: ALMSEC-5
  rule_name: Install Minimum Required Packages
  rule_description: Install only the packages that will be used. Each piece of software
    could contain vulnerabilities. Installing minimal packages reduces the attack
    surface and potential vulnerability exposure.
  category: Installation Security - Package Management
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'List installed packages to review: rpm -qa | wc -l && rpm -qa'
  remediation:
    remediation_step: 'During installation, select minimal install or custom package
      selection. After installation, remove unused packages: yum remove <package-name>'
  tags:
  - rhel8
  - security
  - installation-security---package-management
  id: ALMSEC-5
  title: Install Minimum Required Packages
  description: Install only the packages that will be used. Each piece of software
    could contain vulnerabilities. Installing minimal packages reduces the attack
    surface and potential vulnerability exposure.
  severity: Medium
- rule_id: ALMSEC-6
  rule_name: Update System After Installation
  rule_description: Update the system immediately after installation to ensure all
    packages have the latest security fixes. The installation medium may be outdated
    and contain known vulnerabilities.
  category: Installation Security - Post-Installation
  testing_status: untested
  assessment:
    severity: Critical
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check for available updates: yum check-update'
  remediation:
    remediation_step: 'Run system update: yum update'
  tags:
  - rhel8
  - security
  - installation-security---post-installation
  id: ALMSEC-6
  title: Update System After Installation
  description: Update the system immediately after installation to ensure all packages
    have the latest security fixes. The installation medium may be outdated and contain
    known vulnerabilities.
  severity: Critical
- rule_id: ALMSEC-7
  rule_name: Enable Firewall Service
  rule_description: Ensure the firewall service (firewalld) is enabled and running.
    Although firewalld is automatically enabled with AlmaLinux installation, it might
    be explicitly disabled in some configurations like Kickstart.
  category: Installation Security - Post-Installation
  testing_status: untested
  assessment:
    severity: Critical
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check firewall status: systemctl status firewalld'
  remediation:
    remediation_step: 'Enable and start firewall: systemctl enable firewalld && systemctl
      start firewalld'
  tags:
  - rhel8
  - security
  - installation-security---post-installation
  id: ALMSEC-7
  title: Enable Firewall Service
  description: Ensure the firewall service (firewalld) is enabled and running. Although
    firewalld is automatically enabled with AlmaLinux installation, it might be explicitly
    disabled in some configurations like Kickstart.
  severity: Critical
- rule_id: ALMSEC-8
  rule_name: Disable Unnecessary Services
  rule_description: Disable services that are not needed to reduce attack surface.
    For example, if no printers are installed, disable the cups service.
  category: Installation Security - Post-Installation
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Review active services: systemctl list-units --type=service --state=running'
  remediation:
    remediation_step: 'Disable unnecessary services: systemctl disable <service-name>
      && systemctl stop <service-name>'
  tags:
  - rhel8
  - security
  - installation-security---post-installation
  id: ALMSEC-8
  title: Disable Unnecessary Services
  description: Disable services that are not needed to reduce attack surface. For
    example, if no printers are installed, disable the cups service.
  severity: Medium
- rule_id: ALMSEC-9
  rule_name: Disable SMT for CPU Security Mitigation
  rule_description: 'Disable Simultaneous Multi Threading (SMT) to mitigate security
    vulnerabilities such as L1TF or MDS that can misuse CPU SMT. Note: This may lower
    system performance.'
  category: Installation Security - CPU Security
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check SMT status: lscpu | grep -i thread'
  remediation:
    remediation_step: 'Add nosmt kernel parameter: grubby --update-kernel=ALL --args=''nosmt''
      && reboot'
  tags:
  - rhel8
  - security
  - installation-security---cpu-security
  id: ALMSEC-9
  title: Disable SMT for CPU Security Mitigation
  description: 'Disable Simultaneous Multi Threading (SMT) to mitigate security vulnerabilities
    such as L1TF or MDS that can misuse CPU SMT. Note: This may lower system performance.'
  severity: High
- rule_id: ALMSEC-10
  rule_name: Enable FIPS Mode During Installation
  rule_description: Enable FIPS mode during system installation to ensure the system
    generates all keys with FIPS-approved algorithms and continuous monitoring tests
    in place. This is the recommended method for FIPS compliance.
  category: FIPS Mode
  testing_status: untested
  assessment:
    severity: Critical
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check FIPS mode status: fips-mode-setup --check'
  remediation:
    remediation_step: During installation, add fips=1 to kernel command line. Do not
      install third-party software during software selection stage.
  tags:
  - rhel8
  - security
  - fips-mode
  id: ALMSEC-10
  title: Enable FIPS Mode During Installation
  description: Enable FIPS mode during system installation to ensure the system generates
    all keys with FIPS-approved algorithms and continuous monitoring tests in place.
    This is the recommended method for FIPS compliance.
  severity: Critical
- rule_id: ALMSEC-11
  rule_name: Switch System to FIPS Mode Post-Installation
  rule_description: 'Enable FIPS mode after installation using fips-mode-setup tool.
    This enables cryptographic module self-checks mandated by FIPS 140-2. Note: Enabling
    FIPS during installation is preferred for full compliance.'
  category: FIPS Mode
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check FIPS mode status: fips-mode-setup --check'
  remediation:
    remediation_step: 'Enable FIPS mode: fips-mode-setup --enable && reboot'
  tags:
  - rhel8
  - security
  - fips-mode
  id: ALMSEC-11
  title: Switch System to FIPS Mode Post-Installation
  description: 'Enable FIPS mode after installation using fips-mode-setup tool. This
    enables cryptographic module self-checks mandated by FIPS 140-2. Note: Enabling
    FIPS during installation is preferred for full compliance.'
  severity: High
- rule_id: ALMSEC-12
  rule_name: Enable FIPS Mode in Containers
  rule_description: Enable FIPS mode in containers by ensuring the host kernel is
    running in FIPS mode. On AlmaLinux 8.1/8.2, set FIPS policy in container. On AlmaLinux
    8.4+, podman automatically enables FIPS mode.
  category: FIPS Mode
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check if host is in FIPS mode: cat /proc/sys/crypto/fips_enabled'
  remediation:
    remediation_step: 'On AlmaLinux 8.1/8.2 containers: update-crypto-policies --set
      FIPS. Ensure host is in FIPS mode.'
  tags:
  - rhel8
  - security
  - fips-mode
  id: ALMSEC-12
  title: Enable FIPS Mode in Containers
  description: Enable FIPS mode in containers by ensuring the host kernel is running
    in FIPS mode. On AlmaLinux 8.1/8.2, set FIPS policy in container. On AlmaLinux
    8.4+, podman automatically enables FIPS mode.
  severity: High
- rule_id: ALMSEC-13
  rule_name: Configure System-Wide Cryptographic Policy
  rule_description: Set appropriate system-wide cryptographic policy (DEFAULT, LEGACY,
    FUTURE, or FIPS) to ensure applications use secure cryptographic algorithms. DEFAULT
    is recommended for current security standards.
  category: Cryptographic Policies
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check current policy: update-crypto-policies --show'
  remediation:
    remediation_step: 'Set cryptographic policy: update-crypto-policies --set <POLICY>
      && reboot (e.g., DEFAULT, FUTURE, FIPS)'
  tags:
  - rhel8
  - security
  - cryptographic-policies
  id: ALMSEC-13
  title: Configure System-Wide Cryptographic Policy
  description: Set appropriate system-wide cryptographic policy (DEFAULT, LEGACY,
    FUTURE, or FIPS) to ensure applications use secure cryptographic algorithms. DEFAULT
    is recommended for current security standards.
  severity: High
- rule_id: ALMSEC-14
  rule_name: Use FUTURE Cryptographic Policy for Enhanced Security
  rule_description: Use FUTURE policy for stricter forward-looking security. This
    policy does not allow SHA-1 in signatures, requires RSA/DH keys of at least 3072
    bits, and disables CBC mode ciphers. May cause interoperability issues.
  category: Cryptographic Policies
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check current policy: update-crypto-policies --show'
  remediation:
    remediation_step: 'Set FUTURE policy: update-crypto-policies --set FUTURE && reboot'
  tags:
  - rhel8
  - security
  - cryptographic-policies
  id: ALMSEC-14
  title: Use FUTURE Cryptographic Policy for Enhanced Security
  description: Use FUTURE policy for stricter forward-looking security. This policy
    does not allow SHA-1 in signatures, requires RSA/DH keys of at least 3072 bits,
    and disables CBC mode ciphers. May cause interoperability issues.
  severity: Medium
- rule_id: ALMSEC-15
  rule_name: Disable SHA-1 in Cryptographic Policy
  rule_description: Disable SHA-1 in digital signatures by using FUTURE or FIPS policy,
    or by customizing policy. SHA-1 is considered weak and should be avoided in security-sensitive
    contexts.
  category: Cryptographic Policies
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check if SHA-1 is enabled: update-crypto-policies --show | grep
      -i sha1 || cat /etc/crypto-policies/state/CURRENT.pol | grep -i sha1'
  remediation:
    remediation_step: 'Use FUTURE or FIPS policy, or create custom subpolicy: update-crypto-policies
      --set FUTURE:SHA1 or create NO-SHA1.pmod subpolicy'
  tags:
  - rhel8
  - security
  - cryptographic-policies
  id: ALMSEC-15
  title: Disable SHA-1 in Cryptographic Policy
  description: Disable SHA-1 in digital signatures by using FUTURE or FIPS policy,
    or by customizing policy. SHA-1 is considered weak and should be avoided in security-sensitive
    contexts.
  severity: High
- rule_id: ALMSEC-16
  rule_name: Configure SSH Keys on Smart Card
  rule_description: Configure SSH authentication using ECDSA or RSA keys stored on
    a smart card. This replaces password authentication with hardware-backed authentication
    for improved security.
  category: 'PKCS #11 - Smart Card Authentication'
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Verify opensc package is installed and pcscd service is running:
      rpm -q opensc && systemctl status pcscd'
  remediation:
    remediation_step: '1. Install opensc: yum install opensc

      2. List keys: ssh-keygen -D pkcs11: > keys.pub

      3. Transfer public key to server: ssh-copy-id -f -i keys.pub user@server

      4. Connect using smart card: ssh -i pkcs11: user@server'
  tags:
  - rhel8
  - security
  - pkcs-#11---smart-card-authentication
  id: ALMSEC-16
  title: Configure SSH Keys on Smart Card
  description: Configure SSH authentication using ECDSA or RSA keys stored on a smart
    card. This replaces password authentication with hardware-backed authentication
    for improved security.
  severity: Medium
- rule_id: ALMSEC-17
  rule_name: Configure Apache with HSM for Private Keys
  rule_description: Configure Apache HTTP server to work with private keys stored
    on Hardware Security Modules (HSMs). This prevents key disclosure and man-in-the-middle
    attacks. Requires high-performance HSMs for busy servers.
  category: 'PKCS #11 - HSM Configuration'
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check if openssl-pkcs11 is installed: rpm -q openssl-pkcs11'
  remediation:
    remediation_step: "1. Install openssl-pkcs11: yum install openssl-pkcs11\n2. Configure\
      \ /etc/httpd/conf.d/ssl.conf:\n   SSLCertificateFile \"pkcs11:id=%01;token=softhsm;type=cert\"\
      \n   SSLCertificateKeyFile \"pkcs11:id=%01;token=softhsm;type=private?pin-value=XXXX\"\
      \n3. Restart httpd: systemctl restart httpd"
  tags:
  - rhel8
  - security
  - pkcs-#11---hsm-configuration
  id: ALMSEC-17
  title: Configure Apache with HSM for Private Keys
  description: Configure Apache HTTP server to work with private keys stored on Hardware
    Security Modules (HSMs). This prevents key disclosure and man-in-the-middle attacks.
    Requires high-performance HSMs for busy servers.
  severity: High
- rule_id: ALMSEC-18
  rule_name: Configure Nginx with HSM for Private Keys
  rule_description: Configure Nginx HTTP server to work with private keys stored on
    Hardware Security Modules (HSMs). Nginx supports loading private keys from HSM
    while certificates are provided as regular files.
  category: 'PKCS #11 - HSM Configuration'
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check if openssl-pkcs11 is installed: rpm -q openssl-pkcs11'
  remediation:
    remediation_step: "1. Install openssl-pkcs11: yum install openssl-pkcs11\n2. Configure\
      \ /etc/nginx/nginx.conf:\n   ssl_certificate /path/to/cert.pem\n   ssl_certificate_key\
      \ \"engine:pkcs11:pkcs11:token=softhsm;id=%01;type=private?pin-value=XXXX\"\n\
      3. Restart nginx: systemctl restart nginx"
  tags:
  - rhel8
  - security
  - pkcs-#11---hsm-configuration
  id: ALMSEC-18
  title: Configure Nginx with HSM for Private Keys
  description: Configure Nginx HTTP server to work with private keys stored on Hardware
    Security Modules (HSMs). Nginx supports loading private keys from HSM while certificates
    are provided as regular files.
  severity: High
- rule_id: ALMSEC-19
  rule_name: Install and Configure SCAP Security Guide
  rule_description: Install the SCAP Security Guide (SSG) package which provides collections
    of security policies for Linux systems. The guidance includes practical hardening
    advice linked to government requirements.
  category: Compliance Scanning - Tools
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check if scap-security-guide is installed: rpm -q scap-security-guide'
  remediation:
    remediation_step: 'Install SCAP Security Guide: yum install scap-security-guide'
  tags:
  - rhel8
  - security
  - compliance-scanning---tools
  id: ALMSEC-19
  title: Install and Configure SCAP Security Guide
  description: Install the SCAP Security Guide (SSG) package which provides collections
    of security policies for Linux systems. The guidance includes practical hardening
    advice linked to government requirements.
  severity: Medium
- rule_id: ALMSEC-20
  rule_name: Scan System for Vulnerabilities Using OpenSCAP
  rule_description: Scan the local system for vulnerabilities using the oscap command-line
    utility and Red Hat Security Advisories OVAL feed. This identifies packages with
    known security issues.
  category: Compliance Scanning - Vulnerability Scanning
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Verify openscap-scanner is installed: rpm -q openscap-scanner'
  remediation:
    remediation_step: '1. Install scanner: yum install openscap-scanner bzip2

      2. Download OVAL definitions: wget -O - https://www.almalinux.com/security/data/oval/v2/AlmaLinux8/rhel-8.oval.xml.bz2
      | bzip2 --decompress > rhel-8.oval.xml

      3. Scan system: oscap oval eval --report vulnerability.html rhel-8.oval.xml'
  tags:
  - rhel8
  - security
  - compliance-scanning---vulnerability-scanning
  id: ALMSEC-20
  title: Scan System for Vulnerabilities Using OpenSCAP
  description: Scan the local system for vulnerabilities using the oscap command-line
    utility and Red Hat Security Advisories OVAL feed. This identifies packages with
    known security issues.
  severity: High
- rule_id: ALMSEC-21
  rule_name: Scan Remote Systems for Vulnerabilities
  rule_description: Scan remote systems for vulnerabilities using oscap-ssh tool over
    SSH protocol. This enables centralized vulnerability assessment of multiple systems.
  category: Compliance Scanning - Vulnerability Scanning
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Verify openscap-utils is installed: rpm -q openscap-utils'
  remediation:
    remediation_step: 'Scan remote system: oscap-ssh <username>@<hostname> <port>
      oval eval --report <scan-report.html> rhel-8.oval.xml'
  tags:
  - rhel8
  - security
  - compliance-scanning---vulnerability-scanning
  id: ALMSEC-21
  title: Scan Remote Systems for Vulnerabilities
  description: Scan remote systems for vulnerabilities using oscap-ssh tool over SSH
    protocol. This enables centralized vulnerability assessment of multiple systems.
  severity: Medium
- rule_id: ALMSEC-22
  rule_name: Assess Configuration Compliance with Security Baseline
  rule_description: Assess system compliance with specific security baselines (HIPAA,
    PCI-DSS, OSPP, etc.) using OpenSCAP. This determines whether the system conforms
    to a defined security policy.
  category: Compliance Scanning - Configuration Compliance
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'View available profiles: oscap info /usr/share/xml/scap/ssg/content/ssg-rhel8-ds.xml'
  remediation:
    remediation_step: 'Scan with specific profile: oscap xccdf eval --report <scan-report.html>
      --profile <profileID> /usr/share/xml/scap/ssg/content/ssg-rhel8-ds.xml'
  tags:
  - rhel8
  - security
  - compliance-scanning---configuration-compliance
  id: ALMSEC-22
  title: Assess Configuration Compliance with Security Baseline
  description: Assess system compliance with specific security baselines (HIPAA, PCI-DSS,
    OSPP, etc.) using OpenSCAP. This determines whether the system conforms to a defined
    security policy.
  severity: High
- rule_id: ALMSEC-23
  rule_name: Remediate System to Align with Security Baseline
  rule_description: Automatically remediate the system to align with a specific security
    baseline using OpenSCAP. This fixes configuration issues identified during compliance
    scans.
  category: Compliance Scanning - Remediation
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Perform compliance scan first: oscap xccdf eval --profile <profileID>
      --results <results.xml> /usr/share/xml/scap/ssg/content/ssg-rhel8-ds.xml'
  remediation:
    remediation_step: 'Run remediation: oscap xccdf eval --profile <profileID> --remediate
      /usr/share/xml/scap/ssg/content/ssg-rhel8-ds.xml && reboot'
  tags:
  - rhel8
  - security
  - compliance-scanning---remediation
  id: ALMSEC-23
