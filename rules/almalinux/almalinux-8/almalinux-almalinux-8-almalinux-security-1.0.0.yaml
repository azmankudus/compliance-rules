    detection_step: 'Check current LUKS2 configuration: cryptsetup luksDump /dev/<device>'
  remediation:
    remediation_step: 'Set resilience mode during re-encryption: cryptsetup reencrypt
      --resilience <checksum|journal|none> /dev/<device>'
