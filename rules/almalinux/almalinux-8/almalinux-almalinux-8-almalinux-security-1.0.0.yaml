  severity: High
- rule_id: ALMSEC-39
  rule_name: Monitor File Access with Audit
  rule_description: Configure Audit rules to track whether files or directories have
    been accessed, modified, or executed. Useful for detecting access to important
    files.
  category: System Auditing - Rules
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check file watch rules: auditctl -l | grep -E ''^-w'''
  remediation:
    remediation_step: 'Add file watch rules:

      - Monitor /etc/passwd: auditctl -w /etc/passwd -p wa -k passwd_changes

      - Monitor /etc/selinux: auditctl -w /etc/selinux/ -p wa -k selinux_changes

      - Monitor /etc/ssh/sshd_config: auditctl -w /etc/ssh/sshd_config -p warx -k
      sshd_config'
  tags:
  - rhel8
  - security
  - system-auditing---rules
  id: ALMSEC-39
  title: Monitor File Access with Audit
  description: Configure Audit rules to track whether files or directories have been
    accessed, modified, or executed. Useful for detecting access to important files.
  severity: High
- rule_id: ALMSEC-40
  rule_name: Monitor System Calls with Audit
  rule_description: Configure Audit to log specific system calls such as time-related
    changes, file deletions, and program executions for security monitoring.
  category: System Auditing - Rules
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check syscall rules: auditctl -l | grep -E ''^-a'''
  remediation:
    remediation_step: 'Add system call rules:

      - Time changes: auditctl -a always,exit -F arch=b64 -S adjtimex -S settimeofday
      -k time_change

      - File deletions: auditctl -a always,exit -S unlink -S unlinkat -S rename -S
      renameat -F auid>=1000 -F auid!=4294967295 -k delete

      - Program execution: auditctl -a always,exit -F exe=/bin/id -F arch=b64 -S execve
      -k execution_bin_id'
  tags:
  - rhel8
  - security
  - system-auditing---rules
  id: ALMSEC-40
  title: Monitor System Calls with Audit
  description: Configure Audit to log specific system calls such as time-related changes,
    file deletions, and program executions for security monitoring.
  severity: High
- rule_id: ALMSEC-41
  rule_name: Use Pre-configured Audit Rules for Compliance
  rule_description: Use pre-configured Audit rules files for compliance with standards
