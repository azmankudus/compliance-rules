- rule_id: ALMSEC-44
  rule_name: Install and Configure USBGuard
  rule_description: Install USBGuard framework to protect systems against intrusive
    USB devices. USBGuard uses authorization policies based on device attributes to
    allow or block USB devices.
  category: USB Device Protection - USBGuard
  testing_status: untested
  assessment:
    severity: Critical
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check if USBGuard is installed and running: rpm -q usbguard &&
      systemctl status usbguard'
  remediation:
    remediation_step: '1. Install USBGuard: yum install usbguard

      2. Generate initial policy: usbguard generate-policy > /etc/usbguard/rules.conf

      3. Enable and start: systemctl enable --now usbguard'
  tags:
  - rhel8
  - security
  - usb-device-protection---usbguard
