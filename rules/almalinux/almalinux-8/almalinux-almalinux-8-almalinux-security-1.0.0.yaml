- rule_id: ALMSEC-42
  rule_name: Monitor Software Updates with Audit
  rule_description: Configure Audit to monitor software installation utilities (dnf,
    yum, pip, npm, cpan, gem, luarocks) to track software changes on the system.
  category: System Auditing - Monitoring
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check installer rules: auditctl -l | grep software-installer'
  remediation:
    remediation_step: 'Copy pre-configured installer rules (AlmaLinux 8.6+):

      cp /usr/share/audit/sample-rules/44-installers.rules /etc/audit/rules.d/

      augenrules --load


      For earlier versions, create /etc/audit/rules.d/44-installers.rules with:

      -a always,exit -F perm=x -F path=/usr/bin/dnf-3 -F key=software-installer

      -a always,exit -F perm=x -F path=/usr/bin/yum -F key=software-installer'
  tags:
  - rhel8
  - security
