- rule_id: ALMSEC-48
  rule_name: Log USBGuard Events to Linux Audit
  rule_description: Configure USBGuard to log authorization events to the standard
    Linux Audit log instead of the default usbguard-audit.log file.
  category: USB Device Protection - USBGuard
  testing_status: untested
  assessment:
    severity: Medium
