- rule_id: ALMSEC-36
  rule_name: Configure auditd for Secure Environment
  rule_description: Configure the audit daemon (auditd) with secure settings for compliance
    requirements. Key settings include log file location, max file size, space thresholds,
    and actions for disk full/error conditions.
  category: System Auditing - Configuration
  testing_status: untested
  assessment:
    severity: Critical
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check auditd configuration: cat /etc/audit/auditd.conf'
  remediation:
    remediation_step: 'Edit /etc/audit/auditd.conf with secure settings:

      - max_log_file = <size_in_MB>

      - max_log_file_action = keep_logs

      - space_left = <MB_or_percentage>

      - space_left_action = email

      - admin_space_left_action = single

      - disk_full_action = halt

      - disk_error_action = syslog

      - flush = incremental_async

      - freq = 100'
  tags:
  - rhel8
