- rule_id: ALMSEC-49
  rule_name: Create Structured USBGuard Policy
  rule_description: Organize USBGuard policy in multiple .conf files within /etc/usbguard/rules.d/
    directory. The daemon combines files in alphabetical order, allowing modular policy
    management.
  category: USB Device Protection - USBGuard
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check rules.d directory: ls /etc/usbguard/rules.d/'
  remediation:
    remediation_step: '1. Create policy file: usbguard generate-policy --no-hashes
      > ./policy.conf

      2. Extract rules to separate files (e.g., 10keyboards.conf)

      3. Install: install -m 0600 -o root -g root <file>.conf /etc/usbguard/rules.d/

      4. Restart: systemctl restart usbguard'
