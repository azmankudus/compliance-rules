- rule_id: ALMSEC-47
  rule_name: Configure USBGuard IPC Access Control
  rule_description: Configure USBGuard to authorize specific users or groups to use
    the IPC interface. By default, only root can use this interface. Limit access
    to prevent unauthorized USB device manipulation.
  category: USB Device Protection - USBGuard
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check IPC configuration: grep -E ''IPCAllowed|IPCAccessControlFiles''
      /etc/usbguard/usbguard-daemon.conf'
  remediation:
    remediation_step: 'Edit /etc/usbguard/usbguard-daemon.conf:

      IPCAllowGroups=wheel

      Or use command: usbguard add-user <username> --devices ALL --policy modify,list
      --exceptions ALL

      Restart: systemctl restart usbguard'
