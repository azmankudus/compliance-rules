- rule_id: ALMSEC-28
  rule_name: Enable IMA and EVM Kernel Integrity Subsystem
  rule_description: Enable Integrity Measurement Architecture (IMA) and Extended Verification
    Module (EVM) to detect file tampering and restrict access based on policy. IMA
    maintains file content integrity; EVM protects file metadata.
  category: Kernel Integrity - IMA/EVM
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check if IMA/EVM is enabled: dmesg | grep -i -e EVM -e IMA'
  remediation:
    remediation_step: '1. Add kernel parameters: grubby --update-kernel=/boot/vmlinuz-$(uname
      -r) --args="ima_policy=appraise_tcb ima_appraise=fix evm=fix"

      2. Reboot

      3. Create kernel master key: keyctl add user kmk "$(dd if=/dev/urandom bs=1
      count=32 2>/dev/null)" @u

      4. Create EVM key: keyctl add encrypted evm-key "new user:kmk 64" @u

      5. Activate EVM: echo 1 > /sys/kernel/security/evm'
  tags:
  - rhel8
  - security
  - kernel-integrity---ima/evm
  id: ALMSEC-28
  title: Enable IMA and EVM Kernel Integrity Subsystem
  description: Enable Integrity Measurement Architecture (IMA) and Extended Verification
    Module (EVM) to detect file tampering and restrict access based on policy. IMA
    maintains file content integrity; EVM protects file metadata.
  severity: High
- rule_id: ALMSEC-29
  rule_name: Configure Trusted Keys with TPM
  rule_description: Configure trusted keys using Trusted Platform Module (TPM) chip.
    Trusted keys are sealed to specific TPM PCR values and can only be decrypted by
    the TPM on the system where they were encrypted.
  category: Kernel Integrity - Trusted Keys
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check TPM version: cat /sys/class/tpm/tpm0/tpm_version_major
      2>/dev/null'
  remediation:
    remediation_step: '1. For TPM 2.0, create persistent handle: tpm2_createprimary
      --key-algorithm=rsa2048 --key-context=key.ctxt && tpm2_evictcontrol -c key.ctxt
      0x81000001

      2. Create trusted key: keyctl add trusted kmk "new 32 keyhandle=0x81000001"
      @u

      3. Export key: keyctl pipe <key-serial> > kmk.blob'
  tags:
  - rhel8
  - security
  - kernel-integrity---trusted-keys
  id: ALMSEC-29
  title: Configure Trusted Keys with TPM
  description: Configure trusted keys using Trusted Platform Module (TPM) chip. Trusted
    keys are sealed to specific TPM PCR values and can only be decrypted by the TPM
    on the system where they were encrypted.
  severity: High
- rule_id: ALMSEC-30
  rule_name: Configure Encrypted Keys
  rule_description: Configure encrypted keys on systems without TPM. Encrypted keys
    use kernel AES encryption and are created using kernel-generated random numbers
    encrypted by a master key.
  category: Kernel Integrity - Encrypted Keys
  testing_status: untested
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Load encrypted-keys module if needed: modprobe encrypted-keys'
  remediation:
    remediation_step: '1. Generate user key: keyctl add user kmk-user "$(dd if=/dev/urandom
      bs=1 count=32 2>/dev/null)" @u

      2. Generate encrypted key: keyctl add encrypted encr-key "new user:kmk-user
      32" @u'
  tags:
  - rhel8
  - security
  - kernel-integrity---encrypted-keys
  id: ALMSEC-30
  title: Configure Encrypted Keys
  description: Configure encrypted keys on systems without TPM. Encrypted keys use
    kernel AES encryption and are created using kernel-generated random numbers encrypted
    by a master key.
  severity: Medium
- rule_id: ALMSEC-31
  rule_name: Encrypt Block Devices Using LUKS2
  rule_description: Encrypt block devices using LUKS2 format, which is the default
    in AlmaLinux 8. LUKS provides disk encryption with passphrase strengthening and
    multiple key slots.
  category: Disk Encryption - LUKS
  testing_status: untested
  assessment:
    severity: Critical
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check if device is LUKS encrypted: cryptsetup isLuks /dev/<device>
      && cryptsetup luksDump /dev/<device>'
  remediation:
    remediation_step: 'Encrypt blank device: cryptsetup luksFormat /dev/<device>

      Open encrypted device: cryptsetup open /dev/<device> <mapped_name>

      Create filesystem: mkfs -t xfs /dev/mapper/<mapped_name>'
  tags:
  - rhel8
  - security
  - disk-encryption---luks
  id: ALMSEC-31
  title: Encrypt Block Devices Using LUKS2
  description: Encrypt block devices using LUKS2 format, which is the default in AlmaLinux
    8. LUKS provides disk encryption with passphrase strengthening and multiple key
    slots.
  severity: Critical
- rule_id: ALMSEC-32
  rule_name: Encrypt Existing Data on Block Device with LUKS2
  rule_description: Encrypt existing data on a block device using LUKS2 online re-encryption.
    This allows encrypting data without losing existing content.
  category: Disk Encryption - LUKS
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check if device is already encrypted: cryptsetup isLuks /dev/<device>'
  remediation:
    remediation_step: '1. Unmount device: umount /dev/<device>

      2. Initialize encryption: cryptsetup reencrypt --encrypt --init-only --reduce-device-size
      32M /dev/<device> <mapped_name>

      3. Mount and add to /etc/crypttab and /etc/fstab

      4. Resume encryption: cryptsetup reencrypt --resume-only /dev/<device>'
  tags:
  - rhel8
  - security
  - disk-encryption---luks
  id: ALMSEC-32
  title: Encrypt Existing Data on Block Device with LUKS2
  description: Encrypt existing data on a block device using LUKS2 online re-encryption.
    This allows encrypting data without losing existing content.
  severity: High
- rule_id: ALMSEC-33
  rule_name: Use LUKS2 Detached Header for Enhanced Security
  rule_description: Encrypt block devices with LUKS2 using a detached header stored
    in a separate location. This provides an additional layer of security as the header
    is not stored on the device itself.
  category: Disk Encryption - LUKS
  testing_status: untested
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: 'Check if device uses detached header: cryptsetup luksDump <header_file>'
  remediation:
    remediation_step: 'Initialize with detached header: cryptsetup reencrypt --encrypt
      --init-only --header <header_path> /dev/<device> <mapped_name>

      Add to /etc/crypttab: <name> /dev/disk/by-id/<id> none header=<header_path>'
  tags:
  - rhel8
  - security
  - disk-encryption---luks
  id: ALMSEC-33
  title: Use LUKS2 Detached Header for Enhanced Security
  description: Encrypt block devices with LUKS2 using a detached header stored in
    a separate location. This provides an additional layer of security as the header
    is not stored on the device itself.
  severity: High
- rule_id: ALMSEC-34
