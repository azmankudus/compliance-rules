    reboot_required: true
    service_impact: May require policy adjustments
    estimated_time: 10 minutes
  tags:
  - selinux
  - enforcing
  - security
  - critical
  - level1-server
  id: CIS-1.6.1.4
  title: Ensure SELinux mode is enforcing or permissive
