rules:
- rule_id: CIS-1.1.1.1
  rule_name: Ensure mounting of cramfs filesystems is disabled
  rule_description: The cramfs filesystem type is a compressed read-only Linux filesystem
    embedded in small footprint systems. Disabling unnecessary filesystem types reduces
    the attack surface.
  category: Filesystem
  subcategory: Filesystem Types
  testing_status: verified
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: Verify cramfs kernel module is disabled
    check_command: modprobe -n -v cramfs | grep -E '(install /bin/true|not found)'
    expected_value: install /bin/true or not found
  remediation:
    remediation_step: 'Create or edit /etc/modprobe.d/cramfs.conf with: install cramfs
      /bin/true'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 1 minute
  tags:
  - filesystem
  - kernel-modules
  - hardening
  - level1-server
  id: CIS-1.1.1.1
  title: Ensure mounting of cramfs filesystems is disabled
  description: The cramfs filesystem type is a compressed read-only Linux filesystem
    embedded in small footprint systems. Disabling unnecessary filesystem types reduces
    the attack surface.
  severity: Medium
  rationale: Unused filesystem drivers increase attack surface and should be disabled.
  impact: Low - Reduces potential attack vectors
  false_positive_risk: Low
