- rule_id: CIS-1.2.2
  rule_name: Ensure GPG keys are configured
  rule_description: GPG keys are used to verify the authenticity of packages during
    installation.
  category: Package Management
  subcategory: GPG Configuration
  testing_status: verified
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: Verify Red Hat GPG keys are installed
    check_command: 'rpm -q gpg-pubkey --qf ''%{name}-%{version}-%{release} --> %{summary}

      '''
    expected_value: Red Hat GPG keys present
  remediation:
    remediation_step: 'Import Red Hat GPG keys: rpm --import /etc/pki/rpm-gpg/RPM-GPG-KEY-almalinux-release'
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 1 minute
  tags:
