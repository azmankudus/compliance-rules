- rule_id: CIS-1.6.1.2
  rule_name: Ensure SELinux is not disabled in bootloader configuration
  rule_description: SELinux should not be disabled via bootloader parameters.
  category: Security Modules
  subcategory: SELinux
  testing_status: verified
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: Verify SELinux is not disabled in GRUB
    check_command: grubby --info=ALL | grep -E 'selinux=0'
    expected_value: No output (selinux=0 should not be present)
  remediation:
    remediation_step: 'Remove selinux=0 from kernel parameters: grubby --update-kernel=ALL
      --remove-args=''selinux=0'''
    rollback_supported: true
    reboot_required: true
    service_impact: SELinux will be enabled after reboot
    estimated_time: 1 minute
  tags:
  - selinux
  - boot
  - security
  - critical
  - level1-server
  id: CIS-1.6.1.2
  title: Ensure SELinux is not disabled in bootloader configuration
  description: SELinux should not be disabled via bootloader parameters.
  severity: High
  rationale: Disabling SELinux at boot removes a critical security control.
  impact: Critical - SELinux bypassed entirely
  false_positive_risk: None
- rule_id: CIS-1.6.1.3
