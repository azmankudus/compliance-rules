- rule_id: CIS-1.1.2.1
  rule_name: Ensure /tmp is configured
  rule_description: The /tmp directory is a world-writable directory used for temporary
    files. It should be configured as a separate filesystem with appropriate mount
    options.
  category: Filesystem
  subcategory: Partitioning
  testing_status: verified
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: Verify /tmp is a separate mount point
    check_command: mount | grep ' /tmp '
    expected_value: /tmp on /tmp type tmpfs or separate partition
  remediation:
    remediation_step: Configure /tmp as tmpfs or separate partition in /etc/fstab
      with nodev,nosuid,noexec options
    rollback_supported: false
    reboot_required: true
    service_impact: Requires filesystem reconfiguration
    estimated_time: 30 minutes
  tags:
  - filesystem
  - partitioning
  - tmp
  - level1-server
  id: CIS-1.1.2.1
  title: Ensure /tmp is configured
  description: The /tmp directory is a world-writable directory used for temporary
    files. It should be configured as a separate filesystem with appropriate mount
    options.
  severity: Medium
  rationale: Separate /tmp prevents resource exhaustion and allows restrictive mount
    options.
  impact: Medium - Improves security and stability
  false_positive_risk: None
- rule_id: CIS-1.1.2.2
  rule_name: Ensure nodev option set on /tmp partition
  rule_description: The nodev mount option specifies that the filesystem cannot contain
    special device files.
  category: Filesystem
  subcategory: Mount Options
  testing_status: verified
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: Verify nodev option on /tmp
    check_command: mount | grep ' /tmp ' | grep nodev
    expected_value: /tmp with nodev option
  remediation:
    remediation_step: Add nodev option to /tmp in /etc/fstab
    rollback_supported: true
    reboot_required: false
    service_impact: None
    estimated_time: 1 minute
  tags:
  - filesystem
  - mount-options
  - tmp
  - nodev
  - level1-server
  id: CIS-1.1.2.2
  title: Ensure nodev option set on /tmp partition
  description: The nodev mount option specifies that the filesystem cannot contain
    special device files.
  severity: Medium
  rationale: Prevents creation of device files in /tmp which could be used for attacks.
  impact: Medium - Prevents device-based attacks
  false_positive_risk: None
