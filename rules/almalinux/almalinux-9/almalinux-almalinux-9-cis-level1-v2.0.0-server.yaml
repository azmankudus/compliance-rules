- rule_id: CIS-1.3.1
  rule_name: Ensure AIDE is installed
  rule_description: Advanced Intrusion Detection Environment (AIDE) provides file
    integrity checking.
  category: File Integrity
  subcategory: AIDE
  testing_status: verified
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: Verify AIDE package is installed
    check_command: rpm -q aide
    expected_value: aide-<version>
  remediation:
    remediation_step: 'Install AIDE: dnf install aide && aide --init && mv /var/lib/aide/aide.db.new.gz
      /var/lib/aide/aide.db.gz'
    rollback_supported: true
    reboot_required: false
    service_impact: Initial database creation may take time
    estimated_time: 15 minutes
  tags:
  - file-integrity
  - aide
  - intrusion-detection
  - level1-server
  id: CIS-1.3.1
  title: Ensure AIDE is installed
  description: Advanced Intrusion Detection Environment (AIDE) provides file integrity
    checking.
  severity: Medium
  rationale: File integrity monitoring detects unauthorized file changes.
  impact: High - Essential for intrusion detection
  false_positive_risk: Low
- rule_id: CIS-1.4.1
  rule_name: Ensure bootloader password is set
  rule_description: Setting the bootloader password protects against unauthorized
    changes to boot parameters.
  category: Boot Configuration
  subcategory: GRUB Security
  testing_status: verified
  assessment:
    severity: High
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: Verify GRUB password is configured
    check_command: grep -E 'password_pbkdf2|GRUB2_PASSWORD' /boot/grub2/grub.cfg /etc/grub.d/01_users
      2>/dev/null
    expected_value: Password entry should be present
  remediation:
    remediation_step: 'Set GRUB password: grub2-setpassword && grub2-mkconfig -o /boot/grub2/grub.cfg'
    rollback_supported: true
    reboot_required: false
    service_impact: None until reboot
    estimated_time: 5 minutes
  tags:
  - boot
  - grub
  - password
  - security
  - level1-server
  id: CIS-1.4.1
  title: Ensure bootloader password is set
  description: Setting the bootloader password protects against unauthorized changes
    to boot parameters.
  severity: High
  rationale: Bootloader password prevents unauthorized modification of boot parameters.
  impact: High - Critical for physical security
  false_positive_risk: None
- rule_id: CIS-1.5.1
  rule_name: Ensure core dumps are restricted
  rule_description: Core dumps can contain sensitive information and should be restricted.
  category: System Configuration
  subcategory: Core Dumps
  testing_status: verified
  assessment:
    severity: Medium
    is_auto: true
    automation_level: Full
    audit_type: config
    detection_step: Verify core dump restrictions
    check_command: grep -E '^\*\s+hard\s+core' /etc/security/limits.conf /etc/security/limits.d/*
    expected_value: '* hard core 0'
  remediation:
    remediation_step: 'Add to /etc/security/limits.conf: * hard core 0'
    rollback_supported: true
    reboot_required: false
    service_impact: Core dumps disabled for new sessions
    estimated_time: 1 minute
  tags:
  - system
  - core-dumps
  - security
  - level1-server
  id: CIS-1.5.1
  title: Ensure core dumps are restricted
  description: Core dumps can contain sensitive information and should be restricted.
  severity: Medium
  rationale: Core dumps may contain sensitive memory data and consume disk space.
  impact: Medium - Prevents information disclosure
  false_positive_risk: None
